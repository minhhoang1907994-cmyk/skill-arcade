      q1_n4_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_node5
        explanation: 'Chính xác: Phân tích query plan giúp xác định truy vấn thiếu
          index hay bị lock.'
      q1_n4_o2:
        points: 0
        minutes_cost: 8
        next_node: q1_node4
        explanation: 'Sai: Kill connection dồn dập khiến ứng dụng báo lỗi đứt kết
          nối cho người dùng.'
      q1_n4_o3:
        points: 5
        minutes_cost: 10
        next_node: q1_node4
        explanation: 'Tốn thời gian: Tạo Replica cần thời gian sync dữ liệu, không
          cứu được sự cố tức thì.'
      q1_n5_o1:
        points: 10
        minutes_cost: 2
        next_node: q1_node6
        explanation: 'Tuyệt vời: CONCURRENTLY giúp tạo index mà không khóa (lock)
          bảng promotions.'
      q1_n5_o2:
        points: 0
        minutes_cost: 10
        next_node: q1_node5
        explanation: 'Nguy hiểm: Dùng CREATE INDEX thường trên bảng lớn trong Flash
          Sale sẽ lock bảng hoàn toàn.'
      q1_n5_o3:
        points: 0
        minutes_cost: 15
        next_node: q1_node5
        explanation: 'Rất sai: Xóa dữ liệu trực tiếp khi chưa rõ ảnh hưởng có thể
          gây mất mát dữ liệu nghiêm trọng.'
      q1_n6_o1:
        points: 10
        minutes_cost: 2
        next_node: q1_node7
        explanation: 'Chính xác: Rate Limit và Circuit Breaker giúp bảo vệ ứng dụng
          khỏi nguy cơ sập dây chuyền.'
      q1_n6_o2:
        points: 5
        minutes_cost: 3
        next_node: q1_node6
        explanation: 'Ít hiệu quả: Tắt log chỉ giảm một chút I/O, không giải quyết
          được lượng request quá tải.'
      q1_n6_o3:
        points: 0
        minutes_cost: 5
        next_node: q1_node6
        explanation: 'Sai: Chặn nhầm người dùng hợp lệ.'
      q1_n7_o1:
        points: 10
        minutes_cost: 2
        next_node: q1_node8_rec
        explanation: 'Chuẩn xác: Mở lại traffic theo từng nấc giúp đảm bảo hệ thống
          chịu tải an toàn.'
      q1_n7_o2:
        points: 0
        minutes_cost: 5
        next_node: q1_node7
        explanation: 'Rủi ro: Mở lại 100% traffic ngay lập tức có thể gây sập lại
          do hiệu ứng sóng dâng.'
      q1_n7_o3:
        points: 0
        minutes_cost: 5
        next_node: q1_node7
        explanation: 'Rủi ro: Vẫn đang trong giờ cao điểm, scale down vội vã sẽ làm
          quá tải các pod còn lại.'
      q1_n8_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_node8_rec
        explanation: 'Hoàn hảo: Đội ngũ rút kinh nghiệm bài học sâu sắc và phòng ngừa
          sự cố tái diễn.'
      q1_n8_o2:
        points: 5
        minutes_cost: 2
        next_node: q1_node8_rec
        explanation: 'Chưa đủ: Không làm Post-mortem tử tế sẽ dễ lặp lại lỗi tương
          tự trong tương lai.'
