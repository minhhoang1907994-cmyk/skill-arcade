        explanation: Tăng replica giúp gánh bớt tải ngắn hạn nhưng tất cả Pod vẫn
          sẽ lần lượt sập vì Memory Leak.
      opt_m3_1:
        points: 10
        minutes_cost: 1
        next_node: m4
        explanation: Xác định lý do gửi tin thất bại từ dịch vụ bên ngoài giúp hiểu
          ngọn nguồn hành vi nhồi retry.
      opt_m3_2:
        points: 0
        minutes_cost: 3
        next_node: m4
        explanation: Xóa retry làm giảm chất lượng dịch vụ khi tin nhắn bị thất bại
          do gián đoạn mạng tạm thời.
      opt_m3_3:
        points: 5
        minutes_cost: 2
        next_node: m4
        explanation: Gọi System.gc() không giải phóng được các đối tượng vẫn đang
          bị tham chiếu cứng trong queue tĩnh.
      opt_m4_1:
        points: 10
        minutes_cost: 2
        next_node: m5
        explanation: Dùng Bounded Queue hạn chế RAM tối đa và Exponential Backoff
          giảm áp lực lên FCM.
      opt_m4_2:
        points: 5
        minutes_cost: 4
        next_node: m5
        explanation: Liên hệ nhà cung cấp tốn thời gian và không giải quyết việc ứng
          dụng thiếu cơ chế tự bảo vệ khi bị rate limit.
      opt_m4_3:
        points: 0
        minutes_cost: 3
        next_node: m5
        explanation: Hủy toàn bộ request làm mất trải nghiệm người dùng.
      opt_m5_1:
        points: 10
        minutes_cost: 2
        next_node: m6
        explanation: Stress test giúp khẳng định cơ chế Bounded Queue hoạt động đúng
          và ngắt tải an toàn (backpressure).
      opt_m5_2:
        points: 0
        minutes_cost: 3
        next_node: m6
        explanation: Bỏ qua khâu test rủi ro gây sập hệ thống nghiêm trọng hơn.
      opt_m5_3:
        points: 5
        minutes_cost: 2
        next_node: m6
        explanation: Test trên Prod không có kiểm soát có thể ảnh hưởng đến người
          dùng thật.
      opt_m6_1:
        points: 10
        minutes_cost: 1
        next_node: m7
        explanation: Rolling Update giúp cập nhật phiên bản mới mà không làm gián
          đoạn việc nhận thông báo.
      opt_m6_2:
        points: 0
        minutes_cost: 4
        next_node: m7
        explanation: Xóa hết Pod cũ gây downtime tuyệt đối dịch vụ notification.
      opt_m6_3:
        points: 5
        minutes_cost: 3
        next_node: m7
        explanation: Triển khai không giới hạn tốc độ đẩy làm tăng nguy cơ bị chặn
          bởi bên thứ ba.
      opt_m7_1:
        points: 10
        minutes_cost: 1
        next_node: m8
        explanation: Giám sát Heap Memory và status code FCM đảm bảo lỗi leak không
          còn tái diễn.
      opt_m7_2:
        points: 0
        minutes_cost: 3
        next_node: m8
        explanation: Giảm Pod trong lúc Flash Sale gây quá tải CPU trên Pod duy nhất
          còn lại.
      opt_m7_3:
        points: 5
        minutes_cost: 4
        next_node: m8
        explanation: Restart định kỳ là cách làm kém chuyên nghiệp, gây ngắt kết nối
          không cần thiết.
      opt_m8_1:
        points: 10
        minutes_cost: 1
        next_node: m_recovered
        explanation: Hoàn tất báo cáo Post-mortem giúp chia sẻ bài học kinh nghiệm
          về quản lý bộ nhớ và rate limiting.
      opt_m8_2:
        points: 5
        minutes_cost: 2
        next_node: m_recovered
        explanation: Không làm Post-mortem sẽ bỏ lỡ cơ hội cải thiện quy trình phát
