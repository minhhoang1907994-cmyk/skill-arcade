      - key: opt_m7_3
        label: Tạo CronJob định kỳ restart Pods mỗi 15 phút.
    - key: m8
      prompt: 'Bước 8: Chỉ số RAM ổn định ở 35%, thông báo gửi đi thành công với tốc
        độ kiểm soát. Bước kết thúc?'
      options:
      - key: opt_m8_1
        label: Viết báo cáo Post-mortem ghi nhận nguyên nhân Unbounded Queue và nghiệm
          thu sự cố.
      - key: opt_m8_2
        label: Bỏ qua báo cáo Post-mortem và đóng ticket.
      - key: opt_m8_3
        label: Revert lại bản code cũ trước khi xảy ra sự cố.
    - key: m_recovered
      prompt: Sự cố Memory Leak và OOMKilled trên dịch vụ Notification đã được giải
