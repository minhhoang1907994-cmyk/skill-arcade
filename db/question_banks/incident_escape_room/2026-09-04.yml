- content:
    scenario: Hệ thống thanh toán của trang thương mại điện tử đột ngột bị nghẽn trong
      giờ cao điểm Flash Sale. Người dùng báo lỗi 504 Gateway Timeout liên tục khi
      bấm đặt hàng.
    initial_logs: 'HTTP/1.1 504 Gateway Timeout | upstream timed out (110: Connection
      timed out) while reading response header from upstream | client: 10.244.2.15,
      server: api.shop.vn, request: POST /api/v1/checkout | HikariPool-1 - Connection
      is not available, request timed out after 30000ms.'
    nodes:
    - key: q1_n1
      prompt: 'Bước 1: Khách hàng gặp lỗi 504 khi thanh toán. Bạn làm gì đầu tiên
        để khoanh vùng sự cố?'
      options:
      - key: q1_o1_1
        label: Kiểm tra Grafana dashboard để xem latency và error rate của dịch vụ
          checkout-service.
      - key: q1_o1_2
        label: Khởi động lại ngay toàn bộ Ingress Nginx Controller.
      - key: q1_o1_3
        label: Tăng gấp đôi CPU và RAM cho Nginx Gateway.
    - key: q1_n2
      prompt: 'Bước 2: Grafana hiển thị checkout-service có latency p99 vọt lên 30
        giây. Bạn kiểm tra tiếp thông tin gì?'
      options:
      - key: q2_o2_1
        label: Xem log ứng dụng checkout-service và chỉ số APM trên Datadog.
      - key: q2_o2_2
        label: Tải log từ ứng dụng di động của khách hàng về phân tích.
      - key: q2_o2_3
        label: Xóa toàn bộ cache Redis của ứng dụng.
    - key: q1_n3
      prompt: 'Bước 3: Log ghi nhận tràn ngập lỗi ''HikariPool-1 - Connection is not
        available''. Bạn chọn cách xử lý nào?'
      options:
      - key: q1_o3_1
        label: Tăng ngay maximumPoolSize của HikariCP từ 20 lên 200 trong file config.
      - key: q1_o3_2
        label: Kiểm tra danh sách active connections và slow queries trực tiếp trong
          PostgreSQL.
      - key: q1_o3_3
        label: Restart tất cả pod của checkout-service.
    - key: q1_n4
      prompt: 'Bước 4: PostgreSQL có 100 kết nối đều bận chạy câu lệnh: SELECT * FROM
        orders WHERE user_id = ? AND status = ''PENDING''. Bạn sẽ làm gì?'
      options:
      - key: q1_o4_1
        label: Chạy EXPLAIN ANALYZE cho câu truy vấn trên để kiểm tra execution plan.
      - key: q1_o4_2
        label: Thực hiện lệnh VACUUM FULL trên bảng orders.
      - key: q1_o4_3
        label: Tắt tính năng kiểm tra đơn hàng PENDING trên giao diện.
    - key: q1_n5
      prompt: 'Bước 5: EXPLAIN ANALYZE báo ''Seq Scan on orders'' mất 4.5s do thiếu
        Index ở cột user_id và status. Bạn xử lý thế nào?'
      options:
      - key: q1_o5_1
        label: 'Tạo Index thường: CREATE INDEX idx_orders_user_status ON orders(user_id,
          status);'
      - key: q1_o5_2
        label: 'Tạo Index không khóa bảng: CREATE INDEX CONCURRENTLY idx_orders_user_status
          ON orders(user_id, status);'
      - key: q1_o5_3
        label: Xóa bớt dữ liệu cũ trong bảng orders để giảm dung lượng.
    - key: q1_n6
      prompt: 'Bước 6: Index đang được tạo CONCURRENTLY nhưng các query cũ đang bị
        kẹt vẫn chiếm giữ pool. Bước tiếp theo là gì?'
      options:
      - key: q1_o6_1
        label: Dùng pg_terminate_backend để hủy các connection đang chạy câu SELECT
          chậm bị treo.
      - key: q1_o6_2
        label: Reboot lại máy chủ PostgreSQL Master.
      - key: q1_o6_3
        label: Kiên nhẫn chờ đợi các query tự hoàn thành.
    - key: q1_n7
      prompt: 'Bước 7: Các query kẹt đã bị hủy, index tạo xong thành công. Kết nối
        DB trở lại bình thường. Bạn xác nhận gì tiếp theo?'
      options:
      - key: q1_o7_1
        label: Kiểm tra lại latency checkout-service và tỷ lệ lỗi 504 trên Gateway.
      - key: q1_o7_2
        label: Giảm bớt 50% số lượng Pod checkout-service.
      - key: q1_o7_3
        label: Xóa bớt log cũ trên server ứng dụng.
    - key: q1_n8_rec
      prompt: 'Bước 8: Latency hạ về 120ms, tỷ lệ lỗi 504 bằng 0. Hệ thống đã khôi
        phục thành công. Bước cuối cùng của bạn?'
      options:
      - key: q1_o8_1
        label: Ghi nhận nguyên nhân, bổ sung migration index vào repository codebase
          và hoàn tất báo cáo Post-mortem.
      - key: q1_o8_2
        label: Đóng ticket sự cố và không cần ghi lại thông tin.
  answer_key:
    option_effects:
      q1_o1_1:
        points: 10
        minutes_cost: 1
        next_node: q1_n2
        explanation: Chính xác. Giúp xác định đúng dịch vụ đích đang bị chậm.
      q1_o1_2:
