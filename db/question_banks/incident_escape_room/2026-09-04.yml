- content:
    scenario: Hệ thống Thanh toán (Checkout Service) của sàn e-commerce bất ngờ gặp
      lỗi hàng loạt. Khách hàng bấm 'Thanh toán' nhận lỗi 500. Tỷ lệ giao dịch thành
      công giảm từ 99% xuống còn 12%.
    initial_logs: 'ERROR 2023-10-24 10:15:02 [checkout-service] [http-nio-8080-exec-12]
      c.e.checkout.OrderController: HikariPool-1 - Connection is not available, request
      timed out after 30000ms. active=50/50, idle=0, waiting=128'
    nodes:
    - key: n1
      prompt: 'Bước 1: Cảnh báo 500 liên tục đổ về hệ thống theo dõi. Bạn quyết định
        thực hiện hành động nào đầu tiên?'
      options:
      - key: opt_n1_1
        label: Kiểm tra dashboard APM/Grafana để theo dõi số liệu connection pool
          và latencies.
      - key: opt_n1_2
        label: Khởi động lại toàn bộ Pods của Checkout Service ngay lập tức.
      - key: opt_n1_3
        label: Rollback phiên bản ứng dụng về bản chạy hôm qua.
    - key: n2
      prompt: 'Bước 2: Grafana hiển thị HikariPool luôn chạm ngưỡng max 50 connections.
        Bạn kiểm tra gì tiếp theo trên Database PostgreSQL?'
      options:
      - key: opt_n2_1
        label: Truy vấn view pg_stat_activity để xem trạng thái các kết nối đang mở.
      - key: opt_n2_2
        label: Tăng max_connections của PostgreSQL từ 200 lên 1000.
      - key: opt_n2_3
        label: Xóa toàn bộ cache Redis của ứng dụng.
    - key: n3
      prompt: 'Bước 3: pg_stat_activity cho thấy hàng chục connection ở trạng thái
        ''idle in transaction'' liên quan đến bảng order_items. Hành động tiếp theo?'
      options:
      - key: opt_n3_1
        label: Soi diff code của bản release gần nhất liên quan đến xử lý order_items.
      - key: opt_n3_2
        label: Chạy lệnh pg_terminate_backend để kill toàn bộ kết nối idle.
      - key: opt_n3_3
        label: Tăng số lượng replica của Checkout Service gấp đôi.
    - key: n4
      prompt: 'Bước 4: Bạn phát hiện hàm updateInventory() mới merge thiếu annotation
        @Transactional và không đóng DB session khi gặp exception. Cách xử lý triệt
        để?'
      options:
      - key: opt_n4_1
        label: Tạo hotfix thêm try-with-resources/@Transactional và chuẩn bị deployment.
      - key: opt_n4_2
        label: Khởi động lại máy chủ Database chính.
      - key: opt_n4_3
        label: Cấu hình CronJob chạy mỗi phút để kill connection idle.
    - key: n5
      prompt: 'Bước 5: Bản hotfix đã sẵn sàng trên Git. Bạn đưa bản sửa lỗi này qua
        đâu để kiểm thử?'
      options:
      - key: opt_n5_1
        label: Deploy lên môi trường Staging và chạy suite test tự động cho luồng
          Checkout.
      - key: opt_n5_2
        label: Merge thẳng vào branch production/main và deploy ngay không qua test.
      - key: opt_n5_3
        label: Kiểm thử thủ công trang danh sách sản phẩm trên máy cá nhân.
    - key: n6
      prompt: 'Bước 6: Staging test thành công. Bạn bắt đầu triển khai hotfix lên
        Production như thế nào?'
      options:
      - key: opt_n6_1
        label: Thực hiện Canary Deployment đẩy 10% traffic sang Pod mới.
      - key: opt_n6_2
        label: Thay thế đồng loạt 100% Pods cùng lúc mà không drain connection.
      - key: opt_n6_3
        label: Scale số lượng Pod xuống 0 rồi scale trở lại.
    - key: n7
      prompt: 'Bước 7: Pod Canary hoạt động ổn định, connection pool ở Pod mới chỉ
        dùng 10%. Bước tiếp theo?'
      options:
      - key: opt_n7_1
        label: Chuyển dần 100% traffic sang phiên bản mới và theo dõi chỉ số.
      - key: opt_n7_2
        label: Giữ nguyên Canary 10% trong 5 tiếng để quan sát tiếp.
      - key: opt_n7_3
        label: Chạy lại lệnh kill connection thủ công trên Database.
    - key: n8
      prompt: 'Bước 8: Toàn bộ Pod đã cập nhật bản hotfix. Traffic đã khôi phục 100%.
        Bước cuối cùng để kết thúc sự cố?'
      options:
      - key: opt_n8_1
        label: Xác nhận chỉ số lỗi về 0, latency bình thường và đánh giá sự cố đã
          giải quyết.
      - key: opt_n8_2
        label: Đóng ticket sự cố ngay lập tức mà không cần theo dõi thêm.
      - key: opt_n8_3
        label: Tắt hoàn toàn tính năng connection pooling trên ứng dụng.
    - key: n_recovered
      prompt: Sự cố Connection Leak đã được khắc phục hoàn toàn. Hệ thống thanh toán
        hoạt động ổn định trở lại.
      options: []
