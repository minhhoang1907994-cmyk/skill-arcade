      q1_n3_o2:
        points: 0
        minutes_cost: 10
        next_node: q1_node3
        explanation: 'Sai: Reboot DB lúc này làm gián đoạn toàn bộ dịch vụ khác.'
      q1_n3_o3:
        points: 5
        minutes_cost: 5
        next_node: q1_node3
        explanation: 'Chưa đúng: Tăng max_connections mà không giải quyết query chậm
