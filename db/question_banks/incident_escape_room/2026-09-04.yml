  difficulty: hard
- content:
    scenario: Dịch vụ gửi email thông báo (notification-worker) trên Kubernetes cluster
      liên tục bị restart do OOMKilled. Hàng đợi email trong RabbitMQ đang tích tụ
      hơn 50,000 tin nhắn chưa xử lý.
    initial_logs: 'k8s_event: Pod notification-worker-7d9b4f-x2912 status changed
      to OOMKilled (Exit Code 137) | last_log: [INFO] Processing batch attachments
      for email_id: 89401 | Memory usage: 512Mi/512Mi (100%).'
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: Pod notification-worker liên tục dính OOMKilled. Hành động
        đầu tiên của bạn là gì?'
      options:
      - key: q2_o1_1
        label: Kiểm tra biểu đồ RAM usage và log Pod trước thời điểm crash.
      - key: q2_o1_2
        label: Sửa deployment file tăng ngay memory limit lên 8GiB.
      - key: q2_o1_3
        label: Restart lại toàn bộ Kubernetes cluster.
    - key: q2_n2
      prompt: 'Bước 2: RAM tăng liên tục dạng răng cưa cho đến khi chạm mốc limit
        rồi bị kill. RabbitMQ tích tụ 50,000 msgs. Bạn kiểm tra tiếp?'
      options:
      - key: q2_o2_1
        label: Purge xóa sạch 50,000 tin nhắn trong RabbitMQ queue.
      - key: q2_o2_2
        label: Xem lịch sử các commit/PR mới được deploy gần đây trong repository
          notification-worker.
      - key: q2_o2_3
        label: Scale out số lượng pod lên 20 pod.
    - key: q2_n3
      prompt: 'Bước 3: Phát hiện bản release v2.4.1 vừa deploy 1 giờ trước có PR #305
        xử lý file PDF đính kèm. Bạn làm gì tiếp theo?'
      options:
      - key: q2_o3_1
        label: 'Kiểm tra mã nguồn chi tiết của PR #305.'
      - key: q2_o3_2
        label: Tắt tính năng gửi PDF trong database config.
      - key: q2_o3_3
        label: SSH vào Pod đang chạy và sửa trực tiếp mã nguồn.
    - key: q2_n4
      prompt: 'Bước 4: PR #305 có mã global.sentPdfBuffers.push(pdfBuffer) làm bộ
        nhớ tăng liên tục mà không giải phóng. Bạn đưa ra quyết định gì?'
      options:
      - key: q2_o4_1
        label: Rollback ngay deployment về phiên bản ổn định v2.4.0.
      - key: q2_o4_2
        label: Viết hotfix loại bỏ biến global, tạo PR mới và chờ CI/CD build.
      - key: q2_o4_3
        label: Bỏ hẳn giới hạn RAM limits.memory trong Kubernetes.
    - key: q2_n5
      prompt: 'Bước 5: Lệnh Rollback về v2.4.0 đã được thực thi. Bạn làm gì để đảm
        bảo quá trình khôi phục diễn ra an toàn?'
      options:
      - key: q2_o5_1
        label: Giám sát quá trình Rolling Update và xác nhận Pod v2.4.0 đã chuyển
          sang trạng thái Running.
      - key: q2_o5_2
        label: Xóa bớt worker pod để giảm tải DB.
      - key: q2_o5_3
        label: Ngắt kết nối tới RabbitMQ broker.
    - key: q2_n6
      prompt: 'Bước 6: Pod v2.4.0 đã chạy ổn định nhưng lượng queue đọng 48,000 msgs
        khiến CPU tăng lên 90%. Làm sao để giải tỏa nhanh?'
      options:
      - key: q2_o6_1
        label: Tạm thời Scale out số lượng replica từ 2 lên 10 pods để tăng tốc độ
          tiêu thụ tin nhắn.
      - key: q2_o6_2
        label: Xóa bớt queue chưa xử lý.
      - key: q2_o6_3
        label: Restart lại RabbitMQ cluster.
    - key: q2_n7
      prompt: 'Bước 7: Hàng đợi RabbitMQ giảm về 0 tin nhắn chỉ sau 5 phút. Tài nguyên
        CPU/RAM đã bình ổn. Bạn xử lý bước kế tiếp?'
      options:
      - key: q2_o7_1
        label: Scale down số lượng Pod về mức mặc định 2 replicas.
      - key: q2_o7_2
        label: Duy trì 10 replicas vĩnh viễn.
      - key: q2_o7_3
        label: Kill toàn bộ Pod để khởi động lại từ đầu.
    - key: q2_n8_rec
      prompt: 'Bước 8: Hệ thống gửi email đã hoạt động bình thường, không mất dữ liệu.
        Việc cuối cùng bạn cần thực hiện?'
      options:
      - key: q2_o8_1
        label: Tạo issue sửa triệt để Memory Leak, bổ sung Unit Test và Leak Test
          trước khi merge lại v2.4.2.
      - key: q2_o8_2
        label: Đóng ticket sự cố mà không cần tạo issue theo dõi.
  answer_key:
    option_effects:
      q2_o1_1:
        points: 10
        minutes_cost: 1
        next_node: q2_n2
        explanation: Đúng. Phân tích log/metric là bước chuẩn đoán đầu tiên.
      q2_o1_2:
        points: 5
        minutes_cost: 4
        next_node: q2_n1
        explanation: Chỉ trì hoãn việc crash nếu ứng dụng dính Memory Leak thực sự.
      q2_o1_3:
        points: 0
        minutes_cost: 10
        next_node: q2_n1
        explanation: Sai nghiêm trọng. Tự dưng reboot cluster làm sập toàn bộ dịch
          vụ khác.
      q2_o2_1:
        points: 0
        minutes_cost: 5
        next_node: q2_n2
        explanation: Sai. Xóa queue gây mất mát email thông báo quan trọng của khách
          hàng.
      q2_o2_2:
        points: 10
        minutes_cost: 1
        next_node: q2_n3
        explanation: Chính xác. Sự cố xảy ra sau release thường do thay đổi mã nguồn
          mới.
      q2_o2_3:
        points: 5
        minutes_cost: 3
        next_node: q2_n2
        explanation: Thêm pod khi có memory leak chỉ khiến nhiều pod cùng sập nhanh
          hơn.
      q2_o3_1:
        points: 10
        minutes_cost: 2
        next_node: q2_n4
