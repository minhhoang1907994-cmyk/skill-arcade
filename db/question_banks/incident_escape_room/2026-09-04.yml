      sc2_opt_7_3:
        points: 5
        minutes_cost: 5
        next_node: sc2_node_8
        explanation: Thụ động chờ phản ánh làm giảm trải nghiệm người dùng.
      sc2_opt_8_1:
        points: 10
        minutes_cost: 1
        next_node: sc2_node_rec
        explanation: Chủ động chặn lỗi từ khâu linter và giám sát sớm giúp ngăn chặn
