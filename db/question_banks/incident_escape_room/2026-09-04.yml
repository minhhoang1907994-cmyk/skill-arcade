  difficulty: hard
- content:
    scenario: Hệ thống Payment Gateway báo lỗi HTTP 504 Gateway Timeout hàng loạt
      cho khách hàng sau khi triển khai phiên bản v2.4.0 vào lúc 10:00 AM.
    initial_logs: |-
      [ERROR] 2023-10-25 10:05:12.123 [hikari-pool-1] Timeout waiting for connection from pool (Timeout 30000ms). Active: 50, Idle: 0, Waiting: 120.
      [WARN] 2023-10-25 10:05:15.001 [http-nio-8080-exec-42] Thread stuck executing query: SELECT * FROM orders WHERE status = 'PENDING' AND created_at >= '2023-10-25 00:00:00'
    nodes:
    - key: sc1_node_1
      prompt: Hệ thống liên tục bị cạn kiệt Connection Pool (HikariCP). Bạn làm gì
        đầu tiên để chẩn đoán nguyên nhân gốc?
      options:
      - key: sc1_opt_1_1
        label: Tăng max_pool_size từ 50 lên 200 ngay lập tức trên config server.
      - key: sc1_opt_1_2
        label: Kiểm tra danh sách slow query đang chạy trực tiếp trên database node.
      - key: sc1_opt_1_3
        label: Restart toàn bộ các instance Backend API để giải phóng connection.
    - key: sc1_node_2
      prompt: Kết quả cho thấy query 'SELECT * FROM orders WHERE status = ...' tốn
        hơn 12s do thiếu Index trên bảng orders (hơn 10 triệu bản ghi). Bạn khắc phục
        thế nào?
      options:
      - key: sc1_opt_2_1
        label: Chạy lệnh 'CREATE INDEX idx_orders_status_created ON orders(status,
          created_at)' trực tiếp.
      - key: sc1_opt_2_2
        label: Chạy lệnh đánh index dạng Online DDL / CONCURRENTLY để tránh lock bảng
          orders.
      - key: sc1_opt_2_3
        label: Xóa bớt dữ liệu cũ trong bảng orders để query chạy nhanh hơn.
    - key: sc1_node_3
      prompt: Index đã tạo thành công, thời gian chạy query giảm từ 12s xuống 10ms.
        Tuy nhiên HikariCP vẫn chưa nhả hoàn toàn connection do worker thread bị kẹt
        từ trước. Bạn làm gì?
      options:
      - key: sc1_opt_3_1
        label: Thực hiện Graceful Rolling Restart từng instance API backend.
      - key: sc1_opt_3_2
        label: Dùng kill -9 cắt đột ngột tất cả process Java backend cùng lúc.
      - key: sc1_opt_3_3
        label: Không làm gì cả, chờ 30 phút để connection tự timeout.
    - key: sc1_node_4
      prompt: API đã phản hồi nhanh trở lại (<100ms). Tuy nhiên, Notification Service
        bắt đầu báo lỗi hàng nghìn message bị nghẽn trong RabbitMQ queue.
      options:
      - key: sc1_opt_4_1
        label: Kiểm tra Consumer status và Consumer Lag metric của RabbitMQ.
      - key: sc1_opt_4_2
        label: Thực hiện Purge (xóa sạch) queue để xóa nghẽn.
      - key: sc1_opt_4_3
        label: Tăng thêm 16GB RAM cho RabbitMQ broker server.
    - key: sc1_node_5
      prompt: Consumer lag tăng cao vì worker bị unhandled exception khi parse field
        'discount_amount' mới thêm ở v2.4.0. Bạn làm gì với các message lỗi?
      options:
      - key: sc1_opt_5_1
        label: Cấu hình đẩy các message lỗi vào Dead Letter Queue (DLQ) để thông luồng
          chính.
      - key: sc1_opt_5_2
        label: Sửa code hotfix ngay trên môi trường local rồi push thẳng bản build
          lên Production mà không qua CI.
      - key: sc1_opt_5_3
        label: Tạm dừng (Stop) toàn bộ Consumer service.
    - key: sc1_node_6
      prompt: Message luồng chính đã thông suốt. Nhưng ghi nhận một số đơn hàng bị
        trừ tiền trùng (duplicate charge) do client retry trong lúc bị timeout trước
        đó.
      options:
      - key: sc1_opt_6_1
        label: Bật tính năng Idempotency Key check ở API Gateway cho các endpoint
          thanh toán.
      - key: sc1_opt_6_2
        label: Chạy script SQL xóa trực tiếp các giao dịch trùng trong DB.
      - key: sc1_opt_6_3
        label: Gửi email thông báo sự cố cho toàn bộ khách hàng trên hệ thống.
    - key: sc1_node_7
      prompt: Cần xử lý hoàn tiền (Refund) cho các giao dịch bị trừ tiền trùng lặp
        một cách an toàn.
      options:
      - key: sc1_opt_7_1
        label: Xuất danh sách duplicate transaction IDs và chạy script hoàn tiền tự
          động có log đối soát qua Payment Gateway API.
      - key: sc1_opt_7_2
        label: Thực hiện bấm hoàn tiền thủ công từng đơn trên giao diện Admin Dashboard.
      - key: sc1_opt_7_3
        label: Bỏ qua các giao dịch bị trùng có giá trị dưới 10,000 VND.
    - key: sc1_node_8
      prompt: Toàn bộ giao dịch lỗi đã được đối soát và hoàn tiền. Hệ thống vận hành
        ổn định. Bước cuối cùng cần làm là gì?
      options:
      - key: sc1_opt_8_1
        label: Viết tài liệu Post-mortem, cập nhật alert rules về connection pool
          và tổ chức họp rút kinh nghiệm.
      - key: sc1_opt_8_2
        label: Đóng ticket sự cố và chuyển sang làm task tiếp theo.
      - key: sc1_opt_8_3
        label: Xóa toàn bộ file log sự cố để tiết kiệm dung lượng đĩa cứng.
    - key: sc1_node_rec
      prompt: Sự cố đã được khắc phục hoàn toàn thành công!
      options: []
  answer_key:
    option_effects:
      sc1_opt_1_1:
        points: 5
        minutes_cost: 3
        next_node: sc1_node_2
        explanation: Tăng pool size chỉ kéo dài thời gian trước khi hết connection
          nếu query vẫn quá chậm.
      sc1_opt_1_2:
        points: 10
        minutes_cost: 1
        next_node: sc1_node_2
        explanation: Chẩn đoán chính xác nguyên nhân khiến connection bị giữ lâu là
          do slow query.
      sc1_opt_1_3:
        points: 0
        minutes_cost: 5
        next_node: sc1_node_2
        explanation: Restart dịch vụ mà chưa sửa gốc rễ sẽ khiến pool bị đầy lại ngay
          lập tức.
      sc1_opt_2_1:
        points: 5
        minutes_cost: 4
        next_node: sc1_node_3
        explanation: Tạo index thông thường trên bảng lớn gây lock bảng, khiến các
          ghi nhận giao dịch mới bị gián đoạn.
      sc1_opt_2_2:
        points: 10
        minutes_cost: 2
        next_node: sc1_node_3
        explanation: Tạo index không lock bảng là chuẩn mực khi thao tác trên DB Production
          lớn.
      sc1_opt_2_3:
        points: 0
        minutes_cost: 6
        next_node: sc1_node_3
        explanation: Tự ý xóa dữ liệu production khi chưa đối soát là vi phạm nghiêm
          trọng an toàn dữ liệu.
      sc1_opt_3_1:
        points: 10
        minutes_cost: 1
        next_node: sc1_node_4
        explanation: Graceful restart từng instance giúp ngắt các connection hỏng
          mà không gây rớt request mới.
      sc1_opt_3_2:
        points: 0
        minutes_cost: 4
        next_node: sc1_node_4
        explanation: Kill process đột ngột làm dở dang các giao dịch đang xử lý thành
          công dở chừng.
      sc1_opt_3_3:
        points: 5
        minutes_cost: 8
        next_node: sc1_node_4
        explanation: Chờ đợi khiến thời gian gián đoạn kéo dài không cần thiết.
      sc1_opt_4_1:
        points: 10
        minutes_cost: 1
        next_node: sc1_node_5
        explanation: Đánh giá đúng trạng thái consumer và lượng message tồn đọng để
          xử lý nghẽn.
      sc1_opt_4_2:
        points: 0
        minutes_cost: 5
        next_node: sc1_node_5
        explanation: Purge queue khiến mất mát thông báo gửi cho khách hàng.
      sc1_opt_4_3:
        points: 5
        minutes_cost: 4
        next_node: sc1_node_5
        explanation: Nghẽn do logic consumer chứ không phải do thiếu RAM server.
      sc1_opt_5_1:
        points: 10
        minutes_cost: 1
        next_node: sc1_node_6
        explanation: Đẩy message lỗi vào DLQ giúp luồng chính tiêu thụ hết các message
          hợp lệ khác mà không mất dữ liệu lỗi.
      sc1_opt_5_2:
        points: 0
        minutes_cost: 6
        next_node: sc1_node_6
        explanation: Bỏ qua quy trình CI/CD dễ dẫn đến lỗi mới nghiêm trọng hơn.
      sc1_opt_5_3:
        points: 5
        minutes_cost: 3
        next_node: sc1_node_6
        explanation: Tạm dừng consumer khiến lag ngày càng tăng lên.
      sc1_opt_6_1:
        points: 10
        minutes_cost: 2
        next_node: sc1_node_7
        explanation: Idempotency key chặn triệt để việc retry tạo ra nhiều giao dịch
          trùng.
      sc1_opt_6_2:
        points: 0
        minutes_cost: 5
        next_node: sc1_node_7
        explanation: Xóa record trong DB không làm tiền quay về tài khoản khách và
          hỏng tính toàn vẹn dữ liệu.
      sc1_opt_6_3:
        points: 5
        minutes_cost: 3
        next_node: sc1_node_7
        explanation: Gửi email toàn bộ user khi chưa khoanh vùng sự cố dễ gây hoang
          mang dư luận.
      sc1_opt_7_1:
        points: 10
        minutes_cost: 2
        next_node: sc1_node_8
        explanation: Xử lý tự động có đối soát đảm bảo chính xác, nhanh chóng và minh
          bạch.
      sc1_opt_7_2:
        points: 5
        minutes_cost: 7
        next_node: sc1_node_8
        explanation: Bấm thủ công tốn rất nhiều thời gian và dễ nhầm lẫn do thao tác
          con người.
      sc1_opt_7_3:
        points: 0
        minutes_cost: 4
        next_node: sc1_node_8
        explanation: Không được bỏ qua bất kỳ khoản dư nợ hay tính sai tiền nào của
          khách hàng.
      sc1_opt_8_1:
        points: 10
        minutes_cost: 1
        next_node: sc1_node_rec
        explanation: Post-mortem giúp hệ thống phòng tránh các lỗi tương tự trong
          tương lai.
      sc1_opt_8_2:
        points: 5
        minutes_cost: 2
        next_node: sc1_node_rec
        explanation: Bỏ qua bước post-mortem làm mất cơ hội cải tiến quy trình.
      sc1_opt_8_3:
        points: 0
        minutes_cost: 5
        next_node: sc1_node_rec
        explanation: Xóa log vi phạm chính sách audit và kiểm toán an toàn thông tin.
    recovery_node: sc1_node_rec
  difficulty: medium
- content:
    scenario: Dịch vụ Checkout Microservice chạy trên Kubernetes liên tục bị OOMKilled
      (Out Of Memory) theo chu kỳ mỗi 15 phút, gây gián đoạn luồng đặt hàng.
    initial_logs: |-
      [K8s Event] Pod checkout-service-7f89d-4x2z OOMKilled (Exit Code 137). Memory usage exceeded limit 512Mi. Restart count: 14.
      [NODE JS] High memory usage warning: External: 45MB, RSS: 508MB, HeapUsed: 420MB
    nodes:
    - key: sc2_node_1
      prompt: Pod liên tục crash do vượt ngưỡng Memory Limit 512Mi. Bạn bắt đầu chẩn
        đoán sự cố như thế nào?
      options:
      - key: sc2_opt_1_1
        label: Tăng Memory Limit trên Kubernetes Deployment từ 512Mi lên 4Gi.
      - key: sc2_opt_1_2
        label: Thực hiện lấy Heap Dump / Heap Snapshot của Node.js process trước khi
          Pod bị OOMKilled.
      - key: sc2_opt_1_3
        label: Rollback phiên bản Deployment về bản phát hành từ 1 tháng trước.
    - key: sc2_node_2
      prompt: Phân tích Heap Snapshot cho thấy có hàng triệu instance của EventEmitter
        và Closure Object không được giải phóng. Bạn điều tra tiếp ra sao?
      options:
      - key: sc2_opt_2_1
        label: Rà soát lại code vừa thay đổi trong các Pull Request mới nhất liên
          quan đến Event / Global Listener.
      - key: sc2_opt_2_2
        label: Thêm đoạn code gọi thủ công `global.gc()` mỗi phút trong ứng dụng Node.js.
      - key: sc2_opt_2_3
        label: Khởi động lại Cluster Redis Cache.
    - key: sc2_node_3
      prompt: Phát hiện module 'UserContext' đăng ký event 'eventEmitter.on('user_login')'
        trong mỗi HTTP request nhưng không bao giờ gọi 'removeListener'. Bạn sửa mã
        nguồn thế nào?
      options:
      - key: sc2_opt_3_1
        label: Sửa code chuyển sang dùng `.once()` hoặc dọn dẹp listener trong khối
          `finally` của request lifecycle.
      - key: sc2_opt_3_2
        label: Tăng giới hạn listener bằng `eventEmitter.setMaxListeners(1000000)`.
      - key: sc2_opt_3_3
        label: Thay thế hoàn toàn EventEmitter bằng việc gọi HTTP Webhook.
    - key: sc2_node_4
      prompt: Đã tạo bản sửa lỗi khẩn cấp (Hotfix). Bạn chọn chiến lược triển khai
        (Deploy) nào để đảm bảo an toàn cho Kubernetes Cluster?
      options:
      - key: sc2_opt_4_1
        label: Triển khai dạng Canary Release với 10% traffic để kiểm tra biến động
          RAM của Pod mới.
      - key: sc2_opt_4_2
        label: Cập nhật 100% Replicas cùng một lúc để xử lý triệt để nhanh nhất.
      - key: sc2_opt_4_3
        label: SSH trực tiếp vào Container đang chạy để sửa file JS đã compile.
    - key: sc2_node_5
      prompt: Bản Canary chạy 10 phút có Memory phẳng ở mức 120Mi. Sau khi rollout
        100%, OOM hết hoàn toàn. Tuy nhiên, Nginx Ingress Gateway xuất hiện lắt dắt
        lỗi HTTP 502.
      options:
      - key: sc2_opt_5_1
        label: Kiểm tra sự lệch cấu hình Keep-Alive Timeout giữa Nginx Ingress và
          Node.js server.
      - key: sc2_opt_5_2
        label: Tăng số lượng Nginx Ingress Controller Replicas lên gấp đôi.
      - key: sc2_opt_5_3
        label: Bật Web Application Firewall (WAF) để chặn IP người dùng.
    - key: sc2_node_6
      prompt: Đúng như dự đoán, Node.js `keepAliveTimeout` mặc định (5s) nhỏ hơn `keepalive_timeout`
        của Nginx (60s). Bạn xử lý thế nào?
      options:
      - key: sc2_opt_6_1
        label: Cấu hình `keepAliveTimeout` của Node.js server lên 65s (lớn hơn Nginx)
          và `headersTimeout` > `keepAliveTimeout`.
      - key: sc2_opt_6_2
        label: Tắt hẳn tính năng HTTP Keep-Alive trên Nginx Ingress Controller.
      - key: sc2_opt_6_3
        label: Thay thế Nginx Ingress bằng HAProxy Controller.
    - key: sc2_node_7
      prompt: Lỗi 502 đã hoàn toàn biến mất. Giờ đây bạn cần kiểm tra tác động đến
        các đơn hàng bị gián đoạn trong giai đoạn Pod bị OOMKilled liên tục.
      options:
      - key: sc2_opt_7_1
        label: Quét các đơn hàng ở trạng thái 'PROCESSING' quá 15 phút và kích hoạt
          worker đối soát trạng thái với Payment Service.
      - key: sc2_opt_7_2
        label: Chuyển tất cả đơn 'PROCESSING' thành 'FAILED' để khách hàng đặt lại.
      - key: sc2_opt_7_3
        label: Chờ phản ánh từ khách hàng qua bộ phận Customer Support mới xử lý.
    - key: sc2_node_8
      prompt: Toàn bộ đơn hàng dở dang đã được phục hồi. Bạn thiết lập giải pháp lâu
        dài nào để ngăn ngừa Memory Leak tương tự?
      options:
      - key: sc2_opt_8_1
        label: Bổ sung ESLint rule cấm unhandled event listener và cài đặt Prometheus
          Alerting khi Heap Usage > 80% liên tục 5 phút.
      - key: sc2_opt_8_2
        label: Giảm bớt Memory Limit của K8s Pod xuống 256Mi để giảm chi phí.
      - key: sc2_opt_8_3
        label: Tự động kích hoạt script restart Pod 2 tiếng một lần bằng CronJob.
    - key: sc2_node_rec
      prompt: Sự cố Memory Leak và Gateway Error đã được khắc phục hoàn toàn!
      options: []
  answer_key:
    option_effects:
      sc2_opt_1_1:
        points: 5
        minutes_cost: 3
        next_node: sc2_node_2
        explanation: Tăng RAM chỉ hoãn thời điểm crash chứ không sửa được bản chất
          Memory Leak.
      sc2_opt_1_2:
        points: 10
        minutes_cost: 1
        next_node: sc2_node_2
        explanation: Heap Snapshot cho biết chính xác đối tượng nào đang chiếm giữ
          bộ nhớ mà không được giải phóng.
      sc2_opt_1_3:
        points: 0
        minutes_cost: 5
        next_node: sc2_node_2
        explanation: Rollback quá xa làm mất nhiều tính năng kinh doanh mới mà chưa
          rõ nguyên nhân.
      sc2_opt_2_1:
        points: 10
        minutes_cost: 1
        next_node: sc2_node_3
        explanation: Khoanh vùng code thay đổi gần nhất giúp phát hiện nơi rò rỉ listener
          nhanh nhất.
      sc2_opt_2_2:
        points: 0
        minutes_cost: 4
        next_node: sc2_node_3
        explanation: Gọi GC thủ công gây giật lag (stop-the-world) và không thể giải
          phóng các object còn reference.
      sc2_opt_2_3:
        points: 5
        minutes_cost: 3
        next_node: sc2_node_3
        explanation: Memory leak nằm ở Heap RAM local của Node.js process, không liên
          quan Redis.
      sc2_opt_3_1:
        points: 10
        minutes_cost: 2
        next_node: sc2_node_4
        explanation: Đảm bảo hủy listener sau khi dùng xong giải quyết triệt để vấn
          đề rò rỉ bộ nhớ.
      sc2_opt_3_2:
        points: 5
        minutes_cost: 2
        next_node: sc2_node_4
        explanation: Chỉ làm tắt cảnh báo MaxListenersExceeded Warning chứ không giải
          quyết rò rỉ RAM.
      sc2_opt_3_3:
        points: 0
        minutes_cost: 6
        next_node: sc2_node_4
        explanation: Phức tạp hóa kiến trúc vô lý cho một lỗi lập trình cơ bản.
      sc2_opt_4_1:
        points: 10
        minutes_cost: 2
        next_node: sc2_node_5
        explanation: Canary Release giúp theo dõi metric Heap RAM thực tế trước khi
          áp dụng toàn bộ.
      sc2_opt_4_2:
        points: 5
        minutes_cost: 3
        next_node: sc2_node_5
        explanation: Deploy 100% rủi ro cao nếu hotfix chưa triệt để.
      sc2_opt_4_3:
        points: 0
        minutes_cost: 5
        next_node: sc2_node_5
        explanation: Sửa trực tiếp trong container vi phạm nguyên tắc Immutable Infrastructure.
      sc2_opt_5_1:
        points: 10
        minutes_cost: 1
        next_node: sc2_node_6
        explanation: Lỗi 502 lắt dắt khi pod bình thường thường do lệch Keep-Alive
          timeout giữa Gateway và Upstream.
      sc2_opt_5_2:
        points: 5
        minutes_cost: 3
        next_node: sc2_node_6
        explanation: Lỗi do cấu hình timeout kết nối, tăng scale Ingress không khắc
          phục được.
      sc2_opt_5_3:
        points: 0
        minutes_cost: 4
        next_node: sc2_node_6
        explanation: Chặn sai IP người dùng thật trong khi hệ thống đang lỗi nội bộ.
      sc2_opt_6_1:
        points: 10
        minutes_cost: 1
        next_node: sc2_node_7
        explanation: Đảm bảo Node.js không chủ động ngắt socket trước Nginx giúp loại
          bỏ hoàn toàn lỗi 502 Bad Gateway.
      sc2_opt_6_2:
        points: 5
        minutes_cost: 4
        next_node: sc2_node_7
        explanation: Tắt Keep-Alive bắt buộc tạo lại TCP/TLS handshake cho mỗi request,
          làm giảm hiệu năng.
      sc2_opt_6_3:
        points: 0
        minutes_cost: 7
        next_node: sc2_node_7
        explanation: Thay đổi Gateway tốn thời gian và không xử lý đúng nguyên nhân
          gốc.
      sc2_opt_7_1:
        points: 10
        minutes_cost: 2
        next_node: sc2_node_8
        explanation: Chủ động đối soát khôi phục trạng thái đơn hàng đảm bảo quyền
          lợi khách hàng.
      sc2_opt_7_2:
        points: 0
        minutes_cost: 4
        next_node: sc2_node_8
        explanation: Đánh dấu thất bại các đơn đã thu tiền thành công sẽ gây khiếu
