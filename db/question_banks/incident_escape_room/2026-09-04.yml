- content:
    scenario: Dịch vụ Payment microservice chạy trên Kubernetes liên tục bị restart
      do CrashLoopBackOff. Khách hàng nhận lỗi thanh toán thất bại ngắt quãng. Cảnh
      báo Prometheus gửi về thông báo container bị OOMKilled.
    initial_logs: |-
      NAME                              READY   STATUS             RESTARTS   AGE
      payment-service-789456123-ab12    0/1     CrashLoopBackOff   5          12m

      [Events]:
      Type     Reason     Age                  From               Message
      Warning  OOMKilled  2m (x5 over 12m)     kubelet            System OOM encounter, process 18321 (payment-service) killed, exit code 137.
    nodes:
    - key: q2_node1
      prompt: 'Bước 1: Pod payment-service liên tục bị Kubelet kill với exit code
        137 (OOMKilled). Hành động đầu tiên của bạn là gì?'
      options:
      - key: q2_n1_o1
        label: Kiểm tra kubectl describe pod payment-service để xác nhận Memory Requests/Limits.
      - key: q2_n1_o2
        label: SSH vào Worker Node chạy Docker daemon để xem file cgroup.
      - key: q2_n1_o3
        label: Reboot toàn bộ Master Node của Kubernetes cluster.
    - key: q2_node2
      prompt: 'Bước 2: ''describe pod'' xác nhận Memory Limit hiện tại là 512Mi. Pod
        vừa khởi động đạt ~500Mi RAM là bị kill. Bạn làm gì tiếp theo?'
      options:
      - key: q2_n2_o1
        label: Xem biểu đồ Memory Usage trên Grafana để xác định tốc độ tăng trưởng
          RAM theo thời gian.
      - key: q2_n2_o2
        label: Scale down Deployment về 0 rồi scale up lại ngay.
      - key: q2_n2_o3
        label: Tăng dung lượng Persistent Volume PVC gắn với Pod.
    - key: q2_node3
      prompt: 'Bước 3: Biểu đồ Grafana chỉ ra RAM tăng vọt tuyến tính dốc đứng ngay
        khi có request thanh toán gửi tới. Bạn điều tra ứng dụng ra sao?'
      options:
      - key: q2_n3_o1
        label: Kiểm tra log ứng dụng trước thời điểm bị kill và xem lịch sử các bản
          Deployment gần nhất.
      - key: q2_n3_o2
        label: Xóa hết cache Nginx Ingress Controller.
      - key: q2_n3_o3
        label: Tăng replica set từ 2 lên 10 pod để giảm tải.
    - key: q2_node4
      prompt: 'Bước 4: Bạn phát hiện team vừa deploy phiên bản v2.4.0 cách đây 30
        phút. Phân tích log thu được lộ ra sự cố leak buffer khi kết nối Redis cache
        client. Bạn hành động thế nào?'
      options:
      - key: q2_n4_o1
        label: So sánh commit giữa release v2.4.0 và v2.3.1 để tìm nguyên nhân chính
          xác của Memory Leak.
      - key: q2_n4_o2
        label: Tăng ngay Memory Limit của Deployment từ 512Mi lên 8GiB để tạm ngưng
          OOM.
      - key: q2_n4_o3
        label: Chạy lệnh kubectl delete configmap payment-config.
    - key: q2_node5
      prompt: 'Bước 5: Code v2.4.0 thêm một event listener lắng nghe Redis Pub/Sub
        nhưng không unsubscribe khi request kết thúc, gây tích tụ byte buffer. Trong
        lúc khẩn cấp để khôi phục dịch vụ, bạn chọn phương án nào?'
      options:
      - key: q2_n5_o1
        label: Thực hiện Rollback ngay lập tức về phiên bản v2.3.1 ổn định trước đó.
      - key: q2_n5_o2
        label: Chờ lập trình viên viết xong code hotfix và chờ build lại Docker image
          v2.4.1.
      - key: q2_n5_o3
        label: Restart server Redis Cluster.
    - key: q2_node6
      prompt: 'Bước 6: Bạn quyết định Rollback Deployment. Lệnh chuẩn xác nhất để
        đưa Deployment về bản v2.3.1 trên Kubernetes là gì?'
      options:
      - key: q2_n6_o1
        label: kubectl rollout undo deployment/payment-service
      - key: q2_n6_o2
        label: kubectl delete deployment payment-service
      - key: q2_n6_o3
        label: kubectl edit deployment payment-service và xóa thuộc tính image
    - key: q2_node7
      prompt: 'Bước 7: Lệnh rollout undo đã được gửi. Bạn giám sát quá trình rollback
