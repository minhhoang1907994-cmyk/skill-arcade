      q1_o6_3:
        points: 5
        minutes_cost: 5
        next_node: q1_n7
        explanation: Làm kéo dài thời gian sự cố vô ích.
      q1_o7_1:
        points: 10
        minutes_cost: 1
        next_node: q1_n8_rec
        explanation: Đúng. Kiểm tra metric để xác nhận hệ thống thực sự ổn định.
      q1_o7_2:
