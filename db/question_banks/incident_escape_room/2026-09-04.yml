  difficulty: medium
- content:
    scenario: 'Mất kết nối Microservices: Hệ thống thanh toán trong Kubernetes Cluster
      rơi vào CrashLoopBackOff hàng loạt do lỗi DNS Resolution và hết hạn TLS Certificate.'
    initial_logs: |-
      [ERROR] dial tcp: lookup auth-service.default.svc.cluster.local on 10.96.0.10:53: i/o timeout
      [FATAL] Failed to connect to Payment DB: context deadline exceeded
    nodes:
    - key: q2_node1
      prompt: 'Bước 1: Hệ thống trả về 504 Gateway Timeout liên tục. Bước điều tra
        đầu tiên của bạn là gì trong Kubernetes Cluster?'
      options:
      - key: q2_n1_o1
        label: Kiểm tra trạng thái Pods và logs của CoreDNS bằng kubectl get pods
          -n kube-system.
      - key: q2_n1_o2
        label: Reboot tất cả Worker Nodes trong K8s Cluster.
      - key: q2_n1_o3
        label: Tăng proxy-read-timeout trên Ingress Controller lên 300 giây.
    - key: q2_node2
      prompt: 'Bước 2: Phát hiện CoreDNS Pods đang ở trạng thái CrashLoopBackOff.
        Log cho thấy CNI Plugin (Calico) không cấp được IP.'
      options:
      - key: q2_n2_o1
        label: Kiểm tra log của Calico Node DaemonSet và tình trạng IPAM pool.
      - key: q2_n2_o2
        label: Xóa (delete) trực tiếp toàn bộ CoreDNS pods để K8s tự re-create.
      - key: q2_n2_o3
        label: Đổi cấu hình DNS trong ứng dụng sang 8.8.8.8.
    - key: q2_node3
      prompt: 'Bước 3: Calico log báo lỗi ''IPAM pool exhausted'' - dải IP nội bộ
        cho Pods đã bị cạn kiệt do leak từ các CronJob cũ.'
      options:
      - key: q2_n3_o1
        label: Dùng calicoctl IPAM release để dọn dẹp các IP mồ côi và mở rộng IP
          pool.
      - key: q2_n3_o2
        label: Dựng một Kubernetes Cluster mới hoàn toàn để chuyển workload sang.
      - key: q2_n3_o3
        label: Xóa toàn bộ Namespace 'default' để giải phóng bộ nhớ.
    - key: q2_node4
      prompt: 'Bước 4: CNI đã cấp lại IP, CoreDNS đã Running. Tuy nhiên Payment Service
        Pods vẫn crash với lỗi ''x509: certificate has expired''.'
      options:
      - key: q2_n4_o1
        label: Kiểm tra thời hạn TLS Certificate trong Secrets và trạng thái Cert-Manager.
      - key: q2_n4_o2
        label: 'Cấu hình ứng dụng bỏ qua kiểm tra TLS (InsecureSkipVerify: true).'
      - key: q2_n4_o3
        label: Scale down Payment Service về 0 rồi scale up lại.
    - key: q2_node5
      prompt: 'Bước 5: Xác nhận TLS Certificate cho Payment DB đã hết hạn từ 00:00
        UTC. Làm sao để cấp lại Cert nhanh nhất?'
      options:
      - key: q2_n5_o1
        label: Trigger Cert-Manager renew certificate và reload lại TLS Secret cho
          Postgres Server.
      - key: q2_n5_o2
        label: Chỉnh lùi ngày giờ trên OS của Database Node lại 1 ngày.
      - key: q2_n5_o3
        label: Tạo một Self-Signed Certificate mới bằng openssl và paste thủ công
          vào code.
    - key: q2_node6
      prompt: 'Bước 6: Cert đã renew thành công nhưng Payment Pods vẫn báo lỗi kết
        nối do bị lưu cache TLS Session cũ (stale connection).'
      options:
      - key: q2_n6_o1
        label: Thực hiện Rolling Restart toàn bộ Deployment của Payment Service.
      - key: q2_n6_o2
        label: Tăng max_connections trên PostgreSQL.
      - key: q2_n6_o3
        label: Xóa bớt Pod logs cũ để giải phóng ổ đĩa.
    - key: q2_node7
      prompt: 'Bước 7: Payment Service đã kết nối thành công, latency về 40ms. Bạn
        cần kiểm tra gì trước khi đóng sự cố?'
      options:
      - key: q2_n7_o1
        label: Kiểm tra Error Rate trên Grafana và bật lại tính năng Auto-Renew Certificate
          trong Cert-Manager.
      - key: q2_n7_o2
        label: Tắt dịch vụ Prometheus/Grafana để đỡ tốn CPU.
      - key: q2_n7_o3
        label: Bỏ qua việc cập nhật tài liệu cấu hình IPAM.
    - key: q2_node8_rec
      prompt: 'Bước 8 (Khôi phục thành công): Luồng thanh toán hoàn toàn bình thường.
        Bài học lớn nhất rút ra từ sự cố này là gì?'
      options:
      - key: q2_n8_o1
        label: Cần giám sát thời hạn TLS Cert (Alerting) và cấu hình dọn dẹp IPAM
          định kỳ cho CNI.
      - key: q2_n8_o2
        label: Không cần làm gì thêm vì hệ thống đã tự chạy lại.
  answer_key:
    option_effects:
      q2_n1_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_node2
        explanation: 'Chuẩn xác: Lỗi i/o timeout DNS chứng tỏ hạ tầng DNS của Cluster
          đang gặp vấn đề.'
      q2_n1_o2:
        points: 0
        minutes_cost: 15
        next_node: q2_node1
        explanation: 'Rất sai: Reboot cả cluster làm ngưng trệ toàn bộ hệ thống mà
          không rõ nguyên nhân.'
      q2_n1_o3:
        points: 5
        minutes_cost: 5
        next_node: q2_node1
        explanation: 'Không ăn thua: Tăng timeout không giúp giải quyết việc không
          phân giải được tên miền.'
      q2_n2_o1:
        points: 10
