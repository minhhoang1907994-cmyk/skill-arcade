- content:
    scenario: Dịch vụ Notification (Gửi thông báo đẩy qua mobile) liên tục gặp sự
      cố nghẽn bộ nhớ. Pod bị Kubernetes restart liên tục vì lỗi OOMKilled trong chiến
      dịch Flash Sale.
    initial_logs: 'FATAL 2023-10-24 20:01:10 [notification-worker] java.lang.OutOfMemoryError:
      Java heap space. K8s Event: Pod notification-worker-7d9f8b-x2z9 terminated with
      OOMKilled (Exit Code 137). Memory usage: 2048Mi / 2048Mi'
    nodes:
    - key: m1
      prompt: 'Bước 1: Pod bị OOMKilled liên tục trong lúc phát chiến dịch push cho
        2 triệu user. Bạn sẽ kiểm tra thông tin gì đầu tiên?'
      options:
      - key: opt_m1_1
        label: Tạo Heap Dump hoặc kiểm tra thông số bộ nhớ JVM/K8s metrics của dịch
          vụ.
      - key: opt_m1_2
        label: Sửa K8s Manifest tăng Memory Limit từ 2GB lên 8GB lập tức.
      - key: opt_m1_3
        label: Recreate lại toàn bộ Kubernetes Cluster.
    - key: m2
      prompt: 'Bước 2: Heap dump cho thấy hàng triệu object NotificationPayload chiếm
        85% Heap Space mà không được GC thu hồi. Bạn làm gì tiếp theo?'
      options:
      - key: opt_m2_1
        label: Phân tích GC log và Thread Dump để tìm lý do đối tượng bị giữ tham
          chiếu (retained).
      - key: opt_m2_2
        label: Purge xóa sạch toàn bộ tin nhắn trong hàng đợi RabbitMQ.
      - key: opt_m2_3
        label: Tăng số lượng Pod replica từ 3 lên 10 Pods.
    - key: m3
      prompt: 'Bước 3: Thread Dump chỉ ra một ConcurrentLinkedQueue tĩnh lưu tin nhắn
        chờ retry khi gửi thất bại đang phình to vô hạn. Bạn sẽ điều tra nguyên nhân
        thất bại?'
      options:
      - key: opt_m3_1
        label: Kiểm tra log phản hồi từ FCM/APNS (dịch vụ push bên thứ ba).
      - key: opt_m3_2
        label: Xóa bỏ tính năng retry trong ứng dụng.
      - key: opt_m3_3
        label: Gọi endpoint System.gc() bằng tay để giải phóng RAM.
    - key: m4
      prompt: 'Bước 4: Log cho thấy FCM trả về HTTP 429 Too Many Requests. Do không
        giới hạn queue retry, tin nhắn thất bại bị nhồi liên tục vào RAM. Giải pháp
        xử lý triệt để?'
      options:
      - key: opt_m4_1
        label: 'Chỉnh sửa code: Đổi sang Bounded Queue có giới hạn kích thước và áp
          dụng Exponential Backoff.'
      - key: opt_m4_2
        label: Yêu cầu bên FCM nâng rate limit tài khoản ngay lập tức.
      - key: opt_m4_3
        label: Drop bỏ toàn bộ các request gửi push mới.
    - key: m5
      prompt: 'Bước 5: Bản vá code đã được chuẩn bị. Làm sao để đảm bảo bản sửa lỗi
        không gây tràn bộ nhớ dưới tải lớn nữa?'
      options:
      - key: opt_m5_1
        label: Review code và chạy thử nghiệm Stress Test với cơ chế Backpressure
          trên môi trường Staging.
      - key: opt_m5_2
        label: Commit trực tiếp mã nguồn mới lên branch production.
      - key: opt_m5_3
        label: Deploy thử 1 Pod trên Production mà không test áp lực.
    - key: m6
      prompt: 'Bước 6: Kết quả kiểm thử Staging cho thấy RAM duy trì ổn định ở mức
        40%. Bước triển khai lên Production?'
      options:
      - key: opt_m6_1
        label: Thực hiện Rolling Update triển khai dần dần phiên bản mới.
      - key: opt_m6_2
        label: Xóa toàn bộ Pod cũ rồi mới khởi tạo Pod mới.
      - key: opt_m6_3
        label: Deploy bản mới vào thời điểm đỉnh điểm mà không bật Rate Limiter.
    - key: m7
      prompt: 'Bước 7: Các Pod mới đã khởi chạy thành công. Bạn giám sát các thông
        số nào trong 5 phút tiếp theo?'
      options:
