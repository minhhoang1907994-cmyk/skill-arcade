      opt_m8_3:
        points: 0
        minutes_cost: 5
        next_node: m_recovered
        explanation: Revert lại code cũ sẽ mang lỗi Memory Leak quay trở lại.
    recovery_node: m_recovered
  difficulty: hard
- content:
    scenario: 'Sự cố Flash Sale: Hệ thống bán hàng bị sập tính năng Checkout do Redis
      quá tải bộ nhớ và kéo theo nghẽn Connection Pool ở Database PostgreSQL.'
    initial_logs: |-
      [ERROR] Redis OOM command not allowed when used memory > 'maxmemory'
      [WARN] ConnectionPoolExhaustedException: Timeout waiting for idle connection from PostgresPool
    nodes:
    - key: q1_node1
      prompt: 'Bước 1: Hệ thống ghi nhận hàng loạt lỗi HTTP 500 khi người dùng bấm
        thanh toán. Bạn làm gì đầu tiên?'
      options:
      - key: q1_n1_o1
        label: Kiểm tra chỉ số CPU/Memory của Redis cluster và Postgres database trên
          Grafana.
      - key: q1_n1_o2
        label: Restart ngay lập tức toàn bộ các Checkout Service Pods.
      - key: q1_n1_o3
        label: Scale gấp đôi số lượng Checkout Service Pods.
    - key: q1_node2
      prompt: 'Bước 2: Redis báo bộ nhớ đạt 100% (8GB/8GB) với eviction policy là
        ''noeviction''. Việc ghi cache thất bại hoàn toàn.'
      options:
      - key: q1_n2_o1
        label: Chuyển tạm eviction policy sang 'allkeys-lru' và nâng maxmemory lên
          16GB.
      - key: q2_n2_o2_q1
        label: Chạy lệnh FLUSHALL trên Redis để xóa sạch toàn bộ cache.
      - key: q1_n2_o3
        label: Tắt luôn Redis service để Checkout Service đọc trực tiếp từ Database.
    - key: q1_node3
      prompt: 'Bước 3: Redis đã nới rộng bộ nhớ, nhưng Database PostgreSQL lập tức
        bị đẩy CPU lên 99% do Cache Stampede (hàng nghìn request đọc trùng dữ liệu
        hết hạn cùng lúc).'
      options:
      - key: q1_n3_o1
        label: Bật cơ chế Singleflight (Mutex locking) ở tầng ứng dụng để chỉ cho
          phép 1 request rebuild cache.
      - key: q1_n3_o2
        label: Reboot lại máy chủ Database PostgreSQL.
      - key: q1_n3_o3
        label: Tăng max_connections của PostgreSQL từ 200 lên 2000.
    - key: q1_node4
      prompt: 'Bước 4: Cache Stampede giảm, nhưng Database vẫn nghẽn do có truy vấn
        truy xuất bảng promotions chạy rất chậm (> 4 giây).'
      options:
      - key: q1_n4_o1
        label: Kiểm tra pg_stat_activity và chạy EXPLAIN ANALYZE cho câu lệnh truy
          vấn bảng promotions.
      - key: q1_n4_o2
        label: Dùng pg_terminate_backend kill tất cả connection đang kết nối tới DB.
      - key: q1_n4_o3
        label: Tạo thêm 10 Read Replica cho Postgres Database.
    - key: q1_node5
      prompt: 'Bước 5: Phát hiện câu lệnh ''SELECT * FROM promotions WHERE code =
        ? AND status = ACTIVE'' chưa được đánh index.'
      options:
      - key: q1_n5_o1
        label: Chạy 'CREATE INDEX CONCURRENTLY idx_promotions_code_status ON promotions(code,
          status);'
      - key: q1_n5_o2
        label: Chạy 'CREATE INDEX idx_promotions_code ON promotions(code);' trực tiếp
          mà không dùng CONCURRENTLY.
      - key: q1_n5_o3
        label: Xóa các bản ghi cũ trong bảng promotions để giảm số lượng hàng.
    - key: q1_node6
      prompt: 'Bước 6: Truy vấn đã chạy trong 3ms, nhưng lượng request dồn nén trước
        đó khiến Checkout Pods bị tràn Queue.'
      options:
      - key: q1_n6_o1
        label: Kích hoạt Rate Limiting tại API Gateway và Circuit Breaker cho Checkout
          Service.
      - key: q1_n6_o2
        label: Tắt bớt log mức DEBUG trên toàn bộ Pods.
      - key: q1_n6_o3
        label: Chặn toàn bộ IP đến từ các dải mạng di động.
    - key: q1_node7
      prompt: 'Bước 7: Tải hệ thống dần hạ nhiệt, Error Rate giảm xuống dưới 0.1%.
        Bạn thực hiện bước nào để đưa traffic về bình thường?'
      options:
      - key: q1_n7_o1
        label: Xả dần Rate Limiting tại Gateway theo từng nấc 25%, 50%, 100% và theo
          dõi latency.
      - key: q1_n7_o2
        label: Tắt bỏ hoàn toàn Rate Limiting ngay lập tức.
      - key: q1_n7_o3
        label: Scale down bớt số lượng Pods về mức tối thiểu để tiết kiệm chi phí.
    - key: q1_node8_rec
      prompt: 'Bước 8 (Khôi phục thành công): Hệ thống Checkout hoạt động ổn định.
        Báo cáo Post-mortem cần tập trung vào điều gì?'
      options:
      - key: q1_n8_o1
        label: Ghi nhận nguyên nhân gốc (Missing Index, Redis eviction policy), hoàn
          thiện Alerting và Runbook.
      - key: q1_n8_o2
        label: Lưu trữ log và kết thúc incident mà không cần cập nhật thêm.
  answer_key:
    option_effects:
      q1_n1_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_node2
        explanation: 'Đúng chuẩn: Xác định chính xác tài nguyên bị thắt cổ chai trước
          khi hành động.'
      q1_n1_o2:
        points: 0
        minutes_cost: 5
        next_node: q1_node1
        explanation: 'Sai: Restart pod khi Redis/DB đang sập không giải quyết được
          gốc rễ mà chỉ làm mất thời gian.'
      q1_n1_o3:
        points: 0
        minutes_cost: 5
        next_node: q1_node1
        explanation: 'Sai: Scale pod lúc này sẽ làm dồn thêm kết nối khiến DB sập
          nhanh hơn.'
      q1_n2_o1:
        points: 10
        minutes_cost: 2
        next_node: q1_node3
        explanation: 'Chính xác: Nâng RAM và đổi eviction policy giúp Redis tiếp tục
          hoạt động mà không từ chối request.'
      q2_n2_o2_q1:
        points: 0
        minutes_cost: 10
        next_node: q1_node2
        explanation: 'Nguy hiểm: FlushAll sẽ xóa toàn bộ session/cache, gây thảm họa
          Cache Stampede xuống Database.'
      q1_n2_o3:
        points: 0
        minutes_cost: 8
        next_node: q1_node2
        explanation: 'Sai: Tắt cache giữa đợt Flash Sale sẽ đánh sập Database lập
          tức.'
      q1_n3_o1:
        points: 10
        minutes_cost: 2
        next_node: q1_node4
        explanation: 'Chính xác: Singleflight ngăn việc hàng ngàn request cùng lúc
