- content:
    scenario: Vào thời điểm Flash Sale 12/12, dịch vụ thanh toán/đặt hàng (Checkout
      Service) bị treo hàng loạt. Khách hàng bấm thanh toán bị xoay vòng và nhận lỗi
      HTTP 500. Đội hỗ trợ ghi nhận hàng ngàn request bị timeout.
    initial_logs: "[ERROR] 2023-12-12 12:01:05.123 [http-nio-8080-exec-42] c.e.checkout.OrderService:
      Failed to process order\norg.springframework.dao.CannotAcquireLockException:
      HikariPool-1 - Connection is not available, request timed out after 30000ms.\n\tat
      com.zaxxer.hikari.pool.HikariPool.getConnection(HikariPool.java:213)\n\tat org.springframework.orm.jpa.vendor.HibernateJpaDialect.beginTransaction(HibernateJpaDialect.java:160)\n[WARN]
      2023-12-12 12:01:06.001 HikariPool-1 - Connection pool active connections: 50/50,
      waiting threads: 142"
    nodes:
    - key: q1_node1
      prompt: 'Bước 1: Hệ thống đang bị nghen request đặt hàng. Bạn bắt đầu kiểm tra
        tổng quan từ đâu?'
      options:
      - key: q1_n1_o1
        label: Xem APM / Grafana Dashboard để phân tích HTTP latency và tỷ lệ lỗi
          dịch vụ.
      - key: q1_n1_o2
        label: SSH vào server chạy app để chạy lệnh 'top' xem CPU/RAM.
      - key: q1_n1_o3
        label: Khởi động lại toàn bộ Nginx Load Balancer.
    - key: q1_node2
      prompt: 'Bước 2: Dashboard cho thấy HTTP response time tăng vọt lên 30s và lỗi
        connection pool timeout. Bạn kiểm tra chỉ số nào tiếp theo?'
      options:
      - key: q1_n2_o1
        label: Kiểm tra HikariCP pool metrics và số lượng kết nối đang active đến
          Database.
      - key: q1_n2_o2
        label: Tăng ngay max-pool-size của HikariCP từ 50 lên 200 và redeploy.
      - key: q1_n2_o3
        label: Xóa cache ứng dụng trên Redis.
    - key: q1_node3
      prompt: 'Bước 3: Tất cả 50 connection trong DB pool đều bị chiếm dụng và đang
        chờ response từ PostgreSQL. Bạn điều tra Database như thế nào?'
      options:
      - key: q1_n3_o1
        label: Truy vấn pg_stat_activity trên PostgreSQL để xem các query đang chạy
          và trạng thái lock.
      - key: q1_n3_o2
        label: Mở file log PostgreSQL trên ổ đĩa /var/log/postgresql/ để tìm log ERROR.
      - key: q1_n3_o3
        label: Khởi động lại PostgreSQL Database Service lập tức.
    - key: q1_node4
      prompt: 'Bước 4: ''pg_stat_activity'' hiển thị nhiều transaction đang chờ lock
        ở câu lệnh: SELECT * FROM orders WHERE user_id = $1 AND status = ''PENDING''
        FOR UPDATE. Bạn làm gì tiếp theo?'
      options:
      - key: q1_n4_o1
        label: Phân tích nguyên nhân câu lệnh 'FOR UPDATE' bị nghẽn và kiểm tra chỉ
          mục (index) của bảng 'orders'.
      - key: q1_n4_o2
        label: Chạy pg_terminate_backend() để kill tất cả các process đang chạy query
          trên.
      - key: q1_n4_o3
        label: Nâng cấp RAM và vCPU cho Database Instance.
    - key: q1_node5
      prompt: 'Bước 5: Bạn phát hiện bảng ''orders'' chưa có index trên cột (user_id,
        status), dẫn đến Sequential Scan và giữ Row Lock rất lâu. Phương án xử lý
        tốt nhất là gì?'
      options:
      - key: q1_n5_o1
        label: Chuẩn bị script đánh index bằng lệnh 'CREATE INDEX CONCURRENTLY' trên
          bảng 'orders'.
      - key: q1_n5_o2
        label: Chạy lệnh 'REINDEX TABLE orders;' ngay lập tức.
      - key: q1_n5_o3
        label: Sửa code backend bỏ thuộc tính FOR UPDATE khỏi truy vấn.
    - key: q1_node6
      prompt: 'Bước 6: Tạo index trên bảng lớn đang có truy vấn cao có thể gây lock
        bảng nếu không dùng CONCURRENTLY. Bạn chốt câu lệnh SQL xử lý khẩn cấp nào?'
      options:
      - key: q1_n6_o1
        label: 'Tạo index bất đồng bộ: CREATE INDEX CONCURRENTLY idx_orders_user_status
          ON orders(user_id, status);'
      - key: q1_n6_o2
        label: 'Tạo index đồng bộ thông thường: CREATE INDEX idx_orders_user_status
          ON orders(user_id, status);'
      - key: q1_n6_o3
        label: Sửa code SQL trong repository rồi trigger CI/CD pipeline để deploy
          bản mới.
    - key: q1_node7
      prompt: 'Bước 7: Index tạo thành công mà không gây đơ bảng. Tuy nhiên các connection
        cũ vẫn đang bị treo chờ timeout. Bạn xử lý các connection này ra sao?'
      options:
      - key: q1_n7_o1
        label: Kill các session Postgres bị lock lâu bằng pg_terminate_backend() để
          nhường chỗ cho connection mới.
      - key: q1_n7_o2
        label: Chờ 30 phút để các connection tự hết hạn timeout.
      - key: q1_n7_o3
        label: Drop bảng orders rồi khôi phục lại từ bản backup gần nhất.
    - key: q1_node8
      prompt: 'Bước 8: Tải hệ thống đã giảm, DB connection pool trở lại trạng thái
        bình thường. Bạn thực hiện bước nghiệm thu cuối cùng nào?'
      options:
      - key: q1_n8_o1
        label: Kiểm tra Grafana APM, xác nhận latency quay về < 200ms và tỷ lệ lỗi
          HTTP 500 về 0%.
      - key: q1_n8_o2
        label: Tắt bớt 50% số lượng Pod để tiết kiệm chi phí server.
      - key: q1_n8_o3
        label: Mở lại cổng Nginx cho truy cập trực tiếp không qua Cloudflare.
    - key: q1_node_recovery
      prompt: Sự cố đã được khắc phục hoàn toàn! Hệ thống checkout hoạt động mượt
        mà trở lại.
      options: []
