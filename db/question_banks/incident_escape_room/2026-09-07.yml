- content:
    scenario: Hệ thống thanh toán đơn hàng Flash Sale bị nghẽn nghiêm trọng. Tỷ lệ
      lỗi HTTP 500 chạm mốc 45%, latency trung bình tăng từ 120ms lên 8500ms. Khách
      hàng không thể hoàn tất đặt hàng.
    initial_logs: |-
      ERROR 2026-03-30T10:15:02Z [payment-service] [node-03] TimeoutError: ResourceRequest timed out after 3000ms at generic-pool/lib/Pool.js:283
      WARN 2026-03-30T10:15:05Z [pg-pool] Connection pool clients total=50 waiting=142 active=50 idle=0
      ERROR 2026-03-30T10:15:10Z [express] POST /api/v1/orders/checkout 500 Internal Server Error - Duration: 8912ms
    nodes:
    - key: n1_start
      prompt: 'Bước 1: Hệ thống cảnh báo HTTP 500 hàng loạt từ payment-service. Bạn
        nên làm gì trước tiên?'
      options:
      - key: opt_1_1
        label: Kiểm tra số lượng connection và active queries trên cơ sở dữ liệu PostgreSQL.
      - key: opt_1_2
        label: Khởi động lại ngay toàn bộ các Pods của payment-service.
      - key: opt_1_3
        label: Tăng gấp đôi RAM và CPU cho các Node Kubernetes chứa app.
    - key: n2_pool
      prompt: 'Bước 2: Kết quả pg_stat_activity cho thấy 50 connection đều ở trạng
        thái ''active''. Bạn cần điều tra thêm chỉ số nào trong DB?'
      options:
      - key: opt_2_1
        label: Tra cứu các câu lệnh đang chạy lâu (long-running queries) và trạng
          thái lock trên pg_stat_activity.
      - key: opt_2_2
        label: Xóa toàn bộ cache Redis của ứng dụng để làm sạch bộ nhớ.
      - key: opt_2_3
        label: Tăng tham số max_connections của PostgreSQL lên 500 ngay lập tức.
    - key: n3_query
      prompt: 'Bước 3: Phát hiện query ''SELECT * FROM inventory WHERE item_id = $1
        FOR UPDATE'' đang chờ đợi lock trung bình > 7000ms. Nguyên nhân chính là gì?'
      options:
      - key: opt_3_1
        label: Do các transaction giữ row-level lock quá lâu mà chưa commit/rollback
          do nghẽn I/O hoặc leak transaction trong code.
      - key: opt_3_2
        label: Do PostgreSQL thiếu bộ nhớ RAM để thực hiện phép JOIN.
      - key: opt_3_3
        label: Do card mạng của máy chủ Database bị tràn băng thông.
    - key: n4_kill
      prompt: 'Bước 4: Bạn cần giảm tải ngay lập tức cho Database để giải phóng connection
        đang bị giữ bối cảnh lock. Hành động khẩn cấp là gì?'
      options:
      - key: opt_4_1
        label: Chạy pg_cancel_backend() hoặc pg_terminate_backend() đối với các process
          giữ lock quá 5 giây.
      - key: opt_4_2
        label: Drop index trên bảng inventory để giảm bớt chi phí ghi.
      - key: opt_4_3
        label: Tắt toàn bộ hệ thống trong 30 phút để chờ traffic giảm.
    - key: n5_pool_tune
      prompt: 'Bước 5: Sau khi kill backend process, connection pool giảm nhẹ nhưng
        nhanh chóng đầy lại. Cấu hình ứng dụng cần điều chỉnh ngắn hạn ra sao?'
      options:
      - key: opt_5_1
        label: Bật Circuit Breaker và giới hạn Rate Limit ở Nginx API Gateway để giảm
          lượng request đổ vào DB.
      - key: opt_5_2
        label: Tăng kích thước max pool size của từng Pod từ 50 lên 200 connection.
      - key: opt_5_3
        label: Chuyển toàn bộ traffic sang môi trường Staging.
    - key: n6_patch
      prompt: 'Bước 6: Đội Dev phát hiện code checkout quên gọi client.release() trong
        khối catch block khi gọi HTTP API bên ngoài bị fail. Cần fix như thế nào?'
      options:
      - key: opt_6_1
        label: Bọc connection release trong khối finally và thêm statement_timeout
          = 3000ms trong Postgres.
      - key: opt_6_2
        label: Bỏ hẳn câu lệnh FOR UPDATE trong transaction checkout.
      - key: opt_6_3
        label: Tăng timeout của API bên ngoài lên 60 giây.
    - key: n7_verify
      prompt: 'Bước 7: Sau khi deploy bản hotfix code và cấu hình statement_timeout,
        bạn thực hiện kiểm tra lại như thế nào?'
      options:
      - key: opt_7_1
        label: Theo dõi Grafana dashboard về active connections, latency API checkout
          và tỷ lệ HTTP 200 OK.
      - key: opt_7_2
        label: Thực hiện stress test trực tiếp với 100.000 virtual users vào môi trường
          Production.
      - key: opt_7_3
        label: Chờ khách hàng phản ánh qua tổng đài hỗ trợ.
    - key: n8_recovery
      prompt: 'Bước 8: Tỷ lệ lỗi đã trở về 0%, latency quay lại mức 110ms. Hệ thống
        đã phục hồi hoàn toàn. Bạn chốt sự cố như thế nào?'
      options:
      - key: opt_8_1
        label: Xác nhận khôi phục dịch vụ, ghi nhận Post-mortem và lập backlog bổ
          sung test case connection leak.
      - key: opt_8_2
        label: Đóng ticket sự cố mà không cần viết tài liệu Post-mortem.
  answer_key:
    option_effects:
      opt_1_1:
        points: 10
        minutes_cost: 1
        next_node: n2_pool
        explanation: Chính xác. Log báo lỗi TimeoutError từ Connection Pool nên cần
          kiểm tra trạng thái DB connections trước.
      opt_1_2:
