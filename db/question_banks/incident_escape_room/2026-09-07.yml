      q2_n3_opt3:
        points: 0
        minutes_cost: 5
        next_node: q2_node_4
        explanation: Xóa mò làm hỏng dữ liệu session hợp lệ của người dùng.
      q2_n4_opt1:
        points: 10
        minutes_cost: 2
        next_node: q2_node_5
        explanation: UNLINK giải phóng bộ nhớ ở background thread, không block main
          thread của Redis.
      q2_n4_opt2:
        points: 0
        minutes_cost: 7
        next_node: q2_node_5
        explanation: Xóa lượng lớn key bằng DEL truyền thống gây lock Redis trong
          nhiều giây.
      q2_n4_opt3:
        points: 0
        minutes_cost: 10
        next_node: q2_node_5
        explanation: Xóa file dump không giúp giải phóng RAM đang chạy trực tiếp trên
          Instance.
      q2_n5_opt1:
        points: 10
        minutes_cost: 1
        next_node: q2_node_6
        explanation: Kiểm tra mã nguồn giúp tìm chính xác đoạn code đang leak bộ nhớ.
      q2_n5_opt2:
        points: 5
        minutes_cost: 4
        next_node: q2_node_6
        explanation: Timeout config của Redis là cho idle client connection, không
