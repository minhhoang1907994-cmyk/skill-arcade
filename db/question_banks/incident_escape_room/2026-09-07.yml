      - key: opt_6_2
        label: Thực hiện Failover DB sang node Standby.
      - key: opt_6_3
        label: Rollback phiên bản ứng dụng trên Kubernetes về bản release trước đó.
      - key: opt_6_4
        label: Tăng giới hạn CPU/RAM trong file deployment của Kubernetes.
    - key: n7
