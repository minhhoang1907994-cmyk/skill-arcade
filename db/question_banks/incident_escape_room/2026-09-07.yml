        points: 5
        minutes_cost: 2
        next_node: n8_recovery
        explanation: Sự cố được giải quyết nhưng thiếu tài liệu cải tiến có thể khiến
          lỗi lặp lại.
    recovery_node: n8_recovery
  difficulty: hard
- content:
    scenario: Dịch vụ Catalog hiển thị sản phẩm trên ứng dụng E-Commerce bị treo hàng
      loạt. Tỷ lệ lỗi HTTP 504 Gateway Timeout xuất hiện liên tục khi người dùng truy
      cập trang chủ.
    initial_logs: |-
      ERROR 2026-03-30T14:20:00Z [api-gateway] upstream timed out (110: Connection timed out) while reading response header from upstream, client: 10.244.0.1, server: api.shop.com, request: GET /api/v1/products/hot-deals
      WARN 2026-03-30T14:20:03Z [redis-cluster] OOM command not allowed when used memory > 'maxmemory' (used: 8.01GB, limit: 8.00GB)
      ERROR 2026-03-30T14:20:05Z [catalog-service] RedisError: OOM command not allowed when used memory > 'maxmemory'
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: Hệ thống ghi nhận lỗi Redis OOM (Out Of Memory). Bạn nên thực
        hiện hành động chẩn đoán nào trước?'
      options:
      - key: q2_opt_1_1
        label: Kiểm tra memory usage, eviction policy và danh sách key chiếm dung
          lượng lớn trên Redis.
      - key: q2_opt_1_2
        label: Xóa toàn bộ CSDL MySQL để giải phóng dung lượng ổ đĩa.
      - key: q2_opt_1_3
        label: Thực hiện restart ngay lập tức toàn bộ Redis cluster.
    - key: q2_n2
      prompt: 'Bước 2: Kết quả redis-cli info memory cho thấy used_memory = 8.01GB
        và maxmemory_policy = noeviction. Rủi ro của cấu hình này là gì?'
      options:
      - key: q2_opt_2_1
        label: Khi đầy RAM, Redis sẽ từ chối toàn bộ lệnh ghi (SET/INCR...) gây lỗi
          tràn sang backend app.
      - key: q2_opt_2_2
        label: Redis sẽ tự động xả bớt các key ghi lâu nhất mà không báo lỗi.
      - key: q2_opt_2_3
        label: Không có rủi ro nào, đây là cấu hình tiêu chuẩn.
    - key: q2_n3
      prompt: 'Bước 3: Tra cứu các key lớn (redis-cli --bigkeys) phát hiện key ''product:hot-deals''
        chứa lượng dữ liệu khổng lồ và không set TTL (Time To Live). Bạn đánh giá
        thế nào?'
      options:
      - key: q2_opt_3_1
        label: Đây là nguyên nhân chính gây phồng bộ nhớ và hiện tượng Cache Stampede
          khi key bị ghi đè liên tục.
      - key: q2_opt_3_2
        label: Key này quá nhỏ nên không ảnh hưởng tới bộ nhớ.
      - key: q2_opt_3_3
        label: Do hạ tầng mạng LAN của Redis Cluster bị chậm.
    - key: q2_n4
      prompt: 'Bước 4: Bạn cần giảm áp lực bộ nhớ khẩn cấp trên Redis mà không làm
        sập Database. Giải pháp tạm thời là gì?'
      options:
      - key: q2_opt_4_1
        label: Đổi tạm thời maxmemory-policy thành allkeys-lru và xóa thủ công một
          số key rác/log lớn.
      - key: q2_opt_4_2
        label: Thực hiện lệnh FLUSHALL để xóa sạch toàn bộ cache.
      - key: q2_opt_4_3
        label: Tắt toàn bộ dịch vụ Redis và cho app gọi thẳng vào DB.
    - key: q2_n5
      prompt: 'Bước 5: Sau khi đổi sang allkeys-lru, Redis đã chấp nhận lệnh ghi nhưng
        DB spike CPU lên 99% do hiện tượng Cache Stampede (mọi request đều chọc vào
        DB lấy hot-deals). Cách xử lý ngắn hạn?'
      options:
      - key: q2_opt_5_1
        label: Áp dụng Mutex Lock (Distributed Lock) trong code hoặc warm-up sẵn cache
          key hot-deals.
      - key: q2_opt_5_2
        label: Tăng số lượng connection trong DB Pool lên gấp 10 lần.
      - key: q2_opt_5_3
        label: Tắt bớt 50% số Pod của catalog-service.
    - key: q2_n6
      prompt: 'Bước 6: Cần vá code catalog-service như thế nào để ngăn ngừa Cache
        Stampede và OOM trong tương lai?'
      options:
      - key: q2_opt_6_1
        label: Thêm TTL cho mọi cache key, thêm cơ chế Probabilistic Early Expiration
          và phân trang dữ liệu hot-deals.
      - key: q2_opt_6_2
        label: Lưu toàn bộ danh sách hot-deals vào Local Memory (RAM) của từng Pod
          app mãi mãi.
      - key: q2_opt_6_3
        label: Chuyển sang lưu cache trong file txt trên đĩa cứng.
    - key: q2_n7
      prompt: 'Bước 7: Bản patch đã được deploy. Làm thế nào để đảm bảo hệ thống đã
        ổn định hoàn toàn?'
      options:
      - key: q2_opt_7_1
        label: Theo dõi Redis memory footprint, Cache Hit Ratio và CPU load của DB
          trên Datadog/Grafana.
      - key: q2_opt_7_2
        label: Liên tục chạy lệnh FLUSHDB mỗi 5 phút để đảm bảo bộ nhớ không bị đầy.
      - key: q2_opt_7_3
        label: Tắt các công cụ giám sát để tiết kiệm tài nguyên hệ thống.
    - key: q2_n8
      prompt: 'Bước 8: Tỷ lệ Cache Hit đạt 96%, latency API quay về mốc 35ms. Hệ thống
        đã khôi phục. Bạn chốt sự cố ra sao?'
      options:
      - key: q2_opt_8_1
        label: Cập nhật tài liệu vận hành, lưu cấu hình maxmemory_policy chuẩn vào
          Terraform/Ansible và đóng incident.
      - key: q2_opt_8_2
        label: Không làm gì thêm vì sự cố đã tự hết.
  answer_key:
    option_effects:
      q2_opt_1_1:
        points: 10
        minutes_cost: 1
        next_node: q2_n2
        explanation: Chính xác. Phân tích phân bổ RAM và eviction policy của Redis
          là bước quan trọng nhất.
      q2_opt_1_2:
        points: 0
        minutes_cost: 5
        next_node: q2_n1
        explanation: Hành động cực kỳ nguy hiểm và không liên quan đến bộ nhớ Redis!
      q2_opt_1_3:
        points: 5
        minutes_cost: 3
        next_node: q2_n2
        explanation: Restart giúp giải phóng RAM tức thời nhưng làm mất toàn bộ cache,
          gây quá tải DB ngay lập tức.
      q2_opt_2_1:
        points: 10
        minutes_cost: 1
        next_node: q2_n3
        explanation: Chính xác. Khi noeviction gặp OOM, các lệnh SET/INCR sẽ trả về
          lỗi, gây hỏng ứng dụng.
      q2_opt_2_2:
        points: 0
        minutes_cost: 4
        next_node: q2_n2
        explanation: Sai. Lựa chọn noeviction từ chối ghi chứ không tự động giải phóng
          key.
      q2_opt_2_3:
        points: 5
        minutes_cost: 2
        next_node: q2_n3
        explanation: Đánh giá sai rủi ro nhưng ít nhất chưa gây tác động tiêu cực
          ngay.
      q2_opt_3_1:
        points: 10
        minutes_cost: 1
        next_node: q2_n4
        explanation: Chính xác. Bigkey không có TTL là 'bom nổ chậm' làm cạn kiệt
