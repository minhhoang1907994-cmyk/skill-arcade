    nodes:
    - key: n1
      prompt: 'Bước 1: Hệ thống cảnh báo lỗi 504 gia tăng mạnh. Bạn chọn hành động
        đầu tiên nào để bắt đầu khoanh vùng sự cố?'
      options:
      - key: opt_1_1
        label: Kiểm tra số lượng kết nối đang mở và trạng thái connection pool của
          PostgreSQL.
      - key: opt_1_2
        label: Xem biểu đồ APM (Datadog/NewRelic) để kiểm tra tổng thể latency dịch
          vụ.
      - key: opt_1_3
        label: Khởi động lại toàn bộ pod của ứng dụng payment-service.
      - key: opt_1_4
        label: Tăng số lượng Replica (scale up pod) của payment-service ngay lập tức.
    - key: n2
      prompt: 'Bước 2: Log cho thấy ứng dụng bị cạn kiệt kết nối DB (HikariPool Timeout).
        Bạn sẽ truy vấn điều gì trên Database?'
      options:
      - key: opt_2_1
        label: Truy vấn bảng pg_stat_activity để xem trạng thái và query của các kết
          nối hiện tại.
      - key: opt_2_2
        label: Đọc thêm log chi tiết của ứng dụng payment-service để xác nhận lại
          ngoại lệ.
      - key: opt_2_3
        label: Xóa bộ nhớ đệm query cache của PostgreSQL.
      - key: opt_2_4
        label: Chạy câu lệnh ngắt toàn bộ các session trên Database ngay lập tức.
    - key: n3
      prompt: 'Bước 3: Kết quả pg_stat_activity cho thấy hàng chục kết nối đang ở
        trạng thái ''idle in transaction'' kéo dài hơn 2 phút. Bạn phân tích như thế
