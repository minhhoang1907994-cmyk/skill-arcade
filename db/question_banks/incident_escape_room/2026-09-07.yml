        next_node: q2_node_3
        explanation: Chẩn đoán sai nguyên nhân khiến tốn thời gian tìm kiếm không
          đúng hướng.
      q2_n3_opt1:
        points: 10
        minutes_cost: 2
        next_node: q2_node_4
        explanation: SCAN và --bigkeys an toàn cho Production vì không làm block Single-thread
