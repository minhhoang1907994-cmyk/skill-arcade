    scenario: Hệ thống Thanh toán (Payment Gateway) bị gián đoạn giao dịch vào giờ
      cao điểm. Tỷ lệ lỗi 504 Gateway Timeout tăng vọt lên 45%. Khách hàng phản ánh
      không thể hoàn tất thanh toán qua thẻ.
    initial_logs: |-
      2023-10-24 14:02:11.102 ERROR [payment-service,,] 15 --- [nio-8080-exec-4] c.z.h.p.HikariPool : HikariPool-1 - Connection is not available, request timed out after 30000ms.
