      q2_n5_opt3:
        points: 0
        minutes_cost: 5
        next_node: q2_node_6
        explanation: Ingress log độc lập với ứng dụng Auth Service.
      q2_n6_opt1:
        points: 10
        minutes_cost: 3
        next_node: q2_node_7
        explanation: Chuyển log về đúng nơi lưu trữ (Elasticsearch/Kafka) và sửa bug
