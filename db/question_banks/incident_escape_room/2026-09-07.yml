        label: Kiểm tra Git commit history và Pull Request của bản release gần nhất.
      - key: opt_4_2
        label: Kiểm tra log hệ thống Switch/Router mạng kết nối đến DB.
      - key: opt_4_3
        label: Xóa toàn bộ cache Redis của ứng dụng.
      - key: opt_4_4
        label: Tạo thêm Index mới cho bảng giao dịch orders.
    - key: n5
      prompt: 'Bước 5: Kiểm tra code release mới phát hiện annotation @Transactional
