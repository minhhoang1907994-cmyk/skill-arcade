        label: Tăng số lượng connection trong HikariPool lên tối đa.
      - key: opt_7_3
        label: Tăng RAM cho server PostgreSQL.
      - key: opt_7_4
        label: Tắt tính năng xác thực giao dịch với bên thứ ba.
    - key: n8
      prompt: 'Bước 8: Sau khi deploy bản hotfix code mới, bạn thực hiện hành động
        nào để xác nhận sự cố đã kết thúc hoàn toàn?'
      options:
      - key: opt_8_1
        label: Giám sát số lượng active/idle connection trên DB và latency API thanh
