        label: HTTP call tới bên thứ 3 chậm/timeout làm giữ DB connection suốt thời
          gian chờ response.
      - key: opt_5_2
        label: Do câu SQL trong transaction chưa được tối ưu hóa chỉ số Index.
      - key: opt_5_3
        label: Do thư viện HikariCP bị lỗi tương thích với Java version mới.
      - key: opt_5_4
        label: Do timeout của HikariPool đang đặt quá ngắn.
    - key: n6
      prompt: 'Bước 6: Trong lúc chuẩn bị bản sửa lỗi code, bạn xử lý tức thời (mitigation)
