- content:
    scenario: Dịch vụ xử lý dữ liệu người dùng (user-profile-service) chạy trên Kubernetes
      liên tục bị CrashLoopBackOff trong đợt chiến dịch khuyến mãi lớn. Hệ thống ghi
      nhận mức sử dụng RAM tăng liên tục đến khi Pod bị OOMKilled.
    initial_logs: |-
      2023-10-24 10:15:00 K8s Event: Pod user-profile-service-789bfb7-x2k4p memory usage 512MiB reached limit 512MiB.
      2023-10-24 10:15:02 K8s Event: Pod user-profile-service-789bfb7-x2k4p terminated with OOMKilled (Exit Code 137).
      2023-10-24 10:15:05 Node.js Process Fatal: FATAL ERROR: Reached heap limit Allocation failed - JavaScript heap out of memory
    nodes:
    - key: q2_n1
