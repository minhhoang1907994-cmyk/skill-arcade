      options:
      - key: q2_opt_1_1
        label: Dùng kubectl describe pod và xem log chi tiết của container trước khi
          sập.
      - key: q2_opt_1_2
        label: Tăng số lượng Pod replica bằng lệnh kubectl scale.
      - key: q2_opt_1_3
        label: Khởi động lại toàn bộ Kubernetes Worker Nodes.
      - key: q2_opt_1_4
        label: Xóa bộ nhớ đệm Nginx Ingress Controller.
    - key: q2_n2
      prompt: 'Bước 2: Log xác nhận ứng dụng Node.js bị đầy Heap Memory. Bạn dùng
