      - key: opt_3_1
        label: Xác định các giao dịch 'idle in transaction' đang chiếm giữ connection
          pool mà không chịu release.
      - key: opt_3_2
        label: Chạy câu lệnh VACUUM FULL trên toàn bộ các bảng trong Database.
      - key: opt_3_3
        label: Reboot lại con Database Master để giải phóng kết nối.
      - key: opt_3_4
        label: Sửa file postgresql.conf tăng tạm max_connections lên gấp đôi.
    - key: n4
      prompt: 'Bước 4: Bạn nghi ngờ có mã nguồn mới đẩy lên làm treo transaction.
