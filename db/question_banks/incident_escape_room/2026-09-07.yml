      - key: q2_opt_3_2
        label: Sửa file Kubernetes deployment nâng RAM limit lên 32GB.
      - key: q2_opt_3_3
        label: Scale up ứng dụng lên 50 pod ngay tức thì.
      - key: q2_opt_3_4
        label: Restart ứng dụng Database chính.
    - key: q2_n4
      prompt: 'Bước 4: Mở Heap Snapshot trên Chrome DevTools, đối tượng nào đang chiếm
