      - key: q2_opt_4_2
        label: Các chuỗi ký tự String tĩnh của mã nguồn.
      - key: q2_opt_4_3
        label: Bộ đệm kết nối TCP Socket của hệ điều hành.
      - key: q2_opt_4_4
        label: Các file log được ghi trực tiếp xuống ổ đĩa.
    - key: q2_n5
      prompt: 'Bước 5: Kiểm tra code phát hiện biến global.requestTracker = [] lưu
