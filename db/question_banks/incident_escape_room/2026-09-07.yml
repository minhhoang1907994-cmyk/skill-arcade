- content:
    scenario: Hệ thống sàn thương mại điện tử bị treo trong đợt Sale 11/11. Khách
      hàng không thể hoàn tất thanh toán, hệ thống liên tục trả về lỗi HTTP 500/504.
    initial_logs: |-
      [ERROR] 2023-11-11 00:05:12 - RedisConnectionFailureException: Redis connection timeout after 3000ms.
      [FATAL] 2023-11-11 00:05:15 - OutOfMemoryError: Container payment-service-78f9d killed by OOM Killer.
      [WARN] 2023-11-11 00:05:20 - DB pool connection timeout (active=50, idle=0, waiting=120).
    nodes:
    - key: q1_n1
      prompt: 'Bước 1: Hệ thống báo lỗi Redis timeout và Payment Service bị OOM. Bạn
        quyết định kiểm tra chỉ số nào trước?'
      options:
      - key: q1_opt_1_1
        label: Kiểm tra mức độ sử dụng RAM/CPU trên Redis Server và các App Instance.
      - key: q1_opt_1_2
        label: Khởi động lại (restart) toàn bộ App Cluster để xả bộ nhớ ngay lập tức.
      - key: q1_opt_1_3
        label: Tăng gấp đôi số lượng Pod của Payment Service trên Kubernetes Cluster.
    - key: q1_n2
      prompt: 'Bước 2: Phát hiện Redis Server sử dụng 99% RAM (maxmemory reached).
        Bước phân tích nào giúp xác định nguyên nhân tràn RAM?'
      options:
      - key: q1_opt_2_1
        label: Dùng lệnh redis-cli --bigkeys để tìm ra các key chiếm dung lượng đột
          biến.
      - key: q1_opt_2_2
        label: Chạy lệnh FLUSHALL để giải phóng bộ nhớ Redis ngay tức thì.
      - key: q1_opt_2_3
        label: Khởi động lại tiến trình Redis Server.
    - key: q1_n3
      prompt: 'Bước 3: Lệnh --bigkeys xác định key ''cache:all_products_v2'' đang
        chiếm 4.2GB RAM và có TTL = -1 (không hết hạn). Hành động tiếp theo?'
      options:
      - key: q1_opt_3_1
        label: Kiểm tra luồng ghi code để hiểu tại sao dữ liệu lớn như vậy lại được
          lưu thành 1 key duy nhất không có TTL.
      - key: q1_opt_3_2
        label: Thực hiện ngay lệnh DEL cache:all_products_v2 trên Redis CLI.
      - key: q1_opt_3_3
        label: Chờ Dev team hoàn thành pull request cập nhật code rồi mới can thiệp.
    - key: q1_n4
      prompt: 'Bước 4: Cần xóa bigkey ''cache:all_products_v2'' nhưng phải tránh làm
        nghẽn (block) Redis Main Thread trong lúc xử lý.'
      options:
      - key: q1_opt_4_1
        label: Sử dụng lệnh UNLINK cache:all_products_v2 để xóa bất đồng bộ (async).
      - key: q1_opt_4_2
        label: Chạy lệnh DEL cache:all_products_v2 trực tiếp.
      - key: q1_opt_4_3
        label: Đổi tên key bằng RENAME cache:all_products_v2 cache:old.
    - key: q1_n5
      prompt: 'Bước 5: RAM Redis đã giảm về 30%, nhưng Database CPU nhảy lên 100%
        do hàng nghìn request chọc thẳng DB (hiện tượng Cache Stampede). Cách ứng
        phó khẩn cấp?'
      options:
      - key: q1_opt_5_1
        label: Bật tạm thời Rate Limiter / Circuit Breaker trên API Gateway để giới
          hạn tải đầu vào.
      - key: q1_opt_5_2
        label: Restart Database Server để xả hết các query đang nghẽn.
      - key: q1_opt_5_3
        label: Tăng thông số max_connections của Database lên gấp đôi.
    - key: q1_n6
      prompt: 'Bước 6: Tải DB đã giảm còn 80%. Để xử lý triệt để Cache Stampede ở
        mức application, bạn triển khai cơ chế nào?'
      options:
      - key: q1_opt_6_1
        label: Sử dụng Mutex Lock (hoặc Singleflight / Distributed Lock) khi rebuild
          cache.
      - key: q1_opt_6_2
        label: Sửa code để bỏ hoàn toàn lớp Redis Cache, query thẳng vào DB.
      - key: q1_opt_6_3
        label: Viết script gọi API liên tục để warm-up thủ công từng sản phẩm.
    - key: q1_n7
      prompt: 'Bước 7: Code hot-fix đã deploy thành công. Bạn cần làm gì trước khi
        gỡ bỏ Rate Limiter trên API Gateway?'
      options:
      - key: q1_opt_7_1
        label: Theo dõi Redis Hit Ratio, CPU DB và latency của API trong 5 phút để
          xác nhận tính ổn định.
      - key: q1_opt_7_2
        label: Tắt Rate Limiter lập tức và báo cáo sự cố đã hoàn thành.
      - key: q1_opt_7_3
        label: Tắt hoàn toàn Redis service để chuyển sang dùng In-Memory cache trên
          từng instance.
    - key: q1_recovery
      prompt: 'Bước 8: Phục hồi hoàn tất. Hệ thống hoạt động bình thường, Redis Hit
        Ratio > 95%, DB CPU < 25%, latency API thanh toán dưới 100ms.'
      options:
      - key: q1_opt_8_1
        label: Đóng Ticket sự cố và tổ chức họp Post-mortem.
  answer_key:
    option_effects:
      q1_opt_1_1:
        points: 10
        minutes_cost: 1
        next_node: q1_n2
        explanation: Đúng chuẩn. Kiểm tra chỉ số hạ tầng giúp khoanh vùng chính xác
          nghẽn ở đâu.
      q1_opt_1_2:
        points: 0
        minutes_cost: 5
        next_node: q1_n1
        explanation: Sai. Restart app khi chưa biết nguyên nhân chỉ khiến người dùng
          gãy kết nối và lỗi lặp lại ngay sau đó.
      q1_opt_1_3:
        points: 5
        minutes_cost: 3
        next_node: q1_n2
        explanation: Tốn thời gian. Scale Pod không giải quyết được vấn đề nếu nghẽn
          do Redis hay DB.
      q1_opt_2_1:
        points: 10
        minutes_cost: 1
        next_node: q1_n3
        explanation: Chính xác. --bigkeys cho phép quét các key chiếm bộ nhớ lớn mà
          không gây treo Redis.
      q1_opt_2_2:
        points: 0
        minutes_cost: 6
        next_node: q1_n2
        explanation: Rất nguy hiểm! FLUSHALL làm mất sạch cache, dẫn tới Cache Avalanche
          đè bẹp Database ngay lập tức.
      q1_opt_2_3:
        points: 5
        minutes_cost: 4
        next_node: q1_n3
        explanation: Tốn thời gian. Restart Redis giúp xả RAM tạm thời nhưng dữ liệu
          rác không bị xóa triệt để nếu có rdb/aof persistence.
      q1_opt_3_1:
        points: 10
        minutes_cost: 1
        next_node: q1_n4
        explanation: Tốt! Hiểu rõ nguyên nhân giúp đưa ra phương án xử lý an toàn.
      q1_opt_3_2:
        points: 0
        minutes_cost: 5
        next_node: q1_n3
        explanation: Lệnh DEL trên key vài GB sẽ block đơn luồng của Redis trong nhiều
          giây, làm treo toàn bộ ứng dụng.
      q1_opt_3_3:
        points: 5
        minutes_cost: 4
        next_node: q1_n4
        explanation: Thụ động. Trong sự cố Sev-1 cần chủ động xử lý sự cố hạ tầng
          trước.
      q1_opt_4_1:
        points: 10
        minutes_cost: 1
        next_node: q1_n5
        explanation: Rất chuẩn. UNLINK giải phóng memory ở background thread mà không
          làm nghẽn Redis.
      q1_opt_4_2:
        points: 5
        minutes_cost: 3
        next_node: q1_n5
        explanation: DEL key lớn gây hiện tượng nghẽn nhẹ thời gian ngắn.
      q1_opt_4_3:
        points: 0
        minutes_cost: 4
        next_node: q1_n4
        explanation: Sai. RENAME không làm giảm dung lượng RAM đang chiếm dụng.
      q1_opt_5_1:
        points: 10
        minutes_cost: 1
        next_node: q1_n6
        explanation: Chính xác. Giới hạn lưu lượng đầu vào giúp Database không bị
          sập hoàn toàn.
      q1_opt_5_2:
        points: 0
        minutes_cost: 7
        next_node: q1_n5
        explanation: Sai lầm nghiêm trọng. Restart DB lúc cao điểm làm mất dữ liệu
          giao dịch dở dang và kéo dài thời gian downtime.
      q1_opt_5_3:
        points: 5
        minutes_cost: 3
        next_node: q1_n6
        explanation: Tăng connection không giải quyết được vấn đề quá tải CPU của
          DB.
      q1_opt_6_1:
        points: 10
        minutes_cost: 1
        next_node: q1_n7
        explanation: Rất tốt. Mutex lock chỉ cho phép 1 request duy nhất query DB
          để rebuild cache, các request khác chờ kết quả.
      q1_opt_6_2:
        points: 0
        minutes_cost: 5
        next_node: q1_n6
        explanation: Sai. Bỏ cache giữa lúc cao điểm sẽ đánh sập Database vĩnh viễn.
      q1_opt_6_3:
        points: 5
        minutes_cost: 3
        next_node: q1_n7
        explanation: Tốn thời gian và không bền vững cho đợt traffic lớn tiếp theo.
      q1_opt_7_1:
        points: 10
        minutes_cost: 1
        next_node: q1_recovery
        explanation: Chuẩn quy trình. Luôn phải verify chỉ số ổn định trước khi mở
          lại toàn bộ traffic.
      q1_opt_7_2:
        points: 5
        minutes_cost: 3
        next_node: q1_recovery
        explanation: Chủ quan. Có thể khiến sự cố tái diễn nếu tải đột ngột tăng lại.
      q1_opt_7_3:
        points: 0
        minutes_cost: 6
        next_node: q1_n7
        explanation: Sai lầm. In-Memory cache trên từng Pod gây lệch dữ liệu (inconsistency)
          nghiêm trọng.
      q1_opt_8_1:
        points: 10
        minutes_cost: 0
        next_node: q1_recovery
        explanation: Hoàn thành khắc phục sự cố thành công!
    recovery_node: q1_recovery
  difficulty: medium
- content:
    scenario: Hệ thống đặt vé xe khách trực tuyến bị nghẽn trong dịp nghỉ lễ. Khách
      hàng bấm đặt vé nhưng liên tục quay tròn và nhận lỗi HTTP 504 Gateway Timeout.
    initial_logs: |-
      [WARN] HikariPool-1 - Connection is not available, request timed out after 30000ms.
      [ERROR] postgresql: deadlock detected. Process 18239 waits for ShareLock on transaction 8829...
      [INFO] Active connections in pg_stat_activity: 100/100 (state: idle in transaction).
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: Log báo lỗi HikariPool Timeout và PostgreSQL Deadlock. Bạn
        cần truy vấn lệnh SQL nào để kiểm tra chi tiết các connection bị nghẽn?'
      options:
      - key: q2_opt_1_1
        label: SELECT * FROM pg_stat_activity WHERE state = 'idle in transaction';
      - key: q2_opt_1_2
        label: Tăng giá trị max_connections trong postgresql.conf lên 1000 và reload
          DB.
      - key: q2_opt_1_3
        label: Khởi động lại toàn bộ các instance microservice backend.
    - key: q2_n2
      prompt: 'Bước 2: Kết quả query thấy 50+ connection ở trạng thái ''idle in transaction''
        kéo dài hơn 2 phút. Nguyên nhân kiến trúc nào thường gây ra tình trạng này?'
      options:
      - key: q2_opt_2_1
        label: Code thực hiện gọi API bên thứ ba (ví dụ Payment Gateway) nằm bên trong
          hàm có @Transactional.
      - key: q2_opt_2_2
        label: Bảng vé xe chưa được đánh chỉ mục (Index) trên cột seat_id.
      - key: q2_opt_2_3
        label: HikariCP connection pool size bị đặt quá nhỏ.
    - key: q2_n3
      prompt: 'Bước 3: Đúng như nghi vấn, code gọi Payment Gateway 3rd-party nằm trong
        @Transactional. Lưới mạng bên thứ ba chập chờn khiến DB Transaction giữ kết
        nối quá lâu. Hành động xử lý khẩn cấp?'
      options:
      - key: q2_opt_3_1
        label: Thực hiện pg_terminate_backend(pid) đối với các PID đang bị 'idle in
          transaction' hơn 1 phút.
      - key: q2_opt_3_2
        label: Cài đặt lại toàn bộ Database Server.
      - key: q2_opt_3_3
        label: Kiên nhẫn chờ các transaction đó tự timeout sau 30 phút.
    - key: q2_n4
      prompt: 'Bước 4: Các connection rác đã bị kill, nhưng request mới tràn vào sẽ
        tiếp tục bị dính lại lỗi này. Cần cấu hình DB khẩn cấp nào để tự động ngắt
        kết nối treo?'
      options:
      - key: q2_opt_4_1
        label: Set cấu hình idle_in_transaction_session_timeout = '10s' ở mức Database
          Level.
      - key: q2_opt_4_2
        label: Tắt tính năng ACID transaction của PostgreSQL.
      - key: q2_opt_4_3
        label: Chuyển toàn bộ dữ liệu giao dịch sang lưu trong Redis.
    - key: q2_n5
      prompt: 'Bước 5: DB đã tạm thời giải phóng connection. Nhóm Dev chuẩn bị hot-fix
        code. Phương án tái cấu trúc code đúng nhất là gì?'
      options:
      - key: q2_opt_5_1
        label: Tách gọi HTTP Client ra ngoài phạm vi @Transactional, chỉ bao bọc DB
          operations trong Transaction.
      - key: q2_opt_5_2
        label: Xóa toàn bộ annotation @Transactional trong toàn bộ service.
      - key: q2_opt_5_3
        label: Tăng timeout của HTTP Client gọi sang Payment Gateway lên 120 giây.
    - key: q2_n6
      prompt: 'Bước 6: Khi soi code giữ chỗ nhiều ghế cùng lúc, bạn phát hiện Deadlock
        xảy ra do order lock không nhất quán (Thread 1 lock ghế A rồi B, Thread 2
        lock ghế B rồi A). Giải pháp fix?'
      options:
      - key: q2_opt_6_1
        label: Sắp xếp (Sort) danh sách seat_id theo thứ tự tăng dần trước khi thực
          hiện SELECT ... FOR UPDATE.
      - key: q2_opt_6_2
        label: Bỏ hẳn câu lệnh FOR UPDATE để không khóa dòng dữ liệu nữa.
      - key: q2_opt_6_3
        label: Thêm vòng lặp try-catch deadlock và sleep random mà không sửa thứ tự
          lock.
    - key: q2_n7
      prompt: 'Bước 7: Bản hot-fix đã được deploy lên Production. Bạn kiểm tra điều
        gì để đảm bảo sự cố đã hoàn toàn chấm dứt?'
      options:
      - key: q2_opt_7_1
        label: Giám sát pg_stat_activity, số lượng Deadlock count và HikariCP active
          connections trong 10 phút.
      - key: q2_opt_7_2
        label: Xóa toàn bộ log hệ thống để giải phóng dung lượng đĩa cứng.
      - key: q2_opt_7_3
        label: Đặt idle_in_transaction_session_timeout về lại 0 (không giới hạn).
    - key: q2_recovery
      prompt: 'Bước 8: Khôi phục thành công! Hệ thống không còn ghi nhận lỗi Deadlock,
        Connection Pool dư thừa > 60%, thời gian đặt vé trung bình giảm xuống còn
        150ms.'
      options:
      - key: q2_opt_8_1
        label: Nghiệm thu sự cố và hoàn tất Post-mortem.
  answer_key:
    option_effects:
      q2_opt_1_1:
        points: 10
        minutes_cost: 1
        next_node: q2_n2
        explanation: Chính xác! Query pg_stat_activity giúp nhận biết ngay trạng thái
          các connection đang bị treo.
      q2_opt_1_2:
        points: 0
        minutes_cost: 6
        next_node: q2_n1
        explanation: Sai. Tăng max_connections khi đang bị cạn tài nguyên sẽ làm DB
          quá tải RAM và crash hoàn toàn.
      q2_opt_1_3:
        points: 5
        minutes_cost: 4
        next_node: q2_n2
        explanation: Tốn thời gian. Khởi động lại backend không giải quyết được các
          connection đang bị nghẽn ở DB.
      q2_opt_2_1:
        points: 10
        minutes_cost: 1
        next_node: q2_n3
        explanation: Chính xác! Đây là lỗi Anti-pattern phổ biến. Gọi I/O ngoài trong
          DB transaction sẽ giữ connection vô thời hạn nếu bên ngoài chậm.
      q2_opt_2_2:
        points: 0
        minutes_cost: 5
        next_node: q2_n2
        explanation: Sai. Lỗi ở đây là idle in transaction chứ không phải do slow
          query quét bảng.
      q2_opt_2_3:
        points: 5
        minutes_cost: 3
        next_node: q2_n3
        explanation: Không tận gốc. Tăng pool size chỉ làm chậm thời điểm bùng phát
          sự cố.
      q2_opt_3_1:
        points: 10
        minutes_cost: 1
        next_node: q2_n4
        explanation: Rất tốt. pg_terminate_backend giúp hủy ngay lập tức các kết nối
          treo để giải phóng DB pool.
      q2_opt_3_2:
        points: 0
        minutes_cost: 8
        next_node: q2_n3
        explanation: Sai lầm cực lớn. Cài lại DB gây mất mát dữ liệu và kéo dài thời
          gian downtime.
      q2_opt_3_3:
        points: 5
        minutes_cost: 4
        next_node: q2_n4
        explanation: Thụ động. Chờ đợi trong thời điểm cao điểm sẽ làm gãy toàn bộ
          giao dịch mới.
      q2_opt_4_1:
        points: 10
        minutes_cost: 1
        next_node: q2_n5
        explanation: Tuyệt vời. Cấu hình này giúp DB tự bảo vệ khỏi các transaction
          treo quá 10 giây.
      q2_opt_4_2:
        points: 0
        minutes_cost: 5
        next_node: q2_n4
        explanation: Sai. Không thể bỏ tính năng ACID trong hệ thống tài chính/đặt
          vé.
      q2_opt_4_3:
        points: 5
        minutes_cost: 4
        next_node: q2_n5
        explanation: Không khả thi trong lúc khẩn cấp vì đòi hỏi thay đổi toàn bộ
          kiến trúc lưu trữ.
      q2_opt_5_1:
        points: 10
        minutes_cost: 1
        next_node: q2_n6
        explanation: Chuẩn xác. Tách I/O call khỏi Transaction là giải pháp triệt
          để.
      q2_opt_5_2:
        points: 0
        minutes_cost: 5
        next_node: q2_n5
        explanation: Bỏ @Transactional hoàn toàn sẽ dẫn đến sai lệch dữ liệu (Race
          Condition, sai lệch tiền/ghế).
      q2_opt_5_3:
        points: 5
        minutes_cost: 3
        next_node: q2_n6
        explanation: Tăng timeout chỉ làm tình trạng giữ lock diễn ra lâu hơn.
      q2_opt_6_1:
        points: 10
        minutes_cost: 1
        next_node: q2_n7
        explanation: Rất giỏi! Lock tài nguyên theo thứ tự cố định (Lock Ordering)
          là quy tắc vàng để loại bỏ Deadlock.
      q2_opt_6_2:
        points: 0
        minutes_cost: 5
        next_node: q2_n6
        explanation: Bỏ lock sẽ dẫn đến lỗi Overbooking (2 người đặt trùng 1 ghế).
      q2_opt_6_3:
        points: 5
        minutes_cost: 3
        next_node: q2_n7
        explanation: Retry chỉ là giải pháp tình thế, không triệt tiêu được nguồn
          gốc gây ra Deadlock.
      q2_opt_7_1:
        points: 10
        minutes_cost: 1
        next_node: q2_recovery
        explanation: Chính xác. Giám sát chặt chẽ các chỉ số để đảm bảo hệ thống đã
          thực sự an toàn.
      q2_opt_7_2:
        points: 5
        minutes_cost: 3
        next_node: q2_recovery
        explanation: Không nên. Xóa log làm mất dấu vết để truy vết nếu có sự cố lặp
          lại.
      q2_opt_7_3:
        points: 0
        minutes_cost: 4
        next_node: q2_n7
        explanation: Chủ quan. Nên duy trì idle_in_transaction_session_timeout hợp
          lý để bảo vệ DB lâu dài.
      q2_opt_8_1:
        points: 10
        minutes_cost: 0
        next_node: q2_recovery
        explanation: Hoàn thành xử lý sự cố xuất sắc!
    recovery_node: q2_recovery
  difficulty: hard
- content:
    scenario: Hệ thống Thanh toán trực tuyến báo lỗi 504 Gateway Timeout hàng loạt
      lúc 10:00 AM. Lượng giao dịch bị treo gia tăng nhanh chóng khiến khách hàng
      không thể hoàn tất đơn hàng.
    initial_logs: "[WARN] 2023-10-25 10:00:12 API-Gateway: 504 Timeout on POST /api/v1/payments/charge
      [ERROR] 2023-10-25 10:00:15 PaymentService: ConnectionPoolTimeoutException:
      Timeout waiting for connection from pool [METRIC] Redis_Connected_Clients: 1000/1000
      (Max reached) [METRIC] CPU_Usage: 15%, Memory_Usage: 42%"
    nodes:
    - key: q1_n1
      prompt: 'Bước 1: Hệ thống đang bị 504 Gateway Timeout. Bạn nên kiểm tra chỉ
        số nào đầu tiên để khoanh vùng sự cố?'
      options:
      - key: q1_n1_o1
        label: Kiểm tra log của PaymentService và các tài nguyên phụ thuộc như Redis/DB
      - key: q1_n1_o2
        label: Khởi động lại ngay lập tức toàn bộ dàn Server API Gateway
      - key: q1_n1_o3
        label: Tăng kích thước CPU và RAM cho server PaymentService
    - key: q1_n2
      prompt: 'Bước 2: Log cho thấy Redis client connection pool đạt mức tối đa (1000/1000).
        Bạn xử lý bước tiếp theo như thế nào?'
      options:
      - key: q1_n2_o1
        label: Xác minh các câu lệnh đang chạy trên Redis bằng lệnh CLIENT LIST hoặc
          MONITOR
      - key: q1_n2_o2
        label: Xóa toàn bộ Keys trong Redis bằng FLUSHALL
      - key: q1_n2_o3
        label: Khởi động lại Redis Server ngay lập tức
    - key: q1_n3
      prompt: 'Bước 3: Lệnh CLIENT LIST cho thấy hàng trăm kết nối mở từ PaymentService
        đang ở trạng thái idle nhưng không được đóng. Nguyên nhân khả dĩ nhất là gì?'
      options:
      - key: q1_n3_o1
        label: Mã nguồn mới deploy có lỗi rò rỉ kết nối (Connection Leak) không trả
          connection về pool
      - key: q1_n3_o2
        label: Redis Server bị hỏng phần cứng thanh ghi
      - key: q1_n3_o3
        label: Do nghẽn đường truyền mạng giữa Gateway và PaymentService
    - key: q1_n4
      prompt: 'Bước 4: Bạn kiểm tra lịch sử deployment gần nhất. Có bản release v2.4.1
        vừa đưa lên sản xuất lúc 09:45 AM. Bạn cần làm gì?'
      options:
      - key: q1_n4_o1
        label: So sánh Git diff phiên bản v2.4.1 và v2.4.0 tại module kết nối Redis
      - key: q1_n4_o2
        label: Tiếp tục theo dõi Dashboard trong 30 phút nữa
      - key: q1_n4_o3
        label: Viết script tự động restart PaymentService mỗi 5 phút
    - key: q1_n5
      prompt: 'Bước 5: Git diff chỉ ra đoạn mã v2.4.1 quên gọi jedis.close() trong
        khối finally khi truy vấn thông tin khuyến mãi. Bạn đưa ra giải pháp ngắn
        hạn khẩn cấp nào?'
      options:
      - key: q1_n5_o1
        label: Thực hiện Rollback ứng dụng PaymentService về phiên bản v2.4.0 ổn định
      - key: q1_n5_o2
        label: Sửa code ngay trên server Production và reload lại service
      - key: q1_n5_o3
        label: Tăng max-active connections của Redis Pool lên 10000
    - key: q1_n6
      prompt: 'Bước 6: Lệnh Rollback về v2.4.0 đang được thực hiện. Trong lúc chờ
        CI/CD deploy, các kết nối cũ vẫn chưa giải phóng. Bạn xử lý sao?'
      options:
      - key: q1_n6_o1
        label: Chạy lệnh KILL các kết nối idle trên Redis hoặc kill pod PaymentService
          cũ
      - key: q1_n6_o2
        label: Chờ đợi CI/CD chạy xong mà không can thiệp gì
      - key: q1_n6_o3
        label: Tắt toàn bộ Database Postgres
    - key: q1_n7
      prompt: 'Bước 7: Bản v2.4.0 đã rollback thành công. Bạn làm gì để xác nhận hệ
        thống đã khôi phục?'
      options:
      - key: q1_n7_o1
        label: Kiểm tra Redis Connected Clients và tỉ lệ lỗi 504 trên API Gateway
      - key: q1_n7_o2
        label: Đóng Ticket sự cố ngay lập tức
      - key: q1_n7_o3
        label: Bắt đầu code tính năng mới cho release tiếp theo
    - key: q1_n8_recovered
      prompt: 'Bước 8: Chỉ số Redis connection đã trở về mức an toàn (45/1000), tỉ
        lệ lỗi 504 về 0%. Bạn cần hành động gì để ngăn ngừa tái diễn?'
      options:
      - key: q1_n8_o1
        label: Tổ chức Post-mortem, bổ sung Static Code Analysis (SonarQube) và cảnh
          báo metric Redis connection pool
      - key: q1_n8_o2
        label: Không làm gì thêm vì sự cố đã giải quyết xong
      - key: q1_n8_o3
        label: Cấm tất cả mọi người sử dụng Redis trong project
  answer_key:
    option_effects:
      q1_n1_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n2
        explanation: Chẩn đoán chính xác dựa vào log và metric giúp phát hiện vấn
          đề cạn kiệt connection pool.
      q1_n1_o2:
        points: 0
        minutes_cost: 5
        next_node: q1_n2
        explanation: Khởi động lại Gateway không giải quyết được gốc rễ vấn đề cạn
          kiệt kết nối ở backend service.
      q1_n1_o3:
        points: 0
        minutes_cost: 5
        next_node: q1_n2
        explanation: Tăng RAM/CPU không giúp ích vì CPU/RAM vẫn thấp, vấn đề là do
          connection limit.
      q1_n2_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n3
        explanation: CLIENT LIST giúp xác định trạng thái các kết nối đến Redis một
          cách chính xác.
      q1_n2_o2:
        points: 0
        minutes_cost: 6
        next_node: q1_n3
        explanation: FLUSHALL xóa toàn bộ cache, có thể gây nổ DB phía sau và không
          đóng các connection hiện tại.
      q1_n2_o3:
        points: 5
        minutes_cost: 4
        next_node: q1_n3
        explanation: Restart Redis ngắt kết nối tạm thời nhưng ứng dụng sẽ nhanh chóng
          chiếm lại hết connection nếu chưa sửa code.
      q1_n3_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n4
        explanation: Trạng thái idle chiếm giữ connection không nhả là dấu hiệu điển
          hình của connection leak.
      q1_n3_o2:
        points: 0
        minutes_cost: 4
        next_node: q1_n4
        explanation: Lỗi phần cứng không gây ra hiện tượng đúng 1000 kết nối idle
          từ app.
      q1_n3_o3:
        points: 0
        minutes_cost: 4
        next_node: q1_n4
        explanation: Nghẽn mạng sẽ dẫn tới timeout/dropped packets chứ không giữ trạng
          thái idle tràn pool.
      q1_n4_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n5
        explanation: Kiểm tra thay đổi code gần nhất là phương pháp nhanh nhất định
          vị bug.
      q1_n4_o2:
        points: 0
        minutes_cost: 10
        next_node: q1_n5
        explanation: Theo dõi không làm dừng sự cố, lãng phí thời gian downtime.
      q1_n4_o3:
        points: 5
        minutes_cost: 5
        next_node: q1_n5
        explanation: Tự động restart chỉ là giải pháp tình thế rủi ro, gây gập gềnh
          dịch vụ.
      q1_n5_o1:
        points: 10
        minutes_cost: 2
        next_node: q1_n6
        explanation: Rollback về phiên bản chạy tốt gần nhất là quy trình chuẩn khôi
          phục dịch vụ nhanh nhất.
      q1_n5_o2:
        points: 0
        minutes_cost: 8
        next_node: q1_n6
        explanation: Sửa trực tiếp trên prod (hotpatch) dễ gây sai sót nghiêm trọng
          và vi phạm quy trình.
      q1_n5_o3:
        points: 5
        minutes_cost: 3
        next_node: q1_n6
        explanation: Tăng max connection chỉ trì hoãn thời điểm sập vì leak sẽ ngốn
          hết số connection mới.
      q1_n6_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n7
        explanation: Kill client / restart pod ngắt ngay lập tức các kết nối rò rỉ
          trong khi chờ bản rollback.
      q1_n6_o2:
        points: 5
        minutes_cost: 3
        next_node: q1_n7
        explanation: Chờ đợi tốn thêm vài phút gián đoạn dịch vụ của người dùng.
      q1_n6_o3:
        points: 0
        minutes_cost: 6
        next_node: q1_n7
        explanation: Tắt Postgres không liên quan và làm sự cố trầm trọng thêm.
      q1_n7_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n8_recovered
        explanation: Kiểm tra lại chỉ số kỹ thuật xác nhận hệ thống thực sự ổn định.
      q1_n7_o2:
        points: 0
        minutes_cost: 3
        next_node: q1_n8_recovered
        explanation: Đóng ticket mà không kiểm tra lại metric là thiếu trách nhiệm.
      q1_n7_o3:
        points: 0
        minutes_cost: 5
        next_node: q1_n8_recovered
        explanation: Bỏ qua bước xác nhận sau sự cố có thể bỏ sót rủi ro tiềm ẩn.
      q1_n8_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n8_recovered
        explanation: Post-mortem và bổ sung công cụ linter/alert phòng ngừa lỗi lặp
          lại trong tương lai.
      q1_n8_o2:
        points: 0
        minutes_cost: 2
        next_node: q1_n8_recovered
        explanation: Không rút kinh nghiệm sẽ dẫn tới sự cố tương tự sau này.
      q1_n8_o3:
        points: 0
        minutes_cost: 2
        next_node: q1_n8_recovered
        explanation: Cấm công nghệ một cách cảm tính không phải giải pháp kĩ thuật
          đúng đắn.
    recovery_node: q1_n8_recovered
  difficulty: medium
- content:
    scenario: Trang thương mại điện tử bị treo giao dịch đặt hàng trong giờ cao điểm
      Flash Sale. Người dùng báo lỗi 500 khi bấm 'Thanh Toán', CPU Cơ sở dữ liệu PostgreSQL
      vọt lên 100%.
    initial_logs: "[ERROR] 2023-10-25 12:01:05 OrderService: org.postgresql.util.PSQLException:
      ERROR: canceling statement due to lock timeout [METRIC] PostgreSQL Active Connections:
      200/200 (100% max_connections) [METRIC] DB CPU Usage: 99.8% [METRIC] Slow Queries:
      SELECT * FROM orders WHERE status = 'PENDING' FOR UPDATE"
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: DB CPU chạm mốc 100% và các truy vấn bị lock timeout. Hành
        động đầu tiên của bạn là gì?'
      options:
      - key: q2_n1_o1
        label: Truy vấn bảng pg_stat_activity để tìm các query đang bị khóa và query
          giữ khóa
      - key: q2_n1_o2
        label: Tắt bớt 50% số lượng Pod OrderService
      - key: q2_n1_o3
        label: Chạy VACUUM FULL ngay lập tức trên bảng orders
    - key: q2_n2
      prompt: 'Bước 2: Kết quả pg_stat_activity cho thấy một tiến trình Cronjob chạy
        ngầm (PID 4821) đang thực hiện ''UPDATE orders SET process_id = ...'' mà không
        có WHERE index, khóa toàn bộ bảng orders. Bạn làm gì tiếp theo?'
      options:
      - key: q2_n2_o1
        label: Dùng pg_cancel_backend(4821) hoặc pg_terminate_backend(4821) để hủy
          tiến trình gây nghẽn
      - key: q2_n2_o2
        label: Đợi Cronjob này tự hoàn thành
      - key: q2_n2_o3
        label: Khởi động lại máy chủ PostgreSQL primary
    - key: q2_n3
      prompt: 'Bước 3: Sau khi terminate PID 4821, CPU giảm về 40% nhưng sau 1 phút
        PID mới lại xuất hiện và gây khóa tiếp. Nguyên nhân do đâu?'
      options:
      - key: q2_n3_o1
        label: Cronjob runner có cơ chế tự retry hoặc lập lịch quá dày (mỗi phút 1
          lần) chưa bị tắt
      - key: q2_n3_o2
        label: Do virus tấn công database
      - key: q2_n3_o3
        label: Do ổ cứng SSD của Database bị lỗi ghi
    - key: q2_n4
      prompt: 'Bước 4: Bạn cần ngăn chặn Cronjob tiếp tục tự động kích hoạt tiến trình
        độc hại này trong giờ cao điểm. Giải pháp là gì?'
      options:
      - key: q2_n4_o1
        label: Tắt hoặc pause Schedule Job 'reconcile_orders_job' trên Kubernetes/Cron
          orchestrator
      - key: q2_n4_o2
        label: Đổi mật khẩu tài khoản postgres
      - key: q2_n4_o3
        label: Drop bảng orders và tạo lại
    - key: q2_n5
      prompt: 'Bước 5: Đã tắt Cronjob, hệ thống tạm thời ổn định trở lại. Bạn tiến
        hành phân tích mã nguồn của Cronjob này. Phát hiện điểm gì nguy hiểm?'
      options:
      - key: q2_n5_o1
        label: Query cập nhật thiếu index và thực hiện trong một transaction kéo dài
          chứa cả lệnh gọi HTTP API bên thứ 3
      - key: q2_n5_o2
        label: Code viết bằng ngôn ngữ Python thay vì Go
      - key: q2_n5_o3
        label: Cronjob sử dụng quá ít bộ nhớ RAM
    - key: q2_n6
      prompt: 'Bước 6: Để sửa triệt để câu truy vấn và logic Cronjob, nhóm phát triển
        cần thực hiện refactor nào?'
      options:
      - key: q2_n6_o1
        label: Phân trang (Batching), đánh index bổ sung cho cột tìm kiếm và đưa HTTP
          API call ra ngoài DB transaction
      - key: q2_n6_o2
        label: Tăng timeout của DB transaction lên 2 giờ
      - key: q2_n6_o3
        label: Bỏ hẳn không cần kiểm tra đối soát dữ liệu nữa
    - key: q2_n7
      prompt: 'Bước 7: Sau khi fix code Cronjob, bạn nên cấu hình lại lịch chạy như
        thế nào?'
      options:
      - key: q2_n7_o1
        label: 'Chuyển lịch chạy Cronjob nặng sang khung giờ thấp điểm (VD: 2:00 AM)'
      - key: q2_n7_o2
        label: Cho chạy liên tục mỗi 10 giây trong giờ Flash Sale
      - key: q2_n7_o3
        label: Giữ nguyên lịch chạy cũ
    - key: q2_n8_recovered
      prompt: 'Bước 8: Sự cố đã giải quyết hoàn toàn. Mọi giao dịch đặt hàng diễn
        ra mượt mà. Lợi ích lớn nhất rút ra là gì?'
      options:
      - key: q2_n8_o1
        label: Quy định rõ nguyên tắc không chạy batch job nặng giờ cao điểm và không
          giữ DB transaction khi gọi I/O bên ngoài
      - key: q2_n8_o2
        label: Nâng cấp server Database lên cấu hình gấp 10 lần
      - key: q2_n8_o3
        label: Sa thải lập trình viên viết đoạn code Cronjob
  answer_key:
    option_effects:
      q2_n1_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_n2
        explanation: Tra cứu pg_stat_activity là cách chuẩn nhất để tìm query gây
          ra lock trên PostgreSQL.
      q2_n1_o2:
        points: 0
        minutes_cost: 5
        next_node: q2_n2
        explanation: Giảm Pod OrderService làm giảm khả năng phục vụ khách hàng mà
          không giải quyết được query đang lock DB.
      q2_n1_o3:
        points: 0
        minutes_cost: 8
        next_node: q2_n2
        explanation: VACUUM FULL yêu cầu Exclusive Lock trên toàn bảng, sẽ làm hệ
          thống đóng băng hoàn toàn.
      q2_n2_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_n3
        explanation: pg_terminate_backend giúp giải phóng ngay lập tức lock mà tiến
          trình xấu đang nắm giữ.
      q2_n2_o2:
        points: 0
        minutes_cost: 10
        next_node: q2_n3
        explanation: Đợi câu lệnh không có index quét qua hàng triệu dòng trong giờ
          cao điểm sẽ tốn rất nhiều thời gian.
      q2_n2_o3:
        points: 5
        minutes_cost: 6
        next_node: q2_n3
        explanation: Restart DB làm ngắt gián đoạn toàn bộ dịch vụ và rủi ro mất mát
          kết nối dở dang.
      q2_n3_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_n4
        explanation: Nhận diện đúng việc kịch bản tự động lặp lại gây ra tái diễn
          sự cố.
      q2_n3_o2:
        points: 0
        minutes_cost: 4
        next_node: q2_n4
        explanation: Kết luận virus mà không có bằng chứng làm chẩn đoán đi sai hướng.
      q2_n3_o3:
        points: 0
        minutes_cost: 4
        next_node: q2_n4
        explanation: Lỗi phần cứng không sinh ra PID mới đúng theo chu kỳ schedule.
      q2_n4_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_n5
        explanation: Tắt scheduler của job nghẽn giúp dứt điểm nguồn gốc sinh ra transaction
          độc hại.
      q2_n4_o2:
        points: 0
        minutes_cost: 5
        next_node: q2_n5
        explanation: Đổi mật khẩu DB khiến toàn bộ dịch vụ hợp lệ khác bị mất kết
          nối.
      q2_n4_o3:
        points: 0
        minutes_cost: 10
        next_node: q2_n5
        explanation: Drop bảng dữ liệu giao dịch là thảm họa mất mát dữ liệu nghiêm
          trọng.
      q2_n5_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_n6
        explanation: Giữ transaction mở trong lúc đợi HTTP API call là antipattern
          nguy hiểm gây ra lock kéo dài.
      q2_n5_o2:
        points: 0
        minutes_cost: 3
        next_node: q2_n6
        explanation: Ngôn ngữ lập trình không phải nguyên nhân gây lock DB mà là do
          tư duy thiết kế truy vấn.
      q2_n5_o3:
        points: 0
        minutes_cost: 3
        next_node: q2_n6
        explanation: RAM của cronjob không liên quan đến việc lock row/table dưới
          Database.
      q2_n6_o1:
        points: 10
        minutes_cost: 3
        next_node: q2_n7
        explanation: Chia nhỏ batch, thêm index và tách network call ra khỏi DB transaction
          là giải pháp chuẩn chỉnh.
      q2_n6_o2:
        points: 0
        minutes_cost: 5
        next_node: q2_n7
        explanation: Tăng timeout chỉ khiến việc giữ lock lâu hơn và hệ thống bị ngưng
          trệ nặng hơn.
      q2_n6_o3:
        points: 0
        minutes_cost: 3
        next_node: q2_n7
        explanation: Bỏ nghiệp vụ đối soát dẫn tới rủi ro sai lệch tài chính.
      q2_n7_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_n8_recovered
        explanation: Lập lịch công việc nặng vào giờ thấp điểm giúp tránh xung đột
          tài nguyên với người dùng.
      q2_n7_o2:
        points: 0
        minutes_cost: 5
        next_node: q2_n8_recovered
        explanation: Chạy dày đặc trong giờ cao điểm chắc chắn sẽ tái diễn nghẽn DB.
      q2_n7_o3:
        points: 0
        minutes_cost: 3
        next_node: q2_n8_recovered
        explanation: Giữ lịch cũ không rút kinh nghiệm sẽ tiềm ẩn nguy cơ cho đợt
          Sale sau.
      q2_n8_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_n8_recovered
        explanation: Đưa ra quy định chuẩn về thiết kế DB transaction giúp hệ thống
          phát triển bền vững.
      q2_n8_o2:
        points: 5
        minutes_cost: 3
        next_node: q2_n8_recovered
        explanation: Tăng cấu hình tốn chi phí nhưng không giải quyết được vấn đề
          lock thuật toán.
      q2_n8_o3:
        points: 0
        minutes_cost: 2
        next_node: q2_n8_recovered
        explanation: Sa thải nhân sự không giúp cải thiện quy trình kỹ thuật và chất
          lượng hệ thống.
    recovery_node: q2_n8_recovered
  difficulty: hard
- content:
    scenario: Hệ thống thanh toán E-commerce bị treo vào giờ cao điểm sale 11/11.
      Người dùng báo lỗi HTTP 500 liên tục khi ấn bấm nút Thanh Toán.
    initial_logs: |-
      [ERROR] 2023-11-11 20:01:12.411 [http-nio-8080-exec-42] c.z.h.p.HikariPool - HikariPool-1 - Connection is not available, request timed out after 30000ms.
      [WARN] active=50/50, idle=0, waiting=142
    nodes:
    - key: q1_node_1
      prompt: Hệ thống báo lỗi không lấy được DB Connection. Bạn sẽ thực hiện bước
        kiểm tra ban đầu nào?
      options:
      - key: q1_n1_opt1
        label: Kiểm tra APM (Datadog/Grafana) xem метrik Database và Connection Pool
      - key: q1_n1_opt2
        label: Khởi động lại ngay lập tức service Payment API để giải phóng connection
      - key: q1_n1_opt3
        label: Tăng ngay maximum pool size trong application.yml từ 50 lên 200 và
          redeploy
    - key: q1_node_2
      prompt: APM hiển thị HikariPool luôn ở trạng thái 50/50 active connections.
        DB CPU tăng vọt lên 98%. Bạn sẽ kiểm tra gì tiếp theo trong PostgreSQL?
      options:
      - key: q1_n2_opt1
        label: Truy vấn view pg_stat_activity để tìm các query đang ở trạng thái active
          và running lâu
      - key: q1_n2_opt2
        label: Thực hiện nâng cấp phần cứng DB Server (Scale up CPU/RAM)
      - key: q1_n2_opt3
        label: Reboot lại instance Database Master
    - key: q1_node_3
      prompt: 'Kết quả pg_stat_activity cho thấy hàng chục query: ''SELECT * FROM
        orders WHERE status = ''PENDING'' ORDER BY created_at DESC'' đang chạy > 45
        giây. Bạn làm gì tiếp theo?'
      options:
      - key: q1_n3_opt1
        label: Chạy EXPLAIN ANALYZE cho câu query trên để xem execution plan
      - key: q1_n3_opt2
        label: Chạy ngay lệnh pg_terminate_backend() để kill toàn bộ session
      - key: q1_n3_opt3
        label: 'Thêm ngay index thường: CREATE INDEX idx_orders_status ON orders(status)'
    - key: q1_node_4
      prompt: EXPLAIN ANALYZE chỉ ra Postgres đang thực hiện Sequential Scan trên
        bảng orders (20 triệu dòng) vì thiếu index cho cột status. Cách xử lý index
        tối ưu lúc này là gì?
      options:
      - key: q1_n4_opt1
        label: 'Tạo index bất đồng bộ bằng: CREATE INDEX CONCURRENTLY idx_orders_status
          ON orders(status)'
      - key: q1_n4_opt2
        label: 'Tạo index thông thường: CREATE INDEX idx_orders_status ON orders(status)'
      - key: q1_n4_opt3
        label: Xóa bớt dữ liệu cũ trong bảng orders để giảm dung lượng
    - key: q1_node_5
      prompt: Index CONCURRENTLY đang được tạo ở background, nhưng các connection
        cũ treo quá lâu vẫn đang ngốn hết Connection Pool. Bạn giải quyết thế nào?
      options:
      - key: q1_n5_opt1
        label: Dùng pg_cancel_backend() hoặc pg_terminate_backend() ngắt các query
          PENDING đang bị treo quá 30s
      - key: q1_n5_opt2
        label: Kiên nhẫn chờ index tạo xong hoàn toàn mà không can thiệp
      - key: q1_n5_opt3
        label: Flush toàn bộ bộ nhớ Cache trên Redis
    - key: q1_node_6
      prompt: Sau khi cancel các query treo, connection bắt đầu nhả ra. Index CONCURRENTLY
        vừa hoàn tất. Bạn xác nhận hiệu năng ra sao?
      options:
      - key: q1_n6_opt1
        label: Chạy lại EXPLAIN ANALYZE và kiểm tra pg_stat_user_indexes xem Index
          Scan được dùng chưa
      - key: q1_n6_opt2
        label: Tăng statement_timeout của Database lên 10 phút
      - key: q1_n6_opt3
        label: Reload lại Nginx Reverse Proxy
    - key: q1_node_7
      prompt: Query thời gian phản hồi đã giảm từ 45s xuống 3ms. Hệ thống đã xử lý
        xong nghẽn. Cần phòng ngừa sự cố này lặp lại như thế nào?
      options:
      - key: q1_n7_opt1
        label: Cấu hình statement_timeout cho DB và thêm kiểm tra migration index
          trong quy trình CI/CD
      - key: q1_n7_opt2
        label: Giữ nguyên cấu hình hiện tại không cần làm gì thêm
      - key: q1_n7_opt3
        label: Tắt hẳn tính năng logging của Database để tăng tốc
    - key: q1_node_rec
      prompt: Sự cố đã được khắc phục hoàn toàn. Tỷ lệ lỗi HTTP 500 về 0%, HikariPool
        hoạt động ổn định ở mức 10-15/50 active connections.
      options:
      - key: q1_rec_opt1
        label: Hoàn tất ghi nhận Incident Post-mortem và đóng ticket
  answer_key:
    option_effects:
      q1_n1_opt1:
        points: 10
        minutes_cost: 1
        next_node: q1_node_2
        explanation: Chẩn đoán qua APM giúp xác định chính xác nghẽn ở đâu trước khi
          hành động.
      q1_n1_opt2:
        points: 0
        minutes_cost: 5
        next_node: q1_node_2
        explanation: Restart service chỉ giải phóng tạm thời connection trong vài
          giây rồi lại đầy tiếp, gây gián đoạn dịch vụ.
      q1_n1_opt3:
        points: 0
        minutes_cost: 8
        next_node: q1_node_2
        explanation: Tăng max connection mà không giải quyết query chậm sẽ khiến Database
          quá tải nặng hơn và nghẽn CPU.
      q1_n2_opt1:
        points: 10
        minutes_cost: 1
        next_node: q1_node_3
        explanation: pg_stat_activity giúp hiển thị chính xác câu lệnh SQL nào đang
          chiếm giữ connection.
      q1_n2_opt2:
        points: 5
        minutes_cost: 10
        next_node: q1_node_3
        explanation: Scale up tốn thời gian mà không giải quyết được căn nguyên lỗi
          do thiếu index.
      q1_n2_opt3:
        points: 0
        minutes_cost: 7
        next_node: q1_node_3
        explanation: Reboot DB gây gián đoạn toàn bộ dịch vụ và làm mất dữ liệu giao
          dịch đang dở dở.
      q1_n3_opt1:
        points: 10
        minutes_cost: 1
        next_node: q1_node_4
        explanation: EXPLAIN ANALYZE giúp xác định chính xác query plan và lý do query
          chạy chậm.
      q1_n3_opt2:
        points: 0
        minutes_cost: 4
        next_node: q1_node_4
        explanation: Kill session ngay mà không phân tích nguyên nhân sẽ khiến các
          query mới sinh ra lại tiếp tục bị treo.
      q1_n3_opt3:
        points: 5
        minutes_cost: 6
        next_node: q1_node_4
        explanation: CREATE INDEX thường trên bảng lớn đang chịu tải cao sẽ gây Table
          Lock toàn bộ bảng orders.
      q1_n4_opt1:
        points: 10
        minutes_cost: 2
        next_node: q1_node_5
        explanation: CREATE INDEX CONCURRENTLY giúp tạo index mà không khóa các thao
          tác WRITE/READ trên bảng.
      q1_n4_opt2:
        points: 0
        minutes_cost: 8
        next_node: q1_node_5
        explanation: Tạo index thường sẽ lock bảng, làm treo tất cả giao dịch thanh
          toán mới.
      q1_n4_opt3:
        points: 0
        minutes_cost: 15
        next_node: q1_node_5
        explanation: Xóa dữ liệu trong lúc sự cố nguy hiểm và có thể gây mất mát dữ
          liệu kế toán.
      q1_n5_opt1:
        points: 10
        minutes_cost: 2
        next_node: q1_node_6
        explanation: Terminate các query treo giải phóng ngay lập tức connection để
          tiếp nhận traffic mới.
      q1_n5_opt2:
        points: 5
        minutes_cost: 6
        next_node: q1_node_6
        explanation: Chờ đợi mất thời gian vì các connection cũ vẫn tiếp tục giữ pool
          gây lỗi 500.
      q1_n5_opt3:
        points: 0
        minutes_cost: 3
        next_node: q1_node_6
        explanation: Vấn đề ở DB relational, flush Redis không liên quan và làm tăng
          tải lên DB.
      q1_n6_opt1:
        points: 10
        minutes_cost: 1
        next_node: q1_node_7
        explanation: Kiểm tra lại xem Postgres đã dùng Index Scan chưa để xác nhận
          xử lý triệt để.
      q1_n6_opt2:
        points: 0
        minutes_cost: 3
        next_node: q1_node_7
        explanation: Tăng timeout quá cao sẽ làm hỏng khả năng tự phục hồi của ứng
          dụng.
      q1_n6_opt3:
        points: 5
        minutes_cost: 2
        next_node: q1_node_7
        explanation: Reload Nginx không có tác dụng trong trường hợp nghẽn ở tầng
          Database.
      q1_n7_opt1:
        points: 10
        minutes_cost: 2
        next_node: q1_node_rec
        explanation: Thiết lập timeout giúp tự động kill query hỏng và linter migration
          ngăn thiếu index khi deploy.
      q1_n7_opt2:
        points: 5
        minutes_cost: 1
