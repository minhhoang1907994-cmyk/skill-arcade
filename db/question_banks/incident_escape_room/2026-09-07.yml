      opt_5_1:
        points: 10
        minutes_cost: 2
        next_node: n6_patch
        explanation: Chính xác. Giới hạn lưu lượng đầu vào giúp DB có khoảng thở để
          ứng dụng chuẩn bị hotfix.
      opt_5_2:
        points: 0
        minutes_cost: 5
        next_node: n5_pool_tune
        explanation: Tăng pool size mỗi Pod sẽ nhân số connection vượt quá khả năng
          chịu đựng của DB.
      opt_5_3:
        points: 5
        minutes_cost: 3
        next_node: n6_patch
        explanation: Tốn thời gian điều hướng traffic nhưng không khắc phục triệt
          để lỗi logic.
      opt_6_1:
        points: 10
        minutes_cost: 2
        next_node: n7_verify
        explanation: Đánh giá rất tốt! Khối finally đảm bảo giải phóng connection,
