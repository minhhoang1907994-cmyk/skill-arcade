      - key: q2_opt_7_2
        label: Sử dụng từ khóa delete để xóa toàn bộ thuộc tính sau mỗi 1000 request.
      - key: q2_opt_7_3
        label: Chuyển mảng toàn cục sang dùng biến local bên trong hàm.
      - key: q2_opt_7_4
        label: Ép buộc Node.js gọi global.gc() thủ công sau mỗi request.
    - key: q2_n8
      prompt: 'Bước 8: Bạn tiến hành CI/CD deploy bản fix và kiểm thử lại. Hành động
        nào giúp xác nhận Memory Leak đã khắc phục triệt để?'
      options:
