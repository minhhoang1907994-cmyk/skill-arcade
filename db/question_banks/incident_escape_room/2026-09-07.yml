  difficulty: medium
- content:
    scenario: Dịch vụ Xác thực (Auth Service) bị lỗi chập chờn. Người dùng liên tục
      bị văng đăng xuất và nhận lỗi HTTP 500 khi gửi Access Token.
    initial_logs: |-
      [ERROR] RedisCommandExecutionException: OOM command not allowed when used memory > 'maxmemory'.
      [WARN] Memory usage: 8.00GB / 8.00GB (100.00%). Evicted keys: 0.
    nodes:
    - key: q2_node_1
      prompt: Redis báo lỗi OOM (Out of Memory). Bạn chọn cách kiểm tra thông tin
        bộ nhớ Redis đầu tiên thế nào?
      options:
      - key: q2_n1_opt1
        label: Dùng lệnh INFO memory và CONFIG GET maxmemory-policy trong redis-cli
      - key: q2_n1_opt2
        label: Khởi động lại ngay lập tức Redis Server
      - key: q2_n1_opt3
        label: Chạy lệnh FLUSHALL để giải phóng bộ nhớ ngay lập tức
    - key: q2_node_2
      prompt: INFO memory cho thấy used_memory = 8GB, maxmemory-policy = noeviction.
        Tại sao Redis lại báo lỗi OOM khi đầy RAM?
      options:
      - key: q2_n2_opt1
        label: Chính sách noeviction từ chối ghi thêm dữ liệu khi hết bộ nhớ thay
          vì xóa key cũ
      - key: q2_n2_opt2
        label: Do Redis chưa được bật tính năng Persistence RDB/AOF
      - key: q2_n2_opt3
        label: Do bản nâng cấp Redis bị lỗi phân mảnh bộ nhớ
    - key: q2_node_3
      prompt: Bạn cần tìm ra loại key nào đang chiếm phần lớn bộ nhớ trong Redis mà
        không làm sập server production. Dùng cách nào?
      options:
      - key: q2_n3_opt1
        label: Dùng công cụ redis-cli --bigkeys hoặc lệnh SCAN để phân tích mẫu key
      - key: q2_n3_opt2
        label: Chạy lệnh KEYS * để liệt kê toàn bộ key trong Redis
      - key: q2_n3_opt3
        label: Xóa thủ công tất cả các key chứa chữ 'session'
    - key: q2_node_4
      prompt: Kết quả --bigkeys cho thấy hàng triệu key pattern `audit_log:*` đang
        chiếm 85% RAM và KHÔNG CÓ TTL (Time-To-Live). Cách xóa an toàn là gì?
      options:
      - key: q2_n4_opt1
        label: Dùng script SCAN kết hợp lệnh UNLINK theo batch nhỏ để xóa bất đồng
          bộ
      - key: q2_n4_opt2
        label: Dùng DEL audit_log:* để xóa một lần tất cả các key này
      - key: q2_n4_opt3
        label: Xóa file dump.rdb trên đĩa cứng rồi restart Redis
    - key: q2_node_5
      prompt: Bộ nhớ đã giảm về 2GB nhưng các key `audit_log:*` mới vẫn tiếp tục được
        sinh ra liên tục mà không có TTL. Bạn sẽ tìm nguyên nhân ở đâu?
      options:
      - key: q2_n5_opt1
        label: Kiểm tra mã nguồn Auth Service ở đoạn ghi audit log vào Redis
      - key: q2_n5_opt2
        label: Sửa file cấu hình Redis redis.conf đặt timeout = 60
      - key: q2_n5_opt3
        label: Tắt tính năng Audit Log trên Nginx Ingress
    - key: q2_node_6
      prompt: Phát hiện dev mới thêm tính năng ghi audit log vào Redis nhưng quên
        gọi `EXPIRE` và ghi sai chỗ thay vì đẩy vào Log Management. Bạn sửa sao?
      options:
      - key: q2_n6_opt1
        label: 'Hotfix code: Chuyển ghi audit log sang Kafka/Elasticsearch và thêm
          TTL ngắn nếu tạm lưu ở Redis'
      - key: q2_n6_opt2
        label: Đặt maxmemory-policy = volatile-lru trên Redis rồi kệ code cũ
      - key: q2_n6_opt3
        label: Tắt hoàn toàn Auth Service để sửa code từ từ
    - key: q2_node_7
      prompt: Hotfix đã được deploy thành công. Bạn cần làm gì để xác nhận hệ thống
        đã lấy lại sự ổn định hoàn toàn?
      options:
      - key: q2_n7_opt1
        label: Theo dõi đồ thị Redis Memory, tỷ lệ Eviction và HTTP status 200 trên
          Grafana
      - key: q2_n7_opt2
        label: Reboot toàn bộ Kubernetes Cluster
      - key: q2_n7_opt3
        label: Xóa toàn bộ Cache ở CDN Front-end
    - key: q2_node_rec
      prompt: Redis memory duy trì ổn định ở 1.5GB, không còn lỗi OOM, tính năng Login
        hoạt động mượt mà.
      options:
      - key: q2_rec_opt1
        label: Cập nhật Alerting threshold cho Redis RAM > 80% và hoàn tất Post-mortem
  answer_key:
    option_effects:
      q2_n1_opt1:
        points: 10
        minutes_cost: 1
        next_node: q2_node_2
        explanation: Đánh giá đúng trạng thái memory và eviction policy hiện tại của
