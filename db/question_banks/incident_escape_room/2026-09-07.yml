      options:
      - key: q2_opt_2_1
        label: Kiểm tra biểu đồ Memory Usage (RSS & Heap Used) trên Dashboard Grafana.
      - key: q2_opt_2_2
        label: Khởi động lại toàn bộ microservices phụ thuộc.
      - key: q2_opt_2_3
        label: Đo dung lượng băng thông mạng incoming network traffic.
      - key: q2_opt_2_4
        label: Xóa tất cả keys trên Redis Server.
    - key: q2_n3
      prompt: 'Bước 3: Biểu đồ cho thấy Heap Used tăng theo đường thẳng và không hề
        giảm sau Garbage Collection. Bạn thu thập dữ liệu gì để phân tích sâu?'
      options:
      - key: q2_opt_3_1
        label: Trích xuất Heap Snapshot (Heap Dump) của Node.js để phân tích object
