      q2_opt_3_2:
        points: 0
        minutes_cost: 5
        next_node: q2_n3
        explanation: Đánh giá sai hoàn toàn kết quả chẩn đoán từ `--bigkeys`.
      q2_opt_3_3:
        points: 5
        minutes_cost: 3
        next_node: q2_n4
        explanation: Lẫn lộn giữa lỗi băng thông mạng và lỗi tràn bộ nhớ.
      q2_opt_4_1:
        points: 10
        minutes_cost: 1
        next_node: q2_n5
        explanation: Chuẩn xác. Chuyển sang LRU giúp Redis tự đào thải key cũ và nhận
