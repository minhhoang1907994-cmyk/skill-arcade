      - key: q2_opt_5_2
        label: Lỗi do Node.js runtime không tự chạy Garbage Collection.
      - key: q2_opt_5_3
        label: Lỗi do cấu hình cờ --max-old-space-size của V8 engine.
      - key: q2_opt_5_4
