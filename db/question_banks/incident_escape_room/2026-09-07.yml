      - key: opt_8_2
        label: Rebuild lại toàn bộ Database Indexes.
      - key: opt_8_3
        label: Đóng ticket sự cố ngay lập tức mà không cần theo dõi thêm.
      - key: opt_8_4
        label: Giảm bớt tham số max_connections về mức tối thiểu.
    - key: rec_node_1
      prompt: Sự cố đã được khắc phục hoàn toàn! Hệ thống thanh toán hoạt động ổn
        định trở lại.
