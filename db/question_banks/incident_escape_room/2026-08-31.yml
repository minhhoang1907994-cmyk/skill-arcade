        thống chạy?
      options:
      - key: s2_o10
        label: Đặt giới hạn tối đa số bản ghi (MAX_ROWS_LIMIT = 50000) trên API Gateway
          / Worker Config tạm thời.
      - key: s2_o11
        label: Khởi động lại toàn bộ Kubernetes Cluster.
      - key: s2_o12
        label: Xóa bớt dữ liệu lịch sử trong DB để giảm số bản ghi.
    - key: s2_n5
      prompt: Bản hotfix ứng dụng cơ chế Stream (`report-worker:v1.2.1-fix`) đã build
        xong docker image. Bạn deploy như thế nào?
      options:
      - key: s2_o13
        label: Deploy lên môi trường Staging kiểm thử stream với dataset lớn, sau
          đó áp dụng Rolling Update trên Prod.
      - key: s2_o14
        label: SSH vào Pod production rồi đè file JavaScript trực tiếp.
      - key: s2_o15
        label: Deploy thẳng bản fix lên tất cả server Prod không qua Staging.
    - key: s2_n6
      prompt: Bản fix đã được deploy xong. Bạn kiểm tra lại chỉ số bộ nhớ RAM trên
        Grafana như thế nào?
      options:
      - key: s2_o16
        label: 'Theo dõi biểu đồ RAM Worker: Duy trì mức ~150MB phẳng ngay cả khi
          đang stream file dữ liệu lớn.'
      - key: s2_o17
        label: Thấy RAM tăng lên 1.9GiB rồi đứng yên là đạt yêu cầu.
      - key: s2_o18
        label: Tắt công cụ giám sát Prometheus để tiết kiệm tài nguyên.
    - key: s2_n7
      prompt: Tenant ID 8810 đã xuất thành công file báo cáo 3 triệu bản ghi mà Pod
