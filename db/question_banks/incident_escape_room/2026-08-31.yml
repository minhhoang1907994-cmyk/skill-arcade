      q1_n1_o3:
        points: 5
        minutes_cost: 3
        next_node: q1_n2
        explanation: 'Tạm thời: Tăng pool size có thể bớt nghẽn trong vài phút nhưng
          làm DB quá tải nặng hơn nếu chưa tìm nguyên nhân giữ connection.'
      q1_n2_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n3
        explanation: 'Chính xác: pg_stat_activity giúp soi rõ query nào đang chạy,
          query nào đang chờ lock.'
      q1_n2_o2:
        points: 0
        minutes_cost: 4
        next_node: q1_n2
        explanation: 'Sai lầm: Flush Redis làm tăng tải lên DB, khiến tình trạng cạn
          kiệt connection trầm trọng hơn.'
      q1_n2_o3:
        points: 5
        minutes_cost: 2
        next_node: q1_n3
        explanation: 'Ít tác dụng: Log Nginx chỉ phản ánh lưu lượng truy cập, không
          chỉ ra được nguyên nhân nghẽn DB connection.'
      q1_n3_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n4
        explanation: 'Chính xác: SELECT FOR UPDATE giữ row lock. Nếu mã nguồn thực
          hiện tác vụ chậm bên trong transaction, lock sẽ bị giữ quá lâu.'
      q1_n3_o2:
        points: 0
        minutes_cost: 6
        next_node: q1_n3
        explanation: 'Sai lầm: Xóa index làm query quét Full Table Scan, khiến performance
          sụt giảm nghiêm trọng.'
      q1_n3_o3:
        points: 0
        minutes_cost: 8
        next_node: q1_n3
        explanation: 'Rất nguy hiểm: Restart DB trong lúc cao điểm gây gián đoạn toàn
          bộ hệ thống và có thể làm hỏng transaction dở dang.'
      q1_n4_o1:
        points: 10
        minutes_cost: 2
        next_node: q1_n5
        explanation: 'Chính xác: Lỗi Anti-pattern điển hình khi đưa I/O network call
          (gọi API ngoài) vào trong Database Transaction.'
      q1_n4_o2:
        points: 0
        minutes_cost: 4
        next_node: q1_n4
        explanation: 'Sai kiến thức: Lời gọi HTTP do ứng dụng Backend thực hiện, không
          liên quan tới khả năng của PostgreSQL.'
      q1_n4_o3:
        points: 0
        minutes_cost: 4
        next_node: q1_n4
        explanation: 'Tồi tệ hơn: Tăng timeout HTTP sẽ khiến DB connection bị chiếm
          giữ lâu hơn nữa.'
      q1_n5_o1:
        points: 10
        minutes_cost: 2
        next_node: q1_n6
        explanation: 'Chính xác: Chỉ mở transaction khi cần đọc/ghi DB khẩn cấp, đưa
          các tác vụ I/O lề mề ra ngoài scope transaction.'
      q1_n5_o2:
        points: 5
        minutes_cost: 4
        next_node: q1_n6
        explanation: 'Chữa cháy kém: Tăng pool size sẽ sớm bị lấp đầy lại vì API ngoài
          vẫn bị nghẽn.'
      q1_n5_o3:
        points: 0
        minutes_cost: 5
        next_node: q1_n5
        explanation: 'Nguy hiểm: READ UNCOMMITTED gây ra Dirty Read, làm sai lệch
          dữ liệu tồn kho nghiêm trọng.'
      q1_n6_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n7
        explanation: 'Chính xác: Triển khai chuẩn CI/CD rolling update đảm bảo zero-downtime.'
      q1_n6_o2:
        points: 0
        minutes_cost: 5
        next_node: q1_n6
        explanation: 'Rủi ro cao: Sửa live bytecode trên prod dễ gây hư hỏng bộ nhớ
          và khó kiểm soát version.'
      q1_n6_o3:
        points: 0
        minutes_cost: 7
        next_node: q1_n6
        explanation: 'Sai lầm: Rollback lại mất các tính năng mới và không giải quyết
          được vấn đề nếu code cũ cũng có bug này.'
      q1_n7_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n8
        explanation: 'Chính xác: Giải phóng ngay các backend process còn đọng lock
