        ghi vào một mảng JavaScript duy nhất trong RAM trước khi tạo file Excel.
      options:
      - key: s2_o7
        label: Refactor code chuyển sang cơ chế Stream Data / Cursor Pagination kết
          hợp Stream Write file.
      - key: s2_o8
