- content:
    scenario: Dịch vụ xử lý sự kiện `payment-consumer` chạy trong Kubernetes bị sập
      liên tục. Các Pod tự động restart với lý do OOMKilled (Exit Code 137). Kafka
      lag của topic `payment-events` tăng nhanh nguy cơ tràn bộ đệm.
    initial_logs: |-
      2023-10-24 14:10:05.112 [INFO] KafkaConsumer - Subscribed to topic: payment-events
      2023-10-24 14:12:30.890 [WARN] Node.js Runtime - Heap memory usage: 1.85 GB / 2.00 GB limit
      K8s Event: Pod payment-consumer-7d9b4f-x29zk terminated with status OOMKilled (Exit Code 137)
    nodes:
    - key: q2_node_1
      prompt: Pod liên tục bị ngắt do vượt quá giới hạn RAM (OOMKilled). Bạn sẽ tiến
        hành kiểm tra công cụ/thông tin nào đầu tiên?
      options:
      - key: opt_q2_1_1
        label: Trích xuất Heap Dump của Pod trước khi bị crash và kiểm tra Grafana
          Memory metrics.
      - key: opt_q2_1_2
        label: Tăng giới hạn Memory limit trong K8s deployment từ 2GB lên 16GB lập
          tức.
      - key: opt_q2_1_3
        label: Xóa bớt tin nhắn trên Kafka topic `payment-events` để giảm tải.
    - key: q2_node_2
      prompt: Phân tích Heap Dump cho thấy hàng triệu object `EventEmitter` và `EventListener`
        chiếm tới 82% dung lượng Heap Memory. Nguyên nhân khả dĩ nhất là gì?
      options:
      - key: opt_q2_2_1
        label: Ứng dụng bị rò rỉ bộ nhớ (Memory Leak) do đăng ký `eventListener` bên
          trong hàm xử lý mỗi tin nhắn Kafka mà không remove.
      - key: opt_q2_2_2
        label: Thư viện Kafka Client bị lỗi ngốn RAM.
      - key: opt_q2_2_3
        label: Định dạng JSON của message từ Kafka quá lớn.
    - key: q2_node_3
      prompt: "Kiểm tra mã nguồn phát hiện đoạn code sau:\n`kafkaConsumer.eachMessage(async
        ({ message }) => { process.on('uncaughtException', handler); ... });` \nMỗi
        message đến lại đính thêm 1 listener toàn cục! Bạn chọn biện pháp xử lý tạm
        thời nào để dừng hiện tượng OOM?"
      options:
      - key: opt_q2_3_1
        label: Tạm thời tăng replicas và tăng memory limit thêm 50% để kìm hãm tốc
          độ OOM trong lúc sửa code.
      - key: opt_q2_3_2
        label: Restart Pod mỗi 5 phút bằng CronJob K8s.
      - key: opt_q2_3_3
        label: Chuyển Kafka sang mô hình Poll thủ công từng tin nhắn một.
    - key: q2_node_4
      prompt: Trong khi hệ thống tạm thời chạy được nhờ tăng tài nguyên, Kafka Lag
        đang đạt 120,000 messages. Bạn làm gì để đẩy nhanh tốc độ xử lý hàng chờ?
      options:
      - key: opt_q2_4_1
        label: Tăng số lượng Partition của Kafka Topic và Scale Out số lượng Pod Consumer
          tương ứng.
      - key: opt_q2_4_2
        label: Bỏ qua (skip) các message cũ trên Kafka để giảm lag về 0.
      - key: opt_q2_4_3
        label: Gộp tất cả tin nhắn lại thành 1 batch khổng lồ để xử lý.
    - key: q2_node_5
      prompt: Bây giờ bạn sửa lỗi Memory Leak trong mã nguồn. Phương án sửa mã nguồn
        nào là đúng đắn chuẩn mực nhất?
      options:
      - key: opt_q2_5_1
        label: Di chuyển việc đăng ký listener ra ngoài hàm `eachMessage` hoặc dùng
          `process.once()` thích hợp.
      - key: opt_q2_5_2
        label: Thêm lệnh `process.removeAllListeners()` ở cuối mỗi vòng lặp `eachMessage`.
      - key: opt_q2_5_3
        label: Gọi hàm `global.gc()` thủ công ở cuối hàm xử lý message.
    - key: q2_node_6
      prompt: Code sửa xong đã chạy Unit Test thành công. Bạn cần thực hiện kiểm thử
        gì trước khi deploy bản sửa lên Production?
      options:
      - key: opt_q2_6_1
        label: Chạy Load Test/Staging Test với dung lượng message lớn và theo dõi
          đồ thị Heap Retention qua thời gian.
      - key: opt_q2_6_2
        label: Deploy thẳng lên Prod vì Unit Test đã pass.
      - key: opt_q2_6_3
        label: So sánh dung lượng file `.js` sau khi build.
    - key: q2_node_7
      prompt: Đã deploy bản fix lên Prod. Sau 15 phút theo dõi, chỉ số Heap Memory
        của Consumer ổn định ở mức 210MB, Kafka Lag giảm về 0. Bạn thực hiện thao
        tác tài nguyên nào tiếp theo?
      options:
      - key: opt_q2_7_1
        label: Scale down số Pod và điều chỉnh Memory Limit/Request về lại định mức
          an toàn ban đầu.
      - key: opt_q2_7_2
        label: Giữ nguyên số Pod và Memory cao đỉnh điểm như vậy vĩnh viễn.
