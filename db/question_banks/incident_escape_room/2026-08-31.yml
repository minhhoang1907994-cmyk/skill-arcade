- content:
    scenario: Hệ thống Thanh toán (Checkout Service) bị nghẽn đột ngột trong giờ Flash
      Sale. Thời gian phản hồi tăng từ 120ms lên 8500ms, tỷ lệ lỗi HTTP 500 tăng vọt
      lên 35%. Khách hàng không thể hoàn tất đơn hàng.
    initial_logs: |-
      2023-10-24 12:00:02.102 [ERROR] CheckoutService - DB Connection Timeout: Connection pool exhausted (active: 100/100, waiting: 450)
      2023-10-24 12:00:02.405 [WARN] RedisClient - Timeout reading key 'product_promo_9981' after 3000ms
      2023-10-24 12:00:03.011 [ERROR] HttpHandler - 500 Internal Server Error /api/v1/checkout - Duration: 8720ms
    nodes:
    - key: q1_node_1
      prompt: Hệ thống đang nghẽn nặng với lỗi cạn kiệt DB connection pool và timeout
        Redis. Bước đầu tiên bạn sẽ làm gì để phân tích nguồn gốc vấn đề?
      options:
      - key: opt_1_1
        label: Kiểm tra chỉ số CPU/Memory của Redis Cluster và các query chậm trên
          PostgreSQL.
      - key: opt_1_2
        label: Khởi động lại toàn bộ pod Checkout Service ngay lập tức.
      - key: opt_1_3
        label: Tăng kích thước Connection Pool của DB lên gấp đôi (200 connections).
    - key: q1_node_2
      prompt: Chỉ số Grafana cho thấy Redis CPU đạt 100%, lượt truy vấn tới DB tăng
        gấp 50 lần bình thường đối với bảng 'products'. Kết quả này cho thấy hiện
        tượng gì?
      options:
      - key: opt_2_1
        label: Xảy ra hiện tượng Cache Stampede (Dog-piling) khi key khuyến mãi 'product_promo_9981'
          bị hết hạn.
      - key: opt_2_2
        label: PostgreSQL bị đơ do cạn dung lượng ổ cứng.
      - key: opt_2_3
        label: Hệ thống bị tấn công DDOS vào đường truyền mạng của Redis.
    - key: q1_node_3
      prompt: 'Xác nhận đúng là Cache Stampede: Hot key hết hạn khiến hàng ngàn request
        đồng thời chọc thẳng vào DB để lấy thông tin sản phẩm. Bạn chọn biện pháp
        khắc phục tạm thời khẩn cấp nào?'
      options:
      - key: opt_3_1
        label: Manual set lại cache key 'product_promo_9981' vào Redis với TTL dài
          hơn và cấu hình tạm Rate Limit cho Checkout API.
      - key: opt_3_2
        label: Xóa toàn bộ Redis Cache để hệ thống tự build lại từ đầu.
      - key: opt_3_3
        label: Tắt hẳn tính năng kiểm tra khuyến mãi trong ứng dụng.
    - key: q1_node_4
      prompt: Sau khi nạp lại cache thủ công, lượng request vào DB giảm mạnh nhưng
        CPU của Checkout Service vẫn duy trì ở mức 90%. Cần kiểm tra thêm yếu tố nào?
      options:
      - key: opt_4_1
        label: Soi log application và Thread Dump của Checkout Service xem có hiện
          tượng lock hay retry storm không.
      - key: opt_4_2
        label: Tiếp tục tăng CPU cho máy chủ ứng dụng lên gấp đôi.
      - key: opt_4_3
        label: Chờ 15 phút xem CPU tự hạ xuống không.
    - key: q1_node_5
      prompt: Thread dump cho thấy hàng trăm thread đang bị block ở hàm `getPromotionFromDB()`
        do cơ chế retry tự động liên tục khi có lỗi connection. Bạn sẽ xử lý thế nào?
      options:
      - key: opt_5_1
        label: Điều chỉnh cấu hình Exponential Backoff + Jitter cho cơ chế Retry và
          áp dụng Mutex/Lock khi fetch cache miss.
      - key: opt_5_2
        label: Tắt hoàn toàn cơ chế Retry trong source code.
      - key: opt_5_3
        label: Kill các thread bị block bằng tay trong JVM.
    - key: q1_node_6
      prompt: Giải pháp triệt để cho mã nguồn cần được deploy. Bạn chọn cách xử lý
        triệt để nào cho mã nguồn xử lý Cache?
      options:
      - key: opt_6_1
        label: Áp dụng cơ chế Distributed Lock (Redlock) hoặc Probabilistic Early
          Expiration (XFetch) khi đọc cache.
      - key: opt_6_2
        label: Chỉ tăng thời gian TTL của Cache lên vĩnh viễn (no expiration).
      - key: opt_6_3
        label: Chuyển toàn bộ dữ liệu sản phẩm từ Redis sang lưu trong Local Memory
          của từng Pod.
    - key: q1_node_7
      prompt: Bản hotfix đã được chuẩn bị xong. Bạn thực hiện quy trình deploy hotfix
        này như thế nào để đảm bảo không đứt gãy dịch vụ?
      options:
      - key: opt_7_1
        label: Thực hiện Rolling Update từng pod một, theo dõi sát tỷ lệ HTTP 200
          và latency.
      - key: opt_7_2
        label: Stop toàn bộ dịch vụ trong 2 phút để deploy bản mới.
      - key: opt_7_3
        label: Deploy trực tiếp thẳng lên 100% pod cùng một lúc.
    - key: q1_node_8
      prompt: 'Hotfix đã triển khai xong. Thời gian phản hồi giảm về 95ms, CPU Redis
        < 30%, DB connection active: 12/100, tỷ lệ lỗi 0%. Hệ thống đã ổn định hoàn
        toàn.'
      options:
      - key: opt_8_1
        label: Xác nhận sự cố được khắc phục, tổng hợp Post-Mortem và đóng ticket.
  answer_key:
