  difficulty: hard
- content:
    scenario: Hệ thống thanh toán đột ngột trả về lỗi HTTP 500 liên tục sau bản release
      10:00 AM. Khách hàng không thể hoàn tất giao dịch mua hàng.
    initial_logs: 'HTTP 500 Internal Server Error rate: 45%. HikariCP - Connection
      is not available, request timed out after 30000ms. PostgreSQL active_connections:
      100/100.'
    nodes:
    - key: q1_n1
      prompt: Hệ thống báo lỗi HikariCP connection timeout. Bạn sẽ kiểm tra gì đầu
        tiên?
      options:
      - key: opt_q1_n1_a
        label: Kiểm tra Dashboard Grafana về số lượng Active Connections và Active
          Queries của PostgreSQL.
      - key: opt_q1_n1_b
        label: Khởi động lại ngay lập tức toàn bộ Pods của Payment Service.
      - key: opt_q1_n1_c
        label: Tăng max-lifetime và connection-timeout trong cấu hình HikariCP ngay
          lập tức.
    - key: q1_n2
      prompt: Dashboard cho thấy active connection đạt ngưỡng tối đa 100/100. Bước
        tiếp theo để điều tra?
      options:
      - key: opt_q1_n2_a
        label: Truy vấn pg_stat_activity trên DB để xem câu lệnh nào đang chiếm giữ
          kết nối kéo dài.
      - key: opt_q1_n2_b
        label: Sửa file cấu hình PostgreSQL để nâng max_connections từ 100 lên 500.
      - key: opt_q1_n2_c
        label: Kiểm tra log hệ điều hành của DB Server để tìm lỗi phần cứng.
    - key: q1_n3
      prompt: Kết quả pg_stat_activity hiển thị hàng loạt query SELECT * FROM orders
        WHERE user_id = $1 AND status = 'PENDING' đang ở trạng thái active hơn 25
        giây. Hành động tiếp theo?
      options:
      - key: opt_q1_n3_a
        label: Chạy EXPLAIN ANALYZE cho query này và kiểm tra index của bảng orders.
      - key: opt_q1_n3_b
        label: Xóa toàn bộ các bản ghi trong bảng orders có status là PENDING.
      - key: opt_q1_n3_c
        label: Kiên nhẫn chờ 10 phút xem các query này có tự kết thúc hay không.
    - key: q1_n4
      prompt: EXPLAIN ANALYZE cho thấy Sequential Scan trên bảng orders (10 triệu
        bản ghi) do thiếu index trên (user_id, status). Phương án xử lý?
      options:
      - key: opt_q1_n4_a
        label: Hủy các query treo bằng pg_cancel_backend và tạo khẩn cấp index bằng
          CREATE INDEX CONCURRENTLY.
      - key: opt_q1_n4_b
        label: Chạy CREATE INDEX thông thường (không có CONCURRENTLY) trực tiếp trên
          bảng orders.
      - key: opt_q1_n4_c
        label: Chạy lệnh VACUUM FULL trên bảng orders.
    - key: q1_n5
      prompt: Index đang được khởi tạo CONCURRENTLY. Trong lúc chờ, request vẫn đổ
        về làm nghẽn pool. Giải pháp tạm thời ngắt query chậm?
      options:
      - key: opt_q1_n5_a
        label: Cấu hình statement_timeout = '5s' tạm thời cho DB session/user để ngắt
          sớm câu lệnh quá tải.
      - key: opt_q1_n5_b
        label: Tắt toàn bộ API Gateway để ngăn tất cả request của khách hàng.
      - key: opt_q1_n5_c
        label: Bật Rate Limiting ở Nginx xuống mức 1 request mỗi giây.
    - key: q1_n6
      prompt: Index CONCURRENTLY đã tạo xong, thời gian thực thi query giảm xuống
        dưới 2ms. Bạn làm gì ở phía application code?
      options:
      - key: opt_q1_n6_a
        label: Kiểm tra commit vừa release lúc 10:00 AM xem logic xử lý transaction
          và đóng connection.
      - key: opt_q1_n6_b
        label: Xóa bớt code repository để ứng dụng nhẹ hơn.
      - key: opt_q1_n6_c
        label: Reboot máy chủ cơ sở dữ liệu PostgreSQL.
    - key: q1_n7
      prompt: Phát hiện commit mới bỏ quên annotation @Transactional và không đóng
        Hibernate session khi xảy ra exception. Cách xử lý?
      options:
      - key: opt_q1_n7_a
        label: Rollback ứng dụng về bản release stable trước 10:00 AM hoặc deploy
          khẩn cấp hotfix sửa connection leak.
      - key: opt_q1_n7_b
        label: Chỉnh sửa code trực tiếp trên Pod container đang chạy.
      - key: opt_q1_n7_c
        label: Để nguyên code và lên kế hoạch sửa trong đợt sprint tuần sau.
    - key: q1_n8
      prompt: Bản hotfix/rollback đã deploy. Active connections giảm về 15/100, HTTP
        500 về 0%. Bạn cần thực hiện bước cuối nào?
      options:
      - key: opt_q1_n8_a
        label: Gỡ bỏ statement_timeout tạm thời và thiết lập Alert cảnh báo Slow Query
          > 2s trên Grafana.
      - key: opt_q1_n8_b
        label: Tắt hệ thống monitoring để tiết kiệm RAM server.
      - key: opt_q1_n8_c
        label: Đóng sự cố mà không kiểm tra lại cấu hình DB.
    - key: q1_recovery
      prompt: Sự cố đã được giải quyết hoàn toàn. Hệ thống thanh toán hoạt động ổn
        định.
      options: []
  answer_key:
    option_effects:
      opt_q1_n1_a:
        points: 10
        minutes_cost: 1
        next_node: q1_n2
        explanation: Đúng. Việc đầu tiên khi nghẽn kết nối là xác định nguồn gốc nghẽn
          ở phía ứng dụng hay phía database.
      opt_q1_n1_b:
        points: 0
        minutes_cost: 4
        next_node: q1_n2
        explanation: Khởi động lại Pod chỉ giải phóng kết nối tạm thời và sẽ bị nghẽn
          lại ngay nếu nguyên nhân gốc chưa được xử lý.
      opt_q1_n1_c:
        points: 5
        minutes_cost: 3
        next_node: q1_n2
        explanation: Tăng timeout chỉ làm request chờ lâu hơn chứ không giải quyết
          vấn đề cạn kiệt connection pool.
      opt_q1_n2_a:
        points: 10
        minutes_cost: 1
        next_node: q1_n3
        explanation: Chính xác. pg_stat_activity giúp định danh chính xác query nào
          đang chiếm giữ kết nối và chạy trong bao lâu.
      opt_q1_n2_b:
        points: 0
        minutes_cost: 5
        next_node: q1_n3
        explanation: Tăng max_connections khi có query chậm sẽ làm DB bị quá tải CPU/RAM
          và sập toàn bộ database.
      opt_q1_n2_c:
        points: 5
        minutes_cost: 3
        next_node: q1_n3
        explanation: Lỗi connection pool cạn kiệt thường do ứng dụng hoặc query, ít
          khi do lỗi phần cứng OS.
      opt_q1_n3_a:
        points: 10
        minutes_cost: 1
        next_node: q1_n4
        explanation: Chuẩn xác. EXPLAIN ANALYZE cho biết chiến dịch thực thi của PostgreSQL
          và nguyên nhân làm query bị chậm.
      opt_q1_n3_b:
        points: 0
        minutes_cost: 6
        next_node: q1_n4
        explanation: Xóa dữ liệu production gây mất mát dữ liệu nghiêm trọng và phạm
          quy trình an toàn.
      opt_q1_n3_c:
        points: 5
        minutes_cost: 4
        next_node: q1_n4
        explanation: Chờ đợi trong lúc dịch vụ đang sập làm tăng thời gian gián đoạn
          hệ thống (Downtime).
      opt_q1_n4_a:
        points: 10
        minutes_cost: 2
        next_node: q1_n5
        explanation: Tuyệt vời. Dùng CONCURRENTLY giúp tạo index mà không khóa ghi
          (Exclusive Lock) trên bảng orders.
      opt_q1_n4_b:
        points: 0
        minutes_cost: 5
        next_node: q1_n5
        explanation: Tạo index không có CONCURRENTLY sẽ lock toàn bộ bảng orders,
          khiến tất cả giao dịch mới bị treo hoàn toàn.
      opt_q1_n4_c:
        points: 5
        minutes_cost: 4
        next_node: q1_n5
        explanation: VACUUM FULL sẽ lock bảng và tốn rất nhiều I/O, làm sự cố trở
          nên tồi tệ hơn.
      opt_q1_n5_a:
        points: 10
        minutes_cost: 1
        next_node: q1_n6
        explanation: Chính xác. Giới hạn statement_timeout giúp giải phóng nhanh connection
          bị treo bởi query chậm.
      opt_q1_n5_b:
        points: 0
        minutes_cost: 5
        next_node: q1_n6
        explanation: Tắt API Gateway làm sập toàn bộ dịch vụ, chặn cả các tính năng
          không liên quan.
      opt_q1_n5_c:
        points: 5
        minutes_cost: 3
        next_node: q1_n6
        explanation: Rate limit quá thấp ảnh hưởng tiêu cực tới toàn bộ người dùng
          hợp lệ.
      opt_q1_n6_a:
        points: 10
        minutes_cost: 1
        next_node: q1_n7
        explanation: Chính xác. Cần tìm nguyên nhân tại sao code mới release lại gây
          ra leak connection hoặc câu truy vấn thiếu tối ưu.
      opt_q1_n6_b:
        points: 0
        minutes_cost: 4
        next_node: q1_n7
        explanation: Xóa repository không giải quyết được vấn đề runtime đang xảy
          ra.
      opt_q1_n6_c:
        points: 5
        minutes_cost: 5
        next_node: q1_n7
        explanation: Reboot DB gây gián đoạn toàn bộ hệ thống và không khắc phục được
          nguyên nhân trong ứng dụng.
      opt_q1_n7_a:
        points: 10
        minutes_cost: 2
        next_node: q1_n8
        explanation: Rất tốt. Rollback/Hotfix là con đường chuẩn để loại bỏ đoạn code
          gây leak connection ra khỏi môi trường live.
      opt_q1_n7_b:
        points: 0
        minutes_cost: 5
        next_node: q1_n8
        explanation: Sửa trực tiếp trên Pod vi phạm nguyên tắc Immutable Infrastructure
          và sẽ bị mất khi Pod restart.
      opt_q1_n7_c:
        points: 5
        minutes_cost: 4
        next_node: q1_n8
        explanation: Bỏ qua lỗi rò rỉ kết nối sẽ làm sự cố lặp lại ngay lập tức khi
          lượng traffic tăng.
      opt_q1_n8_a:
        points: 10
        minutes_cost: 1
        next_node: q1_recovery
        explanation: Hoàn hảo. Trả lại cấu hình timeout chuẩn và bổ sung cảnh báo
          để chủ động phát hiện sự cố tương tự.
      opt_q1_n8_b:
        points: 0
        minutes_cost: 3
        next_node: q1_recovery
        explanation: Tắt monitoring khiến team mù thông tin khi có sự cố tiếp theo.
      opt_q1_n8_c:
        points: 5
        minutes_cost: 2
        next_node: q1_recovery
        explanation: Không dọn dẹp cấu hình tạm thời (statement_timeout) có thể gây
          ngắt nhầm các tác vụ hợp lệ sau này.
    recovery_node: q1_recovery
  difficulty: medium
- content:
    scenario: Trong sự kiện Flash Sale lúc 12:00 PM, dịch vụ giỏ hàng bị phản hồi
      chậm bất thường. Tỷ lệ HTTP 504 Gateway Timeout đạt 35%, Redis Cache báo lỗi
      maxmemory reached.
    initial_logs: 'Redis OOM command not allowed when used memory > ''2GB''. Redis
      latency spike: 4500ms. Redis CPU usage: 99%. App logs: RedisTimeoutException:
      Command timed out after 3000ms.'
    nodes:
    - key: q2_n1
      prompt: Redis đang báo lỗi OOM và CPU chạm mốc 99%. Bạn sử dụng lệnh/công cụ
        nào để chẩn đoán nhanh?
      options:
      - key: opt_q2_n1_a
        label: Chạy redis-cli info memory và info stats để kiểm tra dung lượng sử
          dụng và các chỉ số eviction.
      - key: opt_q2_n1_b
        label: Thực hiện lệnh FLUSHALL ngay lập tức trên instance Redis.
      - key: opt_q2_n1_c
        label: Khởi động lại ngay Pod Redis Master.
    - key: q2_n2
      prompt: 'Kiểm tra thấy used_memory: 2.01G, maxmemory: 2.00G, maxmemory_policy:
        noeviction, evicted_keys: 0. Ý nghĩa của thông số này?'
      options:
      - key: opt_q2_n2_a
        label: Bộ nhớ Redis đã đầy và policy noeviction từ chối mọi lệnh ghi mới,
          khiến ứng dụng gặp ngoại lệ và timeout.
      - key: opt_q2_n2_b
        label: Redis đã hết dung lượng ổ đĩa SSD trên máy chủ.
      - key: opt_q2_n2_c
        label: Redis vẫn còn thừa bộ nhớ nhưng bị lỗi card mạng.
    - key: q2_n3
      prompt: Bạn cần xác định loại key nào đang chiếm dung lượng lớn nhất trong Redis
        mà không làm sập server. Lệnh nào an toàn?
      options:
      - key: opt_q2_n3_a
        label: Sử dụng lệnh redis-cli --bigkeys hoặc dùng SCAN kết hợp với MEMORY
          USAGE.
      - key: opt_q2_n3_b
        label: Chạy lệnh KEYS * để liệt kê toàn bộ key trong Redis.
      - key: opt_q2_n3_c
        label: Tải file dump RDB về máy cá nhân mở bằng phần mềm đọc text.
    - key: q2_n4
      prompt: Phát hiện nhóm key cart:session:* chiếm 1.5GB với hơn 2 triệu keys,
        tất cả đều có TTL = -1 (không hết hạn). Xử lý tức thời?
      options:
      - key: opt_q2_n4_a
        label: Dùng script SCAN xóa theo lô nhỏ (batch) các cart:session quá hạn và
          đổi maxmemory-policy sang volatile-lru tạm thời.
      - key: opt_q2_n4_b
        label: Chạy lệnh DEL cart:session:* trực tiếp trên redis-cli.
      - key: opt_q2_n4_c
        label: Giữ nguyên dữ liệu và chờ khách hàng hoàn tất mua sắm.
    - key: q2_n5
      prompt: Dung lượng đã giảm nhẹ về 1.6GB nhưng Flash Sale đang ở đỉnh điểm, Redis
        vẫn tiệm cận ngưỡng maxmemory 2GB. Giải pháp khẩn cấp?
      options:
      - key: opt_q2_n5_a
        label: Thực hiện Scale Up tài nguyên RAM cho Redis instance/cluster lên 4GB.
      - key: opt_q2_n5_b
        label: Tắt hoàn toàn dịch vụ Redis để ứng dụng đọc/ghi thẳng vào Database
          chính.
      - key: opt_q2_n5_c
        label: Xóa toàn bộ CSDL MySQL chính để nhường RAM.
    - key: q2_n6
      prompt: Sau khi nâng RAM lên 4GB, ứng dụng chạy mượt trở lại. Tuy nhiên cần
        xử lý gốc rễ trong code ứng dụng. Bạn đề xuất gì?
      options:
      - key: opt_q2_n6_a
        label: Bổ sung TTL (ví dụ 24 giờ) cho mọi câu lệnh SET key cart:session trong
          backend code và deploy hotfix.
      - key: opt_q2_n6_b
        label: Chuyển toàn bộ dữ liệu giỏ hàng lưu vào Local Memory (RAM) của từng
          Pod API.
      - key: opt_q2_n6_c
        label: Tăng Nginx timeout lên 120 giây để chờ Redis xử lý.
    - key: q2_n7
      prompt: Bản hotfix ứng dụng đã deploy. Bạn theo dõi các chỉ số nào để đảm bảo
        hệ thống thực sự ổn định?
      options:
      - key: opt_q2_n7_a
        label: Theo dõi Redis used_memory, evicted_keys, Cache Hit Ratio và p99 Response
          Time của API.
      - key: opt_q2_n7_b
        label: Dừng kiểm tra ngay vì không còn nhận được thông báo HTTP 504.
      - key: opt_q2_n7_c
        label: Xóa toàn bộ các Redis Replica Node.
    - key: q2_n8
      prompt: 'Các chỉ số đã trở lại bình thường: Redis Latency < 5ms, Memory duy
        trì 2.2GB/4GB, error rate 0%. Bước hoàn tất sự cố?'
      options:
      - key: opt_q2_n8_a
        label: Thiết lập alert cảnh báo khi Redis Memory > 80% và lên kế hoạch sharding
          sang Redis Cluster.
      - key: opt_q2_n8_b
        label: Giảm ngay RAM của Redis về 512MB để tiết kiệm chi phí.
      - key: opt_q2_n8_c
        label: Chuyển maxmemory-policy về noeviction như ban đầu.
    - key: q2_recovery
      prompt: Sự cố Redis OOM đã giải quyết thành công. Hệ thống chịu tải tốt trong
        suốt đợt Flash Sale.
      options: []
  answer_key:
    option_effects:
      opt_q2_n1_a:
        points: 10
        minutes_cost: 1
        next_node: q2_n2
        explanation: Chính xác. Kiểm tra info memory là cách nhanh nhất để đọc thông
          số RAM sử dụng và các cấu hình liên quan.
      opt_q2_n1_b:
        points: 0
        minutes_cost: 5
        next_node: q2_n2
        explanation: FLUSHALL sẽ xóa sạch toàn bộ cache (bao gồm cả session người
          dùng), gây quá tải trầm trọng lên DB chính (Cache Stampede).
      opt_q2_n1_c:
        points: 5
        minutes_cost: 4
        next_node: q2_n2
        explanation: Restart Redis không giải quyết được vấn đề bộ nhớ đầy nếu dữ
          liệu không có TTL được khôi phục lại từ file RDB/AOF.
      opt_q2_n2_a:
        points: 10
        minutes_cost: 1
        next_node: q2_n3
        explanation: Chính xác. Khi bộ nhớ đạt maxmemory với policy noeviction, Redis
          sẽ trả về lỗi OOM cho mọi lệnh ghi.
      opt_q2_n2_b:
        points: 0
        minutes_cost: 4
        next_node: q2_n3
        explanation: maxmemory là giới hạn bộ nhớ RAM được cấp phát cho Redis process,
          không phải dung lượng ổ đĩa.
      opt_q2_n2_c:
        points: 5
        minutes_cost: 3
        next_node: q2_n3
        explanation: Lỗi đã rõ ràng là OOM command not allowed, không liên quan tới
          mạng.
      opt_q2_n3_a:
        points: 10
        minutes_cost: 1
        next_node: q2_n4
        explanation: Tuyệt vời. --bigkeys dùng lệnh SCAN chạy an toàn theo đợt, không
          gây block thread đơn của Redis.
      opt_q2_n3_b:
        points: 0
        minutes_cost: 6
        next_node: q2_n4
        explanation: Lệnh KEYS * là Single-threaded Block Command. Chạy KEYS * trên
          DB chứa triệu keys sẽ làm Redis bị đơ hoàn toàn.
      opt_q2_n3_c:
        points: 5
        minutes_cost: 4
        next_node: q2_n4
        explanation: Tải file dump RDB tốn thời gian I/O và không đáp ứng yêu cầu
          xử lý sự cố tức thời.
      opt_q2_n4_a:
        points: 10
        minutes_cost: 2
        next_node: q2_n5
        explanation: Chính xác. Dùng UNLINK/SCAN theo lô nhỏ tránh block Redis, đồng
          thời đổi sang volatile-lru giúp tự động giải phóng key cũ.
      opt_q2_n4_b:
        points: 0
        minutes_cost: 5
        next_node: q2_n5
        explanation: Lệnh DEL với wildcard truyền vào trực tiếp sẽ block Redis server
          trong nhiều giây.
      opt_q2_n4_c:
        points: 5
        minutes_cost: 4
        next_node: q2_n5
        explanation: Bỏ mặc sự cố sẽ làm toàn bộ khách hàng không thể thêm hàng vào
          giỏ.
      opt_q2_n5_a:
        points: 10
        minutes_cost: 1
        next_node: q2_n6
        explanation: Rất tốt. Tăng RAM tức thời giúp hệ thống có không gian bộ nhớ
          để phục vụ lượng traffic khủng trong Flash Sale.
      opt_q2_n5_b:
        points: 0
        minutes_cost: 6
        next_node: q2_n6
        explanation: Tắt Redis sẽ đẩy hàng trăm ngàn request/s trực tiếp vào Database,
          làm sập Database ngay lập tức.
      opt_q2_n5_c:
        points: 5
        minutes_cost: 5
        next_node: q2_n6
        explanation: Hành động phá hoại dữ liệu sản xuất.
      opt_q2_n6_a:
        points: 10
        minutes_cost: 2
        next_node: q2_n7
        explanation: Chính xác. Mọi key cache tạm thời đều phải có TTL để tránh tình
          trạng phình to bộ nhớ vĩnh viễn.
      opt_q2_n6_b:
        points: 0
        minutes_cost: 5
        next_node: q2_n7
        explanation: Lưu giỏ hàng vào Local Memory làm mất tính nhất quán dữ liệu
          khi người dùng load balance qua Pod khác.
      opt_q2_n6_c:
        points: 5
        minutes_cost: 3
        next_node: q2_n7
        explanation: Tăng timeout chỉ giấu đi triệu chứng chứ không sửa tận gốc vấn
          đề tràn RAM.
      opt_q2_n7_a:
        points: 10
        minutes_cost: 1
        next_node: q2_n8
        explanation: Tuyệt vời. Đây là các chỉ số sinh mạng để đảm bảo Redis và ứng
          dụng đã hoạt động ổn định.
      opt_q2_n7_b:
        points: 5
        minutes_cost: 2
        next_node: q2_n8
        explanation: Bỏ qua theo dõi sau hotfix dễ dẫn đến rủi ro bị tái phát mà không
          biết.
      opt_q2_n7_c:
        points: 0
        minutes_cost: 4
        next_node: q2_n8
        explanation: Xóa Replica làm giảm khả năng sẵn sàng cao (High Availability)
          của hệ thống.
      opt_q2_n8_a:
        points: 10
        minutes_cost: 1
        next_node: q2_recovery
        explanation: Xuất sắc. Bổ sung cảnh báo sớm và chuẩn bị phương án Sharding
          giúp hệ thống mở rộng bền vững trong tương lai.
      opt_q2_n8_b:
        points: 0
        minutes_cost: 4
        next_node: q2_recovery
        explanation: Giảm RAM đột ngột khi Flash Sale chưa kết thúc sẽ làm sự cố OOM
          tái diễn.
      opt_q2_n8_c:
        points: 5
        minutes_cost: 2
        next_node: q2_recovery
        explanation: Giữ policy noeviction dễ dẫn tới lỗi OOM nếu có đợt tăng vọt
          traffic tiếp theo.
    recovery_node: q2_recovery
  difficulty: hard
- content:
    scenario: Dịch vụ payment-service đột ngột tăng latency lên 5000ms và liên tục
      xuất hiện lỗi HTTP 504 Gateway Timeout trên Nginx ingress controller trong khi
      lưu lượng truy cập không tăng bất thường.
    initial_logs: |-
      2023-10-24 10:15:02 [ERROR] c.e.payment.service.PaymentService - Timeout waiting for connection from Redis pool
      2023-10-24 10:15:05 [WARN] io.lettuce.core.RedisCommandTimeoutException: Command timed out after 5 second(s)
      2023-10-24 10:15:10 [ERROR] org.apache.catalina.core.StandardWrapperValve - Servlet.service() threw exception [redis.clients.jedis.exceptions.JedisConnectionException: Could not get a resource from the pool]
    nodes:
    - key: s1_n1
      prompt: Hệ thống vừa phát cảnh báo 504 Timeout cho API thanh toán. Bạn mở dashboard
        và thấy log cạn kiệt connection pool của Redis. Bạn xử lý bước đầu như thế
        nào?
      options:
      - key: s1_n1_opt1
        label: Kiểm tra chỉ số CPU và RAM của pod payment-service
      - key: s1_n1_opt2
        label: Tra cứu chỉ số Redis Slowlog và Redis Connection Count
      - key: s1_n1_opt3
        label: Khởi động lại toàn bộ Kubernetes Cluster
    - key: s1_n2
      prompt: Sau khi xem thông số Redis, bạn thấy lượng active connection đạt ngưỡng
        tối đa và latency của Redis tăng đột biến. Bạn chọn lệnh/hành động nào tiếp
        theo?
      options:
      - key: s1_n2_opt1
        label: Chạy lệnh SLOWLOG GET 10 trên Redis CLI
      - key: s1_n2_opt2
        label: Tăng ngay dung lượng RAM cho Redis Instance
      - key: s1_n2_opt3
        label: Tắt dịch vụ payment-service để giảm tải
    - key: s1_n3
      prompt: Kết quả Slowlog trả về lệnh 'KEYS user_session:*' đang tốn hơn 4000ms
        để hoàn thành mỗi lần gọi. Bước tiếp theo là gì?
      options:
      - key: s1_n3_opt1
        label: Tìm vị trí trong nguồn code đang phát lệnh KEYS này
      - key: s1_n3_opt2
        label: Thực hiện lệnh FLUSHALL để dọn sạch Redis cache
      - key: s1_n3_opt3
        label: Kiểm tra lại cấu hình đường truyền mạng đến Redis
    - key: s1_n4
      prompt: Bạn phát hiện lệnh KEYS nằm trong Spring Interceptor vừa được cập nhật.
        Bạn kiểm tra lịch sử deployment gần nhất ra sao?
      options:
      - key: s1_n4_opt1
        label: Kiểm tra commit history và danh sách deployment mới nhất trên Git/CI-CD
      - key: s1_n4_opt2
        label: Tăng giá trị max-total connection pool lên gấp 5 lần
      - key: s1_n4_opt3
        label: Restart ứng dụng để giải phóng connection tạm thời
    - key: s1_n5
      prompt: Bản release v1.5.0 vừa deploy cách đây 20 phút có thêm đoạn code quét
        tất cả session token bằng lệnh KEYS. Bạn quyết định phương án khắc phục tạm
        thời khẩn cấp nào?
      options:
      - key: s1_n5_opt1
        label: Thực hiện Rollback ngay payment-service về phiên bản v1.4.2
      - key: s1_n5_opt2
        label: Chờ developer viết code mới và tạo Pull Request sửa lệnh KEYS thành
          SCAN
      - key: s1_n5_opt3
        label: Chuyển cấu hình Redis Master sang Redis Replica
    - key: s1_n6
      prompt: Lệnh rollback phiên bản v1.4.2 đang được khởi chạy trên Kubernetes Cluster.
        Bạn làm gì trong lúc chờ deployment hạ cấp hoàn tất?
      options:
      - key: s1_n6_opt1
        label: Theo dõi tiến độ Pod Rollout và chỉ số Redis Active Connections
      - key: s1_n6_opt2
        label: Xóa toàn bộ Pod cũ bằng lệnh kubectl delete pod --force
      - key: s1_n6_opt3
        label: Gửi email cho toàn bộ người dùng báo lỗi hệ thống
    - key: s1_n7
      prompt: Phiên bản v1.4.2 đã sẵn sàng và nhận traffic. Làm thế nào để xác nhận
        sự cố đã được giải quyết hoàn toàn?
      options:
      - key: s1_n7_opt1
        label: Kiểm tra Latency API thanh toán, Redis CPU và tỉ lệ lỗi 504 trên Grafana
      - key: s1_n7_opt2
        label: Thử nghiệm đặt đơn hàng mẫu trên môi trường Staging
      - key: s1_n7_opt3
        label: Xóa toàn bộ log trên server để tiết kiệm ổ đĩa
    - key: s1_n8
      prompt: Các chỉ số đã trở lại bình thường (Latency < 120ms, Lỗi 504 = 0%). Bước
        cuối cùng của quy trình Incident Management là gì?
      options:
      - key: s1_n8_opt1
        label: Đóng ticket sự cố, thông báo kênh On-call và lên lịch họp Post-Mortem
      - key: s1_n8_opt2
        label: Tắt bớt hệ thống cảnh báo để tránh nhận mail spam
      - key: s1_n8_opt3
        label: Yêu cầu dev refactor lại toàn bộ dự án sang Golang
  answer_key:
    option_effects:
      s1_n1_opt1:
        points: 5
        minutes_cost: 3
        next_node: s1_n2
        explanation: Tốt nhưng chưa tối ưu. Log ban đầu đã chỉ ra lỗi connection pool
          của Redis, nên tập trung thẳng vào Redis.
      s1_n1_opt2:
        points: 10
        minutes_cost: 1
        next_node: s1_n2
        explanation: Chính xác! Log báo lỗi từ Redis Connection Pool nên kiểm tra
          Redis metrics và slowlog là bước hợp lý nhất.
      s1_n1_opt3:
        points: 0
        minutes_cost: 8
        next_node: s1_n2
        explanation: Khởi động lại toàn bộ cluster khi chưa biết nguyên nhân gây ra
          gián đoạn dịch vụ diện rộng không cần thiết.
      s1_n2_opt1:
        points: 10
        minutes_cost: 1
        next_node: s1_n3
        explanation: Rất chính xác! SLOWLOG GET sẽ giúp phát hiện các lệnh Redis đang
          làm nghẽn single-thread của Redis.
      s1_n2_opt2:
        points: 0
        minutes_cost: 6
        next_node: s1_n3
        explanation: Tăng RAM không giải quyết được vấn đề CPU spike hay slow query
          trong Redis.
      s1_n2_opt3:
        points: 5
        minutes_cost: 4
        next_node: s1_n3
        explanation: Tắt dịch vụ sẽ chặn lỗi nhưng gây gián đoạn kinh doanh không
          cần thiết.
      s1_n3_opt1:
        points: 10
        minutes_cost: 1
        next_node: s1_n4
        explanation: Chuẩn xác. Lệnh KEYS O(N) là cấm kỵ trên production, cần tìm
          nơi phát ra lệnh này trong code.
      s1_n3_opt2:
        points: 0
        minutes_cost: 7
        next_node: s1_n4
        explanation: FLUSHALL xóa sạch session/cache của hệ thống, gây ảnh hưởng nghiêm
          trọng đến người dùng khác.
      s1_n3_opt3:
        points: 5
        minutes_cost: 3
        next_node: s1_n4
        explanation: Mạng không phải nguyên nhân khi lệnh slowlog đã xác nhận Redis
          mất 4 giây xử lý nội bộ.
      s1_n4_opt1:
        points: 10
        minutes_cost: 1
        next_node: s1_n5
        explanation: Đúng! Kiểm tra release history giúp xác định phiên bản gây ra
          lỗi.
      s1_n4_opt2:
        points: 5
        minutes_cost: 4
        next_node: s1_n5
        explanation: Tăng connection pool chỉ là giải pháp tạm thời và Redis vẫn sẽ
          bị nghẽn do lệnh KEYS đơn luồng.
      s1_n4_opt3:
        points: 0
        minutes_cost: 5
        next_node: s1_n5
        explanation: Restart app chỉ giải phóng connection vài giây rồi lại bị nghẽn
          tiếp khi traffic vào.
      s1_n5_opt1:
        points: 10
        minutes_cost: 1
        next_node: s1_n6
        explanation: Chính xác! Rollback về bản stable gần nhất là cách khắc phục
          nhanh nhất để khôi phục dịch vụ.
      s1_n5_opt2:
        points: 0
        minutes_cost: 10
        next_node: s1_n6
        explanation: Chờ viết code và test trên production trong sự cố khẩn cấp làm
          tăng thời gian downtime.
      s1_n5_opt3:
        points: 5
        minutes_cost: 6
        next_node: s1_n6
        explanation: Failover Redis không khắc phục được vấn đề code ứng dụng liên
          tục gửi lệnh KEYS.
      s1_n6_opt1:
        points: 10
        minutes_cost: 1
        next_node: s1_n7
        explanation: Đúng quy trình. Giám sát quá trình Rollout đảm bảo Pod mới thay
          thế êm đẹp Pod bị lỗi.
      s1_n6_opt2:
        points: 0
        minutes_cost: 5
        next_node: s1_n7
        explanation: Xóa force pod có thể gây rớt kết nối đột ngột của các giao dịch
          đang xử lý dở dang.
      s1_n6_opt3:
        points: 5
        minutes_cost: 4
        next_node: s1_n7
        explanation: Chưa cần thiết gửi mail toàn bộ khách hàng khi sự cố đang trong
          tầm kiểm soát khôi phục.
      s1_n7_opt1:
        points: 10
        minutes_cost: 1
        next_node: s1_n8
        explanation: Chính xác. Luôn kiểm tra metrics thực tế để xác nhận hệ thống
          đã hoàn toàn ổn định.
      s1_n7_opt2:
        points: 5
        minutes_cost: 5
        next_node: s1_n8
        explanation: Staging không phản ánh chính xác tình trạng phục hồi của Production.
      s1_n7_opt3:
        points: 0
        minutes_cost: 4
        next_node: s1_n8
        explanation: Xóa log khiến việc làm báo cáo Post-Mortem và điều tra nguyên
          nhân chi tiết gặp khó khăn.
      s1_n8_opt1:
        points: 10
        minutes_cost: 1
        next_node: s1_n8
        explanation: Tuyệt vời! Bạn đã hoàn thành quy trình xử lý sự cố chuẩn mực.
      s1_n8_opt2:
        points: 0
        minutes_cost: 5
        next_node: s1_n8
        explanation: Tắt alert khiến hệ thống mất khả năng cảnh báo cho các sự cố
          sau.
      s1_n8_opt3:
        points: 5
        minutes_cost: 2
        next_node: s1_n8
        explanation: Đổi ngôn ngữ lập trình là quyết định cảm tính không liên quan
          trực tiếp đến sửa bug.
    recovery_node: s1_n8
  difficulty: medium
- content:
    scenario: Vào thời điểm diễn ra sự kiện Flash Sale, ứng dụng checkout-service
      bị treo hoàn toàn, CPU của cơ sở dữ liệu PostgreSQL chạm mốc 100% và xuất hiện
      hàng loạt lỗi Deadlock làm gián đoạn việc thanh toán.
    initial_logs: |-
      2023-11-11 12:01:10 ERROR [checkout-service] org.postgresql.util.PSQLException: ERROR: deadlock detected
      DETAIL: Process 4125 waits for ExclusiveLock on transaction 88192; blocked by process 4190.
      Process 4190 waits for ShareLock on transaction 88191; blocked by process 4125.
      2023-11-11 12:01:12 ERROR [checkout-service] HikariPool-1 - Connection is not available, request timed out after 30000ms.
    nodes:
    - key: s2_n1
      prompt: Hệ thống checkout bị nghẽn trong Flash Sale. Database báo Deadlock Detected
        và HikariPool Timeout. Hành động đầu tiên của bạn là gì?
      options:
      - key: s2_n1_opt1
        label: Truy vấn view pg_stat_activity để tìm các query đang giữ lock và bị
          block
      - key: s2_n1_opt2
        label: Khởi động lại ngay PostgreSQL database server
      - key: s2_n1_opt3
        label: Tăng dung lượng CPU của DB Instance lên gấp đôi
    - key: s2_n2
      prompt: Kết quả pg_stat_activity chỉ ra sự tranh chấp lock giữa bảng orders
        và bảng inventory từ 2 luồng công việc khác nhau. Bạn phân tích tiếp thế nào?
      options:
      - key: s2_n2_opt1
        label: So sánh thứ tự lock tài nguyên giữa API tạo đơn hàng và Job cập nhật
          tồn kho
      - key: s2_n2_opt2
        label: Tăng thông số max_connections trong postgresql.conf
      - key: s2_n2_opt3
        label: Xóa toàn bộ các index trên 2 bảng orders và inventory
    - key: s2_n3
      prompt: Bạn nhận thấy API checkout đang lock orders trước rồi lock inventory,
        trong khi background sync job lại lock inventory trước rồi lock orders. Đây
        là nguyên nhân gây ra Deadlock cơ bản. Bước xử lý khẩn cấp là gì?
      options:
      - key: s2_n3_opt1
        label: Tắt ngay background sync job bằng Feature Flag hoặc ngắt tiến trình
          background
      - key: s2_n3_opt2
        label: Chạy lệnh VACUUM FULL trên toàn bộ database
      - key: s2_n3_opt3
        label: Đổi mức Isolation level của database sang Read Uncommitted
    - key: s2_n4
      prompt: Đã ngắt background sync job nhưng các query cũ bị deadlock vẫn đang
        treo connection và khiến DB CPU ở mức 100%. Bạn làm cách nào để giải phóng
        DB khẩn cấp?
      options:
      - key: s2_n4_opt1
        label: Dùng lệnh pg_cancel_backend() và pg_terminate_backend() cho các PID
          bị block lâu
      - key: s2_n4_opt2
        label: Kill toàn bộ Pod checkout-service để giải phóng tất cả connection
      - key: s2_n4_opt3
        label: Chờ 30 phút để các transaction tự động hết timeout
    - key: s2_n5
      prompt: Các tiến trình bị khóa đã được dọn sạch, DB CPU giảm xuống 35%. Tuy
        nhiên traffic Flash Sale vẫn rất lớn và có nguy cơ tái diễn deadlock nếu chạy
        lại sync job. Bạn giải quyết ra sao?
      options:
      - key: s2_n5_opt1
        label: Chuẩn bị bản hotfix đồng bộ thứ tự lock (Lock Order Consistency) trong
          source code
      - key: s2_n5_opt2
        label: Bật lại background sync job ngay lập tức để đồng bộ kho
      - key: s2_n5_opt3
        label: Giới hạn traffic người dùng bằng cách chặn 90% truy cập vào trang chủ
    - key: s2_n6
      prompt: Đội dev đã chuẩn bị xong Hotfix sửa thứ tự lock tài nguyên (luôn lock
        orders -> inventory). Quy trình deploy khẩn cấp như thế nào?
      options:
      - key: s2_n6_opt1
        label: Build image hotfix, chạy test nhanh trên staging, rồi deploy theo dạng
          Rolling Update
      - key: s2_n6_opt2
        label: Sửa code trực tiếp trên Pod production thông qua kubectl exec
      - key: s2_n6_opt3
        label: Tắt toàn bộ hệ thống trong 1 tiếng để deploy
    - key: s2_n7
      prompt: Bản Hotfix đã hoàn tất deploy. Bạn kích hoạt lại background sync job
        và cần theo dõi chỉ số nào để đảm bảo hệ thống an toàn?
      options:
      - key: s2_n7_opt1
        label: Theo dõi DB Deadlock count, Lock Wait Time và Hikari Pool Active Connections
      - key: s2_n7_opt2
        label: Chỉ kiểm tra dung lượng ổ đĩa còn trống trên Server
      - key: s2_n7_opt3
        label: Mở log Nginx và đếm số lượng HTTP 200 thủ công
    - key: s2_n8
      prompt: Tỷ lệ lỗi về 0, DB Lock Wait Time dưới 5ms và các đơn hàng Flash Sale
        được xử lý mượt mà. Bước kết thúc incident là gì?
      options:
      - key: s2_n8_opt1
        label: Xác nhận khôi phục dịch vụ, cập nhật trạng thái Incident Page và tổ
          chức Post-Mortem
      - key: s2_n8_opt2
        label: Xóa toàn bộ dữ liệu log của phiên Flash Sale
      - key: s2_n8_opt3
        label: Giữ nguyên trạng thái ngắt kết nối của các dịch vụ phụ trợ
  answer_key:
    option_effects:
      s2_n1_opt1:
        points: 10
        minutes_cost: 1
        next_node: s2_n2
        explanation: Chính xác! Tra cứu pg_stat_activity giúp xác định chính xác các
          truy vấn đang tranh chấp khóa (lock conflict).
      s2_n1_opt2:
        points: 0
        minutes_cost: 10
        next_node: s2_n2
        explanation: Reboot DB giữa lúc Flash Sale khiến toàn bộ giao dịch bị đứt
          gãy và nguy cơ mất dữ liệu transaction dở dang.
      s2_n1_opt3:
        points: 5
        minutes_cost: 5
        next_node: s2_n2
        explanation: Tăng CPU không giải quyết được vấn đề cơ bản là Deadlock thuật
          toán trong ứng dụng.
      s2_n2_opt1:
        points: 10
        minutes_cost: 1
        next_node: s2_n3
        explanation: Rất chuẩn! Tìm ra thứ tự lock ngược nhau giữa các luồng là chìa
          khóa để xử lý triệt để Deadlock.
      s2_n2_opt2:
