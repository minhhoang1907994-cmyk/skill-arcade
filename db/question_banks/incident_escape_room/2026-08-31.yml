      q1_n7_o2:
        points: 0
        minutes_cost: 10
        next_node: q1_n7
        explanation: 'Thảm họa: Truncate bảng inventory gây mất toàn bộ dữ liệu hàng
          hóa trên production.'
      q1_n7_o3:
        points: 5
