- content:
    scenario: Dịch vụ Report Worker (Node.js) chạy trên Kubernetes liên tục sập và
      khởi động lại. Người dùng báo lỗi không thể xuất báo cáo định dạng Excel/PDF
      cho các tài khoản doanh nghiệp lớn.
    initial_logs: |-
      Kubelet event: Pod report-worker-7d4f9b8c6-x8z9l status: OOMKilled (Exit Code 137). Memory usage reached 2Gi limit.
      [FATAL] JavaScript heap out of memory
    nodes:
    - key: s2_n1
      prompt: Pod liên tục bị OOMKilled (Exit Code 137). Bạn chọn bước đầu tiên nào
        để xử lý?
      options:
      - key: s2_o1
        label: Tăng RAM Limit của Pod từ 2Gi lên 16Gi trong Deployment manifest.
      - key: s2_o2
        label: Tra cứu logs chi tiết trước thời điểm crash và sự kiện K8s qua kubectl
          describe pod.
