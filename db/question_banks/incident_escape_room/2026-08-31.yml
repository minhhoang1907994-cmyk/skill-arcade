        label: Kiểm tra mã nguồn hàm xuất báo cáo xem cách xử lý bộ nhớ (RAM) đối
          với dữ liệu lớn.
      - key: s2_o5
        label: Khóa ngay tài khoản Tenant 8810 trên hệ thống.
      - key: s2_o6
        label: Tắt toàn bộ tính năng xuất báo cáo của ứng dụng.
    - key: s2_n3
