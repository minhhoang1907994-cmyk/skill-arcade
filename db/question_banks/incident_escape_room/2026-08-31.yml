        explanation: 'Không tối ưu: Các connection treo có thể mất nhiều giờ mới tự
          timeout, kéo dài thời gian sự cố.'
      q1_n8_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n8
        explanation: 'Hoàn hảo: Hoàn tất quy trình xử lý sự cố chuẩn DevOps/SRE.'
