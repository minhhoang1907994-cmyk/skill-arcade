      - key: s2_o20
        label: Giữ nguyên giới hạn 50,000 bản ghi mãi mãi.
      - key: s2_o21
        label: Giảm số lượng Worker Pod xuống 0.
    - key: s2_n8
      prompt: Sự cố OOMKilled được giải quyết triệt để. Hành động khắc phục lâu dài
