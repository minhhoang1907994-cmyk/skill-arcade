  difficulty: hard
- content:
    scenario: Hệ thống thanh toán E-commerce bị treo ở bước xác nhận đơn hàng trong
      đợt Flash Sale. Khách hàng nhận lỗi HTTP 504 Gateway Timeout liên tục. Đội Ops
      báo cáo API Gateway và Service Backend vẫn phản hồi nhưng latency tăng vọt từ
      100ms lên 30,000ms.
    initial_logs: |-
      [ERROR] 2023-10-24 10:15:02.123 [http-nio-8080-exec-42] c.z.h.p.HikariPool - HikariPool-1 - Connection is not available, request timed out after 30000ms.
      [WARN] 2023-10-24 10:15:02.125 [http-nio-8080-exec-42] c.e.payment.service.PaymentService - Failed to process order #98231: active connections=50, idle=0, waiting=184
    nodes:
    - key: q1_n1
      prompt: Log ban đầu chỉ ra HikariPool bị kiệt connection. Bạn sẽ thực hiện bước
        chẩn đoán ban đầu nào?
      options:
      - key: q1_n1_o1
        label: Kiểm tra trạng thái kết nối active connections và lock trên PostgreSQL
          database.
      - key: q1_n1_o2
        label: Khởi động lại ngay lập tức toàn bộ các instance của API Gateway.
      - key: q1_n1_o3
        label: Tăng max-pool-size của HikariPool từ 50 lên 500 trong file config rồi
          restart Backend.
    - key: q1_n2
      prompt: Bạn kiểm tra PostgreSQL và thấy số lượng kết nối tới DB đạt tối đa.
        Bạn làm gì tiếp theo để xác định nguyên nhân nghẽn?
      options:
      - key: q1_n2_o1
        label: Truy vấn pg_stat_activity để tìm các câu lệnh SQL đang ở trạng thái
          active và bị ngưng trệ do ExclusiveLock.
      - key: q1_n2_o2
        label: Thực hiện flush toàn bộ cache trên Redis cluster.
      - key: q1_n2_o3
        label: Kiểm tra Nginx access log để đếm số lượng IP đang truy cập.
    - key: q1_n3
      prompt: Kết quả query pg_stat_activity cho thấy hàng trăm transaction đang chờ
        lock câu lệnh 'SELECT * FROM inventory WHERE product_id = ? FOR UPDATE'. Bạn
        xử lý thế nào?
      options:
      - key: q1_n3_o1
        label: Kiểm tra mã nguồn xử lý luồng giao dịch (Transaction context) có chứa
          thao tác nào kéo dài thời gian giữ lock không.
      - key: q1_n3_o2
        label: Xóa index trên cột product_id của bảng inventory để tránh đụng độ lock.
      - key: q1_n3_o3
        label: Khởi động lại ngay lập tức database server chính (PostgreSQL Master).
    - key: q1_n4
      prompt: Đọc mã nguồn Java, bạn phát hiện trong method được đánh dấu @Transactional
        có lời gọi HTTP đồng bộ (REST API) sang cổng thanh toán bên thứ ba (Third-party
        Payment Gateway). Bạn kết luận gì?
      options:
      - key: q1_n4_o1
        label: Cổng thanh toán bên thứ ba phản hồi chậm khiến DB connection bị giữ
          quá lâu trong transaction block, làm treo toàn bộ pool.
      - key: q1_n4_o2
        label: Do PostgreSQL không hỗ trợ gọi API bên thứ ba nên gây ra lỗi deadlock.
      - key: q1_n4_o3
        label: Tăng timeout của HTTP client gọi sang cổng thanh toán lên 60 giây để
          chờ phản hồi đầy đủ.
    - key: q1_n5
      prompt: Bạn cần đưa ra phương án xử lý tức thời (Hotfix) để giải phóng Database
        connection pool. Bạn chọn giải pháp nào?
      options:
      - key: q1_n5_o1
        label: Tách lời gọi HTTP API bên thứ ba ra khỏi phạm vi @Transactional (chỉ
          giữ lock DB khi thật sự cập nhật dữ liệu).
      - key: q1_n5_o2
        label: Tăng Hikari pool size lên 200 và giữ nguyên luồng code.
      - key: q1_n5_o3
        label: Đổi mức Transaction Isolation Level thành READ UNCOMMITTED cho toàn
          bộ hệ thống.
    - key: q1_n6
      prompt: Sau khi refactor mã nguồn tách HTTP call ra ngoài transaction, bạn chuẩn
        bị triển khai bản vá. Quy trình deploy nào an toàn nhất lúc này?
      options:
      - key: q1_n6_o1
        label: Build Docker image mới, thực hiện Rolling Update trên Kubernetes cluster
          từng pod một.
      - key: q1_n6_o2
        label: Sửa file class trực tiếp trên container đang chạy trên production bằng
          Bytecode manipulation.
      - key: q1_n6_o3
        label: Rollback toàn bộ hệ thống về phiên bản stable từ 1 tháng trước.
    - key: q1_n7
      prompt: Bản vá mới đã deploy xong nhưng vẫn còn một số transaction cũ bị treo
        trên Database. Bạn làm gì để khôi phục hoàn toàn?
      options:
      - key: q1_n7_o1
        label: Sử dụng pg_terminate_backend() để ngắt các process bị treo lâu trên
          PostgreSQL và theo dõi lại connection pool.
      - key: q1_n7_o2
        label: Thực hiện TRUNCATE TABLE inventory và nhập lại dữ liệu từ file backup.
      - key: q1_n7_o3
        label: Không làm gì cả, để PostgreSQL tự giải phóng sau 24 giờ.
    - key: q1_n8
      prompt: Sự cố đã được khắc phục, HikariPool trở lại bình thường (active < 10,
        latency < 50ms). Bước cuối cùng của bạn là gì?
      options:
      - key: q1_n8_o1
        label: Xác nhận dịch vụ hoạt động ổn định, ghi chép Post-mortem report và
          đề xuất quy chuẩn code review cho Transaction.
      - key: q1_n8_o2
        label: Khởi động lại toàn bộ server một lần nữa cho chắc chắn.
  answer_key:
    option_effects:
      q1_n1_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n2
        explanation: 'Chẩn đoán chính xác: Log chỉ ra thiếu DB connection, việc kiểm
          tra DB connection & locks giúp xác định xem lỗi từ DB hay ứng dụng.'
      q1_n1_o2:
        points: 0
        minutes_cost: 5
        next_node: q1_n1
        explanation: 'Sai lầm: Lỗi nằm ở connection pool đến DB, restart API Gateway
