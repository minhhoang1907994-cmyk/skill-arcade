  difficulty: medium
- content:
    scenario: Microservice 'export-service' trên Kubernetes cluster bị sập liên tục.
      Pod chuyển sang trạng thái OOMKilled và restart lại hơn 20 lần trong 1 giờ qua,
      làm gián đoạn tính năng xuất báo cáo PDF hàng tháng của khách hàng doanh nghiệp.
    initial_logs: |-
      Kubelet: Container export-service in pod export-service-7f9d86b-x82kz status: Terminated, reason: OOMKilled, exit code: 137.
      Metrics: Memory usage reached 2048Mi (Limit: 2048Mi). High GC pause time observed (>15s) prior to termination.
    nodes:
    - key: q2_n1
      prompt: Pod bị OOMKilled liên tục do vượt quá Memory Limit. Bạn thực hiện bước
        đầu tiên nào để tìm nguyên nhân?
      options:
      - key: q2_n1_o1
        label: Xem log ứng dụng trước thời điểm bị kill và kiểm tra metric mức độ
          tăng trưởng RAM của JVM (Heap/Non-Heap).
      - key: q2_n1_o2
        label: Tăng CPU Limit của Pod từ 1 Core lên 4 Cores.
      - key: q2_n1_o3
        label: Xóa Deployment export-service và tạo lại từ đầu.
    - key: q2_n2
      prompt: Log cho thấy RAM tăng vọt mỗi khi người dùng bấm xuất báo cáo dữ liệu
        lớn. Bạn thu thập dữ liệu gì để phân tích chi tiết bộ nhớ?
      options:
      - key: q2_n2_o1
        label: Cấu hình tự động Dump Heap khi sắp out of memory (-XX:+HeapDumpOnOutOfMemoryError)
          hoặc thực hiện jmap dump thủ công.
      - key: q2_n2_o2
        label: Scale số lượng Replica Pod từ 2 lên 50.
      - key: q2_n2_o3
        label: Dọn dẹp thư mục tạm trong ổ đĩa của Worker Node.
    - key: q2_n3
      prompt: Phân tích Heap Dump với Eclipse MAT, bạn thấy hàng ngàn instance 'byte[]'
        và 'org.apache.pdfbox.pdmodel.PDDocument' chiếm 85% dung lượng Heap. Bạn đưa
        ra kết luận gì?
      options:
      - key: q2_n3_o1
        label: Ứng dụng bị Memory Leak trong quá trình tạo tài liệu PDF, các đối tượng
          Stream/Document không được giải phóng sau khi ghi xong.
      - key: q2_n3_o2
        label: Do thư viện Apache PDFBox bị lỗi nạp file cấu hình XML.
      - key: q2_n3_o3
        label: Tăng ngay RAM Limit của Container trên Kubernetes từ 2GB lên 32GB.
    - key: q2_n4
      prompt: Đọc lại code trong PdfReportGenerator.java, bạn phát hiện ByteArrayOutputStream
        và PDDocument được khởi tạo nhưng thiếu khối lệnh đóng tài nguyên. Khắc phục
        chuẩn trong Java là gì?
      options:
      - key: q2_n4_o1
        label: Sử dụng cấu trúc try-with-resources cho PDDocument và OutputStream
          để đảm bảo luôn gọi close() tự động.
      - key: q2_n4_o2
        label: Gọi System.gc() ở cuối hàm tạo PDF.
      - key: q2_n4_o3
