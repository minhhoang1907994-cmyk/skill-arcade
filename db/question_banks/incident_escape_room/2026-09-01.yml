  difficulty: medium
- content:
    scenario: Dịch vụ xử lý hóa đơn (invoice-service) trên Kubernetes liên tục rơi
      vào trạng thái CrashLoopBackOff. Khách hàng tải ảnh hóa đơn lên bị lỗi 500 liên
      tục.
    initial_logs: |-
      K8s Event: Pod invoice-service-6789b-x2z1 CrashLoopBackOff
      Last State: Terminated - Reason: OOMKilled - Exit Code: 137
      JVM Log: java.lang.OutOfMemoryError: Java heap space at com.service.ImageProcessor.resize(ImageProcessor.java:42)
    nodes:
    - key: q2_node1
      prompt: 'Bước 1: Pod bị OOMKilled liên tục với Exit Code 137. Bạn kiểm tra thông
        tin gì đầu tiên?'
      options:
      - key: q2_n1_o1
        label: Kiểm tra chi tiết k8s pod resource limits/requests và thông số JVM
          Heap memory cấu hình.
      - key: q2_n1_o2
        label: Khởi động lại toàn bộ Worker Node của cụm Kubernetes.
      - key: q2_n1_o3
        label: Xóa Pod bị lỗi để Kubernetes tự tạo Pod mới.
    - key: q2_node2
      prompt: 'Bước 2: Cấu hình Pod Limit RAM là 2GB, `-Xmx1536m`. Tuy nhiên Pod bị
        kill ngay khi xử lý file hóa đơn lớn. Bạn điều tra tiếp ra sao?'
      options:
      - key: q2_n2_o1
        label: Trích xuất Heap Dump hoặc phân tích code tại `ImageProcessor.java:42`
          để tìm Memory Leak.
      - key: q2_n2_o2
        label: Giảm bớt Ram limit của Pod xuống 1GB để K8s thu hồi bộ nhớ nhanh hơn.
      - key: q2_n2_o3
        label: Chuyển Pod sang chạy trên một Node khác trong cụm.
    - key: q2_node3
      prompt: 'Bước 3: Soi code thấy: `BufferedImage img = ImageIO.read(fileInputStream)`
        load toàn bộ file ảnh 50MB dạng uncompressed Bitmap vào RAM mà không đóng
        Stream. Nguyên nhân gây OOM là gì?'
      options:
      - key: q2_n3_o1
        label: Ảnh uncompressed 50MB khi bung ra Bitmap chiếm > 1GB RAM + InputStream
          không đóng gây rò rỉ bộ nhớ.
      - key: q2_n3_o2
        label: Do phiên bản Java quá cũ không hỗ trợ đọc file ảnh.
      - key: q2_n3_o3
        label: Do đĩa cứng của Pod bị đầy không ghi thêm được file.
    - key: q2_node4
      prompt: 'Bước 4: Trong lúc chờ sửa code, hệ thống vẫn đang gián đoạn. Biện pháp
        cấp bách tạm thời trên Production là gì?'
      options:
      - key: q2_n4_o1
        label: Tạm thời nâng Pod Limit RAM lên 4GB và giới hạn dung lượng file upload
          tối đa 10MB tại Nginx Gateway.
      - key: q2_n4_o2
        label: Tắt hoàn toàn tính năng xử lý hóa đơn cho đến khi sửa xong code.
      - key: q2_n4_o3
        label: Tăng số lượng Pod replica lên 20 pods.
    - key: q2_node5
      prompt: 'Bước 5: Giải pháp khắc phục triệt để về mặt lập trình là gì?'
      options:
      - key: q2_n5_o1
        label: Dùng try-with-resources để close stream và dùng thư viện stream-based
          image processing (như Thumbnails / Marvin).
      - key: q2_n5_o2
        label: Gọi `System.gc()` thủ công sau mỗi lần xử lý ảnh xong.
      - key: q2_n5_o3
        label: Lưu file ảnh trực tiếp vào cơ sở dữ liệu dưới dạng BLOB.
    - key: q2_node6
      prompt: 'Bước 6: Bạn đã viết xong code hotfix và chuẩn bị test. Quy trình test
        kiểm chứng bộ nhớ nên diễn ra thế nào?'
      options:
      - key: q2_n6_o1
        label: Chạy Benchmark test upload đồng thời 50 file ảnh kích thước lớn trên
          Staging và theo dõi JVM Heap Memory.
      - key: q2_n6_o2
        label: Upload thử 1 file ảnh nhỏ 100KB trên máy cá nhân rồi push code ngay.
      - key: q2_n6_o3
        label: Bỏ qua bước test, deploy thẳng lên Prod để tiết kiệm thời gian.
    - key: q2_node7
      prompt: 'Bước 7: Test Staging cho thấy RAM duy trì ổn định dưới 400MB. Bạn tiến
        hành deploy lên Production như thế nào?'
      options:
      - key: q2_n7_o1
        label: Thực hiện Rolling Update từng Pod và theo dõi k8s metrics / error logs
          trong quá trình rollout.
      - key: q2_n7_o2
        label: Delete toàn bộ Deployment cũ và Apply Deployment mới cùng lúc.
      - key: q2_n7_o3
        label: Deploy hotfix vào ban đêm không cần thông báo team.
    - key: q2_node8
      prompt: 'Bước 8: Deploy thành công, các Pod hoạt động bình thường, không còn
        lỗi OOMKilled. Khách hàng xử lý hóa đơn mượt mà.'
      options:
      - key: q2_n8_o1
        label: Điều chỉnh lại RAM Limit chuẩn cho Pod, hoàn tất tài liệu Post-mortem
          và đóng ticket sự cố.
      - key: q2_n8_o2
        label: Giữ nguyên cấu hình Pod RAM 4GB vĩnh viễn không điều chỉnh lại.
      - key: q2_n8_o3
        label: Xóa hết log ứng dụng cũ để giải phóng dung lượng đĩa.
