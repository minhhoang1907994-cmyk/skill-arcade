      q1_n7_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_node8
        explanation: Đúng quy trình! Cần kiểm tra bức tranh tổng thể qua các chỉ số
          hạ tầng và ứng dụng.
      q1_n7_o2:
        points: 5
        minutes_cost: 4
        next_node: q1_node8
