  difficulty: hard
- content:
    scenario: Hệ thống Đặt hàng (Order Service) bị treo trong đợt Flash Sale. Khách
      hàng báo lỗi 500 khi bấm 'Thanh toán', tỷ lệ lỗi tăng vọt lên 45%.
    initial_logs: |-
      2023-10-24 10:00:05.123 ERROR [order-service,,] 15 --- [nio-8080-exec-8] c.e.order.service.OrderService : Connection pool total=50, active=50, idle=0, waiting=128
      org.springframework.dao.CannotGetJdbcConnectionException: Could not get JDBC Connection; nested exception is com.zaxxer.hikari.pool.HikariPool$PoolInitializationException: Timeout of 30000ms encountered waiting for connection.
    nodes:
    - key: N1
      prompt: Hệ thống cảnh báo lỗi 500 hàng loạt ở API /api/v1/orders. Bạn kiểm tra
        bước nào đầu tiên?
      options:
      - key: opt_1_1
        label: Xem chỉ số HikariCP Connection Pool và chỉ số CPU/RAM của Order Service.
      - key: opt_1_2
        label: Khởi động lại (Restart) toàn bộ các Pod của Order Service ngay lập
          tức.
      - key: opt_1_3
        label: Tăng gấp đôi số lượng Replicas (Scale out) cho Order Service trên Kubernetes.
    - key: N2
      prompt: Metric cho thấy HikariCP đạt mức tối đa 50/50 active connections và
        128 request đang chờ. Bước tiếp theo là gì?
      options:
      - key: opt_2_1
        label: Kiểm tra danh sách slow query và active sessions trong cơ sở dữ liệu
          Postgres.
      - key: opt_2_2
        label: Tăng max_connections của Postgres từ 100 lên 1000 trong cấu hình.
      - key: opt_2_3
        label: Xóa bộ nhớ đệm Redis cache của ứng dụng.
    - key: N3
      prompt: Trạng thái pg_stat_activity cho thấy hàng chục query 'SELECT * FROM
        inventory WHERE item_id = $1 FOR UPDATE' rơi vào trạng thái 'idle in transaction'.
        Bạn sẽ làm gì?
      options:
      - key: opt_3_1
        label: Kiểm tra mã nguồn Order Service nơi bắt đầu và kết thúc transaction
          giữ khóa kho hàng.
      - key: opt_3_2
        label: Dùng lệnh pg_terminate_backend để kill toàn bộ query FOR UPDATE.
      - key: opt_3_3
        label: Tắt tính năng Database Transaction trong cấu hình ứng dụng.
    - key: N4
      prompt: Phân tích mã nguồn phát hiện phương thức createOrder() dùng annotation
        @Transactional, bên trong gọi HTTP request sang Payment Gateway bên thứ ba.
        Bước tiếp theo?
      options:
      - key: opt_4_1
        label: Kiểm tra thời gian phản hồi (latency) của API bên Payment Gateway.
      - key: opt_4_2
        label: Tăng HTTP timeout gọi sang Payment Gateway từ 30 giây lên 120 giây.
      - key: opt_4_3
        label: Sửa code ngay trên nhánh main để bỏ @Transactional mà không test.
    - key: N5
      prompt: Payment Gateway phản hồi chậm (25-30 giây/request) do bên họ bị nghẽn.
        Điều này làm giữ kết nối DB quá lâu. Phương án xử lý tạm thời và dài hạn là
        gì?
      options:
      - key: opt_5_1
        label: Áp dụng Timeout ngắn (2s) + Circuit Breaker cho Payment call và tách
          Payment call ra khỏi DB transaction.
      - key: opt_5_2
        label: Tăng HikariCP connection pool lên 500 để đủ chỗ chứa các transaction
          bị nghẽn.
      - key: opt_5_3
        label: Tắt hoàn toàn dịch vụ đặt hàng đến khi Payment Gateway bình thường
          trở lại.
    - key: N6
      prompt: Trong lúc chờ build bản Hotfix, làm thế nào để giải phóng bớt kết nối
        DB bị treo ngay tức thì?
      options:
      - key: opt_6_1
        label: Kill các connection 'idle in transaction' quá 10 giây trên DB và giảm
          timeout ở API Gateway tạm thời.
      - key: opt_6_2
        label: Reboot lại Server Master Database.
      - key: opt_6_3
        label: Yêu cầu người dùng xóa cookie trình duyệt.
    - key: N7
      prompt: Bản Hotfix tách Payment call ra ngoài Transaction đã sẵn sàng. Bạn thực
        hiện kiểm thử và triển khai như thế nào?
      options:
      - key: opt_7_1
        label: Chạy unit/integration test, deploy lên môi trường Staging kiểm tra
          rồi mới deploy Canary lên Production.
      - key: opt_7_2
        label: Deploy thẳng bản Hotfix lên 100% server Production để tiết kiệm thời
          gian.
      - key: opt_7_3
        label: Chờ đến nửa đêm hết giờ Flash Sale mới deploy.
    - key: N8
      prompt: Bản Hotfix đã lên Canary pod. Bạn đánh giá hiệu quả qua chỉ số nào trước
        khi roll out toàn bộ?
      options:
      - key: opt_8_1
        label: Theo dõi active connection HikariCP giảm xuống, latency giảm và tỷ
          lệ lỗi 500 trở về 0%.
      - key: opt_8_2
        label: Rollback ngay lập tức vì thấy vẫn còn request bị lỗi từ phía đối tác.
      - key: opt_8_3
        label: Tắt bớt hệ thống log APM để đỡ tốn CPU.
  answer_key:
    option_effects:
      opt_1_1:
        points: 10
        minutes_cost: 1
        next_node: N2
        explanation: Chính xác. Kiểm tra chỉ số pool và tài nguyên giúp xác định ngay
          nguyên nhân nghẽn từ ứng dụng hay cơ sở dữ liệu.
      opt_1_2:
        points: 0
        minutes_cost: 5
        next_node: N2
        explanation: Sai lầm. Restart pod chỉ giải phóng connection tạm thời vài giây
          rồi bị nghẽn lại ngay, làm gián đoạn thêm dịch vụ.
      opt_1_3:
        points: 5
        minutes_cost: 3
        next_node: N2
        explanation: Không hiệu quả. Scale pod sẽ mở thêm kết nối tới DB, dễ làm cạn
          kiệt max_connections của DB Server.
      opt_2_1:
        points: 10
        minutes_cost: 1
        next_node: N3
        explanation: Chính xác. Cần tìm xem query nào đang chiếm giữ connection quá
          lâu.
      opt_2_2:
        points: 0
        minutes_cost: 4
        next_node: N3
        explanation: Sai lầm. Tăng max_connections làm DB quá tải CPU/RAM và sập luôn
          DB Master.
      opt_2_3:
        points: 5
        minutes_cost: 2
        next_node: N3
        explanation: Lãng phí thời gian. Lỗi do nghẽn DB connection chứ không liên
          quan cache Redis.
      opt_3_1:
        points: 10
        minutes_cost: 1
        next_node: N4
        explanation: Chính xác. 'idle in transaction' chỉ ra có logic xử lý lâu nằm
          bên trong một DB Transaction mở.
      opt_3_2:
        points: 0
        minutes_cost: 3
        next_node: N4
        explanation: Sai lầm. Kill query chỉ là phần ngọn, request mới vào lại tiếp
          tục treo lock.
      opt_3_3:
        points: 0
        minutes_cost: 5
        next_node: N4
        explanation: Rất nguy hiểm. Tắt transaction dẫn đến sai lệch dữ liệu kho và
          trùng đơn hàng.
      opt_4_1:
        points: 10
        minutes_cost: 1
        next_node: N5
        explanation: Chính xác. Gọi I/O ngoài (như Payment Gateway) trong DB Transaction
          là anti-pattern kinh điển.
      opt_4_2:
        points: 0
        minutes_cost: 3
        next_node: N5
        explanation: Sai lầm. Tăng timeout càng làm giữ DB connection lâu hơn, trầm
          trọng hóa sự cố.
      opt_4_3:
        points: 0
        minutes_cost: 10
        next_node: N5
        explanation: Quá rủi ro. Sửa hotfix không test trên main dễ gây ra bug mất
          mát tiền bạc.
      opt_5_1:
        points: 10
        minutes_cost: 2
        next_node: N6
        explanation: Chính xác. Circuit breaker và timeout ngắn ngắt kết nối lỗi nhanh,
          tách rời I/O giải phóng DB.
      opt_5_2:
        points: 0
        minutes_cost: 4
        next_node: N6
        explanation: Sai lầm. Tăng pool làm cạn kiệt RAM server ứng dụng và treo toàn
          bộ pod.
      opt_5_3:
        points: 0
        minutes_cost: 5
        next_node: N6
        explanation: Sai lầm. Tắt dịch vụ làm ngưng trệ kinh doanh hoàn toàn.
      opt_6_1:
        points: 10
        minutes_cost: 1
        next_node: N7
        explanation: Chính xác. Đây là giải pháp chữa cháy ngay lập tức để giải phóng
          tài nguyên DB bị ngẽn.
      opt_6_2:
        points: 0
        minutes_cost: 6
        next_node: N7
        explanation: Sai lầm. Reboot DB gây gián đoạn toàn bộ hệ thống và có thể làm
          hỏng dữ liệu dở dang.
      opt_6_3:
        points: 5
        minutes_cost: 2
        next_node: N7
        explanation: Vô ích. Lỗi hoàn toàn ở backend, không liên quan cookie khách
          hàng.
      opt_7_1:
        points: 10
        minutes_cost: 2
        next_node: N8
        explanation: Chính xác. Quy trình chuẩn giúp đảm bảo Hotfix an toàn và không
          gây bug mới.
      opt_7_2:
        points: 0
        minutes_cost: 5
        next_node: N8
        explanation: Rủi ro cao. Triển khai 100% không qua Canary có thể làm sập toàn
          bộ hệ thống nếu hotfix lỗi.
      opt_7_3:
        points: 0
        minutes_cost: 10
        next_node: N8
        explanation: Sai lầm. Bỏ mặc sự cố trong thời điểm vàng Flash Sale gây thiệt
          hại lớn.
      opt_8_1:
        points: 10
        minutes_cost: 1
        next_node: N_RECOVERY
        explanation: Chính xác! Chỉ số kết nối DB hạ nhiệt và tỷ lệ lỗi 500 về 0%
          khẳng định sự cố đã khôi phục hoàn toàn.
      opt_8_2:
        points: 0
        minutes_cost: 4
        next_node: N8
        explanation: Sai lầm. Việc Payment Gateway trả về lỗi khi ngắt timeout là
          đúng thiết kế fallback.
      opt_8_3:
        points: 0
        minutes_cost: 3
        next_node: N8
        explanation: Sai lầm. Tắt APM làm mất khả năng quan sát hệ thống trong lúc
          đang khắc phục.
    recovery_node: N_RECOVERY
  difficulty: medium
- content:
    scenario: API Gateway liên tục bị crash OOMKilled trên Kubernetes. Cùng lúc đó,
      dịch vụ Xác thực (Auth Service) báo lỗi Redis 'OOM command not allowed when
      used memory > maxmemory'.
    initial_logs: |-
      2023-10-24 14:15:00 K8s Event: Pod api-gateway-78d4b9b94-x2z91 OOMKilled (Exit Code 137)
      Redis Log: (error) OOM command not allowed when used memory > 'maxmemory'. Key eviction skipped because maxmemory-policy is 'noeviction'.
    nodes:
    - key: M1
      prompt: API Gateway bị OOMKilled liên tục và Redis báo lỗi full bộ nhớ. Bạn
        ưu tiên kiểm tra chỉ số nào trước?
      options:
      - key: opt_m1_1
        label: Xem biểu đồ Heap Memory, GC log của API Gateway và dung lượng bộ nhớ
          Redis.
      - key: opt_m1_2
        label: Khởi động lại toàn bộ các dịch vụ microservices phía sau Gateway.
      - key: opt_m1_3
        label: Xóa toàn bộ cache trang tĩnh trên CDN.
    - key: M2
      prompt: Chỉ số Node.js Heap Memory của API Gateway tăng liên tục không giảm
        (Memory Leak) cho đến khi pod bị kill. Làm sao tìm nguyên nhân rò rỉ bộ nhớ?
      options:
      - key: opt_m2_1
        label: Thực hiện Heap Snapshot và phân tích các object đang chiếm giữ bộ nhớ
          bằng DevTools/Profiler.
      - key: opt_m2_2
        label: Tăng giới hạn RAM (RAM limit) của Pod Gateway từ 2GB lên 16GB trên
          Kubernetes.
      - key: opt_m2_3
        label: Đổi plugin mạng CNI của cụm Kubernetes.
    - key: M3
      prompt: Heap Snapshot cho thấy hàng triệu object 'TokenSession' lưu trong một
        Map toàn cục (In-memory fallback cache) khi không ghi được vào Redis. Bước
        xử lý tiếp theo?
      options:
      - key: opt_m3_1
        label: Điều tra lý do tại sao Redis từ chối ghi session và cấu hình fallback
          bị tràn RAM.
      - key: opt_m3_2
        label: Viết script tự động restart Pod Gateway mỗi 5 phút một lần.
      - key: opt_m3_3
        label: Tắt hoàn toàn tính năng xác thực JWT trên Gateway.
    - key: M4
      prompt: Redis bị OOM và trả về lỗi không cho ghi dữ liệu mới. Bạn dùng lệnh
        gì kiểm tra thực trạng bộ nhớ Redis?
      options:
      - key: opt_m4_1
        label: Chạy 'redis-cli --bigkeys' và kiểm tra thông số 'maxmemory-policy'
          trong config.
      - key: opt_m4_2
        label: Chạy lệnh 'FLUSHALL' trên Redis Master để xóa sạch dữ liệu ngay lập
          tức.
      - key: opt_m4_3
        label: Nâng cấp gói Cloud Server chứa Redis lên gấp đôi dung lượng.
    - key: M5
      prompt: Phát hiện Redis maxmemory-policy đang đặt là 'noeviction' và session
        key được ghi mà KHÔNG cài thời gian hết hạn (TTL). Bạn xử lý cấu hình thế
        nào?
      options:
      - key: opt_m5_1
        label: Đổi maxmemory-policy thành 'volatile-lru' và cập nhật code backend
          bắt buộc đặt TTL cho session key.
      - key: opt_m5_2
        label: Bỏ giới hạn maxmemory trong file cấu hình redis.conf.
      - key: opt_m5_3
        label: Xóa cơ sở dữ liệu Postgres để lấy lại dung lượng đĩa cứng.
    - key: M6
      prompt: Đã đổi cấu hình Redis sang volatile-lru, nhưng các Pod Gateway hiện
        tại vẫn đang bị phồng Heap do đống In-memory Map cũ. Làm sao dọn dẹp RAM ngay?
      options:
      - key: opt_m6_1
        label: Deploy bản sửa lỗi bỏ fallback map vô hạn + thực hiện Rolling Restart
          các pod Gateway.
      - key: opt_m6_2
        label: Tắt cụm cơ sở dữ liệu chính.
      - key: opt_m6_3
        label: Chặn 90% lượng truy cập người dùng tại Cloudflare.
    - key: M7
      prompt: Sau khi Rolling Restart Gateway và cập nhật Redis, bạn theo dõi những
        chỉ số nào để đảm bảo hệ thống thực sự ổn định?
      options:
      - key: opt_m7_1
        label: Theo dõi đồ thị Heap Used ổn định sau GC, số lượng Redis Evicted Keys
          và HTTP status 200.
      - key: opt_m7_2
        label: Thấy Pod chạy được 2 phút không crash là đóng máy đi ăn trưa.
