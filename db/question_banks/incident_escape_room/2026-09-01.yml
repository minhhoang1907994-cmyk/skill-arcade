      q1_n4_o1:
        points: 10
        minutes_cost: 2
        next_node: q1_node5
        explanation: Chuẩn xác! Dùng Mutex/Distributed lock giúp chặn hiệu quả dòng
          request đồng thời đổ vào DB.
      q1_n4_o2:
        points: 5
        minutes_cost: 5
        next_node: q1_node5
        explanation: Rate limiting chặn khách hàng làm giảm trải nghiệm người dùng,
          chỉ nên là giải pháp cuối cùng.
      q1_n4_o3:
        points: 0
        minutes_cost: 8
        next_node: q1_node4
        explanation: Tăng max_connections sẽ làm DB hết RAM và sập (OOM Panic).
      q1_n5_o1:
        points: 10
        minutes_cost: 2
        next_node: q1_node6
        explanation: Rất tốt! TTL Jitter giúp triệt tiêu việc nhiều key hết hạn cùng
          một thời điểm trong tương lai.
      q1_n5_o2:
        points: 5
        minutes_cost: 4
        next_node: q1_node6
        explanation: Set vĩnh viễn gây ra rủi ro sai lệch dữ liệu (stale data) khi
          thông tin sản phẩm hoặc giá thay đổi.
      q1_n5_o3:
        points: 0
        minutes_cost: 7
        next_node: q1_node5
        explanation: TTL 5 giây quá ngắn, vẫn khiến DB chịu tải cực cao liên tục.
      q1_n6_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_node7
        explanation: Tuyệt vời! Warmup cache giúp đón đầu lượng request của khách
          hàng mà không bắt DB phải gánh tải ban đầu.
      q1_n6_o2:
        points: 5
        minutes_cost: 3
        next_node: q1_node7
        explanation: Có thể làm lag nhẹ trong vài giây đầu khi người dùng vào app.
      q1_n6_o3:
        points: 0
        minutes_cost: 6
        next_node: q1_node6
