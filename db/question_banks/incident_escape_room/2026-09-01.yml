- content:
    scenario: Hệ thống quản lý đơn hàng Order Service đột ngột dừng tiếp nhận đơn
      mới. Mọi yêu cầu ghi vào Cơ sở dữ liệu PostgreSQL Master đều thất bại với lỗi
      Disk Full. Hệ thống cảnh báo báo động đĩa cứng chứa `/var/lib/postgresql/data`
      đã chạm ngưỡng 100%.
    initial_logs: |-
      2023-11-11 14:22:01 UTC [12041] FATAL: could not write to file "pg_wal/xlogtemp.12041": No space left on device
      2023-11-11 14:22:01 UTC [12041] DETAIL: Disk usage on /var/lib/postgresql/data is 100% (500GB/500GB).
      2023-11-11 14:22:02 UTC [12042] LOG: checkpointer process exiting due to disk full
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: PostgreSQL Master bị đầy đĩa 100% và không thể ghi log WAL
        mới. Bạn sẽ kiểm tra thư mục nào đầu tiên để xác định nguồn gốc dung lượng
        bị phình to?'
      options:
      - key: q2_n1_o1
        label: Kiểm tra kích thước của thư mục `pg_wal` và các bảng dữ liệu bằng câu
          lệnh terminal / SQL.
      - key: q2_n1_o2
        label: Xóa ngay lập tức toàn bộ thư mục `/var/log` trên hệ điều hành.
      - key: q2_n1_o3
        label: Khởi động lại máy chủ PostgreSQL Master ngay lập tức.
    - key: q2_n2
      prompt: 'Bước 2: Phát hiện thư mục `pg_wal` chiếm hơn 350GB (bình thường chỉ
        khoảng 20GB). Lý do nào khiến PostgreSQL giữ lại nhiều file WAL chưa xóa?'
      options:
      - key: q2_n2_o1
        label: Kiểm tra trạng thái của Replication Slots và WAL Archiving status.
      - key: q2_n2_o2
        label: Do cơ sở dữ liệu có quá nhiều chỉ mục (Index) chưa được tối ưu.
      - key: q2_n2_o3
        label: Do ứng dụng gửi quá nhiều truy vấn SELECT đọc dữ liệu.
    - key: q2_n3
      prompt: 'Bước 3: Truy vấn `SELECT * FROM pg_replication_slots;` trả về 1 slot
        tên `analytics_slot` có trạng thái `active = false` và `wal_status = lost/unreserved`
        với restart_lsn rất cũ. Đánh giá của bạn?'
      options:
      - key: q2_n3_o1
        label: Slot replication của bên Analytics đã ngắt kết nối nhưng chưa được
          hủy, khiến PG giữ lại tất cả WAL log từ thời điểm đó.
      - key: q2_n3_o2
        label: Replication slot này đang hoạt động rất tốt và cần giữ nguyên.
      - key: q2_n3_o3
        label: Do RAM của máy chủ phụ (Replica) bị tràn.
    - key: q2_n4
      prompt: 'Bước 4: Bạn cần giải phóng ngay lập tức dung lượng đĩa do `analytics_slot`
        giữ lại. Thao tác chuẩn xác là gì?'
      options:
      - key: q2_n4_o1
        label: Thực thi lệnh SQL `SELECT pg_drop_replication_slot('analytics_slot');`.
      - key: q2_n4_o2
        label: Dùng lệnh Linux `rm -rf pg_wal/*` để xóa thủ công các file WAL.
      - key: q2_n4_o3
        label: Tạo thêm một Replication Slot mới để đè lên slot cũ.
    - key: q2_n5
      prompt: 'Bước 5: Sau khi drop slot, đĩa vẫn chưa giảm ngay về mức an toàn vì
        PostgreSQL chưa kích hoạt Checkpoint dọn dẹp các file WAL cũ. Bạn xử lý như
        thế nào?'
      options:
      - key: q2_n5_o1
        label: Thực thi lệnh `CHECKPOINT;` trong SQL session để ép PG giải phóng các
          file WAL đã hết hiệu lực.
      - key: q2_n5_o2
        label: Restart lại toàn bộ server vật lý.
      - key: q2_n5_o3
        label: Mở rộng ổ đĩa EBS/Cloud Disk lên thêm 1TB mà không can thiệp DB.
    - key: q2_n6
      prompt: 'Bước 6: Dung lượng đĩa giải phóng về 35% (175GB/500GB). PostgreSQL
        đã cho phép ghi trở lại. Tiếp theo bạn phục hồi kết nối dịch vụ Order Service
        như thế nào?'
      options:
      - key: q2_n6_o1
        label: Kiểm tra và restart các dịch vụ background worker/API đang rơi vào
          trạng thái retry/backoff.
      - key: q2_n6_o2
        label: Xóa toàn bộ dữ liệu trong bảng tạm để tránh tràn bộ nhớ.
      - key: q2_n6_o3
        label: Để nguyên tự hệ thống khôi phục mà không làm gì.
    - key: q2_n7
      prompt: 'Bước 7: Đơn hàng mới đã bắt đầu chảy vào hệ thống. Bạn cần làm gì với
        phía Analytics Consumer bị mất slot?'
      options:
      - key: q2_n7_o1
        label: Thông báo đội Analytics re-sync dữ liệu từ snapshot mới và tạo lại
          replication slot kèm cảnh báo giám sát (Alerting).
      - key: q2_n7_o2
        label: Bỏ qua luôn không cho bên Analytics kết nối vào DB nữa.
      - key: q2_n7_o3
        label: Tự tay sửa dữ liệu trực tiếp trong database của Analytics.
    - key: q2_n8
      prompt: 'Bước 8: Sự cố phình đĩa do Orphan Replication Slot đã được giải quyết
        trọn vẹn. Bạn làm hành động phòng ngừa tương lai?'
      options:
      - key: q2_n8_o1
        label: Cấu hình `max_slot_wal_keep_size` trong PostgreSQL để giới hạn dung
          lượng WAL tối đa mà 1 slot có thể giữ.
  answer_key:
    option_effects:
      q2_n1_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_n2
        explanation: Xác định chính xác vị trí bị phình to dung lượng giúp rút ngắn
          thời gian chẩn đoán.
      q2_n1_o2:
        points: 0
        minutes_cost: 5
        next_node: q2_n2
        explanation: Xóa log OS không giải quyết được vấn đề đĩa bị chiếm bởi WAL
          log của PostgreSQL.
      q2_n1_o3:
        points: 0
        minutes_cost: 5
        next_node: q2_n2
        explanation: Restart DB khi đĩa 100% có thể khiến PostgreSQL rơi vào trạng
          thái Crash Recovery không thể boot lên được.
      q2_n2_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_n3
        explanation: Replication slot không hoạt động là nguyên nhân phổ biến nhất
          khiến thư mục `pg_wal` phình to bất thường.
      q2_n2_o2:
        points: 0
        minutes_cost: 4
        next_node: q2_n3
        explanation: Index phình to nằm ở thư mục base/data chứ không làm phình thư
          mục `pg_wal`.
      q2_n2_o3:
        points: 5
        minutes_cost: 3
        next_node: q2_n3
        explanation: Lệnh SELECT không tạo ra WAL log.
      q2_n3_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_n4
        explanation: Nhận diện chính xác nguyên nhân `analytics_slot` bị mồ côi (inactive
          slot).
      q2_n3_o2:
        points: 0
        minutes_cost: 5
        next_node: q2_n4
        explanation: Đánh giá sai lệch khiến sự cố kéo dài.
      q2_n3_o3:
        points: 5
        minutes_cost: 2
        next_node: q2_n4
        explanation: RAM của Replica ngắt kết nối không liên quan tới việc Slot trên
          Master không được hủy.
      q2_n4_o1:
        points: 10
        minutes_cost: 2
        next_node: q2_n5
        explanation: Hủy replication slot qua lệnh chuẩn của PostgreSQL giúp giải
          phóng cam kết giữ file WAL.
      q2_n4_o2:
        points: 0
        minutes_cost: 6
        next_node: q2_n5
        explanation: Dùng `rm -rf` xóa file WAL trực tiếp sẽ làm hỏng dữ liệu PostgreSQL
          (Database Corruption) vĩnh viễn!
      q2_n4_o3:
        points: 5
        minutes_cost: 3
        next_node: q2_n5
        explanation: Tạo thêm slot chỉ làm tiêu tốn thêm tài nguyên.
      q2_n5_o1:
        points: 10
        minutes_cost: 2
        next_node: q2_n6
        explanation: Lệnh CHECKPOINT ép PostgreSQL xóa ngay các file WAL thừa đã bỏ
          đánh dấu.
      q2_n5_o2:
        points: 0
        minutes_cost: 5
        next_node: q2_n6
        explanation: Restart server lúc này tốn nhiều thời gian và không cần thiết.
      q2_n5_o3:
        points: 5
        minutes_cost: 3
        next_node: q2_n6
        explanation: Mở rộng đĩa tốn chi phí và không giải quyết được nguồn gốc của
          việc rò rỉ đĩa.
      q2_n6_o1:
        points: 10
        minutes_cost: 2
        next_node: q2_n7
        explanation: Kích hoạt lại các worker bị đơ giúp luồng xử lý đơn hàng khôi
          phục ngay lập tức.
      q2_n6_o2:
        points: 0
        minutes_cost: 4
        next_node: q2_n7
        explanation: Xóa dữ liệu bừa bãi gây mất mát dữ liệu nghiêm trọng.
      q2_n6_o3:
        points: 5
        minutes_cost: 3
        next_node: q2_n7
        explanation: Một số kết nối bị đứt có thể không tự phục hồi nếu không ngắt/khởi
          động lại dịch vụ ứng dụng.
      q2_n7_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_n8
        explanation: Đảm bảo sự phối hợp giữa các đội phát triển và thiết lập giám
          sát tránh tái diễn.
      q2_n7_o2:
        points: 0
        minutes_cost: 5
        next_node: q2_n8
        explanation: Bỏ qua nhu cầu nghiệp vụ của đội khác là cách làm thiếu chuyên
          nghiệp.
      q2_n7_o3:
        points: 5
        minutes_cost: 2
        next_node: q2_n8
        explanation: Không nên can thiệp trực tiếp dữ liệu bên ngoài phạm vi quản
          lý.
      q2_n8_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_n8
        explanation: Cấu hình `max_slot_wal_keep_size` (có từ PG13) là chốt chặn kỹ
          thuật hoàn hảo để bảo vệ đĩa không bao giờ bị tràn do inactive slot.
    recovery_node: q2_n8
  difficulty: hard
- content:
    scenario: Vào lúc 14:00 giờ cao điểm, hệ thống thanh toán báo động đỏ. Tỷ lệ lỗi
      HTTP 500 tăng vọt trên API Gateway, người dùng không thể thực hiện giao dịch
      mua hàng.
    initial_logs: "[ERROR] 2023-10-24 14:02:11.102 [http-nio-8080-exec-45] c.e.p.s.OrderService:
      Connection leak detected or pool exhausted. Caused by: org.postgresql.util.PSQLException:
      Timeout waiting for connection from pool (HikariPool-1 - Connection is not available,
      request timed out after 30000ms)."
    nodes:
    - key: q1_n1
      prompt: Hệ thống đang trả về lỗi HTTP 500 hàng loạt. Bạn sẽ làm gì đầu tiên
        để phân tích hiện trạng?
      options:
      - key: q1_opt_1a
        label: Kiểm tra biểu đồ HTTP status code trên API Gateway và chỉ số HikariCP
          connection pool trên Grafana.
      - key: q1_opt_1b
        label: Khởi động lại toàn bộ pod của API Gateway service.
      - key: q1_opt_1c
        label: Mở rộng (Scale out) số lượng pod của Frontend app lên gấp đôi.
    - key: q1_n2
      prompt: Grafana chỉ ra Connection Pool đã chạm mốc tối đa 100/100 active connections
        liên tục. Bạn sẽ kiểm tra gì tiếp theo ở phía Database?
      options:
      - key: q1_opt_2a
        label: Chạy truy vấn pg_stat_activity trên PostgreSQL để xem các query đang
          thực thi.
      - key: q1_opt_2b
        label: Tăng ngay max-pool-size lên 500 trong file application.yml rồi deploy
          lại.
      - key: q1_opt_2c
        label: Xóa toàn bộ Redis Cache để giải phóng bộ nhớ.
    - key: q1_n3
      prompt: Kết quả pg_stat_activity cho thấy hàng chục query 'SELECT * FROM orders
        WHERE user_id = ? AND status = 'PENDING' ORDER BY created_at DESC' đang chạy
        kéo dài trên 30 giây. Bước tiếp theo là gì?
      options:
      - key: q1_opt_3a
        label: Chạy EXPLAIN ANALYZE đối với câu truy vấn SELECT nói trên.
      - key: q1_opt_3b
        label: Ngắt tất cả các kết nối PostgreSQL đang ở trạng thái idle.
      - key: q1_opt_3c
        label: Xóa index cũ của bảng orders để tạo lại.
    - key: q1_n4
      prompt: EXPLAIN ANALYZE cho thấy PostgreSQL phải thực hiện Sequential Scan trên
        bảng orders (10 triệu bản ghi) do thiếu index phù hợp. Bạn sẽ làm gì?
      options:
      - key: q1_opt_4a
        label: Kiểm tra lịch sử Git commit/migration gần nhất để xem thay đổi bản
          vá vừa deploy.
      - key: q1_opt_4b
        label: Chạy lệnh VACUUM FULL orders; để tối ưu hóa dung lượng bảng.
      - key: q1_opt_4c
        label: Xóa trực tiếp các bản ghi orders cũ hơn 1 năm trong cơ sở dữ liệu.
    - key: q1_n5
      prompt: Bạn phát hiện commit mới thêm filter status nhưng script Flyway migration
        tạo composite index (user_id, status) bị fail âm thầm trên Production. Bạn
        sẽ khắc phục index thế nào?
      options:
      - key: q1_opt_5a
        label: 'Chạy SQL script: CREATE INDEX CONCURRENTLY idx_orders_user_status
          ON orders(user_id, status);'
      - key: q1_opt_5b
        label: 'Chạy SQL script: CREATE INDEX idx_orders_user_status ON orders(user_id,
          status); (không dùng CONCURRENTLY).'
      - key: q1_opt_5c
        label: Rollback toàn bộ database schema về phiên bản v1.0.
    - key: q1_n6
      prompt: Index đang được khởi tạo ngầm (CONCURRENTLY). Tuy nhiên các query chậm
        cũ vẫn đang treo giữ connection. Bạn làm gì để giải phóng ngay connection
        pool?
      options:
      - key: q1_opt_6a
        label: Dùng pg_terminate_backend(pid) hủy các process query đạn treo quá 60
          giây.
      - key: q1_opt_6b
        label: Khởi động lại máy chủ PostgreSQL chính (Master Database).
      - key: q1_opt_6c
        label: Dùng lệnh kill -9 đối với tất cả tiến trình Postgres trên OS.
    - key: q1_n7
      prompt: Các connection bị nghẽn đã giải phóng, index tạo xong. Số active connection
        giảm xuống còn 12/100. Bạn cần xác nhận điều gì?
      options:
      - key: q1_opt_7a
        label: Theo dõi latency p95/p99 của API và tỷ lệ thành công của giao dịch
          trên Grafana.
      - key: q1_opt_7b
        label: Chờ 10 phút mà không cần kiểm tra thêm chỉ số nào.
      - key: q1_opt_7c
        label: Tiến hành deploy ngay một release ứng dụng khác.
    - key: q1_recovery
      prompt: Tỷ lệ lỗi 500 quay về 0%, latency API trở lại mức bình thường dưới 100ms.
        Sự cố đã được khắc phục hoàn toàn! Hành động sau sự cố là gì?
      options:
      - key: q1_opt_8a
        label: Viết báo cáo Post-Mortem và bổ sung bước kiểm tra Migration tự động
          trong CI/CD pipeline.
      - key: q1_opt_8b
        label: Đóng ticket cảnh báo và không ghi nhận thông tin.
      - key: q1_opt_8c
        label: Xóa log deployment để tránh bị truy cứu trách nhiệm.
  answer_key:
    option_effects:
      q1_opt_1a:
        points: 10
        minutes_cost: 1
        next_node: q1_n2
        explanation: Chẩn đoán chính xác đúng lớp ứng dụng và cơ sở dữ liệu bị ảnh
          hưởng.
      q1_opt_1b:
        points: 5
        minutes_cost: 4
        next_node: q1_n1
        explanation: Khởi động lại API Gateway không xử lý được gốc rễ kết nối DB
          nghẽn, làm tốn thời gian.
      q1_opt_1c:
        points: 0
        minutes_cost: 6
        next_node: q1_n1
        explanation: Scale out Frontend làm tăng lượng request xuống Backend, khiến
          DB nghẽn nặng hơn.
      q1_opt_2a:
        points: 10
        minutes_cost: 1
        next_node: q1_n3
        explanation: Tra cứu pg_stat_activity giúp xác định trực tiếp các truy vấn
          SQL gây nghẽn.
      q1_opt_2b:
        points: 5
        minutes_cost: 5
        next_node: q1_n2
        explanation: Tăng pool size khi query vẫn chậm chỉ làm cạn kiệt CPU/RAM của
          DB nhanh hơn.
      q1_opt_2c:
        points: 0
        minutes_cost: 4
        next_node: q1_n2
        explanation: Xóa Redis Cache không giải quyết được vấn đề kết nối DB nghẽn
          mà còn tăng tải cho DB.
      q1_opt_3a:
        points: 10
        minutes_cost: 1
        next_node: q1_n4
        explanation: EXPLAIN ANALYZE cung cấp chính xác Execution Plan để biết lý
          do query chậm.
      q1_opt_3b:
        points: 5
        minutes_cost: 3
        next_node: q1_n3
        explanation: Các connection nghẽn nằm ở trạng thái active chứ không phải idle.
      q1_opt_3c:
        points: 0
        minutes_cost: 5
        next_node: q1_n3
        explanation: Xóa index bừa bãi khi chưa hiểu rõ vấn đề có thể gây sập các
          chức năng khác.
      q1_opt_4a:
        points: 10
        minutes_cost: 1
        next_node: q1_n5
        explanation: Đối chiếu thay đổi code/migration giúp xác định nguyên nhân tại
          sao index bị thiếu.
      q1_opt_4b:
        points: 5
        minutes_cost: 7
        next_node: q1_n4
        explanation: VACUUM FULL sẽ lock toàn bộ bảng orders, khiến toàn bộ ứng dụng
          bị ngưng trệ hoàn toàn.
      q1_opt_4c:
        points: 0
        minutes_cost: 10
        next_node: q1_n4
        explanation: Hành động tự ý xóa dữ liệu Production gây mất mát dữ liệu nghiêm
          trọng.
      q1_opt_5a:
        points: 10
        minutes_cost: 2
        next_node: q1_n6
        explanation: Tạo index CONCURRENTLY giúp đánh index mà không khoá (exclusive
          lock) ghi/đọc bảng orders.
      q1_opt_5b:
        points: 5
        minutes_cost: 6
        next_node: q1_n5
        explanation: Tạo index thường trên bảng 10M bản ghi sẽ lock bảng trong vài
          phút, gây downtime nặng.
      q1_opt_5c:
        points: 0
        minutes_cost: 10
        next_node: q1_n5
        explanation: Rollback schema database khi không cần thiết nguy cơ làm mất
          tính nhất quán dữ liệu.
      q1_opt_6a:
        points: 10
        minutes_cost: 1
        next_node: q1_n7
        explanation: Kill các backend process bị treo giải phóng ngay connection pool
          để ứng dụng nhận kết nối mới.
      q1_opt_6b:
        points: 5
        minutes_cost: 6
        next_node: q1_n6
        explanation: Restart DB khiến toàn bộ dịch vụ ngắt kết nối và tốn thời gian
          phục hồi bộ nhớ cache.
      q1_opt_6c:
        points: 0
        minutes_cost: 8
        next_node: q1_n6
        explanation: Kill -9 tiến trình Postgres có thể gây ra hỏng WAL log hoặc đĩa
          dữ liệu.
      q1_opt_7a:
        points: 10
        minutes_cost: 1
        next_node: q1_recovery
        explanation: Theo dõi các chỉ số latency và error rate đảm bảo hệ thống thực
          sự phục hồi ổn định.
      q1_opt_7b:
        points: 5
        minutes_cost: 10
        next_node: q1_n7
        explanation: Bỏ qua công đoạn xác nhận chỉ số làm kéo dài thời gian xử lý
          sự cố.
      q1_opt_7c:
        points: 0
        minutes_cost: 7
        next_node: q1_n7
        explanation: Deploy bản mới ngay lúc hệ thống vừa khắc phục dễ gây ra sự cố
          đồng thời.
      q1_opt_8a:
        points: 10
        minutes_cost: 1
        next_node: q1_recovery
        explanation: Ghi nhận Post-Mortem và cải tiến CI/CD ngăn chặn sự cố tương
          tự lặp lại.
      q1_opt_8b:
        points: 5
        minutes_cost: 2
        next_node: q1_recovery
        explanation: Không lưu tài liệu tài nguyên làm giảm khả năng ứng phó sự cố
          cho nhóm sau này.
      q1_opt_8c:
        points: 0
        minutes_cost: 5
        next_node: q1_recovery
        explanation: Xóa log vi phạm quy trình vận hành và an toàn thông tin.
    recovery_node: q1_recovery
  difficulty: medium
- content:
    scenario: Dịch vụ xử lý xuất báo cáo PDF media-processor liên tục bị CrashLoopBackOff
      trên Kubernetes cluster Production. Khách hàng doanh nghiệp không thể tải xuống
      báo cáo tài chính.
    initial_logs: |-
      kubectl get pods -n prod
      NAME                                READY   STATUS             RESTARTS   AGE
      media-processor-7d9b4b84b5-x2z9l   0/1     CrashLoopBackOff   5          12m

      Event Log: Terminated with exit code 137
    nodes:
    - key: q2_n1
      prompt: Pod trả về Exit Code 137 và đi vào trạng thái CrashLoopBackOff. Bước
        đầu tiên để chẩn đoán nguyên nhân là gì?
      options:
      - key: q2_opt_1a
        label: Chạy lệnh kubectl describe pod media-processor-7d9b4b84b5-x2z9l -n
          prod để xem chi tiết Last State.
      - key: q2_opt_1b
        label: Scale số lượng replica của Deployment media-processor lên 10 pod.
      - key: q2_opt_1c
        label: Xóa toàn bộ Kubernetes Namespace prod và tạo lại.
    - key: q2_opt_2a
      prompt: 'Kết quả kubectl describe chỉ ra ''OOMKilled: true'' với memory limit
        là 512Mi. Bạn kiểm tra thông tin gì tiếp theo?'
      options:
      - key: q2_opt_2a
        label: Xem chỉ số biểu đồ sử dụng Memory (RAM usage) và log của container
          trước thời điểm bị kill bằng kubectl logs --previous.
      - key: q2_opt_2b
        label: Tăng ngay memory limit trong file Deployment YAML lên 8GiB rồi apply
          ngay.
      - key: q2_opt_2c
        label: Đổi imagePullPolicy thành Never trong file manifest.
    - key: q2_opt_3a
      prompt: Log ứng dụng Node.js trước khi crash cho thấy bộ nhớ vọt từ 100MB lên
        hơn 500MB ngay khi có request POST /api/v1/export-pdf. Bạn tiếp tục làm gì?
      options:
      - key: q2_opt_3a
        label: Kiểm tra mã nguồn xử lý xuất file trong PDFExportService để tìm nguy
          cơ Memory Leak.
      - key: q2_opt_3b
        label: Bật flag --trace-gc trực tiếp trên môi trường Production.
      - key: q2_opt_3c
        label: Đổi base image trong Dockerfile từ Alpine sang Ubuntu.
    - key: q2_opt_4a
      prompt: Mã nguồn xử lý file dùng fs.readFileSync() đọc toàn bộ file PDF lớn
        200MB vào Buffer trong RAM để chuyển đổi, không dùng Stream. Cách sửa triệt
        để nhất là gì?
      options:
      - key: q2_opt_4a
        label: Refactor mã nguồn sử dụng Node.js Streams (fs.createReadStream) để
          xử lý dữ liệu theo dạng chunk.
      - key: q2_opt_4b
        label: Thêm lệnh global.gc() vào cuối API handler để bắt buộc xả rác bộ nhớ.
      - key: q2_opt_4c
        label: Thêm cấu hình Nginx block hoàn toàn API POST /api/v1/export-pdf.
    - key: q2_opt_5a
      prompt: Lập trình viên đã refactor code sang Stream và kiểm tra thành công ở
        Staging. Bạn làm thế nào để đưa bản vá lên Production an toàn?
      options:
      - key: q2_opt_5a
        label: Kích hoạt pipeline CI/CD đóng gói Docker image tag v1.2.1-hotfix và
          thực hiện rolling update.
      - key: q2_opt_5b
        label: SSH vào container đang chạy và dùng vi chỉnh sửa mã nguồn trực tiếp.
      - key: q2_opt_5c
        label: Rollback phiên bản ứng dụng về bản v0.1.0 từ 2 năm trước.
    - key: q2_opt_6a
      prompt: Deployment v1.2.1-hotfix đã hoàn tất và Pod mới đang ở trạng thái Running.
        Bước tiếp theo để kiểm thử sức chịu tải là gì?
      options:
      - key: q2_opt_6a
        label: Gửi request xuất file PDF thử nghiệm và theo dõi mức sử dụng RAM qua
          Grafana / kubectl top pod.
      - key: q2_opt_6b
        label: Tắt toàn bộ hệ thống Cảnh báo (Alerting) để tránh nhiễu thông báo.
      - key: q2_opt_6c
        label: Xóa cơ sở dữ liệu để giải phóng dung lượng đĩa cứng.
    - key: q2_opt_7a
      prompt: Mức sử dụng RAM trong quá trình xuất PDF ổn định ở mức ~120MiB (so với
        mốc giới hạn 512MiB). Pod không còn bị restart. Bạn xử lý bước tiếp theo thế
        nào?
      options:
      - key: q2_opt_7a
        label: Xác nhận với bộ phận QA/Product và mở lại lưu lượng truy cập bình thường
          cho người dùng.
      - key: q2_opt_7b
        label: Giữ nguyên cấu hình ram 8GiB cho tất cả dịch vụ trong hệ thống.
      - key: q2_opt_7c
        label: Revert lại code cũ vì lo ngại phát sinh lỗi mới.
    - key: q2_recovery
      prompt: Hệ thống xuất báo cáo đã hoạt động ổn định trở lại, không có pod nào
        bị OOMKilled. Sự cố hoàn toàn kết thúc!
      options:
      - key: q2_opt_8a
        label: Tổ chức họp Post-Mortem và cập nhật chuẩn quy trình Code Review bắt
          buộc dùng Stream khi xử lý file.
      - key: q2_opt_8b
        label: Đóng công việc và không cập nhật tài liệu kiến trúc.
      - key: q2_opt_8c
        label: Xóa toàn bộ commit lịch sử sửa lỗi trên Git repository.
  answer_key:
    option_effects:
