- content:
    scenario: Vào giờ cao điểm Flash Sale 11.11, dịch vụ Checkout của nền tảng thương
      mại điện tử bị sụt giảm lượng giao dịch thành công nghiêm trọng. Khách hàng
      bấm 'Thanh toán' bị quay tròn và nhận lỗi HTTP 504 Gateway Timeout trên ứng
      dụng di động.
    initial_logs: |-
      [ERROR] 2023-11-11 12:00:15.102 [http-nio-8080-exec-42] c.e.c.service.PaymentService : Failed to process payment: redis.clients.jedis.exceptions.JedisConnectionException: Could not get a resource from the pool
      [WARN] 2023-11-11 12:00:15.105 [http-nio-8080-exec-43] c.e.c.config.RedisPool : Active connections: 10/10, Idle: 0, Waiters: 188
    nodes:
    - key: q1_n1
      prompt: 'Bước 1: Hệ thống đang báo lỗi 504 Gateway Timeout hàng loạt. Bạn nhận
        được log ban đầu như trên. Hành động đầu tiên của bạn là gì?'
      options:
      - key: q1_n1_o1
        label: Kiểm tra số lượng kết nối thực tế và chỉ số Redis Pool Metrics trên
          Grafana.
      - key: q1_n1_o2
        label: Kích hoạt Restart toàn bộ Pod của Checkout Service ngay lập tức.
      - key: q1_n1_o3
        label: Tăng gấp đôi CPU và RAM cho Checkout Service trên Kubernetes Cluster.
    - key: q1_n2
      prompt: 'Bước 2: Dashboard ghi nhận Redis Pool bị cạn kiệt (Active 10/10, Waiters
        tăng vọt). Bạn muốn làm gì tiếp theo?'
      options:
      - key: q1_n2_o1
        label: Kiểm tra cấu hình maxTotal/maxIdle của Jedis Pool trong file config
          ứng dụng.
      - key: q1_n2_o2
        label: Nâng cấp gói máy chủ Redis Cluster lên RAM lớn hơn.
      - key: q1_n2_o3
        label: Xóa toàn bộ Cache trong Redis để giải phóng bộ nhớ.
    - key: q1_n3
      prompt: 'Bước 3: File config thể hiện `jedis.pool.max-active=10`, trong khi
        Thread Pool của Tomcat lên tới 200 execution threads. Đâu là đánh giá của
        bạn?'
      options:
      - key: q1_n3_o1
        label: Cấu hình Redis Pool (10) quá nhỏ so với số lượng Web Threads (200),
          gây nghẽn cổ chai.
      - key: q1_n3_o2
        label: Tomcat Thread Pool đặt 200 là quá cao, cần hạ Tomcat Thread Pool xuống
          10.
      - key: q1_n3_o3
        label: Redis đang bị nghẽn mạng do đường truyền nghẽn hẹp.
    - key: q1_n4
      prompt: 'Bước 4: Bạn muốn đào sâu xem code có hiện tượng rò rỉ kết nối (Connection
        Leak) hay không. Bạn kiểm tra phần nào trong nguồn mã?'
      options:
      - key: q1_n4_o1
        label: Kiểm tra xem các đoạn gọi Jedis resource có sử dụng try-with-resources
          hoặc block `finally` để `.close()` không.
      - key: q1_n4_o2
        label: Kiểm tra câu lệnh SQL trong database MySQL.
      - key: q1_n4_o3
        label: Chạy bộ test kiểm thử hiệu năng (JMeter) trực tiếp trên Production.
    - key: q1_n5
      prompt: 'Bước 5: Phát hiện đoạn mã gần đây trong hàm `applyVoucher()` lấy kết
        nối Redis nhưng quên đóng trong trường hợp ném ra Exception. Phương án ứng
        phó tức thời để cứu hệ thống là gì?'
      options:
      - key: q1_n5_o1
        label: Tăng tạm thời `jedis.pool.max-active` lên 100 via Spring Cloud Config
          và Rolling Restart.
      - key: q1_n5_o2
        label: Ngắt hoàn toàn tính năng Voucher bằng cách tắt feature flag.
      - key: q1_n5_o3
        label: Chờ Dev viết xong bản sửa lỗi code đầy đủ rồi mới deploy.
    - key: q1_n6
      prompt: 'Bước 6: Tăng pool size đã giảm bớt nghẽn tạm thời, nhưng lỗ hổng rò
        rỉ vẫn tiêu tốn dần kết nối. Bản Hotfix sửa triệt để try-with-resources đã
        sẵn sàng. Bạn thực hiện quy trình deploy như thế nào?'
      options:
      - key: q1_n6_o1
        label: Deploy hotfix theo phương thức Canary / Rolling Update để đảm bảo zero-downtime.
      - key: q1_n6_o2
        label: Stop toàn bộ hệ thống trong 15 phút để deploy phiên bản mới.
      - key: q1_n6_o3
        label: Merge thẳng vào nhánh master và đẩy trực tiếp lên server production
          mà không qua CI/CD.
    - key: q1_n7
      prompt: 'Bước 7: Bản hotfix đã hoàn tất deploy lên 100% Pods. Bước xác nhận
        tiếp theo để đảm bảo sự cố đã kết thúc?'
      options:
      - key: q1_n7_o1
        label: Theo dõi chỉ số Jedis Active Connections ổn định dưới ngưỡng Max và
          đường biểu đồ HTTP 504 về 0.
      - key: q1_n7_o2
        label: Đóng Ticket sự cố ngay mà không cần kiểm tra thêm.
      - key: q1_n7_o3
        label: Gửi thông báo thành công cho toàn bộ khách hàng.
    - key: q1_n8
      prompt: 'Bước 8: Hệ thống Checkout đã hoạt động bình thường trở lại, tỷ lệ giao
        dịch thành công đạt mức 99.98%. Bạn thực hiện hành động cuối cùng nào?'
      options:
      - key: q1_n8_o1
        label: Tổ chức buổi Post-mortem phân tích nguyên nhân gốc rễ và bổ sung linter
          check quản lý tài nguyên trong CI pipeline.
