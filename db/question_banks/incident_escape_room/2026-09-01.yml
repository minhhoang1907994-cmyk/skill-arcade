    nodes:
    - key: q1_node1
      prompt: 'Bước 1: Hệ thống đang quá tải nặng. Bạn sẽ kiểm tra thành phần nào
        đầu tiên để khoanh vùng?'
      options:
      - key: q1_n1_o1
        label: Kiểm tra danh sách slow queries trên DB MySQL và chỉ số connection
          pool.
      - key: q1_n1_o2
        label: Kiểm tra log của Nginx Reverse Proxy để xem lượng request IP lạ.
      - key: q1_n1_o3
        label: Khởi động lại ngay lập tức toàn bộ cụm Redis cache server.
    - key: q1_node2
      prompt: 'Bước 2: Kết quả slow query log cho thấy câu lệnh `SELECT * FROM products
        WHERE category_id = ?` chiếm 85% CPU với hơn 6,000 QPS. Bạn làm gì tiếp theo?'
      options:
      - key: q1_n2_o1
        label: Kiểm tra lý do tại sao câu truy vấn sản phẩm lại bypass qua Redis cache
          và đập thẳng vào DB.
      - key: q1_n2_o2
        label: Thêm index mới ngay lập tức cho cột category_id trong bảng products
          trên Production DB.
      - key: q1_n2_o3
        label: Nâng cấu hình MySQL instance lên gấp đôi RAM và CPU ngay tức thì.
    - key: q1_node3
      prompt: 'Bước 3: Phát hiện Redis vừa hết hạn TTL cho toàn bộ khóa danh mục sản
        phẩm cùng một thời điểm, gây ra hiện tượng Cache Stampede (Dog-piling). Bạn
        xử lý thế nào?'
      options:
      - key: q1_n3_o1
        label: Xác định cơ chế khóa đồng thời (Distributed Lock/Mutex) hoặc Singleflight
          cho việc build cache.
      - key: q1_n3_o2
        label: Xóa toàn bộ cache cũ và flush RAM trên Redis để làm sạch dữ liệu.
      - key: q1_n3_o3
        label: Tắt hẳn dịch vụ Redis để ứng dụng đọc trực tiếp từ DB cho ổn định.
    - key: q1_node4
      prompt: 'Bước 4: Cần biện pháp khẩn cấp để ngăn hàng nghìn request cùng rebuild
        cache một lúc vào DB. Giải pháp ngăn chặn tạm thời nào tối ưu nhất?'
      options:
      - key: q1_n4_o1
        label: Áp dụng Mutex lock tại ứng dụng (chỉ 1 request rebuild cache, các request
          khác chờ hoặc nhận stale cache).
      - key: q1_n4_o2
        label: Bật Rate Limiting chặn 80% truy cập người dùng vào trang sản phẩm.
      - key: q1_n4_o3
        label: Tăng max_connections của MySQL lên 5,000 để chịu tải.
    - key: q1_node5
      prompt: 'Bước 5: Bạn chuẩn bị đoạn code hotfix để giải quyết dứt điểm hiện tượng
        Cache Stampede. Bạn sẽ áp dụng chiến lược TTL nào?'
      options:
      - key: q1_n5_o1
        label: Thêm Jitter (thời gian ngẫu nhiên 1-5 phút) vào TTL của từng cache
          key và dùng Mutex lock.
      - key: q1_n5_o2
        label: Set TTL của cache sản phẩm thành vĩnh viễn (Never expire).
      - key: q1_n5_o3
        label: Giảm TTL xuống 5 giây để dữ liệu luôn luôn là mới nhất.
    - key: q1_node6
      prompt: 'Bước 6: Hotfix đã sẵn sàng. Trước khi mở lại toàn bộ traffic, bạn làm
        gì để tránh đợt sụt giảm hiệu năng khi triển khai?'
      options:
      - key: q1_n6_o1
        label: Chạy script Cache Warmup chủ động nạp lại cache cho TOP 100 danh mục
          hot trước khi release.
      - key: q1_n6_o2
        label: Triển khai thẳng hotfix lên Production và cho người dùng tự trigger
          rebuild cache.
      - key: q1_n6_o3
        label: Restart lại toàn bộ cụm MySQL DB để xóa bộ nhớ đệm cũ.
    - key: q1_node7
      prompt: 'Bước 7: Đã deploy hotfix và Warmup cache xong. Bạn kiểm tra các chỉ
        số hệ thống như thế nào?'
      options:
      - key: q1_n7_o1
        label: Theo dõi DB CPU usage, Connection count, Cache Hit Ratio và Latency
          API trên Dashboard Grafana.
      - key: q1_n7_o2
        label: Chỉ kiểm tra log ứng dụng trong 10 giây xem còn báo lỗi 504 hay không.
      - key: q1_n7_o3
        label: Mở ứng dụng trên điện thoại cá nhân tự bấm mua thử 1 sản phẩm.
    - key: q1_node8
      prompt: 'Bước 8: Chỉ số DB CPU giảm xuống 15%, Cache Hit Ratio đạt 98%, latency
        quay về 45ms. Sự cố đã khắc phục xong!'
      options:
      - key: q1_n8_o1
        label: Chốt sự cố, viết Post-mortem ghi nhận nguyên nhân Cache Stampede và
          bổ sung rule cảnh báo TTL.
      - key: q1_n8_o2
        label: Đóng ticket sự cố ngay lập tức không cần ghi chép gì thêm.
      - key: q1_n8_o3
        label: Giảm bớt 50% số lượng Pod ứng dụng để tiết kiệm chi phí server.
  answer_key:
    option_effects:
