      options:
      - key: opt_2_2_a
        label: Kiểm tra Git commit lịch sử thay đổi gần nhất liên quan đến endpoint
          xuất báo cáo.
      - key: opt_2_2_b
        label: Cấu hình Nginx Load Balancer chia bớt tải sang service thanh toán.
      - key: opt_2_2_c
