      q2_opt_3_3:
        points: 5
        minutes_cost: 2
        next_node: q2_n4
        explanation: Tắt feature làm gián đoạn nghiệp vụ xác thực thanh toán của người
          dùng.
      q2_opt_4_1:
        points: 10
        minutes_cost: 1
        next_node: q2_n5
        explanation: Scale out pods giúp tiêu thụ lượng tin nhắn tồn đọng nhanh chóng.
      q2_opt_4_2:
        points: 0
        minutes_cost: 8
        next_node: q2_n5
        explanation: Reset offset về LATEST làm mất 50,000 trạng thái thanh toán của
          khách hàng.
      q2_opt_4_3:
        points: 0
        minutes_cost: 10
        next_node: q2_n5
        explanation: Xóa topic gây thất thoát dữ liệu giao dịch tài chính nghiêm trọng.
      q2_opt_5_1:
        points: 10
        minutes_cost: 1
        next_node: q2_n6
        explanation: Kiểm soát tốc độ gửi request giúp hệ thống tiêu thụ lag ổn định
          mà không bị 429.
      q2_opt_5_2:
        points: 0
        minutes_cost: 4
        next_node: q2_n6
        explanation: Đẩy hàng loạt tin nhắn vào DLQ bắt buộc phải xử lý lại thủ công
          sau này.
      q2_opt_5_3:
        points: 5
        minutes_cost: 5
        next_node: q2_n6
        explanation: Gửi email tốn nhiều thời gian giao tiếp và đối tác hiếm khi tắt
          Rate Limit.
      q2_opt_6_1:
        points: 10
        minutes_cost: 2
        next_node: q2_n7
        explanation: Kiểm thử Staging và chạy Canary đảm bảo hotfix hoàn toàn không
          phát sinh lỗi mới.
      q2_opt_6_2:
        points: 0
