- content:
    scenario: Dịch vụ User Auth bị treo sau khi đội phát triển triển khai bản cập
      nhật DB Schema mới. Mọi yêu cầu đăng nhập đều bị timeout và báo lỗi deadlock
      trong PostgreSQL.
    initial_logs: "[WARN] 2023-10-24 20:15:01.442 [hikari-pool-1] com.zaxxer.hikari.pool.HikariPool:
      HikariPool-1 - Connection is not available, request timed out after 30000ms.
      [ERROR] PostgreSQL deadlock detected: Process 14210 waits for ShareLock on transaction
      889123; blocked by process 14212."
    nodes:
    - key: s2_n1_start
      prompt: Hệ thống Authentication hoàn toàn ngưng trệ do lỗi Deadlock và HikariCP
        connection timeout. Bước chẩn đoán đầu tiên là gì?
      options:
      - key: s2_opt_1_1
        label: Kiểm tra log PostgreSQL và các truy vấn đang chạy (active queries)
          trên Database
      - key: s2_opt_1_2
        label: Khởi động lại ngay máy chủ cơ sở dữ liệu PostgreSQL
      - key: s2_opt_1_3
        label: Tăng dung lượng HikariCP connection pool lên gấp đôi
    - key: s2_n2_db_locks
      prompt: Bạn truy cập vào DB. Làm thế nào để tìm ra chính xác truy vấn nào đang
        giữ Lock và blocking các truy vấn khác?
      options:
      - key: s2_opt_2_1
        label: Chạy query kiểm tra pg_stat_activity kết hợp pg_locks để tìm blocking
          PID
      - key: s2_opt_2_2
        label: Xóa bớt dữ liệu trong bảng users để giảm bớt dung lượng
      - key: s2_opt_2_3
        label: Restart liên tục các pod Auth Service
    - key: s2_n3_identify_migration
      prompt: Kết quả `pg_stat_activity` cho thấy một lệnh `ALTER TABLE users ADD
        COLUMN age INT DEFAULT 18` từ Migration script đang giữ ExclusiveLock. Bạn
        đánh giá nguyên nhân thế nào?
      options:
      - key: s2_opt_3_1
        label: ALTER TABLE kèm DEFAULT giá trị trên bảng lớn cần Exclusive Lock toàn
          bộ bảng, chặn mọi truy vấn SELECT/UPDATE
      - key: s2_opt_3_2
        label: Lỗi do card mạng của server Postgres bị quá tải
      - key: s2_opt_3_3
        label: Do ổ đĩa SSD của Database server bị đầy
    - key: s2_n4_kill_blocking
      prompt: Migration script bị treo do chờ lock từ các transaction đọc đang dở
        dang, gây ra deadlock lan truyền. Bạn xử lý tiến trình bị tắc này thế nào?
      options:
      - key: s2_opt_4_1
        label: Dùng `SELECT pg_terminate_backend(pid)` để ngắt tiến trình Migration
          bị treo
      - key: s2_opt_4_2
        label: Chạy `kill -9` đối với PID của tiến trình chính PostgreSQL trên OS
      - key: s2_opt_4_3
        label: Kiên nhẫn chờ đợi migration tự chạy xong
    - key: s2_n5_rollback_migration
      prompt: Sau khi terminate tiến trình migration, các truy vấn login bắt đầu khôi
        phục nhẹ nhưng bản release vừa rồi bị lỗi. Bước tiếp theo để đảm bảo ổn định?
      options:
      - key: s2_opt_5_1
        label: Rollback phiên bản ứng dụng Auth Service về phiên bản ổn định trước
          đó
      - key: s2_opt_5_2
        label: Xóa luôn bảng users và restore từ bản backup ngày hôm qua
      - key: s2_opt_5_3
        label: Chuyển toàn bộ database sang chế độ Read-Only
    - key: s2_n6_rewrite_migration
      prompt: Hệ thống tạm ổn định ở bản cũ. Bạn cần viết lại DB migration script
        như thế nào để chạy an toàn trên Production không gây lock bảng?
      options:
      - key: s2_opt_6_1
        label: 'Tách câu lệnh: ADD COLUMN cho phép NULL (không gán DEFAULT trực tiếp),
          sau đó UPDATE dần theo batch và thêm NOT NULL sau'
      - key: s2_opt_6_2
        label: Bỏ toàn bộ Index trên bảng users để ALTER TABLE chạy nhanh hơn
      - key: s2_opt_6_3
        label: Giữ nguyên script cũ nhưng chạy vào giữa trưa lúc truy cập cao nhất
    - key: s2_n7_deploy_fix
      prompt: Script migration tối ưu đã chuẩn bị xong. Phương án triển khai an toàn
        nhất là gì?
      options:
      - key: s2_opt_7_1
        label: Đặt lock_timeout ngắn cho session migration, test kỹ trên Staging và
          deploy vào khung giờ thấp điểm (off-peak)
      - key: s2_opt_7_2
        label: Mở DBeaver kết nối thẳng Prod DB và nhấn Execute Script ngay lập tức
      - key: s2_opt_7_3
        label: Bỏ qua việc test trên Staging để deploy cho nhanh
    - key: s2_n8_verify
      prompt: Migration và bản release mới đã chạy thành công. Bạn nghiệm thu trạng
        thái hệ thống bằng cách nào?
      options:
      - key: s2_opt_8_1
        label: Kiểm tra pg_stat_activity không còn exclusive lock, HikariCP connections
          active ở mức bình thường và latency API Auth đạt chuẩn
      - key: s2_opt_8_2
        label: Thấy không báo lỗi trong 10 giây thì báo hoàn tất ngay
      - key: s2_opt_8_3
        label: Thử dùng tài khoản cá nhân đăng nhập 1 lần thành công
