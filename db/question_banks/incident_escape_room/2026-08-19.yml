- content:
    scenario: Hệ thống Checkout mua hàng gặp sự cố 504 Gateway Timeout hàng loạt khi
      vừa bắt đầu chương trình Flash Sale. Khách hàng không thể hoàn tất đơn hàng.
    initial_logs: "[WARN] Nginx: 504 Gateway Time-out while reading response header
      from upstream (checkout-service:8080) | [ERROR] HikariPool-1 - Connection is
      not available, request timed out after 30000ms. Active: 100/100, Idle: 0, Waiting:
      452"
    nodes:
    - key: q1_n1
      prompt: Cảnh báo HTTP 504 xuất hiện dồn dập. HikariPool báo cạn kiệt connection.
        Bạn sẽ làm gì đầu tiên?
      options:
      - key: q1_opt_1_1
        label: Xem APM Transaction Trace của endpoint /api/v1/checkout để tìm slow
          transaction
      - key: q1_opt_1_2
        label: Khởi động lại toàn bộ pod checkout-service để giải phóng connection
      - key: q1_opt_1_3
        label: Thực hiện scale out số lượng pod checkout-service từ 5 lên 20 pod
    - key: q1_n2
      prompt: 'APM chỉ ra 95% thời gian phản hồi nằm ở câu truy vấn SQL: SELECT *
        FROM coupons WHERE code = $1 AND active = true. Bạn kiểm tra gì tiếp theo?'
      options:
      - key: q1_opt_2_1
        label: Chạy EXPLAIN ANALYZE câu truy vấn coupons trên môi trường Database
      - key: q1_opt_2_2
        label: Tăng tham số max_connections trên PostgreSQL server ngay lập tức
      - key: q1_opt_2_3
        label: Xóa toàn bộ cache trong Redis cluster
    - key: q1_n3
      prompt: Kết quả EXPLAIN ANALYZE cho thấy Sequential Scan trên bảng coupons có
        5 triệu dòng do thiếu index ở cột code. DB CPU chạm 98%. Bạn xử lý thế nào?
      options:
      - key: q1_opt_3_1
        label: 'Tạo index với cờ CONCURRENTLY: CREATE INDEX CONCURRENTLY idx_coupons_code
          ON coupons(code)'
      - key: q1_opt_3_2
        label: Tạo index thường không có CONCURRENTLY để hoàn thành nhanh nhất
      - key: q1_opt_3_3
        label: Dùng pg_terminate_backend để kill toàn bộ process đang chạy trong DB
    - key: q1_n4
      prompt: Index đang được tạo bằng CONCURRENTLY. Trong lúc chờ index hoàn tất,
        traffic Flash Sale vẫn đổ về làm DB quá tải. Hành động ứng phó tạm thời?
      options:
      - key: q1_opt_4_1
        label: Bật Rate Limiting tạm thời cho endpoint /api/v1/checkout tại API Gateway
      - key: q1_opt_4_2
        label: Tắt hẳn DB để bảo vệ dữ liệu không bị hỏng
      - key: q1_opt_4_3
        label: Tăng timeout ở Nginx lên 120 giây
    - key: q1_n5
      prompt: Index đã tạo xong thành công. Query time giảm xuống <1ms. Tuy nhiên
        HikariPool ở ứng dụng vẫn còn nhiều connection treo cũ. Bạn làm gì?
      options:
      - key: q1_opt_5_1
        label: Thực hiện Graceful Restart từng pod checkout-service để làm sạch connection
          pool
      - key: q1_opt_5_2
        label: Drop bảng coupons và tạo lại
      - key: q1_opt_5_3
        label: Chờ 30 phút để connection tự timeout
    - key: q1_n6
      prompt: 'Connection pool đã trở lại bình thường (Active: 5/100, latency 45ms).
        Nhưng Rate Limiting tại Gateway vẫn đang chặn bớt khách hàng. Bước tiếp theo?'
      options:
      - key: q1_opt_6_1
        label: Gỡ bỏ dần dần Rate Limiting và theo dõi chỉ số RPS cùng Latency
      - key: q1_opt_6_2
        label: Gỡ bỏ lập tức toàn bộ rule bảo vệ mà không theo dõi
      - key: q1_opt_6_3
        label: Giữ nguyên Rate Limiting tới hết sự kiện Flash Sale
    - key: q1_n7
      prompt: Traffic đã phục hồi 100%, tỷ lệ lỗi 0%, latency trung bình 50ms. Bạn
        thực hiện bước cuối cùng nào để hoàn tất quy trình khắc phục?
      options:
      - key: q1_opt_7_1
        label: Thực hiện test giao dịch end-to-end thành công và ghi nhận log trong
          5 phút
      - key: q1_opt_7_2
        label: Đóng ticket sự cố ngay lập tức mà không cần kiểm tra lại
      - key: q1_opt_7_3
        label: Xóa index vừa tạo để đưa DB về trạng thái ban đầu
    - key: q1_n8
      prompt: Sự cố đã được khắc phục triệt để. Hệ thống Checkout hoạt động ổn định
        trong suốt Flash Sale.
      options: []
  answer_key:
    option_effects:
      q1_opt_1_1:
        points: 10
        minutes_cost: 1
        next_node: q1_n2
        explanation: Kiểm tra APM trace giúp khoanh vùng chính xác bottleneck ở DB
          query thay vì đoán mò.
      q1_opt_1_2:
        points: 0
        minutes_cost: 5
        next_node: q1_n2
        explanation: Restart pod không giải quyết được gốc rễ câu truy vấn chậm, connection
          sẽ nghẽn lại ngay.
      q1_opt_1_3:
        points: 5
        minutes_cost: 3
        next_node: q1_n2
        explanation: Scale out ứng dụng trong khi DB bị nghẽn làm tăng thêm tải connection
          lên DB.
      q1_opt_2_1:
        points: 10
        minutes_cost: 1
        next_node: q1_n3
        explanation: EXPLAIN ANALYZE là công cụ chuẩn để biết tại sao câu lệnh SQL
          chạy chậm.
      q1_opt_2_2:
        points: 0
        minutes_cost: 4
        next_node: q1_n3
        explanation: Tăng max_connections khi có slow query sẽ làm sập DB do quá tải
          CPU/RAM.
      q1_opt_2_3:
        points: 0
        minutes_cost: 3
        next_node: q1_n3
        explanation: Flush Redis không giải quyết truy vấn coupons và làm tăng thêm
          tải cho DB.
      q1_opt_3_1:
        points: 10
        minutes_cost: 2
        next_node: q1_n4
        explanation: Tạo index CONCURRENTLY giúp đánh index mà không lock bảng coupons,
          tránh gián đoạn ghi.
      q1_opt_3_2:
        points: 0
        minutes_cost: 5
        next_node: q1_n4
        explanation: Tạo index thông thường sẽ EXCLUSIVE LOCK bảng coupons, chặn toàn
          bộ luồng ghi.
      q1_opt_3_3:
        points: 0
        minutes_cost: 3
        next_node: q1_n4
        explanation: Kill process chỉ là tạm thời, các request mới tràn vào sẽ tạo
          lại slow queries.
      q1_opt_4_1:
        points: 10
        minutes_cost: 1
        next_node: q1_n5
        explanation: Rate Limiting tạm thời giúp giảm tải cho DB trong thời gian chờ
          đánh index xong.
      q1_opt_4_2:
        points: 0
        minutes_cost: 6
        next_node: q1_n5
        explanation: Tắt DB khiến dịch vụ ngừng hoàn toàn, không phải cách xử lý incident
          chuyên nghiệp.
      q1_opt_4_3:
        points: 0
        minutes_cost: 2
        next_node: q1_n5
        explanation: Tăng timeout làm request treo lâu hơn, càng tích tụ connection
          nghẽn.
      q1_opt_5_1:
        points: 10
        minutes_cost: 1
        next_node: q1_n6
        explanation: Graceful restart giải phóng các connection bị lãng phí và làm
          mới connection pool.
      q1_opt_5_2:
        points: 0
        minutes_cost: 10
        next_node: q1_n6
        explanation: Drop bảng làm mất dữ liệu mã giảm giá của chương trình.
      q1_opt_5_3:
        points: 5
        minutes_cost: 5
        next_node: q1_n6
        explanation: Chờ đợi lãng phí thời gian quý giá trong đợt Flash Sale.
      q1_opt_6_1:
        points: 10
        minutes_cost: 1
        next_node: q1_n7
        explanation: Mở dần Rate Limit kèm quan sát giúp đảm bảo hệ thống chịu tải
          an toàn.
      q1_opt_6_2:
        points: 5
        minutes_cost: 2
        next_node: q1_n7
        explanation: Mở đột ngột có thể gây ra surge traffic làm đơ lại dịch vụ.
      q1_opt_6_3:
        points: 0
        minutes_cost: 4
        next_node: q1_n7
        explanation: Bật Rate Limit liên tục gây mất doanh thu Flash Sale của công
          ty.
      q1_opt_7_1:
        points: 10
        minutes_cost: 1
        next_node: q1_n8
        explanation: Xác nhận giao dịch thành công thực tế trước khi đóng incident.
      q1_opt_7_2:
        points: 0
        minutes_cost: 3
        next_node: q1_n8
        explanation: Bỏ qua bước verify dễ bỏ sót lỗi tiềm ẩn phát sinh sau khi mở
          lại traffic.
      q1_opt_7_3:
        points: 0
        minutes_cost: 5
        next_node: q1_n8
        explanation: Xóa index sẽ tái diễn ngay lập tức sự cố nghẽn DB.
    recovery_node: q1_n8
  difficulty: medium
- content:
    scenario: Dịch vụ Webhook xử lý kết quả thanh toán payment-callback-service bị
      lỗi OOMKilled liên tục trên Kubernetes sau bản release v2.4.1. Hàng nghìn giao
      dịch thanh toán bị chậm cập nhật trạng thái.
    initial_logs: "[K8S Alert] Pod payment-callback-service-7f99b-x2z91 terminated
      with reason OOMKilled (exit code 137). Memory limit 512Mi exceeded. Kafka consumer
      lag: 52,100 messages."
    nodes:
    - key: q2_n1
      prompt: Pod liên tục crash loop vì OOMKilled và Kafka consumer lag gia tăng.
        Bạn thực hiện hành động chẩn đoán nào?
      options:
      - key: q2_opt_1_1
        label: Kiểm tra log Pod describe và đồ thị Prometheus Memory Usage (Heap/Non-Heap)
          của ứng dụng
      - key: q2_opt_1_2
        label: Tăng Memory Limit trong K8s Deployment từ 512Mi lên 4Gi ngay lập tức
      - key: q2_opt_1_3
        label: Khởi động lại toàn bộ Kafka Cluster
    - key: q2_n2
      prompt: Biểu đồ Memory tăng dốc đứng kiểu răng cưa và chạm trần 512Mi. Heap
        dump chỉ ra triệu đối tượng net/http response buffer chưa được thu hồi. Bạn
        làm gì?
      options:
      - key: q2_opt_2_1
        label: Kiểm tra git commit diff của bản release v2.4.1 liên quan đến HTTP
          Client
      - key: q2_opt_2_2
        label: Cấu hình CronJob chạy System.gc() mỗi 1 phút trên ứng dụng
      - key: q2_opt_2_3
        label: Cài đặt lại môi trường Go/Java runtime trên Server
    - key: q2_n3
      prompt: Phát hiện commit mới quên gọi resp.Body.Close() khi gọi API đối tác
        xác thực giao dịch, gây rò rỉ bộ nhớ (Memory Leak). Hành động nhanh nhất để
        khôi phục dịch vụ?
      options:
      - key: q2_opt_3_1
        label: Thực hiện Rollback Deployment K8s về phiên bản ổn định v2.4.0 ngay
          lập tức
      - key: q2_opt_3_2
        label: Dùng kubectl exec chèn trực tiếp code sửa lỗi vào container đang chạy
      - key: q2_opt_3_3
        label: Tắt Feature Flag gọi đối tác xác thực trong DB
    - key: q2_n4
      prompt: Đã Rollback về v2.4.0, Pods đã hết OOMKilled và chạy ổn định. Tuy nhiên
        Kafka lag vẫn đọng 50,000 tin nhắn chưa xử lý. Bạn giải quyết lag như thế
        nào?
      options:
      - key: q2_opt_4_1
        label: Scale out tạm thời số lượng Pod consumer lên tối đa cho phép để kéo
          hết lag
      - key: q2_opt_4_2
        label: Reset Kafka Consumer Offset về LATEST để bỏ qua 50,000 tin nhắn cũ
      - key: q2_opt_4_3
        label: Xóa Topic Kafka và tạo lại Topic mới
    - key: q2_n5
      prompt: Khi tăng số pod xử lý lag, API đối tác phản hồi lỗi HTTP 429 Too Many
        Requests do bị xả lượng request quá lớn. Bạn làm gì?
      options:
      - key: q2_opt_5_1
        label: Điều chỉnh Rate Limiter/Concurrency của Consumer để khớp với giới hạn
          Quota đối tác
      - key: q2_opt_5_2
        label: Bỏ qua lỗi 429 và cho phép đẩy các tin nhắn lỗi vào Dead Letter Queue
          (DLQ)
      - key: q2_opt_5_3
        label: Gửi email đề nghị đối tác tắt tính năng Rate Limit vĩnh viễn
    - key: q2_n6
      prompt: Kafka lag đã giải quyết xong. Developer đã tạo Hotfix v2.4.2 bổ sung
        defer resp.Body.Close() và unit test. Quy trình deploy an toàn là gì?
      options:
      - key: q2_opt_6_1
        label: Deploy v2.4.2 lên Staging, chạy Load Test kiểm tra memory, sau đó triển
          khai Canary trên Prod
      - key: q2_opt_6_2
        label: Deploy thẳng v2.4.2 lên 100% Prod vì code sửa quá đơn giản
      - key: q2_opt_6_3
        label: Copy file binary qua SCP và đè trực tiếp lên server
    - key: q2_n7
      prompt: Bản Canary v2.4.2 hoạt động 10 phút, Memory giữ nguyên ở mức 150MB phẳng.
        Bạn làm gì để kết thúc?
      options:
      - key: q2_opt_7_1
        label: Chuyển 100% traffic sang v2.4.2 và tiếp tục theo dõi Memory trong 10
          phút
      - key: q2_opt_7_2
        label: Thực hiện Rollback lại v2.4.0 để an toàn
      - key: q2_opt_7_3
        label: Gỡ bỏ các Agent Monitoring để đỡ tốn RAM
    - key: q2_n8
      prompt: Hệ thống đã ổn định hoàn toàn trên v2.4.2. Không còn Memory Leak và
        callback thanh toán được xử lý thời gian thực.
      options: []
  answer_key:
    option_effects:
      q2_opt_1_1:
        points: 10
        minutes_cost: 1
        next_node: q2_n2
        explanation: Đọc log K8s và chỉ số Memory giúp xác định bản chất OOM là do
