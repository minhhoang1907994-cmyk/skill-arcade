- content:
    scenario: Hệ thống Checkout thương mại điện tử bị treo hàng loạt giao dịch vào
      khung giờ săn sale cao điểm. Khách hàng liên tục nhận lỗi HTTP 504 Gateway Timeout
      khi thực hiện thanh toán.
    initial_logs: "[ERROR] 2023-10-24 19:05:12.102 [http-nio-8080-exec-45] c.e.c.s.PaymentService:
      org.springframework.data.redis.RedisConnectionFailureException: Cannot get Jedis
      connection; nested exception is redis.clients.jedis.exceptions.JedisConnectionException:
      Could not get a resource from the pool"
    nodes:
    - key: n1_start
      prompt: Bạn nhận được cảnh báo sự cố từ hệ thống Checkout. Bước đầu tiên bạn
        sẽ làm gì để khoanh vùng vấn đề?
      options:
      - key: opt_1_1
        label: Xem dashboard Grafana về Latency, CPU và Redis connection pool
      - key: opt_1_2
        label: Khởi động lại toàn bộ máy chủ cơ sở dữ liệu MySQL
      - key: opt_1_3
        label: Tăng ngay cấu hình CPU/RAM cho toàn bộ server Checkout
    - key: n2_redis_metrics
      prompt: Dashboard cho thấy CPU ổn định nhưng lượng active connections tới Redis
        đã chạm ngưỡng tối đa. Bạn làm gì tiếp theo?
      options:
      - key: opt_2_1
        label: Kiểm tra chỉ số active connections trong Jedis Pool so với max-active
          config
      - key: opt_2_2
        label: Thực hiện lệnh FLUSHALL trên Redis để xóa toàn bộ cache
      - key: opt_2_3
        label: Kiểm tra log truy cập trên Nginx reverse proxy
    - key: n3_app_config
      prompt: Chỉ số Jedis connection pool liên tục ở mức 100%. Bạn kiểm tra file
        cấu hình ứng dụng (application.yml) để xem điều gì?
      options:
      - key: opt_3_1
        label: Kiểm tra thông số spring.redis.jedis.pool.max-active và max-wait
      - key: opt_3_2
        label: Chuyển cấu hình kết nối Redis sang Memcached ngay lập tức
      - key: opt_3_3
        label: Thực hiện restart khẩn cấp toàn bộ Pod ứng dụng Checkout
    - key: n4_code_review
      prompt: Cấu hình max-active = 8. Tuy nhiên với lượng truy vấn lớn, pool bị cạn
        kiệt do connection không được trả lại. Bạn rà soát code nguồn như thế nào?
      options:
      - key: opt_4_1
        label: Tìm các đoạn code mở Jedis connection trực tiếp mà thiếu khối try-with-resources
          hoặc finally để close
      - key: opt_4_2
        label: Viết lại toàn bộ module Payment bằng ngôn ngữ Golang
      - key: opt_4_3
        label: Tắt toàn bộ tính năng liên quan đến Redis cache và query thẳng DB
    - key: n5_mitigation
      prompt: Bạn phát hiện ra một hàm lấy thông tin khuyến mãi dùng Jedis thô không
        tự đóng connection. Để xử lý khẩn cấp trước khi sửa code, bạn làm gì?
      options:
      - key: opt_5_1
        label: Tăng tạm spring.redis.jedis.pool.max-active lên 64 và giảm timeout
          trong config
      - key: opt_5_2
        label: Ngắt toàn bộ kết nối cơ sở dữ liệu MySQL
      - key: opt_5_3
        label: Bật trang thông báo bảo trì toàn bộ website
    - key: n6_fix
      prompt: Giảm nghẽn tạm thời thành công. Bây giờ bạn cần đưa ra bản sửa lỗi triệt
        để trong source code. Phương án nào đúng chuẩn?
      options:
      - key: opt_6_1
        label: Thay thế Jedis thô bằng RedisTemplate của Spring Data Redis hoặc dùng
          try-with-resources để tự động giải phóng connection
      - key: opt_6_2
        label: Bỏ qua ngoại lệ exception xử lý Redis để code chạy qua nhanh hơn
      - key: opt_6_3
        label: Thêm lệnh Thread.sleep(500) sau mỗi lần gọi Redis
    - key: n7_deploy
      prompt: Bản fix code đã sẵn sàng. Bạn triển khai bản vá này lên môi trường Production
        như thế nào?
      options:
      - key: opt_7_1
        label: Chạy unit test, test trên Staging rồi deploy Rolling Update từng Pod
          trên Production
      - key: opt_7_2
        label: SSH thẳng vào server Production để sửa file jar/bytecode trực tiếp
      - key: opt_7_3
        label: Deploy đồng loạt 100% Pod cùng lúc vào giữa giờ cao điểm
    - key: n8_verify
      prompt: Bản vá đã được triển khai xong. Bạn xác minh hệ thống đã thực sự phục
        hồi như thế nào?
      options:
      - key: opt_8_1
        label: 'Theo dõi Grafana chart trong 15 phút: Jedis active connections giảm,
          error rate = 0% và latency trở lại bình thường'
      - key: opt_8_2
        label: Đóng ticket sự cố ngay lập tức vì không thấy log ERROR mới trong 5
          giây
      - key: opt_8_3
        label: Tự thực hiện thử 1 giao dịch mua hàng trên điện thoại cá nhân
