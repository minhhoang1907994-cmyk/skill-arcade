      - key: q2_n2_o1
        label: Nghi vấn rò rỉ bộ nhớ / rò rỉ kết nối (Memory Leak / Connection Leak)
          trong bản release 2.4.1
      - key: q2_n2_o2
        label: Bị tấn công DDoS vào dịch vụ thanh toán
      - key: q2_n2_o3
        label: Phần cứng Server node bị hỏng thanh RAM
    - key: q2_node_3
      prompt: 'Bước 3: Do giao dịch thanh toán đang bị nghẽn trực tiếp ảnh hưởng doanh
        thu, hành động ưu tiên khôi phục dịch vụ nhanh nhất (MTTR) là gì?'
