- content:
    scenario: Vào lúc 12:00 bắt đầu sự kiện Flash Sale, hệ thống e-commerce bị treo
      hoàn toàn. Người dùng liên tục gặp lỗi 500 HTTP Server Error khi truy cập trang
      chi tiết sản phẩm và bấm mua hàng. Lượng traffic tăng đột biến gấp 10 lần ngày
      thường.
    initial_logs: |-
      APM Alert: HTTP 500 error rate > 45%
      [ERROR] DB Connection pool exhausted. Active connections: 200/200
      [ERROR] Redis Command Timeout: Timeout waiting for connection from pool
      [WARN] CPU Usage PostgreSQL Master: 99.8%
    nodes:
    - key: q1_node_1
      prompt: 'Bước 1: Hệ thống đang bị nghẽn nặng. Bạn mở dashboard theo dõi hệ thống.
        Bạn muốn kiểm tra chỉ số nào đầu tiên để khoanh vùng sự cố?'
      options:
      - key: q1_n1_o1
        label: Kiểm tra chi tiết Latency & Error Rate phân lập giữa Database, Redis
          Cache và Microservices
      - key: q1_n1_o2
        label: Khởi động lại ngay lập tức toàn bộ dàn pod Web Service để xoá bớt connection
      - key: q1_n1_o3
        label: Tăng max_connections của Database PostgreSQL lên gấp đôi (từ 200 lên
          400)
    - key: q1_node_2
      prompt: 'Bước 2: Kết quả APM cho thấy Cache Hit Rate giảm từ 98% xuống 5%. Hàng
        vạn query chui thẳng xuống DB. Bạn sẽ làm gì để tìm nguyên nhân Cache sụt
        giảm?'
      options:
      - key: q1_n2_o1
        label: Kiểm tra tình trạng bộ nhớ Redis và kiểm tra TTL/Key Expiration của
          các sản phẩm Flash Sale
      - key: q1_n2_o2
        label: Flush toàn bộ Redis Cache (`FLUSHALL`) để giải phóng bộ nhớ
      - key: q1_n2_o3
        label: Tắt hẳn Redis Cache và cho ứng dụng đọc trực tiếp từ Database
    - key: q1_node_3
      prompt: 'Bước 3: Phát hiện Redis bị OOM (Out Of Memory) do lưu quá nhiều session
        rác, dẫn đến key `flash_sale_items` bị eviction (xoá tự động). Hàng vạn request
        cùng gọi xuống DB lấy dữ liệu (Cache Stampede). Bạn làm gì đầu tiên?'
      options:
      - key: q1_n3_o1
        label: Bật ngay Rate Limiting tại API Gateway để chặn bớt traffic dư thừa
          và bảo vệ DB
      - key: q1_n3_o2
        label: Chờ DB tự phục hồi khi người dùng chán không bấm refresh nữa
      - key: q1_n3_o3
        label: Xoá bớt dữ liệu trong Database Master để giảm tải dung lượng ổ đĩa
    - key: q1_node_4
      prompt: 'Bước 4: Traffic quá ngưỡng đã bị chặn tạm thời. Giờ bạn xử lý vấn đề
        Redis bị OOM như thế nào?'
      options:
      - key: q1_n4_o1
        label: Chạy lệnh evicted các key rác (session cũ) và tăng maxmemory của Redis
          Cluster
      - key: q1_n4_o2
        label: Khởi động lại máy chủ chứa Redis Instance
      - key: q1_n4_o3
        label: Đổi Redis eviction policy sang `noeviction`
    - key: q1_node_5
      prompt: 'Bước 5: Redis đã đủ bộ nhớ, nhưng khi khôi phục cache, nếu tải lại
        dữ liệu Flash Sale cùng lúc vẫn sẽ gây đơ DB. Bạn dùng giải pháp nào để chống
        Cache Stampede?'
      options:
      - key: q1_n5_o1
        label: Áp dụng Mutex Lock / Singleflight Pattern ở ứng dụng khi rebuild cache
      - key: q1_n5_o2
        label: Đặt TTL cho key mới là 1 giây để thông tin luôn luôn tươi mới
      - key: q1_n5_o3
        label: Viết script insert dữ liệu thẳng vào DB liên tục
    - key: q1_node_6
      prompt: 'Bước 6: Để tránh việc tất cả các Key sản phẩm Flash Sale hết hạn cùng
        một thời điểm trong tương lai, bạn cấu hình TTL như thế nào?'
      options:
      - key: q1_n6_o1
        label: Thêm Random Jitter (độ lệch ngẫu nhiên) vào thời gian TTL của mỗi Key
      - key: q1_n6_o2
        label: Set TTL của tất cả các key cố định là 60 phút
      - key: q1_n6_o3
        label: Không set TTL nữa, để key tồn tại mãi mãi
    - key: q1_node_7
      prompt: 'Bước 7: Bạn cần nạp sẵn dữ liệu sản phẩm Flash Sale vào Redis trước
        khi mở lại Gateway. Bước này gọi là gì và làm thế nào?'
      options:
      - key: q1_n7_o1
        label: Thực hiện Cache Warm-up bằng script nạp dữ liệu hot items vào Redis
      - key: q1_n7_o2
        label: Bật lại Gateway để người dùng tự làm ấm cache
      - key: q1_n7_o3
        label: Backup dữ liệu Redis ra file RDB rồi restore lại
    - key: q1_node_8
      prompt: 'Bước 8: Cache đã ấm, Redis chạy tốt, DB CPU hạ xuống 10%. Bạn làm gì
        để kết thúc xử lý sự cố?'
      options:
      - key: q1_n8_o1
        label: Mở dần Rate Limit tại Gateway, giám sát metric 15 phút và xác nhận
          sự cố kết thúc
      - key: q1_n8_o2
        label: Tắt ngay toàn bộ hệ thống logging để tiết kiệm CPU
      - key: q1_n8_o3
        label: Tắt toàn bộ pod Replica của DB
