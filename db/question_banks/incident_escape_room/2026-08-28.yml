      - key: q2_n3_o2
        label: Ngồi debug code trên máy cá nhân cho tới khi tìm ra dòng code lỗi
      - key: q2_n3_o3
        label: Xoá pod liên tục bằng cronjob mỗi 2 phút
    - key: q2_node_4
      prompt: 'Bước 4: Sau khi Rollback về 2.4.0, các Pod đã xanh lại và không bị
        crash. Khách hàng đã thanh toán bình thường. Bạn làm gì tiếp theo?'
      options:
