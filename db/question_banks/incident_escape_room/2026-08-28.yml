          16Gi
      - key: q2_n1_o3
        label: Restart toàn bộ Cluster Kubernetes
    - key: q2_node_2
      prompt: 'Bước 2: Log cho thấy lỗi `java.lang.OutOfMemoryError` xảy ra chỉ vài
        phút sau khi Pod khởi chạy. Số lượng connection kết nối tới đối tác cổng thanh
        toán tăng liên tục không giảm. Nguyên nhân sơ bộ là gì?'
