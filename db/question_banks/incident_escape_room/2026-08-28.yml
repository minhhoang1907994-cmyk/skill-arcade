  difficulty: hard
- content:
    scenario: Sàn thương mại điện tử đang diễn ra chương trình Flash Sale lúc 00:00.
      Hệ thống User Service và Order Service liên tục trả về lỗi HTTP 500. Người dùng
      bị đăng xuất hàng loạt và không thể hoàn tất thanh toán.
    initial_logs: "[ERROR] 2023-10-24 00:05:12 [User-Service] RedisCommandExecutionException:
      OOM command not allowed when used memory > 'maxmemory'. [METRIC] Redis_Memory_Used:
      15.8GB / 16.0GB (98.75%). Redis_Connected_Clients: 4500."
    nodes:
    - key: node_1
      prompt: Cảnh báo Redis OOM đang bùng nổ làm sập dịch vụ. Bạn cần ưu tiên kiểm
        tra thông tin gì đầu tiên mà không làm nghẽn hệ thống?
      options:
      - key: opt_1_1
        label: Chạy lệnh redis-cli --bigkeys hoặc kiểm tra memory distribution theo
          prefix key trên Grafana
      - key: opt_1_2
        label: Chạy lệnh KEYS * trực tiếp trên Redis master để tìm toàn bộ key đang
          lưu
      - key: opt_1_3
        label: Khởi động lại (Restart) cụm Redis Cluster ngay lập tức để giải phóng
          RAM
    - key: node_2
      prompt: Kết quả chẩn đoán cho thấy các key có prefix user_session:* chiếm hơn
        85% tổng bộ nhớ Redis. Bước kiểm tra tiếp theo là gì?
      options:
      - key: opt_2_1
        label: Kiểm tra thời gian sống (TTL) của một số key user_session:* bằng lệnh
          TTL
      - key: opt_2_2
        label: Dùng lệnh FLUSHALL để xóa sạch toàn bộ dữ liệu Redis
      - key: opt_2_3
        label: Nâng cấp gấp cấu hình RAM của Redis instance lên 32GB mà không kiểm
          tra key
    - key: node_3
      prompt: Lệnh TTL trên các key user_session:* đều trả về -1 (nghĩa là key không
        bao giờ hết hạn). Tại sao key session lại không có TTL?
      options:
      - key: opt_3_1
        label: Kiểm tra lại Git commit history gần nhất liên quan đến module Authentication
          / Session Store
      - key: opt_3_2
        label: Giả định Redis bị lỗi eviction policy và đổi maxmemory-policy thành
          allkeys-lru ngay
      - key: opt_3_3
        label: Cấu hình Cloudflare Rate Limiting vì nghi ngờ bị tấn công DDoS
    - key: node_4
      prompt: Bạn phát hiện commit trong Release v2.4.1 (vừa deploy chiều nay) đã
        dùng redisTemplate.opsForValue().set(key, val) mà quên truyền tham số Timeout.
        Cần xử lý cấm ngọn khẩn cấp các key rác hiện tại như thế nào?
      options:
      - key: opt_4_1
        label: Chạy background script dùng SCAN kết hợp EXPIRE để set TTL 2 giờ cho
          các key user_session:*
      - key: opt_4_2
        label: Chạy script SQL xóa bảng users trong database PostgreSQL để đồng bộ
          lại
      - key: opt_4_3
        label: Chạy lệnh DEL user_session:* hàng loạt qua redis-cli
    - key: node_5
      prompt: Script đặt TTL tạm thời đã đưa RAM Redis xuống 60%. Tuy nhiên code v2.4.1
        trên Production vẫn đang tiếp tục tạo ra các session mới không có TTL. Bạn
        chọn phương án xử lý code nào?
      options:
      - key: opt_5_1
        label: Tạo Hotfix PR thêm TTL vào hàm saveSession và chuẩn bị quy trình Hot-deploy
      - key: opt_5_2
        label: Rollback toàn bộ hệ thống về phiên bản v2.3.0 từ tuần trước
      - key: opt_5_3
        label: Tắt tính năng đăng nhập trên Mobile App để giảm lưu lượng ghi vào Redis
    - key: node_6
      prompt: Bản Hotfix code đã hoàn thành unit test. Làm thế nào để deploy bản fix
        này an toàn trong lúc traffic Flash Sale đang rất cao?
      options:
      - key: opt_6_1
        label: Thực hiện Rolling Update từng pod của User Service trên Kubernetes
      - key: opt_6_2
        label: Stop toàn bộ pod User Service cùng lúc rồi deploy bản mới
      - key: opt_6_3
        label: Deploy trực tiếp bằng SSH vào server Production không thông qua CI/CD
          pipeline
    - key: node_7
      prompt: Hotfix đã deploy thành công. Session mới tạo đều đã có TTL. Bạn cần
        thiết lập cấu hình phòng vệ nào cho Redis để tránh OOM trong tương lai?
      options:
      - key: opt_7_1
        label: Cấu hình maxmemory-policy volatile-lru trong redis.conf để tự động
          xóa key có TTL khi RAM đầy
      - key: opt_7_2
        label: Đặt maxmemory-policy noeviction để Redis từ chối mọi lệnh write khi
          đầy RAM
      - key: opt_7_3
        label: Giữ nguyên cấu hình cũ vì code đã fix gắn TTL rồi
    - key: node_8
      prompt: Hệ thống đã chạy ổn định trở lại. Bạn làm gì để xác nhận sự cố đã hoàn
        toàn kết thúc?
      options:
      - key: opt_8_1
        label: 'Theo dõi Grafana: Redis RAM < 50%, tỷ lệ lỗi HTTP 500 về 0%, latency
          API trở lại mức bình thường'
      - key: opt_8_2
        label: Đóng Ticket Incident ngay lập tức mà không cần kiểm tra Dashboard
      - key: opt_8_3
        label: Restart lại toàn bộ cụm Nginx Reverse Proxy để làm sạch kết nối
    - key: node_recovery
      prompt: Sự cố đã được khắc phục hoàn toàn! Hệ thống User Service và Redis hoạt
        động ổn định, doanh thu Flash Sale tiếp tục tăng trưởng.
      options: []
  answer_key:
    option_effects:
      opt_1_1:
        points: 10
        minutes_cost: 1
        next_node: node_2
        explanation: Chính xác. Dùng --bigkeys hoặc Grafana là cách an toàn để phân
          tích bộ nhớ mà không gây lock Redis single-thread.
      opt_1_2:
        points: 0
        minutes_cost: 10
        next_node: node_1
        explanation: Sai lầm nghiêm trọng! Lệnh KEYS * là O(N) và sẽ block toàn bộ
          Redis thread khi có hàng triệu key, khiến hệ thống sập nặng hơn.
      opt_1_3:
        points: 0
        minutes_cost: 15
        next_node: node_1
        explanation: Restart Redis làm mất sạch cache/session trong RAM, gây Cache
          Stampede làm sập luôn Database phía sau.
      opt_2_1:
        points: 10
        minutes_cost: 1
        next_node: node_3
        explanation: Chính xác. Kiểm tra TTL giúp xác định xem các key này có được
          cài đặt thời gian hết hạn hợp lệ hay không.
      opt_2_2:
        points: 0
        minutes_cost: 12
        next_node: node_2
        explanation: Sai lầm! FLUSHALL sẽ xóa toàn bộ session và cache của tất cả
          người dùng, gây gián đoạn nghiêm trọng.
      opt_2_3:
        points: 5
        minutes_cost: 8
        next_node: node_3
        explanation: Tăng RAM giúp tạm thời có thêm không gian nhưng không giải quyết
          gốc rễ nếu ứng dụng liên tục leak key không TTL.
      opt_3_1:
        points: 10
        minutes_cost: 2
        next_node: node_4
        explanation: Chính xác. Kiểm tra commit gần đây giúp xác định chính xác thay
          đổi code nào đã làm mất TTL của session.
      opt_3_2:
        points: 5
        minutes_cost: 5
        next_node: node_4
        explanation: Đổi policy chỉ giúp xoá bớt key tạm thời nhưng không giải thích
          được tại sao ứng dụng lại tạo key vô hạn.
      opt_3_3:
        points: 0
        minutes_cost: 10
        next_node: node_3
        explanation: Sai hướng. Đây là lỗi logic ghi cache của ứng dụng, không phải
          tấn công DDoS.
      opt_4_1:
        points: 10
        minutes_cost: 1
        next_node: node_5
        explanation: Chính xác! SCAN không gây block Redis, kết hợp EXPIRE/UNLINK
          giúp dọn dẹp RAM an toàn.
      opt_4_2:
        points: 0
        minutes_cost: 15
        next_node: node_4
        explanation: Rất nguy hiểm! Xóa Database sẽ làm mất dữ liệu người dùng vĩnh
          viễn.
      opt_4_3:
        points: 0
        minutes_cost: 8
        next_node: node_4
        explanation: Lệnh DEL với pattern lớn hoặc nhiều key sẽ làm lock Redis server
          trong vài giây đến vài phút.
      opt_5_1:
        points: 10
        minutes_cost: 2
        next_node: node_6
        explanation: Chính xác. Tạo Hotfix trực tiếp giải quyết đúng hàm bị lỗi là
          phương án chuẩn nhất.
      opt_5_2:
        points: 5
        minutes_cost: 10
        next_node: node_6
        explanation: Rollback tốn thời gian rebuild và có thể làm mất các tính năng
          mới trong bản v2.4.1.
      opt_5_3:
        points: 0
        minutes_cost: 12
        next_node: node_5
        explanation: Tắt tính năng làm sụt giảm doanh thu Flash Sale và gây ảnh hưởng
          lớn đến người dùng.
      opt_6_1:
        points: 10
        minutes_cost: 2
        next_node: node_7
        explanation: Chính xác. Rolling Update giúp cập nhật dần các instance mà không
          làm gián đoạn dịch vụ.
      opt_6_2:
        points: 0
        minutes_cost: 8
        next_node: node_6
        explanation: Stop toàn bộ pod gây 100% downtime cho User Service trong thời
          gian deploy.
      opt_6_3:
        points: 5
        minutes_cost: 5
        next_node: node_7
        explanation: Bỏ qua pipeline CI/CD tạo ra rủi ro sai lệch môi trường và khó
          tracking bug.
      opt_7_1:
        points: 10
        minutes_cost: 3
        next_node: node_8
        explanation: Chính xác. Cấu hình volatile-lru giúp Redis tự động thu hồi bộ
          nhớ từ các key có TTL khi chạm trần RAM.
      opt_7_2:
        points: 0
        minutes_cost: 5
        next_node: node_7
        explanation: noeviction sẽ khiến Redis quăng lỗi OOM ngay khi đầy RAM, đưa
          sự cố trở lại ban đầu.
      opt_7_3:
        points: 5
        minutes_cost: 5
        next_node: node_8
        explanation: Thiếu lớp phòng vệ hạ tầng. Nếu tương lai có dev khác quên set
          TTL, sự cố sẽ tái diễn.
      opt_8_1:
        points: 10
        minutes_cost: 1
        next_node: node_recovery
        explanation: Chính xác. Phải đối soát cả metric hạ tầng lẫn error rate của
          ứng dụng trước khi đóng incident.
      opt_8_2:
        points: 0
        minutes_cost: 5
        next_node: node_8
        explanation: Chủ quan! Cần kiểm tra metric thực tế để đảm bảo không còn dư
          chấn.
      opt_8_3:
        points: 5
        minutes_cost: 7
        next_node: node_recovery
        explanation: Hành động thừa thai vì Nginx không liên quan trực tiếp đến lỗi
          OOM Redis.
    recovery_node: node_recovery
  difficulty: medium
