      thái CrashLoopBackOff. Giao dịch thanh toán bị gián đoạn.
    initial_logs: |-
      kubectl get pods -n payment
      NAME                          READY   STATUS             RESTARTS   AGE
      payment-service-7f8d9-2xk4l   0/1     OOMKilled          4          12m
      payment-service-7f8d9-9p1mn   0/1     CrashLoopBackOff   4          12m
      [FATAL] java.lang.OutOfMemoryError: Java heap space
      [WARN] Connection pool active connections: 500/500 (Leaked: 480)
    nodes:
    - key: q2_node_1
      prompt: 'Bước 1: Pod dịch vụ thanh toán liên tục bị K8s tiêu diệt (OOMKilled)
        rồi restart lại. Bạn thực hiện thao tác chẩn đoán nào trước?'
      options:
      - key: q2_n1_o1
        label: Xem log pod chi tiết (`kubectl logs`) và kiểm tra metric sử dụng Memory/Threads
          trên Grafana
      - key: q2_n1_o2
