        points: 0
        minutes_cost: 5
        next_node: q1_recovered
        explanation: Bỏ qua post-mortem dễ dẫn đến việc lặp lại sự cố tương tự trong
          tương lai.
      q1_n8_o3:
        points: 5
        minutes_cost: 10
        next_node: q1_recovered
