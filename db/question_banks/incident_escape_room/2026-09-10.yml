  difficulty: hard
- content:
    scenario: Hệ thống thanh toán của sàn thương mại điện tử bị treo vào giờ flash
      sale. Khách hàng thực hiện thanh toán bị báo lỗi 504 Gateway Timeout, tiền trong
      tài khoản ngân hàng bị trừ nhưng đơn hàng vẫn ở trạng thái Pending.
    initial_logs: |-
      [ERROR] 2023-10-25 20:01:15 payment-service: ConnectionPoolTimeoutException: Timeout waiting for connection from pool [max: 100, active: 100, idle: 0]
      [WARN] 2023-10-25 20:01:18 gateway: HTTP 504 Gateway Timeout for POST /api/v1/payments/checkout
    nodes:
    - key: q1_n1
      prompt: 'Bước 1: Hệ thống đang báo tràn Connection Pool ở payment-service. Bạn
        nên làm gì đầu tiên để xác định nguyên nhân?'
      options:
      - key: q1_opt_1a
        label: Kiểm tra metric active connections và slow queries trên PostgreSQL
          Database.
      - key: q1_opt_1b
        label: Restart lập tức tất cả Pod của payment-service.
      - key: q1_opt_1c
        label: Tăng kích thước Connection Pool trong cấu hình từ 100 lên 500.
    - key: q1_n2
      prompt: 'Bước 2: Metric PostgreSQL cho thấy số lượng Lock Wait trên bảng orders
        tăng vọt. Bạn sẽ điều tra tiếp như thế nào?'
      options:
      - key: q1_opt_2a
        label: Truy vấn pg_stat_activity để tìm câu lệnh query và transaction đang
          giữ Exclusive Lock.
      - key: q1_opt_2b
        label: Chạy lệnh pg_cancel_backend() để kill toàn bộ connection đang mở.
      - key: q1_opt_2c
        label: Tạo thêm Read Replica cho Postgres để chia tải.
    - key: q1_n3
      prompt: 'Bước 3: Phát hiện câu lệnh ''SELECT * FROM orders WHERE user_id = ?
        FOR UPDATE'' bị treo lâu do callback webhook từ đối tác thanh toán VNPAY gửi
        về dồn dập. Bước tiếp theo là gì?'
      options:
      - key: q1_opt_3a
        label: Phân tích luồng xử lý Webhook Callback để tìm lý do vì sao transaction
          kéo dài.
      - key: q1_opt_3b
        label: Xóa chỉ mục (Index) trên cột user_id để giảm bớt độ phức tạp.
      - key: q1_opt_3c
        label: Tăng statement_timeout của DB lên 60 giây.
    - key: q1_n4
      prompt: 'Bước 4: Code xử lý callback đang thực hiện gọi HTTP tới Partner API
        trong cùng một DB Transaction (đang giữ lock row order). Do mạng chập chờn,
        HTTP request tốn 8 giây mới timeout. Bạn khắc phục nguyên nhân gốc này thế
        nào?'
      options:
      - key: q1_opt_4a
        label: Tách HTTP call ra khỏi DB transaction và dùng Redis Distributed Lock
          kiểm tra Idempotency trước.
      - key: q1_opt_4b
        label: Bỏ hẳn bước gọi HTTP xác thực với Partner API.
      - key: q1_opt_4c
        label: Chuyển HTTP request sang cơ chế synchronous blocking call để chờ phản
          hồi đầy đủ.
    - key: q1_n5
      prompt: 'Bước 5: Sau khi viết patch tách DB transaction và thêm Redis Idempotency
        Lock, bạn thử nghiệm bản fix ở đâu?'
      options:
      - key: q1_opt_5a
        label: Deploy lên môi trường Staging và chạy kịch bản load test giả lập callback
          đồng thời.
      - key: q1_opt_5b
        label: Deploy thẳng lên Production vì đang là sự cố khẩn cấp.
      - key: q1_opt_5c
        label: Tắt toàn bộ Redis trên Staging để test fallback path.
    - key: q1_n6
      prompt: 'Bước 6: Test trên Staging thành công, latency giảm đáng kể. Làm sao
        để đưa bản fix lên Production an toàn?'
      options:
      - key: q1_opt_6a
        label: Triển khai Canary Deployment cho 10% pod, giám sát error rate và DB
          connections.
      - key: q1_opt_6b
        label: Deploy đồng loạt 100% pod cùng lúc để nhanh chóng khắc phục.
      - key: q1_opt_6c
        label: Rollback toàn bộ mã nguồn payment-service về phiên bản tuần trước.
    - key: q1_n7
      prompt: 'Bước 7: Canary deployment ổn định. Đã rollout 100%. Tuy nhiên vẫn còn
        một lượng lớn webhook tồn đọng từ phía đối tác gửi lại (retry). Làm sao xử
        lý đống tồn đọng này?'
      options:
      - key: q1_opt_7a
        label: Cấu hình Rate Limiter tại API Gateway để nhận webhook từ từ theo dung
          lượng xử lý.
      - key: q1_opt_7b
        label: Chặn toàn bộ IP của cổng thanh toán để xóa queue tồn đọng.
      - key: q1_opt_7c
        label: Bật log LEVEL DEBUG trên toàn bộ Pod payment-service.
    - key: q1_n8
      prompt: 'Bước 8: Mọi luồng thanh toán mới đã chạy mượt. Còn một số đơn hàng
        bị treo Pending do bị dính lỗi trước đó. Bước cuối cùng để hoàn tất sự cố
        là gì?'
      options:
      - key: q1_opt_8a
        label: Chạy script Reconciliation tự động đối soát với VNPAY để cập nhật trạng
          thái đơn hàng và gửi thông báo cho khách.
      - key: q1_opt_8b
        label: Yêu cầu khách hàng tự hủy đơn và đặt lại đơn mới.
      - key: q1_opt_8c
        label: Chờ 24 giờ để hệ thống tự động hoàn tiền theo cronjob mặc định.
  answer_key:
