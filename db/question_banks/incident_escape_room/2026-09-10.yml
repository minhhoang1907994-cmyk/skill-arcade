          orders đang có lưu lượng ghi lớn.
      q1_n5_o2:
        points: 5
        minutes_cost: 5
        next_node: q1_node6
        explanation: Tạo index thường sẽ lock bảng orders, làm tất cả request ghi
          tiếp theo bị block.
      q1_n5_o3:
        points: 0
        minutes_cost: 10
        next_node: q1_node6
        explanation: Drop bảng làm mất toàn bộ dữ liệu đơn hàng trên production!
      q1_n6_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_node7
        explanation: Chính xác. Hủy các query treo quá lâu giúp giải phóng tức thì
          connection pool.
      q1_n6_o2:
        points: 0
        minutes_cost: 5
        next_node: q1_node7
        explanation: Restart app không giải quyết được các query đã nằm trong hàng
          đợi của Postgres.
      q1_n6_o3:
        points: 5
        minutes_cost: 6
        next_node: q1_node7
        explanation: Chờ đợi kéo dài thời gian outage làm ảnh hưởng trải nghiệm khách
          hàng.
      q1_n7_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_node8
        explanation: Chính xác. Rate limiting giúp giảm cơn sóng retry spike cho tới
