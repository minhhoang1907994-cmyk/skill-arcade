  difficulty: medium
- content:
    scenario: Dịch vụ notification-service liên tục bị sập và khởi động lại trên cụm
      Kubernetes. Trạng thái Pod liên tục báo CrashLoopBackOff. Lượng tin nhắn trong
      RabbitMQ queue đang bị dồn nén nghiêm trọng.
    initial_logs: |-
      NAME                                  READY   STATUS             RESTARTS   AGE
      notification-service-6789ab-xy123     0/1     CrashLoopBackOff   5          12m

      [Kernel Log] Out of memory: Kill process 12411 (java) score 920 or sacrifice child
      [Kubelet] Container notification-service failed memory limit test. OOMKilled
    nodes:
    - key: q2_node1
      prompt: Pod liên tục bị OOMKilled (Exit Code 137). Bạn sẽ làm gì để chẩn đoán
        vấn đề?
      options:
      - key: q2_n1_o1
        label: Xem kubectl describe pod và kiểm tra biểu đồ RAM usage trên Grafana
          trước thời điểm bị kill
      - key: q2_n1_o2
        label: Tăng số lượng Replica lên 10 pod bằng lệnh kubectl scale
      - key: q2_n1_o3
        label: Reboot toàn bộ Worker Node của Kubernetes Cluster
    - key: q2_node2
      prompt: Grafana cho thấy dung lượng RAM tăng liên tục theo hình bậc thang cho
        đến khi chạm mốc limit 2GB rồi bị OOMKilled. Hành động tiếp theo?
      options:
      - key: q2_n2_o1
        label: Thực hiện capture Heap Dump hoặc bật JProfiler trên môi trường staging/test
          với payload tương tự
      - key: q2_n2_o2
        label: Tăng Memory Limit trong K8s deployment lên 16GB ngay lập tức
      - key: q2_n2_o3
        label: Xóa hoàn toàn thuộc tính resources.limits.memory khỏi file YAML
    - key: q2_node3
      prompt: Heap Dump phân tích ra hàng triệu instance của class CloseableHttpResponse
        và byte buffer chưa được thu gom. Bạn đoán lỗi do đâu?
      options:
      - key: q2_n3_o1
        label: Tìm kiếm các vị trí gọi HTTP Client/Webhook trong code không đóng response
          body (rò rỉ kết nối/bộ nhớ)
      - key: q2_n3_o2
        label: Do Garbage Collector của Java hoạt động kém, cần đổi từ G1GC sang ParallelGC
      - key: q2_n3_o3
        label: Do phiên bản Kubernetes cluster bị lỗi bộ nhớ kernel
    - key: q2_node4
      prompt: 'Phát hiện commit mới trong WebhookNotifier.java có đoạn code: HttpResponse
        response = client.execute(request); mà không có response.close() hoặc try-with-resources.
        Bạn sửa như thế nào?'
      options:
      - key: q2_n4_o1
        label: Bọc dòng code vào block try-with-resources để đảm bảo response tự động
          close
      - key: q2_n4_o2
        label: Bọc dòng code vào try-catch block và bỏ qua Exception
      - key: q2_n4_o3
        label: Gọi System.gc() ngay sau khi gọi client.execute(request)
    - key: q2_node5
      prompt: Đã sửa xong code. Bạn sẽ kiểm tra bản sửa lỗi này thế nào trước khi
        đẩy lên Production?
      options:
      - key: q2_n5_o1
        label: Chạy Integration Test mô phỏng gửi 50,000 webhook và theo dõi biểu
          đồ RAM phẳng (flatline)
      - key: q2_n5_o2
        label: Deploy thẳng lên Production vì code sửa đơn giản
      - key: q2_n5_o3
        label: Chỉ chạy SonarQube static analysis rồi build image
    - key: q2_node6
      prompt: Test thành công, RAM duy trì ổn định ở 200MB. Làm thế nào để deploy
        bản fix lên K8s Production an toàn?
      options:
      - key: q2_n6_o1
        label: Build Docker Image mới với tag phiên bản rõ ràng và thực hiện Rolling
          Update (kubectl set image)
      - key: q2_n6_o2
        label: Dùng kubectl exec chèn trực tiếp file .class mới vào container đang
          chạy
      - key: q2_n6_o3
        label: Delete Deployment rồi Create lại từ đầu
    - key: q2_node7
      prompt: Pods mới đã lên và ở trạng thái Running. Bạn cần theo dõi chỉ số gì
        trong 5 phút tới?
      options:
      - key: q2_n7_o1
        label: Theo dõi Container Memory Usage, Unacked Messages trên RabbitMQ và
          Error Logs
      - key: q2_n7_o2
        label: Tắt hết Grafana alert vì đã hết OOMKilled
      - key: q2_n7_o3
        label: Restart lại RabbitMQ Broker
    - key: q2_node8
      prompt: RAM ổn định, nhưng hàng đợi RabbitMQ có 500k tin nhắn tồn đọng đang
        làm nghẽn hệ thống đối tác do gửi quá dồn dập. Xử lý sao?
      options:
      - key: q2_n8_o1
        label: Cấu hình Rate Limiting (Prefetch count) cho Consumer để tiêu thụ queue
          từ từ và ổn định
      - key: q2_n8_o2
        label: Purge (Xóa sạch) toàn bộ 500k tin nhắn trong queue
      - key: q2_n8_o3
        label: Tăng số lượng Worker thread lên 1000 để đẩy hết tin nhắn đi trong 10
          giây
    - key: q2_recovered
      prompt: Hàng đợi đã giải tỏa hoàn toàn, ứng dụng chạy ổn định và không còn bị
        Memory Leak!
      options: []
  answer_key:
    option_effects:
      q2_n1_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_node2
        explanation: Chính xác. Kiểm tra describe pod và metric RAM giúp xác định
          xu hướng sử dụng bộ nhớ.
      q2_n1_o2:
        points: 5
        minutes_cost: 3
        next_node: q2_node2
        explanation: Scale pod khi đang bị Memory Leak sẽ chỉ khiến nhiều pod bị sập
          hơn và tốn RAM node.
      q2_n1_o3:
        points: 0
        minutes_cost: 10
        next_node: q2_node2
        explanation: Reboot Node làm gián đoạn các service khác trên cùng cụm mà không
          sửa được lỗi ứng dụng.
      q2_n2_o1:
        points: 10
        minutes_cost: 2
        next_node: q2_node3
        explanation: Chính xác. Heap dump phân tích rõ object nào đang chiếm giữ bộ
          nhớ mà không được giải phóng.
      q2_n2_o2:
        points: 5
        minutes_cost: 3
        next_node: q2_node3
        explanation: Tăng limit RAM chỉ trì hoãn thời gian OOMKilled chứ không giải
          quyết được Memory Leak.
      q2_n2_o3:
        points: 0
        minutes_cost: 8
        next_node: q2_node3
        explanation: Bỏ resource limit sẽ khiến pod ngốn hết RAM của cả Worker Node,
          làm sập các pod khác.
      q2_n3_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_node4
        explanation: Chính xác. Unclosed HTTP response/stream là nguyên nhân kinh
          điển gây Memory/Socket leak.
      q2_n3_o2:
        points: 5
        minutes_cost: 3
        next_node: q2_node4
        explanation: Đổi GC Algorithm không giải quyết được vấn đề code giữ tham chiếu
          không giải phóng.
      q2_n3_o3:
        points: 0
        minutes_cost: 10
        next_node: q2_node4
        explanation: Lỗi phần lớn nằm ở tầng ứng dụng, không liên quan tới Kernel
          K8s.
      q2_n4_o1:
        points: 10
        minutes_cost: 2
        next_node: q2_node5
        explanation: Chính xác. Try-with-resources đảm bảo AutoCloseable được đóng
          an toàn kể cả khi có Exception.
      q2_n4_o2:
        points: 0
        minutes_cost: 4
        next_node: q2_node5
        explanation: Try-catch không đóng stream/connection, rò rỉ bộ nhớ vẫn tiếp
          diễn.
      q2_n4_o3:
        points: 0
        minutes_cost: 3
        next_node: q2_node5
        explanation: Gọi System.gc() làm giảm hiệu năng nghiêm trọng và không bắt
          buộc GC phải chạy ngay.
      q2_n5_o1:
        points: 10
        minutes_cost: 2
        next_node: q2_node6
