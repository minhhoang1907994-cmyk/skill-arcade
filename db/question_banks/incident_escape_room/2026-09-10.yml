  difficulty: hard
- content:
    scenario: Hệ thống thanh toán trực tuyến bị treo hàng loạt giao dịch vào giờ cao
      điểm. Khách hàng báo lỗi HTTP 500 khi bấm xác nhận thanh toán. DB Connection
      Pool báo cạn kiệt tài nguyên.
    initial_logs: |-
      [ERROR] 2023-10-24 14:02:11.102 [http-nio-8080-exec-45] c.e.p.s.PaymentService: Connection pool HikariCP - Connection is not available, request timed out after 30000ms.
      [WARN] 2023-10-24 14:02:15.890 [http-nio-8080-exec-12] c.e.p.c.ThirdPartyGatewayClient: Gateway response time elapsed 18500ms for Txn #992812
    nodes:
    - key: q1_node1
      prompt: Hệ thống thanh toán đang gặp sự cố HTTP 500 hàng loạt. Bước đầu tiên
        bạn cần làm gì để chẩn đoán?
      options:
      - key: q1_opt1
        label: Kiểm tra trạng thái Connection Pool của PostgreSQL DB và các active
          queries
      - key: q1_opt2
        label: Kởi động lại (Restart) ngay lập tức tất cả các Pod API Payment
      - key: q1_opt3
        label: Xóa sạch bộ nhớ tạm Redis Cache của toàn hệ thống
    - key: q1_node2
      prompt: Kết quả kiểm tra DB cho thấy active connections đạt 100/100. Bạn sẽ
        thực hiện lệnh nào để tìm query đang gây tắc nghẽn?
      options:
      - key: q1_opt4
        label: Truy vấn view pg_stat_activity để tìm các query ở trạng thái active
          lâu nhất
      - key: q1_opt5
        label: Tăng max_connections trong file cấu hình postgresql.conf lên 500
      - key: q1_opt6
        label: Thực hiện lệnh pg_terminate_backend ngắt tất cả kết nối DB
    - key: q1_node3
      prompt: Thấy hàng chục query 'UPDATE orders SET status = ...' đang ở trạng thái
        active > 30 giây. Nguyên nhân gốc rễ có thể là gì?
      options:
      - key: q1_opt7
        label: Kiểm tra mã nguồn xử lý webhook thanh toán để tìm đoạn code đang giữ
          DB Transaction
      - key: q1_opt8
        label: Thêm Index mới cho bảng orders
      - key: q1_opt9
        label: Thực hiện rollback Database về bản backup gần nhất
    - key: q1_node4
      prompt: Phát hiện mã nguồn thực hiện Sync HTTP Call sang Third-party Gateway
        TRONG BÊN TRONG cờ @Transactional. Cổng thanh toán đối tác đang bị trễ 18s/request.
        Bạn xử lý sao?
      options:
      - key: q1_opt10
        label: Bật Feature Flag / Circuit Breaker tạm thời ngắt gọi sync và tách HTTP
          call ra khỏi DB transaction
      - key: q1_opt11
        label: Tăng timeout của DB Transaction lên 120 giây
      - key: q1_opt12
        label: Chuyển tất cả Controller method sang dạng Async
    - key: q1_node5
      prompt: Sau khi cô lập HTTP Call ra khỏi Transaction, các DB Connection cũ bị
        treo vẫn chưa giải phóng hết. Hành động tiếp theo?
      options:
      - key: q1_opt13
        label: Kill các connection bị treo lâu (>30s) bằng pg_terminate_backend trên
          PostgreSQL
      - key: q1_opt14
        label: Reboot toàn bộ máy chủ Database PostgreSQL
      - key: q1_opt15
        label: Scale up Kubernetes HPA số lượng Pod Payment Service
    - key: q1_node6
      prompt: DB đã hạ nhiệt (<20% connection), nhưng hàng ngũ chờ (Message Queue)
        tích tụ 50,000 webhook cần xử lý. Bạn xử lý lượng backlog này như thế nào?
      options:
      - key: q1_opt16
        label: Tăng số lượng Consumer Worker và áp dụng Rate Limiting khi gọi sang
          đối tác
      - key: q1_opt17
        label: Xóa sạch (Purge) 50,000 message trong queue để hệ thống chạy nhanh
          hơn
      - key: q1_opt18
        label: Chuyển Log Level của Worker Pod về DEBUG
    - key: q1_node7
      prompt: Queue backlog đang giảm dần ổn định. Bạn cần làm gì để đảm bảo không
        mất mát dữ liệu giao dịch của khách hàng?
      options:
      - key: q1_opt19
        label: Chạy tiến trình Reconciliation (đối soát) dữ liệu giao dịch phát sinh
          trong thời gian sự cố
      - key: q1_opt20
        label: Đóng sự cố ngay lập tức vì metrics đã xanh
      - key: q1_opt21
        label: Bật lại chế độ Synchronous Call như ban đầu
    - key: q1_node8
      prompt: Đối soát thành công, các đơn hàng bị treo đã cập nhật đúng trạng thái.
        Bước cuối cùng trước khi đóng ticket?
      options:
      - key: q1_opt22
        label: Xác nhận khôi phục dịch vụ, cập nhật trạng thái hệ thống và chuyển
          sang node hoàn tất
      - key: q1_opt23
        label: Khởi động lại toàn bộ hạ tầng DB để dọn dẹp bộ nhớ
      - key: q1_opt24
        label: Tắt bớt công cụ giám sát Prometheus/Grafana
    - key: q1_recovery
      prompt: Sự cố đã được khắc phục hoàn toàn! Tất cả các chỉ số latency và DB Connection
        đã trở lại mức bình thường.
      options: []
  answer_key:
