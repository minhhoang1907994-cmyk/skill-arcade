  difficulty: medium
- content:
    scenario: Dịch vụ notification-worker viết bằng Node.js xử lý việc gửi mã OTP
      qua SMS và Email bị crash liên tục do OOM (Out Of Memory). Người dùng không
      nhận được mã OTP để đăng nhập.
    initial_logs: |-
      [FATAL] 2023-10-25 14:10:02 worker-node-7f8b: JavaScript heap out of memory. Process terminated by OOM Killer.
      [WARN] 2023-10-25 14:10:05 kubernetes: Pod notification-worker-689f-29xk restarted (Count: 14)
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: Worker bị OOMKilled liên tục mỗi 20-30 phút. Bạn bắt đầu thu
        thập thông tin gì đầu tiên?'
      options:
      - key: q2_opt_1a
        label: Xem biểu đồ Prometheus process_resident_memory_bytes và kiểm tra heap
          limits.
      - key: q2_opt_1b
        label: Tăng ngay RAM limit của Pod trong Kubernetes từ 1GB lên 16GB.
      - key: q2_opt_1c
        label: Thiết lập Cronjob tự động restart Pod mỗi 10 phút.
    - key: q2_n2
      prompt: 'Bước 2: Metric RAM tăng trưởng tuyến tính không bao giờ giảm kể cả
        khi ít job. Bạn dùng công cụ nào để tìm vị trí Memory Leak?'
      options:
      - key: q2_opt_2a
        label: Tạo Heap Snapshot bằng module heapdump/v8 và phân tích qua Chrome DevTools
          Memory Inspector.
      - key: q2_opt_2b
        label: Thêm tham số --no-warnings khi khởi chạy Node.js.
      - key: q2_opt_2c
        label: Chạy lệnh strace để theo dõi system calls của tiến trình Node.
    - key: q2_n3
      prompt: 'Bước 3: Heap Snapshot chỉ ra có hàng triệu instance của EventEmitter
        và closure context không được giải phóng. Bạn khoanh vùng đoạn code nào?'
      options:
      - key: q2_opt_3a
        label: Kiểm tra các nơi đăng ký event listener bằng .on() mà không gọi .removeListener()
          hoặc .off() sau khi dùng xong.
      - key: q2_opt_3b
        label: Kiểm tra các câu lệnh JSON.parse() trong ứng dụng.
      - key: q2_opt_3c
        label: Thay thế toàn bộ thư viện lodash bằng mã JS thuần.
    - key: q2_n4
      prompt: 'Bước 4: Phát hiện module gửi Email kết nối Socket nghe event socket.on(''data'')
        mỗi khi tạo connection mới, nhưng khi đóng connection lại quên gỡ listener.
        Cách sửa đúng nhất là gì?'
      options:
      - key: q2_opt_4a
        label: Dùng socket.once('data') hoặc gọi socket.removeListener() trong block
          finally sau khi đóng socket.
      - key: q2_opt_4b
        label: Gọi global.gc() thủ công ở cuối mỗi hàm gửi email.
      - key: q2_opt_4c
        label: Tăng listener max count bằng emitter.setMaxListeners(0).
    - key: q2_n5
      prompt: 'Bước 5: Trong lúc sửa code, phát hiện Queue đang bị tắc nghẽn hơn 50.000
        request OTP và Notification thông thường trộn lẫn. Làm sao để giải cứu tin
        nhắn OTP khẩn cấp?'
      options:
      - key: q2_opt_5a
        label: Tách Queue riêng cho OTP (Priority Queue) và cấp phát riêng dedicated
          worker pool cho nó.
      - key: q2_opt_5b
        label: Purge (xóa sạch) dữ liệu trong Queue để làm sạch bộ nhớ.
      - key: q2_opt_5c
        label: Tăng số lượng worker đọc từ queue chung lên 50 instance.
    - key: q2_n6
      prompt: 'Bước 6: Code fix rò rỉ bộ nhớ và tách Priority Queue đã chuẩn bị xong.
        Kiểm thử hiệu năng (Stress test) như thế nào trước khi deploy?'
      options:
      - key: q2_opt_6a
        label: Dùng autocannon/artillery bắn simulated load liên tục trên Staging
          và đo memory profile trong 15 phút.
      - key: q2_opt_6b
        label: Chạy unit test local rồi đẩy thẳng lên Production.
      - key: q2_opt_6c
        label: Kiểm tra code bằng mắt (code review) và đẩy bản build.
    - key: q2_n7
      prompt: 'Bước 7: Test Staging cho thấy bộ nhớ giữ phẳng ở 120MB dưới tải cao.
        Thực hiện triển khai bản vá lên Production như thế nào?'
      options:
      - key: q2_opt_7a
        label: Rolling update từng Pod worker, theo dõi sát Prometheus metric RAM
          và OTP latency.
      - key: q2_opt_7b
        label: Kill toàn bộ worker cũ cùng lúc rồi mới deploy worker mới.
      - key: q2_opt_7c
        label: Giữ nguyên worker cũ và deploy worker mới chạy song song chung DB.
    - key: q2_n8
      prompt: 'Bước 8: Worker mới chạy ổn định, OTP gửi thành công dưới 1 giây. Còn
        50.000 tin nhắn cũ đợt tắc nghẽn trong Queue thông thường (Email khuyến mãi,
        tin bối cảnh cũ). Xử lý thế nào?'
      options:
      - key: q2_opt_8a
        label: Filter loại bỏ các tin notification quá hạn (expired) và tiêu thụ (consume)
          phần còn lại với rate-limit phù hợp.
      - key: q2_opt_8b
        label: Bắn lại toàn bộ 50.000 tin ngay lập tức mà không lọc thời gian.
      - key: q2_opt_8c
        label: Xóa toàn bộ dữ liệu log của hệ thống để nhẹ server.
  answer_key:
    option_effects:
