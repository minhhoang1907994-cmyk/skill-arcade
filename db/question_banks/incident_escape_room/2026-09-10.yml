  difficulty: medium
- content:
    scenario: Microservice Tìm Kiếm (search-service) bị tràn bộ nhớ (Memory Leak)
      dẫn tới Pod liên tục bị Kubernetes OOMKilled mỗi 15 phút. Người dùng bị lỗi
      503 Service Unavailable khi tìm kiếm sản phẩm.
    initial_logs: |-
      kubectl get pods -n prod
      NAME                             READY   STATUS      RESTARTS   AGE
      search-service-674b9d79b-x829l   0/1     OOMKilled   12         3h

      [JVM Metrics] Old Gen Memory Usage: 98% (4.0GB / 4.0GB)
      [GC Log] [Full GC (Ergonomics) 4120M->4080M(4096M), 4.210 secs]
    nodes:
    - key: q2_node1
      prompt: Pod search-service bị OOMKilled liên tục và Full GC không giải phóng
        được bộ nhớ. Hành động chẩn đoán đầu tiên của bạn?
      options:
      - key: q2_opt1
        label: Phân tích biểu đồ JVM Memory trên Grafana và chuẩn bị tạo Heap Dump
      - key: q2_opt2
        label: Thực hiện nâng Memory RAM Limit của Container từ 4GB lên 16GB
      - key: q2_opt3
        label: Tắt tính năng Garbage Collection Logging trên Java Option
    - key: q2_node2
      prompt: Biểu đồ Grafana cho thấy Old Gen Heap tăng liên tục theo dạng tuyến
        tính. Làm thế nào để lấy dữ liệu heap nhằm xác định Object gây leak?
      options:
      - key: q2_opt4
        label: Sử dụng jcmd hoặc jmap xuất file Heap Dump trước khi Pod bị OOMKilled
          tiếp theo
      - key: q2_opt5
        label: Thêm tham số -XX:+UseG1GC và restart lại service ngay
      - key: q2_opt6
        label: Thực hiện Reindex toàn bộ dữ liệu trên ElasticSearch Cluster
    - key: q2_node3
      prompt: Bạn đã tải file heap dump (.hprof) về máy. Dùng công cụ Eclipse Memory
        Analyzer (MAT) để phân tích, bạn sẽ kiểm tra báo cáo nào trước?
      options:
      - key: q2_opt7
        label: Xem Dominator Tree và Leak Suspects Report để tìm class chiếm dung
          lượng retened heap lớn nhất
      - key: q2_opt8
        label: Kiểm tra danh sách các Thread Stack Trace
      - key: q2_opt9
        label: Kiểm tra danh sách System Environment Variables trong dump
    - key: q2_node4
      prompt: Báo cáo chỉ ra class SearchCacheManager giữ một ConcurrentHashMap chiếm
        3.4GB Heap với hơn 2 triệu entry. Nguyên nhân là gì?
      options:
      - key: q2_opt10
        label: Kiểm tra mã nguồn SearchCacheManager xem Map có cơ chế Eviction/TTL
          hay giới hạn kích thước không
      - key: q2_opt11
        label: Thay thế ConcurrentHashMap bằng HashMap thông thường
      - key: q2_opt12
        label: Tạo CronJob tự động restart Pod mỗi 10 phút
    - key: q2_node5
      prompt: Phát hiện dev dùng static ConcurrentHashMap làm local cache chứa từ
        khóa tìm kiếm nhưng KHÔNG CÓ TTL hay Max Size limit. Giải pháp sửa mã nguồn
        tối ưu?
      options:
      - key: q2_opt13
        label: Thay thế bằng Caffeine Cache / Guava Cache cấu hình maximumSize và
          expireAfterWrite
      - key: q2_opt14
        label: Viết thêm API Rest endpoint để khi nào gần đầy RAM thì gọi map.clear()
      - key: q2_opt15
        label: Bật annotation @Cacheable mà không cấu hình cache manager
    - key: q2_node6
      prompt: Code fix đã được review và build thành Docker image v1.2.1-hotfix. Chiến
        lược triễn khai an toàn nhất lên Production là gì?
      options:
      - key: q2_opt16
        label: Thực hiện Rolling Update triển khai từng Pod một và theo dõi chỉ số
      - key: q2_opt17
        label: Xóa toàn bộ Deployment cũ và Apply Deployment mới cùng lúc
      - key: q2_opt18
        label: Dùng lệnh kubectl replace pod trực tiếp trên máy sản xuất
    - key: q2_node7
      prompt: Pod bản v1.2.1-hotfix đã lên sóng thành công. Bạn kiểm tra chỉ số gì
        trên Grafana để xác nhận Memory Leak đã hết?
      options:
      - key: q2_opt19
        label: Theo dõi biểu đồ JVM Memory xem Old Gen có hình răng cưa (sawtooth
          pattern) và hạ xuống sau GC không
      - key: q2_opt20
        label: Kiểm tra dung lượng ổ đĩa Disk Usage trên Kubernetes Worker Nodes
      - key: q2_opt21
        label: Thực hiện Stress Test trực tiếp vào cơ sở dữ liệu Production
    - key: q2_node8
      prompt: Biểu đồ Old Gen đã hoạt động ổn định ở mức 20-40% bộ nhớ. Bước cuối
        cùng để hoàn tất quy trình xử lý sự cố?
      options:
      - key: q2_opt22
        label: Viết Post-mortem phân tích nguyên nhân gốc rễ và chuyển sang trạng
          thái khôi phục thành công
      - key: q2_opt23
        label: Giảm RAM Limit của container xuống 256MB cho tiết kiệm chi phí
      - key: q2_opt24
        label: Xóa toàn bộ các file Heap Dump cũ lưu trữ trong hệ thống
    - key: q2_recovery
      prompt: Sự cố Memory Leak đã được giải quyết triệt để! Dịch vụ tìm kiếm đã hoạt
        động ổn định không còn tình trạng OOMKilled.
      options: []
  answer_key:
    option_effects:
      q2_opt1:
        points: 10
        minutes_cost: 1
        next_node: q2_node2
        explanation: 'Đúng quy trình: Phân tích metrics JVM và thu thập Heap Dump
          là chìa khóa để xử lý sự cố OOM.'
      q2_opt2:
        points: 5
        minutes_cost: 4
        next_node: q2_node1
        explanation: Tăng RAM chỉ hoãn thời gian bị OOMKilled chứ không giải quyết
          được lỗi Memory Leak gốc rễ.
      q2_opt3:
        points: 0
        minutes_cost: 3
        next_node: q2_node1
        explanation: Tắt GC Log khiến bạn mất dữ liệu giám sát quan trọng về tần suất
          Garbage Collection.
      q2_opt4:
        points: 10
        minutes_cost: 1
        next_node: q2_node3
        explanation: Chụp Heap Dump đúng thời điểm giúp bắt trọn trạng thái memory
          trước khi crash.
      q2_opt5:
        points: 0
        minutes_cost: 5
        next_node: q2_node2
        explanation: Đổi GC Algorithm không chữa được lỗi lập trình vô hạn lưu trữ
          object trong bộ nhớ.
      q2_opt6:
        points: 0
        minutes_cost: 8
        next_node: q2_node2
        explanation: Reindex ElasticSearch tốn tài nguyên Cluster và không liên quan
          đến JVM Heap của search-service.
      q2_opt7:
        points: 10
        minutes_cost: 1
        next_node: q2_node4
