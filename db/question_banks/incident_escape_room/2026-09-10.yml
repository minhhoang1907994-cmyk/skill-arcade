  difficulty: hard
- content:
    scenario: Hệ thống thanh toán e-commerce báo lỗi hàng loạt khi người dùng ấn thanh
      toán. API Gateway trả về HTTP 504 Gateway Timeout liên tục. Lượng truy cập không
      tăng đột biến so với bình thường.
    initial_logs: |-
      [2023-10-24 14:02:11] ERROR c.e.payment.service.CheckoutService - Timeout waiting for database connection from pool.
      [2023-10-24 14:02:15] WARN com.zaxxer.hikari.pool.HikariPool - HikariPool-1 - Connection is not available, request timed out after 30005ms.
      [2023-10-24 14:02:18] ERROR c.e.payment.controller.OrderController - 504 Gateway Timeout on POST /api/v1/checkout
    nodes:
    - key: q1_node1
      prompt: Hệ thống đang nghẽn nặng ở tầng thanh toán. Bạn làm gì đầu tiên để xác
        định nguyên nhân?
      options:
      - key: q1_n1_o1
        label: Kiểm tra APM dashboard (Datadog/Grafana) để xem metric DB Connection
          Pool và Slow Queries
      - key: q1_n1_o2
        label: Khởi động lại toàn bộ các app server để giải phóng kết nối
      - key: q1_n1_o3
        label: Kiểm tra cấu hình Network Firewall kết nối giữa App Server và DB
    - key: q1_node2
      prompt: Metrics cho thấy HikariPool đạt 100% (50/50 connections) và CPU của
        Database đạt 98%. Bạn làm gì tiếp theo?
      options:
      - key: q1_n2_o1
        label: Tăng ngay maxConnections trong HikariPool lên 200
      - key: q1_n2_o2
        label: Truy vấn pg_stat_activity trên Postgres để xem các query đang chiếm
          connection và lock
      - key: q1_n2_o3
        label: Kill ngay lập tức tất cả kết nối DB bằng pg_terminate_backend
    - key: q1_node3
      prompt: 'pg_stat_activity cho thấy hàng chục transaction đang treo ở câu lệnh:
        SELECT * FROM orders WHERE user_id = ? AND status = ''PENDING'' FOR UPDATE.
        Bạn làm gì?'
      options:
      - key: q1_n3_o1
        label: Chạy EXPLAIN ANALYZE câu lệnh SELECT trên để xem Execution Plan
      - key: q1_n3_o2
        label: Restart dịch vụ PostgreSQL Database
      - key: q1_n3_o3
        label: Nâng cấp (scale up) RAM và CPU cho Database Instance
    - key: q1_node4
      prompt: Kết quả EXPLAIN ANALYZE cho thấy DB đang phải 'Seq Scan' toàn bộ bảng
        orders (15 triệu dòng) vì thiếu index. Bước tiếp theo?
      options:
      - key: q1_n4_o1
        label: Kiểm tra lịch sử git commit/migration gần nhất xem có ai vừa sửa đổi
          bảng orders
      - key: q1_n4_o2
        label: Xóa toàn bộ Redis Cache để giải phóng tài nguyên
      - key: q1_n4_o3
        label: Thực hiện REINDEX toàn bộ Database ngay lập tức
    - key: q1_node5
      prompt: Phát hiện bản release v2.4 cách đây 1 giờ có file migration quên tạo
        index idx_orders_user_status. Bạn sửa bằng cách nào?
      options:
      - key: q1_n5_o1
        label: Tạo index bằng lệnh CREATE INDEX CONCURRENTLY idx_orders_user_status
          ON orders(user_id, status)
      - key: q1_n5_o2
        label: Tạo index bằng lệnh CREATE INDEX idx_orders_user_status ON orders(user_id,
          status) thông thường
      - key: q1_n5_o3
        label: Drop bảng orders và chạy lại toàn bộ migration từ đầu
    - key: q1_node6
      prompt: Index đã tạo xong, nhưng connection pool vẫn chưa hạ nhiệt do hàng trăm
        query cũ đang bị treo chờ lock. Bạn làm gì?
      options:
      - key: q1_n6_o1
        label: Chạy lệnh pg_cancel_backend() hủy các query PENDING đã chạy quá 30
          giây
      - key: q1_n6_o2
        label: Restart tất cả Microservices ứng dụng
      - key: q1_n6_o3
        label: Chờ đợi 30 phút để các query tự động timeout
    - key: q1_node7
      prompt: Số lượng connection đã giảm mạnh về 15%. Tuy nhiên lượng request bị
        timeout trước đó đang client retry dồn dập vào API Gateway. Bạn xử lý sao?
      options:
      - key: q1_n7_o1
        label: Bật Rate Limiter trên API Gateway tạm thời và điều chỉnh theo dõi trong
          2 phút
      - key: q1_n7_o2
        label: Flush toàn bộ DB Redis để hủy session người dùng
      - key: q1_n7_o3
        label: Khởi động lại API Gateway service
    - key: q1_node8
      prompt: Lưu lượng truy cập đã ổn định, response time trở lại < 50ms. Bước cuối
        cùng để kết thúc xử lý sự cố là gì?
      options:
      - key: q1_n8_o1
        label: Xác nhận lại metrics trên Prometheus, gỡ Rate Limiter tạm thời và cập
          nhật file migration vào Git repository
      - key: q1_n8_o2
        label: Đóng ngay ticket mà không cần ghi nhận tài liệu post-mortem
      - key: q1_n8_o3
        label: Tắt bớt 50% số lượng pod để tiết kiệm chi phí
    - key: q1_recovered
      prompt: Sự cố đã được khắc phục hoàn toàn! Hệ thống hoạt động bình thường.
      options: []
  answer_key:
    option_effects:
      q1_n1_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_node2
        explanation: Chính xác. Kiểm tra APM giúp nhanh chóng thu hẹp phạm vi vấn
