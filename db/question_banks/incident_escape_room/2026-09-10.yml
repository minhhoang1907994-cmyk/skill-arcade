        next_node: q1_node5
        explanation: Reboot DB gây downtime toàn hệ thống không cần thiết.
      q1_opt15:
        points: 5
        minutes_cost: 3
        next_node: q1_node5
        explanation: Scale up Pods trong khi DB chưa giải phóng bớt connection sẽ
          làm quá tải DB hơn.
      q1_opt16:
        points: 10
        minutes_cost: 1
        next_node: q1_node7
        explanation: Tăng worker kết hợp Rate Limit giúp tiêu thụ backlog an toàn
          mà không làm quá tải gateway đối tác.
      q1_opt17:
        points: 0
        minutes_cost: 5
        next_node: q1_node6
        explanation: Purge queue sẽ làm mất tiền và dữ liệu thanh toán của 50,000
