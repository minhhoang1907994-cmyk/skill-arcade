  difficulty: hard
- content:
    scenario: Hệ thống mua sắm flash-sale bị ngưng trệ khi lượng truy cập tăng vọt.
      Khách hàng liên tục gặp lỗi 500 khi nhấn nút thanh toán trên ứng dụng di động.
    initial_logs: |-
      [ERROR] 2023-10-24 10:00:15 - POST /api/v1/checkout - HTTP 500 - Internal Server Error - DB connection pool exhausted
      [WARN] 2023-10-24 10:00:16 - Redis pool: active=1000/1000, idle=0, waiting_threads=450
      [ERROR] 2023-10-24 10:00:18 - HikariPool-1 - Connection is not available, request timed out after 30000ms
    nodes:
    - key: s1_n1
      prompt: Cảnh báo lỗi 500 xuất hiện dồn dập ở endpoint /checkout. Bạn sẽ làm
        gì đầu tiên?
      options:
      - key: s1_n1_opt1
        label: Kiểm tra APM và log chi tiết để xác định cổ chai (bottleneck)
      - key: s1_n1_opt2
        label: Khai tử và khởi động lại toàn bộ pod ứng dụng ngay lập tức
      - key: s1_n1_opt3
        label: Tăng số lượng pod ứng dụng lên gấp đôi
    - key: s1_n2
      prompt: APM hiển thị DB connection pool cạn kiệt và thời gian phản hồi của Redis
        tăng vọt lên vài giây. Bước tiếp theo là gì?
      options:
      - key: s1_n2_opt1
        label: Kiểm tra chỉ số chi tiết của Redis (latency, connected_clients, hit
          rate)
      - key: s1_n2_opt2
        label: Nâng cấp kích thước database ngay lập tức
      - key: s1_n2_opt3
        label: Khởi động lại cơ sở dữ liệu PostgreSQL
    - key: s1_n3
      prompt: Chỉ số Redis cho thấy cache hit rate giảm từ 98% xuống 12%, số kết nối
        Redis đạt tối đa 1000. Bạn điều tra tiếp thế nào?
      options:
      - key: s1_n3_opt1
        label: Kiểm tra Redis slowlog và danh sách key truy cập nhiều nhất
      - key: s1_n3_opt2
        label: Chạy lệnh FLUSHALL trên Redis để dọn dẹp bộ nhớ
      - key: s1_n3_opt3
        label: Tăng tham số maxmemory của Redis
    - key: s1_n4
      prompt: Phát hiện key thông tin sản phẩm flash-sale 'product_102' vừa hết hạn
        TTL, dẫn đến hàng ngàn request cùng lúc chọc thẳng xuống DB (Cache Stampede).
        Bạn đề xuất hướng xử lý gốc?
      options:
      - key: s1_n4_opt1
        label: Áp dụng cơ chế Mutex Lock / Singleflight khi đọc cache bị miss
      - key: s1_n4_opt2
        label: Đặt TTL của tất cả các key sản phẩm thành vô hạn
      - key: s1_n4_opt3
        label: Thêm 5 slave node cho Redis cluster
    - key: s1_n5
      prompt: Trong khi chờ dev chuẩn bị bản hotfix code, bạn áp dụng biện pháp ứng
        cứu khẩn cấp nào tại tầng hạ tầng?
      options:
      - key: s1_n5_opt1
        label: Bật Rate Limiter trên API Gateway đối với endpoint thanh toán hot key
      - key: s1_n5_opt2
        label: Tắt hoàn toàn tính năng Cache của ứng dụng
      - key: s1_n5_opt3
        label: Ngắt kết nối người dùng ứng dụng di động
    - key: s1_n6
      prompt: Bản vá code khôi phục cache với Singleflight Pattern đã sẵn sàng. Bạn
        triển khai ra sao?
      options:
      - key: s1_n6_opt1
        label: Triển khai Canary deployment 10% traffic trước để theo dõi
      - key: s1_n6_opt2
        label: Deploy trực tiếp 100% tất cả các instance cùng lúc
      - key: s1_n6_opt3
        label: Rollback ứng dụng về phiên bản cũ tuần trước
    - key: s1_n7
      prompt: Sau khi deploy Canary, tỉ lệ lỗi trên 10% pod giảm về 0%. Bạn làm gì
        tiếp theo?
      options:
      - key: s1_n7_opt1
        label: Mở rộng triển khai 100% và chủ động warm-up cache cho key hot
      - key: s1_n7_opt2
        label: Tắt ngay Rate Limiter trên API Gateway
      - key: s1_n7_opt3
        label: Đóng ngay ticket sự cố mà không kiểm tra thêm
    - key: s1_n8
      prompt: Tỷ lệ lỗi 500 đã hết, DB connection pool trở lại mức an toàn 20%, Redis
        hit rate đạt 99%. Bạn kết thúc xử lý sự cố thế nào?
      options:
      - key: s1_n8_opt1
        label: Gỡ bỏ Rate Limiter tạm thời, cập nhật dashboard cảnh báo và viết tài
          liệu Post-mortem
      - key: s1_n8_opt2
        label: Giữ nguyên Rate Limiter chặt chẽ vĩnh viễn
      - key: s1_n8_opt3
        label: Không làm gì thêm
  answer_key:
    option_effects:
      s1_n1_opt1:
        points: 10
        minutes_cost: 1
        next_node: s1_n2
        explanation: Chẩn đoán chính xác bằng log và APM giúp tiết kiệm thời gian
          khoanh vùng nguyên nhân.
      s1_n1_opt2:
        points: 0
        minutes_cost: 5
        next_node: s1_n1
        explanation: Khởi động lại pod khi root cause thuộc về nghẽn kết nối chỉ làm
          gián đoạn thêm dịch vụ.
      s1_n1_opt3:
        points: 5
        minutes_cost: 3
        next_node: s1_n2
        explanation: Tăng pod tạm thời giải quyết được một phần request nhưng sẽ làm
          cạn kiệt DB connection nhanh hơn.
      s1_n2_opt1:
        points: 10
        minutes_cost: 1
        next_node: s1_n3
        explanation: Đánh giá Redis metrics là bước đúng đắn khi phát hiện latency
          tăng cao.
      s1_n2_opt2:
        points: 5
        minutes_cost: 4
        next_node: s1_n3
        explanation: Scale up DB tốn thời gian và chi phí mà không giải quyết gốc
          rễ do truy cập cache miss.
      s1_n2_opt3:
        points: 0
        minutes_cost: 6
        next_node: s1_n2
        explanation: Khởi động lại DB đang quá tải sẽ khiến toàn bộ giao dịch sụp
          đổ hoàn toàn.
      s1_n3_opt1:
        points: 10
        minutes_cost: 1
        next_node: s1_n4
        explanation: Slowlog giúp xác định chính xác key hoặc truy vấn đang tạo ra
          tải đột biến.
      s1_n3_opt2:
        points: 0
        minutes_cost: 8
        next_node: s1_n3
        explanation: Xóa toàn bộ cache sẽ làm bão request chọc thẳng xuống DB, đánh
          sập hệ thống ngay tức khắc.
      s1_n3_opt3:
        points: 5
        minutes_cost: 2
        next_node: s1_n4
        explanation: Tăng bộ nhớ không giải quyết được vấn đề hết hạn TTL của hot
          key.
      s1_n4_opt1:
        points: 10
        minutes_cost: 2
        next_node: s1_n5
        explanation: Mutex Lock đảm bảo chỉ 1 request nạp dữ liệu từ DB lên cache
          khi miss, giải quyết triệt để Cache Stampede.
      s1_n4_opt2:
        points: 0
        minutes_cost: 4
        next_node: s1_n4
        explanation: TTL vô hạn sẽ khiến dữ liệu bị stale và không thể cập nhật thông
          tin tồn kho chính xác.
      s1_n4_opt3:
        points: 5
        minutes_cost: 3
        next_node: s1_n5
        explanation: Thêm slave chỉ tăng khả năng đọc cache nhưng không ngăn được
          việc tất cả miss cùng lúc.
      s1_n5_opt1:
        points: 10
        minutes_cost: 2
        next_node: s1_n6
        explanation: Rate limiting giúp kiểm soát lưu lượng truy cập hot key, bảo
          vệ DB khỏi tình trạng sụp đổ hoàn toàn.
      s1_n5_opt2:
        points: 0
        minutes_cost: 5
        next_node: s1_n5
        explanation: Tắt cache sẽ khiến 100% traffic giã thẳng xuống DB gây quá tải
          vĩnh viễn.
      s1_n5_opt3:
        points: 0
        minutes_cost: 5
        next_node: s1_n5
        explanation: Hành động này làm gián đoạn dịch vụ nghiêm trọng không cần thiết.
      s1_n6_opt1:
        points: 10
        minutes_cost: 2
        next_node: s1_n7
        explanation: Canary deployment giúp giảm thiểu rủi ro nếu bản vá gặp lỗi không
          mong muốn.
      s1_n6_opt2:
        points: 0
        minutes_cost: 4
        next_node: s1_n6
        explanation: Deploy đồng loạt trong lúc đỉnh điểm sự cố dễ làm gián đoạn kết
          nối hàng loạt.
      s1_n6_opt3:
        points: 0
        minutes_cost: 5
        next_node: s1_n6
        explanation: Rollback không khắc phục được Cache Stampede vốn do thiết kế
          caching.
      s1_n7_opt1:
        points: 10
        minutes_cost: 1
        next_node: s1_n8
        explanation: Warm-up cache trước giúp hệ thống chịu tải mượt mà khi nhận 100%
          traffic trở lại.
      s1_n7_opt2:
        points: 5
        minutes_cost: 2
        next_node: s1_n8
        explanation: Tháo bỏ giới hạn quá sớm khi chưa deploy 100% bản vá có thể làm
          bão request xuất hiện lại.
      s1_n7_opt3:
        points: 0
        minutes_cost: 3
        next_node: s1_n7
        explanation: Chưa kiểm tra toàn bộ ứng dụng đã đóng ticket là quy trình không
          an toàn.
      s1_n8_opt1:
        points: 10
        minutes_cost: 1
        next_node: s1_n8
        explanation: Quy trình hoàn thiện sự cố chuẩn chỉnh, đảm bảo hệ thống ổn định
          lâu dài.
      s1_n8_opt2:
        points: 0
        minutes_cost: 2
        next_node: s1_n8
        explanation: Duy trì giới hạn chặt chẽ làm ảnh hưởng trải nghiệm người dùng
          bình thường.
      s1_n8_opt3:
        points: 0
        minutes_cost: 2
        next_node: s1_n8
        explanation: Không rút kinh nghiệm và ghi chép tài liệu sẽ làm lặp lại sự
          cố tương tự.
    recovery_node: s1_n8
  difficulty: medium
- content:
    scenario: Dịch vụ xử lý Webhook thanh toán từ đối tác ngân hàng liên tục rơi vào
      trạng thái CrashLoopBackOff trên Kubernetes cluster. Ngân hàng báo tỷ lệ giao
      dịch thất bại tăng cao.
    initial_logs: |-
      kubectl get pods -n payment
      NAME                                    READY   STATUS             RESTARTS   AGE
      payment-webhook-6f88b9967d-x2z9k        0/1     OOMKilled          5          12m
      payment-webhook-6f88b9967d-99a21        0/1     CrashLoopBackOff   4          10m
      [LAST LOG] Fatal error: java.lang.OutOfMemoryError: Java heap space
    nodes:
    - key: s2_n1
      prompt: Pod dịch vụ payment-webhook gặp lỗi CrashLoopBackOff với lý do OOMKilled.
        Hành động kiểm tra đầu tiên của bạn?
      options:
      - key: s2_n1_opt1
        label: Xem log pod chi tiết và mô tả sự kiện (kubectl describe pod)
      - key: s2_n1_opt2
        label: Xóa deployment dịch vụ và tạo lại từ đầu
      - key: s2_n1_opt3
        label: Tăng giới hạn CPU (CPU Limit) trong file manifest Kubernetes
    - key: s2_n2
      prompt: Log xác nhận ứng dụng bị Java Heap OutOfMemoryError. Bạn tiến hành phân
        tích bộ nhớ như thế nào?
      options:
      - key: s2_n2_opt1
        label: Tạo heap dump / cắm profiler để phân tích các object đang chiếm giữ
          bộ nhớ
      - key: s2_n2_opt2
        label: Tăng Memory Limit trong Kubernetes lên 10 lần ngay lập tức mà không
          phân tích
      - key: s2_n2_opt3
        label: Khởi động lại node worker của Kubernetes
    - key: s2_n3
      prompt: Kết quả heap dump cho thấy hàng trăm ngàn instance của WebhookPayload
        đang nằm tích tụ trong BlockingQueue chờ xử lý. Điều này gợi ý nguyên nhân
        gì?
      options:
      - key: s2_n3_opt1
        label: Tốc độ nhận webhook nhanh hơn tốc độ worker tiêu thụ, queue không giới
          hạn kích thước (unbounded)
      - key: s2_n3_opt2
        label: Cơ sở dữ liệu bị hỏng index
      - key: s2_n3_opt3
        label: Đường truyền mạng giữa ngân hàng và server bị đứt
    - key: s2_n4
      prompt: Kiểm tra code thấy hàng đợi nhận webhook dùng Unbounded Queue và thread
        worker bị tắc nghẽn khi gọi downstream API xác minh giao dịch. Giải pháp gốc
        về mặt lập trình là gì?
      options:
      - key: s2_n4_opt1
        label: Dùng Bounded Queue, thêm Backpressure và chuyển giao dịch dư thừa sang
          Dead Letter Queue (DLQ)
      - key: s2_n4_opt2
        label: Bỏ hẳn hàng đợi và xử lý Synchronous trực tiếp trên HTTP thread
      - key: s2_n4_opt3
        label: Tăng timeout của HTTP request gọi tới downstream API lên 10 phút
    - key: s2_n5
      prompt: Trong lúc chờ dev viết code xử lý Backpressure, ngân hàng vẫn liên tục
        bắn webhook gây trào bộ nhớ. Bạn xử lý tạm thời thế nào trên hạ tầng?
      options:
      - key: s2_n5_opt1
        label: Áp dụng Nginx/Ingress Rate Limit cho IP của ngân hàng và tăng tạm memory
          limit
      - key: s2_n5_opt2
        label: Tắt hoàn toàn Ingress controller
      - key: s2_n5_opt3
