  difficulty: hard
- content:
    scenario: Hệ thống thanh toán của ứng dụng Thương mại điện tử đột ngột gặp sự
      cố trong giờ cao điểm Flash Sale. Tỷ lệ phản hồi lỗi HTTP 500 tăng đột biến
      trên endpoint nhận webhook thanh toán từ đối tác ngân hàng `/api/v1/payments/webhook`,
      khiến đơn hàng của người dùng bị treo ở trạng thái 'Đang chờ thanh toán'.
    initial_logs: |-
      2023-10-24 14:02:11.104 ERROR [payment-service,,] 1 --- [nio-8080-exec-42] c.z.h.p.HikariPool : HikariPool-1 - Connection is not available, request timed out after 30005ms.
      2023-10-24 14:02:11.108 ERROR [payment-service,,] 1 --- [nio-8080-exec-42] o.a.c.c.C.[.[.[.[dispatcherServlet] : Servlet.service() for servlet [dispatcherServlet] threw exception: org.springframework.dao.CannotAcquireLockException: Could not open JPA EntityManager for transaction; nested exception is javax.persistence.PersistenceException: Unexpected exception rendering failure
    nodes:
    - key: q1_n1
      prompt: Hệ thống đang trả về lỗi HTTP 500 liên tục trên API webhook. Bạn chọn
        bước chẩn đoán ban đầu nào?
      options:
      - key: q1_n1_o1
        label: Kiểm tra Grafana dashboard theo dõi HikariCP Connection Pool và HTTP
          response status code.
      - key: q1_n1_o2
        label: Kích hoạt Auto-scaling để tăng gấp đôi số lượng Pod `payment-service`
          ngay lập tức.
      - key: q1_n1_o3
        label: Kiểm tra CPU và Memory utilization của các Node trong cụm Kubernetes.
    - key: q1_n2
      prompt: Metrics cho thấy `HikariCP Active Connections` đạt ngưỡng tối đa 100/100,
        số lượng `Pending Threads` tăng vọt. Bạn làm gì tiếp theo?
      options:
      - key: q1_n2_o1
        label: Kiểm tra danh sách active SQL queries và connection state trên PostgreSQL
          Master DB.
      - key: q1_n2_o2
        label: Tăng tham số `maximum-pool-size` từ 100 lên 300 trong Spring Boot Application
          Config rồi deploy lại.
      - key: q1_n2_o3
        label: Kiểm tra access log trên Nginx Ingress Controller để tìm IP đang DDOS.
    - key: q1_n3
      prompt: PostgreSQL dashboard hiển thị hơn 80 kết nối ở trạng thái `idle in transaction`
        xuất phát từ endpoint webhook. Bước xử lý tiếp theo là gì?
      options:
      - key: q1_n3_o1
        label: Đọc source code đoạn xử lý logic trong `PaymentWebhookController` và
          Service layer tương ứng.
      - key: q1_n3_o2
        label: Chạy câu lệnh `pg_terminate_backend()` để kill toàn bộ các session
          `idle in transaction`.
      - key: q1_n3_o3
        label: Thực hiện Restart server PostgreSQL Master.
    - key: q1_n4
      prompt: Trong code, bạn phát hiện annotation `@Transactional` được đặt ở phương
        thức ngoài cùng `processWebhook()`. Bên trong phương thức này có gọi một REST
        API sang đối tác ngân hàng bên thứ ba (`thirdPartyBankClient.verifyTransaction()`).
        Do cổng ngân hàng bị nghẽn, thời gian phản hồi kéo dài hơn 25 giây. Phương
        án sửa triệt để là gì?
      options:
      - key: q1_n4_o1
        label: Tách REST API call ra khỏi `@Transactional` block và thiết lập Connect/Read
          Timeout 3s cho HTTP Client.
      - key: q1_n4_o2
        label: Tăng timeout của `@Transactional(timeout = 60)` để tránh bị rollback.
      - key: q1_n4_o3
        label: Thêm annotation `@Async` vào phương thức gọi đối tác ngân hàng.
    - key: q1_n5
      prompt: Bạn đã chẩn đoán đúng nguyên nhân và chuẩn bị giải pháp. Bạn sẽ triển
        khai hotfix như thế nào để khôi phục dịch vụ an toàn?
      options:
      - key: q1_n5_o1
        label: Tạo Hotfix Pull Request, chạy CI/CD pipeline để build image mới và
          tiến hành deployment.
      - key: q1_n5_o2
        label: Sửa trực tiếp code trên Container đang chạy qua kubectl exec để tiết
          kiệm thời gian.
      - key: q1_n5_o3
        label: Chặn toàn bộ đường truyền webhook từ API Gateway cho đến khi sửa xong
          code.
    - key: q1_n6
      prompt: Hotfix đã được triển khai lên cụm K8s, nhưng một số Pod cũ vẫn duy trì
        các DB connection bị treo trước đó. Bạn cần làm gì?
      options:
      - key: q1_n6_o1
        label: Thực hiện Rolling Restart cho deployment `payment-service` để thay
          thế hoàn toàn các Pod cũ.
      - key: q1_n6_o2
        label: Giữ nguyên và chờ 30 phút để các connection bị treo tự giải phóng.
      - key: q1_n6_o3
        label: Scale down Deployment về 0 Pod rồi scale up lại.
    - key: q1_n7
      prompt: Các Pod mới đã nhận traffic ổn định. Bước kiểm tra và xác nhận nào là
        cần thiết nhất ngay lúc này?
      options:
      - key: q1_n7_o1
        label: Xác nhận HikariCP Active Connection giảm xuống dưới 20% và tỉ lệ lỗi
          HTTP 500 về 0% trên Grafana.
      - key: q1_n7_o2
        label: Chỉ theo dõi log trong 2 tiếng mà không cần xem dashboard metrics.
      - key: q1_n7_o3
        label: Xóa toàn bộ log trên server để tiết kiệm không gian đĩa cứng.
    - key: q1_n8
      prompt: Sự cố đã hoàn toàn được khắc phục. Hệ thống thanh toán hoạt động bình
        thường trở lại. Hành động cuối cùng của bạn là gì?
      options:
      - key: q1_n8_o1
        label: Đóng ticket incident, cập nhật tài liệu kiến trúc và họp làm báo cáo
          Post-Mortem.
      - key: q1_n8_o2
        label: Đóng ticket sự cố và quay lại công việc lập trình tính năng mới mà
          không cần họp.
      - key: q1_n8_o3
        label: Gửi email quy trách nhiệm cho đối tác ngân hàng.
