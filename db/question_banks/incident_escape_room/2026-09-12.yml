      q2_n4_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_n5
        explanation: Chính xác! Thiết kế Cache chuẩn phải chia nhỏ key (granular keys)
          và luôn có TTL để giải phóng RAM.
      q2_n4_o2:
        points: 5
        minutes_cost: 3
        next_node: q2_n5
        explanation: Bỏ cache sẽ làm quá tải Database Master trong giờ cao điểm Flash
