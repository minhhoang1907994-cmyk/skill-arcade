      q2_n2_o3:
        points: 0
        minutes_cost: 4
        next_node: q2_n2
        explanation: Sai. OOMKilled liên quan đến RAM (bộ nhớ trong), không phải Disk
          Storage.
      q2_n3_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_n4
