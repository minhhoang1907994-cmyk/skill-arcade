        explanation: Network I/O không trực tiếp gây ra lỗi OOMKilled bộ nhớ RAM của
          container.
      q2_n2_o1:
        points: 10
        minutes_cost: 1
        next_node: q2_n3
        explanation: Chính xác. Đồ thị RAM tăng liên tục và Old Gen đầy sau GC là
          dấu hiệu kinh điển của việc rò rỉ bộ nhớ (Memory Leak).
      q2_n2_o2:
        points: 0
        minutes_cost: 4
        next_node: q2_n2
        explanation: Sai. GC chạy thiếu hiệu quả thường do không thể giải phóng các
