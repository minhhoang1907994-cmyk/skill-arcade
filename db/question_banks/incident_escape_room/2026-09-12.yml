  difficulty: hard
- content:
    scenario: Hệ thống cổng thanh toán Payment Gateway bị nghẽn mạng nghiêm trọng.
      Latency trung bình của API thanh toán tăng từ 50ms lên 8000ms. Khách hàng liên
      tục báo lỗi timeout khi thực hiện giao dịch.
    initial_logs: "[ERROR] [PaymentService] RedisConnectionFailureException: Could
      not get a resource from the pool | [WARN] [HikariPool-1] Connection is not available,
      request timed out after 30000ms | Metric: DB Master CPU 98%, Redis CPU 15%,
      Active Web Pods 20/20"
    nodes:
    - key: s1_node_1
      prompt: 'Bước 1: Bạn vừa nhận cảnh báo latency tăng cao và lỗi kết nối. Bước
        tiếp theo bạn sẽ kiểm tra chỉ số nào đầu tiên?'
      options:
      - key: s1_n1_o1
        label: Kiểm tra chi tiết Redis Pool Metrics và Hikari Database Pool Metrics
      - key: s1_n1_o2
        label: Kiểm tra Slow Query Logs trên Database Master
      - key: s1_n1_o3
        label: Thực hiện Restart toàn bộ Application Pods ngay lập tức
    - key: s1_node_2
      prompt: 'Bước 2: Chỉ số cho thấy Redis Connection Pool đã chạm mốc maxTotal=50,
        đồng thời Hikari DB Connection Pool bị kiệt sức. Bạn sẽ làm gì?'
      options:
      - key: s1_n2_o1
        label: Tăng tham số Redis maxTotal lên 500 trên Config Server rồi restart
          app
      - key: s1_n2_o2
        label: Kiểm tra mã nguồn các đợt thay đổi gần đây liên quan đến cách mở/đóng
          Redis Connection
      - key: s1_n2_o3
        label: Thực hiện Failover Database sang Replica Node để giảm tải CPU
    - key: s1_node_3
      prompt: 'Bước 3: Phát hiện đợt release v2.4.1 vừa diễn ra 15 phút trước. Bạn
        kiểm tra Git Commit log và tìm thấy điều gì?'
      options:
      - key: s1_n3_o1
        label: So sánh diff commit v2.4.1 và v2.4.0 ở module PaymentConfigRepository
      - key: s1_n3_o2
        label: Xóa sạch toàn bộ Cache Keys trên Redis cluster
      - key: s1_n3_o3
        label: Scale out thêm 10 Pods cho Application Deployment
    - key: s1_node_4
      prompt: 'Bước 4: Commit v2.4.1 đã xóa annotation @Cacheable ở hàm getPaymentConfig()
        và khởi tạo Jedis manual mà quên đóng connection. Bạn chọn phương án xử lý
        nhanh nhất nào?'
      options:
      - key: s1_n4_o1
        label: Thực hiện Rollback Kubernetes Deployment về image version v2.4.0
      - key: s1_n4_o2
        label: Sửa code trực tiếp trên container và commit hotfix image mới
      - key: s1_n4_o3
        label: Tăng Instance Size cho Database Master từ 16 vCPU lên 64 vCPU
    - key: s1_node_5
      prompt: 'Bước 5: Bạn đã trigger Rollback về v2.4.0. Các Pods đang trong quá
        trình Rolling Update. Bạn sẽ hành động thế nào trong lúc đợi?'
      options:
      - key: s1_n5_o1
        label: Theo dõi tiến trình Pod Rollout và chỉ số Redis Active Connections
      - key: s1_n5_o2
        label: Dùng lệnh kubectl delete pod --force để xóa tất cả pod v2.4.1 cùng
          lúc
      - key: s1_n5_o3
        label: Tắt Ingress Controller để chặn toàn bộ traffic người dùng
    - key: s1_node_6
      prompt: 'Bước 6: Pods v2.4.0 đã READY 100%. Redis Connection giảm mạnh nhưng
        DB CPU vẫn ở mức 85% do Cache bị lạnh (Cache Stampede). Bạn giải quyết thế
        nào?'
      options:
      - key: s1_n6_o1
        label: Kích hoạt script Cache Warmup cho các Config Keys phổ biến
      - key: s1_n6_o2
        label: Restart server Database Master
      - key: s1_n6_o3
        label: Tiếp tục đợi DB tự hạ nhiệt mà không làm gì thêm
    - key: s1_node_7
      prompt: 'Bước 7: DB CPU đã giảm xuống 12%, Latency giảm về 45ms. Bạn cần thực
        hiện bước kiểm tra nào để đảm bảo hệ thống đã ổn định hoàn toàn?'
      options:
      - key: s1_n7_o1
        label: Chạy E2E Synthetic Test Suite kiểm tra luồng thanh toán thành công
      - key: s1_n7_o2
        label: Xem log trong 30 giây rồi thông báo cho khách hàng sự cố đã xong
      - key: s1_n7_o3
        label: Deploy ngay phiên bản v2.4.2 chứa sửa lỗi Jedis connection
    - key: s1_node_8
      prompt: 'Bước 8: Test suite E2E đã pass 100%. Hệ thống hoạt động trơn tru. Bước
        cuối cùng trong quy trình xử lý sự cố là gì?'
      options:
      - key: s1_n8_o1
        label: Cập nhật Ticket sự cố, khóa phiên bản v2.4.1 và lên lịch họp Post-mortem
      - key: s1_n8_o2
        label: Xóa toàn bộ log sự cố trên ElasticSearch để tiết kiệm dung lượng
      - key: s1_n8_o3
        label: Tăng max connection Redis lên vô hạn để tránh lặp lại sự cố
    - key: s1_recovery
      prompt: Sự cố Cổng thanh toán đã được khắc phục hoàn toàn! Latency quay về 40ms,
        tỷ lệ lỗi 0%.
      options: []
