  difficulty: medium
- content:
    scenario: Hệ thống xử lý thông báo đơn hàng (order-worker) bị tích tụ Kafka Consumer
      Lag lên tới 500,000 messages. Email và SMS xác nhận đơn hàng bị trễ hơn 45 phút.
    initial_logs: "[WARN] 2023-10-24 09:15:00 [kafka-listener-2] c.e.o.w.NotificationConsumer:
      Consumer poll timeout. Heartbeat failed. Rebalancing group 'order-notification-group'.
      Reason: max.poll.interval.ms exceeded (300000ms)."
    nodes:
    - key: s2_n1
      prompt: Log cho thấy Kafka Consumer Group liên tục bị Rebalance do vi phạm max.poll.interval.ms.
        Bạn sẽ thực hiện bước nào trước?
      options:
      - key: s2_n1_o1
        label: Trích xuất Thread Dump và log chi tiết của order-worker để kiểm tra
          tiến trình đang dừng ở đâu.
      - key: s2_n1_o2
        label: Tăng tham số max.poll.interval.ms trong cấu hình từ 5 phút lên 1 tiếng.
      - key: s2_n1_o3
        label: Xóa toàn bộ tin nhắn trong Kafka Topic order-created để dọn dẹp hàng
          chờ.
    - key: s2_n2
      prompt: Thread Dump cho thấy 80% thread worker đang ở trạng thái WAITING tại
        hàm SmsGatewayClient.sendSms() kết nối đến bên thứ ba (Vendor SMS).
      options:
      - key: s2_n2_o1
        label: Kiểm tra chỉ số latency và cấu hình connection/read timeout của HTTP
          Client gọi sang Vendor SMS.
      - key: s2_n2_o2
        label: Khởi động lại toàn bộ Kafka Cluster.
      - key: s2_n2_o3
        label: Tăng dung lượng RAM cấp cho từng Pod order-worker.
    - key: s2_n3
      prompt: Phân tích cho thấy Vendor SMS gặp sự cố mạng khiến request bị treo vô
        thời hạn do HTTP Client chưa cấu hình Read Timeout. Cách cách ly tạm thời
        nghẽn dòng?
      options:
      - key: s2_n3_o1
        label: Bật Feature Flag chuyển chế độ Circuit Breaker / Fallback sang kênh
          Email dự phòng.
      - key: s2_n3_o2
        label: Tăng số lần thử lại (retry count) khi gọi SMS lên 100 lần.
      - key: s2_n3_o3
        label: Catch toàn bộ Exception và bỏ qua không ghi nhận log nữa.
    - key: s2_n4
      prompt: Sau khi bật Fallback, các thread không còn bị treo. Tuy nhiên Consumer
        Lag vẫn đọng 500,000 messages. Làm thế nào để giảm lag nhanh nhất?
      options:
      - key: s2_n4_o1
        label: Kiểm tra số lượng Partition hiện tại của Topic và đánh giá khả năng
          scale ngang (Horizontal Scale) Pod.
      - key: s2_n4_o2
        label: Thực hiện seek offset tiến tới tin nhắn mới nhất (latest offset) để
          bỏ qua tin nhắn cũ.
      - key: s2_n4_o3
        label: Đổi tên Kafka Topic mới để ứng dụng nhận dữ liệu từ đầu.
    - key: s2_n5
      prompt: 'Topic order-created hiện chỉ có 6 Partitions nhưng bạn nâng Pod từ
