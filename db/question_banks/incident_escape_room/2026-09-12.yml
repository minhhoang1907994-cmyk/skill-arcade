  difficulty: medium
- content:
    scenario: Dịch vụ thanh toán (payment-service) liên tục trả về lỗi HTTP 504 Gateway
      Timeout sau bản phát hành v2.4.1 lúc 14:00. Khách hàng không thể hoàn tất đơn
      đặt hàng trên website.
    initial_logs: "[ERROR] 2023-10-24 14:05:12 [http-nio-8080-exec-45] c.e.p.c.PaymentController:
      Timeout waiting for connection from pool. Active connections: 100/100, Idle:
      0, Waiting threads: 450."
    nodes:
    - key: s1_n1
      prompt: Log ứng dụng ghi nhận cạn kiệt connection pool (100/100 active). Bước
        kiểm tra ban đầu nào là phù hợp nhất?
      options:
      - key: s1_n1_o1
        label: Kiểm tra chỉ số Database Metrics (Active Queries, CPU, Locks, Connections).
      - key: s1_n1_o2
        label: Tăng quy mô (Scale up) số lượng Pod dịch vụ payment-service từ 5 lên
          20.
      - key: s1_n1_o3
        label: Thực hiện Revert phiên bản deploy v2.4.1 về v2.4.0 ngay lập tức mà
          không phân tích.
    - key: s1_n2
      prompt: Metric PostgreSQL cho thấy số lượng Active Connections chạm ngưỡng max_connections
        (200) và CPU của Database ở mức 98%. Bạn thực hiện truy vấn gì tiếp theo?
      options:
      - key: s1_n2_o1
        label: Truy vấn pg_stat_activity để tìm các câu lệnh SQL đang chạy lâu (long-running
          queries).
      - key: s1_n2_o2
        label: Tăng max_connections của PostgreSQL lên 500 và khởi động lại Database
          Server.
      - key: s1_n2_o3
        label: Tắt các dịch vụ chạy ngầm như Report-Service để giải phóng tài nguyên.
    - key: s1_n3
      prompt: 'Kết quả pg_stat_activity xuất hiện hàng trăm query: `SELECT * FROM
        orders WHERE status = ''PENDING'' AND created_at >= ...` ở trạng thái active
        trên 30 giây. Bạn xử lý thế nào?'
      options:
      - key: s1_n3_o1
        label: Chạy EXPLAIN ANALYZE trên câu truy vấn orders để kiểm tra kế hoạch
          thực thi.
      - key: s1_n3_o2
        label: Thực hiện DELETE bớt các bản ghi cũ trong bảng orders để giảm dung
          lượng.
      - key: s1_n3_o3
        label: Thêm điều kiện LIMIT 10 vào mã nguồn và thực hiện deploy bản hotfix.
    - key: s1_n4
      prompt: Kết quả EXPLAIN ANALYZE báo 'Seq Scan on orders' với cost rất lớn do
        hai cột status và created_at thiếu Index. Giải pháp khắc phục trên production
        là gì?
      options:
      - key: s1_n4_o1
        label: Tạo index bằng lệnh CREATE INDEX CONCURRENTLY idx_orders_status_created
          trên Database.
      - key: s1_n4_o2
        label: Tạo index bằng lệnh CREATE INDEX idx_orders_status_created tiêu chuẩn.
      - key: s1_n4_o3
        label: Thay đổi kiểu dữ liệu của cột status từ VARCHAR sang INTEGER.
    - key: s1_n5
      prompt: Index đang được tạo ẩn dưới nền, tuy nhiên các kết nối cũ vẫn đang bị
        treo làm nghẽn kết nối DB. Làm sao giải phóng ngay?
      options:
      - key: s1_n5_o1
        label: Dùng pg_terminate_backend() để hủy các tiến trình bị treo hơn 30 giây.
      - key: s1_n5_o2
        label: Khởi động lại cứng (Hard reboot) máy chủ Database.
      - key: s1_n5_o3
        label: Chờ 15 phút để các transaction tự động hết thời gian chờ (timeout).
    - key: s1_n6
      prompt: Sau khi hủy các query rác và Index tạo xong, Latency của DB giảm từ
        30s xuống 5ms. Bạn cần xác nhận điều gì tại app server?
      options:
      - key: s1_n6_o1
        label: Kiểm tra log payment-service xem HikariCP connection pool đã hồi phục
          về mức bình thường chưa.
      - key: s1_n6_o2
        label: Tiếp tục nâng cấu hình CPU cho App Server.
      - key: s1_n6_o3
        label: Xóa bộ nhớ đệm (Flush All) trên Redis Cache.
    - key: s1_n7
      prompt: Log payment-service ghi nhận connection pool đã nhả toàn bộ thread chờ,
        tỷ lệ lỗi HTTP 504 hạ xuống 0%. Hành động tiếp theo?
      options:
      - key: s1_n7_o1
        label: Thực hiện giao dịch kiểm thử (Smoke test) luồng thanh toán end-to-end
          trên môi trường live.
      - key: s1_n7_o2
        label: Đóng sự cố và kết thúc công việc ngay mà không cần kiểm thử thêm.
      - key: s1_n7_o3
        label: Khởi động lại toàn bộ pod một lần nữa cho đảm bảo.
    - key: s1_n8
      prompt: Giao dịch test thành công, hệ thống hoạt động ổn định. Bước cuối cùng
        để kết thúc quy trình sự cố là gì?
      options:
      - key: s1_n8_o1
        label: Viết tài liệu Post-mortem, ghi nhận bài học và bổ sung linter check
          Index cho DB Migration trong CI/CD.
      - key: s1_n8_o2
        label: Gửi email phê bình nhóm phát triển vì bỏ sót Index khi release.
      - key: s1_n8_o3
        label: Gỡ bỏ quy trình kiểm duyệt DB Migration để lần sau deploy nhanh hơn.
