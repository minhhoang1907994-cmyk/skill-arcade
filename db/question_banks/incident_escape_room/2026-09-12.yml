- content:
    scenario: Dịch vụ xử lý sự kiện thanh toán Payment Consumer bị tắc nghẽn nghiêm
      trọng. Consumer Lag trên Kafka topic payment-events tăng vọt lên 500,000 tin
      nhắn, các Pod liên tục rơi vào trạng thái CrashLoopBackOff.
    initial_logs: |-
      kubectl get pods -n payment
      NAME                                  READY   STATUS             RESTARTS   AGE
      payment-consumer-7d4b8f5649-x2zp9     0/1     CrashLoopBackOff   8          12m
      payment-consumer-7d4b8f5649-m9k8l     0/1     CrashLoopBackOff   8          12m

      kubectl logs payment-consumer-7d4b8f5649-x2zp9
      [FATAL] java.lang.OutOfMemoryError: Java heap space
      at com.payment.service.PayloadParser.parse(PayloadParser.java:42)
      at com.payment.listener.KafkaPaymentListener.onMessage(KafkaPaymentListener.java:18)
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: Pod Payment Consumer bị CrashLoopBackOff liên tục do OOM. Bạn
        kiểm tra bước nào để xác định nguyên nhân?'
      options:
      - key: q2_opt_1a
        label: Dùng kubectl describe pod và inspect logs chi tiết tại thời điểm crash.
      - key: q2_opt_1b
        label: Xóa ngay Kafka topic payment-events để xả toàn bộ queue.
      - key: q2_opt_1c
        label: Scale ngay số lượng pod consumer từ 3 lên 30 pods.
    - key: q2_opt_2a
      prompt: 'Bước 2: Log chỉ ra OutOfMemoryError xảy ra ngay khi đọc record tại
        offset 894102. Bạn làm gì để điều tra bản tin này?'
      options:
      - key: q2_opt_2a
        label: Dùng Kafka CLI (kafka-console-consumer) peek nội dung message tại offset
          894102.
      - key: q2_opt_2b
        label: Xóa toàn bộ Consumer Group Metadata trên Kafka Cluster.
      - key: q2_opt_2c
        label: Tăng giới hạn Java Heap Memory (-Xmx) từ 2GB lên 8GB trên Deployment.
    - key: q2_opt_3a
      prompt: 'Bước 3: Phát hiện message tại offset 894102 chứa file đính kèm base64
        dung lượng 150MB (Poison Pill). Giải pháp lâu dài để xử lý loại message này
        là gì?'
      options:
      - key: q2_opt_3a
        label: Bổ sung validate kích thước payload và cơ chế Dead Letter Queue (DLQ)
          cho malformed message.
      - key: q2_opt_3b
        label: Bỏ qua Kafka và chuyển sang cho API client ghi thẳng vào Database.
      - key: q2_opt_3c
        label: Tắt tính năng parse JSON trong ứng dụng consumer.
    - key: q2_opt_4a
      prompt: 'Bước 4: Bạn đã chuẩn bị Hotfix có kiểm tra size > 5MB sẽ chuyển sang
        topic payment-events-dlq. Làm sao để đẩy Hotfix lên an toàn mà ngắt được vòng
        lặp CrashLoopBackOff hiện tại?'
      options:
      - key: q2_opt_4a
        label: Deploy Hotfix mới, ứng dụng sẽ tự động bắt ngoại lệ và đẩy Poison Pill
          sang DLQ.
      - key: q2_opt_4b
        label: Xóa thủ công partition chứa offset bị lỗi trên Kafka broker.
      - key: q2_opt_4c
        label: Reset offset của Consumer Group về EARLIEST.
    - key: q2_opt_5a
      prompt: 'Bước 5: Hotfix đã lên, pod đã Running, Poison Pill đã đẩy sang DLQ.
        Tuy nhiên Consumer Lag vẫn ở mức 500,000 do tốc độ xử lý của 3 pod quá chậm.
        Bạn tăng tốc xử lý bằng cách nào?'
      options:
      - key: q2_opt_5a
        label: Tăng số lượng Partition của Topic và tăng số lượng Pod Consumer tương
          ứng.
      - key: q2_opt_5b
        label: Giảm poll.interval.ms xuống 1ms để ép consumer đọc liên tục không nghỉ.
      - key: q2_opt_5c
        label: Giữ nguyên cấu hình và chờ đợi tiêu thụ hết 500,000 tin nhắn.
    - key: q2_opt_6a
      prompt: 'Bước 6: Khi tăng scale consumer pods, dịch vụ nhận Webhook đối tác
        phía hạ nguồn bị quá tải và trả về HTTP 429 Too Many Requests. Bạn xử lý sao?'
      options:
      - key: q2_opt_6a
        label: Áp dụng Rate Limiter và Exponential Backoff trong Consumer khi gọi
          dịch vụ đối tác.
      - key: q2_opt_6b
        label: Tắt hoàn toàn việc gọi Webhook đối tác để xả lag nhanh nhất.
      - key: q2_opt_6c
        label: Scale down số lượng pod Consumer về lại 1 pod.
    - key: q2_opt_7a
      prompt: 'Bước 7: Consumer Lag đã giảm về 0, hệ thống tiêu thụ tin nhắn theo
        real-time. Bạn xử lý các tin nhắn Poison Pill bị đẩy vào DLQ ở Bước 4 như
        thế nào?'
      options:
      - key: q2_opt_7a
        label: Viết script bóc tách loại bỏ attachment 150MB và replay lại payload
          sạch vào main topic.
      - key: q2_opt_7b
        label: Xóa thẳng topic DLQ để giải phóng dung lượng đĩa.
      - key: q2_opt_7c
        label: Bỏ qua các tin nhắn trong DLQ không bao giờ xử lý lại.
    - key: q2_opt_8a
      prompt: 'Bước 8: Toàn bộ dữ liệu DLQ đã được bù trừ thành công, không mất mát
        giao dịch nào. Hành động cuối cùng để hoàn tất là gì?'
      options:
      - key: q2_opt_8a
        label: Bổ sung cảnh báo kích thước message lớn tại API Gateway và hoàn thiện
          tài liệu Post-Mortem.
      - key: q2_opt_8b
        label: Gỡ bỏ hoàn toàn giới hạn Heap Memory trên Kubernetes Deployment.
      - key: q2_opt_8c
        label: Tắt metric theo dõi Kafka Consumer Lag.
