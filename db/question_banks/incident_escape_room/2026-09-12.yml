  difficulty: hard
- content:
    scenario: Dịch vụ xử lý đơn hàng `order-service` liên tục gặp sự cố sập Pod (CrashLoopBackOff)
      trên Kubernetes production. Hệ thống cảnh báo nhận được thông báo lỗi OOMKilled
      (Out of Memory) trên các Pod này ngay khi chiến dịch khuyến mãi mới ra mắt.
    initial_logs: |-
      State: Waiting
        Reason: CrashLoopBackOff
      Last State: Terminated
        Reason: OOMKilled
        Exit Code: 137
        Started: Tue, 24 Oct 2023 15:10:00 +0700
        Finished: Tue, 24 Oct 2023 15:12:30 +0700
      Events:
        Type     Reason     Age                From               Message
        Warning  OOMKilled  2m (x3 over 5m)   kubelet            Memory cgroup out of memory: Kill process 18402 (java) total-vm:4218204kB, anon-rss:2097152kB
    nodes:
    - key: q2_n1
      prompt: Pod `order-service` bị kill liên tục bởi OOMKilled (Exit code 137).
        Bạn ưu tiên kiểm tra dữ liệu nào đầu tiên?
      options:
      - key: q2_n1_o1
        label: Tạo heap dump / phân tích JVM Heap Memory metrics trên Prometheus &
          Grafana.
      - key: q2_n1_o2
        label: Tăng giới hạn Memory limit trong K8s Deployment manifest từ 2GB lên
          8GB.
      - key: q2_n1_o3
        label: Kiểm tra băng thông mạng (Network I/O) của Pod.
    - key: q2_n2
      prompt: Heap metrics chỉ ra bộ nhớ `Old Gen` tăng liên tục lên 99% mà Garbage
        Collector (GC) không thể dọn dẹp. Điều này khẳng định hiện tượng gì?
      options:
      - key: q2_n2_o1
        label: Xảy ra Memory Leak hoặc có các đối tượng dung lượng cực lớn bị giữ
          tham chiếu quá lâu.
      - key: q2_n2_o2
        label: Do CPU không đủ mạnh để chạy Garbage Collector.
      - key: q2_n2_o3
        label: Do dung lượng đĩa cứng (Disk Storage) của Pod đã bị đầy.
    - key: q2_n3
      prompt: Phân tích Heap Dump file (dùng Eclipse MAT / VisualVM) cho thấy hàng
        ngàn instance của `byte[]` lưu trong Redis In-Memory Cache `PromoCodeCache`.
        Nguyên nhân từ đâu?
      options:
      - key: q2_n3_o1
        label: Code đang cache toàn bộ danh sách mã giảm giá kèm thông tin chi tiết
          của tất cả người dùng vào 1 key duy nhất không có TTL.
      - key: q2_n3_o2
        label: Do thư viện Redis Driver (Lettuce/Jedis) bị lỗi tràn bộ nhớ native.
      - key: q2_n3_o3
        label: Do Redis Server bị treo nên Java Client phải lưu tạm dữ liệu vào RAM.
    - key: q2_n4
      prompt: Bạn tra cứu source code và thấy API áp dụng voucher `/api/v2/promotions/apply`
        tải bản ghi 150MB dữ liệu JSON từ Redis và parse vào RAM mỗi khi có 1 request
        gọi tới. Giải pháp kiến trúc nào đúng nhất?
      options:
      - key: q2_n4_o1
        label: 'Thay đổi cấu trúc Cache: chia nhỏ key theo `promo_code_id` và áp dụng
          thời gian hết hạn (TTL).'
      - key: q2_n4_o2
        label: Tắt hoàn toàn việc sử dụng Redis Cache và đọc trực tiếp từ Database.
      - key: q2_n4_o3
        label: Sử dụng GZIP nén chuỗi JSON 150MB lại trước khi lưu vào RAM.
    - key: q2_n5
      prompt: Trong khi chờ đợi phát triển Hotfix code, bạn cần hành động khẩn cấp
        để chặn hiện tượng sập Pod diễn ra liên tục.
      options:
      - key: q2_n5_o1
        label: Áp dụng Rate Limiting trên API Gateway đối với endpoint `/api/v2/promotions/apply`
          và tạm thời xóa key cache khổng lồ.
      - key: q2_n5_o2
        label: Khởi động lại toàn bộ cụm Redis Cluster.
      - key: q2_n5_o3
        label: Tắt kiểm tra sức khỏe Liveness Probe của Pod trong Kubernetes.
    - key: q2_n6
      prompt: Sau khi áp dụng Rate Limit tạm thời, bạn tiếp tục thực hiện đưa bản
        sửa lỗi (Hotfix code chia nhỏ cache key) lên môi trường Production. Các bước
        nào là tối ưu?
      options:
      - key: q2_n6_o1
        label: Build Docker image mới với code tối ưu, qua kiểm thử Canary deployment
          10% traffic trước khi rollout 100%.
      - key: q2_n6_o2
        label: Deploy trực tiếp 100% Pod cùng lúc vào giờ cao điểm.
      - key: q2_n6_o3
        label: Tắt toàn bộ hệ thống trong 15 phút để bảo trì và deploy.
    - key: q2_n7
      prompt: Hotfix đã triển khai xong. Bạn tiến hành quan sát đồ thị Memory Usage
        và chỉ số Garbage Collection (GC Pause time). Chỉ số nào chứng tỏ sự cố đã
        giải quyết?
      options:
      - key: q2_n7_o1
        label: Heap Memory duy trì ở mức ổn định (ví dụ 45%), đồ thị có hình răng
          cưa đều đặn (GC hoạt động hiệu quả) và không còn Pod bị OOMKilled.
      - key: q2_n7_o2
        label: Memory Usage đứng yên 100% nhưng Pod không bị restart.
      - key: q2_n7_o3
        label: Số lượng HTTP Request gửi lên API bằng 0.
    - key: q2_n8
      prompt: Hệ thống `order-service` đã hoạt động mượt mà và không còn hiện tượng
        tràn bộ nhớ. Bước kết thúc quy trình xử lý sự cố là gì?
      options:
      - key: q2_n8_o1
        label: Bỏ áp dụng Rate Limit tạm thời, hoàn thiện tài liệu Post-Mortem và
          thêm cảnh báo Heap Memory (>80%) vào Alertmanager.
      - key: q2_n8_o2
        label: Giữ nguyên Rate Limit tạm thời mãi mãi.
      - key: q2_n8_o3
        label: Xóa toàn bộ các dashboard theo dõi JVM trên Grafana.
  answer_key:
    option_effects:
      q2_n1_o1:
