  difficulty: medium
- content:
    scenario: Hệ thống xử lý đơn hàng tập trung Order Processing Worker bị sập liên
      tục do OOMKilled trên Kubernetes Cluster. Kafka Topic 'order-processing' đang
      bị dồn ứ hơn 1.4 triệu message.
    initial_logs: "[FATAL] Kubelet: Container order-worker-7f9b8c6d4 was OOMKilled
      (exit code 137) | Kafka Lag: topic=order-processing group=order-workers lag=1420000
      | Prometheus: Pod Memory 1.98GB/2.0GB limit reached"
    nodes:
    - key: s2_node_1
      prompt: 'Bước 1: Worker pod liên tục bị OOMKilled làm Kafka lag dồn ứ cực lớn.
        Bạn ưu tiên thực hiện thao tác chẩn đoán nào?'
      options:
      - key: s2_n1_o1
        label: Trích xuất Heap Dump và kiểm tra biểu đồ Garbage Collection (GC) log
      - key: s2_n1_o2
        label: Tăng Memory Limit của Worker Container từ 2GB lên 8GB lập tức
      - key: s2_n1_o3
        label: Scale số lượng Replica của Worker Pods từ 3 lên 30 pods
    - key: s2_node_2
      prompt: 'Bước 2: Heap dump chỉ ra đối tượng com.store.order.dto.OrderContext
        chiếm 85% bộ nhớ với 4.8 triệu instances. Bước tiếp theo là gì?'
      options:
      - key: s2_n2_o1
        label: Trace code reference để xem đối tượng OrderContext đang bị giữ bởi
          static object nào
      - key: s2_n2_o2
        label: Thực hiện Restart lại toàn bộ Kafka Cluster
      - key: s2_n2_o3
        label: Xóa sạch message dồn ứ trong Kafka topic order-processing
    - key: s2_node_3
      prompt: 'Bước 3: Phát hiện OrderAnalyticsInterceptor lưu OrderContext vào một
        static List không có cơ chế eviction. Làm sao để chặn rò rỉ RAM ngay trên
        Prod?'
      options:
      - key: s2_n3_o1
        label: Cập nhật ConfigMap đặt ENABLE_ANALYTICS_INTERCEPTOR=false
      - key: s2_n3_o2
        label: Viết hotfix đổi static List thành ConcurrentHashMap trên Staging rồi
          chờ CI/CD build
      - key: s2_n3_o3
        label: Tắt hoàn toàn Kubernetes Cluster để xả RAM
    - key: s2_node_4
      prompt: 'Bước 4: Đã cập nhật ConfigMap ENABLE_ANALYTICS_INTERCEPTOR=false. Làm
        thế nào để áp dụng cấu hình này an toàn cho Worker Pods?'
      options:
      - key: s2_n4_o1
        label: Thực hiện Rolling Restart cho Order Worker Deployment
      - key: s2_n4_o2
        label: Xóa Deployment và tạo lại Deployment mới hoàn toàn
      - key: s2_n4_o3
        label: Scale số lượng Replicas về 0 rồi chờ 10 phút mới scale lên lại
    - key: s2_node_5
      prompt: 'Bước 5: Pods mới đã ổn định không còn bị OOM. Tuy nhiên 1.4 triệu Kafka
        message tồn đọng xử lý rất chậm (500 msg/sec). Bạn chọn cách nào để giải tỏa
        lag?'
      options:
      - key: s2_n5_o1
        label: Tăng số lượng Kafka Partitions và scale số Worker Pods tương ứng
      - key: s2_n5_o2
        label: Tăng max.poll.records của Consumer lên 50,000
      - key: s2_n5_o3
        label: Bỏ qua các message cũ bằng cách reset consumer offset về LATEST
    - key: s2_node_6
      prompt: 'Bước 6: Topic được tăng lên 32 partitions và worker scaled lên 32 pods.
        Tốc độ xử lý tăng lên 18,000 msg/sec. Bạn cần chú ý chỉ số hạ tầng nào?'
      options:
      - key: s2_n6_o1
        label: Giám sát DB Write IOPS và Latency của Order Database
      - key: s2_n6_o2
        label: Tắt toàn bộ log của Worker Pods để tăng tốc độ ghi disk
      - key: s2_n6_o3
        label: Tạm dừng Consumer dịch vụ Kho hàng (Inventory Service)
    - key: s2_node_7
      prompt: 'Bước 7: Kafka Lag đã giảm về 0 sau 12 phút. Đơn hàng dồn ứ đã được
        tiêu thụ hết. Bạn thực hiện kiểm tra đối soát dữ liệu thế nào?'
      options:
      - key: s2_n7_o1
        label: Chạy Job Reconciliation đối soát dữ liệu đơn hàng giữa Kafka offset
          và Database
      - key: s2_n7_o2
        label: Đóng ngay sự cố trên hệ thống PagerDuty
      - key: s2_n7_o3
        label: Bật lại Feature Flag ENABLE_ANALYTICS_INTERCEPTOR ngay lập tức
    - key: s2_node_8
      prompt: 'Bước 8: Kết quả đối soát ghi nhận 100% đơn hàng khớp dữ liệu. Bước
        tiếp theo để xử lý dứt điểm nguyên nhân gốc rễ (Root Cause)?'
      options:
      - key: s2_n8_o1
        label: Tạo Pull Request sửa code Interceptor dùng EvictingQueue/LRUCache,
          kèm Unit Test kiểm tra memory leak
      - key: s2_n8_o2
        label: Giữ nguyên ENABLE_ANALYTICS_INTERCEPTOR=false vĩnh viễn và không sửa
          code
      - key: s2_n8_o3
        label: Cấu hình CronJob tự động restart Worker Pods mỗi 2 tiếng
    - key: s2_recovery
      prompt: Sự cố OOM Worker và Kafka Lag đã xử lý thành công! Hệ thống tiêu thụ
        message mượt mà, bộ nhớ RAM duy trì ổn định ở mốc 35%.
      options: []
  answer_key:
