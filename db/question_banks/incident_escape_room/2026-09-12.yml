- content:
    scenario: Hệ thống thanh toán mua hàng /api/v1/checkout liên tục phản hồi 504
      Gateway Timeout vào giờ cao điểm. Lượng đơn hàng bị kẹt tăng đột biến.
    initial_logs: |-
      HTTP/1.1 504 Gateway Timeout
      [ERROR] upstream timed out (110: Connection timed out) while reading response header from upstream, client: 10.0.4.12, server: api.shop.com, request: 'POST /api/v1/checkout HTTP/1.1'
      APM Metric: Redis connection pool utilization: 100% (10000/10000 active connections).
    nodes:
    - key: q1_n1
      prompt: 'Bước 1: Hệ thống phát cảnh báo 504 Gateway Timeout hàng loạt tại API
        Gateway. Bạn sẽ kiểm tra điều gì đầu tiên?'
      options:
      - key: q1_opt_1a
        label: Xem APM Traces để phân tích đường đi của request và điểm bị nghẽn.
      - key: q1_opt_1b
        label: Khởi động lại ngay lập tức toàn bộ các pod của API Gateway.
      - key: q1_opt_1c
        label: Thực hiện Nâng cấp (Scale UP) tài nguyên CPU/RAM cho Database chính.
    - key: q1_n2
      prompt: 'Bước 2: APM Traces cho thấy 95% thời gian request dừng ở việc chờ lấy
        Connection từ Redis Pool. Bạn xử lý như thế nào?'
      options:
      - key: q1_opt_2a
        label: Kiểm tra Redis metrics (Slowlog, active connections, CPU utilization)
          trên Redis Cluster.
      - key: q1_opt_2b
        label: Chạy lệnh FLUSHALL trên Redis để xóa toàn bộ cache giải phóng bộ nhớ.
      - key: q1_opt_2c
        label: Tăng max_connections trong connection pool của ứng dụng lên gấp đôi.
    - key: q1_n3
      prompt: 'Bước 3: Redis Metrics cho thấy kết nối bị max 10,000 conns. Slowlog
        xuất hiện nhiều lệnh GET key ''cart:promotion_*'' cùng hết hạn một lúc. Bạn
        chẩn đoán nguyên nhân là gì?'
      options:
      - key: q1_opt_3a
        label: Hiện tượng Cache Stampede (Dogpiling) do nhiều key cache lớn hết hạn
          đồng thời.
      - key: q1_opt_3b
        label: Khởi động lại Redis Cluster để xóa toàn bộ các kết nối treo.
      - key: q1_opt_3c
        label: Chặn IP của các khách hàng truy cập vào trang giỏ hàng.
    - key: q1_n4
      prompt: 'Bước 4: Xác định mã nguồn đặt TTL cố định 1 giờ không có Jitter làm
        hàng ngàn request cùng lúc chọc thẳng xuống DB khi cache miss. Bạn đưa ra
        giải pháp sửa lỗi ngắn hạn nào?'
      options:
      - key: q1_opt_4a
        label: Tạo Hotfix thêm Random Jitter vào TTL và áp dụng Mutex Lock/Singleflight
          khi load cache.
      - key: q1_opt_4b
        label: Tắt hoàn toàn cơ chế Cache trên ứng dụng và đọc trực tiếp từ DB.
      - key: q1_opt_4c
        label: Tăng TTL từ 1 giờ lên 24 giờ mà không thêm Jitter.
    - key: q1_n5
      prompt: 'Bước 5: Bản Hotfix chứa Random Jitter + Mutex Lock đã được build image
        thành công. Bạn triển khai bản vá này như thế nào?'
      options:
      - key: q1_opt_5a
        label: Triển khai dạng Canary Deployment trên 10% số pod và theo dõi chỉ số
          latency/DB load.
      - key: q1_opt_5b
        label: SSH trực tiếp vào pod production để sửa trực tiếp file code.
      - key: q1_opt_5c
        label: Deploy đồng loạt 100% tất cả các pod cùng một lúc trong giờ cao điểm.
    - key: q1_n6
      prompt: 'Bước 6: Pod Canary hoạt động tốt, latency giảm từ 8s xuống 100ms, tỷ
        lệ cache hit tăng lại. Bước tiếp theo là gì?'
      options:
      - key: q1_opt_6a
        label: Mở rộng bản Hotfix ra 100% các pod còn lại theo chiến lược Rolling
          Update.
      - key: q1_opt_6b
        label: Hủy bỏ pod Canary và quay về phiên bản cũ.
      - key: q1_opt_6c
        label: Giữ nguyên Canary 10% và chờ 2 tiếng sau mới đưa ra quyết định.
    - key: q1_n7
      prompt: 'Bước 7: 100% pod mới đã chạy. Tuy nhiên một số pod cũ đang drain kết
        nối chậm làm Redis connections giải phóng chưa triệt để. Bạn làm gì?'
      options:
      - key: q1_opt_7a
        label: Thực hiện Graceful Termination cho các pod cũ và kiểm tra lại metrics
          kết nối Redis.
      - key: q1_opt_7b
        label: Kill hard service Database để buộc ngắt toàn bộ connection.
      - key: q1_opt_7c
        label: Reboot lại API Gateway thêm một lần nữa.
    - key: q1_n8
      prompt: 'Bước 8: Tất cả metrics đã ổn định (Latency 80ms, Redis conns < 500,
        DB CPU 15%). Bạn thực hiện bước cuối nào để kết thúc sự cố?'
      options:
      - key: q1_opt_8a
        label: Xác nhận khôi phục dịch vụ, đóng Incident và viết tài liệu Post-Mortem
          phòng tránh.
      - key: q1_opt_8b
        label: Tắt toàn bộ hệ thống cảnh báo PagerDuty để tránh bị làm phiền.
      - key: q1_opt_8c
        label: Bật lại bản build cũ để kiểm tra xem lỗi có xuất hiện lại hay không.
