- content:
    scenario: Toàn bộ microservices không thể truy cập bộ nhớ đệm Redis Cluster. Ứng
      dụng đồng loạt quá tải do traffic đổ trực tiếp xuống Database.
    initial_logs: |-
      2023-10-25 14:20:10.881 [WARN] [user-service] i.l.c.protocol.CommandHandler: Connection failure occurred. RedisException: Could not get a resource from the pool
      2023-10-25 14:20:11.002 [ERROR] [api-gateway] c.e.g.filter.AuthFilter: RedisCommandTimeoutException: Command timed out after 2000 millisecond(s)
    nodes:
    - key: node_r1_investigate
      prompt: 'Bước 1: Redis Cluster ngưng phản hồi khiến hệ thống quá tải. Bạn kiểm
        tra tình trạng Redis từ đâu?'
      options:
      - key: opt_r1_1
        label: Kiểm tra CPU, Memory, Network I/O và Redis Cluster Nodes Info qua CLI
          hoặc Grafana
      - key: opt_r1_2
        label: Xóa toàn bộ Cache trong Redis bằng FLUSHALL
      - key: opt_r1_3
        label: Restart tất cả các App Services đang gọi đến Redis
    - key: node_r2_metrics
      prompt: 'Bước 2: Metric cho thấy 1 Master node trong Redis Cluster bị vọt CPU
        lên 100%. Bước tiếp theo để phát hiện lệnh gây nghẽn?'
      options:
      - key: opt_r2_1
        label: Dùng lệnh `redis-cli --bigkeys` hoặc kiểm tra `SLOWLOG GET 10` trên
          node bị 100% CPU
      - key: opt_r2_2
        label: Chạy lệnh `KEYS *` để xem có bao nhiêu key trong Redis
      - key: opt_r2_3
        label: Tăng thêm 10 Slave nodes vào cluster ngay
    - key: node_r3_rootcause
      prompt: 'Bước 3: SLOWLOG chỉ ra lệnh `KEYS user:session:*` đang được gọi liên
        tục mỗi giây từ Auth Service. Bạn đánh giá thế nào?'
      options:
      - key: opt_r3_1
        label: Lệnh KEYS * là O(N), blocking single-thread của Redis, cực kỳ nguy
          hiểm trên Production
      - key: opt_r3_2
        label: Lệnh KEYS * hoàn toàn tối ưu và không ảnh hưởng hiệu năng
      - key: opt_r3_3
        label: Do Redis bị hỏng phần cứng chứ không liên quan đến lệnh KEYS
    - key: node_r4_stop_bad_call
      prompt: 'Bước 4: Làm thế nào để dừng khẩn cấp các request chạy lệnh `KEYS` vô
        tận này?'
      options:
      - key: opt_r4_1
        label: Bật Feature Flag tắt tính năng Auth Session Scan hoặc Rollback Auth
          Service về phiên bản cũ
      - key: opt_r4_2
        label: Tắt nguồn cluster Redis
      - key: opt_r4_3
        label: Xóa hết dữ liệu user session trong DB
    - key: node_r5_redis_recovery
      prompt: 'Bước 5: Sau khi ngắt nguồn gọi lỗi, Master node vẫn bị treo chưa thoát
        lệnh cũ. Làm sao giải phóng Redis Master?'
      options:
      - key: opt_r5_1
        label: Thực hiện `SCRIPT KILL` hoặc restart cụm pod của Master node bị treo
          để failover sang Replica
      - key: opt_r5_2
        label: Đợi 2 tiếng cho Redis tự hết treo
      - key: opt_r5_3
        label: Xóa cấu hình Cluster Config
    - key: node_r6_circuit_breaker
      prompt: 'Bước 6: Redis đã bình thường, nhưng App Services đang bị cạn DB Connection
        Pool do Cache Avalanche trước đó. Làm sao giảm tải cho DB?'
      options:
      - key: opt_r6_1
        label: Bật Circuit Breaker/Rate Limiting ở API Gateway để kiểm soát lưu lượng
          request nạp lại Cache
      - key: opt_r6_2
        label: Mở toàn bộ traffic cho người dùng vào tự do
      - key: opt_r6_3
        label: Tắt hoàn toàn Database để bảo vệ DB
    - key: node_r7_cluster_health
      prompt: 'Bước 7: Làm sao để chắc chắn Redis Cluster đã khỏe mạnh và dữ liệu
        không bị lệch?'
      options:
      - key: opt_r7_1
        label: Chạy `redis-cli cluster info` và kiểm tra tỉ lệ Cache Hit/Miss trên
          Grafana
      - key: opt_r7_2
        label: Nhìn đèn báo máy chủ trên server vật lý
      - key: opt_r7_3
        label: Chờ khách hàng phàn nàn nếu có lỗi
    - key: node_r8_prevention
      prompt: 'Bước 8: Hành động lâu dài nào giúp ngăn chặn sự cố tương tự xảy ra
        trong tương lai?'
      options:
      - key: opt_r8_1
        label: Thay `KEYS` bằng `SCAN`, disable các lệnh nguy hiểm bằng `rename-command`
          trong redis.conf
      - key: opt_r8_2
        label: Cấm sử dụng Redis trong toàn bộ công ty
      - key: opt_r8_3
        label: Chuyển toàn bộ dữ liệu Redis sang lưu file txt
    - key: node_r_resolved
      prompt: Sự cố Redis đã được khắc phục hoàn toàn. Hệ thống phục hồi.
      options:
      - key: opt_r_finish
        label: Hoàn tất
  answer_key:
    option_effects:
      opt_r1_1:
        points: 10
        minutes_cost: 1
        next_node: node_r2_metrics
        explanation: Chính xác. Quan sát metric giúp xác định node bị nghẽn và dấu
          hiệu CPU spiking.
      opt_r1_2:
        points: 0
        minutes_cost: 8
        next_node: node_r2_metrics
        explanation: FLUSHALL làm mất toàn bộ Cache, gây sập DB ngay lập tức do Cache
          Stampede.
      opt_r1_3:
        points: 5
        minutes_cost: 5
        next_node: node_r2_metrics
        explanation: Restart app không khắc phục được nguyên nhân Redis bị quá tải.
      opt_r2_1:
        points: 10
        minutes_cost: 1
        next_node: node_r3_rootcause
        explanation: Chuẩn xác. SLOWLOG là công cụ tuyệt vời để tìm ra lệnh Redis
          tốn nhiều thời gian.
      opt_r2_2:
        points: 0
        minutes_cost: 10
        next_node: node_r3_rootcause
        explanation: Chạy `KEYS *` trên prod đang bị tải cao sẽ làm Redis block hoàn
          toàn và sập tức thì.
      opt_r2_3:
        points: 5
        minutes_cost: 7
        next_node: node_r3_rootcause
        explanation: Thêm node tốn thời gian và không giải quyết được việc Single
          Master bị block bởi heavy query.
      opt_r3_1:
        points: 10
        minutes_cost: 1
        next_node: node_r4_stop_bad_call
        explanation: Hoàn toàn đúng. Redis là đơn luồng (single-threaded), lệnh KEYS
          làm block mọi request khác.
      opt_r3_2:
        points: 0
        minutes_cost: 5
        next_node: node_r4_stop_bad_call
        explanation: Đánh giá sai kiến thức cơ bản về Redis.
      opt_r3_3:
        points: 0
        minutes_cost: 6
        next_node: node_r4_stop_bad_call
        explanation: Đổ lỗi cho phần cứng khi log ghi rõ slow command là không đúng.
      opt_r4_1:
        points: 10
        minutes_cost: 2
        next_node: node_r5_redis_recovery
        explanation: 'Cách xử lý sự cố chuẩn: ngắt ngay nguồn phát sinh request độc
          hại.'
      opt_r4_2:
        points: 0
        minutes_cost: 8
        next_node: node_r5_redis_recovery
        explanation: Tắt nguồn gây mất dữ liệu in-memory và kéo dài thời gian khôi
          phục.
      opt_r4_3:
        points: 0
        minutes_cost: 12
        next_node: node_r5_redis_recovery
        explanation: Thảm họa! Xóa DB không giải quyết được vấn đề ở Redis.
      opt_r5_1:
        points: 10
        minutes_cost: 2
        next_node: node_r6_circuit_breaker
        explanation: Restart pod bị treo để K8s/Redis Cluster kích hoạt Failover đẩy
          Replica lên làm Master.
      opt_r5_2:
        points: 0
        minutes_cost: 15
        next_node: node_r6_circuit_breaker
        explanation: Ngồi chờ khiến Downtime kéo dài nghiêm trọng.
      opt_r5_3:
        points: 0
        minutes_cost: 10
        next_node: node_r6_circuit_breaker
        explanation: Xóa cluster config làm hỏng toàn bộ topology của Redis.
      opt_r6_1:
        points: 10
        minutes_cost: 2
        next_node: node_r7_cluster_health
        explanation: Dùng Rate Limiting/Circuit Breaker giúp Warm-up lại Cache mà
          không đè sập DB.
      opt_r6_2:
        points: 0
        minutes_cost: 8
        next_node: node_r7_cluster_health
        explanation: Mở tràn lan sẽ gây ra đợt nghẽn DB tiếp theo.
      opt_r6_3:
        points: 0
        minutes_cost: 5
        next_node: node_r7_cluster_health
        explanation: Tắt DB làm gián đoạn 100% dịch vụ hệ thống.
      opt_r7_1:
        points: 10
        minutes_cost: 1
        next_node: node_r8_prevention
        explanation: Kiểm tra cluster status và Cache hit rate giúp xác nhận hệ thống
          phục hồi thật sự.
      opt_r7_2:
        points: 0
        minutes_cost: 5
        next_node: node_r8_prevention
        explanation: Đèn máy chủ không phản ánh trạng thái logic của ứng dụng.
      opt_r7_3:
        points: 0
        minutes_cost: 5
        next_node: node_r8_prevention
        explanation: Bỏ mặc người dùng phát hiện lỗi là thái độ thiếu chuyên nghiệp.
      opt_r8_1:
        points: 10
        minutes_cost: 1
        next_node: node_r_resolved
        explanation: 'Giải pháp triệt để: Đổi sang SCAN và vô hiệu hóa các lệnh nguy
