        Bạn muốn làm gì trước tiên?
      options:
      - key: opt_1_1
        label: Kiểm tra tình trạng mạng outbound và thông số Circuit Breaker của dịch
          vụ thanh toán.
      - key: opt_1_2
        label: Restart ngay lập tức toàn bộ cluster của payment-service.
      - key: opt_1_3
        label: Tăng max connection pool trong DB từ 200 lên 500.
    - key: node_2
      prompt: Bạn phát hiện Gateway bên thứ ba đang bị nghẽn (latency > 10s) nhưng
        ứng dụng không có Circuit Breaker hoạt động, dẫn đến thread pool nội bộ bị
        chiếm dụng sạch. Bạn xử lý thế nào?
      options:
      - key: opt_2_1
        label: Bật tính năng Circuit Breaker/Fallback khẩn cấp trên API Gateway nội
          bộ để ngắt kết nối xấu.
      - key: opt_2_2
        label: Liên hệ với bên đối tác Payment Gateway và chờ họ giải quyết.
      - key: opt_2_3
        label: Tăng timeout từ 5s lên 30s để cho phép đợi giao dịch xử lý xong.
    - key: node_3
      prompt: Circuit Breaker đã được bật, ngắt các request treo đến Gateway lỗi.
        Tuy nhiên khách hàng vẫn cần thanh toán qua kênh dự phòng. Hành động tiếp
        theo?
      options:
      - key: opt_3_1
        label: Chuyển hướng luồng thanh toán (traffic routing) sang Payment Gateway
          dự phòng (Gateway B).
      - key: opt_3_2
        label: Gửi email thông báo toàn hệ thống bảo trì dịch vụ thanh toán.
      - key: opt_3_3
        label: Tắt toàn bộ dịch vụ checkout để tránh sinh ra thêm transaction bị treo.
    - key: node_4
      prompt: Traffic đã được điều hướng sang Gateway B. Các giao dịch mới đã chạy
        ổn định. Giờ bạn xử lý các giao dịch đang bị treo (Pending) ở Gateway A thế
        nào?
      options:
      - key: opt_4_1
        label: Chạy một Script Reconciliation để truy vấn trạng thái (Reconciliation
          API) các đơn pending.
      - key: opt_4_2
        label: Chuyển tất cả trạng thái đơn Pending thành Failed và hoàn tiền tự động
          ngay lập tức.
      - key: opt_4_3
        label: Đánh dấu tất cả đơn Pending là Success để khách hàng không phàn nàn.
    - key: node_5
      prompt: Kết quả truy vấn cho thấy có 150 giao dịch đã bị trừ tiền bên Gateway
        A nhưng hệ thống chưa ghi nhận Success. Bạn làm gì?
      options:
      - key: opt_5_1
        label: Cập nhật trạng thái đơn thành Success và kích hoạt webhook giao hàng
          cho các đơn này.
      - key: opt_5_2
        label: Không làm gì, chờ khách hàng gửi yêu cầu hỗ trợ mới xử lý thủ công.
      - key: opt_5_3
        label: Hủy toàn bộ 150 đơn hàng này trên DB nội bộ.
    - key: node_6
      prompt: Đối tác Gateway A thông báo hệ thống của họ đã khắc phục xong sự cố.
        Bạn kiểm tra lại thế nào trước khi mở lại Gateway A?
      options:
      - key: opt_6_1
        label: Chạy thử test case synthetic transaction (canary deployment) với lưu
          lượng nhỏ 5%.
      - key: opt_6_2
        label: Chuyển ngay 100% traffic trở lại Gateway A.
      - key: opt_6_3
        label: Giữ nguyên Gateway B vĩnh viễn không dùng lại Gateway A nữa.
    - key: node_7
      prompt: Thử nghiệm canary 5% hoạt động tốt, latency bình thường. Bạn quyết định
        khôi phục hệ thống ra sao?
      options:
      - key: opt_7_1
        label: Tăng dần traffic Gateway A (25% -> 50% -> 100%) đồng thời bật lại cấu
          hình Circuit Breaker tiêu chuẩn.
      - key: opt_7_2
        label: Tắt Circuit Breaker và đẩy thẳng 100% traffic sang Gateway A.
      - key: opt_7_3
        label: Khởi động lại toàn bộ pod hạ tầng.
    - key: node_8
      prompt: Hệ thống đã hoạt động bình thường trên cả 2 Gateway. Việc cuối cùng
        cần làm để hoàn tất quy trình ứng cứu là gì?
      options:
      - key: opt_8_1
        label: Tổng hợp log, viết báo cáo Post-mortem (PIR) và cập nhật timeout/retry
          policy chuẩn.
      - key: opt_8_2
        label: Đóng ticket và đi uống cà phê không cần làm gì thêm.
      - key: opt_8_3
        label: Xóa toàn bộ log sự cố để tiết kiệm không gian lưu trữ.
    - key: node_recovery
