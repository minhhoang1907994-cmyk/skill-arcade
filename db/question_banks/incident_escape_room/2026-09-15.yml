        label: Tạm dừng (Pause) job Push Notification của Campaign marketing hiện
          tại trên Admin Portal.
      - key: o2_2
        label: Tắt toàn bộ cụm Redis Cluster.
      - key: o2_3
        label: Tiếp tục để job chạy nhưng mở thêm DB connection.
    - key: n3_step
      prompt: Campaign đã bị tạm dừng nhưng 2 triệu tin nhắn vẫn đang kẹt trong Queue
