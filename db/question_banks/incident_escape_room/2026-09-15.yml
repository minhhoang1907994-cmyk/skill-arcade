- content:
    scenario: Hệ thống thanh toán Checkout Service liên tục trả về lỗi HTTP 500 cho
      khách hàng khi thực hiện giao dịch trong giờ cao điểm Flash Sale.
    initial_logs: |-
      2023-10-25 10:01:02.102 [ERROR] [checkout-service] [pool-1-thread-45] c.e.c.repository.OrderRepository: HikariPool-1 - Connection is not available, request timed out after 30000ms.
      2023-10-25 10:01:02.105 [ERROR] [checkout-service] [pool-1-thread-48] c.e.c.controller.CheckoutController: Failed to process payment: org.springframework.dao.CannotGetJdbcConnectionException
    nodes:
    - key: node_1_triage
      prompt: 'Bước 1: Khách hàng báo lỗi không thể hoàn tất thanh toán. Bạn bắt đầu
        kiểm tra từ đâu?'
      options:
      - key: opt_1_1
        label: Kiểm tra log của checkout-service và dashboard DB connection pool
      - key: opt_1_2
        label: Restart ngay lập tức tất cả các pod của checkout-service
      - key: opt_1_3
        label: Tăng CPU và RAM cho toàn bộ Kubernetes Cluster
    - key: node_2_db_check
      prompt: 'Bước 2: Log cho thấy HikariPool hết connection. Bạn kiểm tra trạng
        thái Database PostgreSQL như thế nào?'
      options:
      - key: opt_2_1
        label: Chạy query pg_stat_activity để xem các connection đang ở trạng thái
          nào
      - key: opt_2_2
        label: Thực hiện DROP INDEX trên bảng orders để tăng tốc truy vấn
      - key: opt_2_3
        label: Tăng max_connections của PostgreSQL lên gấp 10 lần ngay lập tức
    - key: node_3_lock_identify
      prompt: 'Bước 3: pg_stat_activity cho thấy hàng trăm query `UPDATE inventory
        SET stock = stock - 1` đang ở trạng thái ''active'' và bị treo. Tiếp theo
        làm gì?'
      options:
      - key: opt_3_1
        label: Tra cứu pg_locks để tìm transaction ID đang giữ ExclusiveLock trên
          bảng inventory
      - key: opt_3_2
        label: Xóa toàn bộ dữ liệu trong bảng inventory để giải phóng lock
      - key: opt_3_3
        label: Chờ 15 phút xem database có tự giải phóng lock hay không
    - key: node_4_code_analysis
      prompt: 'Bước 4: Xác định được một cron job vừa release lúc 10:00 đang chạy
        `SELECT FOR UPDATE` trên toàn bộ bảng inventory không có INDEX. Giải pháp
        ngắn hạn là gì?'
      options:
      - key: opt_4_1
        label: Kill process/pid của cron job đang giữ lock bằng pg_cancel_backend()/pg_terminate_backend()
      - key: opt_4_2
        label: Reboot máy chủ Database PostgreSQL primary
      - key: opt_4_3
        label: Tắt tính năng ACID của Database
    - key: node_5_mitigation
      prompt: 'Bước 5: Sau khi kill backend transaction bị treo, lượng connection
        giảm nhẹ nhưng lại có nguy cơ bùng phát lại do cron job vẫn tái chạy. Làm
        thế nào để chặn cron job?'
      options:
      - key: opt_5_1
        label: Disable/Scale down Deployment của CronJob service trong Kubernetes
      - key: opt_5_2
        label: Sửa code trực tiếp trên server production
      - key: opt_5_3
        label: Chặn IP của database không cho ai truy cập
    - key: node_6_pool_tuning
      prompt: 'Bước 6: CronJob đã tắt, nhưng HikariPool của checkout-service vẫn phản
        ứng chậm do max-pool-size đang để quá nhỏ (5 connections/pod). Bạn xử lý sao?'
      options:
      - key: opt_6_1
        label: Cập nhật ConfigMap điều chỉnh maximumPoolSize lên 20 và thực hiện rolling
          update pod
      - key: opt_6_2
        label: Sửa maximumPoolSize lên 500 cho 100 pods checkout-service
      - key: opt_6_3
        label: Giữ nguyên cấu hình cũ vì tăng pool size không bao giờ giúp ích
    - key: node_7_verification
      prompt: 'Bước 7: Pods mới đã ready. Làm sao để xác nhận hệ thống checkout đã
        ổn định hoàn toàn?'
      options:
      - key: opt_7_1
        label: Theo dõi latency p99, tỷ lệ HTTP 200/500 và active DB connections trên
          Grafana
      - key: opt_7_2
        label: Tự thực hiện 1 giao dịch thành công rồi thông báo kết thúc sự cố ngay
      - key: opt_7_3
        label: Đóng ticket incident mà không cần kiểm tra metric
    - key: node_8_recovery
      prompt: 'Bước 8: Hệ thống đã khôi phục. Bạn cần thực hiện bước cuối cùng nào
        để tránh tái diễn?'
      options:
      - key: opt_8_1
        label: Tạo task thêm Index cho bảng inventory, optimize query cronjob và viết
          Post-Mortem
      - key: opt_8_2
        label: Xóa toàn bộ log của sự cố để đỡ tốn dung lượng lưu trữ
      - key: opt_8_3
        label: Cấm tất cả các đợt deploy tiếp theo trong vòng 1 năm
    - key: node_resolved
      prompt: Sự cố đã được xử lý hoàn toàn. Hệ thống hoạt động bình thường.
      options:
      - key: opt_finish_1
        label: Hoàn tất
  answer_key:
