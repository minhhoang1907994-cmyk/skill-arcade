      options:
      - key: o3_1
        label: Đổi tạm thời maxmemory-policy sang volatile-lru hoặc xóa các key temporary
          cache không quan trọng.
      - key: o3_2
        label: Restart lại máy chủ vật lý chứa Redis.
      - key: o3_3
        label: Xóa toàn bộ Database Postgres của ứng dụng.
    - key: n4_step
