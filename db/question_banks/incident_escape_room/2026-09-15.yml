        label: Lọc bỏ các Notification không quan trọng (quảng cáo/marketing), chỉ
          ưu tiên OTP và giao dịch.
      - key: o4_2
        label: Ép Worker xử lý hết 2 triệu tin nhắn nhanh nhất có thể bất kể loại
