- content:
    scenario: Hệ thống thanh toán eCommerce báo lỗi hàng loạt giao dịch bị treo (pending)
      và Timeout khi gọi sang bên thứ ba (Payment Gateway). Khách hàng liên tục khiếu
      nại không thể hoàn tất đơn hàng.
    initial_logs: |-
      2023-10-27 10:15:02.124 ERROR [payment-service] [http-nio-8080-exec-45] c.e.p.client.GatewayClient: Timeout connecting to https://api.paymentgateway.external/v2/charge (timeout=5000ms)
