      - key: s2_n8_o2
        label: Bỏ qua việc viết báo cáo Post-Mortem vì sự cố đã xong.
      - key: s2_n8_o3
        label: Gửi tin nhắn thông báo sự cố đã xử lý xong lên nhóm làm việc.
