- content:
    scenario: Trong sự kiện Flash Sale lúc 20:00, API Gateway viết bằng Node.js xuất
      hiện hiện tượng phản hồi chậm dần, sau đó các Pods bị Kubernetes kill liên tục
      với trạng thái OOMKilled (Exit Code 137).
    initial_logs: |-
      2023-11-10 20:02:15.002 [K8s Event] Pod api-gateway-7d9f8-x8z2l memory usage (514MB) exceeded limit (512MB). Killing container.
      2023-11-10 20:02:16.104 [K8s Event] Readiness probe failed for api-gateway-7d9f8-x8z2l: HTTP probe failed with statuscode 503
      2023-11-10 20:02:20.551 [FATAL] process out of memory: JS heap out of memory
    nodes:
    - key: s2_n1
      prompt: Các Pods api-gateway bị OOMKilled liên tục gây gián đoạn truy cập. Bước
        đầu tiên bạn sẽ điều tra điều gì?
      options:
      - key: s2_n1_o1
        label: Kiểm tra biểu đồ Memory RSS/Heap và Kubernetes Events log của dịch
          vụ API Gateway trên Grafana.
      - key: s2_n1_o2
        label: Tăng ngay số lượng replicas từ 5 Pods lên 50 Pods mà không xem xét
          cấu hình bộ nhớ.
      - key: s2_n1_o3
        label: Gỡ bỏ NGINX Ingress Controller vì nghi ngờ nghẽn mạng.
    - key: s2_n2
      prompt: Biểu đồ bộ nhớ cho thấy RAM RSS tăng liên tục theo đường thẳng đứng
        cho đến khi chạm 512MB và bị OOMKilled. Heap Dump phân tích thấy hàng triệu
        instance 'ClientRequest' và 'Buffer' bị giữ trong bộ nhớ. Bạn nghi ngờ điều
        gì?
      options:
      - key: s2_n2_o1
        label: Kiểm tra mã nguồn các Pull Request gần nhất liên quan đến phần gọi
          HTTP Client / Proxy Streaming.
      - key: s2_n2_o2
        label: Tăng RAM limit cho Pod từ 512MB lên 8GB.
      - key: s2_n2_o3
        label: Tắt tính năng Garbage Collection của Node.js bằng cờ --no-gc.
    - key: s2_n3
      prompt: Phát hiện commit mới nhất thêm middleware 'audit-logger' thực hiện gửi
        log sang dịch vụ bên thứ ba bằng Stream HTTP qua thư viện Axios. Bạn tiến
        hành phân tích mã nguồn middleware này ra sao?
      options:
      - key: s2_n3_o1
        label: Kiểm tra xem Response Stream có được đóng (.destroy() hoặc .resume())
          khi gặp lỗi HTTP Error/Timeout không.
      - key: s2_n3_o2
        label: Xóa toàn bộ thư viện Axios và thay bằng việc gọi lệnh cURL hệ điều
          hành.
      - key: s2_n3_o3
        label: Chạy npm audit fix để cập nhật các package bảo mật.
    - key: s2_n4
      prompt: 'Xác nhận lỗi: Khi API bên thứ ba bị chậm/lỗi, middleware audit-logger
        gán listener cho Event Stream nhưng không giải phóng (unpipe/destroy), làm
        rò rỉ Buffer bộ nhớ trên mỗi request. Giải pháp giảm thiểu ngay lập tức là
        gì?'
      options:
      - key: s2_n4_o1
        label: Tắt khẩn cấp middleware 'audit-logger' thông qua Feature Flag / Environment
          Variable.
      - key: s2_n4_o2
        label: Viết lại toàn bộ ứng dụng API Gateway sang ngôn ngữ Go ngay lập tức.
      - key: s2_n4_o3
        label: Chèn thêm lệnh process.exit(0) tự động restart app cứ sau mỗi 1000
          requests.
    - key: s2_n5
      prompt: Đã tắt Feature Flag của audit-logger cho các request mới, nhưng các
        Pods hiện tại vẫn đang bị đầy RAM và ngấp nghé OOMKilled. Làm sao để đưa cluster
        về trạng thái sạch bộ nhớ nhanh nhất?
      options:
      - key: s2_n5_o1
        label: Thực hiện lệnh kubectl rollout restart deployment/api-gateway để làm
          mới toàn bộ Pods.
      - key: s2_n5_o2
        label: Reboot vật lý toàn bộ máy chủ Worker Node của Kubernetes.
      - key: s2_n5_o3
        label: Truy cập trực tiếp (kubectl exec) vào từng Pod để sửa trực tiếp file
          JavaScript trong node_modules.
    - key: s2_n6
      prompt: Pods mới đã lên và mức sử dụng bộ nhớ giữ ổn định ở 120MB. Hệ thống
        hết bị OOM. Bây giờ bạn viết code hotfix triệt để cho middleware 'audit-logger'
        như thế nào?
      options:
      - key: s2_n6_o1
        label: Bổ sung xử lý sự kiện 'error' và 'close', luôn gọi response.data.destroy()
