- content:
    scenario: Hệ thống thanh toán báo động tràn kết nối cơ sở dữ liệu PostgreSQL.
      Tỷ lệ lỗi 504 Gateway Timeout tăng vọt lên 45% ở endpoint /api/v1/orders/checkout.
    initial_logs: |-
      [WARN] 2023-10-24 14:02:11 [http-exec-9] c.z.h.HikariPool - HikariPool-1 - Connection is not available, request timed out after 30000ms.
      [ERROR] 2023-10-24 14:02:11 [http-exec-9] c.e.p.c.OrderController - Error processing checkout: org.postgresql.util.PSQLException: FATAL: remaining connection slots are reserved for non-replication superuser connections
    nodes:
    - key: q1_n1
      prompt: Hệ thống đang bị cạn kiệt connection pool. Bước đầu tiên bạn sẽ làm
        gì để khoanh vùng nguyên nhân?
      options:
      - key: q1_opt_1a
        label: Kiểm tra danh sách query đang chạy trên PostgreSQL bằng pg_stat_activity.
      - key: q1_opt_1b
        label: Khởi động lại ngay lập tức toàn bộ các instance microservice order-service.
      - key: q1_opt_1c
        label: Tăng max_connections của PostgreSQL trong postgresql.conf lên gấp đôi.
    - key: q1_n2
      prompt: Kết quả pg_stat_activity cho thấy hơn 80 kết nối ở trạng thái 'idle
        in transaction' xuất phát từ order-service. Bước tiếp theo là gì?
      options:
      - key: q1_opt_2a
        label: Kiểm tra mã nguồn order-service đoạn xử lý transaction checkout để
          tìm vị trí thiếu close connection hoặc uncommitted transaction.
      - key: q1_opt_2b
        label: Xóa toàn bộ dữ liệu trong bảng orders để giải phóng dung lượng đĩa.
      - key: q1_opt_2c
        label: Thực hiện Vacuum Full trên cơ sở dữ liệu ngay lập tức.
    - key: q1_n3
      prompt: Bạn phát hiện ra đoạn code mới merge gần đây mở transaction đọc giỏ
        hàng nhưng không gọi commit/rollback khi gặp ngoại lệ. Bạn xử lý thế nào?
      options:
      - key: q1_opt_3a
        label: Viết hotfix thêm try-finally / defer để đảm bảo luôn close/rollback
          transaction khi xảy ra lỗi.
      - key: q1_opt_3b
        label: Tắt hoàn toàn tính năng checkout trên trang web.
      - key: q1_opt_3c
        label: Tăng thời gian connection timeout trong HikariCP lên 120 giây.
    - key: q1_n4
      prompt: Bản hotfix code đã sẵn sàng. Trước khi deploy hotfix, bạn làm cách nào
        để hạ nhiệt ngay các kết nối đang bị treo trên DB?
      options:
      - key: q1_opt_4a
        label: Chạy câu lệnh pg_terminate_backend() đối với các PID ở trạng thái idle
          in transaction kéo dài hơn 2 phút.
      - key: q1_opt_4b
        label: Drop database và restore lại từ bản backup đêm qua.
      - key: q1_opt_4c
        label: Chờ bản deploy hoàn tất để hệ thống tự giải phóng.
    - key: q1_n5
      prompt: Các kết nối treo đã được ngắt bớt, CPU DB giảm. Giờ bạn sẽ triển khai
        bản hotfix mã nguồn như thế nào?
      options:
      - key: q1_opt_5a
        label: Thực hiện Rolling Update cho order-service để thay thế dần các pod
          cũ mà không gián đoạn dịch vụ.
      - key: q1_opt_5b
        label: Tắt toàn bộ pod cũ cùng lúc rồi mới bật pod mới.
      - key: q1_opt_5c
        label: Deploy thẳng lên môi trường Staging trước rồi chờ ngày mai deploy Production.
    - key: q1_n6
      prompt: Bản hotfix đã được deploy thành công. Bạn muốn kiểm tra xem connection
        pool đã ổn định lại chưa. Bạn thực hiện thao tác nào?
      options:
      - key: q1_opt_6a
        label: Theo dõi dashboard Grafana về số lượng Active Connections và latency
          của API checkout trong 5 phút.
      - key: q1_opt_6b
        label: Gửi 10.000 request giả lập bằng jMeter liên tục vào production để test
          tải.
      - key: q1_opt_6c
        label: Kiểm tra dung lượng ổ đĩa còn trống trên server database.
    - key: q1_n7
      prompt: Metric cho thấy connection giảm về 15%, error rate về 0%. Bạn cần làm
        gì để tránh sự cố này lặp lại trong tương lai?
      options:
      - key: q1_opt_7a
        label: Thêm linter check unclosed transactions, bổ sung alert cho metric Idle
          Connections và cấu hình idleInTransactionSessionTimeout trên Postgres.
      - key: q1_opt_7b
        label: Chỉ định rõ không cho phép developer sửa code module checkout nữa.
      - key: q1_opt_7c
        label: Chuyển toàn bộ database từ PostgreSQL sang MongoDB.
    - key: q1_n8
      prompt: Bước cuối cùng trong quy trình quản lý sự cố là gì?
      options:
      - key: q1_opt_8a
        label: Tổ chức họp Post-mortem (Blameless), ghi nhận nguyên nhân gốc rễ (RCA)
          và cập nhật tài liệu vận hành.
      - key: q1_opt_8b
        label: Phạt tiền developer đã viết đoạn code gây lỗi.
      - key: q1_opt_8c
        label: Đóng ticket incident và không cần làm gì thêm.
    - key: q1_recovery
      prompt: Sự cố đã được khắc phục hoàn toàn. Hệ thống thanh toán hoạt động ổn
        định trở lại.
      options: []
