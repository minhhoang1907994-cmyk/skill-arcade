      - key: s2_n6_o2
        label: Bỏ hẳn câu lệnh try-catch để code chạy nhanh hơn.
      - key: s2_n6_o3
        label: Thêm thật nhiều console.log vào luồng xử lý stream để theo dõi.
    - key: s2_n7
      prompt: Bản hotfix đã được viết và kiểm thử đạt trên môi trường Staging. Quy
