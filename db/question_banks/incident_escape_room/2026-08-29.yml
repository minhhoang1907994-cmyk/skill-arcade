  difficulty: medium
- content:
    scenario: Sự cố Database Lock Contention và tràn kết nối PostgreSQL trong hệ thống
      đặt hàng do truy vấn thiếu Index kết hợp với giao dịch chạy lâu (Long-running
      transaction).
    initial_logs: |-
      [FATAL] 2023-11-05 09:15:22 [order-db] postgres[28412]: FATAL: remaining connection slots are reserved for non-replication superuser connections
      [WARN] 2023-11-05 09:15:30 [checkout-service] HikariPool-1 - Connection is not available, request timed out after 30000ms.
    nodes:
    - key: s2_node_1
      prompt: PostgreSQL báo vượt quá max_connections, checkout-service không thể
        lấy connection. Hành động đầu tiên?
      options:
      - key: s2_opt_1_1
        label: Truy cập DB bằng tài khoản superuser để kiểm tra bảng pg_stat_activity
          tìm câu lệnh bị nghẽn.
      - key: s2_opt_1_2
        label: Restart dịch vụ PostgreSQL ngay lập tức.
      - key: s2_opt_1_3
        label: Tăng thuộc tính max_connections trong postgresql.conf và reload lại
          DB.
    - key: s2_opt_2
      prompt: Bảng pg_stat_activity cho thấy PID 14205 đang giữ ExclusiveLock trên
        bảng orders do một câu lệnh migration chạy tay. Bạn xử lý như thế nào?
      options:
      - key: s2_opt_2_1
        label: Thực hiện hủy tiến trình gây khóa bằng câu lệnh SELECT pg_terminate_backend(14205).
      - key: s2_opt_2_2
        label: Chờ đợi tiến trình migration tự hoàn thành.
      - key: s2_opt_2_3
        label: Thực hiện DROP INDEX trên bảng orders để giải phóng lock.
    - key: s2_opt_3
      prompt: Khóa đã giải phóng nhưng CPU của Database vẫn ở mức 100% do truy vấn
        'SELECT * FROM orders WHERE status = PENDING AND created_at < ...' quét toàn
        bộ bảng (Seq Scan). Bước tiếp theo?
      options:
      - key: s2_opt_3_1
        label: 'Tạo composite index bất đồng bộ: CREATE INDEX CONCURRENTLY idx_orders_status_created
          ON orders(status, created_at).'
      - key: s2_opt_3_2
        label: Tạo index thông thường CREATE INDEX idx_orders_status_created ON orders(status,
          created_at) trực tiếp.
      - key: s2_opt_3_3
        label: Xóa các bản ghi PENDING cũ trực tiếp trong bảng orders.
    - key: s2_opt_4
      prompt: Index đã được tạo, CPU giảm xuống 40%. Tuy nhiên checkout-service vẫn
        báo lỗi HikariCP do nhiều kết nối cũ bị treo đứt ngầm. Bạn làm gì?
      options:
      - key: s2_opt_4_1
        label: Thực hiện Graceful Restart ứng dụng checkout-service để khởi tạo lại
          Connection Pool.
      - key: s2_opt_4_2
        label: Chờ cho thuộc tính maxLifetime của HikariCP tự giải phóng các connection
          hỏng.
      - key: s2_opt_4_3
        label: Kill tiến trình PostgreSQL Master để bắt buộc tất cả app kết nối lại.
    - key: s2_opt_5
      prompt: Kết nối app đã khôi phục, nhưng Message Queue (RabbitMQ) tồn đọng 50,000
        tin nhắn 'order-events' chưa xử lý trong lúc ngắt kết nối. Bạn xử lý sao?
      options:
      - key: s2_opt_5_1
        label: Tăng số lượng Pod của Worker tiêu thụ tin nhắn từ 2 lên 10 pods để
          tiêu thụ nhanh backlog.
      - key: s2_opt_5_2
        label: Để 2 worker pods hiện tại xử lý từ từ theo tốc độ bình thường.
      - key: s2_opt_5_3
        label: Xóa sạch (Purge) toàn bộ tin nhắn trong queue để hết nghẽn.
    - key: s2_opt_6
      prompt: Hàng đợi giảm nhanh, nhưng hệ thống bên thứ ba (Đối tác kho vận) bị
        quá tải và trả về HTTP 429 (Too Many Requests). Cách giải quyết?
      options:
      - key: s2_opt_6_1
        label: Áp dụng Rate Limiter và cơ chế Retry có Exponential Backoff ở phía
          Worker gửi tin nhắn sang đối tác.
      - key: s2_opt_6_2
        label: Giảm ngay số lượng Worker pod xuống để giảm số lượng request gửi đi.
      - key: s2_opt_6_3
        label: Bỏ qua các lỗi status 429 và loại bỏ request thất bại ra khỏi hàng
          đợi.
    - key: s2_opt_7
      prompt: Hàng đợi đã giải tỏa hoàn toàn và đồng bộ kho thành công. Để ngăn ngừa
        sự cố migration khóa DB tương tự trong tương lai, bạn đưa ra giải pháp gì?
      options:
      - key: s2_opt_7_1
        label: Cấu hình tham số lock_timeout và statement_timeout trong pipeline CI/CD
          chạy DB Migration.
      - key: s2_opt_7_2
        label: Gửi tin nhắn nhắc nhở đội ngũ kỹ thuật không chạy query tay trong Slack.
      - key: s2_opt_7_3
        label: Tắt toàn bộ quyền WRITE của script migration trên Database Production.
    - key: s2_opt_8
      prompt: Hệ thống đã hoạt động bình thường, các chỉ số Database và Queue trở
        lại mốc xanh. Bạn thực hiện bước hoàn tất nào?
      options:
      - key: s2_opt_8_1
        label: Scale số lượng Worker pods về lại quy mô bình thường và xác nhận tổng
          thể sức khỏe hệ thống.
      - key: s2_opt_8_2
        label: Giữ nguyên 10 Worker pods chạy vĩnh viễn để phòng ngừa ngẽn queue về
          sau.
      - key: s2_opt_8_3
        label: Khởi động lại toàn bộ microservices trong hệ thống để chắc chắn mọi
          thứ hoạt động ổn.
    - key: s2_recovery_node
      prompt: Sự cố Database Lock & Backlog đã được giải quyết triệt để! Hệ thống
        trở lại trạng thái hoạt động bình thường.
      options: []
