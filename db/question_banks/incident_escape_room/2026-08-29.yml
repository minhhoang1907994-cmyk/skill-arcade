- content:
    scenario: Hệ thống thanh toán đột ngột trả về lỗi HTTP 500 hàng loạt. Dashboard
      giám sát ghi nhận số lượng kết nối tới PostgreSQL database chạm mốc tối đa (max_connections
      = 100), khiến toàn bộ dịch vụ phụ thuộc bị nghẽn.
    initial_logs: '2023-10-24 10:15:02 [ERROR] org.postgresql.util.PSQLException:
      FATAL: sorry, too many clients already. Active pool size: 100/100. Service:
      payment-service'
    nodes:
    - key: s1_n1
      prompt: Hệ thống báo động tỉ lệ lỗi HTTP 500 tăng vọt lên 45%. Bước đầu tiên
        bạn sẽ làm gì để chẩn đoán nguyên nhân?
      options:
      - key: s1_n1_o1
        label: Kiểm tra dashboard giám sát DB connection pool và câu lệnh pg_stat_activity.
      - key: s1_n1_o2
        label: Khởi động lại toàn bộ API Gateway để xóa sạch request bị hoãn.
      - key: s1_n1_o3
        label: Tăng ngay lập tức CPU và RAM cho server PostgreSQL.
    - key: s1_n2
      prompt: Bạn xác nhận DB connection đã bị đầy (100/100). Bạn tiếp tục kiểm tra
        chi tiết bằng cách nào?
      options:
      - key: s1_n2_o1
        label: Truy vấn view pg_stat_activity để xem trạng thái và query của các kết
          nối hiện tại.
      - key: s1_n2_o2
        label: Thực hiện restart ngay máy chủ cơ sở dữ liệu.
      - key: s1_n2_o3
        label: Sửa postgresql.conf tăng max_connections lên 500 ngay lập tức.
    - key: s1_n3
      prompt: Kết quả pg_stat_activity cho thấy hơn 80 connection ở trạng thái 'idle
        in transaction' xuất phát từ payment-service. Bạn làm gì tiếp theo?
      options:
      - key: s1_n3_o1
        label: Xem commit log gần nhất của payment-service để tìm đoạn code quản lý
          transaction.
      - key: s1_n3_o2
        label: Kill hết các Pod thuộc các dịch vụ khác ngoại trừ payment-service.
      - key: s1_n3_o3
        label: Chờ đợi 30 phút xem các transaction này có tự động timeout hay không.
    - key: s1_n4
      prompt: Bạn phát hiện ra bản deploy v1.4.3 vừa phát hành có hàm gọi API bên
        thứ ba nằm bên trong annotation @Transactional mà không có timeout. Để giải
        phóng DB khẩn cấp, bạn sẽ làm gì?
      options:
      - key: s1_n4_o1
        label: Chạy câu lệnh pg_terminate_backend ngắt các connection đang bị ngắt
          quãng 'idle in transaction'.
      - key: s1_n4_o2
        label: Xóa bớt index trong database để giải phóng bộ nhớ.
      - key: s1_n4_o3
        label: Đợi dev viết xong hotfix rồi mới can thiệp vào database.
    - key: s1_n5
      prompt: Sau khi ngắt các connection rác, payment-service v1.4.3 vẫn tiếp tục
        tạo ra transaction mới và làm đầy kết nối. Làm sao để ngăn chặn triệt để?
      options:
      - key: s1_n5_o1
        label: Rollback payment-service về phiên bản ổn định trước đó (v1.4.2).
      - key: s1_n5_o2
        label: Scale số lượng Pod của payment-service lên gấp đôi.
      - key: s1_n5_o3
        label: Chặn toàn bộ IP của cơ sở dữ liệu.
    - key: s1_n6
      prompt: Sau khi đã rollback về v1.4.2, làm thế nào để xác nhận hệ thống đã hồi
        phục an toàn?
      options:
      - key: s1_n6_o1
        label: 'Theo dõi Grafana: HTTP response status code và số lượng active DB
          connection.'
      - key: s1_n6_o2
        label: Gửi email thông báo khắc phục xong cho khách hàng mà không cần check
          metric.
      - key: s1_n6_o3
        label: Tắt hệ thống cảnh báo Alertmanager để tránh nhận tin rác.
    - key: s1_n7
      prompt: Hệ thống đã chạy ổn định lại. Bạn phối hợp với đội Dev để xử lý triệt
        để nguyên nhân gốc (root cause) trong mã nguồn như thế nào?
      options:
      - key: s1_n7_o1
        label: Tách lệnh gọi API bên ngoài ra khỏi phạm vi DB transaction và thêm
          timeout cho HTTP Client.
      - key: s1_n7_o2
        label: Tăng connection timeout trong connection pool lên 300 giây.
      - key: s1_n7_o3
        label: Bỏ hẳn việc gọi API bên thứ ba trong quy trình thanh toán.
    - key: s1_n8
      prompt: Bản hotfix v1.4.4 đã được kiểm thử cẩn thận ở Staging và deploy lên
        Production thành công. Các chỉ số đều ổn định.
      options:
      - key: s1_n8_o1
        label: Cập nhật Incident Report, tổ chức buổi Post-Mortem và đóng ticket sự
          cố.
      - key: s1_n8_o2
        label: Đóng ticket luôn mà không cần ghi chép lại tài liệu sự cố.
      - key: s1_n8_o3
        label: Xóa toàn bộ log của vụ việc để tiết kiệm dung lượng ổ đĩa.
