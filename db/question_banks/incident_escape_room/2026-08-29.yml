  difficulty: hard
- content:
    scenario: Hệ thống Thanh toán Thương mại Điện tử ghi nhận tỷ lệ lỗi HTTP 500 tăng
      đột biến lên 45% vào giờ cao điểm. Người dùng không thể hoàn tất đặt hàng. DB
      Connection Pool liên tục báo cạn kiệt kết nối.
    initial_logs: |-
      [ERROR] 2023-10-24 14:02:11.102 [http-nio-8080-exec-42] c.z.h.HikariPool - HikariPool-1 - Connection is not available, request timed out after 30000ms.
      [FATAL] 2023-10-24 14:02:15.512 postgresql - FATAL: remaining connection slots are reserved for non-replication superuser connections
      [WARN] 2023-10-24 14:02:18.001 - High latency detected on POST /api/v1/orders/checkout (avg 28.4s)
    nodes:
    - key: q1_n1
      prompt: Hệ thống đang nghẽn connection pool dữ liệu. Bạn muốn thực hiện bước
        chẩn đoán ban đầu nào?
      options:
      - key: q1_o1
        label: Kiểm tra metrics của HikariPool và truy vấn pg_stat_activity trên PostgreSQL
      - key: q1_o2
        label: Khởi động lại toàn bộ Pod của Order-Service ngay lập tức
      - key: q1_o3
        label: Tăng max_connections của HikariPool từ 50 lên 200 trong file config
    - key: q1_n2
      prompt: Kết quả `pg_stat_activity` cho thấy có 40+ kết nối đang ở trạng thái
        `active` với câu lệnh `UPDATE orders SET status = ... WHERE user_id = ...`
        chạy kéo dài trên 20 giây. Bạn sẽ làm gì tiếp theo?
      options:
      - key: q1_o4
        label: Lọc danh sách các query bị khóa (lock) và kiểm tra lock graph trong
          PostgreSQL
      - key: q1_o5
        label: Chạy `pg_terminate_backend()` để ngắt tất cả các tiến trình DB đang
          treo
      - key: q1_o6
        label: Nâng cấp cấu hình CPU/RAM cho DB instance lên gấp đôi
    - key: q1_n3
      prompt: Bạn phát hiện câu lệnh `UPDATE orders` đang đợi khóa Row Exclusive trên
        bảng `orders`. Bạn làm sao để phân tích nguyên nhân câu lệnh này bị chậm?
      options:
      - key: q1_o7
        label: Chạy `EXPLAIN ANALYZE` cho câu lệnh UPDATE bị treo trên môi trường
          Staging/Dev
      - key: q1_o8
        label: Thực hiện `REINDEX TABLE orders` trực tiếp trên Production
      - key: q1_o9
        label: Tạm thời vô hiệu hóa tất cả Foreign Key constraints trên bảng orders
    - key: q1_n4
      prompt: "`EXPLAIN ANALYZE` cho thấy query thực hiện `Sequential Scan` trên bảng
        `orders` chứa 10 triệu bản ghi do thiếu index ở cột `user_id` và `status`.
        Bạn kiểm tra nguyên nhân do đâu?"
      options:
      - key: q1_o10
        label: Kiểm tra các Pull Request / Commit gần nhất liên quan đến file migration
          DB
      - key: q1_o11
        label: Tạo ngay index mới trực tiếp bằng lệnh `CREATE INDEX` thông thường
          trên Prod
      - key: q1_o12
        label: Xóa bớt dữ liệu cũ trong bảng `orders` bằng `DELETE` để giảm dung lượng
    - key: q1_n5
      prompt: Bạn xác nhận bản release v1.4.2 vừa deploy cách đây 30 phút đã quên
        mất file migration tạo index `idx_orders_user_status`. Phương án xử lý chính
        xác là gì?
      options:
      - key: q1_o13
        label: Viết script bổ sung index bằng `CREATE INDEX CONCURRENTLY idx_orders_user_status
          ON orders(user_id, status)`
      - key: q1_o14
        label: Chạy lệnh `CREATE INDEX idx_orders_user_status ON orders(user_id, status)`
          trong một transaction block
      - key: q1_o15
        label: Rollback toàn bộ ứng dụng về phiên bản v1.4.1
    - key: q1_n6
      prompt: Bạn chuẩn bị thực thi lệnh `CREATE INDEX CONCURRENTLY`. Bạn cần lưu
        ý và giám sát điều gì trong quá trình chạy?
      options:
      - key: q1_o16
        label: Thực thi lệnh độc lập ngoài transaction và theo dõi CPU/IOPS cũng như
          lock status trên DB
      - key: q1_o17
        label: Khởi động lại PostgreSQL node trước khi chạy lệnh tạo index
      - key: q1_o18
        label: Đặt lệnh trong block `BEGIN ... COMMIT` để đảm bảo an toàn dữ liệu
    - key: q1_n7
      prompt: Index đã được đánh xong sau 2 phút (`CREATE INDEX CONCURRENTLY` thành
        công). Bạn xác minh hệ thống phục hồi như thế nào?
      options:
      - key: q1_o19
        label: 'Kiểm tra Prometheus/Grafana: độ trễ query `orders`, số lượng connection
          active và tỷ lệ lỗi 500'
      - key: q1_o20
        label: Thử tạo 1 đơn hàng thủ công từ trình duyệt rồi kết luận hệ thống đã
          ổn
      - key: q1_o21
        label: Clear toàn bộ bộ nhớ tạm Redis Cache để kiểm tra lại
    - key: q1_n8
      prompt: Metrics cho thấy độ trễ query giảm từ 28s xuống 15ms, connection pool
        trở về mức an toàn (15%). Bước cuối cùng để kết thúc xử lý sự cố là gì?
      options:
      - key: q1_o22
        label: Cập nhật mã nguồn migration vào Git repository, bổ sung alert rule
          cho connection pool > 80% và viết Post-mortem
      - key: q1_o23
        label: Đóng ticket sự cố ngay lập tức mà không cần cập nhật thêm giám sát
      - key: q1_o24
        label: Giữ nguyên max_connections ở mức cao vĩnh viễn
    - key: q1_resolved
      prompt: Sự cố đã được khắc phục hoàn toàn. Hệ thống hoạt động ổn định.
      options: []
  answer_key:
    option_effects:
      q1_o1:
