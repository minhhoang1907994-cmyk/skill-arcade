- content:
    scenario: Sự cố sập thanh toán do cạn kiệt Redis Connection Pool trên microservice
      payment-service sau khi phát hành phiên bản mới.
    initial_logs: |-
      [ERROR] 2023-10-24 14:02:11 [payment-service] org.springframework.data.redis.RedisConnectionFailureException: Unable to connect to Redis; nested exception is io.lettuce.core.RedisConnectionException: Connection pool exhausted
      [WARN] 2023-10-24 14:02:15 [payment-service] HTTP 500 downstream failure, latency spiked to 8500ms
    nodes:
    - key: node_1
      prompt: Hệ thống thanh toán báo lỗi 500 liên tục. Bạn cần kiểm tra điều gì đầu
        tiên?
      options:
      - key: opt_1_1
        label: Kiểm tra số lượng active connections và cấu hình connection pool trên
          payment-service.
      - key: opt_1_2
        label: Khởi động lại ngay lập tức toàn bộ cluster Redis Master.
      - key: opt_1_3
        label: Tăng dung lượng RAM cho Pod của payment-service.
    - key: node_2
      prompt: Kết quả kiểm tra cho thấy số kết nối active chạm mốc max (100/100) do
        rò rỉ kết nối sau release. Bước tiếp theo là gì?
      options:
      - key: opt_2_1
        label: Kiểm tra các commit mới liên quan đến Redis Caching trong phiên bản
          mới nhất.
      - key: opt_2_2
        label: Tạm thời tăng max-active connection pool từ 100 lên 200 trong config.
      - key: opt_2_3
        label: Thực hiện xóa toàn bộ cache bằng lệnh FLUSHALL trên Redis.
    - key: node_3
      prompt: Phát hiện commit 'a7f8b9' sử dụng Redis manual client mà không đóng
        connection trong khối finally. Bạn sẽ làm gì?
      options:
      - key: opt_3_1
        label: Thực hiện Rollback payment-service về phiên bản ổn định trước đó (v2.4.1).
      - key: opt_3_2
        label: Chỉnh sửa code trực tiếp trên container đang chạy để vá khẩn cấp.
      - key: opt_3_3
        label: Tắt tính năng Redis Cache trong file cấu hình mà không có phương án
          dự phòng.
    - key: node_4
      prompt: Đã rollback về v2.4.1 nhưng các connection cũ vẫn chưa giải phóng hoàn
        toàn trên Redis Server. Bước xử lý tiếp theo?
      options:
      - key: opt_4_1
        label: Thực hiện rolling restart các pod payment-service để dọn dẹp connection
          rác.
      - key: opt_4_2
        label: Chờ đợi TCP keepalive tự động ngắt các kết nối bị rò rỉ.
      - key: opt_4_3
        label: Khởi động lại node master của Kubernetes cluster.
    - key: node_5
      prompt: Connection pool đã trở lại bình thường. Tuy nhiên lượng request bị dồn
        nén đang tràn vào API Gateway làm tăng latency. Bạn làm gì?
      options:
      - key: opt_5_1
        label: Bật Rate Limiting / Circuit Breaker trên API Gateway đối với endpoint
          thanh toán.
      - key: opt_5_2
        label: Tăng số lượng Pod payment-service thủ công từ 3 lên 10 pod.
      - key: opt_5_3
        label: Chặn toàn bộ truy cập từ Cloudflare firewall.
    - key: node_6
      prompt: Tải hệ thống đã ổn định nhờ Rate Limiting. Bây giờ cần xử lý các giao
        dịch dở dang trong lúc xảy ra sự cố. Bạn chọn cách nào?
      options:
      - key: opt_6_1
        label: Chạy script đối soát để xác minh trạng thái giữa Payment DB và đối
          tác cổng thanh toán.
      - key: opt_6_2
        label: Đánh dấu tất cả giao dịch Pending thành Failed và hoàn tiền tự động.
      - key: opt_6_3
        label: Thử lại (retry) tất cả giao dịch Pending mà không kiểm tra trạng thái
          bên cổng thanh toán.
    - key: node_7
      prompt: Đối soát xong, không có giao dịch nào bị trùng lặp. Các chỉ số CPU và
        Memory ổn định. Lựa chọn tiếp theo?
      options:
      - key: opt_7_1
        label: Nâng dần giới hạn Rate Limiting về lại 100% dung lượng hệ thống.
      - key: opt_7_2
        label: Gỡ bỏ ngay lập tức Rate Limiting mà không cần theo dõi response time.
      - key: opt_7_3
        label: Giữ nguyên Rate Limiting nghiêm ngặt qua đêm cho an toàn.
    - key: node_8
      prompt: Lưu lượng truy cập đã trở lại bình thường. Bạn thực hiện bước cuối nào
        để đóng sự cố?
      options:
      - key: opt_8_1
        label: Xác nhận tỷ lệ lỗi log < 0.01%, kiểm tra luồng thanh toán E2E thành
          công và đóng Incident.
      - key: opt_8_2
        label: Theo dõi dashboard thêm 30 phút nhưng không cập nhật status page.
      - key: opt_8_3
        label: Chạy thử bài kiểm tra tải (load test) ngay trên môi trường Production.
    - key: node_recovered_1
      prompt: Sự cố đã được giải quyết thành công! Hệ thống thanh toán hoạt động ổn
        định trở lại.
      options: []
