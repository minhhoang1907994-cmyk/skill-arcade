- content:
    scenario: Dịch vụ xử lý hình ảnh image-service trên Kubernetes liên tục bị CrashLoopBackOff.
      Khách hàng không thể tải ảnh đại diện và chứng từ hóa đơn.
    initial_logs: |-
      kubectl get pods -n prod
      NAME                             READY   STATUS             RESTARTS   AGE
      image-service-67897f9b8c-x2z9l   0/1     CrashLoopBackOff   5          12m

      Event Log:
      State: Terminated, Reason: OOMKilled, Exit Code: 137
    nodes:
    - key: q2_n1
      prompt: Pod báo trạng thái OOMKilled (Exit Code 137). Bạn sẽ kiểm tra thông
        tin gì đầu tiên để biết lượng RAM tiêu thụ?
      options:
      - key: q2_opt_1a
        label: Kiểm tra log chi tiết của pod trước khi crash và thông số resources
          limit trong manifest K8s.
      - key: q2_opt_1b
        label: Tăng ngay storage PVC của pod lên 100GB.
      - key: q2_opt_1c
        label: Reboot lại Worker Node chứa pod bị lỗi.
    - key: q2_opt_2a
      prompt: 'Log ứng dụng ghi nhận: ''FATAL ERROR: Reached heap limit Allocation
        failed - JavaScript heap out of memory''. Bạn làm gì tiếp theo?'
      options:
      - key: q2_opt_2a
        label: Kiểm tra commit gần nhất xem có thư viện/đoạn code nào lưu trữ Buffer
          ảnh trong bộ nhớ RAM mà không giải phóng.
      - key: q2_opt_2b
        label: Chuyển sang dùng Docker Swarm thay vì Kubernetes.
      - key: q2_opt_2c
        label: Xóa Nginx Ingress Controller và cài lại.
    - key: q2_opt_3
      prompt: Phát hiện commit mới dùng Sharp JS để resize ảnh nhưng gán cache Buffer
        vào biến global làm Memory Leak. Cách giảm tải tức thì cho hệ thống là gì?
      options:
      - key: q2_opt_3a
        label: Rollback deployment image-service về phiên bản Docker tag ổn định trước
          đó (v1.3.1).
      - key: q2_opt_3b
        label: Sửa code trực tiếp trong container đang chạy bằng lệnh kubectl exec.
      - key: q2_opt_3c
        label: Tắt toàn bộ Ingress để ngắt traffic người dùng.
    - key: q2_opt_4
      prompt: Sau khi rollback về v1.3.1, pod đã Running trở lại. Bạn bắt đầu sửa
        đoạn code bị memory leak ở môi trường dev như thế nào?
      options:
      - key: q2_opt_4a
        label: Loại bỏ biến global cache, chuyển sang stream buffer trực tiếp và bật
          sharp.cache(false).
      - key: q2_opt_4b
        label: Thêm lệnh process.exit(0) sau mỗi lần xử lý xong 1 bức ảnh.
      - key: q2_opt_4c
        label: Chỉ tăng memory limit trong K8s lên 16GB mà không sửa code.
    - key: q2_opt_5
      prompt: Bản sửa lỗi (v1.3.2) đã qua unit test. Bạn làm thế nào để test khả năng
        chịu tải và Memory Leak trước khi đưa lên Prod?
      options:
      - key: q2_opt_5a
        label: Chạy benchmark load test trên Staging, theo dõi Grafana Process Resident
          Memory (RSS) xem RAM có giảm sau khi test xong không.
      - key: q2_opt_5b
        label: Merge thẳng vào branch main và push lên Production.
      - key: q2_opt_5c
        label: Nhờ 1 người dùng thử upload 1 bức ảnh và kiểm tra xem có báo lỗi không.
    - key: q2_opt_6
      prompt: 'Kết quả load test ổn định: RAM tăng khi xử lý và hạ ngay về mức 80MB.
        Bạn lựa chọn chiến lược deploy nào lên Production?'
      options:
      - key: q2_opt_6a
        label: Triển khai Canary deployment (10% traffic vào v1.3.2), theo dõi trong
          15 phút trước khi roll out 100%.
      - key: q2_opt_6b
        label: Xóa toàn bộ deployment cũ và kubectl apply file manifest mới.
      - key: q2_opt_6c
        label: Deploy vào lúc 2 giờ sáng mà không cần theo dõi.
    - key: q2_opt_7
      prompt: Canary chạy tốt, không có pod nào bị crash hay leak. Bạn hoàn tất việc
        rollout 100%. Tiếp theo bạn điều chỉnh resource limit như thế nào?
      options:
      - key: q2_opt_7a
        label: Đặt memory request hợp lý (ví dụ 256Mi) và limit thích hợp (ví dụ 512Mi)
          dựa trên metrics thực tế.
      - key: q2_opt_7b
        label: Gỡ bỏ hoàn toàn memory limit để pod muốn dùng bao nhiêu RAM tùy thích.
      - key: q2_opt_7c
        label: Set request bằng limit = 16GiB cho mỗi pod.
    - key: q2_opt_8
      prompt: Để phát hiện sớm các sự cố OOMKilled tương tự trong tương lai, bạn cấu
        hình cảnh báo thế nào?
      options:
      - key: q2_opt_8a
        label: Cấu hình Prometheus Alertmanager báo về Slack/PagerDuty khi container
          memory usage > 85% limit hoặc khi có sự kiện ContainerOOMKilled.
      - key: q2_opt_8b
        label: Viết script cronjob gởi email hàng ngày báo danh sách pod.
      - key: q2_opt_8c
        label: Thỉnh thoảng gõ kubectl get pods bằng tay để kiểm tra restart count.
    - key: q2_recovery
      prompt: Dịch vụ xử lý ảnh đã hoạt động mượt mà. Memory leak được giải quyết
        hoàn toàn!
      options: []
