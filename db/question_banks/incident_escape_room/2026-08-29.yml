  difficulty: medium
- content:
    scenario: Dịch vụ API Gateway chạy Node.js trên Kubernetes liên tục bị OOMKilled
      (Out of Memory) làm gián đoạn kết nối của hơn 100,000 khách hàng Real-time WebSocket.
    initial_logs: |-
      Kubelet: OOMKilled container api-gateway in pod api-gateway-7f49c-8x2z9 (exit code 137)
      [WARN] Node.js process memory: rss=1420MB, heapTotal=1380MB, heapUsed=1340MB (limit: 1024MB)
      [ERROR] Ingress-controller: 504 Gateway Timeout connecting to upstream pod api-gateway
    nodes:
    - key: q2_n1
      prompt: Pod API Gateway liên tục sập và khởi động lại do vượt ngưỡng bộ nhớ.
        Bạn bắt đầu điều tra từ đâu?
      options:
      - key: q2_o1
        label: Xem biểu đồ Memory Usage (Grafana) và lệnh `kubectl describe pod` để
          xác định tần suất và thời điểm OOM
      - key: q2_o2
        label: Sửa ngay Kubernetes Manifest tăng `limits.memory` từ 1Gi lên 4Gi
      - key: q2_o3
        label: Xóa và khởi động lại Ingress Controller Pods
    - key: q2_n2
      prompt: Biểu đồ bộ nhớ cho thấy RAM tăng tuyến tính liên tục từ lúc khởi động
        cho đến khi chạm mốc 1GB và bị kill (dạng rò rỉ bộ nhớ - Memory Leak). Bước
        chẩn đoán mã nguồn nào là phù hợp?
      options:
      - key: q2_o4
        label: Chụp Heap Snapshot từ một Pod canary đang chạy trước khi nó bị OOM
          bằng `--inspect` hoặc `v8` module
      - key: q2_o5
        label: Thêm tham số `--expose-gc` và gọi `global.gc()` cưỡng chế sau mỗi request
      - key: q2_o6
        label: Tắt chế độ Node.js Clustering trong container
    - key: q2_n3
      prompt: Bạn lấy được Heap Snapshot và mở trên Chrome DevTools. Bạn sẽ tập trung
        phân tích đối tượng nào?
      options:
      - key: q2_o7
        label: So sánh 2 bản Heap Snapshot (Delta) để tìm các object có số lượng tăng
          bất thường và Retainers giữ reference
      - key: q2_o8
        label: Tìm kiếm các chuỗi String xuất hiện nhiều trong memory
      - key: q2_o9
        label: Tạo CronJob khởi động lại Pod mỗi 10 phút một lần để xả RAM tạm thời
    - key: q2_n4
      prompt: Heap Snapshot cho thấy có hàng triệu instance của `EventEmitter` và
        `Closure` được giữ bởi mảng listener của kết nối WebSocket không được cleanup.
        Bạn tìm nguyên nhân ở đâu?
      options:
      - key: q2_o10
        label: Kiểm tra mã nguồn xử lý sự kiện `disconnect` của WebSocket trong các
          Pull Request mới phát hành
      - key: q2_o11
        label: 'Tăng giới hạn listener: `EventEmitter.defaultMaxListeners = 100`'
      - key: q2_o12
        label: Đổi base Docker image từ `node:18-alpine` sang `node:18-slim`
    - key: q2_n5
      prompt: 'Bạn phát hiện PR #402 đăng ký event `socket.on(''data'', handler)`
        mỗi khi client kết nối nhưng không gọi `socket.removeListener()` khi ngắt
        kết nối. Bạn chọn giải pháp sửa mã nguồn nào?'
      options:
      - key: q2_o13
        label: Thêm cleanup logic `socket.removeListener` trong event handler `close`
          / `error` hoặc dùng Stream `pipeline`
      - key: q2_o14
        label: 'Rollback tạm thời PR #402 về phiên bản ổn định trước đó'
      - key: q2_o15
        label: Bọc toàn bộ đoạn code đăng ký event trong khối `try ... catch`
    - key: q2_n6
      prompt: Trong khi chờ build và test image hotfix, bạn thực hiện hành động gì
        trên cluster để duy trì dịch vụ?
      options:
      - key: q2_o16
        label: Rollback Deployment Kubernetes về tag image ổn định trước đó (`v2.1.0`)
      - key: q2_o17
        label: Chặn toàn bộ kết nối WebSocket mới bằng Cloudflare WAF
      - key: q2_o18
        label: Scale down số lượng replicas của API Gateway về 1 pod
    - key: q2_n7
      prompt: Bản hotfix `v2.1.2-hotfix` đã build xong. Bạn triển khai kiểm thử và
        phát hành bản vá như thế nào?
      options:
      - key: q2_o19
        label: Deploy dạng Canary/Staging, chạy load test và theo dõi đồ thị Heap
          RAM ổn định trước khi rollout 100%
      - key: q2_o20
        label: Deploy thẳng 100% bản hotfix lên Production ngay lập tức
      - key: q2_o21
        label: Deploy bản vá và flush toàn bộ dữ liệu trong Redis Cluster
    - key: q2_n8
      prompt: Sau khi rollout bản hotfix `v2.1.2-hotfix`, RAM của các pod giữ nguyên
        ở mức 150MB phẳng định (flatline) dù lượng kết nối đạt 100k connection. Việc
        làm nào hoàn tất quy trình?
      options:
      - key: q2_o22
        label: Xác nhận độ ổn định trong 30 phút, viết bài Post-mortem và thêm linter
          rule bắt buộc cleanup event listener
      - key: q2_o23
        label: Đóng ticket ngay khi vừa thấy pod hết bị OOMKilled mà không theo dõi
          thêm
      - key: q2_o24
        label: Giữ nguyên cấu hình Memory Limit 4Gi cho các pod về sau
    - key: q2_resolved
      prompt: Sự cố Memory Leak đã được giải quyết triệt để. Hệ thống Real-time chạy
        ổn định.
      options: []
