- content:
    scenario: Dịch vụ gRPC user-profile-service chạy trên Kubernetes liên tục bị khởi
      động lại (CrashLoopBackOff). Cảnh báo báo về do container bị hệ thống dọn dẹp
      bộ nhớ ngắt khẩn cấp.
    initial_logs: 'k8s-pod-user-profile-7d9b4-x2z11 readiness probe failed. Container
      user-profile terminated with exit code 137 (OOMKilled). Limit: 1Gi.'
    nodes:
    - key: s2_n1
      prompt: Pod dịch vụ người dùng bị crash liên tục với lỗi OOMKilled (Exit Code
        137). Bạn chọn bước đầu tiên để điều tra là gì?
      options:
      - key: s2_n1_o1
        label: Chạy kubectl describe pod và kiểm tra biểu đồ memory metrics trên Prometheus.
      - key: s2_n1_o2
        label: Xóa hẳn Deployment và apply lại từ file YAML gốc.
      - key: s2_n1_o3
        label: Reboot toàn bộ Kubernetes worker node.
    - key: s2_n1_o3_node
      prompt: Node đang bị reboot...
      options: []
    - key: s2_n2
      prompt: Biểu đồ Memory Usage tăng đều đặn theo thời gian cho tới khi chạm mốc
        1Gi limit rồi crash. Bước phân tích sâu tiếp theo là gì?
      options:
      - key: s2_n2_o1
        label: Bật Go pprof endpoint để thu thập heap profile trước khi Pod bị dọn
          dẹp.
      - key: s2_n2_o2
        label: Tắt bớt readinessProbe và livenessProbe trong K8s deployment.
      - key: s2_n2_o3
        label: Nâng RAM Limit lên 64GiB mà không kiểm tra thêm.
    - key: s2_n3
      prompt: Bạn đã thu được file heap profile của Go application. Phương pháp kiểm
        tra dữ liệu profiling hiệu quả nhất là gì?
      options:
      - key: s2_n3_o1
        label: Dùng câu lệnh 'go tool pprof -top' để tìm struct/object chiếm bộ nhớ
          lớn nhất.
      - key: s2_n3_o2
        label: Đọc lướt qua toàn bộ source code Go bằng tay.
      - key: s2_n3_o3
        label: Chạy thử nghiệm load test cực lớn trực tiếp trên môi trường Production.
    - key: s2_n4
      prompt: Kết quả pprof chỉ ra map sessionCache giữ đến 85% bộ nhớ và không có
        cơ chế xóa bớt phần tử. Để khắc phục tạm thời cho dịch vụ hoạt động, bạn chọn
        giải pháp nào?
      options:
      - key: s2_n4_o1
        label: Tạm thời tăng RAM limit từ 1Gi lên 3Gi trong K8s Deployment và giảm
          thời gian TTL qua ConfigMap.
      - key: s2_n4_o2
        label: Tắt hoàn toàn user-profile-service trong vài giờ.
      - key: s2_n4_o3
        label: Tạo một CronJob tự động kill pod mỗi 3 phút.
    - key: s2_n5
      prompt: Nâng RAM limit giúp pod bớt crash hơn nhưng memory vẫn tăng không dừng.
        Cách xử lý tận gốc vấn đề trong mã nguồn là gì?
      options:
      - key: s2_n5_o1
        label: Thay thế Go map bằng thư viện LRU Cache có cấu hình capacity cố định
          va TTL tự động.
      - key: s2_n5_o2
        label: Chuyển dữ liệu sessionCache lưu tạm vào ổ đĩa cục bộ của Pod.
      - key: s2_n5_o3
        label: Gọi hàm runtime.GC() liên tục mỗi 100 millisecond trong code.
    - key: s2_n6
      prompt: Đội dev đã code xong bản sửa lỗi dùng LRU Cache. Quy trình kiểm thử
        và cập nhật hệ thống như thế nào để đảm bảo an toàn?
      options:
      - key: s2_n6_o1
        label: Chạy unit test, load test ở Staging và triển khai dạng Canary Rollout
          20% traffic.
      - key: s2_n6_o2
        label: Merge thẳng vào branch main và push trực tiếp lên Production.
      - key: s2_n6_o3
        label: Thực hiện deploy thay thế toàn bộ 100% các pod cùng một lúc trong giờ
          cao điểm.
    - key: s2_n7
      prompt: Bản Canary rollout (20% traffic) đã chạy được 15 phút. Bạn theo dõi
        những chỉ số nào để quyết định mở rộng ra toàn bộ cluster?
      options:
      - key: s2_n7_o1
        label: Kiểm tra biểu đồ Memory của Canary Pod (điều hòa quanh 200MB) và gRPC
          error rate bằng 0.
      - key: s2_n7_o2
        label: Chỉ quan sát CPU usage của pod mà không cần bận tâm RAM.
      - key: s2_n7_o3
        label: Hạ RAM limit của Canary pod xuống 64MB để thử sức chịu đựng.
    - key: s2_n8
      prompt: Toàn bộ cluster đã được cập nhật bản fix LRU Cache. Mức sử dụng bộ nhớ
        ổn định phẳng ở mức 220MB, hoàn toàn không còn tình trạng OOMKilled.
      options:
      - key: s2_n8_o1
        label: Xác nhận sự cố hoàn tất, cập nhật tài liệu Caching Best Practices cho
          đội ngũ phát triển.
      - key: s2_n8_o2
        label: Giữ nguyên RAM limit 3Gi vô thời hạn mà không điều chỉnh lại theo thực
          tế.
      - key: s2_n8_o3
        label: Rollback lại phiên bản cũ để kiểm tra lại lỗi memory leak.
