      - key: s2_n7_o2
        label: Deploy trực tiếp lên Production mà không cần đo đạc memory sau deploy.
      - key: s2_n7_o3
        label: Tắt toàn bộ hệ thống Monitoring và Logging để tiết kiệm CPU cho server.
    - key: s2_n8
      prompt: Lượng Memory tiêu thụ ổn định ở mức thấp ngay cả khi tải cao. Sự cố
        Memory Leak đã được khắc phục hoàn toàn. Hành động khắc phục hậu quả bài học
