- content:
    scenario: Hệ thống Payment Gateway báo lỗi HTTP 500 hàng loạt khi người dùng thực
      hiện thanh toán. Tỷ lệ lỗi tăng đột biến lên 45% trong vòng 5 phút qua.
    initial_logs: |-
      [2023-10-24 10:15:02] ERROR [payment-service] [http-nio-8080-exec-12] c.e.p.c.PaymentController: Failed to process checkout. Exception: io.lettuce.core.RedisConnectionException: Connection pool exhausted, cannot acquire connection within timeout 3000ms
      [2023-10-24 10:15:03] ERROR [payment-service] [http-nio-8080-exec-18] c.e.p.s.RedisCacheService: Could not get resource from pool. Active: 100, Idle: 0, MaxTotal: 100
    nodes:
    - key: S1_N1
      prompt: 'Bước 1: Bạn vừa nhận cảnh báo khẩn cấp từ hệ thống giám sát. Hành động
        đầu tiên của bạn là gì?'
      options:
      - key: S1_O1_1
        label: Kiểm tra Metric HTTP status code và Error Rate trên Grafana dashboard
          để xác định quy mô sự cố.
      - key: S1_O1_2
        label: Restart toàn bộ Kubernetes Cluster lập tức để giải phóng tài nguyên.
      - key: S1_O1_3
        label: SSH trực tiếp vào server app để xem thông số CPU/RAM tổng thể.
    - key: S1_N2
      prompt: 'Bước 2: Metric cho thấy lỗi chỉ tập trung ở service Payment Gateway.
        Bạn cần làm gì để thu hẹp nguyên nhân?'
      options:
      - key: S1_O2_1
        label: Lọc log của Payment Gateway theo keyword 'Connection pool' và 'Timeout'.
      - key: S1_O2_2
        label: Đọc toàn bộ file access log của Nginx Reverse Proxy từ đầu ngày.
      - key: S1_O2_3
        label: Xóa toàn bộ database cache trong PostgreSQL.
    - key: S1_N3
      prompt: 'Bước 3: Log chỉ ra Redis Connection Pool bị cạn kiệt (100/100 active
        connections). Bạn kiểm tra Redis ra sao?'
      options:
      - key: S1_O3_1
        label: Kiểm tra biểu đồ Redis Active Connections và Client Connections trên
          Grafana.
      - key: S1_O3_2
        label: Tăng ngay dung lượng RAM cho Redis Instance trên Cloud Console.
      - key: S1_O3_3
        label: Tắt Redis Server để ứng dụng tự nhảy sang dùng Database.
    - key: S1_N4
      prompt: 'Bước 4: Grafana cho thấy Redis CPU chỉ 15%, RAM mới dùng 30% nhưng
        Connection Count chạm mốc max 100 và không hề giảm. Điều này báo hiệu vấn
        đề gì?'
      options:
      - key: S1_O4_1
        label: Rò rỉ connection (Connection Leak) - code không đóng hoặc nhả connection
          về pool sau khi dùng.
      - key: S1_O4_2
        label: Tăng maxclients của Redis server lên 10,000 ngay lập tức.
      - key: S1_O4_3
        label: Thực hiện lệnh FLUSHALL trên Redis để xóa bớt dữ liệu.
    - key: S1_N5
      prompt: 'Bước 5: Bạn nghi ngờ có bug rò rỉ connection trong code mới deploy.
        Bạn thực hiện kiểm tra như thế nào?'
      options:
      - key: S1_O5_1
        label: Kiểm tra Git commit lịch sử gần nhất liên quan đến Redis Cache Helper.
      - key: S1_O5_2
        label: Chạy lại bộ Unit Test của module Payment trên môi trường Local.
      - key: S1_O5_3
        label: Rollback toàn bộ Database Schema về phiên bản tuần trước.
    - key: S1_N6
      prompt: 'Bước 6: Phát hiện commit 2 tiếng trước thiếu khối try-finally/try-with-resources
        khi gọi Redis client. Cách khắc phục nhanh nhất là gì?'
      options:
      - key: S1_O6_1
        label: Tăng tạm max-active connection pool trong config và viết Hotfix bổ
          sung try-finally để release connection.
      - key: S1_O6_2
        label: Scale out Pods của Payment Gateway từ 3 lên 30 Pods mà không sửa code.
      - key: S1_O6_3
        label: Chuyển tạm toàn bộ lưu lượng thanh toán sang cổng API thanh toán dự
          phòng.
    - key: S1_N7
      prompt: 'Bước 7: Code Hotfix đã sẵn sàng và được kiểm thử nhanh trên Staging.
        Quy trình deploy lên Production như thế nào là an toàn?'
      options:
      - key: S1_O7_1
        label: Deploy theo chiến lược Canary 10% traffic, theo dõi Connection Pool
          metric trước khi rollout 100%.
      - key: S1_O7_2
        label: Deploy đồng loạt 100% Pods cùng lúc vào giữa giờ cao điểm.
      - key: S1_O7_3
        label: Rollback bản build về phiên bản từ 3 tháng trước.
    - key: S1_N8
      prompt: 'Bước 8: Bản Hotfix đã hoàn tất deployment. Bạn kiểm tra lại hệ thống
        như thế nào để đóng sự cố?'
      options:
      - key: S1_O8_1
        label: Xác nhận Redis Connection Count ổn định ở mức thấp, Error Rate về 0%
          và HTTP 200 khôi phục.
      - key: S1_O8_2
        label: Đóng Ticket sự cố ngay mà không cần kiểm tra thêm metric.
      - key: S1_O8_3
        label: Xóa bớt Pods ứng dụng để tiết kiệm chi phí server.
  answer_key:
    option_effects:
      S1_O1_1:
        points: 10
        minutes_cost: 1
        next_node: S1_N2
        explanation: Chính xác. Kiểm tra Dashboard tổng quan giúp xác định đúng phạm
