        là gì?
      options:
      - key: q2_n4_o1
        label: Thực thi CREATE INDEX CONCURRENTLY idx_inventory_product_id ON inventory(product_id);
      - key: q2_n4_o2
        label: Thực thi DROP TABLE inventory rồi CREATE TABLE lại.
      - key: q2_n4_o3
        label: Thực thi CREATE INDEX trong một Transaction lớn cùng lệnh UPDATE.
