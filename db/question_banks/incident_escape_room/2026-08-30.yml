      S1_O2_1:
        points: 10
        minutes_cost: 1
        next_node: S1_N3
        explanation: Chính xác. Lọc log theo keyword lỗi giúp khoanh vùng nguyên nhân
          nhanh nhất.
      S1_O2_2:
        points: 5
        minutes_cost: 4
        next_node: S1_N3
        explanation: Access log chỉ cho biết HTTP status code chứ không rõ lỗi chi
          tiết từ code bên trong.
      S1_O2_3:
        points: 0
        minutes_cost: 7
        next_node: S1_N2
        explanation: Thao tác sai và nguy hiểm. Lỗi đang nằm ở Redis connection pool
          chứ không phải DB cache.
      S1_O3_1:
        points: 10
        minutes_cost: 1
        next_node: S1_N4
        explanation: Chính xác. Metric kết nối giúp xác định sự cố do quá tải thật
          hay do treo kết nối.
      S1_O3_2:
        points: 5
        minutes_cost: 5
        next_node: S1_N4
        explanation: Tăng RAM không giải quyết được vấn đề cạn kiệt connection pool.
      S1_O3_3:
        points: 0
        minutes_cost: 6
        next_node: S1_N3
        explanation: Tắt Redis gây nghẽn nghiêm trọng Database chính dưới tải cao.
      S1_O4_1:
        points: 10
        minutes_cost: 2
        next_node: S1_N5
        explanation: Phân tích chính xác. Dấu hiệu connection tăng tối đa nhưng CPU/RAM
          thấp là điển hình của Connection Leak.
      S1_O4_2:
        points: 5
        minutes_cost: 4
        next_node: S1_N5
        explanation: Tăng maxclients chỉ kéo dài thời gian trước khi pool tiếp tục
          bị lấp đầy bởi connection rò rỉ.
      S1_O4_3:
        points: 0
        minutes_cost: 6
        next_node: S1_N4
        explanation: FLUSHALL xóa sạch dữ liệu cache nhưng không đóng các kết nối
          đang bị rò rỉ.
      S1_O5_1:
        points: 10
        minutes_cost: 1
        next_node: S1_N6
        explanation: Chính xác. Kiểm tra git blame ở đoạn code xử lý Redis giúp tìm
          ra ngay đoạn code không đóng connection.
      S1_O5_2:
        points: 5
        minutes_cost: 4
        next_node: S1_N6
        explanation: Unit test thông thường ít khi phát hiện lỗi connection leak do
          lượng request test quá nhỏ.
      S1_O5_3:
        points: 0
        minutes_cost: 8
        next_node: S1_N5
        explanation: Lỗi ở ứng dụng gọi Redis, không liên quan đến Database Schema.
      S1_O6_1:
        points: 10
        minutes_cost: 2
        next_node: S1_N7
        explanation: Quyết định chuẩn xác. Tăng tạm config giúp giảm áp lực ngay,
          kết hợp code hotfix đúng nguyên nhân.
      S1_O6_2:
        points: 0
        minutes_cost: 7
        next_node: S1_N6
        explanation: Scale out Pods khi đang bị leak connection sẽ khiến số lượng
          kết nối tới Redis bùng nổ, làm sập luôn Redis server.
      S1_O6_3:
        points: 5
        minutes_cost: 5
        next_node: S1_N7
        explanation: Chuyển cổng thanh toán tốn nhiều cấu hình rủi ro và tốn thời
          gian không cần thiết.
      S1_O7_1:
        points: 10
        minutes_cost: 3
        next_node: S1_N8
        explanation: Chính xác. Deploy Canary giúp giảm thiểu rủi ro nếu bản hotfix
          có phát sinh tác động phụ.
      S1_O7_2:
        points: 5
        minutes_cost: 4
        next_node: S1_N8
        explanation: Deploy 100% cùng lúc trong giờ cao điểm có thể gây gián đoạn
          kết nối ngắn hạn cho toàn bộ người dùng.
      S1_O7_3:
        points: 0
        minutes_cost: 9
        next_node: S1_N7
        explanation: Rollback quá sâu làm mất nhiều tính năng kinh doanh mới và không
          cần thiết.
      S1_O8_1:
        points: 10
        minutes_cost: 1
        next_node: S1_RECOVERY
        explanation: Tuyệt vời! Bạn đã xác nhận đầy đủ các chỉ số an toàn và khắc
          phục sự cố thành công.
      S1_O8_2:
        points: 5
        minutes_cost: 3
        next_node: S1_RECOVERY
        explanation: Thiếu bước xác nhận metric, nhưng sự cố thực tế đã được giải
          quyết xong.
      S1_O8_3:
        points: 0
        minutes_cost: 6
        next_node: S1_N8
        explanation: Xóa Pod quá sớm khi hệ thống chưa ổn định hoàn toàn có thể gây
          nghẽn tải trở lại.
    recovery_node: S1_RECOVERY
  difficulty: medium
- content:
    scenario: Trong sự kiện Flash Sale, hệ thống đặt hàng báo lỗi HTTP 504 Gateway
      Timeout liên tục. Khách hàng không thể bấm hoàn tất đơn hàng.
    initial_logs: |-
      [2023-11-11 00:02:11] WARN [order-service] [HikariPool-1 - Connection is not available, request timed out after 30000ms]
      [2023-11-11 00:02:15] ERROR [order-service] [http-nio-8080-exec-45] c.e.o.s.OrderService: Transaction rolled back. org.postgresql.util.PSQLException: ERROR: deadlock detected
        Detail: Process 14205 waits for ShareLock on transaction 88412; blocked by process 14210.
        Process 14210 waits for ExclusiveLock on tuple (42,11) of relation 'inventory'; blocked by process 14205.
    nodes:
    - key: S2_N1
      prompt: 'Bước 1: Cảnh báo 504 bùng nổ trong chương trình Flash Sale. Bạn bắt
        đầu kiểm tra từ đâu?'
      options:
      - key: S2_O1_1
        label: Mở APM Traces để phân tích thời gian phản hồi và truy vấn chậm nhất
          ở API checkout.
      - key: S2_O1_2
        label: Tăng Nginx timeout từ 60 giây lên 300 giây để chờ request hoàn tất.
      - key: S2_O1_3
        label: Kiểm tra băng thông đường truyền mạng của Load Balancer.
    - key: S2_N2
      prompt: 'Bước 2: APM cho thấy kết nối tới PostgreSQL Database bị treo hoàn toàn,
        HikariCP connection pool cạn kiệt. Bạn kiểm tra DB ra sao?'
      options:
      - key: S2_O2_1
        label: Truy vấn pg_stat_activity để xem các query đang ở trạng thái active
          và waiting lock.
      - key: S2_O2_2
        label: Tăng maximum-pool-size của HikariCP lên 500 ngay trong cấu hình ứng
          dụng.
      - key: S2_O2_3
        label: Reboot máy chủ PostgreSQL để giải phóng tài nguyên.
    - key: S2_N3
      prompt: 'Bước 3: pg_stat_activity cho thấy hàng chục tiến trình đang chờ Lock
        lẫn nhau trên bảng ''inventory'' và ''order_item''. Bạn làm gì tiếp theo?'
      options:
      - key: S2_O3_1
        label: Truy vấn pg_locks kết hợp pg_stat_activity để vẽ cây phụ thuộc lock
          giữa các PID.
      - key: S2_O3_2
        label: Chạy lệnh VACUUM FULL toàn bộ Database.
      - key: S2_O3_3
        label: Kill tất cả active connection tới PostgreSQL bằng pg_terminate_backend.
    - key: S2_N4
      prompt: 'Bước 4: Bạn phát hiện Transaction A giữ Lock ''inventory'' rồi xin
        Lock ''order_item'', trong khi Transaction B giữ Lock ''order_item'' rồi xin
        Lock ''inventory''. Vấn đề gốc rễ là gì?'
      options:
      - key: S2_O4_1
        label: Xung đột thứ tự khóa tài nguyên (Out-of-order locking) gây ra Deadlock
          tuần hoàn.
      - key: S2_O4_2
        label: Thiếu Index trên bảng inventory làm câu lệnh UPDATE bị chậm.
      - key: S2_O4_3
        label: Số lượng Read Replica không đủ đáp ứng lượt đọc.
    - key: S2_N5
      prompt: 'Bước 5: Làm sao để triệt tiêu vĩnh viễn nguy cơ Deadlock thứ tự khóa
        này trong mã nguồn?'
      options:
      - key: S2_O5_1
        label: 'Áp dụng chiến lược Lock theo thứ tự cố định (Resource Ordering): Luôn
          lock các item theo ID tăng dần.'
      - key: S2_O5_2
        label: Bỏ hoàn toàn DB Transaction, bật Auto-commit cho từng câu SQL.
      - key: S2_O5_3
        label: Thêm từ khóa FOR UPDATE cho tất cả câu SELECT trong toàn hệ thống.
    - key: S2_N6
      prompt: 'Bước 6: Trong lúc chờ viết code fix, bạn cần hành động ngay lập tức
        để hệ thống thông suốt trở lại. Bạn chọn cách nào?'
      options:
      - key: S2_O6_1
        label: Terminate các PID đang bị deadlock bằng pg_cancel_backend và bật Rate
          Limiting tạm thời ở API Gateway.
      - key: S2_O6_2
        label: Tắt hoàn toàn tính năng Flash Sale để ngừng nhận đơn mới.
      - key: S2_O6_3
        label: Xóa tất cả Ràng buộc Khóa ngoại (Foreign Keys) trên cơ sở dữ liệu.
    - key: S2_N7
      prompt: 'Bước 7: Bản sửa code sắp xếp thứ tự lock tài nguyên đã hoàn thành.
        Bạn triển khai bản vá như thế nào?'
      options:
      - key: S2_O7_1
        label: Tạo bản Hotfix build qua CI/CD pipeline và thực hiện Rolling Update
          từng phần.
      - key: S2_O7_2
        label: Sửa trực tiếp file jar/class trên server Production không cần qua CI/CD.
      - key: S2_O7_3
        label: Chạy script SQL cập nhật dữ liệu thủ công trong DB trước khi deploy.
    - key: S2_N8
      prompt: 'Bước 8: Deploy hoàn tất. Bạn đánh giá hiệu quả phục hồi hệ thống ra
        sao?'
      options:
      - key: S2_O8_1
        label: Theo dõi DB Active Connections, Deadlock Count và latency API checkout
          trên Grafana trong 5 phút.
      - key: S2_O8_2
        label: Tắt công cụ giám sát để đỡ tốn CPU server.
      - key: S2_O8_3
        label: Gửi email thông báo khắc phục thành công mà không cần kiểm tra metric.
  answer_key:
    option_effects:
      S2_O1_1:
        points: 10
        minutes_cost: 1
        next_node: S2_N2
        explanation: Chính xác. APM Traces giúp định vị ngay bottleneck nằm ở tầng
          DB hay Application.
      S2_O1_2:
        points: 0
        minutes_cost: 7
        next_node: S2_N1
        explanation: Tăng timeout làm các kết nối bị treo lâu hơn, khiến hệ thống
          cạn kiệt socket nhanh hơn.
      S2_O1_3:
        points: 5
        minutes_cost: 3
        next_node: S2_N2
        explanation: Kiểm tra băng thông không sai nhưng không đúng bản chất khi lỗi
          trả về là 504 do backend xử lý chậm.
      S2_O2_1:
        points: 10
        minutes_cost: 1
        next_node: S2_N3
        explanation: Chính xác. pg_stat_activity là công cụ số 1 để soi các query
          đang bị nghẽn trong Postgres.
      S2_O2_2:
        points: 5
        minutes_cost: 4
        next_node: S2_N3
        explanation: Tăng connection pool khi DB đang bị Lock chỉ khiến số lượng thread
          bị khóa tăng lên gấp bội.
      S2_O2_3:
        points: 0
        minutes_cost: 9
        next_node: S2_N2
        explanation: Reboot DB giữa lúc Flash Sale làm gián đoạn toàn bộ hệ thống
          và nguy cơ mất mát transaction đang dở dang.
      S2_O3_1:
        points: 10
        minutes_cost: 1
        next_node: S2_N4
        explanation: Chính xác. Bảng pg_locks cung cấp thông tin chi tiết về tiến
          trình nào đang giữ lock và tiến trình nào đang chờ.
      S2_O3_2:
        points: 0
        minutes_cost: 10
        next_node: S2_N3
        explanation: VACUUM FULL sẽ khóa toàn bộ bảng, khiến sự cố trở nên tồi tệ
          hơn gấp nhiều lần.
      S2_O3_3:
        points: 5
        minutes_cost: 4
        next_node: S2_N4
        explanation: Kill sạch connection tạm thời giải phóng nghẽn nhưng sẽ ngay
          lập tức bị lại khi traffic đổ vào.
      S2_O4_1:
        points: 10
        minutes_cost: 2
        next_node: S2_N5
        explanation: Chuẩn xác! Thứ tự xin khóa không đồng nhất giữa các transaction
          là nguyên nhân kinh điển gây Deadlock.
      S2_O4_2:
        points: 0
        minutes_cost: 6
        next_node: S2_N4
        explanation: Lỗi ở đây là Deadlock do thứ tự lock, không phải do thiếu index
          truy vấn chậm.
      S2_O4_3:
        points: 5
        minutes_cost: 4
        next_node: S2_N5
        explanation: Read Replica chỉ phục vụ các truy vấn SELECT, không giải quyết
          được xung đột WRITE lock.
      S2_O5_1:
        points: 10
        minutes_cost: 1
        next_node: S2_N6
        explanation: 'Tuyệt vời. Sắp xếp tài nguyên theo thứ tự ưu tiên (vd: ID tăng
          dần) ngăn chặn triệt để vòng lặp phụ thuộc lock.'
      S2_O5_2:
        points: 0
        minutes_cost: 8
        next_node: S2_N5
        explanation: Bỏ Transaction sẽ dẫn đến bất tin cậy dữ liệu (Data Inconsistency)
          nghiêm trọng khi đặt hàng.
      S2_O5_3:
        points: 5
        minutes_cost: 5
        next_node: S2_N6
        explanation: Lạm dụng FOR UPDATE làm giảm hiệu năng hệ thống không cần thiết.
      S2_O6_1:
        points: 10
        minutes_cost: 2
        next_node: S2_N7
        explanation: Quyết định xử lý sự cố rất tốt! Giải phóng lock nghẽn và giới
          hạn tải để hệ thống phục hồi từng bước.
      S2_O6_2:
        points: 5
        minutes_cost: 4
        next_node: S2_N7
        explanation: Tắt Flash sale giúp hết lỗi nhưng gây thiệt hại doanh thu trực
          tiếp cho doanh nghiệp.
      S2_O6_3:
        points: 0
        minutes_cost: 9
        next_node: S2_N6
        explanation: Xóa Foreign Key làm hỏng tính toàn vẹn dữ liệu và không sửa được
          bản chất lỗi deadlock.
      S2_O7_1:
        points: 10
        minutes_cost: 3
        next_node: S2_N8
        explanation: Chính xác. Luôn luôn dùng CI/CD và Rolling update để đảm bảo
          tính nhất quán của code.
      S2_O7_2:
        points: 0
        minutes_cost: 7
        next_node: S2_N7
        explanation: Sửa code trực tiếp trên Production vô cùng rủi ro và vi phạm
          quy trình vận hành.
      S2_O7_3:
        points: 5
        minutes_cost: 5
        next_node: S2_N8
        explanation: Chạy script tay tốn thời gian và dễ nhầm lẫn dữ liệu trong lúc
          cao điểm.
      S2_O8_1:
        points: 10
        minutes_cost: 1
        next_node: S2_RECOVERY
        explanation: Rất xuất sắc! Theo dõi đa chiều giúp xác nhận sự cố Deadlock
          đã được giải quyết triệt để.
      S2_O8_2:
        points: 0
        minutes_cost: 6
        next_node: S2_N8
        explanation: Tắt monitoring làm hệ thống bị 'mù' thông tin nếu sự cố tái diễn.
      S2_O8_3:
        points: 5
        minutes_cost: 3
        next_node: S2_RECOVERY
        explanation: Sự cố đã hết nhưng thông báo khi chưa verify metric là chưa chuẩn
          quy trình SRE.
    recovery_node: S2_RECOVERY
  difficulty: hard
- content:
    scenario: Sự cố cổng thanh toán bị treo dây chuyền. Khách hàng thực hiện giao
      dịch bị lỗi 504 Gateway Timeout liên tục. Hệ thống ghi nhận tỷ lệ lỗi lên tới
      65% trên toàn bộ Payment Service.
    initial_logs: |-
      [ERROR] HikariPool-1 - Connection is not available, request timed out after 30000ms.
      [WARN] Active connections: 50/50, Idle: 0, Waiting: 142.
      [ERROR] org.springframework.transaction.CannotCreateTransactionException: Could not open JPA EntityManager for transaction.
    nodes:
    - key: q1_node1
      prompt: Hệ thống báo lỗi 504 Gateway Timeout liên tục tại Payment Service. Bạn
        sẽ làm gì đầu tiên để chẩn đoán?
      options:
      - key: q1_opt1
        label: Kiểm tra DB active connections và danh sách long-running queries trên
          cơ sở dữ liệu.
      - key: q1_opt2
        label: Restart ngay lập tức tất cả instance của Payment Service.
      - key: q1_opt3
        label: Tăng thêm RAM/CPU cho Pod Payment Service trên Kubernetes.
    - key: q1_node2
      prompt: Kết quả kiểm tra cho thấy Hikari Connection Pool bị cạn kiệt (50/50
        active connections) và 140+ request đang xếp hàng chờ connection. Bước tiếp
        theo là gì?
      options:
      - key: q1_opt4
        label: Trích xuất Thread Dump của Payment Service để xem các thread đang nghẽn
          ở đâu.
      - key: q1_opt5
        label: Sửa ConfigMap tăng maximumPoolSize của HikariPool từ 50 lên 200.
      - key: q1_opt6
        label: Chạy lệnh kill toàn bộ connection DB đang mở từ phía PostgreSQL.
    - key: q1_node3
      prompt: Thread dump chỉ ra hàng loạt thread bị block ở ThirdPartyPayClient.callWebhook()
        nằm bên trong phương thức có annotation @Transactional. Đánh giá nguyên nhân?
      options:
      - key: q1_opt7
        label: 'Xác định lỗi thiết kế: Gọi API HTTP bên ngoài trong DB Transaction
          làm giữ DB connection quá lâu.'
      - key: q1_opt8
        label: Do Database Isolation Level đang để ở mức quá cao.
      - key: q1_opt9
        label: Do timeout của ThirdPartyPayClient quá ngắn nên cần tăng lên 60 giây.
    - key: q1_node4
      prompt: Cần hành động ứng phó khẩn cấp để xả nghẽn cho hệ thống trong khi chờ
        sửa code. Phương án nào tối ưu?
      options:
      - key: q1_opt10
        label: Bật Feature Flag ngắt synchronous webhook callback, chuyển tạm sang
          xử lý qua Async Queue.
      - key: q1_opt11
        label: Thêm annotation @Async trực tiếp vào hàm gọi webhook mà không thay
          đổi @Transactional.
      - key: q1_opt12
        label: Bật chế độ bảo trì toàn bộ ứng dụng để ngắt kết nối người dùng.
    - key: q1_node5
      prompt: Sau khi bật Feature Flag Async Queue, lượng waiting connection giảm
        mạnh. Bạn thực hiện kiểm tra nào để đảm bảo hệ thống đã an toàn?
      options:
      - key: q1_opt13
        label: Theo dõi Hikari metrics và HTTP status code 200/500 trên dashboard
          Grafana.
      - key: q1_opt14
        label: Xóa toàn bộ Cache Redis của hệ thống thanh toán.
      - key: q1_opt15
        label: Tăng số lượng Pod replica lên gấp 3 lần ngay lập tức.
    - key: q1_node6
      prompt: Hệ thống đã tạm ổn định. Giờ cần chuẩn bị bản Hotfix code để khắc phục
        triệt để. Giải pháp refactor nào đúng?
      options:
      - key: q1_opt16
        label: Tách API call ra ngoài @Transactional và bọc bằng Circuit Breaker với
          TimeLimiter.
      - key: q1_opt17
        label: Giữ nguyên @Transactional nhưng bọc API call trong khối try-catch.
      - key: q1_opt18
        label: Chuyển toàn bộ cơ sở dữ liệu sang NoSQL để tránh giới hạn connection.
    - key: q1_node7
      prompt: Bản Hotfix đã được code và build xong Docker Image. Quy trình triển
        khai sản phẩm an toàn là gì?
      options:
      - key: q1_opt19
        label: Deploy Rolling Update / Canary deploy vào Kubernetes Production cluster.
      - key: q1_opt20
        label: Chạy trực tiếp script SQL trên DB Master trước khi deploy app.
      - key: q1_opt21
        label: Restart đồng loạt tất cả các Node Worker trong cụm Kubernetes.
    - key: q1_node8
      prompt: Hotfix đã lên Production thành công, latency trả về bình thường (<200ms),
        DB active connection ở mức 15%. Bước hoàn tất sự cố là gì?
      options:
      - key: q1_opt22
        label: Tắt dần Feature Flag tạm thời, xác nhận hệ thống hoàn toàn ổn định
          và đóng incident.
      - key: q1_opt23
        label: Giữ nguyên Feature Flag tạm thời mà không cần kiểm tra lại.
      - key: q1_opt24
        label: Rollback lại phiên bản code cũ ban đầu.
    - key: q1_recovery
      prompt: Sự cố đã được khắc phục hoàn toàn. Hệ thống thanh toán đã hoạt động
        ổn định trở lại.
      options:
      - key: q1_opt25
        label: Xác nhận hoàn tất bài tập.
  answer_key:
    option_effects:
      q1_opt1:
        points: 10
        minutes_cost: 1
        next_node: q1_node2
        explanation: Chính xác! Kiểm tra connection pool và long-running queries giúp
          xác định ngay tình trạng nghẽn tài nguyên cơ sở dữ liệu.
      q1_opt2:
        points: 5
        minutes_cost: 4
        next_node: q1_node2
        explanation: Restart giúp giải phóng connection tạm thời nhưng không giải
          quyết gốc rễ vấn đề, connection sẽ bị đầy lại nhanh chóng.
      q1_opt3:
        points: 0
        minutes_cost: 6
        next_node: q1_node2
        explanation: Tăng tài nguyên Pod không giải quyết được việc cạn kiệt DB Connection
          Pool.
      q1_opt4:
        points: 10
        minutes_cost: 1
        next_node: q1_node3
        explanation: Chính xác! Thread Dump phản ánh chính xác các thread đang bị
          ngưng trệ tại đâu trong mã nguồn.
      q1_opt5:
        points: 5
        minutes_cost: 3
        next_node: q1_node3
        explanation: Tăng pool size khi chưa biết nguyên nhân sẽ làm nghẽn DB server
          nặng hơn.
      q1_opt6:
        points: 0
        minutes_cost: 5
        next_node: q1_node3
        explanation: Kill connection bừa bãi gây gãy giao dịch của người dùng và làm
          lọt dữ liệu dở dang.
      q1_opt7:
        points: 10
        minutes_cost: 1
        next_node: q1_node4
        explanation: 'Chuẩn xác! Mẫu anti-pattern phổ biến: Gọi network I/O bên ngoài
          trong DB Transaction làm chiếm giữ DB connection lâu.'
      q1_opt8:
        points: 0
        minutes_cost: 4
        next_node: q1_node4
        explanation: Sai. Isolation level không phải là nguyên nhân chính gây đơ thread
          khi chờ HTTP response bên ngoài.
      q1_opt9:
        points: 0
        minutes_cost: 5
        next_node: q1_node4
        explanation: Tăng HTTP timeout chỉ làm thread bị block lâu hơn, khiến connection
          pool cạn kiệt nghiêm trọng hơn.
      q1_opt10:
        points: 10
        minutes_cost: 2
        next_node: q1_node5
        explanation: Xuất sắc! Chuyển sang Async xử lý bất đồng bộ ngắt sự phụ thuộc
          thời gian thực, giải phóng ngay DB connection.
      q1_opt11:
        points: 0
        minutes_cost: 5
        next_node: q1_node5
        explanation: 'Đó là lỗi Spring AOP proxying: Gọi hàm @Async từ cùng class
          hoặc trong transaction sẽ không có tác dụng bất đồng bộ.'
      q1_opt12:
        points: 5
        minutes_cost: 3
        next_node: q1_node5
        explanation: Bật bảo trì giúp chặn lỗi nhưng gây gián đoạn toàn bộ kinh doanh
          không cần thiết.
      q1_opt13:
        points: 10
        minutes_cost: 1
        next_node: q1_node6
        explanation: Đúng chuẩn! Kiểm tra Grafana dashboard xác nhận số connection
          hạ nhiệt và error rate giảm.
      q1_opt14:
        points: 0
        minutes_cost: 4
        next_node: q1_node6
        explanation: Xóa Redis cache không liên quan và có thể gây cache miss làm
          sập DB.
      q1_opt15:
        points: 5
        minutes_cost: 3
        next_node: q1_node6
        explanation: Tăng Pod khi nghẽn DB chỉ làm quá tải thêm DB Server.
      q1_opt16:
        points: 10
        minutes_cost: 2
        next_node: q1_node7
        explanation: Tối ưu nhất! Tách HTTP client ra khỏi Transaction và có Circuit
          Breaker bảo vệ hệ thống.
      q1_opt17:
        points: 0
        minutes_cost: 4
        next_node: q1_node7
        explanation: Try-catch không giúp giải phóng DB Connection nếu lệnh đó vẫn
          nằm trong phạm vi @Transactional.
      q1_opt18:
        points: 0
        minutes_cost: 7
        next_node: q1_node7
        explanation: Đổi DB đòi hỏi thay đổi kiến trúc lớn, không thể làm trong một
          bản hotfix khẩn cấp.
      q1_opt19:
        points: 10
        minutes_cost: 2
        next_node: q1_node8
        explanation: Triển khai Rolling Update giúp thay thế pod cũ bằng pod mới mà
          không gián đoạn dịch vụ.
      q1_opt20:
        points: 0
        minutes_cost: 5
        next_node: q1_node8
        explanation: Vấn đề ở ứng dụng, không cần can thiệp DDL/DML trực tiếp trên
          DB Master.
      q1_opt21:
        points: 0
        minutes_cost: 8
        next_node: q1_node8
        explanation: Restart Worker Node gây ngắt kết nối của nhiều dịch vụ khác không
          liên quan.
      q1_opt22:
        points: 10
        minutes_cost: 1
        next_node: q1_recovery
        explanation: Rất tốt! Khôi phục trạng thái chuẩn, gỡ bỏ cấu hình tạm và kết
          thúc xử lý sự cố.
      q1_opt23:
        points: 5
        minutes_cost: 3
        next_node: q1_recovery
        explanation: Để nguyên cấu hình tạm thời có thể ảnh hưởng tới tính nhất quán
          dữ liệu lâu dài.
      q1_opt24:
        points: 0
        minutes_cost: 6
        next_node: q1_node7
        explanation: Rollback lại code lỗi sẽ khiến sự cố tái diễn ngay lập tức.
      q1_opt25:
        points: 10
        minutes_cost: 0
        next_node: q1_recovery
        explanation: Hoàn tất.
    recovery_node: q1_recovery
  difficulty: medium
- content:
    scenario: Dịch vụ Quản lý Đơn hàng (Order Service) bị sập dây chuyền. CPU của
      Redis Cluster Node 1 nhảy vọt lên 100%. Latency API đặt hàng tăng từ 30ms lên
      15,000ms.
    initial_logs: |-
      [CRITICAL] Redis cluster node redis-01 CPU usage at 100%.
      [ERROR] io.lettuce.core.RedisCommandTimeoutException: Command timed out after 5000ms.
      [WARN] OrderService - Request queue depth exceeded limit (1000/1000).
    nodes:
    - key: q2_node1
      prompt: Redis Master CPU chạm mốc 100%, làm nghẽn toàn bộ dịch vụ đặt hàng.
        Bước phân tích đầu tiên của bạn là gì?
      options:
      - key: q2_opt1
        label: Mở Redis CLI chạy SLOWLOG GET 10 để tìm câu lệnh đang tốn CPU.
      - key: q2_opt2
        label: Restart ngay lập tức instance Redis Master bị 100% CPU.
      - key: q2_opt3
        label: Scale out tăng gấp đôi số lượng Pod Order Service.
    - key: q2_node2
      prompt: Slowlog xuất hiện lệnh 'KEYS order:user:*' được thực hiện liên tục với
        tần suất hàng chục lần/giây. Bạn đánh giá thế nào?
      options:
      - key: q2_opt4
        label: Lệnh KEYS là O(N), chạy đơn luồng trên Redis làm khoá toàn bộ các command
          khác.
      - key: q2_opt5
        label: Do Redis bị thiếu bộ nhớ RAM nên lệnh KEYS chạy chậm.
      - key: q2_opt6
        label: Do Redis Master chưa bật chế độ AOF Persistence.
    - key: q2_node3
      prompt: Kiểm tra log ứng dụng xác định lệnh KEYS đến từ CronJob 'OrderSyncWorker'
        chạy mỗi phút. Xử lý tức thời ra sao?
      options:
      - key: q2_opt7
        label: Suspend/Pause CronJob 'OrderSyncWorker' trên Kubernetes ngay lập tức.
      - key: q2_opt8
        label: Tăng thêm CPU limit cho Container Redis.
      - key: q2_opt9
        label: Xóa toàn bộ các key bắt đầu bằng order:user:* trên Redis.
    - key: q2_node4
      prompt: Đã ngắt CronJob, CPU Redis giảm về 40%, nhưng đơn hàng vẫn bị tắc nghẽn
        do bão request dồn dập (Cache Stampede). Cần làm gì?
      options:
      - key: q2_opt10
        label: Bật Rate Limiter và Circuit Breaker tại API Gateway để cản bão request.
      - key: q2_opt11
        label: Cho CronJob OrderSyncWorker chạy lại để đồng bộ bớt đơn.
      - key: q2_opt12
        label: Xóa Redis khỏi hệ thống để cho ứng dụng đọc trực tiếp DB Master.
    - key: q2_node5
      prompt: Hệ thống đã dừng sập hoàn toàn nhờ Circuit Breaker. Bây giờ cần giải
        quyết triệt để lệnh KEYS trong code OrderSyncWorker.
      options:
      - key: q2_opt13
        label: Thay lệnh KEYS bằng SCAN (concurrency/cursor based) hoặc lưu danh sách
          theo Redis Set.
      - key: q2_opt14
        label: Thay lệnh KEYS bằng lệnh MGET.
      - key: q2_opt15
        label: Tăng timeout của Redis client từ 5s lên 30s.
    - key: q2_node6
      prompt: Bản code tối ưu đã được test ở Staging (dùng Redis Set thay cho KEYS).
        Bạn chuẩn bị deploy hotfix thế nào?
      options:
      - key: q2_opt16
        label: Deploy Hotfix cho OrderSyncWorker và cập nhật cấu hình Redis data structure
          mới.
      - key: q2_opt17
        label: Xóa cấu hình Redis trong Pod deployment để app không dùng Redis nữa.
      - key: q2_opt18
        label: Un-suspend CronJob cũ trước rồi mới deploy code mới sau.
    - key: q2_node7
      prompt: Hotfix đã deploy thành công. Tình trạng Redis CPU giữ ở mức 10%. Làm
        thế nào để đưa dịch vụ phục vụ người dùng trở lại?
      options:
      - key: q2_opt19
        label: Nâng dần giới hạn Rate Limit ở API Gateway và khôi phục CronJob OrderSyncWorker.
      - key: q2_opt20
        label: Khóa API Gateway thêm 2 tiếng để đảm bảo dữ liệu ổn định.
      - key: q2_opt21
        label: Revert phiên bản code Git về lại bản của tuần trước.
    - key: q2_node8
      prompt: Toàn bộ metric đã trở về mức xanh (CPU < 15%, Order Latency ~25ms, Error
        Rate 0%). Bước cuối cùng trong quy trình sự cố?
      options:
      - key: q2_opt22
        label: Đóng incident, tổng hợp timeline và tổ chức buổi họp Post-mortem phân
          tích nguyên nhân.
      - key: q2_opt23
        label: Bỏ qua Post-mortem, chuyển sang làm tính năng mới ngay.
      - key: q2_opt24
        label: Tắt hẳn dịch vụ Redis để tránh nguy cơ trong tương lai.
    - key: q2_recovery
      prompt: Sự cố Redis 100% CPU đã được giải quyết triệt để. Hệ thống Order đã
        hoạt động mượt mà.
      options:
      - key: q2_opt25
        label: Xác nhận hoàn tất bài tập.
  answer_key:
    option_effects:
      q2_opt1:
        points: 10
        minutes_cost: 1
        next_node: q2_node2
        explanation: Chính xác! Redis xử lý đơn luồng, xem Slowlog là cách nhanh nhất
          tìm lệnh tốn CPU.
      q2_opt2:
        points: 0
        minutes_cost: 6
        next_node: q2_node2
        explanation: Restart sẽ khiến ứng dụng dồn request xuống DB gây sập DB, và
          khi Redis lên lại vẫn bị lệnh KEYS làm nghẽn.
      q2_opt3:
        points: 5
        minutes_cost: 4
        next_node: q2_node2
        explanation: Tăng Pod Order Service trong khi Redis nghẽn chỉ làm tăng thêm
          lượng request gửi tới Redis.
      q2_opt4:
        points: 10
        minutes_cost: 1
        next_node: q2_node3
        explanation: Chính xác! KEYS có độ phức tạp O(N), quét toàn bộ keyspace làm
          block đơn luồng của Redis.
      q2_opt5:
        points: 0
        minutes_cost: 7
        next_node: q2_node3
        explanation: Sai. Lệnh KEYS tốn CPU do phải iterate qua toàn bộ bộ nhớ, không
          liên quan trực tiếp thiếu RAM.
      q2_opt6:
        points: 5
        minutes_cost: 3
        next_node: q2_node3
        explanation: AOF Persistence ảnh hưởng I/O đĩa, không phải nguyên nhân CPU
          100% do lệnh KEYS.
      q2_opt7:
        points: 10
        minutes_cost: 1
        next_node: q2_node4
        explanation: Tuyệt vời! Dừng nguồn phát tán lệnh vô tận giúp Redis giải phóng
          ngay luồng xử lý.
      q2_opt8:
        points: 5
        minutes_cost: 5
        next_node: q2_node4
        explanation: Redis chạy đơn luồng chính (main thread), tăng thêm vCPU cho
          container không giúp lệnh KEYS chạy đa luồng.
      q2_opt9:
        points: 0
        minutes_cost: 6
        next_node: q2_node4
        explanation: Chạy lệnh DEL/KEYS để xóa tiếp tục làm Redis bị block nặng hơn.
      q2_opt10:
        points: 10
        minutes_cost: 2
        next_node: q2_node5
        explanation: Chính xác! Giảm tải lưu lượng tại Gateway giúp hạ nhiệt bão request
          khi cache bị thủng.
      q2_opt11:
        points: 0
        minutes_cost: 5
        next_node: q2_node5
        explanation: Bật lại CronJob khi chưa sửa code sẽ đẩy Redis trở lại 100% CPU
          ngay lập tức.
      q2_opt12:
        points: 0
        minutes_cost: 8
        next_node: q2_node5
        explanation: Xóa Redis sẽ chuyển toàn bộ traffic xuống DB, gây sập luôn DB
          Master.
      q2_opt13:
        points: 10
        minutes_cost: 2
        next_node: q2_node6
        explanation: Rất chuẩn! SCAN chia nhỏ việc duyệt key không block Redis, hoặc
          dùng Set duy trì index riêng với O(1).
      q2_opt14:
        points: 0
        minutes_cost: 4
        next_node: q2_node6
        explanation: MGET yêu cầu truyền sẵn danh sách key cụ thể, không thay thế
          được tính năng tìm kiếm pattern của KEYS.
      q2_opt15:
        points: 5
        minutes_cost: 3
        next_node: q2_node6
        explanation: Tăng timeout làm request treo lâu hơn và tốn tài nguyên bộ nhớ
          ứng dụng.
      q2_opt16:
        points: 10
        minutes_cost: 2
        next_node: q2_node7
        explanation: Đúng quy trình! Deploy Hotfix code chuẩn chỉnh để giải quyết
          triệt để lỗi.
      q2_opt17:
        points: 0
        minutes_cost: 5
        next_node: q2_node7
        explanation: Xóa cấu hình làm ứng dụng không thể kết nối Cache, gây lỗi sập
          hệ thống.
      q2_opt18:
        points: 0
        minutes_cost: 6
        next_node: q2_node7
        explanation: Chạy CronJob cũ trước khi nâng cấp code sẽ tái diễn sự cố lập
          tức.
      q2_opt19:
        points: 10
        minutes_cost: 1
        next_node: q2_node8
        explanation: Chính xác! Mở lưu lượng từng bước đảm bảo hệ thống chịu tải an
          toàn.
      q2_opt20:
        points: 5
        minutes_cost: 4
        next_node: q2_node8
        explanation: Khóa quá lâu gây thiệt hại kinh doanh không cần thiết khi hệ
          thống đã ổn định.
      q2_opt21:
        points: 0
        minutes_cost: 5
        next_node: q2_node8
        explanation: Revert lại Git làm mất bản Hotfix vừa tạo.
      q2_opt22:
        points: 10
        minutes_cost: 1
        next_node: q2_recovery
        explanation: Rất tốt! Post-mortem là bước quan trọng giúp rút kinh nghiệm
          và phòng ngừa sự cố tương tự.
      q2_opt23:
        points: 5
        minutes_cost: 2
        next_node: q2_recovery
        explanation: Không làm Post-mortem làm bỏ lỡ cơ hội cải tiến quy trình và
          phòng tránh rủi ro tương lai.
      q2_opt24:
        points: 0
        minutes_cost: 10
        next_node: q2_recovery
        explanation: Tắt vĩnh viễn Redis khiến hệ thống mất lớp Caching quan trọng.
      q2_opt25:
        points: 10
        minutes_cost: 0
        next_node: q2_recovery
        explanation: Hoàn tất.
    recovery_node: q2_recovery
  difficulty: hard
- content:
    scenario: Hệ thống thanh toán của ứng dụng Thương mại điện tử bị nghẽn nặng trong
      giờ Flash Sale. Khách hàng liên tục nhận lỗi HTTP 504 Gateway Timeout khi bấm
      thanh toán. Doanh thu rơi tự do.
    initial_logs: "[2023-10-25 12:00:05] ERROR payment-api: RedisConnectionException:
      Unable to connect to redis-cluster:6379 (Timeout 5000ms) | [2023-10-25 12:00:08]
      WARN nginx-ingress: 504 Gateway Time-out POST /api/v1/checkout - upstream response
      time 10.02s"
    nodes:
    - key: q1_n1
      prompt: Hệ thống cảnh báo hàng loạt lỗi 504 trên cổng thanh toán. Bước đầu tiên
        bạn sẽ kiểm tra chỉ số nào?
      options:
      - key: q1_n1_o1
        label: Kiểm tra chỉ số CPU, Memory và Client Connections trên Redis Cluster
      - key: q1_n1_o2
        label: Khởi động lại ngay lập tức toàn bộ dàn API pod để giải phóng bộ nhớ
      - key: q1_n1_o3
        label: Tăng kích thước Database PostgreSQL lên instance lớn hơn
    - key: q1_n2
      prompt: Chỉ số Redis cho thấy CPU đạt 100%, số lượng connection chạm ngưỡng
        maxclients (10,000). Bước tiếp theo bạn làm gì?
      options:
      - key: q1_n2_o1
        label: Chạy câu lệnh SLOWLOG GET và kiểm tra các key có lượt truy cập cao
          (Hot Keys)
      - key: q1_n2_o2
        label: Thực hiện lệnh FLUSHALL trên Redis để xóa bớt dữ liệu rác
      - key: q1_n2_o3
        label: Tăng tham số maxmemory của Redis trong file cấu hình
    - key: q1_n3
      prompt: Kết quả SLOWLOG cho thấy key 'flash_sale_campaign_item_102' bị hết hạn
        (TTL expire) đúng 12:00:00, khiến 50,000 requests/giây đồng thời chọc thẳng
        xuống Database để đọc lại thông tin (Cache Stampede). Bạn xử lý thế nào?
      options:
      - key: q1_n3_o1
        label: Kích hoạt cơ chế Distributed Lock (Mutex) kết hợp Cache Warming thủ
          công cho hot key
      - key: q1_n3_o2
        label: Xóa toàn bộ Index của bảng Campaign trong Database để ghi dữ liệu nhanh
          hơn
      - key: q1_n3_o3
        label: Chờ cho Database tự xử lý xong 50,000 request đó
    - key: q1_n4
      prompt: Để ngăn chặn hiện tượng Cache Stampede tái diễn trong khi khôi phục
        cache, bạn chọn giải pháp khẩn cấp nào?
      options:
      - key: q1_n4_o1
        label: Set cứng cache cho hot key với TTL dài (24h) và bật cơ chế Background
          Refresh
      - key: q1_n4_o2
        label: Mở rộng max_connections của Database lên 20,000
      - key: q1_n4_o3
        label: Chặn toàn bộ IP của người dùng truy cập từ mạng di động
    - key: q1_n5
      prompt: Hot key đã được nạp lại vào Redis, nhưng API Connection Pool vẫn đang
        bị quá tải do hàng nghìn request cũ đọng lại. Bạn làm gì để xả tải?
      options:
      - key: q1_n5_o1
        label: Kích hoạt Rate Limiter và Circuit Breaker ở API Gateway đối với endpoint
          checkout
      - key: q1_n5_o2
        label: Restart Redis thêm một lần nữa
      - key: q1_n5_o3
        label: Tắt chứng chỉ SSL/TLS trên API Gateway
    - key: q1_n6
      prompt: Traffic trên Gateway bắt đầu ổn định trở lại. Bạn cần làm gì để xác
        nhận DB và API đã trở lại trạng thái lành lặn?
      options:
      - key: q1_n6_o1
        label: Kiểm tra APM dashboard quan sát Latency p99 và Connection Pool Active
          Count
      - key: q1_n6_o2
        label: Kill toàn bộ các query đang chạy trong Postgres
      - key: q1_n6_o3
        label: Tắt hệ thống cảnh báo Prometheus để bớt nhiễu
    - key: q1_n7
      prompt: Hệ thống đã chạy mượt trở lại với 95% request thành công. Làm sao để
        nâng dần hạn mức truy cập cho người dùng?
      options:
      - key: q1_n7_o1
        label: Tăng dần giới hạn Rate Limit từng bậc (từ 20% -> 50% -> 100%) và theo
          dõi CPU DB
      - key: q1_n7_o2
        label: Gỡ bỏ ngay lập tức toàn bộ Rate Limit trên API Gateway
      - key: q1_n7_o3
        label: Yêu cầu người dùng tự xóa cache trình duyệt
    - key: q1_n8
      prompt: Sự cố được khắc phục hoàn toàn, latency dưới 150ms. Bước kết thúc quy
        trình xử lý sự cố là gì?
      options:
      - key: q1_n8_o1
        label: Ghi nhận Post-Mortem, cập nhật cảnh báo tự động và tạo task phòng chống
          Cache Stampede
      - key: q1_n8_o2
        label: Đóng ticket sự cố và không cần họp lại với đội dev
      - key: q1_n8_o3
        label: Giảm cấu hình Redis để tiết kiệm chi phí
    - key: q1_recovery
      prompt: Sự cố Cache Stampede trên dịch vụ thanh toán đã được khắc phục hoàn
        toàn!
      options: []
  answer_key:
    option_effects:
      q1_n1_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n2
        explanation: Chẩn đoán chính xác. Phát hiện nguyên nhân nghẽn từ hạ tầng Redis.
      q1_n1_o2:
        points: 0
        minutes_cost: 5
        next_node: q1_n1
        explanation: Restart vô ích khi Redis vẫn bị nghẽn connection, làm tăng downtime.
      q1_n1_o3:
        points: 5
        minutes_cost: 4
        next_node: q1_n2
        explanation: Tốn thời gian nâng cấp DB trong khi chưa xác định rõ bottleneck
          ở đâu.
      q1_n2_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n3
        explanation: Chính xác. Giúp tìm ra Hot Key đang ngốn băng thông và tài nguyên
          Redis.
      q1_n2_o2:
        points: 0
        minutes_cost: 6
        next_node: q1_n2
        explanation: Hành động thảm họa! Xóa sạch cache khiến toàn bộ traffic đâm
          xuống DB.
      q1_n2_o3:
        points: 5
        minutes_cost: 3
        next_node: q1_n3
        explanation: Tăng bộ nhớ không giải quyết được vấn đề vượt quá connection
          do CPU 100%.
      q1_n3_o1:
        points: 10
        minutes_cost: 2
        next_node: q1_n4
        explanation: Chính xác. Khóa phân tán giúp chỉ 1 request nạp lại cache, bảo
          vệ DB.
      q1_n3_o2:
        points: 0
        minutes_cost: 7
        next_node: q1_n3
        explanation: Xóa index khiến các câu lệnh SELECT bị Table Scan, làm chết DB.
      q1_n3_o3:
        points: 0
        minutes_cost: 8
        next_node: q1_n3
        explanation: Phù hợp với việc đứng nhìn hệ thống sụp đổ hoàn toàn.
      q1_n4_o1:
        points: 10
        minutes_cost: 2
        next_node: q1_n5
        explanation: Giúp hot key không bị hổng dữ liệu trong thời gian diễn ra chiến
          dịch.
      q1_n4_o2:
        points: 5
        minutes_cost: 4
        next_node: q1_n5
        explanation: Tăng DB max connections tạm thời xả nghẽn nhưng dễ gây đơ luôn
          DB host.
      q1_n4_o3:
        points: 0
        minutes_cost: 5
        next_node: q1_n4
        explanation: Chặn khách hàng mua hàng gây mất doanh thu nghiêm trọng.
      q1_n5_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n6
        explanation: Giới hạn lưu lượng hợp lý giúp hệ thống tiêu hóa dần lượng request
          tích tụ.
      q1_n5_o2:
        points: 0
        minutes_cost: 4
        next_node: q1_n5
        explanation: Restart Redis lặp lại làm hỏng trạng thái cache vừa nạp.
      q1_n5_o3:
        points: 0
        minutes_cost: 5
        next_node: q1_n5
        explanation: Mất an toàn bảo mật và không giải quyết được bài toán quá tải.
      q1_n6_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n7
        explanation: Theo dõi các chỉ số đo lường thực tế là chuẩn mực giám sát sự
          cố.
      q1_n6_o2:
        points: 0
        minutes_cost: 5
        next_node: q1_n6
        explanation: Kill query dở dang gây lỗi dữ liệu không nhất quán (inconsistent
          state).
      q1_n6_o3:
        points: 0
        minutes_cost: 3
        next_node: q1_n6
        explanation: Tắt cảnh báo khiến đội ngũ mất dấu tình trạng hệ thống.
      q1_n7_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_n8
        explanation: Mở luồng lưu lượng từng bước đảm bảo hệ thống không bị sốc nhiệt
          trở lại.
      q1_n7_o2:
        points: 0
        minutes_cost: 5
        next_node: q1_n7
        explanation: Xả trạm quá nhanh có thể gây đợt bùng nổ request mới khiến DB
          sập lại.
      q1_n7_o3:
        points: 0
        minutes_cost: 4
        next_node: q1_n7
        explanation: Không thể bắt hàng trăm nghìn người dùng tự xóa cache trình duyệt.
      q1_n8_o1:
        points: 10
        minutes_cost: 1
        next_node: q1_recovery
        explanation: Quy trình khép kín bài bản giúp nâng cao tính ổn định lâu dài.
      q1_n8_o2:
        points: 0
        minutes_cost: 2
        next_node: q1_recovery
        explanation: Bỏ qua Post-Mortem sẽ khiến lỗi tương tự lặp lại trong tương
          lai.
      q1_n8_o3:
        points: 0
        minutes_cost: 3
        next_node: q1_recovery
        explanation: Giảm cấu hình khi vừa xảy ra quá tải là quyết định sai lầm.
    recovery_node: q1_recovery
  difficulty: medium
- content:
    scenario: Dịch vụ order-service trên Kubernetes liên tục bị k8s oom-killed và
      restart lại. Hàng ngàn đơn hàng của khách bị kẹt ở trạng thái Pending. Queue
      tin nhắn tích tụ nhanh chóng.
    initial_logs: "[2023-10-25 14:10:12] k8s-event: Pod order-service-7d8b9c-x42z1
      OOMKilled (Exit Code 137) | memory limit 2Gi reached | [2023-10-25 14:10:15]
      rabbitmq: queue 'order_created_queue' unacked messages: 45,210"
    nodes:
    - key: q2_n1
      prompt: Các Pod order-service liên tục rơi vào trạng thái CrashLoopBackOff do
        OOMKilled. Hành động đầu tiên của bạn là gì?
      options:
      - key: q2_n1_o1
        label: Dùng 'kubectl describe pod' và kiểm tra metricsMemory Usage trên Grafana
      - key: q2_n1_o2
        label: Tăng số lượng Replica Pods từ 5 lên 100
      - key: q2_n1_o3
        label: Xóa toàn bộ Kubernetes Namespace chứa order-service
    - key: q2_n2
      prompt: Biểu đồ Grafana cho thấy Memory tăng dần theo dạng bậc thang (staircase)
        đều đặn cho đến khi chạm mốc 2GB trong 15 phút. Đây là biểu hiện đặc trưng
        của vấn đề gì?
      options:
      - key: q2_n2_o1
        label: Rò rỉ bộ nhớ (Memory Leak) trong ứng dụng
      - key: q2_n2_o2
