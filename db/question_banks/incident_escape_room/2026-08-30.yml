  difficulty: medium
- content:
    scenario: Dịch vụ xử lý tài liệu PDF ('pdf-worker') trên Kubernetes cluster liên
      tục bị restart. Hàng đợi RabbitMQ tích tụ hơn 150,000 công việc chưa được xử
      lý, gây đình trệ toàn bộ tính năng xuất báo cáo.
    initial_logs: |-
      kubectl get pods:
      pdf-worker-86f7b9c-4x2z1   0/1   CrashLoopBackOff   12 (30s ago)
      [REASON] OOMKilled - Exit Code 137 - Memory limit exceeded (1024MiB)
      RabbitMQ Queue 'pdf_jobs': 152,410 unacknowledged/ready messages
    nodes:
    - key: s2_n1
      prompt: 'Bước 1: Pod `pdf-worker` liên tục bị `OOMKilled` (Exit code 137). Bạn
        bắt đầu điều tra từ đâu?'
      options:
      - key: q2_n1_o1
        label: Dùng `kubectl describe pod` và kiểm tra cấu hình `resources.limits.memory`
      - key: q2_n1_o2
        label: Tăng số lượng Replica của Deployment `pdf-worker` từ 3 lên 20 pod ngay
      - key: q2_n1_o3
        label: Purge (xóa sạch) hàng đợi `pdf_jobs` trên RabbitMQ
    - key: s2_n2
      prompt: 'Bước 2: Pod bị giới hạn 1GB RAM và sập ngay khi xử lý các file PDF
        lớn. Bạn xử lý ứng cứu khẩn cấp như thế nào?'
      options:
      - key: q2_n2_o1
        label: Tạm thời tăng `limits.memory` lên 2GiB cho Deployment để giảm nhịp
          crash
      - key: q2_n2_o2
        label: Restart cụm RabbitMQ Cluster
      - key: q2_n2_o3
        label: Tắt Liveness Probe và Readiness Probe của Pod
    - key: s2_n3
      prompt: 'Bước 3: Sau khi tăng RAM lên 2GB, Pod chạy được lâu hơn nhưng RAM vẫn
        tăng liên tục theo thời gian không giảm (Memory Leak). Làm sao tìm nguyên
        nhân leak?'
      options:
      - key: q2_n3_o1
        label: Tạo Heap Dump / Memory Profile của ứng dụng Worker khi đang xử lý file
      - key: q2_n3_o2
        label: Đổi Base Image của Container từ Alpine sang Ubuntu
      - key: q2_n3_o3
        label: Tăng CPU limit từ 1 Core lên 4 Cores
    - key: s2_n4
      prompt: 'Bước 4: Heap Dump cho thấy thư viện PDF render tạo nhiều Buffer object
        nhưng không xả tài nguyên (chưa gọi `destroy stream` / `gc`). Bạn xử lý ra
        sao?'
      options:
      - key: q2_n4_o1
        label: Viết Hotfix code đảm bảo đóng File Stream và giải phóng Buffer sau
          khi render
      - key: q2_n4_o2
        label: Tạo CronJob cứ 5 phút restart Pod một lần để xả bộ nhớ
      - key: q2_n4_o3
        label: Viết lại toàn bộ Worker bằng ngôn ngữ lập trình khác
    - key: s2_n5
      prompt: 'Bước 5: Trong lúc đợi CI/CD build Docker image mới, RabbitMQ vẫn ngập
        150k task. Làm sao tránh Worker mới lên lại bị kéo ngợp RAM?'
      options:
      - key: q2_n5_o1
        label: Cấu hình Prefetch Count = 5 trên RabbitMQ Consumer để giới hạn số task
          lấy về
      - key: q2_n5_o2
        label: Tăng max connection trong cấu hình RabbitMQ
      - key: q2_n5_o3
        label: Tắt RabbitMQ Server trong 1 tiếng
    - key: s2_n6
      prompt: 'Bước 6: Docker image hotfix đã ready. Bạn tiến hành cập nhật ứng dụng
        như thế nào?'
      options:
      - key: q2_n6_o1
        label: Update image version mới cho Deployment và theo dõi memory graph trên
          Grafana
      - key: q2_n6_o2
        label: Dùng `kubectl exec` chép trực tiếp file code sửa vào Pod đang chạy
      - key: q2_n6_o3
        label: Xóa toàn bộ Deployment và tạo lại từ đầu
    - key: s2_n7
      prompt: 'Bước 7: Pod mới hoạt động ổn định, RAM đứng ở mức 300MB. Tuy nhiên
        150k task tồn đọng tiêu thụ khá chậm. Bạn đẩy nhanh tiến độ thế nào?'
      options:
      - key: q2_n7_o1
        label: Tạm thời Scale up số lượng Replica của Deployment lên 15 pods
      - key: q2_n7_o2
        label: Để nguyên 2 pods chạy từ từ cho đến khi hết 150k tasks
      - key: q2_n7_o3
        label: Reboot toàn bộ Kubernetes Worker Nodes
    - key: s2_n8
      prompt: 'Bước 8: Hàng đợi RabbitMQ đã giảm về 0 tasks. Dịch vụ khôi phục hoàn
        toàn. Bạn dọn dẹp hạ tầng thế nào?'
      options:
      - key: q2_n8_o1
        label: Scale down số Replica về mức chuẩn (3 pods) và điều chỉnh lại resource
          requests/limits hợp lý
      - key: q2_n8_o2
        label: Giữ nguyên 15 pods chạy vĩnh viễn để phòng ngừa
      - key: q2_n8_o3
        label: Xóa cấu hình resource limit trong Kubernetes
    - key: s2_rec
      prompt: Chúc mừng! Bạn đã xử lý triệt để sự cố Memory Leak & OOMKilled trên
        Kubernetes, giúp hàng đợi RabbitMQ giải tỏa an toàn.
      options:
      - key: q2_rec_o1
        label: Hoàn tất bài tập
  answer_key:
    option_effects:
      q2_n1_o1:
        points: 10
        minutes_cost: 1
        next_node: s2_n2
        explanation: Chính xác. `kubectl describe` giúp xác nhận lý do OOMKilled và
          thông số RAM limit hiện tại.
      q2_n1_o2:
        points: 0
        minutes_cost: 3
        next_node: s2_n2
        explanation: Tăng pod khi chưa tìm nguyên nhân sẽ khiến các pod mới cùng bị
          OOMKilled, tốn tài nguyên node.
      q2_n1_o3:
        points: 0
        minutes_cost: 5
        next_node: s2_n2
        explanation: Xóa queue làm mất mát dữ liệu báo cáo của người dùng, không thể
          chấp nhận được.
      q2_n2_o1:
        points: 10
        minutes_cost: 2
        next_node: s2_n3
        explanation: Tốt. Tăng limit tạm thời giúp Worker giữ kết nối lâu hơn để tiếp
          tục điều tra nguyên nhân sâu xa.
      q2_n2_o2:
        points: 5
        minutes_cost: 5
        next_node: s2_n3
        explanation: Vấn đề ở Pod Worker xử lý file chứ không phải ở RabbitMQ Cluster.
      q2_n2_o3:
        points: 0
        minutes_cost: 4
        next_node: s2_n3
        explanation: Tắt Probe không chặn được kernel kill pod khi vượt quá giới hạn
          RAM limit.
      q2_n3_o1:
        points: 10
        minutes_cost: 2
        next_node: s2_n4
        explanation: Chính xác! Heap Dump/Profile là công cụ chuẩn nhất để phát hiện
          leak nguồn bộ nhớ trong code.
      q2_n3_o2:
        points: 5
        minutes_cost: 6
        next_node: s2_n4
        explanation: Đổi OS base image không giải quyết được lỗi leak memory trong
          ứng dụng.
      q2_n3_o3:
        points: 0
        minutes_cost: 3
        next_node: s2_n4
        explanation: Tăng CPU không giúp khắc phục tình trạng thiếu bộ nhớ (RAM Memory
          Leak).
      q2_n4_o1:
        points: 10
        minutes_cost: 2
        next_node: s2_n5
        explanation: Chuẩn xác. Đóng stream và unref buffer giúp garbage collector
          thu hồi bộ nhớ triệt để.
      q2_n4_o2:
        points: 5
        minutes_cost: 4
        next_node: s2_n5
        explanation: Restart định kỳ chỉ là giải pháp tình huống xấu, làm đứt đoạn
          các task đang xử lý.
      q2_n4_o3:
        points: 0
        minutes_cost: 15
        next_node: s2_n5
        explanation: Viết lại ứng dụng tốn quá nhiều thời gian, làm gián đoạn hệ thống
