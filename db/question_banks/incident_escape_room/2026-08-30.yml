- content:
    scenario: Hệ thống thanh toán của ứng dụng e-commerce bị nghẽn mạng đột ngột.
      Người dùng liên tục gặp lỗi 504 Gateway Timeout khi thực hiện thanh toán. Đội
      CSKH báo cáo hàng nghìn giao dịch bị gián đoạn.
    initial_logs: |-
      [ERROR] RedisConnectionException: Unable to connect to Redis server. Connection pool exhausted.
      [WARN] Payment-Service HTTP 504 on POST /api/v1/payments/process - duration: 30000ms
      [METRIC] Redis Latency: 850ms (Normal: <5ms) | CPU: 100%
    nodes:
    - key: s1_n1
      prompt: 'Bước 1: Bạn nhận cảnh báo Redis connection pool exhausted và HTTP 504.
        Bước kiểm tra đầu tiên của bạn là gì?'
      options:
      - key: q1_n1_o1
        label: Kiểm tra metric Redis latency, memory utilization và slow log
      - key: q1_n1_o2
        label: Khởi động lại (restart) toàn bộ các pod Payment Service ngay lập tức
      - key: q1_n1_o3
        label: Tăng dung lượng RAM trên DB PostgreSQL chính
    - key: s1_n2
      prompt: 'Bước 2: Log Redis cho thấy key ''promotions_active_list'' bị hit liên
        tục 50,000 req/s. Latency tăng vọt. Bạn xử lý sao?'
      options:
      - key: q1_n2_o1
        label: Kiểm tra TTL và cơ chế cập nhật cache của key 'promotions_active_list'
      - key: q1_n2_o2
        label: Chạy lệnh FLUSHALL trên Redis để xóa toàn bộ bộ nhớ cache
      - key: q1_n2_o3
        label: Sửa code ứng dụng để tắt bớt log trong Payment Service
    - key: s1_n3
      prompt: 'Bước 3: Key ''promotions_active_list'' vừa bị hết hạn (TTL expire)
        dẫn đến Cache Stampede / Hotkey. Hàng vạn request đâm trực tiếp vào Database.
        Bạn chặn đợt nghẽn này thế nào?'
      options:
      - key: q1_n3_o1
        label: Áp dụng cơ chế Mutex Lock / Singleflight trong code để chỉ 1 request
          rebuild cache
      - key: q1_n3_o2
        label: Tăng max connection pool size của Redis trong app config lên 1000
      - key: q1_n3_o3
        label: Thực hiện Auto-scaling Pod Payment Service từ 5 lên 50 pods
    - key: s1_n4
      prompt: 'Bước 4: Trong lúc chuẩn bị deploy fix code, Database bị treo do vô
        số query SELECT * FROM promotions. Bạn cứu DB bằng cách nào ngay lập tức?'
      options:
      - key: q1_n4_o1
        label: Tự tay Warm-up cache lại key 'promotions_active_list' bằng script /
          Redis CLI
      - key: q1_n4_o2
        label: Kill toàn bộ connection đang kết nối vào Database
      - key: q1_n4_o3
        label: Drop index trên bảng promotions để giảm bù tải
    - key: s1_n5
      prompt: 'Bước 5: Cache được warm-up tạm thời, DB đã bớt tải. Giờ bạn cần áp
        dụng giải pháp chống Hotkey lâu dài nào?'
      options:
      - key: q1_n5_o1
        label: Deploy bản hotfix dùng Probabilistic Early Expiration và Mutex Lock
      - key: q1_n5_o2
        label: Set TTL cho key 'promotions_active_list' thành vô hạn (không bao giờ
          expire)
      - key: q1_n5_o3
        label: Chuyển dữ liệu Redis sang lưu trữ bằng Memcached
    - key: s1_n6
      prompt: 'Bước 6: Code mới đã được deploy. Tuy nhiên một số connection pool cũ
        ở Payment Service vẫn bị kẹt dính. Bạn làm gì tiếp theo?'
      options:
      - key: q1_n6_o1
        label: Thực hiện Rolling Restart các pod Payment Service để làm sạch connection
      - key: q1_n6_o2
        label: Đợi 30 phút để connection pool tự động giải phóng timeout
      - key: q1_n6_o3
        label: Reboot máy chủ Redis Server
    - key: s1_n7
      prompt: 'Bước 7: Pod đã restart xong. Hệ thống dần ổn định. Bạn làm gì để kiểm
        tra lại toàn bộ sức khỏe hệ thống?'
      options:
      - key: q1_n7_o1
        label: 'Kiểm tra Grafana dashboard: Redis Latency, DB CPU và tỉ lệ HTTP status
          200 vs 504'
      - key: q1_n7_o2
        label: Gửi email thông báo cho toàn công ty là sự cố đã xử lý xong mà chưa
          check metric
      - key: q1_n7_o3
        label: Tắt bớt 50% số lượng pod Payment Service để tiết kiệm chi phí
    - key: s1_n8
      prompt: 'Bước 8: Mọi chỉ số đã về mức bình thường. Hành động cuối cùng của bạn
        để hoàn tất quy trình khắc phục sự cố là gì?'
      options:
      - key: q1_n8_o1
        label: Tạo Post-Mortem incident report và đề xuất phương án Caching Strategy
          lâu dài
      - key: q1_n8_o2
        label: Đóng ticket sự cố mà không ghi lại nguyên nhân hay bài học kinh nghiệm
      - key: q1_n8_o3
        label: Xóa toàn bộ file log sự cố trên server để giải phóng ổ đĩa
    - key: s1_rec
      prompt: Chúc mừng! Bạn đã khắc phục thành công sự cố Cache Stampede và đưa hệ
        thống khôi phục trạng thái hoạt động bình thường.
      options:
      - key: q1_rec_o1
        label: Hoàn tất bài tập
  answer_key:
