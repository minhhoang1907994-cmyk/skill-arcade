  difficulty: hard
- content:
    scenario: Hệ thống thanh toán Ecommerce đang trong chiến dịch Flash Sale. Webhook
      từ Cổng thanh toán báo về bị timeout hàng loạt khiến 5,000 đơn hàng ở trạng
      thái PENDING_PAYMENT dù tiền đã bị trừ trong thẻ khách hàng.
    nodes:
    - key: q1_n1
      prompt: 'Bước 1: Xác định nguyên nhân sự cố webhook bị nghẽn.'
      options:
      - key: q1_n1_o1
        label: Xem log tập trung trên Datadog/Grafana và lọc theo HTTP status 504.
      - key: q1_n1_o2
        label: SSH trực tiếp vào server Prod và bật DEBUG log level cho toàn bộ Payment
          Service.
      - key: q1_n1_o3
        label: Restart ngay lập tức toàn bộ Pod của Payment Service trên Kubernetes
          Cluster.
    - key: q1_n2
      prompt: 'Bước 2: Phát hiện DB Connection Pool bị exhausted do lock bảng orders.
        Cần xử lý truy vấn kẹt.'
      options:
      - key: q1_n2_o1
        label: Kill các long-running query đang giữ Lock trên DB Master sau khi lưu
          log phân tích.
      - key: q1_n2_o2
        label: Reboot luôn con DB Master để giải phóng toàn bộ connection ngay lập
          tức.
      - key: q1_n2_o3
        label: Tăng max_connections của DB lên gấp 5 lần trực tiếp trên Prod mà không
          scale CPU/RAM.
    - key: q1_n3
      prompt: 'Bước 3: Xử lý 5,000 đơn hàng chưa nhận được Webhook cập nhật trạng
        thái.'
      options:
      - key: q1_n3_o1
        label: Viết script đối soát API reconciliation với đối tác cổng thanh toán
          để lấy trạng thái chuẩn.
      - key: q1_n3_o2
        label: Chạy SQL UPDATE thủ công UPDATE orders SET status = 'PAID' WHERE status
          = 'PENDING_PAYMENT'.
      - key: q1_n3_o3
        label: Gọi trực tiếp API Refund của ngân hàng để hoàn tiền ngay cho toàn bộ
          5,000 đơn hàng này.
    - key: q1_n4
      prompt: 'Bước 4: Cần cập nhật kho (Inventory) cho các đơn hàng vừa xác nhận
        thanh toán.'
      options:
      - key: q1_n4_o1
        label: Đẩy danh sách order_id đã đối soát thành công vào Message Queue để
          Inventory Service xử lý bất đồng bộ.
      - key: q1_n4_o2
        label: Chạy script giảm trực tiếp số lượng tồn kho trong bảng products trên
          Production DB.
      - key: q1_n4_o3
        label: Bỏ qua bước trừ kho, chờ kiểm kê cuối ngày rồi tính tiếp.
    - key: q1_n5
      prompt: 'Bước 5: Phát hiện code xử lý Webhook hiện tại chưa có cơ chế Idempotency
        Key nên có rủi ro cộng bù trùng.'
      options:
      - key: q1_n5_o1
        label: Soạn Hotfix thêm Redis Distributed Lock theo transaction_id và tạo
          Pull Request review gấp.
      - key: q1_n5_o2
        label: Sửa code trực tiếp trên server Prod và restart app service không qua
          CI/CD.
      - key: q1_n5_o3
        label: Tắt hẳn tính năng xác thực Webhook để xử lý cho nhanh.
    - key: q1_n6
      prompt: 'Bước 6: Deploy bản Hotfix có bổ sung Idempotency Key lên môi trường
        Production.'
      options:
      - key: q1_n6_o1
        label: Thực hiện Canary Deployment 10% traffic, theo dõi error rate trước
          khi rollout 100%.
      - key: q1_n6_o2
        label: Deploy đè ngay lập tức 100% Pods cùng lúc trong thời gian Flash Sale.
      - key: q1_n6_o3
        label: Bỏ qua bước Unit Test và Integration Test để deploy luôn cho kịp giờ.
    - key: q1_n7
      prompt: 'Bước 7: Bật lại tính năng tiếp nhận Webhook từ cổng thanh toán.'
      options:
      - key: q1_n7_o1
        label: Mở Rate Limiter từ từ cho Webhook retry gửi vào hệ thống.
      - key: q1_n7_o2
        label: Mở toàn bộ traffic cùng lúc không giới hạn lưu lượng.
      - key: q1_n7_o3
        label: Gửi thông báo Push Notification hàng loạt cho tất cả người dùng báo
          hệ thống đã bình thường.
    - key: q1_n8
      prompt: 'Bước 8: Phát hiện 20 khách hàng bị trừ tiền 2 lần do cố gắng bấm thanh
        toán lại nhiều lần.'
      options:
      - key: q1_n8_o1
        label: Lập danh sách ID giao dịch trùng, thực hiện gọi API Refund 1 giao dịch
          thừa qua cổng thanh toán.
      - key: q1_n8_o2
        label: Chuyển tiền dư thành Ví tích điểm nội bộ mà không báo trước cho khách
          hàng.
      - key: q1_n8_o3
        label: Gửi SMS tặng Voucher đền bù 500,000 VND tự động cho toàn bộ 5,000 khách
          hàng trong danh sách ảnh hưởng ban đầu.
    - key: q1_n9
      prompt: 'Bước 9: Gửi thông báo cập nhật trạng thái đơn hàng thực tế cho khách
        hàng bị ảnh hưởng.'
      options:
      - key: q1_n9_o1
        label: Gửi Email/Notification đích danh cho 5,000 khách hàng có đơn hàng vừa
          được xử lý thành công.
      - key: q1_n9_o2
        label: Bắn Push Notification cho TOÀN BỘ 2 triệu user của ứng dụng thông báo
          sự cố đã xong.
      - key: q1_n9_o3
        label: Không gửi thông báo nào, mặc định khách hàng tự vào app kiểm tra.
    - key: q1_n10
      prompt: 'Bước 10: Tổng kết sự cố và khôi phục hoàn toàn hệ thống.'
      options:
      - key: q1_n10_o1
        label: Viết Post-mortem, lưu metrics, họp rút kinh nghiệm và đóng Ticket sự
          cố.
      - key: q1_n10_o2
        label: Xoá log sự cố trên server để tránh chiếm dung lượng ổ cứng.
      - key: q1_n10_o3
        label: Bỏ qua báo cáo vì hệ thống đã chạy lại bình thường.
