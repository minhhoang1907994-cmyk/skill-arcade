  difficulty: hard
- content:
    scenario: Thực hiện nâng cấp hệ thống tích điểm Loyalty và Migration dữ liệu 1,000,000
      người dùng trên môi trường Production vào đêm cuối tuần.
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: Chuẩn bị trước khi tiến hành Data Migration.'
      options:
      - key: q2_n1_o1
        label: Tạo bản Snapshot/Backup toàn bộ DB và kiểm tra khả năng restore trên
          môi trường Staging.
      - key: q2_n1_o2
        label: Chỉ export file CSV chứa bảng user_points ra máy cá nhân.
      - key: q2_n1_o3
        label: Bỏ qua backup vì script migration đã test kỹ trên Dev.
    - key: q2_n2
      prompt: 'Bước 2: Quản lý truy vấn của người dùng trong lúc Migration dữ liệu.'
      options:
      - key: q2_n2_o1
        label: Bật Feature Flag tắt tạm thời tính năng đổi điểm trên App và chuyển
          service sang Maintenance Mode.
      - key: q2_n2_o2
        label: Cứ để người dùng tích điểm bình thường trong lúc chạy script migration.
      - key: q2_n2_o3
        label: Block toàn bộ IP truy cập vào hệ thống ở tầng Cloudflare.
    - key: q2_n3
      prompt: 'Bước 3: Thực thi Migration Script đổi công thức nhân điểm thưởng.'
      options:
      - key: q2_n3_o1
        label: Chạy migration theo từng Batch 5,000 user kèm log progress và trang
          thái rollback.
      - key: q2_n3_o2
        label: Chạy 1 lệnh UPDATE duy nhất cho toàn bộ 1,000,000 record cùng lúc.
      - key: q2_n3_o3
        label: Viết script multithreading 100 luồng ghi trực tiếp DB Master mà không
          giới hạn connection.
    - key: q2_n4
      prompt: 'Bước 4: Script chạy được 50% thì bị dừng do lỗi trúng NULL value ở
        cột email.'
      options:
      - key: q2_n4_o1
        label: Kiểm tra checkpoint batch vừa chạy thành công, sửa handling NULL trong
          code script rồi chạy tiếp từ checkpoint.
      - key: q2_n4_o2
        label: Chạy lại script từ đầu mà không dọn dẹp dữ liệu 50% đã migrate.
      - key: q2_n4_o3
        label: Chạy lệnh DELETE FROM user_points để làm lại từ đầu.
    - key: q2_n5
      prompt: 'Bước 5: Kiểm tra tính đúng đắn của dữ liệu sau khi migration hoàn tất.'
      options:
      - key: q2_n5_o1
        label: Chạy script checksum so sánh tổng số điểm trước và sau migration trên
          DB Replica.
      - key: q2_n5_o2
        label: Select ngẫu nhiên 3 user kiểm tra bằng mắt rồi xác nhận xong.
      - key: q2_n5_o3
        label: Bỏ qua bước kiểm tra, mở lại service cho người dùng ngay.
    - key: q2_n6
      prompt: 'Bước 6: Phát hiện 500 account bị tính nhân đôi số điểm do lỗi logic
        ở Batch 2.'
      options:
      - key: q2_n6_o1
        label: Lập danh sách 500 account này và chạy script recalibrate điều chỉnh
          riêng về đúng giá trị chuẩn.
      - key: q2_n6_o2
        label: Gửi SMS tự động thông báo thu hồi điểm cho 500 khách hàng này.
      - key: q2_n6_o3
        label: Giữ nguyên điểm thừa cho khách hàng coi như quà tặng.
    - key: q2_n7
      prompt: 'Bước 7: Mở lại tính năng Loyalty trên ứng dụng Production.'
      options:
      - key: q2_n7_o1
        label: Tắt Feature Flag Maintenance Mode, bật logging giám sát mức độ sử dụng.
      - key: q2_n7_o2
        label: Gửi SMS Brandname hàng loạt báo tặng 100 điểm cho toàn bộ 1,000,000
          user để mừng phiên bản mới.
      - key: q2_n7_o3
        label: Deploy lại toàn bộ ứng dụng mobile lên App Store/Google Play.
    - key: q2_n8
      prompt: 'Bước 8: Người dùng bắt đầu vào đổi quà Loyalty, hệ thống ghi nhận traffic
        tăng gấp 3 lần.'
      options:
      - key: q2_n8_o1
        label: Scale out tự động số lượng Pods của Loyalty Service dựa trên CPU/RAM
          utilization metric.
      - key: q2_n8_o2
        label: Tắt bớt các Replica Node của Database để tiết kiệm chi phí.
      - key: q2_n8_o3
        label: Xóa bớt Redis Cache để giải phóng bộ nhớ.
    - key: q2_n9
      prompt: 'Bước 9: Phát hiện nhà cung cấp đổi quà (Third-party Voucher API) báo
        lỗi 500 do bị quá tải.'
      options:
      - key: q2_n9_o1
        label: Bật Circuit Breaker cách ly API bên thứ ba và đưa yêu cầu đổi quà vào
          hàng đợi xử lý sau.
      - key: q2_n9_o2
        label: Liên tục gọi lại API đối tác mỗi 100ms cho đến khi thành công.
      - key: q2_n9_o3
        label: Gọi trực tiếp API phát Voucher thật của nhà cung cấp dự phòng mà không
          qua kiểm duyệt ngân sách.
    - key: q2_n10
      prompt: 'Bước 10: Đánh giá và dọn dẹp môi trường sau triển khai.'
      options:
      - key: q2_n10_o1
        label: Xóa các bảng tạm (temp tables) dùng trong migration, lưu trữ log backup
          và cập nhật tài liệu.
      - key: q2_n10_o2
        label: Xóa toàn bộ file Backup Database để trống ổ đĩa.
      - key: q2_n10_o3
        label: Để nguyên các bảng tạm trên Prod DB không xử lý.
  answer_key:
    option_effects:
      q2_n1_o1:
        points: 10
        irreversible: false
        consequence_text: An toàn tuyệt đối, sẵn sàng phương án phục hồi nếu migration
          thất bại.
        next_node: q2_n2
      q2_n1_o2:
        points: 3
        irreversible: false
        consequence_text: File CSV bị mất thông tin datatype và quan hệ khóa ngoại
          (foreign key).
        next_node: q2_n2
      q2_n1_o3:
        points: 3
        irreversible: false
        consequence_text: Rủi ro mất dữ liệu hoàn toàn nếu xảy ra lỗi trong quá trình
          migration.
        next_node: q2_n2
      q2_n2_o1:
        points: 10
        irreversible: false
        consequence_text: Đảm bảo tính nhất quán dữ liệu (data consistency) tuyệt
          đối khi script migration chạy.
        next_node: q2_n3
      q2_n2_o2:
        points: 3
        irreversible: false
        consequence_text: Dữ liệu bị sai lệch (data corruption) do ghi đè song song
          giữa user và script.
        next_node: q2_n3
      q2_n2_o3:
        points: 3
        irreversible: false
        consequence_text: Toàn bộ ứng dụng bị gián đoạn truy cập, người dùng tưởng
          hệ thống sập.
        next_node: q2_n3
      q2_n3_o1:
        points: 10
        irreversible: false
        consequence_text: Migration diễn ra an toàn, không làm quá tải CPU hay Lock
          bảng lâu.
        next_node: q2_n4
      q2_n3_o2:
        points: 3
        irreversible: false
        consequence_text: Lock toàn bộ bảng user_points trong 15 phút, gây timeout
          dây chuyền.
        next_node: q2_n4
      q2_n3_o3:
        points: 3
        irreversible: false
        consequence_text: Gây Deadlock DB Master liên tục, quá trình migration bị
          crash.
        next_node: q2_n4
      q2_n4_o1:
        points: 10
        irreversible: false
        consequence_text: Tiết kiệm thời gian, tiếp tục migration an toàn từ vị trí
          bị gián đoạn.
        next_node: q2_n5
      q2_n4_o2:
        points: 3
        irreversible: false
        consequence_text: Tăng gấp đôi số điểm của 500,000 user trong batch đầu do
          bị cộng trùng.
        next_node: q2_n5
      q2_n4_o3:
        points: 3
        irreversible: false
        consequence_text: Mất sạch dữ liệu điểm cũ của người dùng khi chưa khôi phục
          từ backup.
        next_node: q2_n5
      q2_n5_o1:
        points: 10
        irreversible: false
        consequence_text: Xác nhận tổng điểm chính xác 100% so với trước khi migration.
        next_node: q2_n6
      q2_n5_o2:
        points: 3
        irreversible: false
        consequence_text: Bỏ sót hàng ngàn tài khoản bị lỗi tính toán sai điểm.
        next_node: q2_n6
      q2_n5_o3:
        points: 3
        irreversible: false
        consequence_text: Khách hàng phát hiện sai điểm và gửi khiếu nại hàng loạt.
        next_node: q2_n6
      q2_n6_o1:
        points: 10
        irreversible: false
        consequence_text: Khắc phục triệt để lỗi sai điểm âm thầm và chính xác trước
          khi mở lại tính năng.
        next_node: q2_n7
      q2_n6_o2:
        points: 0
        irreversible: true
        consequence_text: Đã tự động gửi SMS thật thu hồi điểm tới 500 khách hàng
          khiến họ tức giận và đánh giá 1 sao ứng dụng.
        next_node: q2_n7
      q2_n6_o3:
        points: 3
        irreversible: false
        consequence_text: Gây thiệt hại quỹ điểm và làm mất cân bằng kinh tế trong
          game/ứng dụng.
        next_node: q2_n7
      q2_n7_o1:
        points: 10
        irreversible: false
        consequence_text: Tính năng hoạt động lại bình thường, hệ thống phản hồi nhanh
          chóng.
        next_node: q2_n8
      q2_n7_o2:
        points: 0
        irreversible: true
        consequence_text: Đã tự động gọi API nhà mạng gửi 1,000,000 tin nhắn SMS Brandname
          thật và cộng 100,000,000 điểm thật vào tài khoản user, tiêu tốn 500 triệu
          đồng chi phí SMS.
        next_node: q2_n8
      q2_n7_o3:
        points: 3
        irreversible: false
        consequence_text: User chưa cập nhật app ngay dẫn đến không dùng được tính
          năng mới.
        next_node: q2_n8
      q2_n8_o1:
        points: 10
        irreversible: false
        consequence_text: Hệ thống tự động mở rộng tài nguyên, giữ latency ổn định
          dưới 200ms.
        next_node: q2_n9
      q2_n8_o2:
        points: 3
        irreversible: false
        consequence_text: DB Master bị quá tải read query dẫn đến lag toàn bộ hệ thống.
        next_node: q2_n9
      q2_n8_o3:
        points: 3
        irreversible: false
        consequence_text: Cache miss vọt lên 99%, toàn bộ query đâm thẳng vào DB làm
          nghẽn hệ thống.
        next_node: q2_n9
      q2_n9_o1:
        points: 10
        irreversible: false
        consequence_text: Bảo vệ hệ thống không bị sập dây chuyền, các yêu cầu sẽ
          được xử lý khi đối tác phục hồi.
        next_node: q2_n10
      q2_n9_o2:
        points: 3
        irreversible: false
        consequence_text: Tăng gấp đôi tải lên đối tác, khiến IP bị họ block do nghi
          vấn DDOS.
        next_node: q2_n10
      q2_n9_o3:
        points: 0
        irreversible: true
        consequence_text: Đã gọi API bên thứ ba mua và phát hành thật 1,000 Voucher
          đắt tiền ngoài dự toán ngân sách.
        next_node: q2_n10
      q2_n10_o1:
        points: 10
        irreversible: false
        consequence_text: Hoàn tất chiến dịch migration xuất sắc, hệ thống gọn gàng
          và sẵn sàng cho đợt vận hành tiếp theo.
        next_node: END
      q2_n10_o2:
        points: 3
        irreversible: false
        consequence_text: Khi phát hiện dữ liệu lỗi phát sinh sau 2 ngày thì không
          còn bản backup để đối soát.
        next_node: END
      q2_n10_o3:
        points: 3
        irreversible: false
        consequence_text: Bảng tạm chiếm dụng dung lượng đĩa cứng làm chậm tốc độ
          query của DB.
        next_node: END
  difficulty: medium
- content:
    scenario: Kiểm thử trực tiếp tính năng phát Voucher Tết và Push Notification cho
      app di động trên môi trường Production do hệ thống Staging gặp sự cố sập DB.
    nodes:
    - key: q1_n1
      prompt: Bạn cần chuẩn bị tài khoản test trên Prod để chạy thử luồng nhận Voucher
        Tết. Phương án nào an toàn nhất?
      options:
      - key: opt_1_1_1
        label: Tạo tài khoản test với email dev_test_tet@internal.com và thêm user_id
          vào danh sách Whitelist test.
      - key: opt_1_1_2
        label: Sử dụng trực tiếp tài khoản VIP của Giám đốc Sản phẩm để kiểm thử cho
          giống dữ liệu thật.
      - key: opt_1_1_3
        label: Cập nhật trực tiếp flag is_tester = true cho tài khoản của một khách
          hàng ngẫu nhiên.
    - key: q1_n2
      prompt: Bạn chuẩn bị cấu hình mã Voucher giảm giá 500k trên Prod Admin để test.
      options:
      - key: opt_1_2_1
        label: Tạo Voucher 500k kèm điều kiện chỉ áp dụng cho user_id thuộc Whitelist
          internal test.
      - key: opt_1_2_2
        label: Tạo Voucher 500k không giới hạn người dùng nhưng để trạng thái Draft.
      - key: opt_1_2_3
        label: Tạo Voucher 500k Public toàn hệ thống với số lượng 9999 để test xong
          rồi xoá.
    - key: q1_n3
      prompt: Cần kích hoạt tính năng tự động áp mã Voucher khi vào trang Checkout
        để kiểm tra UI/UX.
      options:
      - key: opt_1_3_1
        label: Bật Feature Flag enable_tet_voucher áp dụng riêng cho user_group =
          internal_test.
      - key: opt_1_3_2
        label: Bật Feature Flag enable_tet_voucher cho 1% user ngẫu nhiên trên Prod
          trong 5 phút.
      - key: opt_1_3_3
        label: UPDATE thẳng bảng application_config set auto_apply_voucher = true
          cho toàn bộ người dùng.
    - key: q1_n4
      prompt: Đến bước kiểm tra tính năng Push Notification thông báo tặng Voucher
        Tết.
      options:
      - key: opt_1_4_1
        label: Gửi push notification chỉ định chính xác device_token của thiết bị
          test.
      - key: opt_1_4_2
        label: Bấm nút 'Send All' trên FCM Console để bắn push broadcast cho 500.000
          người dùng thật.
      - key: opt_1_4_3
        label: Gửi push notification đến FCM Topic topic_internal_qa.
    - key: q1_n5
      prompt: Phát hiện mã voucher test lỡ bị áp dụng bởi 3 người dùng thật do nhầm
        lẫn config. Xử lý ra sao?
      options:
      - key: opt_1_5_1
        label: Tắt Feature Flag, vô hiệu hoá mã voucher test, gửi báo cáo incident
          cho CSKH để hỗ trợ giữ trải nghiệm khách hàng.
      - key: opt_1_5_2
        label: Chạy query UPDATE orders SET status = 'CANCELLED' trực tiếp trên DB
          Prod để huỷ đơn của khách.
      - key: opt_1_5_3
        label: Không thao tác gì, âm thầm xoá log trên ứng dụng.
    - key: q1_n6
      prompt: Bạn cần test kết nối tích hợp API tạo đơn vận chuyển với đối tác giao
        vận Express.
      options:
      - key: opt_1_6_1
        label: Dùng API Key Sandbox của bên giao vận để giả lập tạo đơn.
      - key: opt_1_6_2
        label: Gọi thẳng API Prod của bên giao vận tạo đơn thật với địa chỉ văn phòng
          công ty và ghi chú 'Đơn test'.
      - key: opt_1_6_3
        label: Mock response ở tầng Nginx/Gateway để tránh phát sinh request ra bên
          ngoài.
    - key: q1_n7
      prompt: Trong lúc test, hệ thống ghi nhận hàng loạt lỗi NullPointerException
        do tài khoản test thiếu địa chỉ.
      options:
      - key: opt_1_7_1
        label: Cập nhật đầy đủ thông tin địa chỉ giao hàng cho tài khoản test.
      - key: opt_1_7_2
        label: Sửa code bỏ qua validation địa chỉ rồi deploy hotfix không qua review
          lên Prod.
      - key: opt_1_7_3
        label: Tắt toàn bộ log level ERROR của module OrderService để log khỏi bị
          rác.
    - key: q1_n8
      prompt: Bạn muốn dọn dẹp các mã Voucher test đã tạo trong bảng user_vouchers
        trên Prod DB.
      options:
      - key: opt_1_8_1
        label: Chạy script UPDATE user_vouchers SET is_active = false WHERE code =
          'TEST_TET_500K' trong Transaction.
      - key: opt_1_8_2
        label: Chạy lệnh DELETE FROM user_vouchers WHERE code LIKE '%TEST%' không
          có câu lệnh ROLLBACK dự phòng.
      - key: opt_1_8_3
        label: Giữ nguyên dữ liệu test trên DB để lần sau test tiếp.
    - key: q1_n9
      prompt: Quản lý yêu cầu rà soát lại toàn bộ người dùng bị ảnh hưởng trong đợt
        test.
      options:
      - key: opt_1_9_1
        label: Truy vấn bảng notification_logs và order_logs lọc theo created_at trong
          khung giờ test để xuất báo cáo.
      - key: opt_1_9_2
        label: Bắn thêm 1 tin Push Notification toàn hệ thống xin lỗi vì vừa phát
          tin tin nhắn rác.
      - key: opt_1_9_3
        label: Báo cáo miệng với sếp là không có vấn đề gì xảy ra mà không kiểm tra
          DB.
    - key: q1_n10
      prompt: Hoàn tất buổi kiểm thử trên Production. Bạn thực hiện bước cuối cùng
        nào?
      options:
      - key: opt_1_10_1
        label: Tắt Feature Flag test, khoá tài khoản test, tổng hợp Post-mortem báo
          cáo Tech Lead.
      - key: opt_1_10_2
        label: Xoá file log hệ thống bằng rm -rf /var/log/app/* để tiết kiệm dung
          lượng đĩa.
      - key: opt_1_10_3
        label: Rời bàn làm việc đi về mà không bàn giao lại trạng thái Prod cho đội
          On-call.
  answer_key:
    option_effects:
      opt_1_1_1:
        points: 10
        irreversible: false
        consequence_text: 'AN TOÀN: Tài khoản test nằm trong Whitelist, cô lập hoàn
          toàn với người dùng thật.'
        next_node: q1_n2
      opt_1_1_2:
        points: 3
        irreversible: false
        consequence_text: 'RỦI RO: Dữ liệu kiểm thử trộn lẫn với tài khoản sếp, dễ
          gây sai lệch báo cáo và biến động quyền hạn.'
        next_node: q1_n2
      opt_1_1_3:
        points: 3
        irreversible: false
