- content:
    scenario: Cấu hình lại cổng thanh toán ngân hàng VNPAY/Momo và xử lý nghẽn giao
      dịch trong sự kiện Flash Sale 12/12 trên môi trường Production.
    nodes:
    - key: q2_n1
      prompt: Ngân hàng đối tác yêu cầu cung cấp danh sách IP máy chủ Prod để thêm
        vào Whitelist kết nối. Bạn thực hiện ra sao?
      options:
      - key: opt_2_1_1
        label: Lấy danh sách static Egress IP Nat Gateway của hạ tầng Prod gửi đối
          tác.
      - key: opt_2_1_2
        label: Yêu cầu mở 0.0.0.0/0 để tránh mất thời gian cấu hình sau này.
      - key: opt_2_1_3
        label: Gửi public IP của mạng Wi-Fi công ty đang ngồi làm việc.
    - key: q2_n2
      prompt: Bạn cần thực hiện 1 giao dịch nạp tiền 10.000 VND để kiểm tra checksum
        signature kết nối cổng thanh toán.
      options:
      - key: opt_2_2_1
        label: Sử dụng môi trường Sandbox và tài khoản thẻ test do ngân hàng cấp.
      - key: opt_2_2_2
        label: Dùng thẻ ATM/Ví cá nhân nạp 10.000 VND thật qua cổng Prod thanh toán
          đơn hàng test.
      - key: opt_2_2_3
        label: Sửa mã nguồn bỏ qua bước kiểm tra checksum MD5 để đỡ phải test nạp
          tiền.
    - key: q2_n3
      prompt: Callback IPN (Instant Payment Notification) từ cổng thanh toán bị chặn
        bởi WAF (Web Application Firewall).
      options:
      - key: opt_2_3_1
        label: Kiểm tra log WAF và whitelist riêng dải IP callback chính thức của
          ngân hàng.
      - key: opt_2_3_2
        label: Tắt hoàn toàn WAF trong 1 tiếng diễn ra Flash Sale.
      - key: opt_2_3_3
        label: Sửa đường dẫn Callback URL sang một server test không qua WAF.
    - key: q2_n4
      prompt: Phát hiện 50 giao dịch thanh toán bị treo trạng thái PENDING do mất
        kết nối IPN vừa qua. Bạn làm gì?
      options:
      - key: opt_2_4_1
        label: Chạy job Query Transaction Status đối soát trực tiếp với API ngân hàng
          để cập nhật trạng thái thực tế.
      - key: opt_2_4_2
        label: Chạy lệnh SQL UPDATE transactions SET status = 'SUCCESS' WHERE status
          = 'PENDING' cho xong.
      - key: opt_2_4_3
        label: Chạy script gửi SMS tự động thông báo giao dịch thất bại cho tất cả
          50 khách hàng mà chưa kiểm tra trạng thái ngân hàng.
    - key: q2_n5
      prompt: Khách hàng bị trừ tiền 2 lần do bấm nút thanh toán liên tục. Cần xử
        lý hoàn tiền 1 giao dịch bị trùng.
      options:
      - key: opt_2_5_1
        label: Kiểm tra mã giao dịch ngân hàng, lập phiếu đối soát và gọi API Refund
          đối tác thông qua quy trình phê duyệt Admin.
      - key: opt_2_5_2
        label: Xoá record giao dịch bị trùng trong bảng payment_transactions trên
          DB để số liệu đỡ lệch.
      - key: opt_2_5_3
        label: Chuyển khoản cá nhân cho khách hàng để giải quyết nhanh sự cố.
    - key: q2_n6
      prompt: Cần bật log chi tiết để theo dõi luồng giao dịch trong đợt cao điểm
        Flash Sale.
      options:
      - key: opt_2_6_1
        label: Bật log INFO/DEBUG kèm mask các thông tin nhạy cảm (Card Number, CVV).
      - key: opt_2_6_2
        label: Ghi toàn bộ RAW Payload HTTP bao gồm cả số thẻ và CVV vào file log
          để dễ debug.
      - key: opt_2_6_3
        label: Tắt toàn bộ log hệ thống để tối ưu IOPS cho đĩa cứng server.
    - key: q2_n7
      prompt: Bộ nhớ Redis Cache chứa session thanh toán của người dùng tăng vọt đạt
        98%. Bạn xử lý thế nào?
      options:
      - key: opt_2_7_1
        label: Mở rộng tài nguyên RAM Redis và đặt TTL hợp lý cho các key cache tạm.
      - key: opt_2_7_2
        label: Chạy lệnh FLUSHALL trên Redis Prod để giải phóng bộ nhớ ngay lập tức.
      - key: opt_2_7_3
        label: Restart instance Redis chính mà không báo cho đỗi ngũ vận hành.
    - key: q2_n8
      prompt: Hàng đợi Queue xử lý gửi Email hoá đơn thanh toán bị dồn nén hơn 20.000
        job.
      options:
      - key: opt_2_8_1
        label: Tăng số lượng Worker process để tăng tốc độ tiêu thụ job trong Queue.
      - key: opt_2_8_2
        label: Xoá sạch Queue (Purge) để giải phóng hệ thống cho các giao dịch mới.
      - key: opt_2_8_3
        label: Bỏ bớt bước xác thực token trong worker để gửi cho nhanh.
    - key: q2_n9
      prompt: Đối tác cổng thanh toán thông báo hệ thống của họ bị chập chờn trong
        15 phút tới.
      options:
      - key: opt_2_9_1
        label: Bật thông báo tạm ngưng phương thức thanh toán này trên UI app và gợi
          ý kênh thanh toán dự phòng.
      - key: opt_2_9_2
        label: Cứ để nguyên cho khách hàng tiếp tục thanh toán, ai lỗi thì hỗ trợ
          sau.
      - key: opt_2_9_3
        label: Tắt toàn bộ ứng dụng E-commerce trong 15 phút.
    - key: q2_n10
      prompt: Đợt Flash Sale kết thúc thành công. Bạn chốt ca trực như thế nào?
      options:
      - key: opt_2_10_1
        label: Xuất file đối soát tổng giao dịch, bàn giao danh sách đơn refund cho
          Kế toán và ghi lại Post-mortem.
      - key: opt_2_10_2
        label: Chỉnh sửa số liệu giao dịch lỗi trong DB để báo cáo doanh thu đẹp hơn.
      - key: opt_2_10_3
        label: Tắt server Prod để tiết kiệm chi phí cloud sau đợt sale.
