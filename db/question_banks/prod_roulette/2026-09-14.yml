- content:
    scenario: 'Bối cảnh: Bạn là Lead Business Analyst/Product Owner của nền tảng Thương
      Mại Điện Tử. Ngày Black Friday (sự kiện lớn nhất năm), lượng truy cập gấp 20
      lần bình thường. Vào lúc 10:00 sáng, tính năng áp Voucher giảm giá bị lỗi khiến
      người dùng áp được voucher giảm 90% không giới hạn cho các sản phẩm đắt tiền.'
    nodes:
    - key: N2_1
      prompt: 'Bước 1: Hệ thống ghi nhận 1,000 đơn hàng mua iPhone/Laptop với giá
        10% chỉ trong 3 phút. Hành động can thiệp khẩn cấp đầu tiên?'
      options:
      - key: O2_1_1
        label: Yêu cầu DevOps vô hiệu hóa (disable) ngay mã Voucher bị lỗi trên Production
          Config.
      - key: O2_1_2
        label: Tắt toàn bộ hệ thống web/app để bảo trì trong 2 tiếng.
      - key: O2_1_3
        label: Giữ nguyên hệ thống và đợi bộ phận kỹ thuật tìm nguyên nhân bug code.
    - key: N2_2
      prompt: 'Bước 2: Voucher lỗi đã bị tắt. Nhưng có 1,000 đơn hàng sai giá đã được
        khởi tạo ở trạng thái ''Đã thanh toán''. Xử lý 1,000 đơn này thế nào?'
      options:
      - key: O2_2_1
        label: Chạy script tạm hoãn xuất kho (Hold Fulfillment) cho 1,000 đơn này
          để kiểm tra.
      - key: O2_2_2
        label: Tự động gửi email thông báo Hủy đơn hàng cho 1,000 khách hàng ngay
          lập tức.
      - key: O2_2_3
        label: Kệ cho kho tự động đóng gói và giao hàng bình thường.
    - key: N2_3
      prompt: 'Bước 3: Nhà bán hàng (Sellers) kêu trời vì đơn hàng bị ngâm không xử
        lý được. Phản hồi Sellers ra sao?'
      options:
      - key: O2_3_1
        label: Gửi thông báo trên Seller Portal giải thích sự cố kĩ thuật và cam kết
          đền bù chi phí chậm trễ.
      - key: O2_3_2
        label: Yêu cầu Sellers tự chịu trách nhiệm bù tiền tổn thất cho các đơn hàng
          lỗi.
      - key: O2_3_3
        label: Âm thầm khóa tài khoản của các Sellers có đơn hàng lỗi.
    - key: N2_4
      prompt: 'Bước 4: Nguyên nhân do quy tắc cấu hình Voucher bị sai logic ''AND''
        thành ''OR''. Làm sao khắc phục tính năng Voucher?'
      options:
      - key: O2_4_1
        label: Viết lại rule validation trong Admin Portal, test trên Staging rồi
          apply bản vá.
      - key: O2_4_2
        label: Chỉnh sửa trực tiếp giá trị rule trong Database MongoDB bằng lệnh updateOne
          trên Prod.
      - key: O2_4_3
        label: Xóa bỏ hoàn toàn tính năng Voucher ra khỏi hệ thống Black Friday.
    - key: N2_5
      prompt: 'Bước 5: Quyết định phương án xử lý 1,000 đơn hàng sai giá để vừa bảo
        vệ doanh nghiệp vừa xoa dịu người dùng?'
      options:
      - key: O2_5_1
        label: Hủy đơn hàng lỗi, hoàn 100% tiền và gửi tặng Voucher đền bù 20% (tối
          đa 500k) cho lần mua sau.
      - key: O2_5_2
        label: Bắt buộc giao đủ 1,000 đơn hàng sai giá cho khách hàng và công ty chịu
          lỗ toàn bộ.
      - key: O2_5_3
        label: Hủy đơn hàng và không hoàn tiền, khóa luôn tài khoản khách hàng mua
          đơn đó.
    - key: N2_6
      prompt: 'Bước 6: Thực thi việc hủy đơn và đền bù cho khách hàng thế nào?'
      options:
      - key: O2_6_1
        label: Kích hoạt Job hoàn tiền qua cổng thanh toán và tự động gửi Email/Push
          Notification đền bù.
      - key: O2_6_2
        label: Gọi điện thoại thủ công cho từng người trong 1,000 khách hàng để giải
          thích.
      - key: O2_6_3
        label: Gửi SMS Marketing chào hàng sản phẩm mới đến 1,000 khách hàng này.
    - key: N2_7
      prompt: 'Bước 7: Một số khách hàng trục lợi cố tình dùng tool tự động quét lỗi
        voucher (đặt >20 đơn/người). Xử lý nhóm này thế nào?'
      options:
      - key: O2_7_1
        label: Chuyển danh sách tài khoản gian lận sang bộ phận Risk Management để
          hủy đơn và tạm khóa tài khoản.
      - key: O2_7_2
        label: Xóa vĩnh viễn dữ liệu tài khoản và IP của những người này khỏi Database.
      - key: O2_7_3
        label: Bỏ qua vì không muốn làm mất lòng bất kỳ khách hàng nào.
    - key: N2_8
      prompt: 'Bước 8: Cần cập nhật lại luồng Checkout để tránh lỗi quá tải Voucher
        server trong thời gian còn lại của Black Friday?'
      options:
      - key: O2_8_1
        label: Bật Redis Cache cho kết quả validate voucher và áp dụng Queue (RabbitMQ)
          cho luồng tạo đơn.
      - key: O2_8_2
        label: Bỏ bước kiểm tra điều kiện Voucher trong luồng Checkout để app chạy
          nhanh hơn.
      - key: O2_8_3
        label: Tăng timeout của API Checkout lên 30 giây.
    - key: N2_9
      prompt: 'Bước 9: Sau khi chiến dịch Black Friday kết thúc, làm thế nào để đánh
        giá lại thiệt hại và hiệu quả?'
      options:
      - key: O2_9_1
        label: 'Làm báo cáo Reconciliation chi tiết: Doanh thu thực tế, chi phí đền
          bù voucher, tỉ lệ đơn bị hủy.'
      - key: O2_9_2
        label: Chỉ tính tổng doanh thu và bỏ qua phần chi phí do sự cố Voucher gây
          ra.
      - key: O2_9_3
        label: Báo cáo số liệu ảo cho Ban Giám đốc để che giấu sự cố.
    - key: N2_10
      prompt: 'Bước 10: Cải tiến quy trình làm việc giữa BA và Dev để tránh lỗi logic
        cấu hình Promotion sau này?'
      options:
      - key: O2_10_1
        label: Xây dựng Matrix Test Case chuẩn cho Promotion Engine, bổ sung khâu
          UAT Sign-off bắt buộc.
      - key: O2_10_2
        label: Yêu cầu BA phải tự viết code cho các rule Voucher thay vì chuyển tài
          liệu cho Dev.
      - key: O2_10_3
        label: Không bao giờ tạo các chương trình Voucher giảm giá lớn hơn 50% nữa.
