- content:
    scenario: Bạn đang kiểm thử tính năng hoàn tiền tự động (Auto-Refund) trên môi
      trường PRODUCTION cho một nền tảng thương mại điện tử do khách hàng báo lỗi
      hệ thống không chạy.
    nodes:
    - key: STEP_1
      prompt: 'Bước 1: Kiểm tra trạng thái hệ thống trước khi can thiệp.'
      options:
      - key: OPT_1_1
        label: Đọc log ứng dụng trên CloudWatch để kiểm tra exception.
      - key: OPT_1_2
        label: Chạy query UPDATE trực tiếp trên DB Prod để reset trạng thái đơn hàng.
      - key: OPT_1_3
        label: Tắt tạm thời service Refund Worker mà không thông báo.
    - key: STEP_2
      prompt: 'Bước 2: Tìm thấy job bị kẹt trong queue. Bạn cần xử lý message lỗi
        này.'
      options:
      - key: OPT_2_1
        label: Purge toàn bộ message trong SQS queue Prod để làm sạch queue.
      - key: OPT_2_2
        label: Move message lỗi sang Dead Letter Queue (DLQ) để phân tích sau.
      - key: OPT_2_3
        label: Retry message thủ công bằng công cụ nội bộ có kiểm soát.
    - key: STEP_3
      prompt: 'Bước 3: Cần xác nhận thông tin thanh toán của khách hàng gặp lỗi.'
      options:
      - key: OPT_3_1
        label: Truy vấn bảng `transactions` bằng `SELECT * WHERE id = 10293` trên
          Read-Replica.
      - key: OPT_3_2
        label: Gọi trực tiếp API Refund của Payment Gateway bên thứ ba với dữ liệu
          test để thử xem Gateway có sống không.
      - key: OPT_3_3
        label: Kiểm tra Webhook payload trong Staging environment.
    - key: STEP_4
      prompt: 'Bước 4: Cần thay đổi cấu hình timeout của Payment Service.'
      options:
      - key: OPT_4_1
        label: Sửa config trong repository, tạo PR và nhờ Lead review triển khai qua
          CI/CD.
      - key: OPT_4_2
        label: SSH trực tiếp vào server Prod và sửa file `.env`.
      - key: OPT_4_3
        label: Thay đổi tham số trên Config Server động (Spring Cloud Config) mà không
          backup.
    - key: STEP_5
      prompt: 'Bước 5: Phát hiện dữ liệu đơn hàng bị lệch số tiền.'
      options:
      - key: OPT_5_1
        label: Thực hiện script SQL UPDATE fix dữ liệu có trong transaction `BEGIN...COMMIT`
          và kiểm tra kỹ.
      - key: OPT_5_2
        label: Chạy lệnh `TRUNCATE TABLE payment_logs` để xóa dữ liệu rác.
      - key: OPT_5_3
        label: Báo cáo BA và tạo ticket hotfix theo quy trình.
    - key: STEP_6
      prompt: 'Bước 6: Cần gửi thông báo trạng thái xử lý cho khách hàng.'
      options:
      - key: OPT_6_1
        label: Bật trigger gửi SMS tự động tới người dùng thật chứa mã OTP test.
      - key: OPT_6_2
        label: Tạo bản tin cập nhật trên trang trạng thái hệ thống (Status Page) ở
          chế độ nội bộ.
      - key: OPT_6_3
        label: Nhờ CSKH gửi email thủ công theo mẫu chuẩn sau khi hoàn tất.
    - key: STEP_7
      prompt: 'Bước 7: Tải bộ log đầy đủ để phục vụ điều tra.'
      options:
      - key: OPT_7_1
        label: Dump toàn bộ database Prod ra file `.sql` đặt ở thư mục `/public` của
          web server.
      - key: OPT_7_2
        label: Export log giao dịch dạng CSV qua công cụ Admin Portal có mask thông
          tin nhạy cảm.
      - key: OPT_7_3
        label: Chạy script Python crawl log từ server Prod về máy cá nhân.
    - key: STEP_8
      prompt: 'Bước 8: Tải lại cấu hình hệ thống.'
      options:
      - key: OPT_8_1
        label: Chạy `systemctl reload payment-service` để nhận config mới.
      - key: OPT_8_2
        label: Reboot lại toàn bộ Server Prod ngay lập tức.
      - key: OPT_8_3
        label: Thực hiện Graceful Reload từng instance đằng sau Load Balancer.
    - key: STEP_9
      prompt: 'Bước 9: Kiểm thử lại quy trình hoàn tiền.'
      options:
      - key: OPT_9_1
        label: Tạo giao dịch thật 1,000đ trên Prod để test hoàn tiền và hủy ngay sau
          đó.
      - key: OPT_9_2
        label: Sử dụng tài khoản Sandbox của Gateway để test trên môi trường UAT.
      - key: OPT_9_3
        label: Mock response của Payment Gateway trong code Prod tạm thời.
    - key: STEP_10
      prompt: 'Bước 10: Tổng kết sự cố và đóng ticket.'
      options:
      - key: OPT_10_1
        label: Viết báo cáo Post-mortem chi tiết và họp rút kinh nghiệm với team.
      - key: OPT_10_2
        label: Xóa toàn bộ log thao tác cá nhân trên server để tránh bị truy trách
          nhiệm.
      - key: OPT_10_3
        label: Đóng ticket và ghi chú ngắn gọn 'Fixed'.
