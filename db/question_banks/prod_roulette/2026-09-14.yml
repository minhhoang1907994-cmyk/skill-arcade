  difficulty: hard
- content:
    scenario: Bạn là dev đang khắc phục sự cố hiệu năng (slow query) cho dịch vụ thanh
      toán trên hệ thống PRODUCTION vào giờ cao điểm. Cơ sở dữ liệu Postgres đang
      báo load 98%.
    nodes:
    - key: step_1
      prompt: 'Bước 1: Hệ thống bắt đầu chậm, bạn làm gì đầu tiên?'
      options:
      - key: s1_opt1
        label: Kiểm tra danh sách query đang chạy bằng pg_stat_activity
      - key: s1_opt2
        label: Restart ngay cụm DB để giải phóng RAM
      - key: s1_opt3
        label: Tăng ngay dung lượng CPU/RAM của server DB mà không kiểm tra
    - key: step_2
      prompt: 'Bước 2: Tìm thấy query ''SELECT * FROM orders WHERE status = ''PENDING''''
        đang scan toàn bảng. Bạn giải quyết sao?'
      options:
      - key: s2_opt1
        label: Tạo index CONCURRENTLY trên cột status
      - key: s2_opt2
        label: Tạo index thường (BLOCKING) ngay lập tức
      - key: s2_opt3
        label: Kill toàn bộ connection đang thực hiện query này
    - key: step_3
      prompt: 'Bước 3: Việc đánh index tốn thời gian, bạn cần tạm thời giảm tải DB
        ngay.'
      options:
      - key: s3_opt1
        label: Bật Redis cache cho API truy vấn đơn hàng
      - key: s3_opt2
        label: Xoá bớt dữ liệu đơn hàng cũ quá 30 ngày trực tiếp trên PROD
      - key: s3_opt3
        label: Chạy script update ngầm hàng loạt các đơn hàng PENDING thành FAILED
    - key: step_4
      prompt: 'Bước 4: Script lỡ làm treo kết nối đến bên thứ 3, webhook callback
        trả về dồn dập.'
      options:
      - key: s4_opt1
        label: Tạm dừng tiếp nhận Webhook qua Rate Limiter
      - key: s4_opt2
        label: Gửi API Trigger sang Gateway cổng thanh toán để huỷ toàn bộ giao dịch
          đang chờ
      - key: s4_opt3
        label: Tắt hẳn firewall để nhận request nhanh hơn
    - key: step_5
      prompt: 'Bước 5: Nhận thấy một số giao dịch bị duplicate. Khách hàng bắt đầu
        phản ánh.'
      options:
      - key: s5_opt1
        label: Tra cứu log giao dịch trùng và gửi ticket cho bộ phận CSKH đối soát
      - key: s5_opt2
        label: Tự động gọi API Hoàn tiền (Refund) của Cổng thanh toán cho tất cả đơn
          duplicate
      - key: s5_opt3
        label: Sửa lại số tiền trong database về 0
    - key: step_6
      prompt: 'Bước 6: Cần gửi thông báo xin lỗi người dùng bị ảnh hưởng.'
      options:
      - key: s6_opt1
        label: Soạn danh sách UID bị ảnh hưởng và gửi Push Notification hàng loạt
          qua Firebase
      - key: s6_opt2
        label: Lọc danh sách, kiểm tra kỹ lưỡng và chuyển bộ phận Marketing gửi mail
      - key: s6_opt3
        label: Đăng thông báo lên Banner ứng dụng
    - key: step_7
      prompt: 'Bước 7: Ứng dụng khôi phục dần, nhưng dung lượng đĩa cứng server log
        sắp đầy.'
      options:
      - key: s7_opt1
        label: Nén bớt log cũ và upload lên S3 bucket lưu trữ
      - key: s7_opt2
        label: Thực hiện `rm -rf /var/log/*` để giải phóng dung lượng khẩn cấp
      - key: s7_opt3
        label: Gắn thêm ổ đĩa EBS mới và mount vào hệ thống
    - key: step_8
      prompt: 'Bước 8: Cần hotfix đoạn code xử lý duplicate giao dịch.'
      options:
      - key: s8_opt1
        label: Tạo Pull Request, chạy CI/CD test, review và deploy theo quy trình
      - key: s8_opt2
        label: SSH trực tiếp vào server PROD và edit file code .py/.js bằng vim
      - key: s8_opt3
        label: Bỏ qua các bước Automation Test để merge thẳng vào branch main và release
    - key: step_9
      prompt: 'Bước 9: Sau khi hotfix, hệ thống chạy ổn định nhưng cần đền bù cho
        khách hàng.'
      options:
      - key: s9_opt1
        label: Gửi Voucher giảm giá thật qua API Promotion cho tất cả người dùng hệ
          thống
      - key: s9_opt2
        label: Tạo danh sách khách hàng bị ảnh hưởng để CSKH gọi điện chăm sóc
      - key: s9_opt3
        label: Cộng điểm thưởng vào tài khoản khách hàng thông qua công cụ Admin
    - key: step_10
      prompt: 'Bước 10: Sự cố kết thúc, công việc tiếp theo là gì?'
      options:
      - key: s10_opt1
        label: Tổ chức họp Post-mortem tìm nguyên nhân gốc rễ và lập kế hoạch phòng
          ngừa
      - key: s10_opt2
        label: Xoá toàn bộ log sự cố để tránh bị quy trách nhiệm
      - key: s10_opt3
        label: Đóng ticket và không làm gì thêm vì hệ thống đã chạy lại bình thường
  answer_key:
    option_effects:
      s1_opt1:
        points: 10
        irreversible: false
        consequence_text: An toàn. Giúp xác định chính xác query gây khóa/nghẽn hệ
          thống mà không ảnh hưởng dịch vụ.
        next_node: step_2
      s1_opt2:
        points: 3
        irreversible: false
        consequence_text: Rủi ro. Restart DB đột ngột làm gián đoạn toàn bộ giao dịch
          đang xử lý và gây mất kết nối ứng dụng.
        next_node: step_2
      s1_opt3:
        points: 3
        irreversible: false
        consequence_text: Rủi ro. Tốn chi phí hạ tầng và mất thời gian reboot/chờ
          cấp phát tài nguyên mà không giải quyết tận gốc.
        next_node: step_2
      s2_opt1:
        points: 10
        irreversible: false
        consequence_text: An toàn. Đánh index không khóa bảng, hệ thống vẫn phục vụ
          đọc/ghi bình thường.
        next_node: step_3
      s2_opt2:
        points: 3
        irreversible: false
        consequence_text: Rủi ro. Đánh index thường gây Lock table, khiến toàn bộ
          giao dịch tạo mới bị timeout.
        next_node: step_3
      s2_opt3:
        points: 3
        irreversible: false
        consequence_text: Rủi ro. Kill connection khiến người dùng gặp lỗi 500, nhưng
          giải phóng được CPU khẩn cấp.
        next_node: step_3
      s3_opt1:
        points: 10
        irreversible: false
        consequence_text: An toàn. Giảm đáng kể số lượng query đọc trực tiếp vào database.
        next_node: step_4
      s3_opt2:
        points: 3
        irreversible: false
        consequence_text: Rủi ro. Xoá dữ liệu trên PROD có thể khôi phục lại từ bản
          backup nhưng làm gián đoạn việc tra cứu.
        next_node: step_4
      s3_opt3:
        points: 3
        irreversible: false
        consequence_text: Rủi ro. Thay đổi sai trạng thái đơn hàng làm sai lệch logic
          nghiệp vụ kinh doanh.
        next_node: step_4
      s4_opt1:
        points: 10
        irreversible: false
        consequence_text: An toàn. Giúp kiểm soát lưu lượng đầu vào, webhook bị ngắt
          sẽ retry sau.
        next_node: step_5
      s4_opt2:
        points: 0
        irreversible: true
        consequence_text: 'KHÔNG THỂ THU HỒI: Đã gọi API bên thứ ba để huỷ thật toàn
          bộ giao dịch, khiến tiền của khách đã trừ không thể tự hoàn khớp.'
        next_node: step_5
      s4_opt3:
        points: 3
        irreversible: false
        consequence_text: Rủi ro. Mở trống hệ thống tạo nguy cơ an ninh mạng và không
          giúp tăng hiệu năng xử lý.
        next_node: step_5
      s5_opt1:
        points: 10
        irreversible: false
        consequence_text: An toàn. Đảm bảo quy trình nghiệp vụ đối soát trước khi
          can thiệp tài chính.
        next_node: step_6
      s5_opt2:
        points: 0
        irreversible: true
        consequence_text: 'KHÔNG THỂ THU HỒI: Đã gọi API Refund ngân hàng thật. Một
          số đơn bị hoàn tiền nhầm gây thất thoát ngân sách.'
        next_node: step_6
      s5_opt3:
        points: 3
        irreversible: false
        consequence_text: Rủi ro. Làm sai lệch dữ liệu kế toán trong database, cần
          rollback lại từ log.
        next_node: step_6
      s6_opt1:
        points: 0
        irreversible: true
        consequence_text: 'KHÔNG THỂ THU HỒI: Đã bắn Push Notification thật tới hàng
          nghìn người dùng, bao gồm cả người không bị ảnh hưởng gây hoang mang.'
        next_node: step_7
      s6_opt2:
        points: 10
        irreversible: false
        consequence_text: An toàn. Kiểm tra danh sách kỹ lưỡng trước khi truyền thông.
        next_node: step_7
      s6_opt3:
        points: 10
        irreversible: false
        consequence_text: An toàn. Thông báo chung không gửi đích danh, dễ điều chỉnh
          nội dung.
        next_node: step_7
      s7_opt1:
        points: 10
        irreversible: false
        consequence_text: An toàn. Giải phóng bộ nhớ và vẫn giữ lại log để tra cứu
          sau này.
        next_node: step_8
      s7_opt2:
        points: 3
        irreversible: false
        consequence_text: Rủi ro. Xoá mất file log đang ghi của dịch vụ khiến service
          bị crash hoặc mất vết điều tra.
        next_node: step_8
      s7_opt3:
        points: 10
        irreversible: false
        consequence_text: An toàn. Mở rộng tài nguyên lưu trữ đúng chuẩn kỹ thuật.
        next_node: step_8
      s8_opt1:
        points: 10
        irreversible: false
        consequence_text: An toàn. Đảm bảo chất lượng code và không phát sinh bug
          mới.
        next_node: step_9
      s8_opt2:
        points: 3
        irreversible: false
        consequence_text: Rủi ro. Sửa trực tiếp code trên server dễ dẫn đến sai lệch
          source code với Git và tạo syntax error.
        next_node: step_9
      s8_opt3:
        points: 3
        irreversible: false
        consequence_text: Rủi ro. Bỏ qua test dễ làm lọt bug nghiêm trọng hơn vào
          bản release.
        next_node: step_9
      s9_opt1:
        points: 0
        irreversible: true
        consequence_text: 'KHÔNG THỂ THU HỒI: Đã phát hành Voucher thật vào tài khoản
          người dùng trên PROD, gây tổn thất chi phí lớn.'
        next_node: step_10
      s9_opt2:
        points: 10
        irreversible: false
        consequence_text: An toàn. Xử lý cá thể hoá đúng đối tượng bị thiệt hại.
        next_node: step_10
      s9_opt3:
        points: 3
        irreversible: false
        consequence_text: Rủi ro. Cộng nhầm điểm có thể phải thao tác trừ thủ công
          lại.
        next_node: step_10
      s10_opt1:
        points: 10
        irreversible: false
        consequence_text: An toàn. Giúp rút kinh nghiệm và nâng cao độ tin cậy của
