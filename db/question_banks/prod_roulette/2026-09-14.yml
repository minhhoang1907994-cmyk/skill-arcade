        consequence_text: Bỏ qua test dẫn tới không phát hiện lỗi SDK sớm.
        next_node: M6
      M6_O1:
        points: 10
        irreversible: false
        consequence_text: Ngắt tổn thất nhanh chóng bằng Feature Flag.
        next_node: M7
      M6_O2:
        points: 3
        irreversible: false
        consequence_text: 'Lỗ hổng bảo mật nghiêm trọng: Kẻ gian có thể giả mạo callback
