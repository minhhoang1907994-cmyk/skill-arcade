- content:
    scenario: 'Bối cảnh: Bạn là DevOps Lead. Hệ thống Push Notification / SMS OTP
      cho 2 triệu người dùng ứng dụng ngân hàng số đang gặp hiện tượng chậm trễ nghiêm
      trọng. Bạn cần truy vết và xử lý nóng trên môi trường PRODUCTION.'
    nodes:
    - key: node_21
      prompt: 'Bước 1: Hệ thống cảnh báo queue thông báo nghẽn 100,000 message. Bạn
        làm gì đầu tiên?'
      options:
      - key: opt_21_a
        label: Tăng số lượng Consumer pod từ 5 lên 50 để xả queue nhanh chóng.
      - key: opt_21_b
        label: Purge (xoá sạch) toàn bộ message trong Kafka/RabbitMQ queue để nhẹ
          hệ thống.
      - key: opt_21_c
        label: Tạm dừng dịch vụ gửi push notification để kiểm tra nguyên nhân.
    - key: node_22
      prompt: 'Bước 2: Phát hiện provider SMS nhà mạng A bị sập API. Bạn xử lý luồng
        SMS OTP như thế nào?'
      options:
      - key: opt_22_a
        label: Bật Feature Flag chuyển hướng toàn bộ SMS OTP sang Nhà mạng B dự phòng.
      - key: opt_22_b
        label: Sửa trực tiếp code router trong container đang chạy để bỏ qua Nhà mạng
          A.
      - key: opt_22_c
        label: Tắt hẳn tính năng gửi OTP, cho phép người dùng đăng nhập không cần
          OTP.
    - key: node_23
      prompt: 'Bước 3: Nhà mạng B yêu cầu xác thực bằng OAuth Access Token mới. Bạn
        lấy token từ đâu?'
      options:
      - key: opt_23_a
        label: Lấy credentials từ AWS Secrets Manager / Vault để generate token tự
          động.
      - key: opt_23_b
        label: Xin Secret Key từ chat group đồng nghiệp rồi hardcode vào file config
          trên Prod.
      - key: opt_23_c
        label: Tạo token từ Postman máy cá nhân rồi dán trực tiếp vào biến môi trường
          Pod.
    - key: node_24
      prompt: 'Bước 4: Cần giải phóng các message Push Notification tin tức quảng
        cáo đang chen hàng OTP quan trọng.'
      options:
      - key: opt_24_a
        label: 'Tạo Priority Queue: Ưu tiên OTP mức 1, đẩy tin quảng cáo xuống mức
          2.'
      - key: opt_24_b
        label: Gọi API của Firebase Cloud Messaging (FCM) gửi thông báo đẩy (Push
          Notification) đến toàn bộ 2 triệu thiết bị để thông báo hệ thống đang bảo
          trì.
      - key: opt_24_c
        label: Drop toàn bộ bảng notification_logs trong Database.
    - key: node_25
      prompt: 'Bước 5: Database lưu lịch sử thông báo bị quá tải IOPS do số lượng
        record tăng đột biến.'
      options:
      - key: opt_25_a
        label: Chuyển tạm thời việc ghi log sang Redis/Elasticsearch thay vì ghi trực
          tiếp RDBMS.
      - key: opt_25_b
        label: Tắt toàn bộ cơ chế ghi log của hệ thống để giảm IOPS.
      - key: opt_25_c
        label: Xoá bớt dữ liệu các tháng trước bằng DELETE FROM notifications WHERE
          created_at < NOW().
    - key: node_26
      prompt: 'Bước 6: Phát hiện một số tin nhắn OTP bị gửi lặp lại 5-10 lần cho 1
        số điện thoại.'
      options:
      - key: opt_26_a
        label: Thêm cơ chế Idempotency Key / Redis Lock theo phone_number với TTL
          60 giây.
      - key: opt_26_b
        label: Block toàn bộ các số điện thoại đang bị gửi lặp vào Blacklist hệ thống.
      - key: opt_26_c
        label: Restart lại Redis Cache Cluster để xóa bộ nhớ tạm.
    - key: node_27
      prompt: 'Bước 7: Một máy chủ Worker bị tràn bộ nhớ (OOM Killed) liên tục.'
      options:
      - key: opt_27_a
        label: Trích xuất Heap Dump, giảm batch size xử lý của Worker và tăng Memory
          Limit phù hợp.
      - key: opt_27_b
        label: Sửa Kubernetes deployment đặt memory limit = unlimited.
      - key: opt_27_c
        label: Viết script cronjob tự động restart worker mỗi 5 phút một lần.
    - key: node_28
      prompt: 'Bước 8: Phía Nhà mạng A thông báo đã khắc phục xong sự cố mạng.'
      options:
      - key: opt_28_a
        label: Mở traffic 10% sang Nhà mạng A (Canary Testing), theo dõi 15 phút trước
          khi khôi phục 100%.
      - key: opt_28_b
        label: Chuyển ngay lập tức 100% traffic về Nhà mạng A.
      - key: opt_28_c
        label: Bỏ qua Nhà mạng A luôn, dùng cố định Nhà mạng B lâu dài mà không kiểm
          tra hợp đồng.
    - key: node_29
      prompt: 'Bước 9: Kiểm tra dư lượng bù tiền cước SMS phát sinh trong quá trình
        chuyển hướng.'
      options:
      - key: opt_29_a
        label: Xuất dữ liệu log đối soát số lượng SMS thực tế đã gửi thành công qua
          từng nhà mạng.
      - key: opt_29_b
        label: Lấy số liệu ước tính trên Dashboard hiển thị để thanh toán với nhà
          mạng.
      - key: opt_29_c
        label: Không cần đối soát vì nhà mạng sẽ tự gửi hóa đơn chuẩn.
    - key: node_30
      prompt: 'Bước 10: Đưa hệ thống về trạng thái vận hành bình thường chuẩn bị kết
        thúc ca trực.'
      options:
      - key: opt_30_a
        label: Scale down số pod worker về mức chuẩn, cập nhật tài liệu Runbook và
          thông báo cho các bên.
      - key: opt_30_b
        label: Giữ nguyên 50 pod worker chạy vô thời hạn để phòng ngừa nghẽn.
      - key: opt_30_c
        label: Tắt toàn bộ hệ thống cảnh báo (Alertmanager) để tránh bị làm phiền
          ban đêm.
