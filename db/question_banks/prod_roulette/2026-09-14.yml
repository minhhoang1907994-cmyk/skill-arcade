        next_node: M7
      M6_O3:
        points: 3
        irreversible: false
        consequence_text: Giao dịch lỗi tiếp tục tăng lên trong 30 phút.
        next_node: M7
      M7_O1:
        points: 10
        irreversible: false
        consequence_text: Xử lý chính xác trạng thái theo ngân hàng.
        next_node: M8
      M7_O2:
