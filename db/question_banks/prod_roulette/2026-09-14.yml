  difficulty: medium
- content:
    scenario: 'Bối cảnh: Bạn là Senior Developer đang trực hỗ trợ hệ thống Ví Điện
      Tử vào ca đêm. Lúc 23:30, hệ thống cảnh báo tỉ lệ giao dịch lỗi tăng vọt trên
      Production sau khi một Junior Dev deploy bản hotfix cho dịch vụ Thanh Toán (Payment
      Service). Người dùng bắt đầu phàn nàn trên MXH vì bị trừ tiền nhưng không nhận
      được mã thẻ cào.'
    nodes:
    - key: N1
      prompt: 'Bước 1: Hệ thống phát cảnh báo PagerDuty. Bạn tiếp nhận sự cố này như
        thế nào đầu tiên?'
      options:
      - key: O1_1
        label: Tắt thông báo PagerDuty để tập trung suy nghĩ và tự soi code một mình.
      - key: O1_2
        label: Kiểm tra dashboard Kibana/Grafana để xem thông số CPU, Memory và HTTP
          Status 5xx.
      - key: O1_3
        label: Tự ý ssh thẳng vào server Production và gõ lệnh top/htop để xem tiến
          trình.
    - key: N2
      prompt: 'Bước 2: Log Kibana hiển thị lỗi ''Connection timeout to Provider Gate''.
        Bạn làm gì tiếp theo?'
      options:
      - key: O2_1
        label: Tăng timeout của HTTP Client từ 5s lên 60s trên Production config rồi
          reload.
      - key: O2_2
        label: Gọi điện xác nhận trực tiếp với bộ phận kĩ thuật phía đối tác cổng
          thanh toán.
      - key: O2_3
        label: Chạy script auto-retry vô hạn các request lỗi ngay lập tức.
    - key: N3
      prompt: 'Bước 3: Đối tác xác nhận hệ thống họ bình thường. Lỗi do hotfix mới
        deploy bị lặp loop DB call. Bạn xử lý hotfix thế nào?'
      options:
      - key: O3_1
        label: Thực hiện Rollback ngay lập tức về bản build stable trước đó qua Jenkins
          pipeline.
      - key: O3_2
        label: Sửa code trực tiếp trong container Production đang chạy bằng lệnh docker
          exec.
      - key: O3_3
        label: Commit bản patch mới lên Git và trigger CI/CD deploy đè lên.
    - key: N4
      prompt: 'Bước 4: Sau khi rollback, ứng dụng đã ổn định nhưng có 500 giao dịch
        bị treo ở trạng thái PENDING. Xử lý dữ liệu thế nào?'
      options:
      - key: O4_1
        label: Viết câu lệnh SQL UPDATE trực tiếp bảng orders set status='FAILED'
          cho 500 bản ghi.
      - key: O4_2
        label: Xuất danh sách 500 transaction ID ra file CSV và gọi công cụ Reconciliation
          tự động kiểm tra lại.
      - key: O4_3
        label: Chạy job tự động hoàn tiền (refund) ngay lập tức cho toàn bộ 500 giao
          dịch này mà không đối soát.
    - key: N5
      prompt: 'Bước 5: Trong 500 giao dịch, phát hiện 50 giao dịch thực chất đã trừ
        tiền bên ngân hàng nhưng DB nhà mạng chưa trả mã. Giải quyết 50 case này ra
        sao?'
      options:
      - key: O5_1
        label: Bấm nút gửi lại API mua mã thẻ bên nhà mạng (Re-trigger partner API)
          cho 50 case.
      - key: O5_2
        label: Bấm nút Hoàn Tiền (Refund) trên hệ thống quản trị, tự động trả tiền
          về ví cho 50 khách hàng.
      - key: O5_3
        label: Gửi SMS xin lỗi kèm mã giảm giá 50k cho 50 khách hàng này ngay trên
          Production tool.
    - key: N6
      prompt: 'Bước 6: Có 10 khách hàng bị trừ tiền 2 lần do lỗi retry lúc trước.
        Bạn xử lý vấn đề tiền tệ này thế nào?'
      options:
      - key: O6_1
        label: Tạo giao dịch Refund 1 lần tiền dư thừa qua cổng thanh toán ngân hàng
          cho khách hàng.
      - key: O6_2
        label: Gửi tin nhắn Push Notification bảo khách hàng tự lên văn phòng làm
          thủ tục.
      - key: O6_3
        label: Cập nhật trực tiếp số dư ví (balance) trong Database SQL của 10 user
          này bằng tay.
    - key: N7
      prompt: 'Bước 7: Người dùng trên Facebook đăng bài bóc phốt ví lừa đảo. Bộ phận
        CSKH cần thông tin chính thức. Bạn cung cấp gì?'
      options:
      - key: O7_1
        label: Cung cấp bản báo cáo kỹ thuật sơ bộ gồm mốc thời gian, nguyên nhân
          và tiến độ xử lý cho CSKH.
      - key: O7_2
        label: Tự đăng nhập tài khoản cá nhân vào bài viết để tranh cãi với khách
          hàng.
      - key: O7_3
        label: Chụp ảnh màn hình Database chứa thông tin cá nhân khách hàng gửi cho
          CSKH đăng công khai.
    - key: N8
      prompt: 'Bước 8: Cần đảm bảo sự cố không tái diễn khi giao dịch tăng cao trở
        lại vào sáng hôm sau. Bạn cấu hình hệ thống thế nào?'
      options:
      - key: O8_1
        label: Bật Rate Limiting cho API Thanh toán và tăng số lượng Pod/Instance
          lên gấp đôi.
      - key: O8_2
        label: Tắt toàn bộ log của dịch vụ Payment để giảm tải Disk I/O.
      - key: O8_3
        label: Xóa bớt dữ liệu lịch sử trong bảng transaction_history để giảm dung
          lượng DB.
    - key: N9
      prompt: 'Bước 9: Sáng hôm sau, CTO yêu cầu họp khẩn cấp để kiểm điểm sự cố.
        Bạn chuẩn bị những gì?'
      options:
      - key: O9_1
        label: Chuẩn bị tài liệu Post-mortem phân tích root cause, timeline và đề
          xuất action items khắc phục.
      - key: O9_2
        label: Đổ lỗi hoàn toàn cho Junior Dev đã viết code lỗi và yêu cầu sa thải
          Junior.
      - key: O9_3
        label: Xóa hết log liên quan đến bản hotfix để tránh bị truy cứu trách nhiệm.
    - key: N10
      prompt: 'Bước 10: Hành động lâu dài để ngăn ngừa việc deploy hotfix gây lỗi
        Production trong tương lai?'
      options:
      - key: O10_1
        label: Bắt buộc mọi hotfix phải qua Staging test, có Peer Review và chạy Integration
          Test tự động.
      - key: O10_2
        label: Cấm hoàn toàn việc deploy hotfix vào buổi tối dưới mọi hình thức.
      - key: O10_3
        label: Tự tay Senior Dev sẽ trực tiếp code toàn bộ tính năng và không cho
          Junior đụng vào code.
  answer_key:
    option_effects:
      O1_1:
        points: 3
        irreversible: false
        consequence_text: Bỏ qua cảnh báo khiến sự cố kéo dài thêm 15 phút, số lượng
          người dùng ảnh hưởng tăng gấp đôi.
        next_node: N2
      O1_2:
        points: 10
        irreversible: false
        consequence_text: Xác định chính xác tỉ lệ lỗi 504 Gateway Timeout tăng từ
          0.1% lên 45% ngay sau thời điểm deploy.
        next_node: N2
      O1_3:
        points: 3
        irreversible: false
        consequence_text: Thao tác trên Prod server gây tăng CPU spiking ngẫu nhiên,
          nguy cơ gõ nhầm lệnh nguy hiểm.
        next_node: N2
      O2_1:
        points: 3
        irreversible: false
        consequence_text: Tăng timeout làm các thread bị nghẽn (connection pool exhaustion),
          khiến toàn bộ trang web dừng hoạt động.
        next_node: N3
      O2_2:
        points: 10
        irreversible: false
        consequence_text: Đối tác xác nhận hạ tầng của họ hoàn toàn bình thường, khoanh
          vùng nguyên nhân nằm ở bản release nội bộ.
        next_node: N3
      O2_3:
        points: 3
        irreversible: false
        consequence_text: Script retry vô hạn làm DDOS ngược lại hệ thống nội bộ,
          database bị khóa bảng (deadlock).
        next_node: N3
      O3_1:
        points: 10
        irreversible: false
        consequence_text: Hệ thống trở lại trạng thái ổn định sau 2 phút rollback.
          Tỉ lệ lỗi HTTP 5xx giảm về 0%.
        next_node: N4
      O3_2:
        points: 3
        irreversible: false
        consequence_text: Sửa code trực tiếp làm sai lệch checksum image container,
          gây lệch source code giữa môi trường Git và Prod.
        next_node: N4
      O3_3:
