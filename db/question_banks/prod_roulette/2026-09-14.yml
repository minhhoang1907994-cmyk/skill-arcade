  difficulty: medium
- content:
    scenario: Hệ thống Loyal Marketing đang diễn ra chiến dịch tặng Voucher tri ân
      nhân dịp sinh nhật ứng dụng. Bạn là BA/Dev chịu trách nhiệm giám sát và điều
      chỉnh hạn mức Voucher trên PRODUCTION.
    nodes:
    - key: N1
      prompt: 'Bước 1: Hệ thống cảnh báo lượng Voucher phát ra tăng đột biến.'
      options:
      - key: O1_1
        label: Kiểm tra Dashboard Grafana để theo dõi rate của API `claimVoucher`.
      - key: O1_2
        label: Xóa ngay lập tức bảng `vouchers` trong Database để ngăn chặn.
      - key: O1_3
        label: Tắt bớt 1 instance của Voucher Service.
    - key: N2
      prompt: 'Bước 2: Cần tạm dừng chiến dịch để kiểm tra điều kiện phát Voucher.'
      options:
      - key: O2_1
        label: Chuyển flag `IS_CAMPAIGN_ACTIVE` thành `false` trong bảng Redis config.
      - key: O2_2
        label: Gửi Push Notification thông báo hủy chiến dịch đến tất cả người dùng
          ngay lập tức.
      - key: O2_3
        label: Sửa code logic điều kiện trong file controller rồi commit trực tiếp
          lên branch `main`.
    - key: N3
      prompt: 'Bước 3: Phát hiện bug khiến 1 user có thể nhận được nhiều voucher giảm
        50%. Cần khoá tính năng này.'
      options:
      - key: O3_1
        label: Bật WAF rule để block traffic đến endpoint `/api/v1/vouchers/claim`.
      - key: O3_2
        label: Đổi mật khẩu Master Database để dừng toàn bộ kết nối.
      - key: O3_3
        label: Khởi động lại Server Nginx.
    - key: N4
      prompt: 'Bước 4: Kiểm tra danh sách những người dùng đã nhận sai Voucher.'
      options:
      - key: O4_1
        label: Xuất file Excel danh sách user bị ảnh hưởng từ Read Replica DB.
      - key: O4_2
        label: Chạy lệnh `DELETE FROM user_vouchers` cho toàn bộ user đăng ký hôm
          nay.
      - key: O4_3
        label: Khóa tài khoản của tất cả người dùng có trong danh sách nhận voucher.
    - key: N5
      prompt: 'Bước 5: Xử lý các Voucher bị phát sai nhưng CHƯA được sử dụng.'
      options:
      - key: O5_1
        label: Cập nhật trạng thái `status = 'EXPIRED'` cho các Voucher lỗi trong
          DB.
      - key: O5_2
        label: Gửi email hàng loạt thông báo tặng thêm Voucher 100k để đền bù.
      - key: O5_3
        label: Gửi Push Notification thông báo thu hồi Voucher đến danh sách người
          dùng bị ảnh hưởng.
    - key: N6
      prompt: 'Bước 6: Xử lý các Voucher bị phát sai VÀ ĐÃ ĐƯỢC SỬ DỤNG để mua hàng
        thành công.'
      options:
      - key: O6_1
        label: Tự động tạo lệnh Hủy đơn hàng (Cancel Order) và đòi lại tiền từ ví
          người dùng qua API thanh toán.
      - key: O6_2
        label: Đoạn ghi nhận lỗ tổn thất, chuyển danh sách cho bộ phận Risk Management
          đánh giá xử lý thủ công.
      - key: O6_3
        label: Xóa thông tin giao dịch trong bảng `orders` để làm sạch báo cáo.
    - key: N7
      prompt: 'Bước 7: Cập nhật lại điều kiện cấp phát Voucher đúng quy chuẩn nghiệp
        vụ.'
      options:
      - key: O7_1
        label: Viết Unit Test bổ sung, tạo Merge Request và deploy qua quy trình CI/CD
          chuẩn.
      - key: O7_2
        label: Hotfix code trực tiếp trên Production Container bằng lệnh `docker exec`.
      - key: O7_3
        label: Bỏ qua bước Test trên Staging để deploy thẳng bản fix lên Prod cho
          kịp giờ.
    - key: N8
      prompt: 'Bước 8: Mở lại chiến dịch Marketing sau khi đã fix lỗi.'
      options:
      - key: O8_1
        label: Bật lại flag `IS_CAMPAIGN_ACTIVE = true` và giám sát chỉ số trên Dashboard.
      - key: O8_2
        label: Bắn Push Notification cho TOÀN BỘ 5 triệu người dùng ứng dụng để quảng
          bá lại chiến dịch.
      - key: O8_3
        label: Tăng hạn mức Voucher lên gấp 10 lần để bù đắp thời gian gián đoạn.
    - key: N9
      prompt: 'Bước 9: Khách hàng khiếu nại do bị thu hồi Voucher hợp lệ do quét lầm.'
      options:
      - key: O9_1
        label: Kiểm tra log audit trail, khôi phục lại Voucher và phát bù Voucher
          xin lỗi cho khách hàng đó.
      - key: O9_2
        label: Từ chối giải quyết và đóng ticket khiếu nại.
      - key: O9_3
        label: Cấp cho khách hàng quyền Admin để tự tạo Voucher mới.
    - key: N10
      prompt: 'Bước 10: Hoàn tất xử lý sự cố.'
      options:
      - key: O10_1
        label: Tổ chức cuộc họp Post-mortem, cập nhật tài liệu SRS và bổ sung monitoring
          alert.
      - key: O10_2
        label: Đổ lỗi cho bộ phận Marketing trên group chung của công ty.
      - key: O10_3
        label: Xóa toàn bộ ticket Jira liên quan đến sự cố này.
  answer_key:
    option_effects:
      O1_1:
        points: 10
