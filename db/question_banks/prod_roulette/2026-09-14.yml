  difficulty: medium
- content:
    scenario: Thực hiện hotfix nâng cấp thư viện Payment SDK trên môi trường Production
      của hệ thống Ví điện tử vào khung giờ thấp điểm (02:00 AM).
    nodes:
    - key: M1
      prompt: 'Bước 1: Bạn chuẩn bị bước đầu tiên trước khi deploy hotfix code lên
        server Production.'
      options:
      - key: M1_O1
        label: Tạo DB Snapshot/Backup và kiểm tra quy trình Rollback trên Staging
          trước.
      - key: M1_O2
        label: Commit thẳng code vào nhánh main và trigger CI/CD deploy luôn.
      - key: M1_O3
        label: SSH trực tiếp vào server Prod và git pull code mới về.
    - key: M2
      prompt: 'Bước 2: Cần cập nhật thư viện composer/npm liên quan đến SDK thanh
        toán mới.'
      options:
      - key: M2_O1
        label: Chạy npm ci / composer install theo đúng lockfile đã test.
      - key: M2_O2
        label: Chạy npm update / composer update để lên luôn version mới nhất của
          tất cả thư viện.
      - key: M2_O3
        label: Sửa thủ công file trong folder node_modules/vendor trực tiếp trên Prod.
    - key: M3
      prompt: 'Bước 3: Cấu hình Secret Key mới cho cổng thanh toán đối tác.'
      options:
      - key: M3_O1
        label: Cập nhật qua Vault/Environment Manager và reload systemd process.
      - key: M3_O2
        label: Hardcode Secret Key mới vào thẳng file config trong source code.
      - key: M3_O3
        label: In (echo/log) Secret Key ra file log public để debug kiểm tra kết nối.
    - key: M4
      prompt: 'Bước 4: Thực hiện chạy Database Migration thêm cột chứa Token thanh
        toán mới.'
      options:
      - key: M4_O1
        label: Chạy script migration hỗ trợ NULL/Default value để tránh lock bảng.
      - key: M4_O2
        label: Drop bảng giao dịch cũ và re-create lại bảng mới.
      - key: M4_O3
        label: Chạy ALTER TABLE ADD COLUMN NOT NULL mà không có default value trong
          lúc traffic đang chạy.
    - key: M5
      prompt: 'Bước 5: Thực hiện test giao dịch nạp tiền thật 10,000 VNĐ để verify
        cổng thanh toán.'
      options:
      - key: M5_O1
        label: Sử dụng tài khoản Sandbox/Test Merchant Credentials của đối tác.
      - key: M5_O2
        label: Dùng thẻ ngân hàng cá nhân chuyển thật 10k qua Live Merchant ID.
      - key: M5_O3
        label: Bỏ qua bước verify, coi như code chạy đúng vì CI/CD pass.
    - key: M6
      prompt: 'Bước 6: SDK mới trả về lỗi Signature Mismatch đối với 100% giao dịch
        thật của người dùng.'
      options:
      - key: M6_O1
        label: Gạt công tắc Feature Toggle về SDK phiên bản cũ ngay lập tức.
      - key: M6_O2
        label: Sửa code bỏ qua bước Verify Signature để giao dịch đi qua được.
      - key: M6_O3
        label: Đợi 30 phút xem hệ thống đối tác có tự hết lỗi không.
    - key: M7
      prompt: 'Bước 7: Có 15 giao dịch bị treo ở trạng thái PENDING do lỗi nghẽn Webhook.'
      options:
      - key: M7_O1
        label: Chạy job Query Transaction Status từ API ngân hàng để reconcile dữ
          liệu.
      - key: M7_O2
        label: Bấm nút Force Approve tất cả 15 giao dịch thành SUCCESS trên Admin
          UI mà không đối soát.
      - key: M7_O3
        label: Chạy script UPDATE status = 'FAILED' để người dùng tự nạp lại.
    - key: M8
      prompt: 'Bước 8: Khách hàng khiếu nại bị trừ tiền tài khoản ngân hàng nhưng
        ví không tăng dư.'
      options:
      - key: M8_O1
        label: Ghi nhận mã Bank Transaction ID và chuyển bộ phận Đối soát kiểm tra.
      - key: M8_O2
        label: Tự ý gọi API Bank Payout hoàn tiền trực tiếp từ tài khoản công ty về
          lại tài khoản khách.
      - key: M8_O3
        label: Bỏ qua yêu cầu hỗ trợ, chờ đối soát tuần tới.
    - key: M9
      prompt: 'Bước 9: Dọn dẹp môi trường sau khi rollback về phiên bản stable cũ.'
      options:
      - key: M9_O1
        label: Clear Application Cache, khôi phục lại DB Schema tương thích.
      - key: M9_O2
        label: Xóa toàn bộ file Log sự cố trên server để tiết kiệm dung lượng ổ cứng.
      - key: M9_O3
        label: Để nguyên trạng thái DB dở dang và đi ngủ.
    - key: M10
      prompt: 'Bước 10: Báo cáo tình hình lên Ban Giám đốc sau ca hotfix đêm.'
      options:
      - key: M10_O1
        label: Gửi Incident Report đầy đủ timeline, nguyên nhân root-cause và action
          items.
      - key: M10_O2
        label: Báo cáo mọi thứ diễn ra bình thường, không có vấn đề gì xảy ra.
      - key: M10_O3
        label: Gửi email quy trách nhiệm cho Dev phụ trách viết SDK.
  answer_key:
    option_effects:
      M1_O1:
        points: 10
        irreversible: false
