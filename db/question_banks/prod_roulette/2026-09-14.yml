- content:
    scenario: Kiểm tra tính năng gửi Voucher khuyến mãi tự động trên môi trường Production
      do lỗi sai lệch cấu hình staging. Hệ thống e-commerce đang có 500,000 active
      users.
    nodes:
    - key: N1
      prompt: 'Bước 1: Bạn cần kiểm tra xem bảng cấu hình Voucher trên Prod đã có
        dữ liệu mẫu chưa. Bạn sẽ thực hiện câu lệnh SQL nào?'
      options:
      - key: N1_O1
        label: Chạy SELECT * FROM voucher_campaigns WHERE status = 'DRAFT' LIMIT 5
          trên Read-Replica DB.
      - key: N1_O2
        label: Chạy UPDATE voucher_campaigns SET status = 'TESTING' WHERE id = 1 trực
          tiếp trên Primary DB.
      - key: N1_O3
        label: Chạy DELETE FROM voucher_campaigns WHERE is_test = 1 trên Primary DB.
    - key: N2
      prompt: 'Bước 2: Cần chuẩn bị một tài khoản test để nhận voucher thử nghiệm.
        Bạn tạo user mới như thế nào?'
      options:
      - key: N2_O1
        label: Tạo user qua script Admin UI chính thức với email test_dev_99@internal.com.
      - key: N2_O2
        label: Lấy bừa email của khách hàng thật user_active_123@gmail.com để gắn
          tag IS_TESTER.
      - key: N2_O3
        label: Insert trực tiếp vào DB bảng users bỏ qua các ràng buộc Trigger Validate.
    - key: N3
      prompt: 'Bước 3: Cấu hình campaign voucher giá trị 500k. Bạn thiết lập quy mô
        nhận voucher ra sao?'
      options:
      - key: N3_O1
        label: Set target_user_ids = [999999] (ID của user test vừa tạo).
      - key: N3_O2
        label: Set target_group = 'ALL_USERS' để test độ trễ hệ thống nhưng để status
          = 'DRAFT'.
      - key: N3_O3
        label: Set target_group = 'ALL_USERS' và activate campaign ngay lập tức để
          kiểm tra worker.
    - key: N4
      prompt: 'Bước 4: Bạn cần trigger Cronjob gửi thông báo push thông qua Firebase
        API. Thao tác thế nào?'
      options:
      - key: N4_O1
        label: Dry-run script worker với cờ --mock-notification-service.
      - key: N4_O2
        label: Sửa file config tạm thời point API Endpoint Firebase sang Mock Server
          local.
      - key: N4_O3
        label: Chạy trực tiếp command php artisan voucher:process-queue với Firebase
          Production Live Credentials.
    - key: N5
      prompt: 'Bước 5: Phát hiện worker bị nghẽn do quá nhiều queue trong Redis. Xử
        lý ra sao?'
      options:
      - key: N5_O1
        label: Kiểm tra danh sách queue bằng redis-cli monitor và cancel job test
          bằng ID.
      - key: N5_O2
        label: Tăng tạm thời số lượng Queue Worker process từ 2 lên 10 để giải phóng
          queue.
      - key: N5_O3
        label: Chạy lệnh FLUSHALL trên Redis Cluster Prod.
    - key: N6
      prompt: 'Bước 6: Khách hàng phản hồi nhận được SMS thông báo cấp Voucher 500k.
        Bạn cần dừng việc phát tán SMS gấp.'
      options:
      - key: N6_O1
        label: Disable API Key bên dịch vụ SMS Gateway trên portal quản trị đối tác.
      - key: N6_O2
        label: Restart service Notification Worker trên hệ thống.
      - key: N6_O3
        label: Sửa code trong DB set balance SMS Gateway về 0.
    - key: N7
      prompt: 'Bước 7: Cần vô hiệu hóa các voucher 500k đã lỡ phát ra cho người dùng
        để tránh bị trục lợi.'
      options:
      - key: N7_O1
        label: Chạy SQL Transaction UPDATE user_vouchers SET is_active = false WHERE
          campaign_id = X.
      - key: N7_O2
        label: Xóa toàn bộ record trong bảng user_vouchers mà không có Backup.
      - key: N7_O3
        label: Tắt toàn bộ trang checkout của ứng dụng.
    - key: N8
      prompt: 'Bước 8: Kiểm tra log xem có bao nhiêu voucher đã bị người dùng nhanh
        tay áp dụng mua hàng.'
      options:
      - key: N8_O1
        label: Query ElasticSearch/Kibana log với filter campaign_id.
      - key: N8_O2
        label: Chạy tail -f /var/log/nginx/access.log trực tiếp trên từng server web.
      - key: N8_O3
        label: Chạy query nặng JOIN 5 bảng lớn trên Master DB vào giờ cao điểm.
    - key: N9
      prompt: 'Bước 9: Xử lý các đơn hàng đã được thanh toán thành công bằng voucher
        lỗi.'
      options:
      - key: N9_O1
        label: Chuyển trạng thái đơn hàng sang 'HOLD_FOR_VERIFICATION' và gửi email
          xin lỗi/đền bù voucher 20k.
      - key: N9_O2
        label: Tự động hủy đơn và refund tiền qua Cổng thanh toán API.
      - key: N9_O3
        label: Xóa thông tin đơn hàng trong DB để coi như đơn chưa từng tồn tại.
    - key: N10
      prompt: 'Bước 10: Tổng kết sự cố và hoàn tất phục hồi hệ thống.'
      options:
      - key: N10_O1
        label: Tạo document Post-Mortem, cập nhật CI/CD pipeline để block test trên
          Prod.
      - key: N10_O2
        label: Âm thầm sửa log và xóa trace lịch sử chạy script.
      - key: N10_O3
        label: Đổ lỗi cho phía bên tích hợp SMS Gateway.
