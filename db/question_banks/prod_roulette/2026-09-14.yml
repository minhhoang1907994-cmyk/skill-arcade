- content:
    scenario: 'Bối cảnh: Bạn là Fullstack Developer phụ trách tính năng thanh toán.
      Vào lúc 14:00 ngày Thứ Sáu, hệ thống thương mại điện tử bị lỗi gateway làm 500
      đơn hàng trạng thái PENDING. Bạn cần kiểm tra, sửa đổi dữ liệu và đồng bộ lại
      trên môi trường PRODUCTION.'
    nodes:
    - key: node_1
      prompt: 'Bước 1: Bạn nhận được phản ánh từ CSKH về việc khách bị trừ tiền nhưng
        đơn PENDING. Việc đầu tiên bạn làm trên Prod là gì?'
      options:
      - key: opt_1_a
        label: Mở DB Prod thực hiện SELECT * FROM orders WHERE status = 'PENDING'
          để kiểm tra.
      - key: opt_1_b
        label: Mở Kibana/CloudWatch xem log của payment-service trong 1 giờ qua.
      - key: opt_1_c
        label: Chạy thẳng câu lệnh UPDATE orders SET status = 'PAID' cho các đơn bị
          phản ánh.
    - key: node_2
      prompt: 'Bước 2: Log cho thấy cổng thanh toán trả webhook về nhưng bị timeout
        ở backend. Bạn cần kiểm tra kết nối mạng từ server Prod tới cổng thanh toán.'
      options:
      - key: opt_2_a
        label: Dùng curl từ app container kiểm tra endpoint healthcheck của cổng thanh
          toán.
      - key: opt_2_b
        label: Sửa file /etc/hosts trên Prod server để trỏ IP cổng thanh toán sang
          IP backup.
      - key: opt_2_c
        label: Restart toàn bộ cluster payment-service để reset kết nối mạng.
    - key: node_3
      prompt: 'Bước 3: Nguyên nhân do mảng connection pool đến DB bị tràn. Bạn cần
        sao lưu DB trước khi can thiệp.'
      options:
      - key: opt_3_a
        label: Tạo snapshot EBS/RDS thủ công ngay lập tức trước khi thực hiện thao
          tác.
      - key: opt_3_b
        label: Bỏ qua sao lưu vì đã có cronjob backup lúc 00:00 hàng ngày.
      - key: opt_3_c
        label: Dump duy nhất bảng orders ra file SQL local bằng mysqldump.
    - key: node_4
      prompt: 'Bước 4: Bạn cần cập nhật trạng thái đơn hàng và gửi email xác nhận
        cho 500 khách hàng bị ảnh hưởng.'
      options:
      - key: opt_4_a
        label: Viết script Python gọi API Gateway của bên thứ 3 (SendGrid API thật)
          gửi email xác nhận đơn hàng kèm voucher xin lỗi $10 cho 500 khách hàng.
      - key: opt_4_b
        label: Cập nhật status DB trước, sau đó đẩy message vào RabbitMQ queue email
          để worker xử lý từ từ.
      - key: opt_4_c
        label: Chạy vòng lặp cURL gửi trực tiếp tới SendGrid API không qua queue từ
          máy cá nhân.
    - key: node_5
      prompt: 'Bước 5: Script đang chạy thì báo lỗi Duplicate Entry ở bảng payment_transactions.'
      options:
      - key: opt_5_a
        label: Dừng script, log lại transaction_id bị lỗi và kiểm tra dữ liệu trùng
          lặp.
      - key: opt_5_b
        label: Thêm flag --force hoặc ON DUPLICATE KEY UPDATE để ghi đè dữ liệu cũ.
      - key: opt_5_c
        label: Xoá các record bị trùng trực tiếp bằng câu lệnh DELETE FROM payment_transactions.
    - key: node_6
      prompt: 'Bước 6: Cần điều chỉnh cấu hình connection pool trong file config của
        microservice trên Prod.'
      options:
      - key: opt_6_a
        label: Sửa file config trong Git repository, tạo PR và trigger CI/CD pipeline
          để deploy.
      - key: opt_6_b
        label: SSH vào server Prod, dùng vi sửa trực tiếp file application.yml rồi
          restart app.
      - key: opt_6_c
        label: Thay đổi biến môi trường trên Kubernetes ConfigMap và rollout restart
          deployment.
    - key: node_7
      prompt: 'Bước 7: Sau khi fix, bạn muốn verify xem đơn hàng mới tạo có thanh
        toán mượt mà không.'
      options:
      - key: opt_7_a
        label: Tạo đơn hàng test $1 trên Prod bằng thẻ tín dụng cá nhân rồi thực hiện
          Refund.
      - key: opt_7_b
        label: Sửa code tạm thời trên Prod để bypass qua bước verify OTP của ngân
          hàng.
      - key: opt_7_c
        label: Sử dụng account Sandbox/Staging và theo dõi metric Prometheus trên
          Prod.
    - key: node_8
      prompt: 'Bước 8: Phát hiện 20 đơn bị trừ tiền 2 lần do khách bấm thanh toán
        nhiều lần lúc lag.'
      options:
      - key: opt_8_a
        label: Tổng hợp danh sách transaction_id, gửi ticket sang bên Ngân hàng/Cổng
          thanh toán đề nghị tra soát Refund.
      - key: opt_8_b
        label: Gọi trực tiếp API Refund của Payment Gateway trên Prod bằng Postman
          với Master Key.
      - key: opt_8_c
        label: Trừ số tiền dư vào ví điểm thưởng (Loyalty Points) của khách hàng trên
          DB mà không báo khách.
    - key: node_9
      prompt: 'Bước 9: Tải CPU của DB Prod tăng lên 95% do index bị hỏng sau đợt ghi
        bù dữ liệu.'
      options:
      - key: opt_9_a
        label: Thực hiện REINDEX CONCURRENTLY / ALTER TABLE ... REBUILD INDEX trực
          tuyến.
      - key: opt_9_b
        label: Chạy DROP INDEX và CREATE INDEX lại ngay trên bảng orders (chứa 10
          triệu dòng).
      - key: opt_9_c
        label: Tăng kích thước Instance DB lên gấp đôi (Vertical Scaling) thông qua
          AWS Console.
    - key: node_10
      prompt: 'Bước 10: Sự cố hoàn tất xử lý. Bạn cần hoàn thiện các thủ tục post-incident.'
      options:
      - key: opt_10_a
        label: Viết báo cáo Post-Mortem, phân tích Root Cause và họp với team để ra
          giải pháp lâu dài.
      - key: opt_10_b
        label: Xoá toàn bộ log trong thư mục /var/log/ để giải phóng dung lượng ổ
          cứng Prod.
      - key: opt_10_c
        label: Đóng ticket sự cố và không cần làm gì thêm vì hệ thống đã hoạt động
          bình thường.
