  difficulty: hard
- content:
    scenario: Bạn là Business Analyst (BA) kiêm Release Admin chuẩn bị cấu hình chiến
      dịch Marketing tặng quà Tết trên môi trường PRODUCTION. Hệ thống đang có 500k
      người dùng hoạt động.
    nodes:
    - key: b_step_1
      prompt: 'Bước 1: Bạn nhận file Excel danh sách 10.000 user ưu tiên nhận quà
        từ Marketing. Bạn làm gì trước?'
      options:
      - key: b1_opt1
        label: Đối soát ID user trên DB Staging trước khi đem lên Production
      - key: b1_opt2
        label: Import thẳng file Excel vào cơ sở dữ liệu PRODUCTION
      - key: b1_opt3
        label: Viết script Python để validate định dạng số điện thoại/email trong
          file
    - key: b_step_2
      prompt: 'Bước 2: Cần cấu hình rule chương trình: ''Mỗi user chỉ được nhận 1
        lần''. Bạn kiểm tra ở đâu?'
      options:
      - key: b2_opt1
        label: Kiểm tra cấu hình Unique Constraint trong DB và Rule Engine
      - key: b2_opt2
        label: Bỏ qua vì Marketing bảo ứng dụng đã chặn ở UI rồi
      - key: b2_opt3
        label: Ghi chú vào file Yêu cầu nghiệp vụ (BRD) mà không test thực tế
    - key: b_step_3
      prompt: 'Bước 3: Chuẩn bị kích hoạt chiến dịch Email thông báo quà tặng.'
      options:
