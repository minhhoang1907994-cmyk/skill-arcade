  difficulty: medium
- content:
    scenario: Hệ thống Marketing Automation trên Production gặp lỗi lặp vô tận (infinite
      loop) ở worker gửi Voucher sinh nhật. Trong vòng 10 phút, hàng ngàn voucher
      giảm giá 500k kèm tin nhắn SMS Brandname đã gửi đi liên tục cho người dùng.
      Bạn phải can thiệp qua 10 bước xử lý.
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: Hệ thống phát cảnh báo RabbitMQ bị ngập queue notification_queue
        với hơn 500.000 message. Hành động đầu tiên của bạn là gì?'
      options:
      - key: q2_n1_o1
        label: Tạm dừng (Pause) Consumer Worker đang lắng nghe queue notification_queue
      - key: q2_n1_o2
        label: Purge (Xóa sạch) toàn bộ tin nhắn trong queue ngay lập tức
      - key: q2_n1_o3
        label: Tăng số lượng Pod của Worker lên gấp 5 lần để xử lý nhanh queue
    - key: q2_n2
      prompt: 'Bước 2: Cần chặn nguồn phát sinh message lỗi từ phía Producer.'
      options:
      - key: q2_n2_o1
        label: Disable Job Cron birthday_voucher_cronjob trên hệ thống quản lý lịch
          trình
      - key: q2_n2_o2
        label: Xoá bảng users trong CSDL để Cronjob không lấy được danh sách
      - key: q2_n2_o3
        label: Tắt kết nối mạng (Network Interface) của toàn bộ hạ tầng Production
    - key: q2_n3
      prompt: 'Bước 3: Cần đánh giá mức độ ảnh hưởng của voucher bị cấp phát nhầm.'
      options:
      - key: q2_n3_o1
        label: Query bảng vouchers lọc theo created_at trong 1 giờ qua xuất báo cáo
      - key: q2_n3_o2
        label: Gửi mail hỏi toàn bộ người dùng xem ai đã nhận được voucher
      - key: q2_n3_o3
        label: Đợi phản hồi từ phía bộ phận Chăm sóc khách hàng (CSKH)
    - key: q2_n4
      prompt: 'Bước 4: Các voucher 500k bị phát nhầm đang nằm trong tài khoản người
        dùng và có nguy cơ bị sử dụng mua hàng.'
      options:
      - key: q2_n4_o1
        label: Chạy SQL script vô hiệu hóa (is_active = false) các voucher sinh trùng
          lặp chưa sử dụng
      - key: q2_n4_o2
        label: Xóa hoàn toàn các bản ghi trong bảng vouchers bằng lệnh DELETE không
          WHERE
      - key: q2_n4_o3
        label: Tắt toàn bộ dịch vụ Checkout mua hàng trên ứng dụng
    - key: q2_n5
      prompt: 'Bước 5: Xử lý vấn đề chi phí và SMS Brandname đã gửi cho khách hàng.'
      options:
      - key: q2_n5_o1
        label: Gọi API nhà cung cấp SMS nhờ thu hồi/chặn các tin nhắn đang nằm trong
          hàng đợi SMSC
      - key: q2_n5_o2
        label: Bắn tự động 1 SMS Brandname đền bù cho 100.000 khách hàng ngay tức
          thì
      - key: q2_n5_o3
        label: Đổi API Key của SMS Provider sang Key giả định để ngắt kết nối
    - key: q2_n6
      prompt: 'Bước 6: Tìm nguyên nhân bug code trong service voucher-service.'
      options:
      - key: q2_n6_o1
        label: Review code logic phát hiện thiếu điều kiện dừng while(true) và missing
          idempotency key
      - key: q2_n6_o2
        label: Chạy test lại code lỗi trực tiếp trên Production để xem log
      - key: q2_n6_o3
        label: Quy kết lỗi cho phía hạ tầng Cloud và không kiểm tra lại source code
    - key: q2_n7
      prompt: 'Bước 7: Tiến hành fix bug code và chuẩn bị bản vá khẩn cấp.'
      options:
      - key: q2_n7_o1
        label: Thêm kiểm tra Idempotency bằng Redis Lock và Unit Test bổ sung cho
          case trùng lặp
      - key: q2_n7_o2
        label: Bỏ qua Unit Test để tạo bản build rút ngắn thời gian
      - key: q2_n7_o3
        label: Hardcode trả về kết quả thành công cho mọi request cấp voucher
    - key: q2_n8
      prompt: 'Bước 8: Xử lý các đợt đơn hàng ĐÃ DÙNG voucher nhầm để thanh toán thành
        công.'
      options:
      - key: q2_n8_o1
        label: Lập danh sách các đơn hàng này, chuyển cho CSKH liên hệ xử lý hỗ trợ
          riêng biệt
      - key: q2_n8_o2
        label: Hủy toàn bộ đơn hàng và tự động trừ tiền trong thẻ tín dụng của khách
      - key: q2_n8_o3
        label: Tạo các voucher thật mới có giá trị cao hơn gửi tặng lại cho toàn bộ
          khách hàng
    - key: q2_n9
      prompt: 'Bước 9: Khởi chạy lại hệ thống Marketing Automation sau khi fix.'
      options:
      - key: q2_n9_o1
        label: Deploy bản fix, bật Worker với Rate Limit thấp (10 msg/s) để theo dõi
      - key: q2_n9_o2
        label: Bật lại Cronjob cũ và thả 100% dung lượng queue không giới hạn
      - key: q2_n9_o3
        label: Xóa toàn bộ Dead Letter Queue mà không kiểm tra dữ liệu tin nhắn lỗi
    - key: q2_n10
      prompt: 'Bước 10: Tổng kết sự cố tài chính và kỹ thuật.'
      options:
      - key: q2_n10_o1
        label: Báo cáo con số thiệt hại thực tế, cập nhật monitoring alert ngưỡng
          message queue
      - key: q2_n10_o2
        label: Chỉnh sửa số liệu báo cáo tài chính để giấu thiệt hại chi phí SMS
      - key: q2_n10_o3
        label: Tắt hoàn toàn cảnh báo (Alerting) của hệ thống RabbitMQ để tránh bị
          spam mail
