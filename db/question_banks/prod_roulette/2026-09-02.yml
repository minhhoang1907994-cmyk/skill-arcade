  difficulty: hard
- content:
    scenario: Bạn là Dev/BA đang thực hiện kiểm tra tính năng Thanh toán & Chiến dịch
      Marketing trực tiếp trên môi trường PRODUCTION vào lúc 23:00 đêm trước ngày
      ra mắt sản phẩm.
    nodes:
    - key: N1
      prompt: 'Bước 1: Bạn cần xác minh kết nối đến Cổng thanh toán mới trên môi trường
        PROD. Bạn xử lý thế nào?'
      options:
      - key: N1_OPT1
        label: Dùng tài khoản Sandbox/Test key do đối tác cung cấp để test kết nối
          API.
      - key: N1_OPT2
        label: Tạo giao dịch thật 1,000 VND bằng thẻ tín dụng cá nhân trên cổng PROD.
      - key: N1_OPT3
        label: Gọi trực tiếp API Payout thật của cổng thanh toán để chuyển 50,000
          VND từ tài khoản công ty về ví cá nhân test.
    - key: N2
      prompt: 'Bước 2: Cần kiểm tra luồng áp dụng mã Voucher giảm giá mới trên PROD.'
      options:
      - key: N2_OPT1
        label: Tạo Voucher ẩn với mã riêng biệt và giới hạn chỉ tài khoản test (email
          whitelist) mới dùng được.
      - key: N2_OPT2
        label: Sửa mã Voucher công khai hiện tại từ giảm 10% thành giảm 90% trong
          2 phút để test rồi sửa lại.
      - key: N2_OPT3
        label: Kích hoạt chiến dịch tặng Voucher 500,000 VND tự động cho toàn bộ hệ
          thống khách hàng để kiểm tra logic phát quà.
    - key: N3
      prompt: 'Bước 3: Kiểm tra tính năng gửi Push Notification nhắc nhở giỏ hàng.'
      options:
      - key: N3_OPT1
        label: Gửi Push Notification thử nghiệm đến đúng Device Token của thiết bị
          test cá nhân.
      - key: N3_OPT2
        label: Tắt tạm thời Worker gửi thông báo trên PROD trước khi thử nghiệm script
          gửi thông báo.
      - key: N3_OPT3
        label: Bắn thông báo Broadcast với nội dung 'Test notification - dep loixxx'
          tới tất cả 500,000 người dùng active.
    - key: N4
      prompt: 'Bước 4: Hệ thống báo lỗi Redis Cache bị đầy bộ nhớ làm chậm response
        time.'
      options:
      - key: N4_OPT1
        label: Kiểm tra memory footprint, chuyển các key hết hạn bằng script TTL và
          thông báo cho Sysadmin.
      - key: N4_OPT2
        label: Chạy lệnh FLUSHALL trên Redis instance của PROD để dọn sạch bộ nhớ
          ngay lập tức.
      - key: N4_OPT3
        label: Khởi động lại (Restart) Cluster Redis trên PROD mà không báo trước
          cho bộ phận vận hành.
    - key: N5
      prompt: 'Bước 5: Truy vấn báo cáo đơn hàng chạy rất chậm do thiếu Index trên
        bảng `orders`.'
      options:
      - key: N5_OPT1
        label: Tạo Index mới bằng lệnh `CREATE INDEX CONCURRENTLY` trong khung giờ
          thấp điểm.
      - key: N5_OPT2
        label: Tạo Index trực tiếp bằng lệnh `CREATE INDEX` thông thường ngay lập
          tức.
      - key: N5_OPT3
        label: Chạy script `TRUNCATE TABLE order_logs` để giảm dung lượng đĩa trước
          khi index.
    - key: N6
      prompt: 'Bước 6: Có một đơn hàng test bị kẹt ở trạng thái `PENDING` cần chuyển
        sang `SUCCESS`.'
      options:
      - key: N6_OPT1
        label: Dùng Admin Tool hệ thống có sẵn Audit Log để cập nhật trạng thái đơn
          hàng.
      - key: N6_OPT2
        label: Viết câu lệnh SQL `UPDATE orders SET status = 'SUCCESS' WHERE id =
          'ORDER_123'` trong giao dịch `BEGIN TRANSACTION`.
      - key: N6_OPT3
        label: Chạy trực tiếp `UPDATE orders SET status = 'SUCCESS'` nhưng quên không
          thêm mệnh đề `WHERE`.
    - key: N7
      prompt: 'Bước 7: Khách hàng khiếu nại không nhận được Email xác nhận đơn hàng,
        bạn cần xử lý.'
      options:
      - key: N7_OPT1
        label: Kiểm tra log mailer, sau đó dùng tính năng 'Resend Confirmation Email'
          trong Admin Portal cho đúng Customer ID.
      - key: N7_OPT2
        label: Trigger trực tiếp hàm Lambda Mailer bằng AWS CLI với JSON payload của
          đơn hàng đó.
      - key: N7_OPT3
        label: Chạy lại batch job Mailer cho toàn bộ đơn hàng trong ngày khiến 10,000
          khách nhận lại email trùng lặp.
    - key: N8
      prompt: 'Bước 8: Cần test Webhook nhận kết quả đối soát tự động từ Ngân hàng.'
      options:
      - key: N8_OPT1
        label: Mock dữ liệu Webhook và gửi vào API Endpoint của môi trường Staging/Dev.
      - key: N8_OPT2
        label: Bắn Webhook giả lập với transaction_id giả vào Endpoint PROD để kiểm
          tra xử lý trùng lặp.
      - key: N8_OPT3
        label: Gọi API bên đối tác ngân hàng thật yêu cầu hủy và hoàn trả toàn bộ
          phiên đối soát tự động ngày hôm nay.
    - key: N9
      prompt: 'Bước 9: Cần thay đổi một biến cấu hình Environment `PAYMENT_TIMEOUT`
        trên Server PROD.'
      options:
      - key: N9_OPT1
        label: Tạo Pull Request cập nhật file cấu hình qua CI/CD Pipeline có Lead
          Dev phê duyệt.
      - key: N9_OPT2
        label: SSH vào server, backup file `.env` thành `.env.bak` trước khi dùng
          `vim` sửa giá trị.
      - key: N9_OPT3
        label: Chạy lệnh `echo PAYMENT_TIMEOUT=30 > .env` khiến toàn bộ nội dung file
          `.env` cũ bị đè mất.
    - key: N10
      prompt: 'Bước 10: Dọn dẹp dữ liệu và kết thúc buổi testing.'
      options:
      - key: N10_OPT1
        label: Chạy script dọn dẹp dữ liệu đã được kiểm thử, chỉ lọc các bản ghi có
          tag `is_test = true`.
      - key: N10_OPT2
        label: Xóa thủ công từng bản ghi thử nghiệm trực tiếp qua DBeaver/Database
          Client.
      - key: N10_OPT3
        label: Gửi SMS Brandname xin lỗi khách hàng toàn hệ thống vì hệ thống gián
          đoạn dịch vụ mà chưa có sự đồng ý của Giám đốc.
