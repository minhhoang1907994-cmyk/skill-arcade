  difficulty: medium
- content:
    scenario: Cập nhật cấu hình tích hợp Cổng thanh toán ngân hàng (Payment Gateway
      API) và thực hiện đối soát giao dịch cuối ngày cho hệ thống Ví điện tử.
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: Cấu hình địa chỉ Endpoint kết nối cổng thanh toán.'
      options:
      - key: q2_opt_1a
        label: Trỏ Endpoint về Môi trường Sandbox của Ngân hàng đối tác.
      - key: q2_opt_1b
        label: Dùng URL Production nhưng khai báo IP Server Staging vào Whitelist.
      - key: q2_opt_1c
        label: Cấu hình URL Production kèm theo Merchant ID thật của doanh nghiệp
          để kiểm thử.
    - key: q2_n2
      prompt: 'Bước 2: Chuẩn bị Chữ ký số và Khóa bí mật (HMAC Secret Key / Private
        Key) để ký request.'
      options:
      - key: q2_opt_2a
        label: Lấy Staging Secret Key lưu an toàn từ HashiCorp Vault.
      - key: q2_opt_2b
        label: Hardcode Secret Key Sandbox trực tiếp trong file cấu hình `.env` local.
      - key: q2_opt_2c
        label: Dùng Private Key Production thật để ký vào payload giao dịch test.
    - key: q2_opt_3
      prompt: 'Bước 3: Kiểm thử luồng Callback / Webhook thông báo kết quả thanh toán.'
      options:
      - key: q2_opt_3a
        label: Dùng Postman giả lập payload Webhook gửi tới Staging Webhook Receiver.
      - key: q2_opt_3b
        label: Bắn Webhook giả lập tới Production Webhook URL với cờ `is_test = true`.
      - key: q2_opt_3c
        label: Gửi request gọi API Hoàn tiền (Refund API) thật tới ngân hàng cho một
          giao dịch đã thành công.
    - key: q2_n4
      prompt: 'Bước 4: Xử lý khóa chống trùng lặp giao dịch (Idempotency Key).'
      options:
      - key: q2_opt_4a
        label: Tạo `idempotency_key` duy nhất theo chuẩn UUID v4 cho mỗi giao dịch
          thử nghiệm.
      - key: q2_opt_4b
        label: Dùng cố định một mã `idempotency_key` static để gửi lại nhiều lần.
      - key: q2_opt_4c
        label: Bỏ qua lớp kiểm tra Idempotency trên Receiver Service để xử lý cho
          nhanh.
    - key: q2_n5
      prompt: 'Bước 5: Tiến hành chạy Tiến trình đối soát dữ liệu (Reconciliation
        Job).'
      options:
      - key: q2_opt_5a
        label: Tải file đối soát CSV mẫu từ Staging SFTP Server về kiểm thử.
      - key: q2_opt_5b
        label: Đẩy file CSV test lên SFTP Production vào thư mục tạm `/tmp`.
      - key: q2_opt_5c
        label: Upload file đối soát giả lập vào thư mục chính `/inbound` trên SFTP
          thật của Ngân hàng.
    - key: q2_n6
      prompt: 'Bước 6: Xử lý các giao dịch phát sinh lệch tiền (Discrepancy) giữa
        Ngân hàng và Ví.'
      options:
      - key: q2_opt_6a
        label: Xuất file báo cáo lệch tiền (Mismatch List) ra Excel để bộ phận Kế
          toán đối soát thủ công.
      - key: q2_opt_6b
        label: Thực hiện script cân bằng số dư ảo trên môi trường Staging DB.
      - key: q2_opt_6c
        label: Chạy câu lệnh `UPDATE transactions SET status = 'SUCCESS'` trực tiếp
          trên Production DB cho các đơn chưa nhận tiền.
    - key: q2_n7
      prompt: 'Bước 7: Kiểm thử tính năng Tự động nạp tiền (Auto Top-up) từ tài khoản
        ngân hàng liên kết.'
      options:
      - key: q2_opt_7a
        label: Test luồng Auto Top-up trên tài khoản liên kết ảo (Sandbox Bank Account).
      - key: q2_opt_7b
        label: Mock kết quả trả về của API ngân hàng trên môi trường Staging.
      - key: q2_opt_7c
        label: Kích hoạt luồng Auto Top-up trên tài khoản thật của khách hàng với
          hạn mức 5.000.000 VND.
    - key: q2_n8
