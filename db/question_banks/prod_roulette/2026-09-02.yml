  difficulty: hard
- content:
    scenario: Kiểm thử tính năng gửi thông báo đẩy (Push Notification) khuyến mãi
      Flash Sale trên hệ thống E-Commerce thương mại điện tử vào giờ cao điểm.
    nodes:
    - key: q1_n1
      prompt: 'Bước 1: Bạn cần chuẩn bị môi trường và dữ liệu người dùng để thực hiện
        test.'
      options:
      - key: q1_opt_1a
        label: Chạy test trên môi trường Staging với danh sách user test đã chuẩn
          bị sẵn.
      - key: q1_opt_1b
        label: Dùng DB Production nhưng lọc danh sách theo điều kiện `is_tester =
          1`.
      - key: q1_opt_1c
        label: Bỏ qua bộ lọc `is_tester` trên DB Production để kiểm tra tốc độ xử
          lý dữ liệu thực tế.
    - key: q1_n2
      prompt: 'Bước 2: Xác nhận cấu hình dịch vụ gửi tin Firebase Cloud Messaging
        (FCM).'
      options:
      - key: q1_opt_2a
        label: Sử dụng FCM Sandbox Key và gửi tới topic `test_promo`.
      - key: q1_opt_2b
        label: Sử dụng FCM Production Key nhưng chỉ gửi vào topic nội bộ `internal_test`.
      - key: q1_opt_2c
        label: Sử dụng FCM Production Key và phát thông báo vào topic chung `all_users`.
    - key: q1_n3
      prompt: 'Bước 3: Chuẩn bị nội dung thông báo Push Notification và mã Voucher
        đính kèm.'
      options:
      - key: q1_opt_3a
        label: Dùng nội dung giả lập '[TEST] Notification' và mã voucher ảo `TEST_VOUCHER_10K`.
      - key: q1_opt_3b
        label: Dùng nội dung thật nhưng gắn mã voucher Production có cài đặt `max_usage
          = 1`.
      - key: q1_opt_3c
        label: Dùng mã voucher Production thật `FLASH90` giảm 90% không giới hạn lượt
          dùng để test flow.
    - key: q1_n4
      prompt: 'Bước 4: Thực hiện câu lệnh truy vấn lấy danh sách token thiết bị.'
      options:
      - key: q1_opt_4a
        label: Query bảng `user_device_tokens` có `LIMIT 10` kèm điều kiện `WHERE
          user_id IN (test_ids)`.
      - key: q1_opt_4b
        label: Query toàn bộ bảng `user_device_tokens` trên DB Staging không giới
          hạn `LIMIT`.
      - key: q1_opt_4c
        label: Query `SELECT token FROM user_device_tokens` trên DB Production không
          có index gây lock bảng.
    - key: q1_n5
      prompt: 'Bước 5: Thiết lập cơ chế kiểm soát tần suất gửi (Rate Limit) tới API
        FCM.'
      options:
      - key: q1_opt_5a
        label: Thêm delay 100ms giữa các batch 500 tokens để tránh làm ngợp hệ thống.
      - key: q1_opt_5b
        label: Gửi song song bằng 10 worker không giới hạn tốc độ đẩy.
      - key: q1_opt_5c
        label: Bật tính năng fallback tự động sang SMS Gateway trả phí thật nếu FCM
          gặp sự cố.
    - key: q1_n6
      prompt: 'Bước 6: Theo dõi và giám sát hệ thống (Monitoring) trong lúc script
        chạy.'
      options:
      - key: q1_opt_6a
        label: Theo dõi Kibana Dashboard và lọc log theo `trace_id` của request test.
      - key: q1_opt_6b
        label: Theo dõi log trực tiếp bằng `tail -f /var/log/app.log` trên server
          Production.
      - key: q1_opt_6c
        label: Bật cấu hình `DEBUG` log level cho toàn bộ cluster Production trong
          giờ cao điểm.
    - key: q1_n7
      prompt: 'Bước 7: Hệ thống bắt đầu trả về lỗi `HTTP 500 Internal Error` từ FCM
        Service. Bạn làm gì?'
      options:
      - key: q1_opt_7a
        label: Tạm dừng script, kiểm tra log lỗi chi tiết và hủy danh sách chờ trong
          queue.
      - key: q1_opt_7b
        label: Thực hiện retry liên tục ngay lập tức không dùng thuật toán Exponential
          Backoff.
      - key: q1_opt_7c
        label: Bỏ qua lỗi FCM và tự động kích hoạt gửi SMS Brandname thật hàng loạt
          tới người dùng.
    - key: q1_n8
      prompt: 'Bước 8: Xử lý dữ liệu sau khi chạy xong script kiểm thử.'
      options:
      - key: q1_opt_8a
        label: Chạy script dọn dẹp dữ liệu test đặt trong transaction có kiểm tra
          rollback.
      - key: q1_opt_8b
        label: Xoá record test bằng câu lệnh `DELETE FROM notifications WHERE created_at
          > NOW() - INTERVAL 1 HOUR`.
      - key: q1_opt_8c
        label: Thực hiện `DROP TABLE temp_notification_queue` trực tiếp trên Production.
    - key: q1_n9
      prompt: 'Bước 9: Kiểm tra và xác nhận hành vi của ứng dụng di động khi nhận
        thông báo.'
      options:
      - key: q1_opt_9a
        label: Kiểm tra sự kiện `notification_opened` trên công cụ Analytics cho tài
          khoản test.
      - key: q1_opt_9b
        label: Truy vấn bảng `notification_logs` trên DB để kiểm tra trạng thái `READ`.
      - key: q1_opt_9c
        label: Nhấn vào link Deep-link trên thiết bị thật gắn tài khoản ngân hàng
          thật để thanh toán thử.
    - key: q1_n10
      prompt: 'Bước 10: Hoàn tất công việc testing và dọn dẹp tài nguyên.'
      options:
      - key: q1_opt_10a
        label: Thu hồi API Key tạm thời, đóng ticket kiểm thử và lưu tài liệu kết
          quả.
      - key: q1_opt_10b
        label: Giữ nguyên cấu hình API Key test trong file `config.env` trên server
          Production.
      - key: q1_opt_10c
        label: Xoá các bản sao lưu khẩn cấp (Backup Snapshots) đã tạo trước khi bắt
          đầu test.
