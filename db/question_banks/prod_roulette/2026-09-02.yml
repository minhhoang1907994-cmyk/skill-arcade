  difficulty: hard
- content:
    scenario: Hệ thống sàn thương mại điện tử đang diễn ra sự kiện Flash Sale lớn
      nhất năm. Vào lúc 00:05, hệ thống cảnh báo DB CPU Spike 99%, hàng nghìn đơn
      hàng bị kẹt ở trạng thái 'PENDING_PAYMENT'. Khách hàng liên tục khiếu nại do
      bị trừ tiền nhưng chưa nhận được đơn hàng.
    nodes:
    - key: Q1_N1
      prompt: 'Cảnh báo Prometheus gửi về Slack: Database PostgreSQL master node đang
        bị nghẽn CPU 99%. Bạn làm gì đầu tiên?'
      options:
      - key: opt_q1_n1_a
        label: Mở Grafana và pg_stat_activity để kiểm tra danh sách slow queries.
      - key: opt_q1_n1_b
        label: Restart ngay lập tức Service Database PostgreSQL để giải phóng CPU.
      - key: opt_q1_n1_c
        label: Tăng gấp đôi RAM và CPU của Master DB Instance trên AWS RDS ngay lập
          tức.
    - key: Q1_N2
      prompt: Phát hiện câu truy vấn `SELECT * FROM orders WHERE status = 'PENDING'`
        đang chạy hàng nghìn lần/giây do Worker Service retry liên tục. Bạn làm gì?
      options:
      - key: opt_q1_n2_a
        label: Tạm dừng (Scale down về 0) Worker Service để ngăn việc spam query vào
          DB.
      - key: opt_q1_n2_b
        label: Chạy lệnh `DROP TABLE orders` để dựng lại bảng mới sạch sẽ.
      - key: opt_q1_n2_c
        label: Thêm trực tiếp Index `CREATE INDEX CONCURRENTLY idx_orders_status ON
          orders(status);` trên DB PROD.
    - key: Q1_N3
      prompt: Sau khi scale down Worker, DB CPU giảm về 40%. Nhưng có 15.000 đơn hàng
        đang bị dồn tích trong Redis Queue. Bạn xử lý queue này thế nào?
      options:
      - key: opt_q1_n3_a
        label: Xoá sạch key queue trong Redis bằng lệnh `FLUSHALL` để hệ thống chạy
          mượt lại.
      - key: opt_q1_n3_b
        label: Tăng thêm Consumer instances và điều chỉnh Rate Limiter xử lý từng
          batch 50 items/lần.
      - key: opt_q1_n3_c
        label: Bật lại Worker Service nguyên bản với số lượng Replica tối đa.
    - key: Q1_N4
      prompt: 'Kiểm tra log phát hiện Bug: Logic tính mã giảm giá Voucher bị lặp vô
        tận (Infinite Loop) khi áp dụng mã ''FLASHSALE50''. Cần sửa gấp. Bạn thực
        hiện hotfix ra sao?'
      options:
      - key: opt_q1_n4_a
        label: Sửa code trực tiếp trên Production Server qua SSH bằng vim rồi restart
          app.
      - key: opt_q1_n4_b
        label: Tạo Hotfix Branch, sửa code, chạy Unit Test, nhờ Lead Review và deploy
          qua CI/CD pipeline chuẩn.
      - key: opt_q1_n4_c
        label: Tắt tạm thời tính năng Voucher qua Feature Flag trong Consul/Config
          Server.
    - key: Q1_N5
      prompt: Feature Flag Voucher đã tắt. Bạn cần xử lý 500 đơn hàng bị lỗi trừ tiền
        2 lần do race condition khi click thanh toán. Bạn làm gì?
      options:
      - key: opt_q1_n5_a
        label: Viết script SQL `UPDATE balances SET amount = amount + refund` chạy
          trực tiếp trên DB để hoàn tiền.
      - key: opt_q1_n5_b
        label: Trích xuất danh sách transaction_id bị lặp và gọi API Refund của Cổng
          thanh toán đối tác qua Tool Quản trị nội bộ có ghi Audit Log.
      - key: opt_q1_n5_c
        label: Bỏ qua các đơn này, chờ khách hàng tự gửi khiếu nại mới xử lý.
    - key: Q1_N6
      prompt: Bộ phận CSKH báo tin có 2.000 người dùng phản ánh đơn hàng mua thành
        công nhưng chưa nhận được SMS/Email xác nhận. Bạn làm gì?
      options:
      - key: opt_q1_n6_a
        label: Bật lại Notification Worker service và cho phép consume bù backlog
          tin nhắn.
      - key: opt_q1_n6_b
        label: Bỏ qua tin nhắn cũ, chỉ gửi SMS cho các đơn hàng phát sinh từ bây giờ.
      - key: opt_q1_n6_c
        label: Gửi thông báo Push Notification đền bù tới TOÀN BỘ 1 triệu người dùng
          trên App mobile.
    - key: Q1_N7
      prompt: Ban Giám Đốc yêu cầu xoa dịu khách hàng bị ảnh hưởng bởi sự cố Flash
        Sale bằng cách tặng voucher đền bù. Bạn thực hiện hành động nào?
      options:
      - key: opt_q1_n7_a
        label: Export danh sách 500 user bị ảnh hưởng, tạo Campaign voucher đền bù
          50k trên CMS và gửi Push Notification/Email thật tới đúng 500 user này.
      - key: opt_q1_n7_b
        label: Chạy script broadcast bắn SMS và Push Notification đến TOÀN BỘ Database
          User (500.000 người) đền bù Voucher 100k do nhầm lẫn query.
      - key: opt_q1_n7_c
        label: Tạo voucher trên DB nhưng không gửi thông báo, chờ user tự vào kiểm
          tra kho voucher.
    - key: Q1_N8
      prompt: Sau khi hotfix code voucher xong, bạn chuẩn bị bật lại Feature Flag
        Voucher. Bước verification nào là an toàn nhất?
      options:
      - key: opt_q1_n8_a
        label: Bật Feature Flag 100% traffic ngay lập tức để người dùng tiếp tục săn
          sale.
      - key: opt_q1_n8_b
        label: Bật Feature Flag theo dạng Canary (5% -> 20% -> 100%) kết hợp theo
          dõi error rate trên APM (Datadog/NewRelic).
      - key: opt_q1_n8_c
        label: Test trực tiếp bằng tài khoản cá nhân trên PROD rồi bật 100% ngay.
    - key: Q1_N9
      prompt: Phát hiện số lượng tồn kho (Inventory) trên Redis Cache bị lệch so với
        PostgreSQL Database do sự cố ngắt kết nối trước đó. Bạn làm gì?
      options:
      - key: opt_q1_n9_a
        label: Xoá cache Redis tồn kho và chạy Job Sync đồng bộ lại số liệu chuẩn
          từ DB PostgreSQL sang Redis.
      - key: opt_q1_n9_b
        label: Lấy dữ liệu trên Redis làm chuẩn và ghi đè ngược lại vào PostgreSQL
          Database.
      - key: opt_q1_n9_c
        label: Cập nhật thủ công từng mặt hàng hot sale bằng lệnh SET trên Redis CLI.
    - key: Q1_N10
      prompt: Hệ thống đã ổn định trở lại. Bước cuối cùng chuẩn chỉnh trong quy trình
        quản lý sự cố là gì?
      options:
      - key: opt_q1_n10_a
        label: Đóng Ticket sự cố và giải tán nhóm Response Team ngay để đi ngủ.
      - key: opt_q1_n10_b
        label: Tổ chức cuộc họp Post-mortem (Blameless), viết báo cáo sự cố, xác định
          Root Cause và lên Action Items cải tiến.
      - key: opt_q1_n10_c
        label: Tìm ra developer viết đoạn code lỗi voucher để hạ bậc đánh giá KPI.
  answer_key:
    option_effects:
      opt_q1_n1_a:
        points: 10
        irreversible: false
        consequence_text: Quyết định chuẩn xác! Kiểm tra métrics giúp bạn nhanh chóng
          phát hiện ra nguyên nhân gốc rễ là slow query mà không làm gián đoạn dịch
          vụ.
        next_node: Q1_N2
      opt_q1_n1_b:
        points: 3
        irreversible: false
        consequence_text: Restart DB khiến toàn bộ giao dịch đang thanh toán dở dang
          bị crash, gây rớt đơn hàng hàng loạt trong 3 phút.
        next_node: Q1_N2
      opt_q1_n1_c:
        points: 3
        irreversible: false
        consequence_text: Việc Scale Up RDS mất từ 10-15 phút chờ failover, trong
          thời gian đó toàn bộ trang web bị gián đoạn hoàn toàn (Downtime).
        next_node: Q1_N2
      opt_q1_n2_a:
        points: 10
        irreversible: false
        consequence_text: Xử lý rất tốt. Tạm dừng Worker giúp DB giải phóng CPU lập
          tức về mức an toàn mà không làm mất dữ liệu.
        next_node: Q1_N3
      opt_q1_n2_b:
        points: 3
        irreversible: false
        consequence_text: Rủi ro cực lớn! Xoá bảng làm mất toàn bộ dữ liệu đơn hàng.
          Rất may hệ thống có Point-in-time Recovery nên đã khôi phục lại được nhưng
          tốn 2 giờ đồng hồ.
        next_node: Q1_N3
      opt_q1_n2_c:
        points: 3
        irreversible: false
        consequence_text: Tạo Index trong lúc DB đang bị overload khiến I/O tăng cao,
          gây treo nhẹ DB thêm 5 phút trước khi index hoàn tất.
        next_node: Q1_N3
      opt_q1_n3_a:
        points: 3
        irreversible: false
        consequence_text: Lệnh FLUSHALL đã xoá sạch 15.000 đơn hàng chưa xử lý trong
          Queue. Khách hàng đã trả tiền nhưng không thể tạo được đơn hàng, gây khiếu
          nại nghiêm trọng.
        next_node: Q1_N4
      opt_q1_n3_b:
        points: 10
        irreversible: false
        consequence_text: Tuyệt vời. Thao tác điều tiết nhịp độ (Throttling/Rate Limit)
          giúp tiêu thụ hết dồn tích queue mà không gây chấn động lên DB.
        next_node: Q1_N4
      opt_q1_n3_c:
        points: 3
        irreversible: false
        consequence_text: Bật lại Worker tối đa làm DB CPU lập tức vọt lên 100% trở
          lại, hệ thống lại tái diễn tình trạng treo.
        next_node: Q1_N4
      opt_q1_n4_a:
        points: 3
        irreversible: false
        consequence_text: Sửa code trực tiếp trên PROD vi phạm quy trình bảo mật và
          dễ dẫn đến sai sót syntax error làm sập Instance.
        next_node: Q1_N5
      opt_q1_n4_b:
        points: 10
        irreversible: false
        consequence_text: Tuân thủ đúng quy trình DevSecOps giúp bản Hotfix được kiểm
          thử an toàn trước khi lên Production.
        next_node: Q1_N5
      opt_q1_n4_c:
        points: 10
        irreversible: false
        consequence_text: Giải pháp ứng biến nhanh gọn! Tắt Feature Flag chặn đứng
          lỗi ngay lập tức để có thêm thời gian cho Dev sửa code chuẩn.
        next_node: Q1_N5
      opt_q1_n5_a:
        points: 3
        irreversible: false
        consequence_text: Chạy query SQL trực tiếp biến đổi số dư DB mà không qua
          Service Layer gây lệch số liệu đối soát với Cổng thanh toán.
        next_node: Q1_N6
      opt_q1_n5_b:
        points: 10
