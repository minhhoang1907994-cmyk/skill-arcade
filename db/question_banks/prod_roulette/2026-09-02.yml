  difficulty: hard
- content:
    scenario: Hệ thống thanh toán QR Code trên Production bị treo tỷ lệ 40% giao dịch
      trong sự kiện Flash Sale lúc 20:00. Database PostgreSQL hiển thị cảnh báo connection
      pool quá tải (max_connections reached). Báo cáo sự cố cần được xử lý khẩn cấp
      trong vòng 10 bước.
    nodes:
    - key: q1_n1
      prompt: 'Bước 1: Hệ thống cảnh báo lag dữ liệu nặng. Bạn cần kiểm tra nguyên
        nhân gốc rễ ban đầu.'
      options:
      - key: q1_n1_o1
        label: Truy vấn Dashboard Grafana và Kibana để xem log lỗi trong 15 phút gần
          nhất
      - key: q1_n1_o2
        label: SSH trực tiếp vào server PROD và chạy lệnh cat trên file app.log dung
          lượng 20GB
      - key: q1_n1_o3
        label: Khởi động lại ngay lập toàn bộ cluster dịch vụ thanh toán payment-service
    - key: q1_n2
      prompt: 'Bước 2: Log cho thấy connection pool CSDL bị chiếm giữ bởi các query
        pending. Bạn xử lý như thế nào?'
      options:
      - key: q1_n2_o1
        label: Tăng tham số max_connections của PostgreSQL trên master node lên gấp
          đôi ngay lập tức
      - key: q1_n2_o2
        label: Lọc danh sách long-running queries bằng pg_stat_activity và kill các
          query treo hơn 30 giây
      - key: q1_n2_o3
        label: Xóa toàn bộ index trên bảng orders để tăng tốc độ ghi ghi nhận thanh
          toán
    - key: q1_n3
      prompt: 'Bước 3: Phát hiện service bank-gateway bị nghẽn do phía Ngân hàng phản
        hồi chậm. Cần điều chỉnh logic gọi API.'
      options:
      - key: q1_n3_o1
        label: Bật Circuit Breaker và cấu hình HTTP request timeout giảm từ 30s xuống
          3s
      - key: q1_n3_o2
        label: Tăng HTTP request timeout lên 120s để kiên nhẫn chờ ngân hàng phản
          hồi
      - key: q1_n3_o3
        label: Bỏ qua bước xác nhận OTP từ ngân hàng để hoàn tất giao dịch cho khách
    - key: q1_n4
      prompt: 'Bước 4: Có hàng trăm giao dịch ở trạng thái PENDING. Cần xử lý trạng
        thái đơn hàng.'
      options:
      - key: q1_n4_o1
        label: Chạy SQL UPDATE thủ công hàng loạt chuyển tất cả đơn PENDING thành
          SUCCESS
      - key: q1_n4_o2
        label: Đẩy các đơn PENDING vào RabbitMQ dead-letter queue để worker reconciliation
          xử lý bất đồng bộ
      - key: q1_n4_o3
        label: Xoá sạch các bản ghi trong bảng pending_transactions để giải phóng
          bộ nhớ
    - key: q1_n5
      prompt: 'Bước 5: Lượng truy cập từ khách hàng vẫn rất lớn. Cần đưa ra hướng
        xử lý truyền thông.'
      options:
      - key: q1_n5_o1
        label: Tạm thời ẩn phương thức thanh toán QR trên giao diện Checkout thông
          qua Feature Flag
      - key: q1_n5_o2
        label: Bắn Push Notification khẩn cấp toàn hệ thống tới 1 triệu user thông
          báo app bị lỗi nặng
      - key: q1_n5_o3
        label: Không thao tác gì, tiếp tục để người dùng bấm thử lại liên tục
    - key: q1_n6
      prompt: 'Bước 6: Đối tác Ngân hàng yêu cầu xác minh danh sách các giao dịch
        bị lỗi timeout.'
      options:
      - key: q1_n6_o1
        label: Xuất file CSV chứa transaction_id và amount thông qua read-replica
          database
      - key: q1_n6_o2
        label: Chạy query SELECT COUNT(*), SUM(amount) trực tiếp trên Primary Database
          không dùng Index
      - key: q1_n6_o3
        label: Gọi trực tiếp API webhook đối soát của Ngân hàng với toàn bộ giao dịch
          trong ngày
    - key: q1_n7
      prompt: 'Bước 7: Team Dev chuẩn bị bản hotfix backend để vá lỗi leak connection.'
      options:
      - key: q1_n7_o1
        label: Build image Docker mới, chạy test kịch bản checkout trên môi trường
          Staging trước
      - key: q1_n7_o2
        label: Sửa trực tiếp file source code .py/.js trên server Production qua vim
      - key: q1_n7_o3
        label: Commit code thẳng lên nhánh main và trigger auto-deploy pipeline lên
          PROD
    - key: q1_n8
      prompt: 'Bước 8: Triển khai bản vá (hotfix) lên hạ tầng Production.'
      options:
