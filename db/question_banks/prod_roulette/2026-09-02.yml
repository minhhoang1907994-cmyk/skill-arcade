  difficulty: hard
- content:
    scenario: Ứng dụng Ví điện tử/Banking gặp sự cố ngắt kết nối với Cổng chi hộ Ngân
      hàng (Disbursement Gateway). 1.000 giao dịch chuyển tiền trực tiếp đang dồn
      ở trạng thái 'PROCESSING'. Khách hàng liên tục gọi Hotline báo bị trừ tiền trong
      ví nhưng người nhận chưa nhận được tiền.
    nodes:
    - key: Q2_N1
      prompt: Hệ thống giám sát báo lỗi HTTP 504 Gateway Timeout từ API của Ngân hàng
        đối tác. Bạn xử lý bước đầu thế nào?
      options:
      - key: opt_q2_n1_a
        label: Liên hệ ngay channel hỗ trợ kỹ thuật khẩn cấp của Ngân hàng đối tác
          để xác nhận tình trạng kết nối.
      - key: opt_q2_n1_b
        label: Lập tức đổi trạng thái toàn bộ 1.000 giao dịch sang 'FAILED' và cộng
          lại tiền cho ví người gửi.
      - key: opt_q2_n1_c
        label: Khởi động lại toàn bộ Server Backend Fintech trên Production.
    - key: Q2_N2
      prompt: Đối tác xác nhận kênh kết nối chính bị sự cố cable quang và chưa rõ
        thời gian khắc phục. Hệ thống có kênh dự phòng (Gateway B). Bạn làm gì?
      options:
      - key: opt_q2_n2_a
        label: Sửa file config trực tiếp trên DB để chuyển toàn bộ luồng giao dịch
          mới sang Gateway B.
      - key: opt_q2_n2_b
        label: Chuyển mạch Smart Routing sang Gateway B qua trang quản trị Admin Portal
          có Audit Log.
      - key: opt_q2_n2_c
        label: Tắt toàn bộ tính năng Chuyển tiền trên ứng dụng.
    - key: Q2_N3
      prompt: Đối với 1.000 giao dịch đang bị treo ở trạng thái 'PROCESSING' tại Gateway
        A cũ, bạn quyết định xử lý ra sao?
      options:
      - key: opt_q2_n3_a
        label: Gửi file đối soát giao dịch (Reconciliation File) nhờ Ngân hàng kiểm
          tra trạng thái thực tế từng transaction trước khi xử lý.
      - key: opt_q2_n3_b
        label: Trực tiếp gọi API Bank_Payout_Disburse() của Gateway B để hoàn bù tiền
          ngay lập tức cho danh sách 1.000 giao dịch này mà không chờ đối soát.
      - key: opt_q2_n3_c
        label: Giữ nguyên trạng thái PENDING và treo giao dịch đến ngày hôm sau.
    - key: Q2_N4
      prompt: 'Ngân hàng phản hồi file đối soát: Trong 1.000 giao dịch kẹt, có 300
        giao dịch ĐÃ THÀNH CÔNG tại ngân hàng, 700 giao dịch THẤT BẠI. Bạn cập nhật
        DB như thế nào?'
      options:
      - key: opt_q2_n4_a
        label: Sử dụng Tool Batch Update chính thức của hệ thống để update 300 đơn
          'SUCCESS' và 700 đơn 'FAILED' (kèm trigger hoàn tiền ví).
      - key: opt_q2_n4_b
        label: Chạy query SQL bằng tay bằng lệnh `UPDATE transactions SET status =
          'FAILED'` cho toàn bộ 1.000 đơn.
      - key: opt_q2_n4_c
        label: Mở GUI DBeaver/Navicat gõ từng ô giá trị status để sửa.
    - key: Q2_N5
      prompt: Sau khi cập nhật DB, Cronjob Retry lại vô tình quét trùng 700 giao dịch
        vừa bị FAILED và cố gắng gửi lại sang Gateway B. Bạn chặn việc này bằng cách
        nào?
      options:
      - key: opt_q2_n5_a
        label: Tắt tạm Cronjob Retry Service và kiểm tra điều kiện Idempotency Key
          của API.
      - key: opt_q2_n5_b
        label: Xoá các record trong bảng `cron_jobs` trên Database.
      - key: opt_q2_n5_c
        label: Kill process ID (PID) của MySQL Database.
    - key: Q2_N6
      prompt: Bạn phát hiện Idempotency Key của Service cũ chưa gắn unique constraint
        trên Redis. Cần bổ sung ngay. Bạn làm gì?
      options:
      - key: opt_q2_n6_a
        label: Deploy bản patch bổ sung Idempotency Check qua Redis Lock với TTL phù
          hợp qua CI/CD.
      - key: opt_q2_n6_b
        label: Thêm code kiểm tra trùng bằng cách `SELECT COUNT(*)` trực tiếp vào
          DB trước mỗi transaction.
      - key: opt_q2_n6_c
        label: Bỏ qua vì khả năng trùng lặp rất thấp.
    - key: Q2_N7
      prompt: Hệ thống cần gửi thông tin cập nhật trạng thái đơn hàng cho 700 khách
        hàng bị thất bại. Thao tác nào đúng quy trình?
      options:
      - key: opt_q2_n7_a
        label: Sử dụng Service Notification đẩy In-App Message kèm lý do và số tiền
          đã được hoàn lại vào ví.
      - key: opt_q2_n7_b
        label: Gửi SMS Brandname trả phí hàng loạt đến tất cả người dùng trong hệ
          thống để thông báo sự cố ngân hàng.
      - key: opt_q2_n7_c
        label: Không gửi thông báo gì, để user tự kiểm tra lịch sử biến động số dư.
    - key: Q2_N8
      prompt: Gateway A đối tác báo đã sửa xong sự cố kết nối và hoạt động ổn định
        trở lại. Bạn đưa Gateway A quay lại hệ thống như thế nào?
      options:
      - key: opt_q2_n8_a
        label: Bật lại Smart Routing với tỷ lệ 10% traffic thử nghiệm sang Gateway
          A, theo dõi error rate trong 15 phút trước khi cân bằng 50/50.
      - key: opt_q2_n8_b
        label: Chuyển ngay 100% traffic từ Gateway B về Gateway A.
      - key: opt_q2_n8_c
        label: Đóng vĩnh viễn kết nối Gateway A không bao giờ dùng lại.
    - key: Q2_N9
      prompt: Đến thời điểm chốt sổ đối soát tài chính cuối ngày (EOD), bảng cân đối
        kế toán bị lệch 50 triệu đồng. Bạn xử lý ra sao?
      options:
      - key: opt_q2_n9_a
        label: Trích xuất file log giao dịch, chạy script Reconciliation đối soát
          độc lập giữa DB, Log API và Statement của Ngân hàng để tìm ra transaction
          sai lệch.
      - key: opt_q2_n9_b
        label: Tự ý tạo một giao dịch ảo `ADJUSTMENT` 50 triệu để số liệu bằng 0 cho
          đẹp báo cáo.
      - key: opt_q2_n9_c
        label: Báo cáo kế toán ghi nhận khoản lỗ này vào chi phí vận hành mà không
          cần tra soát.
    - key: Q2_N10
      prompt: Sự cố chuyển tiền đã được giải quyết triệt để. Bạn cần hoàn thiện tài
        liệu gì cho hệ thống?
      options:
      - key: opt_q2_n10_a
        label: Cập nhật tài liệu Architecture, viết bài Post-mortem và bổ sung kịch
          bản Failover tự động vào Runbook vận hành.
      - key: opt_q2_n10_b
        label: Ghi chú sơ quấy vào file Notepad cá nhân.
      - key: opt_q2_n10_c
        label: Không cần làm gì thêm vì sự cố đã qua.
