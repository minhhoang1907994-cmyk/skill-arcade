- content:
    scenario: Bạn là Lead Dev chịu trách nhiệm nâng cấp hệ thống Loyalty & Tính điểm
      thưởng cho App Banking/Ví điện tử ngay trên môi trường PRODUCTION trong ngày
      thần tài.
    nodes:
    - key: M1
      prompt: 'Bước 1: Cần chạy script cập nhật schema Database thêm cột `loyalty_tier`
        vào bảng `users`.'
      options:
      - key: M1_OPT1
        label: Tạo migration script có điều kiện `DEFAULT 'MEMBER'` và chạy thử trên
          Staging trước.
      - key: M1_OPT2
        label: Chạy trực tiếp `ALTER TABLE users ADD COLUMN loyalty_tier VARCHAR(20)`
          vào giờ cao điểm.
      - key: M1_OPT3
        label: Chạy script `ALTER TABLE users DROP COLUMN old_rank` trước khi kiểm
          tra ứng dụng cũ còn dùng cột này không.
    - key: M2
      prompt: 'Bước 2: Cần đồng bộ điểm thưởng cũ từ hệ thống legacy sang microservice
        Loyalty mới.'
      options:
      - key: M2_OPT1
        label: Dùng Message Queue (Kafka/RabbitMQ) để đẩy job đồng bộ theo từng batch
          500 records.
      - key: M2_OPT2
        label: Viết script Python chạy vòng lặp `FOR` gọi API cập nhật điểm trực tiếp.
      - key: M2_OPT3
        label: Chạy một lệnh SQL `INSERT INTO new_loyalty SELECT * FROM legacy_loyalty`
          làm đơ DB trong 10 phút.
    - key: M3
      prompt: 'Bước 3: Phát hiện lỗi logic nhân đôi điểm thưởng khi người dùng thực
        hiện giao dịch.'
      options:
      - key: M3_OPT1
        label: Bật Feature Flag để tắt tính năng tích điểm tạm thời, giữ luồng thanh
          toán bình thường.
      - key: M3_OPT2
        label: Thực hiện Hotfix code và đẩy thẳng lên branch `main` để CI/CD tự deploy.
      - key: M3_OPT3
        label: Sửa file `.class` / `.js` trực tiếp trên server PROD container đang
          chạy.
    - key: M4
      prompt: 'Bước 4: Cần thu hồi điểm thưởng bị cộng dư cho 2,000 tài khoản trong
        sự cố trên.'
      options:
      - key: M4_OPT1
        label: Tạo giao dịch điều chỉnh điểm âm (`ADJUSTMENT`) có ghi rõ lý do trong
          hệ thống ledger.
      - key: M4_OPT2
        label: Chạy lệnh `UPDATE user_points SET points = points - 1000 WHERE id IN
          (...)`.
      - key: M4_OPT3
        label: Tự động trừ trực tiếp 50,000 VND trong tài khoản tiền thật của khách
          hàng để bù trừ điểm.
    - key: M5
      prompt: 'Bước 5: Kiểm tra tính năng đổi quà lấy vé xem phim/Voucher ăn uống.'
      options:
      - key: M5_OPT1
        label: Dùng tài khoản test kiểm tra luồng đổi quà với partner kho quà thử
          nghiệm (Mock API).
      - key: M5_OPT2
        label: Thực hiện đổi 1 voucher thật trên PROD bằng điểm của tài khoản cá nhân.
      - key: M5_OPT3
        label: Gọi API kích hoạt nhận 50 vé xem phim thật từ đối tác CGV/Lotte để
          test nghẽn kho quà.
    - key: M6
      prompt: 'Bước 6: Dung lượng ổ đĩa của DB Server chạm ngưỡng 95% do Log file
        tăng nhanh.'
      options:
      - key: M6_OPT1
        label: Thực hiện log rotation và nén các file log cũ lưu trữ sang S3 Cold
          Storage.
      - key: M6_OPT2
        label: Xóa thủ công các file log `.log` trong thư mục `/var/log`.
      - key: M6_OPT3
        label: Chạy lệnh `rm -rf /var/lib/mysql/*` để dọn sạch dữ liệu phình to.
    - key: M7
      prompt: 'Bước 7: Kiểm tra tính năng nâng hạng VIP cho khách hàng có giao dịch
        trên 100 triệu.'
      options:
      - key: M7_OPT1
        label: Tạo bản ghi giao dịch giả lập trong môi trường Staging để kiểm tra
          trigger nâng hạng.
      - key: M7_OPT2
        label: Gán thủ công hạng VIP cho 1 tài khoản test trên PROD để kiểm tra UI
          hiển thị.
      - key: M7_OPT3
        label: Gọi dịch vụ tổng đài gửi tin nhắn SMS Brandname chúc mừng nâng hạng
          VIP tới 5,000 khách hàng nhầm lẫn.
    - key: M8
      prompt: 'Bước 8: Cần cập nhật chứng chỉ SSL/TLS cho domain API PROD sắp hết
        hạn.'
      options:
      - key: M8_OPT1
        label: Cập nhật Certificate trên Nginx/Load Balancer qua script tự động và
          test bằng `nginx -t` trước khi reload.
      - key: M8_OPT2
        label: Thay trực tiếp file cert `.crt` và reboot lại server Load Balancer.
      - key: M8_OPT3
        label: Xóa nhầm file Private Key `.key` cũ trước khi upload cert mới khiến
          Nginx không thể khởi động.
    - key: M9
      prompt: 'Bước 9: Khách hàng báo lỗi không thể đăng nhập vào App sau khi nâng
        cấp.'
      options:
      - key: M9_OPT1
        label: Kiểm tra log trên ELK/Datadog, phát hiện lỗi Token hết hạn và điều
          hướng Rollback phiên bản App Gateway.
      - key: M9_OPT2
        label: Clear toàn bộ Session trong Redis để ép tất cả người dùng đăng nhập
          lại từ đầu.
      - key: M9_OPT3
        label: Gọi API xóa bộ nhớ Auth Service khiến toàn bộ Refresh Token của người
          dùng bị hủy vĩnh viễn.
    - key: M10
      prompt: 'Bước 10: Tổng kết đợt triển khai tính năng thành viên.'
      options:
      - key: M10_OPT1
        label: Tạo báo cáo theo dõi Metrics (CPU, RAM, TPS, Error Rate) trong 2 giờ
          sau release.
      - key: M10_OPT2
        label: Tắt toàn bộ hệ thống Log trên PROD để tiết kiệm tài nguyên server.
      - key: M10_OPT3
        label: Tự ý gửi thông báo cho đối tác bên thứ ba xác nhận hoàn tất tích hợp
          khi chưa nghiệm thu.
