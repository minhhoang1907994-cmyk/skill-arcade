  difficulty: hard
- content:
    scenario: Thực hiện kiểm thử trực tiếp luồng Thanh toán VNPAY và Hoàn tiền (Refund)
      tự động trên môi trường PRODUCTION của hệ thống Sàn Thương mại Điện tử trong
      khung giờ cao điểm.
    nodes:
    - key: q1_node1
      prompt: 'Bước 1: Bạn chuẩn bị cấu hình môi trường tích hợp cổng thanh toán VNPAY.'
      options:
      - key: q1_opt_1_1
        label: Kiểm tra file config.env để đảm bảo VNPAY_ENV=sandbox và các tham số
          endpoint trỏ tới môi trường thử nghiệm.
      - key: q1_opt_1_2
        label: Bỏ qua bước kiểm tra config, giả định hệ thống tự route dựa trên IP
          của Developer.
      - key: q1_opt_1_3
        label: Đổi ngay tham số VNPAY_ENV=live và gọi trực tiếp API thanh toán thật
          bằng thẻ cá nhân trên Prod để kiểm thử cho chính xác.
    - key: q1_node2
      prompt: 'Bước 2: Chọn tài khoản người dùng để thực hiện giao dịch thử nghiệm.'
      options:
      - key: q1_opt_2_1
        label: Tạo một tài khoản test riêng biệt với cờ is_tester=true trên Database
          Production.
      - key: q1_opt_2_2
        label: Sử dụng tài khoản cá nhân Admin hệ thống để thao tác mua hàng.
      - key: q1_opt_2_3
        label: Lấy ngẫu nhiên UID của một khách hàng thật đang online để thực hiện
          giao dịch test.
    - key: q1_node3
      prompt: 'Bước 3: Khởi tạo đơn hàng test và chọn số tiền thanh toán.'
      options:
      - key: q1_opt_3_1
        label: Tạo đơn hàng với số tiền tối thiểu 1,000 VND để hạn chế rủi ro tài
          chính.
      - key: q1_opt_3_2
        label: Tạo đơn hàng trị giá 500,000 VND để khớp với giá trị đơn hàng trung
          bình thực tế.
      - key: q1_opt_3_3
        label: Tạo đơn hàng trị giá 50,000,000 VND và gọi API tạo thanh toán thật
          sang đối tác cổng thanh toán.
    - key: q1_node4
      prompt: 'Bước 4: Xác thực giao dịch tại cổng thanh toán VNPAY.'
      options:
      - key: q1_opt_4_1
        label: Nhập OTP thử nghiệm nhận từ SIM chuyên dụng của bộ phận QA.
      - key: q1_opt_4_2
        label: Nhập OTP gửi về điện thoại cá nhân và lưu log tin nhắn để đối soát.
      - key: q1_opt_4_3
        label: Kích hoạt API bypass OTP trực tiếp trên Prod server để bỏ qua bước
          xác thực.
    - key: q1_node5
      prompt: 'Bước 5: Webhook từ VNPAY trả về báo lỗi sai HMAC signature.'
      options:
      - key: q1_opt_5_1
        label: Trích xuất log giao dịch, kiểm tra VNPAY_HASH_SECRET trên server Production.
      - key: q1_opt_5_2
        label: Bỏ qua đoạn kiểm tra HMAC signature trong mã nguồn để forced pass luồng
          callback.
      - key: q1_opt_5_3
        label: Tắt hoàn toàn Middleware xác thực Chữ ký điện tử trên Production API.
    - key: q1_node6
      prompt: 'Bước 6: Giao dịch bị treo ở trạng thái PENDING trên hệ thống.'
      options:
      - key: q1_opt_6_1
        label: Kích hoạt Cronjob gọi API QueryDR sang VNPAY để truy vấn trạng thái
          thực tế của giao dịch.
      - key: q1_opt_6_2
        label: 'Chạy câu lệnh SQL: UPDATE orders SET status=''SUCCESS'' trực tiếp
          trong SQL Client.'
      - key: q1_opt_6_3
        label: Gọi trực tiếp API Refund cổng thanh toán thật khi chưa xác minh được
          giao dịch đã trừ tiền hay chưa.
    - key: q1_node7
      prompt: 'Bước 7: Tiến hành kiểm thử tính năng Hoàn tiền (Refund) tự động.'
      options:
      - key: q1_opt_7_1
        label: Thực hiện Refund trên giao dịch test 1,000 VND đã khởi tạo thành công.
      - key: q1_opt_7_2
        label: Bắn trực tiếp Event OrderRefunded vào RabbitMQ Queue để giả lập hoàn
          tiền.
      - key: q1_opt_7_3
        label: Gọi API Hoàn tiền tự động đến cổng ngân hàng liên kết thật của một
          khách hàng thực sự.
    - key: q1_node8
      prompt: 'Bước 8: Xử lý thông báo Email xác nhận Hoàn tiền sau khi Refund thành
        công.'
      options:
      - key: q1_opt_8_1
        label: Redirect tạm thời Service Mail sang SMTP Sandbox hoặc địa chỉ email
          nội bộ dev.
      - key: q1_opt_8_2
        label: Chỉnh sửa Email Template để thêm tiền tố [TEST] trước khi phát mail.
      - key: q1_opt_8_3
        label: Kích hoạt tiến trình gửi Email xác nhận hoàn tiền thật tới toàn bộ
          danh sách khách hàng đang có đơn PENDING.
    - key: q1_node9
      prompt: 'Bước 9: Khôi phục và đồng bộ lại số lượng tồn kho sản phẩm sau khi
        đơn hàng bị hoàn tiền.'
      options:
      - key: q1_opt_9_1
        label: Gọi API InventoryService.revertStock() thông qua Admin Portal có phân
          quyền.
      - key: q1_opt_9_2
        label: Chạy script Python cập nhật cột stock trong Postgres và lưu bản backup
          trước khi chạy.
      - key: q1_opt_9_3
        label: Sửa trực tiếp giá trị tồn kho trên Redis Cache mà không đồng bộ lại
          vào Postgres DB.
    - key: q1_node10
      prompt: 'Bước 10: Tổng kết và dọn dẹp môi trường sau khi hoàn tất kiểm thử.'
      options:
      - key: q1_opt_10_1
        label: Soft-delete tài khoản test, thu hồi API key thử nghiệm và viết báo
          cáo nghiệm thu.
      - key: q1_opt_10_2
        label: Thực hiện HARD DELETE toàn bộ bản ghi đơn hàng test khỏi Database mà
          không lưu backup log.
      - key: q1_opt_10_3
        label: Bỏ qua dọn dẹp, giữ nguyên Token có quyền Admin trên Production.
  answer_key:
    option_effects:
      q1_opt_1_1:
        points: 10
        irreversible: false
        consequence_text: An toàn. Hệ thống xác nhận đang ở môi trường Sandbox, mọi
          giao dịch thử nghiệm sẽ không phát sinh dòng tiền thật.
        next_node: q1_node2
      q1_opt_1_2:
