  difficulty: medium
- content:
    scenario: Phát hành chiến dịch Push Notification kèm mã giảm giá Voucher 99% cho
      2 triệu người dùng ứng dụng Mobile Banking trên môi trường PRODUCTION.
    nodes:
    - key: q2_node1
      prompt: 'Bước 1: Chuẩn bị danh sách target nhận thông báo thử nghiệm chiến dịch.'
      options:
      - key: q2_opt_1_1
        label: Trích xuất danh sách whitelist gồm 100 User ID tester từ môi trường
          staging/test DB.
      - key: q2_opt_1_2
        label: Lọc danh sách từ DB Prod với điều kiện email kết thúc bằng domain @company.com.
      - key: q2_opt_1_3
        label: Thực hiện câu lệnh SELECT fcm_token FROM users để lấy toàn bộ 2 triệu
          token thiết bị của người dùng thật.
    - key: q2_node2
      prompt: 'Bước 2: Kiểm tra cấu hình Deep link và JSON Payload gửi qua Firebase
        Cloud Messaging (FCM).'
      options:
      - key: q2_opt_2_1
        label: Kiểm tra Deep link app://promotions/v99 trên ứng dụng test trước khi
          gửi.
      - key: q2_opt_2_2
        label: Sử dụng tính năng Dry-run của FCM API để validate cấu hình Payload.
      - key: q2_opt_2_3
        label: Cấu hình URL Landing Page trỏ trực tiếp về địa chỉ API Admin chưa bật
          xác thực Authen.
    - key: q2_node3
      prompt: 'Bước 3: Cấu hình mã Voucher khuyến mãi trên hệ thống Core Banking /
        Voucher Service.'
      options:
      - key: q2_opt_3_1
        label: Tạo Voucher giảm 99% nhưng giới hạn số lượng tối đa 100 mã và đánh
          dấu is_test=true.
      - key: q2_opt_3_2
        label: Tạo Voucher giảm 99% không giới hạn số lượng lượt dùng trên bảng vouchers
          Production.
      - key: q2_opt_3_3
        label: Phát hành 50,000 mã Voucher giảm 99% thật vào hệ thống Ví điện tử trên
          Prod để test tải.
    - key: q2_node4
      prompt: 'Bước 4: Thực hiện kích hoạt gửi Push Notification.'
      options:
      - key: q2_opt_4_1
        label: Gửi Push Notification thông qua FCM Topic riêng biệt test_internal_channel.
      - key: q2_opt_4_2
        label: Gửi thông báo thử nghiệm bằng lệnh cURL từ máy cá nhân sử dụng Server
          Key Production.
      - key: q2_opt_4_3
        label: 'Nhấn nút ''Gửi Tất Cả'' trên Dashboard Firebase Console với tiêu đề:
          ''Nhận Voucher 99% ngay!''.'
    - key: q2_node5
      prompt: 'Bước 5: Phát hiện gửi nhầm thông báo Voucher 99% cho toàn bộ 2 triệu
        người dùng thật. Khách hàng bắt đầu đổ xô vào App.'
      options:
      - key: q2_opt_5_1
        label: Lập tức bật cờ Deactivate mã Voucher trong Database để ngăn chặn người
          dùng sử dụng.
      - key: q2_opt_5_2
        label: Restart khẩn cấp NotificationService để ngắt các tiến trình đẩy tin
          đang nằm trong Queue.
      - key: q2_opt_5_3
        label: Giữ nguyên trạng thái để người dùng dùng thử Voucher nhằm tránh bị
          phàn nàn trên mạng xã hội.
    - key: q2_node6
      prompt: 'Bước 6: Lượng truy cập tăng đột biến (Spike Traffic) làm API Gateway
        quá tải và treo cơ sở dữ liệu.'
      options:
      - key: q2_opt_6_1
        label: Bật Cloudflare Under Attack Mode và kích hoạt Rate Limiting giới hạn
          request/s.
      - key: q2_opt_6_2
        label: Dùng lệnh kubectl scale tăng gấp 5 lần số lượng Pods backend microservice.
      - key: q2_opt_6_3
        label: Tắt bớt Redis Cache Cluster để ép ứng dụng truy vấn dữ liệu trực tiếp
          từ Database Core.
    - key: q2_node7
      prompt: 'Bước 7: Hàng đợi Queue đổi Voucher bị nghẽn (Message Backlog hơn 500,000
        tin nhắn).'
      options:
      - key: q2_opt_7_1
        label: Tăng thêm các Worker Consumer để tăng tốc độ xử lý giải phóng hố nghẽn
          Message Queue.
      - key: q2_opt_7_2
        label: Thực hiện lệnh PURGE xóa sạch toàn bộ Message đang chờ trong Queue
          voucher_redemption_queue.
      - key: q2_opt_7_3
        label: Gửi SMS xin lỗi kèm mã đền bù tự động tới toàn bộ người dùng bằng SMS
          Brandname đối tác thật.
    - key: q2_node8
      prompt: 'Bước 8: Quyết định tạm ngưng tính năng Khuyến mãi để khoanh vùng sự
        cố.'
      options:
      - key: q2_opt_8_1
        label: Gạt cờ Feature Flag PROMO_V99_ENABLED về false trên hệ thống LaunchDarkly
          / Config Server.
      - key: q2_opt_8_2
        label: Chỉnh sửa khẩn cấp code backend trả về lỗi HTTP status 500 cho API
          Voucher.
      - key: q2_opt_8_3
        label: Đổi IP Database trong file config sang IP không tồn tại để ép ứng dụng
          sập hẳn.
    - key: q2_node9
      prompt: 'Bước 9: Khôi phục trạng thái dữ liệu các Voucher đã bị người dùng nhận
        nhầm.'
      options:
      - key: q2_opt_9_1
        label: Khôi phục dữ liệu bảng user_vouchers về trạng thái trước sự cố bằng
          Point-in-Time Recovery (PITR).
      - key: q2_opt_9_2
        label: Chạy câu lệnh UPDATE user_vouchers SET status='EXPIRED' cho toàn bộ
          voucher phát ra trong ngày.
      - key: q2_opt_9_3
        label: Chạy lệnh DROP TABLE user_vouchers trên Production và tạo lại bảng
          mới.
    - key: q2_node10
      prompt: 'Bước 10: Xử lý hậu kỳ sự cố và bảo mật thông tin.'
      options:
      - key: q2_opt_10_1
        label: Tổ chức họp Post-mortem, xoay vòng (Rotate) FCM Server Key bị lộ và
          cập nhật tài liệu SOP.
      - key: q2_opt_10_2
        label: Xoá sạch các file log sự cố trên Server để tránh bị bộ phận Audit kiểm
          tra trách nhiệm.
      - key: q2_opt_10_3
        label: Bỏ qua việc đổi Firebase Server Key dù đã lỡ đẩy công khai lên GitHub
          Repository.
