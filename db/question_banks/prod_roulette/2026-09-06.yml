- content:
    scenario: Thực hiện nâng cấp cấu hình và kiểm thử hệ thống gửi tin nhắn biến động
      số dư SMS Brandname và Email Gateway thuộc hệ thống Core Banking trên môi trường
      Production.
    nodes:
    - key: Q2_N1
      prompt: 'Bước 1: Cấu hình địa chỉ Endpoint cho dịch vụ Email Gateway mới.'
      options:
      - key: Q2_O1_A
        label: Trỏ Endpoint về Sandbox Server giả lập của nhà cung cấp dịch vụ.
      - key: Q2_O1_B
        label: Trỏ Endpoint về Staging Proxy có mã hóa TLS.
      - key: Q2_O1_C
        label: Trỏ Endpoint trực tiếp tới SMTP Server Production của nhà mạng viễn
          thông.
    - key: Q2_N2
      prompt: 'Bước 2: Nạp API Secret Key của nhà cung cấp dịch vụ SMS Brandname.'
      options:
      - key: Q2_O2_A
        label: Sử dụng API Key thuộc môi trường UAT với hạn mức khóa ở 0 đồng.
      - key: Q2_O2_B
        label: Sử dụng API Key Production giới hạn quyền chỉ gửi đến danh sách whitelist.
      - key: Q2_O2_C
        label: Sử dụng Master API Key Production không giới hạn hạn mức và đối tượng
          gửi.
    - key: Q2_N3
      prompt: 'Bước 3: Thực hiện kiểm thử luồng gửi tin nhắn SMS OTP xác thực giao
        dịch.'
      options:
      - key: Q2_O3_A
        label: Cấu hình Mock SMS Provider trong mã nguồn để ghi log tin nhắn ra file
          system.
      - key: Q2_O3_B
        label: Thực hiện gửi SMS OTP thử nghiệm tới số điện thoại di động nội bộ của
          nhóm dự án.
      - key: Q2_O3_C
        label: Kích hoạt script chạy gửi SMS OTP thực tế tới danh sách 10,000 khách
          hàng có giao dịch gần nhất.
    - key: Q2_N4
      prompt: 'Bước 4: Cấu hình bộ lọc địa chỉ người nhận Email thông báo.'
      options:
      - key: Q2_O4_A
        label: Cấu hình Regex lọc bắt buộc email người nhận phải có đuôi @internal-bank.vn.
      - key: Q2_O4_B
        label: Sử dụng hộp thư Catch-all Inbox riêng để hứng tất cả email phát ra.
      - key: Q2_O4_C
        label: Chạy lệnh vô hiệu hóa Spam Filter và Domain Validation trên Email Gateway.
    - key: Q2_N5
      prompt: 'Bước 5: Thử nghiệm tính năng gửi Email báo cáo sao kê tài khoản hàng
        tháng.'
      options:
      - key: Q2_O5_A
        label: Sinh file PDF dữ liệu mẫu (Dummy Data) gửi về email kiểm thử nội bộ.
      - key: Q2_O5_B
        label: Xuất file sao kê của tài khoản test và lưu trữ vào ổ đĩa nội bộ Server.
      - key: Q2_O5_C
        label: Kích hoạt Batch Job gửi Email sao kê tài khoản tháng thật tới 50,000
          khách hàng thật qua Email Gateway.
    - key: Q2_N6
      prompt: 'Bước 6: Hàng đợi Message Queue (RabbitMQ) báo động đỏ với 100,000 tin
        nhắn bị tắc nghẽn.'
      options:
      - key: Q2_O6_A
        label: Tăng số lượng Worker Consumer trên Kubernetes Cluster để xử lý tin
          nhắn tồn đọng.
      - key: Q2_O6_B
        label: Tạm ngưng dịch vụ Publisher để ngăn chặn tin nhắn mới nạp vào queue.
      - key: Q2_O6_C
        label: Thực hiện lệnh Purge Queue trên RabbitMQ Management Console để xóa
          sạch 100,000 tin nhắn.
    - key: Q2_N7
      prompt: 'Bước 7: Đồng bộ cấu hình định tuyến tin nhắn giữa Data Center chính
        và Data Center dự phòng.'
      options:
      - key: Q2_O7_A
        label: Đồng bộ qua kênh truyền riêng VPN/DirectConnect có mã hóa TLS 1.3.
      - key: Q2_O7_B
        label: Export file configuration ra máy cá nhân rồi SCP sang Server Data Center
          dự phòng.
      - key: Q2_O7_C
        label: Đổi IP DNS của Data Center Primary sang Secondary trực tiếp không qua
          Graceful Degradation.
    - key: Q2_N8
      prompt: 'Bước 8: Cấu hình giới hạn tần suất gửi tin (Rate Limit) cho cổng dịch
        vụ SMS.'
      options:
      - key: Q2_O8_A
        label: Đặt Rate Limit mức 5 tin nhắn/phút cho mỗi số điện thoại.
      - key: Q2_O8_B
        label: Nâng Rate Limit lên 20 tin nhắn/phút để đáp ứng nhu cầu kiểm thử.
      - key: Q2_O8_C
        label: Xóa bỏ hoàn toàn quy tắc Rate Limit trên API Gateway.
    - key: Q2_N9
      prompt: 'Bước 9: Thu hồi các thông tin xác thực và tài khoản thử nghiệm sau
        ca làm việc.'
      options:
      - key: Q2_O9_A
        label: Revoke API Key thử nghiệm và Rotate Secret Key mới trên HashiCorp Vault.
      - key: Q2_O9_B
        label: Đổi mật khẩu tài khoản test trên giao diện Admin Portal.
      - key: Q2_O9_C
        label: Giữ nguyên API Key thử nghiệm trong file config môi trường PROD cho
          lần test sau.
    - key: Q2_N10
      prompt: 'Bước 10: Bàn giao hệ thống cho bộ phận Vận hành (Operations On-call).'
      options:
      - key: Q2_O10_A
        label: Cập nhật tài liệu Runbook và bàn giao kèm Dashboard theo dõi Grafana.
      - key: Q2_O10_B
        label: Nhắn tin qua kênh Slack nội bộ thông báo công việc đã hoàn tất.
      - key: Q2_O10_C
        label: Đăng xuất khỏi hệ thống mà không cập nhật trạng thái bàn giao.
