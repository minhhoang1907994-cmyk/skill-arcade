  difficulty: hard
- content:
    scenario: Hệ thống xử lý tiến trình gửi Email sao kê tài khoản ngân hàng định
      kỳ (Worker Queue) trên môi trường Production bị tắc nghẽn nghiêm trọng. Queue
      đọng hàng trăm ngàn job, Worker liên tục sập do cạn kiệt tài nguyên bộ nhớ.
    nodes:
    - key: q2_n1
      prompt: Queue email_jobs trên RabbitMQ bị tích đọng 500,000 message khiến bộ
        nhớ RAM của Broker đạt 90%. Bạn làm gì?
      options:
      - key: q2_n1_o1
        label: Mở rộng số lượng Worker Pods bằng lệnh kubectl scale deployment email-worker
          --replicas=20.
      - key: q2_n1_o2
        label: Chạy lệnh Purge Queue trên RabbitMQ Management UI để xoá sạch 500,000
          message.
      - key: q2_n1_o3
        label: Reboot lại Pod RabbitMQ Broker ngay lập tức.
    - key: q2_n2
      prompt: Worker báo lỗi OOMKilled do đọc toàn bộ file đính kèm PDF vào bộ nhớ
        RAM. Bạn tối ưu mã nguồn như thế nào?
      options:
      - key: q2_n2_o1
        label: Sử dụng Stream Reader để đọc từng phần file và chia nhỏ batch dữ liệu
          xử lý.
      - key: q2_n2_o2
        label: Tăng giới hạn resources.limits.memory của Pod lên 64GB mà không kiểm
          tra capacity của Worker Node.
      - key: q2_n2_o3
        label: Tắt hoàn toàn việc đính kèm file PDF trong email sao kê.
    - key: q2_n3
      prompt: Có 1,000 message bị đẩy sang Dead Letter Queue (DLQ). Bạn kiểm tra ra
        sao?
      options:
      - key: q2_n3_o1
        label: Trích xuất 5 sample message từ DLQ ra môi trường Staging để phân tích
          nguyên nhân lỗi.
      - key: q2_n3_o2
        label: Bật tính năng Re-queue đẩy toàn bộ 1,000 message từ DLQ quay lại main
          queue ngay lập tức.
      - key: q2_n3_o3
        label: Xoá bỏ Dead Letter Queue để giao diện quản lý bớt báo lỗi đỏ.
    - key: q2_n4
      prompt: Cần kiểm tra xem dịch vụ email bên thứ ba (SendGrid) có bị giới hạn
        Rate Limit hay không. Bạn thao tác như thế nào?
      options:
      - key: q2_n4_o1
        label: Gửi request kiểm tra API Status/Scopes bằng curl tới endpoint chính
          thức của SendGrid.
      - key: q2_n4_o2
        label: Chạy script gửi email test tới danh sách 10,000 email người dùng thật
          trong DB Production.
      - key: q2_n4_o3
        label: Đổi Sandbox API Key của SendGrid vào ứng dụng Production nhưng không
          bật chế độ Sandbox Mode.
    - key: q2_n5
      prompt: 'Báo động: Phát hiện API Key Production của dịch vụ SendGrid bị lộ trong
        file log công khai. Bạn xử lý khẩn cấp ra sao?'
      options:
      - key: q2_n5_o1
        label: Lập tức Revoke Key cũ trên SendGrid, khởi tạo Key mới và cập nhật vào
          Secret Manager.
      - key: q2_n5_o2
        label: Xoá file log chứa Key nhưng vẫn tiếp tục sử dụng API Key cũ.
      - key: q2_n5_o3
        label: Đổi tên biến môi trường SENDGRID_API_KEY thành MAIL_KEY trong mã nguồn.
    - key: q2_n6
      prompt: Hệ thống phát hiện một số khách hàng nhận trùng 2-3 email sao kê cùng
        lúc. Bạn xử lý chống lặp thế nào?
      options:
      - key: q2_n6_o1
        label: Tạo Distributed Lock với Redis dựa trên user_id và statement_period
          trước khi gửi email.
      - key: q2_n6_o2
        label: Tắt toàn bộ tiến trình Worker gửi email trong 24 giờ tới.
      - key: q2_n6_o3
        label: Gửi request thu hồi các email đã tới hộp thư Gmail của khách hàng.
    - key: q2_n7
      prompt: Cần cập nhật trạng thái IS_SENT = true vào Database Postgres cho các
        bản ghi đã gửi email thành công.
      options:
      - key: q2_n7_o1
        label: Cập nhật dữ liệu theo từng Batch 500 bản ghi trong một Transaction
          block.
      - key: q2_n7_o2
        label: Chạy câu lệnh UPDATE statement_logs SET is_sent = true không có điều
          kiện WHERE.
      - key: q2_n7_o3
        label: Bỏ qua bước cập nhật Database để ưu tiên tốc độ gửi mail.
    - key: q2_n8
      prompt: I/O Ops của Postgres DB tăng vọt do Worker ghi log lịch sử quá dày đặc.
        Bạn giải quyết ra sao?
      options:
      - key: q2_n8_o1
        label: Chuyển tiến trình ghi log lịch sử sang Kafka queue để xử lý bất đồng
          bộ (Async Write).
      - key: q2_n8_o2
        label: Xoá bỏ các chỉ mục Foreign Key trên bảng statement_logs.
      - key: q2_n8_o3
        label: Truncate hoàn bộ dữ liệu bảng statement_logs trên Production.
    - key: q2_n9
      prompt: Khách hàng gửi yêu cầu huỷ đăng ký nhận email tự động (Unsubscribe).
        Bạn xử lý ra sao trên hệ thống?
      options:
      - key: q2_n9_o1
        label: Cập nhật flag is_unsubscribed = true trong Database và bỏ qua user
          này trong đợt quét sau.
      - key: q2_n9_o2
        label: Gọi API Twilio PROD tự động gửi tin nhắn SMS xác nhận huỷ dịch vụ tới
          SĐT thật của khách hàng.
      - key: q2_n9_o3
        label: Khóa luôn tài khoản đăng nhập Internet Banking của khách hàng.
    - key: q2_n10
      prompt: Hoàn tất xử lý hàng tồn trong Queue. Bạn làm gì để ngăn ngừa sự cố lặp
        lại trong tương lai?
      options:
      - key: q2_n10_o1
        label: Cấu hình cảnh báo Prometheus khi Queue depth vượt quá 10,000 messages
          trong 5 phút.
      - key: q2_n10_o2
        label: Đặt lịch CronJob cho Worker chạy liên tục mỗi 1 giây.
      - key: q2_n10_o3
        label: Đóng toàn bộ ticket theo dõi sự cố mà không cần cập nhật tài liệu.
