- content:
    scenario: Thử nghiệm và phát hành tính năng Chiến dịch Khuyến mãi Chuyển đổi số
      trên môi trường Production vào ca trực đêm. Hệ thống e-commerce đang chịu tải
      15,000 CCU.
    nodes:
    - key: Q1_N1
      prompt: 'Bước 1: Chọn môi trường truy vấn cơ sở dữ liệu để kiểm tra danh mục
        sản phẩm trước khi chạy chiến dịch.'
      options:
      - key: Q1_O1_A
        label: Kết nối tới Read-only Database Replica (DB Slave) để thực hiện câu
          lệnh SELECT.
      - key: Q1_O1_B
        label: Kết nối DB Master nhưng bọc câu lệnh kiểm tra trong một Transaction
          riêng biệt.
      - key: Q1_O1_C
        label: Chạy script kiểm tra trực tiếp trên DB Master không bọc Transaction.
    - key: Q1_N2
      prompt: 'Bước 2: Bật cờ tính năng Feature Flag cho chiến dịch khuyến mại.'
      options:
      - key: Q1_O2_A
        label: Bật Feature Flag với tỉ lệ 1% người dùng thuộc nhóm Whitelist Tester.
      - key: Q1_O2_B
        label: Kích hoạt Feature Flag qua môi trường Staging Proxy.
      - key: Q1_O2_C
        label: Bật Feature Flag globally cho 100% người dùng trên hệ thống.
    - key: Q1_N3
      prompt: 'Bước 3: Tạo tài khoản thử nghiệm luồng mua hàng trên DB Production.'
      options:
      - key: Q1_O3_A
        label: Tạo user với email domain nội bộ công ty test@company.com.
      - key: Q1_O3_B
        label: Tạo user trực tiếp trong bảng users với tiền tố username là TEST_PROD.
      - key: Q1_O3_C
        label: Sử dụng tài khoản email riêng tư cá nhân để đăng ký trên giao diện
          PROD.
    - key: Q1_N4
      prompt: 'Bước 4: Kiểm tra tính năng phát mã giảm giá Voucher cho đơn hàng.'
      options:
      - key: Q1_O4_A
        label: Tạo voucher thử nghiệm giảm giá 0đ với số lượng 1 lượt sử dụng.
      - key: Q1_O4_B
        label: Tạo voucher giảm giá 99% giới hạn cho đúng User ID thử nghiệm.
      - key: Q1_O4_C
        label: Gọi API bên thứ ba tạo 1,000 voucher thật có giá trị 500,000đ trên
          hệ thống đối tác thanh toán.
    - key: Q1_N5
      prompt: 'Bước 5: Thử nghiệm tính năng thông báo ưu đãi qua Push Notification.'
      options:
      - key: Q1_O5_A
        label: Ghi log payload của Push Notification vào Elasticsearch/Kibana để kiểm
          tra nội dung.
      - key: Q1_O5_B
        label: Gửi Push Notification thử nghiệm đến đúng Device Token của thiết bị
          test nội bộ.
      - key: Q1_O5_C
        label: Bắn Push Notification qua dịch vụ FCM đến danh sách toàn bộ 200,000
          token thiết bị của người dùng thật.
    - key: Q1_N6
      prompt: 'Bước 6: Phát hiện API cổng thanh toán phản hồi chậm, thời gian phản
        hồi tăng từ 200ms lên 5000ms.'
      options:
      - key: Q1_O6_A
        label: Bật cơ chế Circuit Breaker để chuyển hướng thanh toán sang cổng dự
          phòng.
      - key: Q1_O6_B
        label: Thực hiện retry thủ công request nhiều lần từ màn hình Admin.
      - key: Q1_O6_C
        label: Tắt cấu hình xác thực SSL Certificate trong HTTP Client để tăng tốc
          độ kết nối.
    - key: Q1_N7
      prompt: 'Bước 7: Cập nhật lại giá niêm yết của sản phẩm mẫu dùng trong bài test.'
      options:
      - key: Q1_O7_A
        label: Chạy lệnh UPDATE products SET price = 100000 WHERE id = 88219;
      - key: Q1_O7_B
        label: Thực hiện cập nhật giá sản phẩm thông qua giao diện Admin Portal.
      - key: Q1_O7_C
        label: Chạy lệnh UPDATE products SET price = 0; do quên ghi vế WHERE.
    - key: Q1_N8
      prompt: 'Bước 8: Thực hiện thu hồi và làm sạch dữ liệu sau khi hoàn tất test.'
      options:
      - key: Q1_O8_A
        label: Chạy khôi phục dữ liệu từ điểm RDS Automated Snapshot vừa tạo trước
          khi test.
      - key: Q1_O8_B
        label: Thực hiện script SQL rollback dọn dẹp các dòng dữ liệu do bài test
          sinh ra.
      - key: Q1_O8_C
        label: Thực hiện lệnh TRUNCATE TABLE order_items để xóa nhanh dữ liệu không
          cần thiết.
    - key: Q1_N9
      prompt: 'Bước 9: Làm sạch bộ nhớ đệm Cache hệ thống sau khi chỉnh sửa cấu hình.'
      options:
      - key: Q1_O9_A
        label: Xóa cụ thể các Cache Key liên quan đến chiến dịch bằng lệnh DEL campaign_config_102.
      - key: Q1_O9_B
        label: Để cache tự động hết hạn theo thời gian TTL đã cấu hình.
      - key: Q1_O9_C
        label: Chạy lệnh FLUSHALL trên Redis Cluster Production để làm sạch toàn bộ
          cache.
    - key: Q1_N10
      prompt: 'Bước 10: Tổng kết và xác nhận trạng thái hoàn tất quy trình kiểm thử.'
      options:
      - key: Q1_O10_A
        label: Xuất file báo cáo kiểm thử kèm log audit và đính kèm vào Jira Ticket.
      - key: Q1_O10_B
        label: Gửi email thông báo hoàn tất kiểm thử cho Team Lead.
      - key: Q1_O10_C
        label: Đóng Ticket kiểm thử mà không ghi lại thông tin nhật ký thao tác.
