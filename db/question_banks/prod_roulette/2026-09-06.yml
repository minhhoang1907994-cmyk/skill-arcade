  difficulty: hard
- content:
    scenario: Sự cố gián đoạn cổng thanh toán Payment Gateway trong đợt Mega Sale
      11/11 trên môi trường Production. Hệ thống ghi nhận lượng giao dịch tăng đột
      biến, DB Master quá tải và xuất hiện hàng nghìn đơn hàng bị treo trạng thái
      PENDING.
    nodes:
    - key: q1_n1
      prompt: Báo động CPU DB Master đạt 98%, hệ thống treo thanh toán hàng loạt.
        Bạn sẽ thực hiện bước nào trước tiên?
      options:
      - key: q1_n1_o1
        label: Trích xuất slow log và kiểm tra danh sách active queries bằng SHOW
          FULL PROCESSLIST.
      - key: q1_n1_o2
        label: Chạy lệnh KILL toàn bộ process ID đang ở trạng thái Sleep.
      - key: q1_n1_o3
        label: Restart ngay lập tức DB Master container trên Production.
    - key: q1_n2
      prompt: Phát hiện truy vấn SELECT * FROM orders WHERE status = 'PENDING' không
        có index đang gây khoá bảng. Bạn xử lý thế nào?
      options:
      - key: q1_n2_o1
        label: Tạo Index idx_orders_status với cú pháp CREATE INDEX CONCURRENTLY trên
          Replica trước.
      - key: q1_n2_o2
        label: Chạy CREATE INDEX trực tiếp trên DB Master trong giờ cao điểm mà không
          dùng CONCURRENTLY.
      - key: q1_n2_o3
        label: Xoá bỏ toàn bộ dữ liệu đơn hàng trạng thái PENDING bằng DELETE FROM
          orders WHERE status = 'PENDING'.
    - key: q1_n3
      prompt: Có 500 đơn hàng bị treo ở trạng thái Processing với cổng thanh toán
        đối tác VNPay. Bạn xử lý các giao dịch này ra sao?
      options:
      - key: q1_n3_o1
        label: Viết script gọi API QueryDR của VNPay để đối soát trạng thái giao dịch
          thực tế của từng mã đơn.
      - key: q1_n3_o2
        label: Gọi API Refund của VNPay hoàn tiền tự động ngay lập tức cho toàn bộ
          500 giao dịch này.
      - key: q1_n3_o3
        label: Cập nhật cứng trạng thái toàn bộ 500 đơn sang FAILED trong database
          mà không kiểm tra đối tác.
    - key: q1_n4
      prompt: Cần thông báo cho khách hàng có đơn hàng bị ảnh hưởng về tiến độ xử
        lý sự cố. Bạn chọn phương án nào?
      options:
      - key: q1_n4_o1
        label: Tạo thông báo In-App Notification cho nhóm người dùng bị ảnh hưởng
          sau khi lọc đúng danh sách.
      - key: q1_n4_o2
        label: Bắn SMS Brandname hàng loạt báo lỗi tới toàn bộ 1,000,000 khách hàng
          trong hệ thống.
      - key: q1_n4_o3
        label: Kích hoạt trang bảo trì tạm thời 15 phút trên API Gateway cho toàn
          bộ ứng dụng.
    - key: q1_n5
      prompt: Phát hiện mã nguồn backend dịch vụ payment-service gặp bug gõ nhầm tên
        biến. Bạn vá lỗi như thế nào?
      options:
      - key: q1_n5_o1
        label: Tắt Feature Flag thanh toán lỗi, tạo PR, chạy CI/CD Pipeline kiểm thử
          trước khi merge main.
      - key: q1_n5_o2
        label: SSH trực tiếp vào server Production, sửa file trực tiếp bằng vim trên
          container đang chạy.
      - key: q1_n5_o3
        label: Copy đè file binary/code từ máy local cá nhân lên server Production
          thông qua scp.
    - key: q1_n6
      prompt: Bộ nhớ Redis Cache bị tràn RAM (Out of Memory - OOM) khiến hệ thống
        không ghi nhận được session. Bạn xử lý sao?
      options:
      - key: q1_n6_o1
        label: Cấu hình maxmemory-policy volatile-lru và giải phóng các key cache
          báo cáo không quan trọng.
      - key: q1_n6_o2
        label: Chạy lệnh FLUSHALL trên Redis Cluster Production để giải phóng toàn
          bộ bộ nhớ.
      - key: q1_n6_o3
        label: Tắt dịch vụ Redis service để ứng dụng truy vấn thẳng dữ liệu vào Database.
    - key: q1_n7
      prompt: Cần kiểm tra lại độ ổn định của hệ thống sau khi áp dụng hotfix backend.
        Bạn chọn cách làm nào?
      options:
      - key: q1_n7_o1
        label: Theo dõi Grafana Dashboard về latency, tỷ lệ lỗi 5xx và DB connection
          pool trong 15 phút.
      - key: q1_n7_o2
        label: Đổi Log Level của toàn bộ backend microservices từ INFO sang DEBUG
          trên Production.
      - key: q1_n7_o3
        label: Mở lại 100% lượng traffic ngay lập tức mà không cần theo dõi log.
    - key: q1_n8
      prompt: Khách hàng khiếu nại nhiều trên fanpage đòi đền bù Voucher cho đơn hàng
        bị gián đoạn. Bạn thực hiện thao tác gì?
      options:
      - key: q1_n8_o1
        label: Lập danh sách user bị ảnh hưởng và tạo Campaign Voucher dạng DRAFT
          chờ Management duyệt.
      - key: q1_n8_o2
        label: Chạy script phát trực tiếp Mã giảm giá 50% thật vào ví của 100,000
          user đang online.
      - key: q1_n8_o3
        label: Từ chối giải quyết đền bù và khoá tính năng chat của các tài khoản
          gửi ticket phản ánh.
    - key: q1_n9
      prompt: DATABASE Master vẫn chịu tải cao do truy vấn đọc. Bạn tối ưu hạ tầng
        như thế nào?
      options:
      - key: q1_n9_o1
        label: Định tuyến các truy vấn SELECT read-only sang Database Read Replicas
          thông qua PgBouncer.
      - key: q1_n9_o2
        label: Đổi cấu hình ứng dụng trỏ toàn bộ Write requests sang Read Replica.
      - key: q1_n9_o3
        label: Tăng gấp 10 lần tham số max_connections trên Postgres Master mà không
          tăng RAM server.
    - key: q1_n10
      prompt: Sự cố đã được khắc phục hoàn toàn. Bạn chốt lại quy trình bằng hành
        động nào?
      options:
      - key: q1_n10_o1
        label: Soạn tài liệu Root Cause Analysis (RCA), bổ sung Monitoring Alert và
          họp Post-mortem.
      - key: q1_n10_o2
        label: Xoá sạch toàn bộ log sự cố trên ElasticSearch để không bị đánh giá
          chỉ số KPI kém.
      - key: q1_n10_o3
        label: Đổ lỗi công khai cho bên thứ ba trên thông cáo báo chí chính thức.
