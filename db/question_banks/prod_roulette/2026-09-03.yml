    - key: node_2_7
      prompt: 'Bước 7: Đồng bộ trạng thái quà tặng sang hệ thống CRM của đối tác bên
        thứ ba via REST API. Bạn thực hiện ra sao?'
      options:
      - key: opt_2_7_a
        label: Gọi API đối tác kèm cơ chế Retry Exponential Backoff và Circuit Breaker
      - key: opt_2_7_b
        label: Gửi request đồng bộ hàng loạt không giới hạn concurrency làm sập API
