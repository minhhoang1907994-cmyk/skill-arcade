  difficulty: hard
- content:
    scenario: Hệ thống Ví điện tử thực hiện nâng cấp dịch vụ Giải ngân tự động (Core
      Disbursement) sang kiến trúc Microservices mới trên PRODUCTION trong cửa sổ
      bảo trì ban đêm.
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: Kiểm tra trạng thái kết nối với cổng Chuyển tiền liên ngân
        hàng (Napas API).'
      options:
      - key: q2_n1_o1
        label: Gửi request Healthcheck Ping định kỳ tới Napas Endpoint và kiểm tra
          SSL Certificate.
      - key: q2_n1_o2
        label: Tắt cấu hình xác thực TLS/SSL để tăng tốc độ phản hồi kết nối.
      - key: q2_n1_o3
        label: Thay đổi Endpoint từ cổng Chuyển tiền thật sang URL Wiremock giả lập.
    - key: q2_n2
      prompt: 'Bước 2: Cấu hình Kafka Consumer Group xử lý luồng yêu cầu giải ngân.'
      options:
      - key: q2_n2_o1
        label: Cấu hình auto.offset.reset=latest và đảm bảo Idempotency Key cho từng
          giao dịch.
      - key: q2_n2_o2
        label: Đặt auto.offset.reset=earliest mà không kiểm tra trùng lặp giao dịch
          đã xử lý.
      - key: q2_n2_o3
        label: Xóa toàn bộ Topic Kafka disbursement-requests để làm sạch dữ liệu chờ.
    - key: q2_n3
      prompt: 'Bước 3: Xử lý tình huống API ngân hàng đối tác trả về mã lỗi TIMEOUT.'
      options:
      - key: q2_n3_o1
        label: Chuyển giao dịch sang trạng thái PENDING và kích hoạt Worker đối soát
          trạng thái tự động.
      - key: q2_n3_o2
        label: Cấu hình tự động Retry gửi tiền lại ngay lập tức 5 lần liên tiếp.
      - key: q2_n3_o3
        label: Đánh dấu giao dịch là FAILED và tự động hoàn tiền vào ví người dùng
          ngay lập tức.
    - key: q2_n4
      prompt: 'Bước 4: Kiểm thử tính năng gửi Brandname SMS xác thực mã OTP cho giao
        dịch lớn.'
      options:
      - key: q2_n4_o1
        label: Cấu hình Mock SMS Provider cho các số điện thoại thử nghiệm đã khai
          báo.
      - key: q2_n4_o2
        label: Gọi trực tiếp Brandname SMS Gateway gửi tin nhắn OTP thử nghiệm đến
          10,000 số điện thoại khách hàng thật trên DB PROD.
      - key: q2_n4_o3
        label: Hardcode mã OTP cố định là '123456' trên môi trường PROD để test luồng
          UI.
    - key: q2_n5
      prompt: 'Bước 5: Cấu hình giới hạn hạn mức (Rate Limit) cho mỗi tài khoản khách
        hàng.'
      options:
      - key: q2_n5_o1
        label: Cấu hình Redis Token Bucket kiểm tra hạn mức 50,000,000 VND/ngày.
      - key: q2_n5_o2
        label: Tắt tính năng kiểm tra hạn mức giao dịch để đẩy nhanh tốc độ xử lý.
      - key: q2_n5_o3
        label: Đặt hạn mức cố định 1,000 VND cho toàn bộ người dùng để đảm bảo an
          toàn.
    - key: q2_n6
      prompt: 'Bước 6: Đồng bộ số dư tiền gửi từ Database Monolith sang Microservice
        Ledger mới.'
      options:
      - key: q2_n6_o1
        label: Chạy script Reconcile đối soát số dư song song và ghi nhận log sai
          lệch.
      - key: q2_n6_o2
        label: Ghi đè số dư từ bảng tạm vào bảng chính không qua kiểm tra khóa ghi
          (Locking).
      - key: q2_n6_o3
        label: Xóa bảng dữ liệu số dư cũ trên Monolith trước khi quá trình chuyển
          đổi hoàn tất.
    - key: q2_n7
      prompt: 'Bước 7: Kiểm thử tính năng Hoàn tiền tự động (Auto Cashback) cho giao
        dịch giải ngân thành công.'
      options:
      - key: q2_n7_o1
        label: Thực hiện trên tài khoản nội bộ sandbox được cấp phép và hoàn tiền
          theo hạn mức test.
      - key: q2_n7_o2
        label: Kích hoạt lệnh trigger hoàn tiền tự động 100,000 VND cho 500 giao dịch
          giải ngân PENDING trước đó trên PROD.
      - key: q2_n7_o3
        label: Chỉnh sửa tỷ lệ Cashback thành 100% trong DB để dễ kiểm tra biến động
          số dư.
    - key: q2_n8
      prompt: 'Bước 8: Xử lý nghẽn ghi Database (Write IOPS High) trên hệ thống sổ
        cái (Ledger DB).'
      options:
      - key: q2_n8_o1
        label: Tách luồng ghi log giao dịch sang ElasticSearch và phân rã Read/Write
          Replica.
      - key: q2_n8_o2
        label: Bỏ hẳn bước ghi Transaction Log vào DB, chỉ cập nhật số dư cuối.
      - key: q2_n8_o3
        label: Chạy script kill toàn bộ kết nối DB đang thực hiện lệnh INSERT.
    - key: q2_n9
      prompt: 'Bước 9: Chuyển đổi lượt truy cập (Cutover DNS / API Gateway Traffic).'
      options:
      - key: q2_n9_o1
        label: Chuyển trọng số Traffic 10% -> 50% -> 100% qua API Gateway Canary Routing.
      - key: q2_n9_o2
        label: Trỏ thẳng DNS miền core.pay.vn sang IP Server Microservice mới ngay
          lập tức.
      - key: q2_n9_o3
        label: Tắt Server Monolith cũ trước rồi mới bắt đầu bật Server Microservice
          mới.
    - key: q2_n10
      prompt: 'Bước 10: Tổng kết và đánh giá trạng thái hệ thống sau Cutover.'
      options:
      - key: q2_n10_o1
        label: Đối soát tổng số tiền chuyển đi với Napas, kiểm tra báo cáo cân đối
          kế toán.
      - key: q2_n10_o2
        label: Bỏ qua đối soát, đóng cửa sổ bảo trì và bàn giao hệ thống.
      - key: q2_n10_o3
        label: Xóa toàn bộ các bảng lưu vết giao dịch tạm thời trong đợt chuyển đổi.
