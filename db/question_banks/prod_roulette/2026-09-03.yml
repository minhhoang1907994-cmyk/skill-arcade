  difficulty: hard
- content:
    scenario: Hệ thống sàn thương mại điện tử chuẩn bị chạy chiến dịch Flash Sale
      11/11. Bạn là Tech Lead/BA trực chiến hotfix và kiểm thử một số cấu hình ưu
      đãi trực tiếp trên môi trường PRODUCTION khi lưu lượng truy cập bắt đầu tăng
      cao.
    nodes:
    - key: q1_n1
      prompt: 'Bước 1: Kiểm tra cấu hình Database Connection Pool trên PROD trước
        giờ G khi traffic tăng đột biến.'
      options:
      - key: q1_n1_o1
        label: Giữ nguyên max_connections=200 và bật dashboard Grafana theo dõi latency
          DB.
      - key: q1_n1_o2
        label: Tăng max_connections từ 200 lên 2000 trực tiếp trên DB master không
          qua cân đối tài nguyên RAM.
      - key: q1_n1_o3
        label: Khởi động lại (Restart) PostgreSQL Service ngay lập tức để làm sạch
          các connection dư thừa.
    - key: q1_n2
      prompt: 'Bước 2: Kích hoạt Feature Flag cho tính năng tính giá ưu đãi Flash
        Sale mới.'
      options:
      - key: q1_n2_o1
        label: Bật Feature Flag dạng Canary cho 1% lượng user thật và theo dõi tỉ
          lệ lỗi trên APM.
      - key: q1_n2_o2
        label: Bật Feature Flag 100% cho toàn bộ hệ thống ngay lập tức.
      - key: q1_n2_o3
        label: Bằng qua Feature Flag system, chạy SQL UPDATE config SET active=true
          trực tiếp vào DB.
    - key: q1_n3
      prompt: 'Bước 3: Kiểm thử hệ thống Push Notification nhắc lịch mua hàng.'
      options:
      - key: q1_n3_o1
        label: Gửi Push Notification thử nghiệm tới danh sách 5 FCM Token thiết bị
          nội bộ của nhóm QA.
      - key: q1_n3_o2
        label: Gửi thông báo test nội dung '[TEST] Khuyến mãi 11/11' tới toàn bộ 2
          triệu thiết bị người dùng thật trên PROD.
      - key: q1_n3_o3
        label: Tắt dịch vụ Notification Worker để đảm bảo không ai nhận được thông
          báo trong lúc test.
    - key: q1_n4
      prompt: 'Bước 4: Redis Cache quá tải do lượt truy cập danh mục sản phẩm tăng
        10 lần.'
      options:
      - key: q1_n4_o1
        label: Tăng dung lượng RAM Redis cluster và điều chỉnh policy maxmemory-policy
          sang volatile-lru.
      - key: q1_n4_o2
        label: Chạy lệnh FLUSHALL trên Redis PROD để giải phóng bộ nhớ ngay lập tức.
      - key: q1_n4_o3
        label: Bỏ qua lớp Cache Redis, cấu hình ứng dụng truy vấn trực tiếp vào Database
          chính.
    - key: q1_n5
      prompt: 'Bước 5: Xử lý tích hợp Cổng thanh toán (Payment Gateway API) bị gia
        tăng thời gian phản hồi.'
      options:
      - key: q1_n5_o1
        label: Bật cơ chế Circuit Breaker và hiển thị cảnh báo phương thức thanh toán
          đang bận.
      - key: q1_n5_o2
        label: Gọi trực tiếp API thanh toán thật bằng thẻ cá nhân 10,000 VND trên
          PROD để test luồng và tiến hành Refund thủ công.
      - key: q1_n5_o3
        label: Chuyển cấu hình Endpoint cổng thanh toán trên PROD về môi trường Sandbox
          của đối tác.
    - key: q1_n6
      prompt: 'Bước 6: Phát hiện hiện tượng Row Locking nghiêm trọng trên bảng orders
        khi người dùng chốt đơn đồng thời.'
      options:
      - key: q1_n6_o1
        label: Dùng lệnh pg_cancel_backend() ngắt các query đọc treo quá 30 giây và
          tối ưu truy vấn.
      - key: q1_n6_o2
        label: Chạy lệnh DROP INDEX idx_orders_status để giảm bớt thời gian ghi dữ
          liệu vào bảng orders.
      - key: q1_n6_o3
        label: Thực hiện pg_terminate_backend() ngắt toàn bộ kết nối DB của ứng dụng.
    - key: q1_n7
      prompt: 'Bước 7: Thử nghiệm phát hành Voucher giảm giá đặc biệt 500k cho khách
        hàng VIP.'
      options:
      - key: q1_n7_o1
        label: Tạo Voucher với trạng thái is_active=false, gán hạn chế theo User ID
          test và kiểm tra logic tính giá.
      - key: q1_n7_o2
        label: Tạo 50 mã Voucher thật 500k không giới hạn người dùng kèm cờ auto_apply=true
          ngay trên DB PROD để xem giao diện.
      - key: q1_n7_o3
        label: Copy toàn bộ dữ liệu bảng vouchers từ PROD về môi trường Staging để
          test.
    - key: q1_n8
      prompt: 'Bước 8: Đồng bộ dữ liệu tồn kho hàng hóa với hệ thống logistics của
        đơn vị vận chuyển.'
      options:
      - key: q1_n8_o1
        label: Sử dụng RabbitMQ Message Queue có Rate Limiter để đẩy sự kiện thay
          đổi tồn kho từng phần.
      - key: q1_n8_o2
        label: Gửi API request đồng bộ hàng loạt (Bulk Sync) 500,000 mã SKU sang đối
          tác vận chuyển cùng lúc.
      - key: q1_n8_o3
        label: Tắt hoàn toàn sync tồn kho để đảm bảo tốc độ phản hồi trang web.
    - key: q1_n9
      prompt: 'Bước 9: Triển khai bản Hotfix khẩn cấp sửa lỗi hiển thị giá sản phẩm.'
      options:
      - key: q1_n9_o1
        label: Build Docker Image mới qua CI/CD pipeline và thực hiện Blue-Green Deployment.
      - key: q1_n9_o2
        label: SSH trực tiếp vào server PROD đang chạy để sửa file JS minified trong
          thư mục build.
      - key: q1_n9_o3
        label: Restart toàn bộ container ứng dụng cùng lúc không qua kiểm tra health
          check.
    - key: q1_n10
      prompt: 'Bước 10: Xử lý dữ liệu audit log và khôi phục trạng thái chuẩn bị kết
        thúc sự kiện.'
      options:
      - key: q1_n10_o1
        label: Đẩy log ra S3 Bucket lưu trữ, tạo DB snapshot và gửi báo cáo tổng kết
          hệ thống.
      - key: q1_n10_o2
        label: Thực hiện TRUNCATE TABLE audit_logs trên DB PROD để giảm dung lượng
          đĩa cứng.
      - key: q1_n10_o3
        label: Tắt hệ thống theo dõi Prometheus và Grafana để tiết kiệm tài nguyên
          Server.
  answer_key:
