        consequence_text: Nghiêm trọng! 2 triệu người dùng thật đã nhận thông báo
          rác '[TEST] Khuyến mãi 11/11'. Khách hàng hoang mang và gửi phản ánh dồn
          dập lên bộ phận CSKH.
        next_node: q1_n4
      q1_n3_o3:
        points: 3
        irreversible: false
        consequence_text: Ách tắc thông báo. Hàng trăm nghìn thông báo giao dịch đơn
          hàng bị tích tụ trong Queue không được xử lý.
        next_node: q1_n4
      q1_n4_o1:
        points: 10
        irreversible: false
        consequence_text: An toàn. Redis tự động loại bỏ các key không quan trọng,
          giữ hệ thống hoạt động mượt mà.
        next_node: q1_n5
      q1_n4_o2:
        points: 3
        irreversible: false
        consequence_text: Sự cố Cache Avalanche. Mọi request đọc giá đều chọc thẳng
          xuống Database làm CPU DB tăng lên 100%.
        next_node: q1_n5
      q1_n4_o3:
        points: 3
        irreversible: false
        consequence_text: Quá tải Database. Hệ thống Database sập hoàn toàn do không
          chịu nổi throughput truy vấn giá.
        next_node: q1_n5
      q1_n5_o1:
