      options:
      - key: opt_2_6_a
        label: Scale out tự động số lượng Queue Worker từ 5 lên 20 pod trên Kubernetes
      - key: opt_2_6_b
        label: Xóa toàn bộ các Queue Message đang chờ xử lý bằng lệnh RabbitMQ purge
