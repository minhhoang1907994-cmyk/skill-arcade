- content:
    scenario: Sắp đến sinh nhật 5 năm của siêu ứng dụng E-Commerce. Bạn được giao
      nhiệm vụ chạy chiến dịch gửi Push Notification kèm tặng Voucher quà tặng cho
      100.000 khách hàng thân thiết trực tiếp trên Production.
    nodes:
    - key: node_2_1
      prompt: 'Bước 1: Lọc danh sách 100.000 khách hàng VIP để nhận quà. Bạn truy
        vấn Database Production như thế nào?'
      options:
      - key: opt_2_1_a
        label: Viết câu SQL query kèm WITH (NOLOCK) hoặc sử dụng Database Read-Replica
          để trích xuất dữ liệu
      - key: opt_2_1_b
        label: Chạy lệnh SELECT DISTINCT * JOIN 5 bảng lớn trên Primary Database mà
          không đánh Index
      - key: opt_2_1_c
        label: Chạy trực tiếp lệnh UPDATE users SET total_points = total_points +
          1000 cho toàn bộ bảng user để lọc
    - key: node_2_2
      prompt: 'Bước 2: Phát hành 100.000 Voucher sinh nhật vào ví người dùng. Bạn
        thực hiện bằng phương án nào?'
      options:
      - key: opt_2_2_a
        label: Chạy Background Job theo lô (Batch 500 records/lần) có kiểm soát Throttle
          trên Production
      - key: opt_2_2_b
        label: Tạo một vòng lặp FOR trong code API gọi INSERT từng Voucher trực tiếp
          trên DB Prod
      - key: opt_2_2_c
        label: Phát hành nhầm Voucher giảm 100% không giới hạn hạn mức (No Min Spend)
          cho toàn bộ 100.000 ví user thật
    - key: node_2_3
      prompt: 'Bước 3: Tích hợp dịch vụ gửi Push Notification thông qua Firebase Cloud
        Messaging (FCM). Bạn chuẩn bị ra sao?'
      options:
      - key: opt_2_3_a
        label: Gửi thử nghiệm 1 Push đến duy nhất Device Token test của tài khoản
          kiểm thử
      - key: opt_2_3_b
        label: Cấu hình FCM API Key môi trường Staging lên Server Production
      - key: opt_2_3_c
        label: Bấm nút 'Send Broadcast' trên giao diện Push Admin gửi đến tất cả người
          dùng iOS và Android thật
    - key: node_2_4
      prompt: 'Bước 4: Nội dung Push Notification có chứa link dẫn đến trang nhận
        quà. Bạn kiểm tra link như thế nào?'
      options:
      - key: opt_2_4_a
        label: Kiểm tra DeepLink app/gift-box trên ứng dụng thử nghiệm nội bộ
      - key: opt_2_4_b
        label: Sử dụng URL rút gọn chưa qua kiểm duyệt tính an toàn domain
      - key: opt_2_4_c
        label: Gửi Push kèm link thẳng đến server Localhost (http://127.0.0.1:8080/gift)
          tới hàng ngàn khách hàng
    - key: node_2_5
      prompt: 'Bước 5: Kênh Push bị lỗi với các user không bật nhận thông báo, hệ
        thống cần Fallback sang gửi SMS Brandname. Bạn chọn cách nào?'
      options:
      - key: opt_2_5_a
        label: Chỉ bật Fallback SMS cho danh sách 50 khách hàng trong nhóm thử nghiệm
          Beta
      - key: opt_2_5_b
        label: Tắt tính năng giới hạn hạn mức chi tiêu SMS (Quota Limit) của cổng
          SMS Gateway
      - key: opt_2_5_c
        label: Kích hoạt gửi SMS Brandname thật đồng loạt tới 100.000 số điện thoại
          thật với chi phí 500đ/tin
    - key: node_2_6
      prompt: 'Bước 6: Tải trọng hệ thống tăng vọt do khách hàng click vào Push Notification.
