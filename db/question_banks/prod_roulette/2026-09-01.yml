- content:
    scenario: 'Bối cảnh: Bạn đang thực hiện Hotfix trực tiếp hệ thống Khuyến mãi (Voucher
      & Promotion) của sàn Thương mại điện tử trong sự kiện Flash Sale 11/11. Lỗi
      hiện tại: Khách hàng nhập mã `SUPERSALE` bị áp dụng giảm giá 100% thay vì 10%.
      Hệ thống đang gánh tải 50,000 Request/Giây (RPS). Bạn cần khôi phục lại logic
      tính giá và xử lý các đơn hàng sai giá.'
    nodes:
    - key: node_2_1
      prompt: 'Bước 1: Phân tích lượng traffic và tải hệ thống để chuẩn bị can thiệp
        Hotfix.'
      options:
      - key: s2_n1_o1
        label: Kiểm tra Dashboard Grafana/Datadog để xem latency, throughput và tỷ
          lệ lỗi API /api/v1/checkout
      - key: s2_n1_o2
        label: SSH trực tiếp vào một Server App PROD và gõ lệnh `top` để xem CPU
      - key: s2_n1_o3
        label: Xem log trực tiếp bằng `tail -f /var/log/nginx/access.log` trên Gateway
    - key: node_2_2
      prompt: 'Bước 2: Chăn chặn tổn thất tài chính ngay lập tức trong khi chờ build
        bản sửa lỗi.'
      options:
      - key: s2_n2_o1
        label: Chỉnh sửa nhanh config trên Redis Remote Config để vô hiệu hóa mã `SUPERSALE`
          ngay lập tức
      - key: s2_n2_o2
        label: Sửa trực tiếp giá trị `discount_percent` trong bảng `promotions` trên
          DB về 0
      - key: s2_n2_o3
        label: Restart toàn bộ Kubernetes Pods của Promotion Service
    - key: node_2_3
      prompt: 'Bước 3: Chuẩn bị bản Hotfix mã nguồn trong ứng dụng.'
      options:
      - key: s2_n3_o1
        label: Tạo branch `hotfix/fix-promotion-calculator` từ `main`, sửa code, viết
          Unit Test và mở Pull Request
      - key: s2_n3_o2
        label: Sửa code trực tiếp trong container Docker trên PROD bằng lệnh `vi`
      - key: s2_n3_o3
        label: Commit code thẳng vào branch `main` mà không qua khâu Review
    - key: node_2_4
      prompt: 'Bước 4: Kiểm thử bản Hotfix trước khi đẩy lên môi trường Production.'
      options:
      - key: s2_n4_o1
        label: Chạy Automated Regression Test Suite trên môi trường Staging có cấu
          hình giống PROD
      - key: s2_n4_o2
        label: Bắn lệnh API mua hàng thật bằng tài khoản cá nhân trên PROD để test
          logic giảm giá
      - key: s2_n4_o3
        label: Chỉ kiểm tra bằng mắt (Code Review) rồi tiến hành Deploy luôn để tiết
          kiệm thời gian
    - key: node_2_5
      prompt: 'Bước 5: Chiến lược triển khai (Deploy) Hotfix lên cụm Production Kubernetes.'
      options:
      - key: s2_n5_o1
        label: Thực hiện Rolling Update từng Pod một với chỉ số `maxSurge=25%` và
          `maxUnavailable=0`
      - key: s2_n5_o2
        label: Xóa toàn bộ Deployment cũ và Apply Deployment mới cùng một lúc
      - key: s2_n5_o3
        label: 'Thực hiện Canary Deployment: Điều hướng 5% traffic sang Pod mới để
          theo dõi'
    - key: node_2_6
      prompt: 'Bước 6: Xử lý các đơn hàng bị mua sai giá (giảm 100%) trong khoảng
        thời gian diễn ra sự cố.'
      options:
      - key: s2_n6_o1
        label: Đổi trạng thái đơn hàng thành `PENDING_REVIEW` để bộ phận VH/CSKH đối
          soát và xử lý
      - key: s2_n6_o2
        label: Gửi yêu cầu tự động gọi API đơn vị vận chuyển đối tác hủy toàn bộ đơn
          hàng sai giá ngay lập tức
      - key: s2_n6_o3
        label: Xóa hẳn các bản ghi đơn hàng lỗi khỏi cơ sở dữ liệu `orders`
    - key: node_2_7
      prompt: 'Bước 7: Tương tác với người dùng đã mua đơn hàng 0 đồng do lỗi.'
      options:
      - key: s2_n7_o1
        label: Chuẩn bị Template Email/Push Notification giải thích sự cố kỹ thuật
