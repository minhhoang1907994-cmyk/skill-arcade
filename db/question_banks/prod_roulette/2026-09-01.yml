  difficulty: medium
- content:
    scenario: Một chương trình khuyến mãi bất ngờ phát sinh bug vòng lặp vô hạn khiến
      hệ thống tự động sinh 50,000 voucher mệnh giá 500,000đ và bắt đầu chuẩn bị phát
      hành hàng loạt trên Production.
    nodes:
    - key: q2_node_1
      prompt: 'Bước 1: Cronjob phát sinh 50,000 voucher sai đang chạy ngầm. Bạn cần
        dừng ngay việc tạo thêm voucher.'
      options:
      - key: q2_opt_1_1
        label: Tắt Cronjob Kubernetes bằng `kubectl scale cronjob/voucher-generator
          --replicas=0` và đổi ConfigMap `IS_PROMOTION_ACTIVE=false`.
      - key: q2_opt_1_2
        label: Thực hiện lệnh `DROP TABLE vouchers;` trên database Production để xóa
          sạch.
      - key: q2_opt_1_3
        label: Stop ngay lập tức toàn bộ Nginx Ingress Controller để chặn người dùng
          truy cập.
    - key: q2_node_2
      prompt: 'Bước 2: Cần vô hiệu hóa 50,000 voucher lỗi trong Database trước khi
        người dùng sử dụng.'
      options:
      - key: q2_opt_2_1
        label: Chạy SQL query `UPDATE vouchers SET status = 'DISABLED' WHERE batch_id
          = 'ERR_20231025' AND status = 'UNUSED';` trên DB Master.
      - key: q2_opt_2_2
        label: Xóa dữ liệu trong Redis Cache bằng lệnh `KEYS voucher:*` rồi `DEL`
          mà không cập nhật Database.
      - key: q2_opt_2_3
        label: Chạy SQL `DELETE FROM vouchers;` xóa toàn bộ voucher trong DB bao gồm
          cả voucher hợp lệ cũ.
    - key: q2_node_3
      prompt: 'Bước 3: Worker Push Notification đang lấy dữ liệu voucher từ Queue
        chuẩn bị bắn Push Notification.'
      options:
      - key: q2_opt_3_1
        label: Scale down số lượng replicas của Push Worker về 0 (`kubectl scale deployment
          push-worker --replicas=0`).
      - key: q2_opt_3_2
        label: Xóa file cấu hình `firebase-service-account.json` trên server Production.
      - key: q2_opt_3_3
        label: Để Push Worker tiếp tục chạy hết queue nhằm mục đích ghi lại log chi
          tiết.
    - key: q2_node_4
      prompt: 'Bước 4: Cần xác định xem đã có thông báo Push nào lỡ gửi ra cho thiết
        bị người dùng hay chưa.'
      options:
      - key: q2_opt_4_1
        label: Kiểm tra Dashboard Firebase Cloud Messaging (FCM) metrics và query
          log `push_sent.log` trên Read-Replica.
      - key: q2_opt_4_2
        label: Gửi một Push Notification thông báo cấp báo đến toàn bộ Topic `all_users`
          yêu cầu người dùng không dùng voucher.
      - key: q2_opt_4_3
        label: SSH trực tiếp vào server Production và chạy `tail -f /var/log/syslog`
          để quan sát.
    - key: q2_node_5
      prompt: 'Bước 5: Tiến trình Email Campaign đang đệm 100,000 email chứa mã voucher
        vào Mailchimp API queue.'
      options:
      - key: q2_opt_5_1
        label: Revoke (Thu hồi) ngay lập tức API Key Mailchimp trên trang quản trị
          Mailchimp để ngắt kết nối gửi đi.
      - key: q2_opt_5_2
        label: Gửi lệnh `POST /v3/campaigns/{id}/actions/send` tới Mailchimp API để
          đẩy nhanh tiến độ rồi xử lý sau.
      - key: q2_opt_5_3
        label: Xóa bảng `users` trên Database để Mailchimp không tìm thấy danh sách
          người nhận.
    - key: q2_node_6
      prompt: 'Bước 6: Kiểm tra phát hiện đã có 15 khách hàng áp mã voucher lỗi này
        và thanh toán đơn hàng thành công.'
      options:
      - key: q2_opt_6_1
        label: Đánh dấu trạng thái đơn hàng thành `PENDING_CUSTOMER_SERVICE_REVIEW`
          để hoãn khâu vận chuyển và để CSKH xử lý.
      - key: q2_opt_6_2
        label: Gọi API Payment Gateway `POST /v1/refunds` để tự động hoàn tiền thật
          và hủy ngay lập tức 15 đơn hàng đó.
      - key: q2_opt_6_3
        label: Sửa giá trị tổng tiền đơn hàng `total_amount` thành 0đ trong Database
          mà không thông báo khách hàng.
    - key: q2_node_7
      prompt: 'Bước 7: Cần khôi phục số dư ví Voucher (Voucher Wallet) của các tài
        khoản bị ảnh hưởng về đúng trạng thái ban đầu.'
      options:
      - key: q2_opt_7_1
        label: Viết script reconciliation, chạy thử nghiệm với tham số `--dry-run`
          kiểm tra log trước khi commit transaction thật.
      - key: q2_opt_7_2
        label: Chạy câu lệnh SQL `UPDATE user_wallets SET balance = 0;` cho toàn bộ
          tài khoản trên hệ thống.
      - key: q2_opt_7_3
        label: Bỏ qua việc điều chỉnh dữ liệu ví, chờ người dùng khiếu nại mới kiểm
          tra từng trường hợp.
    - key: q2_node_8
      prompt: 'Bước 8: Bộ phận CSKH cần danh sách các khách hàng đã nhận voucher lỗi
        để chuẩn bị kịch bản hỗ trợ.'
      options:
      - key: q2_opt_8_1
        label: Xuất dữ liệu `user_id`, `voucher_code` ra file Excel, lưu vào Google
          Drive nội bộ và giới hạn quyền truy cập.
      - key: q2_opt_8_2
        label: Chạy script tự động gửi SMS thật thông báo xin lỗi kèm mã đền bù tới
          danh sách SĐT của toàn bộ khách hàng này.
      - key: q2_opt_8_3
        label: Đăng tải file chứa thông tin email, SĐT và lịch sử giao dịch khách
          hàng lên kênh Slack chung `#general`.
    - key: q2_node_9
      prompt: 'Bước 9: Sau khi xử lý xong voucher lỗi, cần kiểm tra lại tính toàn
        vẹn của Database Production.'
      options:
      - key: q2_opt_9_1
        label: Chạy script đối soát Checksum giữa Master DB và Replica DB, kiểm tra
          Foreign Key constraints.
      - key: q2_opt_9_2
        label: Restore toàn bộ Database từ bản Backup 12 tiếng trước mà không sao
          lưu các giao dịch hợp lệ mới phát sinh.
      - key: q2_opt_9_3
        label: Không làm gì thêm, bật lại toàn bộ hệ thống ngay lập tức.
    - key: q2_node_10
      prompt: 'Bước 10: Tiến hành họp Post-mortem để phòng ngừa sự cố lặp lại trong
        tương lai.'
      options:
      - key: q2_opt_10_1
        label: Bổ sung Rate Limiting cho Voucher Engine, thêm bước phê duyệt (Approval
          workflow) khi tạo đợt voucher mới.
      - key: q2_opt_10_2
        label: Xóa toàn bộ log file sự cố trên Server để đảm bảo không bị rò rỉ dữ
          liệu.
      - key: q2_opt_10_3
        label: Chuyển toàn bộ database Production sang hệ quản trị SQLite cho đơn
          giản.
  answer_key:
    option_effects:
      q2_opt_1_1:
        points: 10
        irreversible: false
        consequence_text: Dừng thành công tiến trình sinh voucher rác mà không ảnh
          hưởng tới các dịch vụ đang hoạt động khác.
        next_node: q2_node_2
      q2_opt_1_2:
        points: 3
        irreversible: false
        consequence_text: Lệnh DROP TABLE làm mất hoàn toàn cấu trúc bảng `vouchers`,
          khiến ứng dụng crash ngay lập tức khi query.
        next_node: q2_node_2
      q2_opt_1_3:
