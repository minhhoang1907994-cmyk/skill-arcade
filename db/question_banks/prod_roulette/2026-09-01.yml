  difficulty: medium
- content:
    scenario: Kiểm thử trực tiếp tính năng Hoàn tiền tự động (Auto-refund) kết nối
      qua API Ngân hàng trên môi trường Production vào lúc 23:00.
    nodes:
    - key: q1_n1
      prompt: 'Bước 1: Chọn tài khoản người dùng để thực hiện giao dịch thử nghiệm
        hoàn tiền.'
      options:
      - key: q1_o1_1
        label: Tạo tài khoản thử nghiệm nội bộ và gắn nhãn is_test_account = true
          trong DB PROD.
      - key: q1_o1_2
        label: Sử dụng tài khoản cá nhân của chính bạn đã tạo từ trước trên môi trường
          PROD.
      - key: q1_o1_3
        label: Lấy ngẫu nhiên một đơn hàng vừa bị hủy của khách hàng thật trên hệ
          thống để chạy thử.
    - key: q1_n2
      prompt: 'Bước 2: Chuẩn bị nguồn tiền và hạn mức giao dịch cho kịch bản kiểm
        thử.'
      options:
      - key: q1_o2_1
        label: Cấu hình hạn mức tối đa 10,000 VND cho API hoàn tiền trong môi trường
          sandbox ngân hàng.
      - key: q1_o2_2
        label: Nạp 50,000 VND từ ví cá nhân vào tài khoản test để thực hiện hoàn tiền
          thật trên PROD.
      - key: q1_o2_3
        label: Sử dụng đơn hàng trị giá 5,000,000 VND có sẵn để test hạn mức cao.
    - key: q1_n3
      prompt: 'Bước 3: Cấu hình Endpoint Webhook nhận callback kết quả từ phía Ngân
        hàng.'
      options:
      - key: q1_o3_1
        label: Trỏ Webhook về URL staging đã qua kiểm thử bảo mật khắt khe.
      - key: q1_o3_2
        label: Trỏ Webhook trực tiếp về dịch vụ ngrok đang chạy trên máy laptop cá
          nhân.
      - key: q1_o3_3
        label: Tắt tính năng xác thực Chữ ký số (HMAC Signature Check) trên Webhook
          PROD để test cho nhanh.
    - key: q1_n4
      prompt: 'Bước 4: Kiểm tra tính năng gửi thông báo Push Notification sau khi
        hoàn tiền thành công.'
      options:
      - key: q1_o4_1
        label: Chỉ bật log console và gửi Push Notification tới riêng Device Token
          của máy test.
      - key: q1_o4_2
        label: Tắt toàn bộ dịch vụ Firebase Cloud Messaging trong lúc test.
      - key: q1_o4_3
        label: Bắn lệnh Push Notification broadcast toàn hệ thống với nội dung 'Hoàn
          tiền thử nghiệm thành công'.
    - key: q1_n5
      prompt: 'Bước 5: Kích hoạt Lệnh Hoàn Tiền (Refund Trigger) từ công cụ Admin
        Dashboard.'
      options:
      - key: q1_o5_1
        label: Bật Feature Flag 'DRY_RUN_MODE' để mô phỏng luồng gọi API ngân hàng.
      - key: q1_o5_2
        label: Thực hiện lệnh hoàn tiền trực tiếp qua API Gateway của Ngân hàng đối
          với tài khoản test.
      - key: q1_o5_3
        label: Chạy script SQL update trực tiếp trạng thái payment_status = 'REFUNDED'
          trong Database.
    - key: q1_n6
      prompt: 'Bước 6: Ngân hàng trả về lỗi ''TIMEOUT_608''. Bạn xử lý sự cố này như
        thế nào?'
      options:
      - key: q1_o6_1
        label: Tra cứu tra soát giao dịch (Reconcile API) với phía Ngân hàng để xác
          định trạng thái thực sự.
      - key: q1_o6_2
        label: Bấm retry gửi lại yêu cầu hoàn tiền ngay lập tức trên giao diện Admin.
      - key: q1_o6_3
        label: Viết script tự động loop gửi yêu cầu 50 lần cho đến khi thành công.
    - key: q1_n7
      prompt: 'Bước 7: Kiểm tra sự cân bằng sổ sách kế toán (Ledger Balance) sau giao
        dịch test.'
      options:
      - key: q1_o7_1
        label: Đối soát bảng tài khoản treo (Suspense Account) và tài khoản kiểm thử.
      - key: q1_o7_2
        label: Bỏ qua vì đây chỉ là số tiền nhỏ 50,000 VND từ ví cá nhân.
      - key: q1_o7_3
        label: Điều chỉnh thủ công cột total_balance của công ty trong DB để khớp
          số liệu.
    - key: q1_n8
      prompt: 'Bước 8: Phát hiện hệ thống ghi nhận trùng lặp 2 bản ghi giao dịch hoàn
        tiền.'
      options:
      - key: q1_o8_1
        label: Cách ly bản ghi trùng, kiểm tra cơ chế Idempotency Key của API.
      - key: q1_o8_2
        label: Thực hiện lệnh Thu hồi tiền (Chargeback) trực tiếp từ API Ngân hàng.
      - key: q1_o8_3
        label: Xóa dòng dữ liệu bị trùng bằng câu lệnh DELETE trong MySQL PROD.
    - key: q1_n9
      prompt: 'Bước 9: Gửi báo cáo kết quả kiểm thử cho Tech Lead và Bộ phận Vận hành.'
      options:
      - key: q1_o9_1
        label: Xuất log hệ thống, đính kèm Idempotency Key và sao kê ngân hàng đối
          soát.
      - key: q1_o9_2
        label: Nhắn tin qua Slack bảo 'Đã test xong, mọi thứ chạy ổn lắm'.
      - key: q1_o9_3
        label: Không báo cáo gì vì không thấy khách hàng nào than phiền.
    - key: q1_n10
      prompt: 'Bước 10: Dọn dẹp dữ liệu và đưa hệ thống trở lại trạng thái chuẩn.'
      options:
      - key: q1_o10_1
        label: Khóa tài khoản test, tắt Feature Flag và thu hồi token ủy quyền.
      - key: q1_o10_2
        label: Giữ nguyên cấu hình Feature Flag để ngày mai test tiếp.
      - key: q1_o10_3
        label: Xóa toàn bộ bảng audit_logs liên quan đến các thao tác vừa thực hiện.
