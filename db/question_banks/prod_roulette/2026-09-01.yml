  difficulty: hard
- content:
    scenario: 'Dự án chuyển đổi Monolith sang Microservices: Bạn đang thực hiện chuyển
      đổi Auth & Notification Service sang cụm Microservices mới trên Production vào
      cuối tuần.'
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: Bắt đầu quá trình đồng bộ dữ liệu người dùng từ cơ sở dữ liệu
        Monolith sang DB Microservice mới.'
      options:
      - key: q2_n1_opt1
        label: Bật CDC (Change Data Capture) với Debezium để đồng bộ dữ liệu Real-time
          sang DB mới
      - key: q2_n1_opt2
        label: Đổi trực tiếp Connection String của app monolith sang kết nối DB microservice
          mới
      - key: q2_n1_opt3
        label: Gọi API đối tác eSIM/SMS Gateway để xác thực lại toàn bộ 100.000 số
          điện thoại user trên PROD
    - key: q2_n2
      prompt: 'Bước 2: Cần chuyển đổi Session token của người dùng sang cụm Redis
        Cluster mới.'
      options:
      - key: q2_n2_opt1
        label: Kiểm tra cấu hình maxmemory-policy và chạy dual-write token trên cả
          2 cụm Redis
      - key: q2_n2_opt2
        label: Export file dump.rdb từ Redis cũ rồi restore ghi đè trực tiếp lên Redis
          mới
      - key: q2_n2_opt3
        label: Gửi email hàng loạt yêu cầu tất cả người dùng bấm link đổi lại mật
          khẩu ngay lập tức
    - key: q2_n3
      prompt: 'Bước 3: Thực hiện điều hướng traffic đăng nhập của người dùng qua API
        Gateway mới.'
      options:
      - key: q2_n3_opt1
        label: Cấu hình Nginx Weighted Routing chuyển 5% traffic sang Auth Microservice
          để theo dõi
      - key: q2_n3_opt2
        label: Đổi bản ghi CNAME trên Cloudflare DNS trỏ thẳng 100% traffic sang Gateway
          mới
      - key: q2_n3_opt3
        label: Gọi Webhook đăng xuất cưỡng chế (Force Logout) toàn bộ người dùng di
          động
    - key: q2_n4
      prompt: 'Bước 4: Theo dõi tình trạng phản hồi của microservice mới sau khi mở
        5% traffic.'
      options:
      - key: q2_n4_opt1
        label: Theo dõi tỷ lệ HTTP 401/403 và latency trên Grafana Dashboard
      - key: q2_n4_opt2
        label: Tắt hoàn toàn log truy cập Nginx để tối ưu CPU cho Gateway mới
      - key: q2_n4_opt3
        label: Gửi thông báo Push Notification tới app mobile với nội dung Cập nhật
          tài khoản thành công
    - key: q2_n5
      prompt: 'Bước 5: Chuyển đổi dịch vụ gửi OTP SMS qua Notification Microservice.'
      options:
      - key: q2_n5_opt1
        label: Kiểm tra API Key, IP Whitelist và số dư tài khoản nhà mạng Twilio/VIETGUYS
          trên Prod
      - key: q2_n5_opt2
        label: Tăng tham số max_retry_attempts từ 3 lên 50 trong config gửi OTP
      - key: q2_n5_opt3
        label: Chạy job gửi tin nhắn OTP thử nghiệm đến danh sách 10.000 số điện thoại
          thật của khách hàng
    - key: q2_n6
      prompt: 'Bước 6: Hàng đợi Message Queue (RabbitMQ) của dịch vụ thông báo bị
        ùn tắc.'
      options:
      - key: q2_n6_opt1
        label: Tăng số lượng Worker Pods trên Kubernetes cluster để đẩy nhanh tốc
          độ tiêu thụ message
      - key: q2_n6_opt2
        label: Khởi động lại ngay lập tức RabbitMQ Pod mà không kiểm tra unacked messages
      - key: q2_n6_opt3
        label: Gọi API bên đối tác Zalo ZNS để gửi thông báo có tính phí thật bù cho
          tin nhắn nghẽn
    - key: q2_n7
      prompt: 'Bước 7: Chuẩn bị tăng dung lượng traffic lên 50% nhưng cần đảm bảo
        khả năng quay đầu.'
      options:
      - key: q2_n7_opt1
        label: Kiểm tra lại Runbook kịch bản Rollback và xác nhận trạng thái sẵn sàng
          của Monolith app
      - key: q2_n7_opt2
        label: Xóa toàn bộ các bảng dữ liệu cũ trên Monolith DB để giải phóng dung
          lượng đĩa
      - key: q2_n7_opt3
        label: Gọi API Revoke credentials ứng dụng OAuth2 trên Google Developer Console
    - key: q2_n8
      prompt: 'Bước 8: Phát hiện lỗi gián đoạn kết nối giữa Auth Microservice và Kafka
        Cluster.'
      options:
      - key: q2_n8_opt1
        label: Kiểm tra Kafka Consumer Group Lag và Security Group port 9092
      - key: q2_n8_opt2
        label: Thực hiện Purge toàn bộ message trong topic user-events để giải phóng
          bộ nhớ
      - key: q2_n8_opt3
        label: Gửi email xác nhận thay đổi địa chỉ email bảo mật tới toàn bộ danh
          sách khách hàng
    - key: q2_n9
      prompt: 'Bước 9: Tích hợp lại dịch vụ eKYC xác thực căn cước công dân vào Microservice
        mới.'
      options:
      - key: q2_n9_opt1
        label: Bật log Debug ở mức hạn chế cho module KYC để kiểm tra format request/response
      - key: q2_n9_opt2
        label: Bỏ qua bước kiểm tra chữ ký HMAC SHA256 từ Webhook eKYC trả về
      - key: q2_n9_opt3
        label: Gửi request gọi API đối tác eKYC xác thực lại toàn bộ dữ liệu CCCD
          thật (có tính phí per call)
    - key: q2_n10
      prompt: 'Bước 10: Chuyển đổi 100% traffic thành công, hoàn tất quá trình migration.'
      options:
      - key: q2_n10_opt1
        label: Cập nhật trạng thái trang StatusPage sang Operational và đóng Maintenance
          Window
      - key: q2_n10_opt2
        label: Xóa toàn bộ các file log hệ thống trên server PROD để dọn dẹp
      - key: q2_n10_opt3
        label: Tự động gửi tin nhắn SMS tri ân kèm mã quà tặng tiền mặt đến tất cả
          người dùng
