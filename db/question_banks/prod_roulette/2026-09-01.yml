  difficulty: hard
- content:
    scenario: Thực hiện nâng cấp cơ sở dữ liệu và chuyển đổi dữ liệu (data migration)
      cho ví điện tử Fintech (wallet-service). Cần nâng cấp bảng wallets với hơn 10
      triệu bản ghi từ kiến trúc cũ sang hệ thống sổ cái kép (double-entry ledger).
    nodes:
    - key: q2_n1
      prompt: Trước khi chạy script migration trên DB Production kích thước 500GB,
        bước chuẩn bị quan trọng nhất là gì?
      options:
      - key: q2_n1_o1
        label: Xác nhận bản backup snapshot mới nhất và kiểm tra tính năng khôi phục
          Point-in-Time Recovery (PITR).
      - key: q2_n1_o2
        label: Bỏ qua kiểm tra backup vì hệ thống đã có cronjob tự động chạy hàng
          đêm.
      - key: q2_n1_o3
        label: Khóa toàn bộ truy vấn read/write bằng lệnh LOCK TABLE trên tất cả các
          bảng.
    - key: q2_n2
      prompt: Script migration bị treo do lock timeout trên bảng `wallets`. Bạn sẽ
        làm gì?
      options:
      - key: q2_n2_o1
        label: Rollback transaction hiện tại, kiểm tra cây truy vấn đang gây lock
          và chạy lại vào khung giờ thấp điểm.
      - key: q2_n2_o2
        label: Tìm PID của session đang giữ lock và dùng `kill -9` để hạ ngay lập
          tức.
      - key: q2_n2_o3
        label: Sửa tham số `lock_timeout = 0` (vô thời hạn) trong session migration
          và chạy lại script.
    - key: q2_n3
      prompt: Phát hiện lệch tiền trong tổng số dư (balance mismatch) ở một số tài
        khoản sau khi đổi tên cột. Bạn xử lý thế nào?
      options:
      - key: q2_n3_o1
        label: Tạm dừng tiến trình đối soát batch job, chạy script so sánh số dư giữa
          ledger và DB backup trên Read Replica.
      - key: q2_n3_o2
        label: Viết script UPDATE thẳng số dư trong cột `balance` của DB Master cho
          khớp số hiển thị.
      - key: q2_n3_o3
        label: Gọi trực tiếp API `/v1/settlement/reconcile-force` của đối tác ngân
          hàng bên thứ ba để tự động khớp tiền ngân lượng thật.
    - key: q2_n4
      prompt: Kafka consumer báo lỗi nhận trùng lặp sự kiện `payment_completed` trong
        quá trình chuyển đổi.
      options:
      - key: q2_n4_o1
        label: Bật cơ chế Idempotency Key trên consumer service để lọc bỏ các event
          bị lặp.
      - key: q2_n4_o2
        label: Khởi động lại toàn bộ Kafka consumer pods mà không commit offset hiện
          tại.
      - key: q2_n4_o3
        label: Xóa toàn bộ Consumer Group Offset trên Kafka cluster để consumer đọc
          lại từ đầu.
    - key: q2_n5
      prompt: CPU trên DB Master tăng vọt lên 99% trong quá trình chạy script cập
        nhật chỉ mục (index update).
      options:
      - key: q2_n5_o1
        label: Chuyển hướng toàn bộ các truy vấn đọc (SELECT) sang cụm Read Replica.
      - key: q2_n5_o2
        label: Thực hiện Switchover/Failover DB Master sang Replica ngay giữa lúc
          đang migration.
      - key: q2_n5_o3
        label: Stop luôn dịch vụ DB Master trong 15 phút để CPU hạ nhiệt.
    - key: q2_n6
      prompt: Microservice wallet-service bị không qua được Health Check (Liveness/Readiness
        Probe) sau khi deploy phiên bản mới.
      options:
      - key: q2_n6_o1
        label: Xem log ứng dụng (`kubectl logs`), phát hiện thiếu biến môi trường
          DB connection và thực hiện rollback.
      - key: q2_n6_o2
        label: Sửa file K8s deployment để xóa bỏ đoạn cấu hình readinessProbe và livenessProbe.
      - key: q2_n6_o3
        label: Reboot toàn bộ các node vật lý của Kubernetes cluster.
    - key: q2_n7
      prompt: API Webhook xác nhận thanh toán từ ngân hàng bị lỗi 401 Unauthorized
        do lệch Secret Key mới.
      options:
