        label: Revert Secret Key về bản cũ trong Key Vault và đồng bộ lại cấu hình
          cho API Gateway.
      - key: q2_n7_o2
        label: Tắt tạm thời bước kiểm tra chữ ký HMAC/Secret Key ở API Gateway để
          webhook thông suốt.
      - key: q2_n7_o3
        label: Hardcode trực tiếp Secret Key mới vào trong file code nguồn và push
          thẳng bản build.
    - key: q2_n8
      prompt: Hàng đợi thông báo cashback bị nghẽn 100,000 push notification. Đội
        marketing yêu cầu xử lý khẩn.
      options:
      - key: q2_n8_o1
        label: Scale out số lượng worker gửi push kèm theo cơ chế Rate Limiting để
          tránh bị dịch vụ Firebase/APNS chặn.
      - key: q2_n8_o2
        label: Hủy toàn bộ 100,000 notification trong queue để tập trung tài nguyên
