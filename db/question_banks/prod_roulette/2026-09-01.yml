  difficulty: medium
- content:
    scenario: Hệ thống sàn Thương mại điện tử đang bước vào giờ vàng Flash Sale lúc
      00:00. Dịch vụ checkout-service bị gián đoạn, khiến hơn 1.000 đơn hàng rơi vào
      trạng thái PENDING_PAYMENT và người dùng báo lỗi không thanh toán được qua Cổng
      thanh toán.
    nodes:
    - key: q1_n1
      prompt: 'Bước 1: Bạn vừa truy cập vào hệ thống giám sát sự cố. Cần xác định
        nguyên nhân sự cố giao dịch bị nghẽn.'
      options:
      - key: q1_n1_opt1
        label: Đọc log trên Kibana và lọc theo error code PAYMENT_GATEWAY_TIMEOUT
      - key: q1_n1_opt2
        label: Chạy SQL UPDATE trực tiếp trên DB PROD để chuyển trạng thái các đơn
          PENDING sang SUCCESS
      - key: q1_n1_opt3
        label: Tự động gửi email thông báo lỗi thanh toán kèm link thanh toán lại
          cho toàn bộ khách hàng có đơn PENDING
    - key: q1_n2
      prompt: 'Bước 2: Phát hiện nghẽn kết nối database do query khóa bảng `orders`.
        Bạn làm gì tiếp theo?'
      options:
      - key: q1_n2_opt1
        label: Kiểm tra snapshot backup DB gần nhất và chạy SQL SELECT với NOLOCK
          để kiểm tra các giao dịch treo
      - key: q1_n2_opt2
        label: Chạy lệnh KILL SESSION hàng loạt đối với các process DB đang giữ Lock
      - key: q1_n2_opt3
        label: Gửi request API gọi sang Cổng thanh toán bên thứ ba để hủy tự động
          các giao dịch đang treo
    - key: q1_n3
      prompt: 'Bước 3: Cần sửa đoạn code bị dồn hàng đợi (deadlock) trong `checkout-service`.'
      options:
      - key: q1_n3_opt1
        label: Đưa hotfix lên Staging, chạy Automation Test suite trước khi build
          Docker image mới cho PROD
      - key: q1_n3_opt2
        label: Sửa trực tiếp file source code python trên container PROD và chạy restart
          service
      - key: q1_n3_opt3
        label: Bắn giả lập 500 Webhook thanh toán thành công vào API PROD để test
          luồng xử lý
    - key: q1_n4
      prompt: 'Bước 4: Sau khi deploy hotfix, webhook từ Cổng thanh toán vẫn chưa
        thể cập nhật đơn hàng thành công.'
      options:
      - key: q1_n4_opt1
        label: Kiểm tra cấu hình Nginx Ingress, SSL certificate và Whitelist IP giữa
          server PROD với Gateway
      - key: q1_n4_opt2
        label: Tắt tạm thời middleware Verify Signature của Webhook để giao dịch qua
          dễ dàng hơn
      - key: q1_n4_opt3
        label: Gửi Push Notification trên ứng dụng mobile với nội dung Đơn hàng đã
          được xác nhận
    - key: q1_n5
      prompt: 'Bước 5: Cần xử lý bù cho 1.000 đơn hàng chưa nhận được Webhook thanh
        toán.'
      options:
      - key: q1_n5_opt1
        label: Chạy lệnh Cronjob retry webhook ở chế độ --dry-run để xem log preview
      - key: q1_n5_opt2
        label: Chạy script retry cập nhật trạng thái đơn hàng trực tiếp theo batch
          50 đơn mỗi lần
      - key: q1_n5_opt3
        label: Gọi API Charging cấn trừ tiền trực tiếp từ ví điện tử khách hàng không
          qua xác nhận OTP
    - key: q1_n6
      prompt: 'Bước 6: Khách hàng phản ánh nhận được thông báo không nhất quán. Cần
        xử lý truyền thông.'
      options:
      - key: q1_n6_opt1
        label: Soạn sẵn template email giải thích sự cố, lưu bản nháp và nhờ Product
          Owner duyệt
      - key: q1_n6_opt2
        label: Chỉnh sửa trực tiếp file HTML email thông báo trên server PROD và bật
          flag auto-send
      - key: q1_n6_opt3
        label: Phát lệnh gửi SMS Brandname hàng loạt báo sự cố tới toàn bộ 50.000
          người dùng đang online
    - key: q1_n7
      prompt: 'Bước 7: Bộ nhớ Redis Cache bị quá tải do lưu trữ session khách hàng
        Flash Sale.'
      options:
      - key: q1_n7_opt1
        label: Dùng lệnh SCAN để tìm và xoá các session key đã hết hạn trên Redis
          Cluster
      - key: q1_n7_opt2
        label: Thực thi lệnh FLUSHALL trên Redis Master PROD để giải phóng RAM ngay
          lập tức
      - key: q1_n7_opt3
        label: Gửi tặng 100.000 xu thưởng vào ví thật của tất cả tài khoản bị đứt
          kết nối session
    - key: q1_n8
      prompt: 'Bước 8: Kiểm tra số lượng tồn kho của các mặt hàng Flash Sale bị lệch
        so với thực tế.'
      options:
      - key: q1_n8_opt1
        label: Chạy script đối soát Read-Only so sánh bảng inventory với order_items
      - key: q1_n8_opt2
        label: Chạy SQL UPDATE cộng thêm 100 sản phẩm vào stock cho tất cả mặt hàng
          bị báo hết kho
      - key: q1_n8_opt3
        label: Gọi API bên hãng vận chuyển đối tác tạo lệnh giao hàng tự động cho
          các đơn pending
    - key: q1_n9
      prompt: 'Bước 9: Phát hiện một số đơn hàng bị trừ tiền 2 lần trên cổng thanh
        toán.'
      options:
      - key: q1_n9_opt1
        label: Trích xuất danh sách transaction_id bị trùng và chuyển sang bộ phận
          KeToan đối soát
      - key: q1_n9_opt2
        label: Thực hiện Revert commit code hotfix vừa deploy và đưa server về bản
          build cũ
      - key: q1_n9_opt3
        label: Kích hoạt API Auto-Refund hoàn tiền trực tiếp trên Cổng thanh toán
          cho tất cả giao dịch nghi vấn
    - key: q1_n10
      prompt: 'Bước 10: Sự cố cơ bản được khống chế, cần hoàn tất quy trình xử lý.'
      options:
      - key: q1_n10_opt1
        label: Mở Dashboard Grafana theo dõi metric HTTP rate và báo cáo Post-Mortem
          cho Lead
      - key: q1_n10_opt2
        label: Tắt bớt 50% số lượng instance EC2 trên AWS để tiết kiệm chi phí sau
          khi hạ nhiệt
      - key: q1_n10_opt3
        label: Tạo và phát hành voucher giảm giá 50% không giới hạn cho toàn bộ user
          trên hệ thống
