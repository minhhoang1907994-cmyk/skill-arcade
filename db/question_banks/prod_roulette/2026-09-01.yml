  difficulty: medium
- content:
    scenario: Thực hiện xử lý sự cố kẹt giao dịch PENDING và khôi phục thanh toán
      tự động trên môi trường Production của hệ thống Thương mại điện tử trong khung
      giờ thấp điểm.
    nodes:
    - key: q1_node_1
      prompt: 'Bước 1: Hệ thống ghi nhận 1,200 đơn hàng trạng thái PENDING từ cổng
        thanh toán. Bạn cần kiểm tra danh sách đơn hàng bị kẹt.'
      options:
      - key: q1_opt_1_1
        label: 'Truy vấn DB Read-Replica sử dụng index: SELECT * FROM orders WHERE
          status = ''PENDING'' LIMIT 20;'
      - key: q1_opt_1_2
        label: Chạy trực tiếp UPDATE orders SET status = 'FAILED' WHERE status = 'PENDING';
          trên DB Master.
      - key: q1_opt_1_3
        label: Chạy script giả lập webhook callback của Payment Gateway để retry toàn
          bộ đơn hàng PENDING.
    - key: q1_node_2
      prompt: 'Bước 2: Hàng đợi Queue `payment_retry` trên RabbitMQ đang tích tụ 5,000
        messages. Cần xử lý kẹt queue.'
      options:
      - key: q1_opt_2_1
        label: Tạm dừng Consumer, dump 10 messages mẫu ra log để kiểm tra payload
          rồi fix bug trước khi resume.
      - key: q1_opt_2_2
        label: Bấm Purge toàn bộ queue `payment_retry` trên RabbitMQ Management UI.
      - key: q1_opt_2_3
        label: Forward toàn bộ 5,000 messages sang queue xử lý chính `payment_process`
          ngay lập tức.
    - key: q1_opt_3
      prompt: 'Bước 3: Cần phát thông báo cho người dùng có đơn hàng bị ảnh hưởng
        do sự cố gián đoạn thanh toán.'
      options:
      - key: q1_opt_3_1
        label: Đổi cấu hình endpoint SMS Provider sang Mock Server/Sandbox và chạy
          thử nghiệm với số nội bộ.
      - key: q1_opt_3_2
        label: Kích hoạt worker gửi SMS Brandname trực tiếp qua 3rd-party SMS Gateway
          tới danh sách SĐT khách hàng thật.
      - key: q1_opt_3_3
        label: Ghi thông báo lỗi vào file log `notification.log` trên server và tạm
          ngắt tính năng thông báo.
    - key: q1_node_4
      prompt: 'Bước 4: Master Database bị đẩy CPU lên 98% do lock bảng `orders`. Bạn
        xử lý thế nào?'
      options:
      - key: q1_opt_4_1
        label: Kiểm tra `pg_stat_activity` để lấy PID câu lệnh đang giữ lock và thực
          hiện `SELECT pg_cancel_backend(pid);`.
      - key: q1_opt_4_2
        label: Khởi động lại (Restart) ngay lập tức dịch vụ PostgreSQL trên Master
          node.
      - key: q1_opt_4_3
        label: Sửa `max_connections` trong `postgresql.conf` tăng gấp đôi và chạy
          `SELECT pg_reload_conf();`.
    - key: q1_node_5
      prompt: 'Bước 5: Cần rollback phiên bản `payment-service` từ v2.1.0 về v2.0.5
        do nghi ngờ phiên bản mới có bug.'
      options:
      - key: q1_opt_5_1
        label: Thực hiện `kubectl rollout undo deployment/payment-service` trên Kubernetes
          cluster.
      - key: q1_opt_5_2
        label: Xóa Deployment bằng `kubectl delete deployment payment-service` rồi
          apply lại manifest mới.
      - key: q1_opt_5_3
        label: Dùng `kubectl exec` truy cập vào container đang chạy và thay thế file
          binary trực tiếp.
    - key: q1_node_6
      prompt: 'Bước 6: Phát hiện bảng `order_refunds` bị thiếu cột `refund_ref` khiến
        service bị panic.'
      options:
      - key: q1_opt_6_1
        label: Tạo migration script bổ sung cột `refund_ref VARCHAR(255) NULL;` và
          chạy qua CI/CD Pipeline.
      - key: q1_opt_6_2
        label: Chạy SQL trực tiếp `ALTER TABLE order_refunds ADD COLUMN refund_ref
          VARCHAR(255) NOT NULL;` trên Master DB.
      - key: q1_opt_6_3
        label: Bỏ qua DB migration, hotfix code bỏ truy vấn đến cột `refund_ref` rồi
          deploy đè.
    - key: q1_node_7
      prompt: 'Bước 7: Cần đối soát số dư ví tài khoản của 50 người dùng gặp lỗi giao
        dịch bị trừ tiền 2 lần.'
      options:
      - key: q1_opt_7_1
        label: Gọi API đối soát `GET /v1/reconcile` phía đối tác thanh toán để so
          sánh log giao dịch trước khi chỉnh sửa DB.
      - key: q1_opt_7_2
        label: Gọi API chi tiền `POST /v1/disbursement` của cổng thanh toán bên thứ
          ba để đền bù 100,000đ tự động cho 50 user.
      - key: q1_opt_7_3
        label: Cập nhật trực tiếp số dư ví trong Redis Cache `SET user:balance:<id>`
          mà không cập nhật Database.
    - key: q1_node_8
      prompt: 'Bước 8: Redis Cache đang giữ dữ liệu cũ (stale cache) của thông tin
        cấu hình cổng thanh toán.'
      options:
      - key: q1_opt_8_1
        label: Dùng lệnh `SCAN` để tìm các key `config:payment:*` và thực hiện `DEL`
          đúng các key đó.
      - key: q1_opt_8_2
        label: Chạy lệnh `FLUSHALL` trên Cluster Redis Production.
      - key: q1_opt_8_3
        label: Đặt TTL bằng 1 giây cho tất cả các key đang có trên Redis.
    - key: q1_node_9
      prompt: 'Bước 9: Tech Lead yêu cầu trích xuất danh sách giao dịch bị lỗi trong
        đợt sự cố để làm báo cáo.'
      options:
      - key: q1_opt_9_1
        label: Chạy script query từ Read-Replica, xuất file CSV và đẩy lên S3 Bucket
          nội bộ có phân quyền.
      - key: q1_opt_9_2
        label: Query trực tiếp DB Master ghi dữ liệu ra file `.csv` ngay trong thư
          mục `/var/www/public` của Web Server.
      - key: q1_opt_9_3
        label: Chụp ảnh màn hình Dashboard Grafana và Kibana log gửi vào kênh Slack
          riêng của đội Incident Response.
    - key: q1_node_10
      prompt: 'Bước 10: Sự cố đã khắc phục xong. Cần hoàn tất các bước cuối cùng để
        đóng ticket incident.'
      options:
      - key: q1_opt_10_1
        label: Khôi phục lại cấu hình alert, đóng token tạm thời và họp viết tài liệu
          Post-mortem.
      - key: q1_opt_10_2
        label: Giữ nguyên cờ `DEBUG_MODE=true` trên Production Pods để theo dõi thêm
          trong 48h.
      - key: q1_opt_10_3
        label: Gỡ bỏ hoàn toàn Health Check endpoint của Payment Service để tránh
          Pod bị restart tự động.
