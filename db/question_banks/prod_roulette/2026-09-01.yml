  difficulty: medium
- content:
    scenario: Hệ thống khuyến mãi (voucher-service) của trang thương mại điện tử bị
      quá tải trong sự kiện Mega Sale 11/11. Hệ thống ghi nhận latency tăng đột biến
      từ 200ms lên 12s, Redis cache bị đơ và nhiều giao dịch áp mã bị lỗi 500.
    nodes:
    - key: q1_n1
      prompt: Hệ thống cảnh báo RAM trên voucher-service đạt 98% và latency tăng cao.
        Bạn sẽ làm gì đầu tiên?
      options:
      - key: q1_n1_o1
        label: Kiểm tra APM dashboard và Grafana metrics để xác định nghẽn ở DB hay
          Service.
      - key: q1_n1_o2
        label: Khởi động lại (restart) ngay lập tức tất cả các pod của voucher-service
          trên Production.
      - key: q1_n1_o3
        label: Thực hiện flush toàn bộ Redis cache để giải phóng bộ nhớ.
    - key: q1_n2
      prompt: APM chỉ ra truy vấn SQL kiểm tra điều kiện voucher trên bảng user_vouchers
        đang chạy mất 8 giây. Bạn sẽ làm gì?
      options:
      - key: q1_n2_o1
        label: Tạo index mới cho bảng user_vouchers(user_id, status) trực tiếp trên
          DB Master.
      - key: q1_n2_o2
        label: Kiểm tra query execution plan trên DB Read Replica và chuẩn bị script
          migration an toàn.
      - key: q1_n2_o3
        label: Kill tất cả các process đang chạy truy vấn slow query trên DB Master
          mà không cần kiểm tra lock.
    - key: q1_n3
      prompt: Phát hiện một bug trong mã nguồn gây ra vòng lặp vô tận khi tính phần
        trăm giảm giá. Bạn vừa tạo branch hotfix. Bước tiếp theo là gì?
      options:
      - key: q1_n3_o1
        label: Chạy unit test và integration test trên môi trường Staging trước khi
          build Docker image.
      - key: q1_n3_o2
        label: Bỏ qua pipeline CI/CD, build image thủ công và push thẳng lên Production
          registry.
      - key: q1_n3_o3
        label: Sửa trực tiếp file cấu hình logic trên server Production để bỏ qua
          bước tính toán voucher.
    - key: q1_n4
      prompt: Docker image hotfix đã sẵn sàng. Bạn chọn chiến lược deploy nào lên
        Kubernetes cluster Production?
      options:
      - key: q1_n4_o1
        label: Thực hiện Canary deployment cho 5% traffic và theo dõi log lỗi trong
          10 phút.
      - key: q1_n4_o2
        label: Thực hiện Rolling Update toàn bộ pods cùng một lúc để cập nhật nhanh
          nhất có thể.
      - key: q1_n4_o3
        label: Scale số lượng pod lên 100 instance lập tức để chịu tải bất chấp việc
          code đã sửa hay chưa.
    - key: q1_n5
      prompt: Khách hàng phản ánh một số user nhận được voucher trị giá 0 đồng do
        lỗi logic vừa rồi. Bạn xử lý dữ liệu sai thế nào?
      options:
      - key: q1_n5_o1
        label: Truy vấn log giao dịch trên Read Replica để lập danh sách user bị ảnh
          hưởng và gửi đội CSKH kiểm tra.
      - key: q1_n5_o2
        label: Chạy lệnh UPDATE trực tiếp bảng user_vouchers set status = 'EXPIRED'
          mà không lưu backup snapshot.
      - key: q1_n5_o3
        label: Kích hoạt script tự động gửi tin nhắn SMS đền bù kèm mã voucher 50$
          thật cho toàn bộ user trong danh sách bị lỗi.
    - key: q1_n6
      prompt: Hàng đợi RabbitMQ queue `voucher_events` bị dồn nén tới 500,000 message.
        Hệ thống phản hồi chậm.
      options:
      - key: q1_n6_o1
        label: Tăng số lượng consumer worker pod để tăng tốc độ xử lý message.
      - key: q1_n6_o2
        label: Thực hiện Purge (xóa sạch) queue `voucher_events` để giải phóng hàng
          đợi ngay lập tức.
      - key: q1_n6_o3
        label: Khởi động lại toàn bộ RabbitMQ cluster node đang chạy.
    - key: q1_n7
      prompt: Một số container bị lỗi OOMKilled do rò rỉ bộ nhớ (memory leak). Bạn
        xử lý thế nào?
      options:
      - key: q1_n7_o1
        label: Tăng tạm thời memory limit trong K8s deployment và bật heap dump để
          phân tích sau.
      - key: q1_n7_o2
        label: Tắt tính năng heap dump và cài đặt script auto-restart cho pod mỗi
          5 phút.
      - key: q1_n7_o3
        label: Bỏ hẳn middleware xác thực voucher ở API Gateway để giảm tải bộ nhớ
          cho voucher-service.
    - key: q1_n8
      prompt: Redis Master node bị rớt kết nối. Cụm Sentinel đang phân vân chưa chuyển
        Failover.
      options:
      - key: q1_n8_o1
        label: Kiểm tra tình trạng đồng bộ dữ liệu của Replica rồi mới thực hiện manual
          failover bằng lệnh Sentinel.
      - key: q1_n8_o2
        label: Ép buộc Failover ngay lập tức qua CLI mà không kiểm tra độ lệch offset
          của Replica.
      - key: q1_n8_o3
        label: Khởi động lại toàn bộ các node Redis bao gồm cả Master và Slaves.
    - key: q1_n9
      prompt: Cổng thanh toán bên thứ ba bắt đầu bị timeout khi gọi callback xác nhận
        voucher.
      options:
      - key: q1_n9_o1
        label: Bật Circuit Breaker để tự động chuyển sang luồng fallback xử lý bất
          đồng bộ.
      - key: q1_n9_o2
        label: Tăng HTTP Client timeout từ 5 giây lên 60 giây cho tất cả các request
          tới bên thứ ba.
      - key: q1_n9_o3
        label: Tự động gửi response HTTP 200 OK thành công cho cổng thanh toán trước
          khi xử lý logic thật.
    - key: q1_n10
      prompt: Hệ thống đã ổn định trở lại. Bạn thực hiện bước cuối cùng nào để hoàn
        tất xử lý sự cố?
      options:
      - key: q1_n10_o1
        label: Ghi lại timeline sự cố, giữ nguyên log giám sát và chuẩn bị họp Post-mortem.
      - key: q1_n10_o2
        label: Xóa toàn bộ file log của ngày hôm nay để tiết kiệm dung lượng ổ cứng
          server.
      - key: q1_n10_o3
        label: Đóng ngay ticket sự cố trên Jira mà không cần viết báo cáo nguyên nhân
          (Root Cause Analysis).
