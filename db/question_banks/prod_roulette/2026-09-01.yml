  difficulty: hard
- content:
    scenario: Xử lý sự cố tắc nghẽn Database Lock (Deadlock) và bùng nổ bộ nhớ Cache
      trong sự kiện Flash Sale của sàn Thương mại điện tử.
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: Giám sát phát hiện CPU Database PROD tăng vọt lên 99% vào đầu
        giờ Flash Sale. Thao tác đầu tiên là gì?'
      options:
      - key: q2_o1_1
        label: Mở công cụ Monitoring (Datadog/Grafana) kiểm tra slow queries và connection
          pool.
      - key: q2_o1_2
        label: Khởi động lại ngay lập tức cụm Database Master PROD.
      - key: q2_o1_3
        label: Tăng gấp đôi dung lượng CPU/RAM của DB Server trên AWS Console mà không
          hạ tải.
    - key: q2_o2
      prompt: 'Bước 2: Dòng lệnh query UPDATE inventory_tab đang gây lock hàng loạt
        bản ghi sản phẩm HOT. Bạn xử lý câu lệnh này ra sao?'
      options:
      - key: q2_o2_1
        label: Phân tích query execution plan và kill các process ID câu truy vấn
          bị kẹt lâu nhất.
      - key: q2_o2_2
        label: Chạy lệnh KILL ALL PROCESSES trên MySQL Master.
      - key: q2_o2_3
        label: Drop chỉ mục (INDEX) trên bảng inventory_tab để giảm tải việc ghi.
    - key: q2_o3
      prompt: 'Bước 3: Lượng truy cập vẫn tiếp tục đổ về cực lớn. Cần điều tiết lưu
        lượng người dùng (Traffic Throttling).'
      options:
      - key: q2_o3_1
        label: Bật trang chờ ảo (Virtual Waiting Room/Queue) trên Cloudflare để giới
          hạn RPS vào hệ thống.
      - key: q2_o3_2
        label: Tắt toàn bộ Load Balancer để ngắt sạch kết nối tới khi DB hạ nhiệt.
      - key: q2_o3_3
        label: Chạy script phát Voucher giảm giá 50% cho tất cả người dùng bị lỗi
          để xoa dịu.
    - key: q2_o4
      prompt: 'Bước 4: Cụm Redis Cache bị quá tải (Cache Penetration) do key sản phẩm
        HOT hết hạn cùng lúc.'
      options:
      - key: q2_o4_1
        label: Cập nhật lại Cache Key với kỹ thuật Mutex Lock/Logical Expiration để
          tải lại dữ liệu dần dần.
      - key: q2_o4_2
        label: Chạy lệnh FLUSHALL dọn dẹp toàn bộ dữ liệu trên Redis Cache Server.
      - key: q2_o4_3
        label: Tắt hẳn dịch vụ Redis Cache để ứng dụng đọc trực tiếp từ Database.
    - key: q2_o5
      prompt: 'Bước 5: Cần sửa gấp hotfix code backend xử lý trừ kho sản phẩm (Inventory
        Deduction).'
      options:
      - key: q2_o5_1
        label: Tạo Hotfix Branch, viết Unit Test, review code khẩn cấp và chạy qua
          CI/CD Pipeline.
      - key: q2_o5_2
        label: Sửa code trực tiếp trên máy chủ Production bằng vim và restart service.
      - key: q2_o5_3
        label: Push thẳng commit sửa đổi lên branch main mà không qua Pull Request.
    - key: q2_o6
      prompt: 'Bước 6: Thực hiện Deploy bản Hotfix lên cụm Production Kubernetes Cluster.'
      options:
      - key: q2_o6_1
        label: Sử dụng chiến lược Rolling Update để cập nhật từng Pod dần dần.
      - key: q2_o6_2
        label: Thực hiện kubectl delete pods --all để ép tất cả Pods cập nhật container
          mới cùng lúc.
      - key: q2_o6_3
        label: Gửi SMS thông báo cho khách hàng 'Hệ thống bảo trì trong 15 phút'.
    - key: q2_o7
      prompt: 'Bước 7: Sau khi Deploy, hệ thống xuất hiện tình trạng kho hàng bị âm
        (Over-selling) 20 sản phẩm.'
      options:
      - key: q2_o7_1
        label: Khoanh vùng 20 đơn hàng mua lố, liên hệ chăm sóc khách hàng để thương
          lượng hỗ trợ đền bù.
      - key: q2_o7_2
        label: Tự động gửi Voucher giảm giá 1,000,000 VND trực tiếp vào tài khoản
          20 khách hàng này.
      - key: q2_o7_3
        label: Âm thầm hủy 20 đơn hàng đó trên DB mà không gửi bất kỳ thông báo nào.
    - key: q2_o8
      prompt: 'Bước 8: Đồng bộ dữ liệu giữa Read Replica và Master Database đang bị
        lệch 10 phút (Replication Lag).'
      options:
      - key: q2_o8_1
        label: Chuyển tạm thời các truy vấn đọc quan trọng (như kiểm tra số dư) sang
          DB Master.
      - key: q2_o8_2
        label: Xóa và khởi tạo lại Read Replica ngay trong giờ cao điểm.
      - key: q2_o8_3
        label: Bỏ qua lệch lag, tiếp tục để người dùng đặt hàng dựa trên dữ liệu cũ
          của Replica.
    - key: q2_o9
      prompt: 'Bước 9: Khôi phục lại trạng thái bình thường cho hệ thống Flash Sale.'
      options:
      - key: q2_o9_1
        label: Gỡ bỏ dần các giới hạn Cloudflare Queue, theo dõi các chỉ số Golden
          Signals (Latency, Traffic, Errors, Saturation).
      - key: q2_o9_2
        label: Tắt toàn bộ hệ thống cảnh báo Alerting để không bị làm phiền trong
          đêm.
      - key: q2_o9_3
        label: Gửi thông báo Marketing Email hàng loạt để mời lại tất cả người dùng
          bị lỗi lúc nãy vào mua tiếp.
    - key: q2_n10
      prompt: 'Bước 10: Tổ chức buổi họp Post-mortem sau khi sự cố Flash Sale kết
        thúc.'
      options:
      - key: q2_o10_1
        label: Lập báo cáo sự cố theo văn hóa Blameless Post-mortem, phân tích Root
          Cause và đề ra Action Items.
      - key: q2_o10_2
        label: Quy trách nhiệm toàn bộ sự cố cho Developer viết câu lệnh SQL trừ kho.
      - key: q2_o10_3
        label: Đóng ticket sự cố mà không lưu lại tài liệu tài nguyên nào.
