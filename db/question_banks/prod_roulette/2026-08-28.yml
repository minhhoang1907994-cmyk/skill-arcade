  difficulty: hard
- content:
    scenario: Đợt Flash Sale 11/11 bắt đầu lúc 00:00. Hệ thống e-commerce ghi nhận
      lượng truy cập tăng vọt 500% so với ngày thường. Sau 5 phút, ghi nhận tỷ lệ
      lỗi 500 trên API /api/v1/checkout tăng lên 15%, đồng thời giá một số mặt hàng
      xa xỉ bị giảm về 0 VNĐ do lỗi cache sync.
    nodes:
    - key: N1
      prompt: Hệ thống bị quá tải và sai giá mặt hàng trên PROD. Bạn xử lý như thế
        nào đầu tiên?
      options:
      - key: N1_O1
        label: Bật trang bảo trì tạm thời trên Nginx để cách ly hệ thống.
      - key: N1_O2
        label: Chạy trực tiếp lệnh SQL UPDATE trên PROD DB để sửa lại giá về đúng.
      - key: N1_O3
        label: Gửi Push Notification hàng loạt kèm Voucher 50% xin lỗi người dùng
          lập tức.
    - key: N2
      prompt: Cần điều tra nguyên nhân gây lỗi 500 trên API /api/v1/checkout. Bạn
        chọn cách nào?
      options:
      - key: N2_O1
        label: Truy vấn log tập trung trên Kibana theo trace_id của các request lỗi.
      - key: N2_O2
        label: SSH trực tiếp vào server PROD và dùng tail -f app.log.
      - key: N2_O3
        label: Trigger API /debug/dump-heap để tải toàn bộ memory dump từ PROD node.
    - key: N3
      prompt: Đã phát hiện bug trong code logic tính giá. Làm sao để áp dụng bản sửa
        lỗi?
      options:
      - key: N3_O1
        label: Tạo branch hotfix, chạy qua CI/CD pipeline và test trên Staging trước
          khi deploy.
      - key: N3_O2
        label: Chỉnh sửa file source code trực tiếp trên server PROD và restart app
          service.
      - key: N3_O3
        label: Chuyển hướng Traffic sang Server Backup chưa được đồng bộ dữ liệu mới
          nhất.
    - key: N4
      prompt: Một số đơn hàng 0 VNĐ đã được tạo thành công trong 5 phút sự cố. Xử
        lý dữ liệu đơn hàng ra sao?
      options:
      - key: N4_O1
        label: Chạy script đối soát tự động để gắn flag PENDING_REVIEW cho các đơn
          hàng bất thường.
      - key: N4_O2
        label: Xoá trực tiếp các record đơn hàng 0 VNĐ khỏi cơ sở dữ liệu PROD.
      - key: N4_O3
        label: Gọi API Webhook hủy đơn và hoàn tiền tự động tới cổng thanh toán MoMo/ZaloPay.
    - key: N5
      prompt: Cache Redis đang lưu giá trị sai của sản phẩm. Bạn làm gì với Redis
        cluster?
      options:
      - key: N5_O1
        label: Xoá các key cache sản phẩm bị ảnh hưởng bằng pattern cụ thể.
      - key: N5_O2
        label: Lệnh FLUSHALL để xoá toàn bộ cache trên Redis cluster PROD.
      - key: N5_O3
        label: Gửi SMS OTP yêu cầu toàn bộ user đang online đăng nhập lại.
    - key: N6
      prompt: Môi trường PROD đã sẵn sàng để nhận lại lưu lượng truy cập. Bạn mở lại
        hệ thống như thế nào?
      options:
      - key: N6_O1
        label: 'Canary release: mở 10% traffic, theo dõi metrics trong 5 phút trước
          khi mở 100%.'
      - key: N6_O2
        label: Mở lại 100% traffic ngay lập tức trên Load Balancer.
      - key: N6_O3
        label: Kích hoạt lại API chạy chiến dịch quảng cáo tự động trên Facebook/Google
          Ads.
    - key: N7
      prompt: Nhiều khách hàng phản ánh qua tổng đài về việc đơn hàng bị tạm ngưng.
        Hướng xử lý CSKH?
      options:
      - key: N7_O1
        label: Xuất danh sách user ảnh hưởng gửi bộ phận CSKH liên hệ xử lý theo quy
          trình chuẩn.
      - key: N7_O2
        label: Tự động cộng tiền đền bù vào ví nội bộ cho danh sách user ước tính.
      - key: N7_O3
        label: Gọi API thanh toán tự động hoàn tiền trực tiếp về thẻ Visa/Mastercard
          thật của khách.
    - key: N8
      prompt: Cần thay đổi cấu trúc bảng orders để thêm trường kiểm tra dữ liệu về
        sau. Thao tác DB?
      options:
      - key: N8_O1
        label: Tạo DB Snapshot/Backup trước khi chạy lệnh ALTER TABLE.
      - key: N8_O2
        label: Chạy trực tiếp ALTER TABLE trên PROD DB mà không tạo backup để giảm
          thời gian.
      - key: N8_O3
        label: DROP TABLE các bảng log lịch sử cũ để giải phóng dung lượng đĩa trước
          khi ALTER.
    - key: N9
      prompt: Lưu lượng truy cập vẫn ở mức cao. Bạn cấu hình WAF/Rate Limit ra sao?
      options:
      - key: N9_O1
        label: Cấu hình Rate Limit 50 req/s/ip trên API Gateway.
      - key: N9_O2
        label: Tắt hoàn toàn Rate Limit để giảm độ trễ xử lý của API Gateway.
      - key: N9_O3
        label: Tự động gửi email hủy đơn tới tất cả IP vượt ngưỡng Rate Limit.
    - key: N10
      prompt: Sự cố đã được khắc phục hoàn toàn. Hành động cuối cùng của bạn là gì?
      options:
      - key: N10_O1
        label: Tổ chức họp Post-mortem, phân tích root cause và cập nhật tài liệu
          Runbook.
      - key: N10_O2
        label: Đóng Incident Ticket và không cần viết báo cáo sự cố.
      - key: N10_O3
        label: Thu hồi quyền truy cập PROD của lập trình viên đã làm phát sinh bug.
