- content:
    scenario: Hệ thống Video Streaming trực tuyến thực hiện nâng cấp phiên bản Cơ
      sở dữ liệu PostgreSQL và đồng bộ danh sách gói cước người dùng trên môi trường
      Production vào khung giờ bảo trì đêm.
    nodes:
    - key: m1
      prompt: Chuẩn bị thực hiện chuyển đổi dữ liệu (Database Migration) sang phiên
        bản PostgreSQL 15. Bước nào là an toàn nhất?
      options:
      - key: opt_m1_1
        label: Kiểm tra trạng thái bản Snapshot Backup gần nhất của PostgreSQL Prod
          và thử restore trên môi trường isolated.
      - key: opt_m1_2
        label: Bỏ qua kiểm tra backup và chạy ngay lệnh golang-migrate up trên Production.
      - key: opt_m1_3
        label: Sao chép dữ liệu Prod về database Staging để chạy thử script migration.
    - key: m2
      prompt: Phát hiện 10,000 tài khoản người dùng Premium bị thiếu quyền truy cập
        nội dung do lỗi lệch sync.
      options:
      - key: opt_m2_1
        label: Tạo một background job chạy đồng bộ theo batch 100 record mỗi lượt.
      - key: opt_m2_2
        label: Gọi trực tiếp API kích hoạt gói POST /api/v1/subscriptions/activate
          gửi request thật sang App Store / Google Play cho 10,000 user.
      - key: opt_m2_3
        label: Chạy query UPDATE SQL trực tiếp vào DB Prod không có clause WHERE rõ
          ràng.
    - key: m3
      prompt: Hệ thống CDN phát video báo lỗi 403 Forbidden hàng loạt tại khu vực
        miền Bắc.
      options:
      - key: opt_m3_1
        label: Trỏ tạm thời địa chỉ Origin Shield trên Cloudflare sang Cluster server
          dự phòng.
      - key: opt_m3_2
        label: Mở public toàn bộ Amazon S3 Bucket chứa file video gốc để người dùng
          xem tạm.
      - key: opt_m3_3
        label: Thực hiện Purge Cache đường dẫn các video bị lỗi trên CDN Dashboard.
    - key: m4
      prompt: Cần kiểm thử tính năng gửi Email thông báo đăng nhập thiết bị mới vừa
        được deploy hotfix.
      options:
      - key: opt_m4_1
        label: Sử dụng Mailtrap / SendGrid Sandbox để nhận email test và kiểm tra
          template.
      - key: opt_m4_2
        label: Gửi email xác nhận thiết bị thật thông qua Mailgun Prod tới toàn bộ
          danh sách khách hàng đang online.
      - key: opt_m4_3
        label: Cấu hình log nội dung email ra stdout của Docker Container thay vì
          gửi đi.
    - key: m5
      prompt: Tải CPU trên Nginx Load Balancer tăng vọt lên 95% do số lượng kết nối
        giữ dài (Keep-Alive).
      options:
      - key: opt_m5_1
        label: Thực hiện scale out tự động thêm 3 instance Nginx mới bằng Kubernetes
          HPA.
      - key: opt_m5_2
        label: Sửa file nginx.conf đổi keepalive_timeout 0; trực tiếp trên Prod và
          reload service.
      - key: opt_m5_3
        label: Phân tích tập tin access.log bằng công cụ goaccess để kiểm tra lưu
          lượng truy cập.
    - key: m6
      prompt: Thử nghiệm tính năng giới hạn số thiết bị xem đồng thời (Concurrency
        Limit) cho tài khoản gia đình.
      options:
      - key: opt_m6_1
        label: Giảm ngay limit từ 4 thiết bị xuống 1 thiết bị trên Prod để đo lường
          phản ứng người dùng.
      - key: opt_m6_2
        label: Sử dụng JMeter để giả lập 10 session đồng thời trên môi trường Staging.
      - key: opt_m6_3
        label: Bật Feature Flag enable_strict_concurrency cho 1% tài khoản internal
          tester.
    - key: m7
      prompt: Đội ngũ kiểm thử cần xác nhận tính năng Mua gói cước In-App Purchase
        trên ứng dụng di động Production.
      options:
      - key: opt_m7_1
        label: Dùng tài khoản Test User Sandbox do Google Play Console và App Store
          Connect cấp.
      - key: opt_m7_2
        label: Sử dụng thẻ tín dụng cá nhân thật mua gói cước trên App Prod rồi bấm
          xin hoàn tiền sau.
      - key: opt_m7_3
        label: Stub kết quả trả về của API verify Receipt trong mã nguồn Staging.
    - key: m8
      prompt: Elasticsearch Cluster dùng cho tính năng tìm kiếm phim báo trạng thái
        cảnh báo Yellow Status.
      options:
      - key: opt_m8_1
        label: Kiểm tra danh sách unassigned shards và thực hiện reroute allocate
          thủ công.
      - key: opt_m8_2
        label: Gọi API DELETE xoá bỏ toàn bộ index logs-app-* trên Elasticsearch Production.
      - key: opt_m8_3
        label: Tăng tham số number_of_replicas từ 1 lên 2 khi ổ cứng node đang đầy
          90%.
    - key: m9
      prompt: Cần mở truy cập server Prod cho nhân viên kỹ thuật vào xử lý sự cố từ
        xa.
      options:
      - key: opt_m9_1
        label: Mở inbound port 22 SSH công khai 0.0.0.0/0 trên AWS Security Group.
      - key: opt_m9_2
        label: Chỉ thêm IP static từ mạng VPN của công ty vào whitelist Security Group.
      - key: opt_m9_3
        label: Khởi tạo Bastion Host riêng trong VPC và kết nối qua AWS SSM Session
          Manager.
    - key: m10
      prompt: Đã hoàn thành các bước kiểm thử và khắc phục. Chuẩn bị kết thúc đợt
        bảo trì.
      options:
      - key: opt_m10_1
        label: Rà soát Grafana Dashboard, Sentry Error Tracking và thực hiện Smoke
          Test trước khi mở lại traffic.
      - key: opt_m10_2
        label: Xoá nhanh các file script tạm trên server Prod mà không kiểm tra tiến
          trình đang chạy.
      - key: opt_m10_3
        label: Bỏ qua bước Smoke test để mở hệ thống sớm cho người dùng vào xem phim.
