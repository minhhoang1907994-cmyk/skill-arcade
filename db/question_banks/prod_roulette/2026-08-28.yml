  difficulty: medium
- content:
    scenario: Ứng dụng gọi xe công nghệ triển khai hotfix thuật toán Dynamic Pricing
      ngay trước giờ cao điểm mưa lớn lúc 17:30. Microservice Dispatcher bị treo khiến
      tài xế không nhận được cuốc và người dùng bị hủy chuyến liên tục.
    nodes:
    - key: q2_node_1
      prompt: 'Bước 1: Hệ thống theo dõi Datadog báo lỗi HTTP 500 tăng đột biến lên
        40%. Bạn xử lý thế nào đầu tiên?'
      options:
      - key: q2_opt_1_a
        label: Kiểm tra phiên bản deployment gần nhất trên ArgoCD và rollback về commit
          stable trước đó.
      - key: q2_opt_1_b
        label: SSH thẳng vào Server Production để chỉnh sửa code file config.py.
      - key: q2_opt_1_c
        label: Tự động gọi API bên thứ ba gửi 50,000 Voucher giảm giá 50k vào ví tất
          cả người dùng đang mở app.
    - key: q2_node_2
      prompt: 'Bước 2: Rollback gặp sự cố do Schema Migration Database chưa rollback
        được. Bạn làm gì?'
      options:
      - key: q2_opt_2_a
        label: Chạy script Down-Migration để trả lại cấu trúc bảng cũ theo đúng quy
          trình.
      - key: q2_opt_2_b
        label: Xóa luôn bảng trips_active trong DB để tạo lại bảng mới cho sạch.
      - key: q2_opt_2_c
        label: Bỏ qua lỗi migration và ép Pod chạy với phiên bản code cũ.
    - key: q2_node_3
      prompt: 'Bước 3: Service Matchmaking bị nghẽn do hàng triệu request tìm xe dồn
        dập. Bạn giải quyết hạ tầng ra sao?'
      options:
      - key: q2_opt_3_a
        label: Bật tính năng Circuit Breaker để ngắt bớt request phụ và ưu tiên luồng
          đặt xe cơ bản.
      - key: q2_opt_3_b
        label: Tắt toàn bộ hệ thống Authentication để request đi thẳng vào Backend
          không cần kiểm tra token.
      - key: q2_opt_3_c
        label: Tăng số lượng Replicas của Dispatcher microservice từ 10 lên 100 Pods.
    - key: q2_node_4
      prompt: 'Bước 4: Phát hiện thuật toán tính giá đợt này nhân nhầm hệ số x10 làm
        giá cuốc xe lên 2,000,000 VND. Một số cuốc đã bị trừ tiền thẻ.'
      options:
      - key: q2_opt_4_a
        label: Ghi nhận danh sách trip_id tính sai giá và đẩy vào Queue xử lý hoàn
          tiền chênh lệch sau giờ cao điểm.
      - key: q2_opt_4_b
        label: Sửa giá trị tiền trong DB mà không lưu lịch sử thay đổi.
      - key: q2_opt_4_c
        label: Ghi đè trực tiếp API đối tác thanh toán Stripe/Paypal để Capture số
          tiền 2,000,000 VND của toàn bộ cuốc lỗi.
    - key: q2_node_5
      prompt: 'Bước 5: Tài xế đồng loạt tắt app đình công do bị trừ tiền phế sai.
        Bạn làm gì để ổn định lực lượng tài xế?'
      options:
      - key: q2_opt_5_a
        label: Đăng thông báo nội bộ trên app Driver giải thích sự cố và cam kết hoàn
          tiền trong 2 giờ.
      - key: q2_opt_5_b
        label: Tự động khóa tài khoản của các tài xế tắt app để ép họ bật lại.
      - key: q2_opt_5_c
        label: Tăng tiền thưởng chuyến lên 500% mà không thông qua phê duyệt của Giám
          đốc Vận hành.
    - key: q2_node_6
      prompt: 'Bước 6: Cấu hình Redis Cluster bị mất kết nối làm mất dữ liệu vị trí
        GPS của 20,000 tài xế.'
      options:
      - key: q2_opt_6_a
        label: Yêu cầu App Driver gửi lại vị trí GPS hiện tại thông qua luồng WebSocket
          fallback.
      - key: q2_opt_6_b
        label: Khởi động lại toàn bộ Node Redis Master mà không chờ đồng bộ Data từ
          Replica.
      - key: q2_opt_6_c
        label: Gán cố định tọa độ mặc định của tài xế về trung tâm thành phố.
    - key: q2_node_7
      prompt: 'Bước 7: Cần kiểm tra xem mã nguồn mới có dính lỗ hổng Memory Leak hay
        không.'
      options:
      - key: q2_opt_7_a
        label: Trích xuất Heap Dump trên môi trường Staging và phân tích bằng pprof/jprofiler.
      - key: q2_opt_7_b
        label: Chạy Profiler trực tiếp trên Production Server đang chịu tải nặng.
      - key: q2_opt_7_c
        label: Bỏ qua kiểm tra memory leak và để hệ thống tự auto-restart khi OOM.
    - key: q2_node_8
      prompt: 'Bước 8: Đội ngũ Dev đề xuất tung bản Hotfix 1.0.2 để sửa tận gốc lỗi
        tính giá.'
      options:
      - key: q2_opt_8_a
        label: Chạy bộ UnitTest và IntegrationTest trên CI/CD pipeline trước khi deploy
          Canary 5% traffic.
      - key: q2_opt_8_b
        label: Bỏ qua bước CI/CD, build image docker ở máy cá nhân rồi push thẳng
          lên Production Registry.
      - key: q2_opt_8_c
        label: Deploy đồng loạt 100% server ngay lập tức mà không thử nghiệm Canary.
    - key: q2_node_9
      prompt: 'Bước 9: Hệ thống đã chạy ổn định trở lại với bản Hotfix 1.0.2. Bạn
        xử lý các chuyến đi bị ảnh hưởng giá thế nào?'
      options:
      - key: q2_opt_9_a
        label: Chạy job tính toán lại giá chính xác cho từng trip bị lỗi và phát lệnh
          refund tiền thừa tự động qua API payment.
      - key: q2_opt_9_b
        label: Không xử lý gì thêm, đợi khách hàng nào tự khiếu nại thì mới hoàn tiền.
      - key: q2_opt_9_c
        label: Xóa sạch dữ liệu các cuốc xe lỗi khỏi Database để khách không tra cứu
          lại được.
    - key: q2_node_10
      prompt: 'Bước 10: Giờ cao điểm kết thúc. Đội ngũ kỹ thuật cần nghiệm thu sự
        cố khẩn cấp.'
      options:
      - key: q2_opt_10_a
        label: Tổng hợp log, số liệu thiệt hại, tổ chức họp rà soát quy trình Release
          và lưu tài liệu Post-mortem.
      - key: q2_opt_10_b
        label: Đổ lỗi cho bộ phận Hạ tầng Cloud và đóng ticket sự cố.
      - key: q2_opt_10_c
        label: Âm thầm sửa code trên repository mà không tạo Pull Request hay commit
          log.
