  difficulty: medium
- content:
    scenario: Hệ thống xử lý thanh toán ví điện tử bị nghẽn webhook và lệch đối soát
      với Ngân hàng VietBank trong đợt cao điểm sale cuối tháng. 5,000 giao dịch nạp
      tiền đang ở trạng thái PENDING.
    nodes:
    - key: q1_node_1
      prompt: 'Bước 1: Hệ thống cảnh báo lag webhook từ ngân hàng. Số lượng queue
        giao dịch chờ tăng đột biến. Bạn làm gì trước tiên?'
      options:
      - key: q1_opt_1_a
        label: Tra cứu Kibana log tìm request_id và kiểm tra latency kết nối giữa
          hệ thống với VietBank API.
      - key: q1_opt_1_b
        label: Khởi động lại ngay lập tức toàn bộ Cluster Pods của dịch vụ Payment
          Gateway.
      - key: q1_opt_1_c
        label: Gửi tin nhắn SMS Brandname thông báo xin lỗi kèm mã giảm giá cho toàn
          bộ 5,000 khách hàng đang PENDING.
    - key: q1_node_2
      prompt: 'Bước 2: Log hiển thị lỗi Timeout 504 từ phía đối tác. Hàng nghìn tin
        nhắn hỗ trợ đổ về. Bạn xử lý luồng nhận dữ liệu thế nào?'
      options:
      - key: q1_opt_2_a
        label: Bật Feature Flag chuyển tạm thời luồng webhook sang queue dự phòng
          RabbitMQ Dead Letter Exchange.
      - key: q1_opt_2_b
        label: Chạy lệnh SQL UPDATE table balance cộng tiền trực tiếp cho các account_id
          trong danh sách PENDING.
      - key: q1_opt_2_c
        label: Xóa toàn bộ cache Redis liên quan đến session người dùng để giảm tải
          hệ thống.
    - key: q1_node_3
      prompt: 'Bước 3: Cần xác minh số tiền thực tế ngân hàng đã trừ của khách hàng
        để đối soát. Bạn chọn phương án nào?'
      options:
      - key: q1_opt_3_a
        label: Yêu cầu bộ phận Vận hành kết xuất file Bank Statement định dạng CSV
          từ portal admin ngân hàng để so sánh.
      - key: q1_opt_3_b
        label: Viết script Python tự động crawl dữ liệu giao dịch từ API của ngân
          hàng mà không cần rate-limit.
      - key: q1_opt_3_c
        label: Gọi API đối tác thanh toán yêu cầu hoàn tiền khẩn cấp (Auto-Refund)
          toàn bộ 5,000 giao dịch chưa xác nhận.
    - key: q1_node_4
      prompt: 'Bước 4: Nhận thấy 1,200 giao dịch đã bị trừ tiền ngân hàng nhưng chưa
        được cộng ví. Bạn xử lý dữ liệu ra sao?'
      options:
      - key: q1_opt_4_a
        label: Viết script idempotent bù tiền, chạy trong DB Transaction có rollback
          và log audit đầy đủ.
      - key: q1_opt_4_b
        label: Chạy trực tiếp câu lệnh SQL UPDATE không có điều kiện WHERE trong bảng
          transactions.
      - key: q1_opt_4_c
        label: Tắt kiểm tra trùng lặp Idempotency-Key để khách hàng nạp lại lần 2
          nhanh hơn.
    - key: q1_node_5
      prompt: 'Bước 5: Database bắt đầu tăng CPU Utilization lên 95% do script bù
        tiền chạy song song với traffic thực tế.'
      options:
      - key: q1_opt_5_a
        label: Điều chỉnh giới hạn rate-limit của script, chia nhỏ batch size từ 1000
          xuống 50 record/lần.
      - key: q1_opt_5_b
        label: Kills tất cả các process MySQL đang chạy bao gồm cả giao dịch của khách
          hàng mới.
      - key: q1_opt_5_c
        label: Nâng cấp instance Database Read-Replica lên quy mô lớn hơn ngay trên
          AWS Console.
    - key: q1_node_6
      prompt: 'Bước 6: Có 50 giao dịch bị xử lý cộng tiền 2 lần (double-crediting)
        do race condition. Bạn khôi phục thế nào?'
      options:
      - key: q1_opt_6_a
        label: Khóa tạm thời tính năng rút tiền của 50 tài khoản này và gửi thông
          báo giải thích qua ứng dụng.
      - key: q1_opt_6_b
        label: Tự động trừ âm tiền ví của khách hàng mà không cần gửi thông báo hay
          lưu vết log.
      - key: q1_opt_6_c
        label: Bỏ qua 50 giao dịch này và ghi nhận vào chi phí rủi ro của công ty.
    - key: q1_node_7
      prompt: 'Bước 7: Ngân hàng thông báo đã ổn định kết nối webhook. Bạn muốn đồng
        bộ lại các webhook bị sót.'
      options:
      - key: q1_opt_7_a
        label: Kích hoạt cronjob replay webhook theo cơ chế Exponential Backoff có
          kèm chữ ký HMAC.
      - key: q1_opt_7_b
        label: Mở cổng nhận webhook công khai không cần verify Signature Header để
          tránh bị drop request.
      - key: q1_opt_7_c
