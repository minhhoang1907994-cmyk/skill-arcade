  difficulty: medium
- content:
    scenario: Hệ thống Thanh toán & Khuyến mãi (Payment & Promotion System) đang trong
      đợt cao điểm Flash Sale 11.11. Lượng truy cập tăng gấp 20 lần bình thường và
      xuất hiện một số sự cố gián đoạn giao dịch. Bạn cần vừa khắc phục sự cố vừa
      tiến hành kiểm thử các bản hotfix trên môi trường Production.
    nodes:
    - key: n1
      prompt: Phát hiện log lỗi HTTP status 500 phát sinh liên tục khi người dùng
        áp dụng mã giảm giá tại bước Checkout. Bạn sẽ làm gì đầu tiên?
      options:
      - key: opt_1_1
        label: Tra cứu log chi tiết trên Kibana bằng filter trace_id để xác định chính
          xác nguyên nhân.
      - key: opt_1_2
        label: Lập tức restart lại Payment Service trên toàn bộ 10 server Production.
      - key: opt_1_3
        label: Trực tiếp chạy lệnh SQL xoá bảng cache voucher trên database Production.
    - key: n2
      prompt: Log Kibana phản hồi lỗi gateway timeout từ cổng thanh toán đối tác bên
        thứ ba. Bạn xử lý bước tiếp theo như thế nào?
      options:
      - key: opt_2_1
        label: Thực hiện mock API response bằng môi trường Sandbox của cổng thanh
          toán để kiểm tra lỗi logic.
      - key: opt_2_2
        label: Gửi request trực tiếp tới API trigger_payout_real() của đối tác trên
          Prod để xem có hoàn tiền thật không.
      - key: opt_2_3
        label: Chuyển hướng IP kết nối sang server Staging để tái hiện lại lỗi.
    - key: n3
      prompt: Nhóm CSKH yêu cầu gửi thông tin cập nhật trạng thái hệ thống cho người
        dùng bị gián đoạn giao dịch.
      options:
      - key: opt_3_1
        label: Tạo bản nháp nội dung trong trang Admin Dashboard và gửi cho Lead CSKH
          phê duyệt.
      - key: opt_3_2
        label: Bấm nút Broadcast Push Notification thật nội dung 'Hệ thống bảo trì,
          tặng 100k' tới 500,000 user đang online.
      - key: opt_3_3
        label: Bắn email thử nghiệm tới duy nhất 1 địa chỉ email whitelist thuộc sở
          hữu của QA.
    - key: n4
      prompt: Database Prod phát sinh hiện tượng nghẽn bảng transactions do Row Lock
        Contention.
      options:
      - key: opt_4_1
        label: Xác định ID của transaction đang treo và kill process ID đó sau khi
          verify với DBA.
      - key: opt_4_2
        label: Thực hiện ALTER TABLE transactions DROP INDEX idx_user_id trực tiếp
          trên DB Master Prod.
      - key: opt_4_3
        label: Kiểm tra Slow Query log và kiểm tra hiệu năng trên Read-Replica trước
          khi can thiệp.
    - key: n5
      prompt: Khách hàng phản hồi không nhận được SMS OTP xác thực đăng nhập. Bạn
        kiểm tra dịch vụ SMS thế nào?
      options:
      - key: opt_5_1
        label: Cập nhật cấu hình runtime đổi ưu tiên sang nhà mạng dự phòng trong
          config center.
      - key: opt_5_2
        label: Chạy script gửi lại SMS OTP hàng loạt (Resend OTP Broadcast) tới toàn
          bộ danh sách khách hàng đang chờ.
      - key: opt_5_3
        label: Truy cập Dashboard của Provider SMS để xem số dư tài khoản và trạng
          thái kết nối API.
    - key: n6
      prompt: Cần kiểm tra tính năng phát hành mã voucher giảm giá 50% mới hotfix
        xong trên Prod.
      options:
      - key: opt_6_1
        label: Tạo mã voucher giả lập trên môi trường database local để test logic
          áp mã.
      - key: opt_6_2
        label: Gọi API /api/v1/promotions/generate phát hành 1,000 voucher VIP thật
          trực tiếp vào ví người dùng trên Prod.
      - key: opt_6_3
        label: Mock response mã voucher bằng Charles Proxy trên thiết bị test cá nhân.
    - key: n7
      prompt: Dung lượng RAM của Redis Cluster trên Prod chạm ngưỡng cảnh báo 98%.
      options:
      - key: opt_7_1
        label: Chạy lệnh FLUSHALL dọn sạch toàn bộ cache dữ liệu trên Redis Production.
      - key: opt_7_2
        label: Thực hiện lệnh MEMORY PURGE và tăng tham số maxmemory trong cấu hình
          Redis.
      - key: opt_7_3
        label: Viết script SCAN tuần tự để xoá dần các key đã hết hạn mà không ảnh
          hưởng tới traffic.
    - key: n8
      prompt: Cần cập nhật cấu hình biến môi trường DATABASE_TIMEOUT cho các container
        Microservice.
      options:
      - key: opt_8_1
        label: Chỉnh sửa trực tiếp file .env trên server Production mà không tạo bản
          sao lưu.
      - key: opt_8_2
        label: Cập nhật thông qua CI/CD pipeline kèm theo kế hoạch rollback nếu deployment
          thất bại.
      - key: opt_8_3
        label: Thay đổi giá trị biến môi trường trong RAM của tiến trình bằng tool
          gdb.
    - key: n9
      prompt: Phát hiện Order Service có dấu hiệu rò rỉ bộ nhớ (Memory Leak) khi xử
        lý giỏ hàng.
      options:
      - key: opt_9_1
        label: Bật tính năng Heap Dump tự động khi RAM vượt 85% và điều hướng 20%
          traffic sang node dự phòng.
      - key: opt_9_2
        label: Tăng giới hạn RAM cho Pod bằng kubectl edit deployment trực tiếp trên
          cluster Prod mà không qua GitOps.
      - key: opt_9_3
        label: Giữ nguyên trạng thái và đợi qua đợt Flash sale rồi mới tiến hành kiểm
          tra lại.
    - key: n10
      prompt: Hoàn tất đợt kiểm thử hotfix. Bạn cần tổng hợp báo cáo và dọn dẹp hệ
        thống.
      options:
      - key: opt_10_1
        label: Trích xuất log tổng hợp ra file CSV và gửi báo cáo đánh giá rủi ro
          cho Lead.
      - key: opt_10_2
        label: Chạy script truncate toàn bộ các bảng audit log trên Prod để tiết kiệm
          dung lượng đĩa cứng.
      - key: opt_10_3
        label: Tắt toàn bộ hệ thống cảnh báo Monitoring Alerts trong 24 giờ tới để
          tránh bị làm phiền.
