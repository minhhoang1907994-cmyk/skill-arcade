  difficulty: hard
- content:
    scenario: Hệ thống E-Commerce Checkout đang trong đợt Sale Black Friday với lượng
      traffic 50,000 req/min. Cổng thanh toán chính gặp lỗi timeout liên tục. Bạn
      là Lead Engineer đang trực ca PROD và phải thực hiện hotfix khẩn cấp.
    nodes:
    - key: q1_node_1
      prompt: 'Bước 1: Cần bổ sung cột retry_count vào bảng orders để xử lý retry
        giao dịch thất bại. Bạn thực hiện migration như thế nào?'
      options:
      - key: q1_n1_opt1
        label: Chạy 'ALTER TABLE orders ADD COLUMN retry_count INT;' trực tiếp trên
          DB Master.
      - key: q1_n1_opt2
        label: Sử dụng 'ALTER TABLE orders ADD COLUMN retry_count INT, ALGORITHM=INPLACE,
          LOCK=NONE;'.
      - key: q1_n1_opt3
        label: Tạo bảng tạm orders_new, sync dữ liệu rồi đổi tên bảng.
    - key: q1_node_2
      prompt: 'Bước 2: Redis Cache đang chứa hàng trăm nghìn session thanh toán bị
        kẹt status PENDING. Bạn xử lý cache thế nào?'
      options:
      - key: q1_n2_opt1
        label: Chạy lệnh FLUSHALL trên cluster Redis để làm sạch toàn bộ.
      - key: q1_n2_opt2
        label: Viết script quét và xóa có chọn lọc các key dạng 'checkout:session:*'.
      - key: q1_n2_opt3
        label: Khởi động lại service Redis để giải phóng bộ nhớ RAM.
    - key: q1_node_3
      prompt: 'Bước 3: Cần kiểm tra kết nối tới cổng thanh toán dự phòng (Gateway
        B) trên môi trường PROD trước khi chuyển traffic.'
      options:
      - key: q1_n3_opt1
        label: Gọi API /v1/refund/batch thật của Gateway B với order_id ngẫu nhiên
          để thử nghiệm.
      - key: q1_n3_opt2
        label: Gửi request healthcheck mock qua endpoint Sandbox/Dry-run của Gateway
          B.
      - key: q1_n3_opt3
        label: Bỏ qua bước test, chuyển thẳng 100% traffic sang Gateway B.
    - key: q1_node_4
      prompt: 'Bước 4: Bật Feature Flag ''ENABLE_GATEWAY_B'' để kích hoạt cổng thanh
        toán mới.'
      options:
      - key: q1_n4_opt1
        label: Bật flag cho 100% người dùng trên Config Server cùng một lúc.
      - key: q1_n4_opt2
        label: 'Cấu hình Canary Release: Bật flag cho 5% traffic nội bộ/whitelist
          trước.'
      - key: q1_n4_opt3
        label: Sửa giá trị flag trực tiếp trong cơ sở dữ liệu PROD mà không qua Config
          Server.
    - key: q1_node_5
      prompt: 'Bước 5: Queue worker xử lý thanh toán bị nghẽn (100,000 jobs backlog).
        Bạn điều chỉnh scale worker ra sao?'
      options:
      - key: q1_n5_opt1
        label: Scale số lượng Pod worker từ 5 lên 50 lập tức mà không kiểm tra DB
          Connection Pool.
      - key: q1_n5_opt2
        label: Nâng max_connections của DB trước, sau đó scale worker dần dần lên
          20 pods.
      - key: q1_n5_opt3
        label: Xoá sạch Queue backlog để worker không bị quá tải.
    - key: q1_node_6
      prompt: 'Bước 6: Khách hàng khiếu nại không nhận được voucher giảm giá do lỗi
        checkout. Bạn chạy batch job đền bù voucher.'
      options:
      - key: q1_n6_opt1
        label: Thực thi script tặng ngay $50 Voucher thật vào ví của 500k active users
          trên PROD DB.
      - key: q1_n6_opt2
        label: Dry-run script trên Staging DB snapshot để đối soát danh sách user
          bị ảnh hưởng trước.
      - key: q1_n6_opt3
        label: Chạy script tặng voucher trên PROD với câu lệnh query chưa có clause
          WHERE.
    - key: q1_node_7
      prompt: 'Bước 7: Cần xem thông tin log chi tiết của Checkout Service để điều
        tra ngoại lệ NullPointerException.'
      options:
      - key: q1_n7_opt1
        label: Đổi Log Level toàn bộ microservices sang TRACE trên hệ thống Centralized
          Logging.
      - key: q1_n7_opt2
        label: Bật DEBUG mode ngắn hạn (15 phút) riêng cho class 'com.company.checkout.PaymentProcessor'.
      - key: q1_n7_opt3
        label: Tắt hẳn việc ghi log ra disk để tối ưu hiệu năng I/O cho server.
    - key: q1_node_8
      prompt: 'Bước 8: Xử lý các Webhook thông báo kết quả thanh toán từ Gateway gửi
        về bị lỗi 500.'
      options:
      - key: q1_n8_opt1
        label: Tắt xác thực HMAC Signature trên Receiver Endpoint để cho phép mọi
          payload đi qua.
      - key: q1_n8_opt2
        label: Giữ nguyên Signature Verification, đẩy toàn bộ Webhook lỗi vào Dead
          Letter Queue (DLQ).
      - key: q1_n8_opt3
        label: Xóa toàn bộ các Webhook payload bị lỗi 500 đang chờ trong bộ nhớ tạm.
    - key: q1_node_9
      prompt: 'Bước 9: Hệ thống Nginx Reverse Proxy báo động CPU 98% do bot cào dữ
        liệu trong lúc sự cố.'
      options:
      - key: q1_n9_opt1
        label: Tắt hẳn module Rate Limiter trên Nginx để giảm tải việc kiểm tra IP.
      - key: q1_n9_opt2
        label: Bật Cloudflare Under Attack Mode và siết chặt Rate Limit đối với các
          endpoint công khai.
      - key: q1_n9_opt3
        label: Block toàn bộ dải IP truy cập từ quốc tế bằng iptables.
    - key: q1_node_10
      prompt: 'Bước 10: Sự cố cơ bản được kiểm soát. Ban giám đốc yêu cầu đưa ra thông
        báo cuối cùng tới người dùng.'
      options:
      - key: q1_n10_opt1
        label: 'Broadcast Push Notification thật qua FCM tới 2 triệu app users: ''Hệ
          thống test lỗi đã xong''.'
      - key: q1_n10_opt2
        label: Cập nhật status page chính thức và đăng banner thông báo ngắn gọn trên
          CMS.
      - key: q1_n10_opt3
        label: Âm thầm đóng ticket sự cố, không thực hiện bất kỳ thông báo nào.
  answer_key:
    option_effects:
      q1_n1_opt1:
        points: 3
        irreversible: false
        consequence_text: 'Báo cáo sự cố: DDL Lock bảng ''orders'' trong 45 giây khiến
          12,000 giao dịch mua hàng bị timeout. Tuy nhiên DB không bị mất dữ liệu.'
        next_node: q1_node_2
      q1_n1_opt2:
        points: 10
        irreversible: false
        consequence_text: 'Thao tác an toàn: Thêm cột thành công mà không gây khóa
          bảng. Hệ thống tiếp tục vận hành ổn định.'
        next_node: q1_node_2
      q1_n1_opt3:
        points: 3
        irreversible: false
        consequence_text: 'Báo cáo sự cố: Mất đồng bộ dữ liệu phát sinh trong thời
          gian swap bảng, phải chạy script bù data sau đó.'
        next_node: q1_node_2
      q1_n2_opt1:
        points: 3
        irreversible: false
        consequence_text: 'Báo cáo sự cố: FLUSHALL làm xóa sạch giỏ hàng và session
          của toàn bộ 500,000 user đang online. Traffic gián đoạn nghiêm trọng.'
        next_node: q1_node_3
      q1_n2_opt2:
        points: 10
        irreversible: false
        consequence_text: 'Thao tác an toàn: Xóa đúng các key bị lỗi mà không ảnh
          hưởng tới người dùng khác.'
        next_node: q1_node_3
      q1_n2_opt3:
        points: 3
        irreversible: false
        consequence_text: 'Báo cáo sự cố: Restart Redis gây ra Cache Stampede làm
          PostgreSQL DB gãy do quá tải query cùng lúc.'
        next_node: q1_node_3
      q1_n3_opt1:
        points: 0
        irreversible: true
        consequence_text: 'SỰ CỐ NGIÊM TRỌNG: Đã gọi API hoàn tiền thật trên Gateway
          B. Ngân hàng đã thực hiện trừ tiền tài khoản doanh nghiệp và chuyển tiền
          thật cho tài khoản thử nghiệm.'
        next_node: q1_node_4
      q1_n3_opt2:
        points: 10
        irreversible: false
        consequence_text: 'Thao tác an toàn: Kết nối thành công tới Sandbox của Gateway
          B, xác nhận API key và cấu hình hợp lệ.'
        next_node: q1_node_4
      q1_n3_opt3:
        points: 3
        irreversible: false
        consequence_text: 'Báo cáo sự cố: Gateway B bị sai thông tin Secret Key dẫn
          đến 100% giao dịch mới thất bại trong 5 phút.'
        next_node: q1_node_4
      q1_n4_opt1:
        points: 3
        irreversible: false
        consequence_text: 'Báo cáo sự cố: Lượng lớn request đổ dồn làm sập Gateway
          B do chưa kịp warm-up connection pool.'
        next_node: q1_node_5
      q1_n4_opt2:
        points: 10
        irreversible: false
        consequence_text: 'Thao tác an toàn: Phát hiện và xử lý được 2 lỗi nhỏ trên
          5% traffic trước khi nhân rộng.'
        next_node: q1_node_5
      q1_n4_opt3:
        points: 3
        irreversible: false
        consequence_text: 'Báo cáo sự cố: Config bị ghi đè lại sau 3 phút do cơ chế
          sync tự động của Config Server.'
        next_node: q1_node_5
      q1_n5_opt1:
