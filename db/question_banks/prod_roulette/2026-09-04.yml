  difficulty: hard
- content:
    scenario: Phát hiện sự cố dịch vụ đăng ký gia hạn tự động (Subscription Billing)
      tính sai số tiền thanh toán của 1,000 khách hàng trên môi trường Production
      do lỗi làm tròn số.
    nodes:
    - key: q2_node_1
      prompt: Xác định nguyên nhân tính sai tiền dịch vụ gia hạn. Bước đầu tiên bạn
        làm là gì?
      options:
      - key: q2_opt_1a
        label: Kiểm tra mã nguồn service subscription-billing và log thanh toán gần
          nhất
      - key: q2_opt_1b
        label: Tắt máy chủ DB chính ngay lập tức để ngăn các giao dịch tiếp theo
      - key: q2_opt_1c
        label: Đẩy ngay một bản hotfix đoán lỗi lên Production không qua kiểm thử
    - key: q2_node_2
      prompt: Cần tạm dừng tiến trình gia hạn tự động (Cronjob) đang chạy ngầm.
      options:
      - key: q2_opt_2a
        label: Disable job auto_renew_subscription trong Kubernetes CronJob
      - key: q2_opt_2b
        label: Chạy lệnh crontab -r để xóa sạch mọi cronjob trên server
      - key: q2_opt_2c
        label: Đổi password DB user của Billing Service để ứng dụng không kết nối
          được
    - key: q2_node_3
      prompt: Trích xuất danh sách các hóa đơn bị trừ thừa tiền trong ngày.
      options:
      - key: q2_opt_3a
        label: Chạy truy vấn SQL read-only lấy các hóa đơn có chênh lệch giá
      - key: q2_opt_3b
        label: Chạy script vừa đọc vừa UPDATE trạng thái trực tiếp trên DB Master
      - key: q2_opt_3c
        label: Export toàn bộ dữ liệu bảng users và invoices ra file CSV qua kết nối
          HTTP
    - key: q2_node_4
      prompt: Xử lý hoàn trả khoản tiền chênh lệch bị thu thừa cho 1,000 khách hàng.
      options:
      - key: q2_opt_4a
        label: Gọi API Refund chính thức của Ngân hàng/Stripe hoàn tiền thật về tài
          khoản
      - key: q2_opt_4b
        label: Cộng điểm thưởng Cashback vào tài khoản ví nội bộ ứng dụng
      - key: q2_opt_4c
        label: Đánh dấu is_refunded = true trong DB nhưng không xử lý giao dịch nào
    - key: q2_node_5
      prompt: Phát triển bản sửa lỗi (Hotfix) cho logic làm tròn tiền tệ.
      options:
      - key: q2_opt_5a
        label: Viết Unit Test kiểm thử hàm làm tròn, thực hiện Code Review và tạo
          PR
      - key: q2_opt_5b
        label: Dùng vim sửa code trực tiếp trong container Production đang chạy
      - key: q2_opt_5c
        label: Bỏ qua các bài test tự động, commit với flag --no-verify và push thẳng
          lên main
    - key: q2_node_6
      prompt: Triển khai (Deploy) bản Hotfix lên môi trường Production.
      options:
      - key: q2_opt_6a
        label: Thực hiện Rolling Update trên Kubernetes với Health Check đầy đủ
      - key: q2_opt_6b
        label: Xóa toàn bộ Pods hiện tại để ép Kubernetes tạo Pods mới cùng lúc
      - key: q2_opt_6c
        label: SSH vào từng node Production và chạy git pull && restart service
    - key: q2_node_7
      prompt: Thông báo sự cố và xin lỗi tới 1,000 khách hàng bị ảnh hưởng.
      options:
      - key: q2_opt_7a
        label: Gửi Push Notification/Email giải thích sự cố thật tới 1,000 khách hàng
      - key: q2_opt_7b
        label: Đăng thông báo xin lỗi chung trên mục Tin tức ứng dụng
      - key: q2_opt_7c
        label: Gửi Email kiểm thử tới danh sách email nội bộ công ty để duyệt trước
    - key: q2_node_8
      prompt: Kích hoạt lại tiến trình Cronjob tự động gia hạn Subscription.
      options:
      - key: q2_opt_8a
        label: Chạy thử nghiệm Dry-run trên Staging trước khi bật lại CronJob trên
          Production
      - key: q2_opt_8b
        label: Bật CronJob trên Production và theo dõi Real-time Dashboard trong 1
          giờ
      - key: q2_opt_8c
        label: Bật lại CronJob và kết thúc công việc không cần theo dõi tiếp
    - key: q2_node_9
      prompt: Kiểm tra hệ thống sau khi đã xử lý xong sự cố (Post-verification).
      options:
      - key: q2_opt_9a
        label: 'Theo dõi các chỉ số Grafana: CPU, Memory, DB Query Time và Invoice
          Logs'
      - key: q2_opt_9b
        label: Thực hiện 1 giao dịch gia hạn thật bằng tài khoản cá nhân và đối soát
      - key: q2_opt_9c
        label: Xóa log sự cố trong ngày để tiết kiệm dung lượng ổ đĩa server
    - key: q2_node_10
      prompt: Hoàn tất quy trình xử lý sự cố thanh toán.
      options:
      - key: q2_opt_10a
        label: Tổ chức họp Post-Mortem phân tích Root Cause và đưa ra kế hoạch phòng
          ngừa
      - key: q2_opt_10b
        label: Tìm lập trình viên viết đoạn code lỗi và yêu cầu chịu trách nhiệm cá
          nhân
      - key: q2_opt_10c
        label: Bỏ qua báo cáo Post-Mortem vì sự cố đã giải quyết xong
