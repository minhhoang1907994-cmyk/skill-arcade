    nodes:
    - key: q1_n1
      prompt: Webhook từ phía ngân hàng phản hồi trễ khiến giao dịch nạp tiền bị treo
        ở trạng thái PENDING. Bạn cần kiểm tra nguyên nhân gốc rễ.
      options:
      - key: q1_opt1
        label: Kiểm tra tỉ lệ lỗi, độ trễ API trên AWS CloudWatch và trace ID trên
          Jaeger.
      - key: q1_opt2
        label: Tắt kiểm tra Token xác thực (API Key Validation) của Webhook để nhận
          dữ liệu nhanh hơn.
      - key: q1_opt3
        label: Tự động gọi lại API retry nạp tiền của đối tác ngân hàng bằng script
          với tham số mặc định.
    - key: q1_n2
      prompt: Database Primary rơi vào trạng thái CPU utilization 99% do đợt truy
        vấn dồn dập và bị Deadlock.
      options:
      - key: q1_opt4
        label: Tra cứu PID gây nghẽn bằng pg_blocking_pids() và terminate duy nhất
          session bị khoá.
      - key: q1_opt5
        label: Khởi động lại (Restart) toàn bộ Database Cluster ngay lập tức.
      - key: q1_opt6
        label: Thực hiện TRUNCATE bảng tạm transaction_locks để xả lock.
    - key: q1_n3
      prompt: Cần đồng bộ số dư cho 1,000 tài khoản người dùng bị gián đoạn giao dịch
        nạp tiền.
      options:
      - key: q1_opt7
        label: Viết script reconcile chạy theo batch 50 records, so sánh log journal_entries
          trước khi update DB.
      - key: q1_opt8
        label: Chạy câu lệnh UPDATE balance trực tiếp trên Production không qua kiểm
          tra đối soát.
      - key: q1_opt9
        label: Bắn trực tiếp request cộng tiền thật vào Core Banking API của đối tác
          cho toàn bộ 1,000 user.
    - key: q1_n4
      prompt: Bộ nhớ Caching Redis bị báo động Out of Memory (OOM), dẫn đến rớt kết
        nối dịch vụ.
      options:
      - key: q1_opt10
        label: Điều chỉnh maxmemory-policy thành allkeys-lru và tiến hành scale up
          tài nguyên Redis node.
      - key: q1_opt11
        label: Chạy lệnh FLUSHALL xoá sạch dữ liệu cache trên Redis Production.
      - key: q1_opt12
        label: Chuyển thẳng 100% traffic đọc sang SQL Database chính.
    - key: q1_n5
      prompt: Người dùng liên tục phản ánh chưa nhận được biến động số dư. Cần xử
        lý về mặt truyền thông.
      options:
      - key: q1_opt13
        label: Cập nhật trạng thái bảo trì kênh nạp tiền trên Status Page công khai
          của ứng dụng.
      - key: q1_opt14
        label: Bắn Push Notification hàng loạt với nội dung 'Đã hoàn tiền thành công'
          cho 50,000 user trên ứng dụng.
      - key: q1_opt15
        label: Xuất file CSV danh sách giao dịch lỗi và chuyển sang cho bộ phận CSKH
          xử lý riêng lẻ.
    - key: q1_n6
      prompt: Service payment-worker trên Kubernetes cluster rơi vào trạng thái CrashLoopBackOff.
      options:
      - key: q1_opt16
        label: Sử dụng kubectl logs --previous để kiểm tra nguyên nhân OutOfMemoryKill
          hoặc Unhandled Exception.
      - key: q1_opt17
        label: Thực hiện rollback Deployment về image version ổn định trước đó.
      - key: q1_opt18
        label: Thực hiện kubectl delete pod --force --grace-period=0 liên tục cho
          đến khi Pod chạy lại.
    - key: q1_n7
      prompt: Phát hiện lỗi logic trong tính năng quy đổi điểm thưởng Loyalty khiến
        người dùng được x2 điểm.
      options:
      - key: q1_opt19
        label: Tắt Feature Flag enable_loyalty_conversion để tạm dừng tính năng quy
          đổi.
      - key: q1_opt20
        label: Xoá hoàn toàn dữ liệu trong bảng loyalty_points trên DB Production
          mà không lưu backup.
      - key: q1_opt21
        label: Sửa mã nguồn trực tiếp trên Pod Production thông qua kubectl exec.
    - key: q1_n8
      prompt: Bộ phận Kinh doanh yêu cầu tặng Voucher 100k cho khách hàng bị ảnh hưởng
        bởi đợt lỗi.
      options:
      - key: q1_opt22
        label: Xuất danh sách ID bị ảnh hưởng, gửi cho bộ phận Marketing kiểm duyệt
          trước khi chạy job gán Voucher.
      - key: q1_opt23
        label: Chạy script tự động phát hành và gán trực tiếp mã Voucher giảm giá
          100k thật vào ví của 5,000 user.
      - key: q1_opt24
        label: Tạo mã Promotion trên môi trường Staging để thử nghiệm luồng phát hành.
    - key: q1_n9
      prompt: API Gateway có hiện tượng bị tấn công từ chối dịch vụ (DDoS) hoặc spike
        traffic bất thường.
      options:
      - key: q1_opt25
        label: Kích hoạt Cloudflare Rate Limiting và áp dụng WAF rule chặn IP bất
          thường.
      - key: q1_opt26
        label: 'Mở cấu hình CORS Access-Control-Allow-Origin: * để bỏ qua các lỗi
          chặn request.'
      - key: q1_opt27
        label: Tắt Middleware xác thực JWT Tokens để giảm tải việc xử lý cho CPU.
    - key: q1_n10
      prompt: Sự cố đã được kiểm soát. Bạn cần thực hiện các bước tổng kết theo quy
        trình vận hành.
      options:
      - key: q1_opt28
        label: Viết báo cáo Post-mortem phân tích Root Cause, đề xuất Action Items
          và cập nhật Runbook.
      - key: q1_opt29
        label: Xoá toàn bộ log trên ELK Stack của ngày hôm đó để tiết kiệm không gian
          lưu trữ.
      - key: q1_opt30
        label: Đóng Ticket sự cố và không cần thực hiện cập nhật gì thêm.
