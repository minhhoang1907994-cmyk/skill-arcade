  difficulty: hard
- content:
    scenario: Sự cố nghẽn đơn hàng và sai lệch kho hàng trong chiến dịch Flash Sale
      11/11 trên hệ thống Sàn thương mại điện tử Omnichannel.
    nodes:
    - key: q2_n1
      prompt: Hệ thống báo âm tồn kho sản phẩm Hot Sale trên Website nhưng tại kho
        vật lý vẫn còn hàng. Bạn phải xử lý sao?
      options:
      - key: q2_opt1
        label: So sánh dữ liệu kho giữa DB E-commerce và ERP WMS bằng query Read-Only.
      - key: q2_opt2
        label: Sửa trực tiếp cột stock_quantity = 9999 trong DB Production để tiếp
          tục mở bán.
      - key: q2_opt3
        label: Chạy job gửi ngay lệnh nhập kho thật lên hệ thống ERP của đối tác quản
          lý kho bên thứ ba.
    - key: q2_opt4
      prompt: Bảng orders trong MySQL bị khóa do một Transaction xử lý thanh toán
        kéo dài không Commit.
      options:
      - key: q2_opt4_1
        label: Dùng SHOW FULL PROCESSLIST tìm thread ID treo và thực thi lệnh KILL
          thread_id.
      - key: q2_opt4_2
        label: Chạy lệnh ALTER TABLE orders ENGINE=InnoDB ngay trong lúc peak traffic.
      - key: q2_opt4_3
        label: Chạy mysqldump toàn bộ database orders để chuẩn bị dựng instance mới.
    - key: q2_n3
      prompt: Cổng thanh toán phản hồi chậm khiến 2,000 đơn hàng dồn đống ở trạng
        thái PROCESSING.
      options:
      - key: q2_opt7
        label: Đổi cấu hình Routing Rule sang Cổng thanh toán B dự phòng cho các đơn
          hàng mới.
      - key: q2_opt8
        label: Cập nhật hàng loạt tất cả đơn nghẽn sang trạng thái PAID mà bỏ qua
          Webhook xác nhận.
      - key: q2_opt9
        label: Kích hoạt script tự động gọi API Refund thật của cổng thanh toán cho
          toàn bộ 2,000 đơn hàng.
    - key: q2_n4
      prompt: Hàng đợi Message Queue (RabbitMQ) thông báo đơn hàng bị đầy bộ nhớ đệm
        và chạm ngưỡng Disk Free Limit.
      options:
      - key: q2_opt10
        label: Bổ sung tài nguyên đĩa cứng và tăng số lượng Pod Consumer xử lý hàng
          đợi.
      - key: q2_opt11
        label: Thực hiện Purge Queue order_notifications để giải phóng ngay đĩa cứng.
      - key: q2_opt12
        label: Dùng lệnh rm -rf /var/log/rabbitmq/* trên server Production.
    - key: q2_n5
      prompt: Người dùng không nhận được tin nhắn SMS OTP để xác nhận thanh toán đơn
        hàng.
      options:
      - key: q2_opt13
        label: Chuyển sang nhà cung cấp SMS Brandname thứ 2 trên cấu hình API Gateway.
      - key: q2_opt14
        label: Chạy script retry tự động gửi lại SMS OTP thật tới tất cả SĐT khách
          hàng đang chờ.
      - key: q2_opt15
        label: Tắt hoàn toàn yêu cầu xác thực OTP trên Production cho mọi đơn hàng.
    - key: q2_n6
      prompt: Bảng order_items thiếu Index làm truy vấn tìm kiếm chi tiết đơn hàng
        mất hơn 12 giây.
      options:
      - key: q2_opt16
        label: Chạy lệnh CREATE INDEX CONCURRENTLY idx_order_id ON order_items(order_id).
      - key: q2_opt17
        label: Chạy lệnh CREATE INDEX thông thường trực tiếp giữa lúc cao điểm.
      - key: q2_opt18
        label: DROP bảng tạm order_items_archive không qua kiểm tra.
    - key: q2_n7
      prompt: Phát hiện 100 đơn hàng bị tính lặp lại tiền phí vận chuyển Shipping
        Fee do lỗi tính toán.
      options:
      - key: q2_opt19
        label: Ghi nhận danh sách ID, lập ticket chuyển bộ phận CSKH đối soát hoàn
          tiền thừa qua ví.
      - key: q2_opt20
        label: Sửa câu lệnh UPDATE shipping_fee = 0 trực tiếp trong Database mà không
          ghi log audit.
      - key: q2_opt21
        label: Thực thi API chuyển tiền tự động từ tài khoản ngân hàng thật của công
          ty trả cho 100 khách hàng.
    - key: q2_n8
      prompt: Mạng phân phối nội dung (CDN) bị cache nhầm trang Checkout chứa thông
        tin cá nhân của người dùng.
      options:
      - key: q2_opt22
        label: Thực hiện Purge Cache URL bị ảnh hưởng và vô hiệu hóa Caching cho dynamic
          path /checkout.
      - key: q2_opt23
        label: Restart server Nginx Reverse Proxy.
      - key: q2_opt24
        label: Xoá SSL Certificate trên Load Balancer để ngăn truy cập tạm thời.
    - key: q2_n9
      prompt: Phát hiện một mã Voucher giảm giá 90% bị rò rỉ công khai trên mạng xã
        hội.
      options:
      - key: q2_opt25
        label: Tắt trạng thái kích hoạt của mã Voucher trên trang Admin Dashboard
          (is_active = false).
      - key: q2_opt26
        label: Dùng lệnh DELETE FROM promotions WHERE code='GIAM90' trực tiếp trên
          DB.
      - key: q2_opt27
        label: Bật job hủy hàng loạt đơn hàng đã dùng mã này và gửi SMS hủy đơn thật
          tới khách hàng.
    - key: q2_n10
      prompt: Kết thúc đợt Flash Sale. Bạn cần dọn dẹp hệ thống và bàn giao trạng
        thái.
      options:
      - key: q2_opt28
        label: Chạy job backup DB snapshot, lưu vết audit log và tổ chức họp tổng
          kết sự cố.
      - key: q2_opt29
        label: Xóa toàn bộ các bảng tmp_order_logs trực tiếp trên Production DB không
          qua lưu trữ.
      - key: q2_opt30
        label: Giảm quy mô Kubernetes Pods về 1 Instance ngay lập tức mà không đợi
          Drain connection.
