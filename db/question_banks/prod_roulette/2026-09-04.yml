- content:
    scenario: Bạn là Backend Dev phụ trách dự án nâng cấp hệ thống Định danh khách
      hàng (KYC) của Ví Điện Tử với 15 triệu user. Cần đồng bộ dữ liệu hồ sơ mới và
      cấu hình lại tích hợp API với bên thứ ba.
    nodes:
    - key: q2_node_1
      prompt: 'Bước 1: Bảng `kyc_requests` chứa 20 triệu bản ghi chưa có index cho
        cột `national_id`. Bạn tạo index như thế nào?'
      options:
      - key: q2_n1_opt1
        label: Chạy câu lệnh 'CREATE INDEX idx_national_id ON kyc_requests(national_id);'
          trên DB Master.
      - key: q2_n1_opt2
        label: Sử dụng 'CREATE INDEX CONCURRENTLY idx_national_id ON kyc_requests(national_id);'.
      - key: q2_n1_opt3
        label: Không tạo index trên Master, chỉ tạo trên Read Replica.
    - key: q2_node_2
      prompt: 'Bước 2: Dọn dẹp dữ liệu lưu tạm trong bảng `kyc_docs_temp` để giải
        phóng dung lượng ổ đĩa.'
      options:
      - key: q2_n2_opt1
        label: Chạy lệnh 'TRUNCATE TABLE kyc_docs_temp;' mà không cần kiểm tra phụ
          thuộc.
      - key: q2_n2_opt2
        label: Tạo DB Snapshot trước, sau đó xoá theo đợt bằng lệnh 'DELETE FROM ...
          LIMIT 5000'.
      - key: q2_n2_opt3
        label: Drop toàn bộ bảng 'kyc_docs_temp' và tạo lại sau.
    - key: q2_node_3
      prompt: 'Bước 3: Tích hợp API xác thực căn cước công dân với bên đối tác Cổng
        Dữ Liệu Quốc Gia.'
      options:
      - key: q2_n3_opt1
        label: Gọi API /v2/national-id/verify thật bằng danh sách 1,000 CMND/CCCD
          thật để test tính đúng đắn.
      - key: q2_n3_opt2
        label: Sử dụng tài khoản Sandbox và danh sách dữ liệu test do đối tác cung
          cấp.
      - key: q2_n3_opt3
        label: Bỏ qua bước gọi API đối tác, auto approve 100% hồ sơ để lấy tiến độ.
    - key: q2_node_4
      prompt: 'Bước 4: Cập nhật Secret Key kết nối tới Service Vault chứa mã hóa thông
        tin cá nhân (PII).'
      options:
      - key: q2_n4_opt1
        label: Đổi key trên Vault lập tức và restart lại toàn bộ Kubernetes Pods cùng
          lúc.
      - key: q2_n4_opt2
        label: Cấu hình Dual-key (chấp nhận cả key cũ và mới), tiến hành Rolling Update
          từng Pod.
      - key: q2_n4_opt3
        label: Ghi cứng (Hardcode) Secret Key mới vào file appsettings.json trên Git.
    - key: q2_node_5
      prompt: 'Bước 5: Gửi Email thông báo cập nhật điều khoản KYC mới cho người dùng.'
      options:
      - key: q2_n5_opt1
        label: Kích hoạt Batch Job gửi Email thật tới 50,000 người dùng trong môi
          trường PROD.
      - key: q2_n5_opt2
        label: Kiểm tra template Email bằng công cụ Mailtrap/Staging trước khi duyệt
          Queue.
      - key: q2_n5_opt3
        label: Gửi thử email tới danh sách email cá nhân của nhân viên công ty nhưng
          dùng Prod Server.
    - key: q2_node_6
      prompt: 'Bước 6: Cần Reindex lại cơ sở dữ liệu tìm kiếm Elasticsearch cho 15
        triệu hồ sơ KYC.'
      options:
      - key: q2_n6_opt1
        label: Xoá Index hiện tại và chạy Reindex trực tiếp trên Elasticsearch cluster
          PROD.
      - key: q2_n6_opt2
        label: Tạo Index mới 'kyc_v2', sync ngầm dữ liệu rồi trỏ Alias từ cũ sang
          mới.
      - key: q2_n6_opt3
        label: Dừng Cluster Elasticsearch trong 2 tiếng để tiến hành Reindex offline.
    - key: q2_node_7
      prompt: 'Bước 7: Cấu hình truy cập S3 Bucket lưu trữ ảnh chụp CMND/CCCD của
        khách hàng.'
      options:
      - key: q2_n7_opt1
        label: Chuyển S3 Bucket Policy sang 'Public Read' để fix lỗi Frontend không
          hiển thị được ảnh.
      - key: q2_n7_opt2
        label: Sử dụng Presigned URL với thời hạn hết hạn ngắn (15 phút) để FE truy
          cập ảnh.
      - key: q2_n7_opt3
        label: Tắt mã hóa Server-Side Encryption (SSE) trên S3 để tăng tốc độ ghi
          file.
    - key: q2_node_8
      prompt: 'Bước 8: Cần nhắn tin SMS Brandname yêu cầu bổ sung giấy tờ KYC bị mờ.'
      options:
      - key: q2_n8_opt1
        label: Chạy lệnh bắn SMS thật tới 10,000 số điện thoại thật do filter nhầm
          status='APPROVED'.
      - key: q2_n8_opt2
        label: Rà soát kỹ câu lệnh SQL filter 'status=REJECTED', verify lại với BA
          trước khi trigger.
      - key: q2_n8_opt3
        label: Gửi SMS thông qua cổng Gateway thử nghiệm nhưng truyền danh sách SĐT
          người dùng thật.
    - key: q2_node_9
      prompt: 'Bước 9: Hệ thống cảnh báo Grafana bắn liên tục alert Latency > 1 giây
        do tiến trình sync data.'
      options:
      - key: q2_n9_opt1
        label: Silence toàn bộ Alert trên PagerDuty trong vòng 8 tiếng để tập trung
          làm việc.
      - key: q2_n9_opt2
        label: Nâng ngưỡng Alert Latency lên 3s tạm thời trong cửa sổ bảo trì và thông
          báo NOC Team.
      - key: q2_n9_opt3
        label: Xóa cấu hình Alert Rule trên Prometheus để ngắt tiếng chuông cảnh báo.
    - key: q2_node_10
      prompt: 'Bước 10: Đồng bộ dữ liệu KYC hoàn tất sang hệ thống Core Banking.'
      options:
      - key: q2_n10_opt1
        label: Thực hiện query UPDATE trực tiếp vào bảng Customer của Core Banking
          Database.
      - key: q2_n10_opt2
        label: Gửi dữ liệu qua gRPC API của Core Banking có tích hợp Idempotency Key.
      - key: q2_n10_opt3
        label: Xuất dữ liệu ra file CSV rồi gửi qua Email cho bộ phận Vận hành import
          thủ công.
