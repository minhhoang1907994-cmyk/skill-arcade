  difficulty: medium
- content:
    scenario: Hệ thống Ví điện tử PayQuick - Kiểm thử và khắc phục lỗi đồng bộ giao
      dịch ngân hàng trực tiếp trên môi trường PRODUCTION trong giờ cao điểm.
    nodes:
    - key: q1_n1
      prompt: Phát hiện 500 giao dịch pending từ Ngân hàng VietBank trên Prod. Bước
        đầu tiên bạn làm gì?
      options:
      - key: q1_n1_o1
        label: Tắt cronjob auto-reconcile, bật log DEBUG trên service để theo dõi
          luồng xử lý.
      - key: q1_n1_o2
        label: Chạy lại script reconcile thủ công ngay lập tức trên PROD DB.
      - key: q1_n1_o3
        label: Tự động gọi API Hoàn tiền (Refund) hàng loạt của Ngân hàng cho 500
          giao dịch pending mà chưa kiểm tra đối soát.
    - key: q1_n2
      prompt: Kiểm tra log phát hiện API webhook từ Ngân hàng trả về HTTP 500. Bạn
        xử lý thế nào?
      options:
      - key: q1_n2_o1
        label: Kiểm tra file config API Gateway và timeout settings trên Staging trước
          khi apply lên Prod.
      - key: q1_n2_o2
        label: Tăng timeout API Gateway trên Prod từ 5s lên 60s và restart service
          ngay lập tức.
      - key: q1_n2_o3
        label: Bỏ qua bước verify signature webhook để request xử lý nhanh hơn.
    - key: q1_n3
      prompt: Cần cập nhật trạng thái các giao dịch bị kẹt trong bảng `bank_transactions`.
        Thao tác SQL nào được chọn?
      options:
      - key: q1_n3_o1
        label: Viết SQL UPDATE có mệnh đề WHERE transaction_id IN (...) nằm trong
          BEGIN TRANSACTION và kiểm tra kỹ.
      - key: q1_n3_o2
        label: Chạy câu lệnh UPDATE bank_transactions SET status = 'SUCCESS' nhưng
          quên mất mệnh đề WHERE.
      - key: q1_n3_o3
        label: Truncate bảng bank_transactions tạm thời để nạp lại dữ liệu từ file
          CSV của Ngân hàng.
    - key: q1_n4
      prompt: Khách hàng liên tục gọi tổng đài báo không nhận được tiền. Bạn phát
        thông báo như thế nào?
      options:
      - key: q1_n4_o1
        label: Đăng banner thông báo gián đoạn dịch vụ VietBank trên ứng dụng di động.
      - key: q1_n4_o2
        label: Gửi Push Notification khẩn cấp với nội dung 'Hệ thống lỗi nặng, xin
          đừng nạp tiền' tới toàn bộ 1 triệu user.
      - key: q1_n4_o3
        label: Tắt tạm thời kênh nạp tiền VietBank trong Admin Portal để tránh phát
          sinh giao dịch mới.
    - key: q1_n5
      prompt: Cần kiểm tra API tích hợp cổng thanh toán bên thứ ba (Partner Pay).
        Bạn test ra sao?
      options:
      - key: q1_n5_o1
        label: Dùng tài khoản Sandbox/Test credentials để gửi request kiểm tra.
      - key: q1_n5_o2
        label: Dùng Prod credentials nhưng gửi giao dịch 1,000 VND từ thẻ cá nhân.
      - key: q1_n5_o3
        label: Bắn 10,000 request tự động chứa dữ liệu rác vào API Prod của đối tác
          để load test.
    - key: q1_n6
      prompt: Server Prod báo CPU spike 98% do kẹt Connection Pool. Bạn xử lý thế
        nào?
      options:
      - key: q1_n6_o1
        label: Scale-out thêm 3 instance Docker container mới thông qua Kubernetes
          cluster.
      - key: q1_n6_o2
        label: Kill trực tiếp các process Postgres kẹt bằng lệnh kill -9 trên DB master.
      - key: q1_n6_o3
        label: Restart toàn bộ cơ sở dữ liệu Postgres Master mà không chuyển traffic
          sang Slave.
    - key: q1_n7
      prompt: Cần gửi email xin lỗi kèm voucher 20k cho 500 khách hàng bị ảnh hưởng
        bởi sự cố.
      options:
      - key: q1_n7_o1
        label: Tạo danh sách 500 user ID, thực hiện qua quy trình duyệt đợt phát voucher
          trên Admin Portal.
      - key: q1_n7_o2
        label: Chạy script phát voucher trực tiếp và gửi email thật đến toàn bộ 200,000
          user do viết sai điều kiện WHERE.
      - key: q1_n7_o3
        label: Gửi email thử nghiệm đến địa chỉ email nội bộ của team QA trước.
    - key: q1_n8
      prompt: Phát hiện Redis Cache lưu thông tin số dư ví bị sai lệch so với DB.
      options:
      - key: q1_n8_o1
        label: Viết script sync cache có kiểm tra locks và giới hạn rate-limit.
      - key: q1_n8_o2
        label: Chạy lệnh FLUSHALL trên Redis Prod cluster đang phục vụ 50,000 active
          sessions.
      - key: q1_n8_o3
        label: Xoá từng key cache bị sai lệch dựa trên danh sách user_id bị lỗi.
    - key: q1_n9
      prompt: Cần deploy hotfix code Java cho API Service.
      options:
      - key: q1_n9_o1
        label: Thực hiện Canary deployment, đẩy hotfix cho 5% traffic trước.
      - key: q1_n9_o2
        label: Build trực tiếp file .jar trên máy local rồi scp đè lên server Prod.
      - key: q1_n9_o3
        label: Deploy toàn bộ cluster trong giờ cao điểm mà không thông báo team DevOps.
    - key: q1_n10
      prompt: Sự cố đã được giải quyết tạm thời. Việc tiếp theo bạn thực hiện là gì?
      options:
      - key: q1_n10_o1
        label: Tổ chức buổi Post-mortem họp rút kinh nghiệm, bổ sung monitoring và
          unit test.
      - key: q1_n10_o2
        label: Đóng ticket incident và không ghi nhận lại nguyên nhân gốc rễ (Root
          cause).
      - key: q1_n10_o3
        label: Xoá toàn bộ file log sự cố trên server Prod để dọn dẹp dung lượng disk.
