  difficulty: medium
- content:
    scenario: Hệ thống thương mại điện tử gặp sự cố bất đồng bộ tồn kho giữa Redis
      Cache và MySQL DB trên môi trường Production, chỉ 30 phút trước sự kiện Flash
      Sale lớn nhất năm.
    nodes:
    - key: q1_node_1
      prompt: Phát hiện Redis Cache lưu thông tin tồn kho lệch với DB MySQL. Bạn xử
        lý Cache như thế nào?
      options:
      - key: q1_opt_1a
        label: Chạy lệnh FLUSHALL để xóa toàn bộ dữ liệu Redis Cluster
      - key: q1_opt_1b
        label: Viết script quét và xóa đúng các key cache:inventory:*
      - key: q1_opt_1c
        label: Cấu hình ứng dụng bỏ qua Redis Cache, đọc trực tiếp từ MySQL DB
    - key: q1_node_2
      prompt: MySQL Master DB tăng vọt CPU lên 98% do quá tải kết nối. Bạn giải quyết
        ra sao?
      options:
      - key: q1_opt_2a
        label: Kích hoạt DB Read Replica và điều hướng các truy vấn đọc sang Replica
      - key: q1_opt_2b
        label: Tăng max_connections lên 5000 ngay trên Production DB
      - key: q1_opt_2c
        label: Chạy lệnh kill toàn bộ connection đang ở trạng thái Sleep
    - key: q1_node_3
      prompt: Bảng temp_inventory tạo tuần trước đang gây khóa bảng. Bạn dọn dẹp bảng
        này thế nào?
      options:
      - key: q1_opt_3a
        label: Chạy DROP TABLE temp_inventory ngay lập tức
      - key: q1_opt_3b
        label: Đổi tên bảng thành temp_inventory_bak rồi kiểm tra trước khi xoá
      - key: q1_opt_3c
        label: Chạy TRUNCATE TABLE temp_inventory để giải phóng dung lượng
    - key: q1_node_4
      prompt: Cần cập nhật giá Flash Sale cho 500 sản phẩm đặc biệt. Phương án của
        bạn là gì?
      options:
      - key: q1_opt_4a
        label: Import file SQL patch chứa lệnh UPDATE trong một Transaction rõ ràng
      - key: q1_opt_4b
        label: Chạy script Python cập nhật trực tiếp DB không qua Transaction
      - key: q1_opt_4c
        label: Chỉnh sửa giá thủ công từng sản phẩm trên trang Admin Web UI
    - key: q1_node_5
      prompt: Cần gửi thông báo nhắc nhở khách hàng chuẩn bị tham gia Flash Sale.
      options:
      - key: q1_opt_5a
        label: Gọi API SMS Brandname gửi tin nhắn hàng loạt tới 200,000 khách hàng
          thật
      - key: q1_opt_5b
        label: Tạo banner In-app trên hệ thống CMS và đặt lịch hiển thị tự động
      - key: q1_opt_5c
        label: Gửi thử nghiệm Push Notification tới danh sách 10 thiết bị QA/Dev
    - key: q1_node_6
      prompt: API Gateway bị quá tải làm nhiều request trả về lỗi 504 Gateway Timeout.
      options:
      - key: q1_opt_6a
        label: Bật Rate Limiting tại Nginx Gateway giới hạn 100 req/min cho mỗi IP
      - key: q1_opt_6b
        label: Tắt bớt các service phụ như Recommendation Service để dành tài nguyên
      - key: q1_opt_6c
        label: Khởi động lại toàn bộ Nginx Service trên tất cả cluster node cùng lúc
    - key: q1_node_7
      prompt: Có 50 đơn hàng bị kẹt trạng thái Payment Pending do Webhook bị trễ.
      options:
      - key: q1_opt_7a
        label: Chạy script kích hoạt retry lại Webhook từ Cổng thanh toán
      - key: q1_opt_7b
        label: Cập nhật trực tiếp status = PAID trong DB cho 50 đơn hàng mà không
          đối soát
      - key: q1_opt_7c
        label: Hủy toàn bộ 50 đơn hàng và yêu cầu người dùng đặt lại
    - key: q1_node_8
      prompt: Cần kiểm tra log hệ thống để truy tìm nguyên nhân gây chậm.
      options:
      - key: q1_opt_8a
        label: Dùng tail -f /var/log/nginx/access.log | grep 504 trên 1 server
      - key: q1_opt_8b
        label: Chạy grep -rn '504' /var/log/ trên toàn bộ ổ đĩa Production Server
      - key: q1_opt_8c
        label: Truy vấn log tập trung thông qua ElasticSearch / Kibana Dashboard
    - key: q1_node_9
      prompt: Xảy ra hiện tượng Race Condition khi hàng trăm người cùng tranh mua
        sản phẩm cuối cùng.
      options:
      - key: q1_opt_9a
        label: Sử dụng Redis Distributed Lock (Redlock) khi thực hiện trừ tồn kho
      - key: q1_opt_9b
        label: Sử dụng SELECT FOR UPDATE trong DB transaction khi kiểm tra tồn kho
      - key: q1_opt_9c
        label: Tăng số lượng tồn kho trong DB thêm 10 để tránh hết hàng
    - key: q1_node_10
      prompt: Sự kiện Flash Sale kết thúc thành công. Bước dọn dẹp cuối cùng của bạn
        là gì?
      options:
      - key: q1_opt_10a
        label: Đối soát dữ liệu đơn hàng, tắt Feature Toggle Flash Sale và ghi log
          sự cố
      - key: q1_opt_10b
        label: Revert lại toàn bộ Git commits đã deploy trong ngày mà không kiểm tra
      - key: q1_opt_10c
        label: Để nguyên cấu hình Flash Sale cho đến ngày làm việc tiếp theo
  answer_key:
    option_effects:
      q1_opt_1a:
