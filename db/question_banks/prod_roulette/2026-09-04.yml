  difficulty: hard
- content:
    scenario: Hệ thống SaaS CRM & Tổng đài Call Center - Cập nhật tính năng Auto-dialer
      và gửi báo cáo tự động cho khách hàng doanh nghiệp.
    nodes:
    - key: q2_n1
      prompt: Bạn cần cập nhật danh sách 10,000 số điện thoại hotline khách hàng vào
        database hệ thống tổng đài.
      options:
      - key: q2_n1_o1
        label: Validate dữ liệu file CSV trên Staging trước khi import vào bảng `contacts`
          trên Prod.
      - key: q2_n1_o2
        label: Import trực tiếp file CSV vào DB Prod qua DBeaver mà không sao lưu
          bảng `contacts`.
      - key: q2_n1_o3
        label: Chạy script SQL tự động kích hoạt API Twilio/VOIP thực hiện cuộc gọi
          tự động (Auto-call) thử nghiệm tới 10,000 số thật.
    - key: q2_n2
      prompt: Cấu hình tích hợp Webhook gửi thông báo cuộc gọi nhỡ qua Telegram Bot
        cho khách hàng VIP.
      options:
      - key: q2_n2_o1
        label: Tạo Telegram Bot test riêng, cấu hình webhook URL Staging để kiểm tra
          payload.
      - key: q2_n2_o2
        label: Điền trực tiếp Token Telegram Bot sản xuất của Khách hàng VIP vào script
          test local và kích hoạt gửi tin.
      - key: q2_n2_o3
        label: Thay đổi file config `.env` trên Prod server và restart service worker
          ngay lập tức.
    - key: q2_n3
      prompt: Phát hiện chỉ số CPU của ElasticSearch node tăng lên 95% do query log
        tổng đài.
      options:
      - key: q2_n3_o1
        label: Tối ưu câu truy vấn ES, thêm filter theo index date range và scale-up
          cluster.
      - key: q2_n3_o2
        label: Xoá bỏ bớt các index cũ lưu trữ log 30 ngày gần nhất để giải phóng
          tài nguyên khẩn cấp.
      - key: q2_n3_o3
        label: Tắt service Elasticsearch logger trên Prod mà không có cơ chế fallback.
    - key: q2_n4
      prompt: Khách hàng yêu cầu xuất file báo cáo cước phí tổng đài tháng vừa qua
        dạng PDF.
      options:
      - key: q2_n4_o1
        label: Chạy background job sinh PDF và đẩy lên Amazon S3, gửi link download
          qua Admin Portal.
      - key: q2_n4_o2
        label: Chạy hàm export đồng bộ trực tiếp trên giao diện web gây lock trang
          Admin của toàn bộ công ty.
      - key: q2_n4_o3
        label: Tự động gửi email đính kèm file báo cáo chứa đầy dữ liệu mock/test
          tới toàn bộ khách hàng Doanh nghiệp.
    - key: q2_n5
      prompt: Cần cấu hình lại IP Whitelist cho cổng thanh toán tự động gia hạn gói
        cước CRM.
      options:
      - key: q2_n5_o1
        label: Thêm IP server mới vào Whitelist trên Portal đối tác, test thử với
          tài khoản Sandbox.
      - key: q2_n5_o2
        label: Xoá sạch toàn bộ danh sách IP Whitelist cũ rồi mới thêm IP mới vào.
      - key: q2_n5_o3
        label: Gọi API auto-charge trừ tiền thẻ tín dụng thật của tất cả tài khoản
          hết hạn để thử nghiệm API mới.
    - key: q2_n6
      prompt: Kiểm tra RabbitMQ Queue bị kẹt 50,000 tin nhắn voice message chưa xử
        lý.
      options:
      - key: q2_n6_o1
        label: Tăng số lượng Consumer worker để xử lý song song và theo dõi DB load.
      - key: q2_n6_o2
        label: Thực hiện Purge Queue trên RabbitMQ Management UI để làm sạch queue
          ngay lập tức.
      - key: q2_n6_o3
        label: Restart RabbitMQ service khi chưa bật cơ chế lưu persistent queue xuống
          disk.
    - key: q2_n7
      prompt: Thực hiện nâng cấp phiên bản Node.js trên server ứng dụng Prod.
      options:
      - key: q2_n7_o1
        label: Tạo Blue/Green Deployment environment, test ứng dụng trên Node.js mới
          rồi switch Nginx route.
      - key: q2_n7_o2
        label: Chạy nvm use và npm install trực tiếp trên Prod server đang phục vụ
          traffic.
      - key: q2_n7_o3
        label: Xoá folder node_modules và build lại code trực tiếp trong giờ cao điểm.
    - key: q2_n8
      prompt: Phát hiện file đính kèm ghi âm cuộc gọi trên S3 Bucket bị lộ public
        link.
      options:
      - key: q2_n8_o1
        label: Cập nhật S3 Bucket Policy thành Block Public Access và phân quyền Pre-signed
          URL cho API.
      - key: q2_n8_o2
        label: Đổi tên S3 Bucket trực tiếp khiến toàn bộ đường link cũ bị đứt gãy.
      - key: q2_n8_o3
        label: Xoá toàn bộ file trong S3 Bucket để ngăn chặn rò rỉ dữ liệu khẩn cấp.
    - key: q2_n9
      prompt: Cần kiểm tra tính năng khôi phục mật khẩu tài khoản Admin CRM.
      options:
      - key: q2_n9_o1
        label: Sử dụng email nội bộ test `tester@company.internal` để thử luồng Forgot
          Password.
      - key: q2_n9_o2
        label: Reset mật khẩu trực tiếp trong DB bằng hash MD5 tự sinh.
      - key: q2_n9_o3
        label: Trigger chức năng Reset Password và tự động gửi SMS OTP đến số điện
          thoại cá nhân của CEO công ty khách hàng.
    - key: q2_n10
      prompt: Hoàn tất ca trực Prod và bàn giao ca.
      options:
      - key: q2_n10_o1
        label: Bàn giao lại danh sách các thay đổi, dashboard monitoring và log cho
          team ca sau.
      - key: q2_n10_o2
        label: Bàn giao qua tin nhắn chat miệng mà không ghi chép ticket Jira/Logbook.
      - key: q2_n10_o3
        label: Rời khỏi ca trực mà không kiểm tra lại trạng thái server và cảnh báo
          Alertmanager.
