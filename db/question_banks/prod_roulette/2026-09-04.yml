        label: Truy vấn câu lệnh 'SELECT * FROM pg_stat_activity WHERE state != 'idle';'
          trên Read Replica để xác định Query bị tắc nghẽn.
      - key: q2_opt_1_2
        label: Chạy lệnh 'KILL -9' trực tiếp vào Process ID của Database Master Server.
      - key: q2_opt_1_3
        label: Restart lập tức toàn bộ Cluster Pod Database trên Kubernetes mà không
          drain connection.
    - key: q2_n2
