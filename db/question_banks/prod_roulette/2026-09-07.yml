          bị xử lý kỷ luật nghiêm trọng.
        next_node: end
  difficulty: medium
- content:
    scenario: Hệ thống E-Commerce chuẩn bị cho sự kiện Flash Sale. Bạn cần kiểm tra
      tính năng gửi mã giảm giá và thông báo Push/SMS tự động trên môi trường PRODUCTION
      do tính năng này vừa được hoàn thiện sát giờ G và chưa kịp test trên STG.
    nodes:
    - key: s1_n1
      prompt: 'Bước 1: Kiểm tra cấu hình Feature Flag trên hệ thống PRODUCTION.'
      options:
      - key: s1_n1_o1
        label: Kiểm tra giá trị Feature Flag thông qua Dashboard Admin ở chế độ Read-only.
      - key: s1_n1_o2
        label: Truy vấn trực tiếp DB Production Replica để xem bảng system_configs.
      - key: s1_n1_o3
        label: Chạy câu lệnh UPDATE trực tiếp bảng system_configs trên Master DB không
          có BEGIN TRANSACTION.
    - key: s1_n2
      prompt: 'Bước 2: Chuẩn bị cơ sở dữ liệu cho đợt test tính năng mới.'
      options:
      - key: s1_n2_o1
        label: Tạo snapshot DB trước, sau đó chạy migration script trong transaction
          có ROLLBACK dự phòng.
      - key: s1_n2_o2
        label: Chạy migration script trực tiếp vào giờ thấp điểm mà không tạo snapshot.
      - key: s1_n2_o3
        label: Xoá bớt dữ liệu bảng lịch sử voucher bằng TRUNCATE TABLE để nhẹ DB.
    - key: s1_n3
      prompt: 'Bước 3: Cấu hình dịch vụ gửi SMS Gateway cho việc kiểm thử.'
      options:
      - key: s1_n3_o1
        label: Trỏ endpoint SMS sang Sandbox Mock Gateway của đối tác dịch vụ.
      - key: s1_n3_o2
        label: Bypass phần gửi SMS trong code bằng cách trả về status 200 OK giả lập.
      - key: s1_n3_o3
        label: Giữ nguyên API Key thật của SMS Gateway và chạy script test với danh
          sách SĐT khách hàng thật.
    - key: s1_n4
      prompt: 'Bước 4: Bắn thử Push Notification tới thiết bị thử nghiệm.'
      options:
      - key: s1_n4_o1
        label: Chỉ định chính xác account_id của tài khoản test kiểm thử.
      - key: s1_n4_o2
        label: Lọc theo danh sách user tạo trong ngày hôm nay.
      - key: s1_n4_o3
        label: Chạy Cronjob gửi Push mà quên truyền tham số receiver_filter (để trống
          query).
    - key: s1_n5
      prompt: 'Bước 5: Phát hiện CPU server API tăng đột biến lên 95% trong quá trình
        test.'
      options:
      - key: s1_n5_o1
        label: Tăng tạm thời số lượng Instance ECS Container và xem APM trace để tìm
          bottleneck.
      - key: s1_n5_o2
        label: Khởi động lại toàn bộ API Service trên Production ngay lập tức.
      - key: s1_n5_o3
        label: Kill các Process kết nối Database đang chạy query lâu.
    - key: s1_n6
      prompt: 'Bước 6: Phát hiện lỗi logic tính toán phần trăm giảm giá voucher.'
      options:
      - key: s1_n6_o1
        label: Tắt Feature Flag, sửa code ở DEV, chạy qua pipeline CI/CD tiêu chuẩn
          để deploy.
      - key: s1_n6_o2
        label: SSH vào server Production và hotpatch trực tiếp file source code.
      - key: s1_n6_o3
        label: Git commit force push lên nhánh main để trigger auto deploy bỏ qua
          Unit Test.
    - key: s1_n7
      prompt: 'Bước 7: Xác minh việc hoàn tiền/hoàn voucher cho các giao dịch test.'
      options:
      - key: s1_n7_o1
        label: Kiểm tra log ghi nhận giao dịch trong bảng order_refund_logs.
      - key: s1_n7_o2
        label: Gọi API nội bộ promo-service để kiểm tra trạng thái voucher.
      - key: s1_n7_o3
