  difficulty: medium
- content:
    scenario: Hệ thống thương mại điện tử sắp tổ chức sự kiện Flash Sale lớn. Bạn
      được giao nhiệm vụ kiểm thử trực tiếp tính năng Push Notification và tích hợp
      cổng thanh toán trên môi trường Production vào giờ cao điểm để đảm bảo tải thực
      tế.
    nodes:
    - key: q1_node1
      prompt: 'Bước 1: Bạn chọn tập người dùng nào để thực hiện gửi thông báo thử
        nghiệm trên Production?'
      options:
      - key: q1_opt1
        label: Tạo 5 tài khoản test nội bộ với flag `is_test=true` để kiểm thử
      - key: q1_opt2
        label: Lấy trực tiếp danh sách 10,000 người dùng thật đang online để gửi thử
      - key: q1_opt3
        label: Tải toàn bộ DB Production về máy cá nhân và thực hiện test trên local
    - key: q1_node2
      prompt: 'Bước 2: Cấu hình FCM (Firebase Cloud Messaging) API Key trên Prod như
        thế nào?'
      options:
      - key: q1_opt4
        label: Sử dụng FCM Key của môi trường Staging cho tiện lợi
      - key: q1_opt5
        label: Kiểm tra và sử dụng Prod FCM Key đã được giới hạn IP server và Domain
      - key: q1_opt6
        label: Hardcode FCM Server Key trực tiếp vào bản build ứng dụng mobile
    - key: q1_node3
      prompt: 'Bước 3: Chọn nội dung hiển thị cho thông báo Push Notification thử
        nghiệm.'
      options:
      - key: q1_opt7
        label: Dùng mẫu '[TEST] Thông báo thử nghiệm hệ thống' chỉ gửi cho tài khoản
          test
      - key: q1_opt8
        label: Dùng nội dung thật 'Giảm giá 90% toàn bộ gian hàng ngay bây giờ!'
      - key: q1_opt9
        label: Dùng nội dung nháp không nghĩa 'Alo 1234 test push' để gửi
    - key: q1_node4
      prompt: 'Bước 4: Thiết lập giới hạn tần suất (Rate Limiting) cho API gửi tin.'
      options:
      - key: q1_opt10
        label: Cấu hình rate limit 100 requests/giây để kiểm soát tải hệ thống
      - key: q1_opt11
        label: Tắt hoàn toàn rate limit để đo tốc độ gửi tối đa của hệ thống
      - key: q1_opt12
        label: Đặt timeout cho HTTP client là 0ms để đẩy nhanh tiến độ
    - key: q1_node5
      prompt: 'Bước 5: Bạn cấu hình Deep Link đính kèm trong thông báo Push như thế
        nào?'
      options:
      - key: q1_opt13
        label: Cấu hình liên kết trỏ về môi trường Staging `https://staging.app.com/promo`
      - key: q1_opt14
        label: Cấu hình liên kết trỏ về trang sự kiện Prod kèm tham số UTM tracking
      - key: q1_opt15
        label: Trỏ trực tiếp link mở cổng thanh toán thật kèm mã giảm giá 100%
    - key: q1_node6
      prompt: 'Bước 6: Giám sát tài nguyên máy chủ (CPU, RAM, Database Connections)
        trong lúc tiến hành.'
      options:
      - key: q1_opt16
        label: Mở Dashboard Grafana/Datadog để theo dõi chỉ số real-time
      - key: q1_opt17
        label: Không cần giám sát, đợi nếu có phàn nàn từ khách hàng thì mới kiểm
          tra
      - key: q1_opt18
        label: SSH vào DB Prod và chạy script `while true; do mysql -e 'SHOW PROCESSLIST';
          done`
    - key: q1_node7
      prompt: 'Bước 7: Phát hiện tải Database tăng đột biến làm nghẽn kết nối. Bạn
        xử lý sao?'
      options:
      - key: q1_opt19
        label: Bật Redis Cache cho các API truy vấn thông tin sản phẩm
      - key: q1_opt20
        label: Tăng `max_connections` của MySQL lên 10,000 mà không nâng cấp RAM
      - key: q1_opt21
        label: Khởi động lại (Restart) DB Cluster ngay lập tức để giải phóng kết nối
    - key: q1_node8
      prompt: 'Bước 8: Thực hiện kiểm thử tích hợp với Cổng thanh toán (Payment Gateway).'
      options:
      - key: q1_opt22
        label: Dùng Webhook Endpoint Sandbox để giả lập phản hồi thanh toán
      - key: q1_opt23
        label: Gọi trực tiếp API Hoàn tiền (Refund API) thật trên Cổng thanh toán
          đối với các giao dịch của khách
      - key: q1_opt24
        label: Hardcode cho API thanh toán luôn trả về status HTTP 200 OK thành công
    - key: q1_node9
      prompt: 'Bước 9: Hàng đợi Message Queue (RabbitMQ) bị nghẽn hơn 50,000 tin nhắn.
        Bạn xử lý thế nào?'
      options:
      - key: q1_opt25
        label: Tăng số lượng worker consumer để xử lý hàng đợi nhanh hơn
      - key: q1_opt26
        label: Chạy lệnh `purge queue` để xóa sạch toàn bộ hàng đợi trên Production
      - key: q1_opt27
        label: Tắt cơ chế Acknowledge (Auto-ack) để worker nuốt message mà không cần
          xử lý
    - key: q1_node10
      prompt: 'Bước 10: Kết thúc phiên kiểm thử và tiến hành dọn dẹp.'
      options:
      - key: q1_opt28
        label: Xóa các tài khoản test, thu hồi API key thử nghiệm và ghi log báo cáo
      - key: q1_opt29
        label: Bỏ qua dọn dẹp, giữ nguyên các cấu hình tạm thời trên Production
      - key: q1_opt30
        label: Kích hoạt tự động gửi email cảm ơn kèm Voucher thật 200k cho 50,000
          khách hàng
