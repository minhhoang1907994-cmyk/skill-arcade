  difficulty: hard
- content:
    scenario: Hệ thống Ví điện tử bị tắc nghẽn giao dịch thanh toán vào giờ cao điểm
      do lỗi Deadlock Database và đọng Queue xử lý thanh toán. Bạn được phân công
      xử lý sự cố trực tiếp trên PRODUCTION.
    nodes:
    - key: s2_n1
      prompt: 'Bước 1: Điều tra nguyên nhân nghẽn hệ thống thanh toán.'
      options:
      - key: s2_n1_o1
        label: Xem log Nginx và chỉ số Grafana Dashboard của Payment Service.
      - key: s2_n1_o2
        label: Tăng kích thước Database Connection Pool trên Production ConfigMap.
      - key: s2_n1_o3
        label: Chạy lệnh FLUSHALL trên Production Redis Cluster để giải phóng bộ nhớ.
    - key: s2_n2
      prompt: 'Bước 2: Xử lý các transaction đang bị Lock trên PostgreSQL.'
      options:
      - key: s2_n2_o1
        label: Truy vấn pg_stat_activity để tìm các PID blocking và dùng pg_cancel_backend
          dừng nhẹ nhàng.
      - key: s2_n2_o2
        label: Restart lại toàn bộ cụm Database PostgreSQL Master.
      - key: s2_n2_o3
        label: Chạy lệnh ALTER TABLE transactions DROP CONSTRAINT fk_user_id.
    - key: s2_n3
      prompt: 'Bước 3: Giải quyết các đơn hàng dở dang chưa nhận được kết quả từ Ngân
        hàng.'
      options:
      - key: s2_n3_o1
        label: Gọi API Query Status sang Ngân hàng để đối soát trạng thái thực sự
          của từng trans_id.
      - key: s2_n3_o2
        label: Cập nhật trực tiếp trạng thái tất cả giao dịch Pending thành SUCCESS
          trong DB.
      - key: s2_n3_o3
        label: Gọi API Disbursement (Giải ngân) của Ngân hàng để chuyển tiền ngay
          cho bên bán mà không chờ đối soát.
    - key: s2_n4
      prompt: 'Bước 4: Xử lý hiện tượng Webhook Ngân hàng gửi trùng lặp (Duplicate
        Webhook).'
      options:
      - key: s2_n4_o1
        label: Bổ sung cơ chế Idempotency Key bằng Redis Lock dựa trên bank_tran_id.
      - key: s2_n4_o2
        label: Tắt bỏ kiểm tra chữ ký HMAC trên Webhook endpoint để tăng tốc độ xử
          lý.
      - key: s2_n4_o3
        label: Cho phép bỏ qua lỗi 500 để Ngân hàng tự động gửi lại Webhook vô hạn
          lần.
    - key: s2_n5
      prompt: 'Bước 5: Giải phóng tài nguyên RAM đang bị quá tải trên cụm Kubernetes.'
      options:
      - key: s2_n5_o1
        label: Thực hiện Rolling Restart đối với Deployment payment-worker.
      - key: s2_n5_o2
        label: Kill PID 1 trực tiếp trong container bằng lệnh kubectl exec.
      - key: s2_n5_o3
        label: Thực hiện lệnh kubectl delete namespace production.
    - key: s2_n6
      prompt: 'Bước 6: Đồng bộ lại số tồn kho mặt hàng sau khi giao dịch bị huỷ hàng
        loạt.'
      options:
      - key: s2_n6_o1
        label: Chạy script background worker để bù lại số lượng tồn kho theo đúng
          log order_items.
      - key: s2_n6_o2
        label: Chạy lệnh UPDATE inventory SET quantity = 99999 cho các sản phẩm hot.
      - key: s2_n6_o3
        label: Gọi API ERP Kho vận bên ngoài để ép buộc sync lại dữ liệu kho vật lý.
    - key: s2_n7
      prompt: 'Bước 7: Thông báo tình hình sự cố cho người dùng.'
      options:
      - key: s2_n7_o1
        label: Cập nhật trang trạng thái hệ thống (Status Page) và báo cho bộ phận
          CSKH.
      - key: s2_n7_o2
        label: Gửi email nội bộ cho đỗi ngũ kỹ thuật.
      - key: s2_n7_o3
        label: Bắn Push Notification xin lỗi hàng loạt tới toàn bộ 500,000 người dùng
          ứng dụng.
    - key: s2_n8
      prompt: 'Bước 8: Mở rộng khả năng xử lý của cơ sở dữ liệu.'
      options:
      - key: s2_n8_o1
        label: Nâng cấp RAM/CPU cho Read Replica và chuyển bớt truy vấn SELECT sang
          Replica.
      - key: s2_n8_o2
        label: Reboot máy chủ DB Primary mà không chuyển đổi Failover sang Standby.
      - key: s2_n8_o3
        label: Tắt tính năng ghi Write-Ahead Logging (WAL) của PostgreSQL để tăng
          tốc độ ghi.
    - key: s2_n9
      prompt: 'Bước 9: Triển khai bản vá lỗi khẩn cấp (Hotfix) cho Payment Service.'
      options:
      - key: s2_n9_o1
        label: Tạo nhánh hotfix, chạy test tự động trên CI và deploy dạng Canary 10%
          traffic.
      - key: s2_n9_o2
        label: Build Docker image ở máy cá nhân rồi push thẳng lên Production ECR
          registry với tag latest.
      - key: s2_n9_o3
        label: Sửa code trực tiếp trong container bằng vi rồi restart process.
    - key: s2_n10
      prompt: 'Bước 10: Đánh giá sau sự cố và khôi phục hoạt động bình thường.'
      options:
      - key: s2_n10_o1
        label: Trích xuất log, lập timeline diễn biến sự cố và viết báo cáo Post-mortem.
      - key: s2_n10_o2
        label: Xoá bớt file log sự cố trên S3 để tiết kiệm chi phí lưu trữ.
      - key: s2_n10_o3
        label: Đóng tất cả ticket khiếu nại của khách hàng trên hệ thống CSKH mà không
          cần kiểm tra lại.
