  difficulty: medium
- content:
    scenario: Hệ thống E-commerce đang triển khai bản Hotfix cho payment-service lúc
      21:00. Sau khi deploy, hệ thống ghi nhận hàng loạt lỗi timeout từ cổng thanh
      toán VNPay và hơn 500 giao dịch ở trạng thái PENDING.
    nodes:
    - key: q1_node_1
      prompt: Kỹ sư phát hiện log ghi nhận lỗi 'Connection refused' liên tục từ payment-service
        tới VNPay API. Bạn nên làm gì đầu tiên?
      options:
      - key: q1_n1_o1
        label: Kiểm tra outbound IP whitelist và cấu hình Proxy Egress trên Production
          Kubernetes cluster.
      - key: q1_n1_o2
        label: Tăng ngay connection_timeout trong payment-service.yml lên 60 giây
          và restart pod.
      - key: q1_n1_o3
        label: Bypass cổng VNPay và chuyển tất cả traffic sang cổng thanh toán Momo
          mà không kiểm tra cấu hình.
    - key: q1_node_2
      prompt: IP mới của Pod bị từ chối do chưa nằm trong Whitelist của VNPay. Việc
        cần làm tiếp theo là gì?
      options:
      - key: q1_n2_o1
        label: Tạo Egress Static NAT IP ổn định và gửi yêu cầu khẩn cấp cho VNPay
          hỗ trợ whitelist IP này.
      - key: q1_n2_o2
        label: Tạm thời tắt Firewall và Security Group của Pod để kết nối thông suốt.
      - key: q1_n2_o3
        label: Đổi IP của Pod thành IP ngẫu nhiên liên tục để thử xem IP nào lọt qua.
    - key: q1_node_3
      prompt: VNPay đã whitelist NAT IP. Cổng thanh toán đã kết nối lại. Tuy nhiên,
        500 giao dịch vẫn kẹt trạng thái PENDING.
      options:
      - key: q1_n3_o1
        label: Chạy job reconciliation (đối soát) gọi API QueryTransaction status
          từ VNPay để cập nhật trạng thái.
      - key: q1_n3_o2
        label: 'Cập nhật trực tiếp SQL: UPDATE orders SET status = ''SUCCESS'' WHERE
          status = ''PENDING''.'
      - key: q1_n3_o3
        label: Xoá toàn bộ 500 đơn hàng PENDING để khách hàng đặt lại đơn mới.
    - key: q1_node_4
      prompt: Job đối soát phát hiện 50 giao dịch đã bị trừ tiền bên VNPay nhưng phía
        DB hệ thống vẫn chưa cập nhật order status.
      options:
      - key: q1_n4_o1
        label: Ghi nhận log chi tiết, chạy script idempotent sync status chuẩn cho
          50 order này.
      - key: q1_n4_o2
        label: Gọi trực tiếp API Refund bên VNPay cho cả 50 giao dịch mà chưa xác
          minh lại với khách.
      - key: q1_n4_o3
        label: Bỏ qua 50 giao dịch này, chờ khách hàng gửi khiếu nại lên CSKH.
    - key: q1_node_5
      prompt: Phát hiện DB master đang có dấu hiệu High CPU (95%) do lượng connection
        tăng vọt từ payment-service.
      options:
      - key: q1_n5_o1
        label: Kiểm tra connection pool (HikariCP), điều chỉnh maxLifetime và maximumPoolSize
          về mức an toàn.
      - key: q1_n5_o2
        label: Thực hiện KILLED ngẫu nhiên các Process trên PostgreSQL/MySQL.
      - key: q1_n5_o3
        label: Restart Database Production ngay lập tức mà không chuyển Read-Only.
    - key: q1_node_6
      prompt: Sau khi ổn định DB, phát hiện webhook callback từ VNPay gửi về bị drop
        do nghẽn RabbitMQ Queue.
      options:
      - key: q1_n6_o1
        label: Tăng số lượng Consumer pod cho Queue 'vnpay_callback' và bật Auto-scaling.
      - key: q1_n6_o2
        label: Purge (xoá sạch) messages trong Queue để giải phóng bộ nhớ RabbitMQ.
      - key: q1_n6_o3
        label: Tắt hẳn RabbitMQ broker và bật lại.
    - key: q1_node_7
      prompt: Cần gửi thông báo xin lỗi và xác nhận cập nhật trạng thái đơn hàng cho
        500 khách hàng bị ảnh hưởng.
      options:
      - key: q1_n7_o1
        label: Gửi SMS Brandname trực tiếp với nội dung xin lỗi kèm voucher 100k tới
          500 SĐT thật qua cổng SMS Prod.
      - key: q1_n7_o2
        label: Tạo Campaign Notification trên Admin portal, duyệt danh sách và cho
          CSKH kiểm duyệt trước khi gửi Push.
      - key: q1_n7_o3
        label: Chạy script Python tự động gửi email hàng loạt không có rate-limit.
    - key: q1_node_8
      prompt: Hệ thống ghi nhận 10 đơn hàng bị thanh toán trùng (Double Charge) do
        người dùng ấn nút thanh toán nhiều lần.
      options:
      - key: q1_n8_o1
        label: Lập danh sách giao dịch trùng, tạo ticket CSKH xử lý hoàn tiền thủ
          công đúng quy trình tài chính.
      - key: q1_n8_o2
        label: Trực tiếp gọi API Refund Prod của VNPay trả lại toàn bộ tiền cho 10
          đơn đó ngay trên Terminal.
      - key: q1_n8_o3
        label: Tự ý cộng tiền ảo vào Wallet nội bộ của khách hàng mà không qua kế
          toán.
    - key: q1_node_9
      prompt: Hệ thống đã hoạt động ổn định trở lại. Bạn cần đảm bảo sự cố không lặp
        lại.
      options:
      - key: q1_n9_o1
        label: Cập nhật tài liệu Architecture, bổ sung Healthcheck probe và Alert
          rules trên Prometheus.
      - key: q1_n9_o2
        label: Giữ nguyên cấu hình tạm thời trên Prod vì thấy hệ thống vẫn chạy ổn.
      - key: q1_n9_o3
        label: Tắt toàn bộ hệ thống log của payment-service để giảm tải dung lượng
          ổ cứng.
    - key: q1_node_10
      prompt: Bước cuối cùng sau khi khắc phục xong sự cố là gì?
      options:
      - key: q1_n10_o1
        label: Họp Post-mortem phân tích root cause, đề xuất action items và cập nhật
          vào Confluence.
      - key: q1_n10_o2
        label: Đóng ticket sự cố và không ghi chép lại vì đã giải quyết xong.
      - key: q1_n10_o3
        label: Đổ lỗi cho phía VNPay trong báo cáo gửi Ban giám đốc.
