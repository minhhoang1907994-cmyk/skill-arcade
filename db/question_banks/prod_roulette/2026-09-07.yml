  difficulty: hard
- content:
    scenario: Bạn là Dev Lead đang cùng BA kiểm thử tính năng phát hành Voucher Giảm
      Giá 50% cho sự kiện Flash Sale trên môi trường PRODUCTION của sàn eCommerce.
      Hệ thống đang chịu tải 15,000 active users. Bạn phải thao tác cẩn thận để tránh
      ảnh hưởng đến người dùng thật.
    nodes:
    - key: q1_node1
      prompt: 'Bước 1: Bạn cần kiểm tra danh sách 10 người dùng mẫu thuộc phân khúc
        VIP trên DB Production để chuẩn bị test.'
      options:
      - key: q1_n1_o1
        label: Chạy truy vấn SELECT với điều kiện WHERE customer_type = 'VIP' LIMIT
          10 trên Read-Replica DB.
      - key: q1_n1_o2
        label: Chạy SELECT * FROM users trực tiếp trên Master DB để tìm thủ công.
      - key: q1_n1_o3
        label: Tự tay chạy UPDATE users SET is_vip = 1 cho 10 user đầu tiên trên Master
          DB để làm dữ liệu mẫu.
    - key: q1_node2
      prompt: 'Bước 2: Cấu hình Feature Flag để bật tính năng Flash Sale Voucher.'
      options:
      - key: q1_n2_o1
        label: Bật Feature Flag ENABLE_FLASH_SALE_VOUCHER áp dụng riêng cho tài khoản
          test internal 'test_qa_01'.
      - key: q1_n2_o2
        label: Bật Feature Flag áp dụng cho toàn bộ dải IP văn phòng công ty.
      - key: q1_n2_o3
        label: Bật Feature Flag toàn hệ thống cho 100% người dùng trong 5 phút để
          test nhanh.
    - key: q1_node3
      prompt: 'Bước 3: Tạo mã Voucher thử nghiệm trên Production.'
      options:
      - key: q1_n3_o1
        label: Tạo voucher TEST50 với giá trị tối đa 1,000 VND và gắn cờ is_testing
          = true.
      - key: q1_n3_o2
        label: Tạo voucher SALE50 giảm 50% không giới hạn hạn mức, chỉ gửi mã riêng
          cho BA test.
      - key: q1_n3_o3
        label: Direct insert trực tiếp mã VOUCHER_50_OFF vào bảng vouchers trên CSDL
          Production mà không qua Validation Service.
    - key: q1_node4
      prompt: 'Bước 4: Kiểm thử tính năng Push Notification thông báo voucher mới.'
      options:
      - key: q1_n4_o1
        label: Gửi Push Notification thông qua FCM Console đến duy nhất Device Token
          của thiết bị test.
      - key: q1_n4_o2
        label: Chạy script broadcast Push Notification nhưng đặt môi trường flag là
          DRY_RUN = true.
      - key: q1_n4_o3
        label: Thực thi script gửi Push Notification kèm mã voucher giảm 50% tới toàn
          bộ 500,000 thiết bị active trên Production.
    - key: q1_node5
      prompt: 'Bước 5: Thử nghiệm thanh toán đơn hàng áp dụng voucher qua Cổng thanh
        toán.'
      options:
      - key: q1_n5_o1
        label: Dùng tài khoản ngân hàng thử nghiệm Sandbox để thực hiện đơn hàng 0
          VND trên Prod.
      - key: q1_n5_o2
        label: Thực hiện giao dịch 10,000 VND bằng tài khoản thật rồi gọi Admin CMS
          thực hiện Refund tiền ngay.
      - key: q1_n5_o3
        label: Gửi API request trực tiếp đến endpoint Settlement thật của ngân hàng
          để giả lập thanh toán hoàn tất.
    - key: q1_node6
      prompt: 'Bước 6: Phát hiện một số order test bị kẹt ở trạng thái PROCESSING.
        Bạn cần dọn dẹp.'
      options:
      - key: q1_n6_o1
        label: Chạy script cập nhật status = 'CANCELLED' cho các ID đơn hàng test
          đã định danh cụ thể.
      - key: q1_n6_o2
        label: Chạy câu lệnh DELETE FROM orders WHERE status = 'PROCESSING' để xóa
          nhanh.
      - key: q1_n6_o3
        label: Dùng lệnh TRUNCATE TABLE orders_queue để làm sạch hàng chờ xử lý.
    - key: q1_node7
      prompt: 'Bước 7: Theo dõi hiệu năng của hệ thống CSDL Redis Cache trong khi
        test.'
      options:
      - key: q1_n7_o1
        label: Xem chỉ số CPU và Memory Redis trên Grafana Dashboard.
      - key: q1_n7_o2
        label: SSH vào node Redis Master và chạy lệnh KEYS * để đếm số lượng key voucher.
      - key: q1_n7_o3
        label: Bật lệnh MONITOR trên Redis Production để capture toàn bộ command realtime
          trong 10 phút.
    - key: q1_node8
      prompt: 'Bước 8: Redis xuất hiện hiện tượng latency cao đột biến. Bạn xử lý
        thế nào?'
      options:
      - key: q1_n8_o1
        label: Kiểm tra slowlog bằng SLOWLOG GET 10 và thông báo bộ phận Infrastructure
          hỗ trợ phân tích.
      - key: q1_n8_o2
        label: Thực hiện restart service Redis Master để giải phóng bộ nhớ lập tức.
      - key: q1_n8_o3
        label: Chạy lệnh FLUSHALL trên Redis Production để xóa toàn bộ cache.
    - key: q1_node9
      prompt: 'Bước 9: Phát hiện lỗi logic tính giá sau khi áp voucher, cần cập nhật
        code gấp.'
      options:
      - key: q1_n9_o1
        label: Tạo Pull Request, kích hoạt CI/CD deploy bản fix lên Staging kiểm tra
          trước khi release Prod.
      - key: q1_n9_o2
        label: Sửa trực tiếp file source code trên server Production bằng vim rồi
          restart app server.
      - key: q1_n9_o3
        label: Thực hiện git pull trực tiếp nhánh feature/hotfix trên server Prod
          mà bỏ qua khâu chạy Unit Test.
    - key: q1_node10
      prompt: 'Bước 10: Hoàn tất đợt kiểm thử và chuẩn bị mở sự kiện cho người dùng
        thật.'
      options:
      - key: q1_n10_o1
        label: Rà soát lại toàn bộ checklist, dọn dẹp dữ liệu test chuẩn chỉnh và
          mở Feature Flag theo lộ trình percentage rollout.
      - key: q1_n10_o2
        label: Mở Feature Flag 100% cho toàn bộ user ngay lập tức mà không cần theo
          dõi log APM.
      - key: q1_n10_o3
        label: Bỏ qua việc bàn giao ca trực, tắt máy đi về và hẹn sáng mai kiểm tra
          kết quả.
