        consequence_text: Quy trình diễn ra hoàn hảo. Sự kiện Flash Sale diễn ra thành
          công mĩ mãn, hệ thống ổn định.
        next_node: end
      q1_n10_o2:
        points: 3
        irreversible: false
        consequence_text: Traffic dồn dập khiến server chạm mốc 99% CPU trong 10 phút
          đầu, rất may hệ thống Auto-scaling kịp thời cứu vãn.
        next_node: end
      q1_n10_o3:
        points: 3
        irreversible: false
        consequence_text: Hệ thống phát sinh lỗi rò rỉ bộ nhớ lúc rạng sáng, không
          ai xử lý dẫn đến sập ứng dụng suốt 3 tiếng đêm.
        next_node: end
  difficulty: hard
- content:
    scenario: Bạn là BA/Dev trực ca đêm cho ứng dụng Ví điện tử. Lúc 01:00 AM, hệ
      thống cảnh báo hàng trăm giao dịch Nạp tiền bị treo ở trạng thái PENDING do
      kết nối với Ngân hàng đối tác gặp sự cố mạng. Bạn cần điều tra và khắc phục
      sự cố này trên Production.
    nodes:
    - key: q2_node1
      prompt: 'Bước 1: Tra cứu nguyên nhân các giao dịch bị kẹt.'
      options:
      - key: q2_n1_o1
        label: Truy vấn log tập trung trên ElasticSearch/Kibana theo correlation_id
          của giao dịch mẫu.
      - key: q2_n1_o2
        label: SSH vào Server ứng dụng và chạy cat app.log | grep 'ERROR' trên file
          log nặng 50GB.
      - key: q2_n1_o3
        label: Bật log level TRACE cho toàn bộ Cluster Production để thu thập chi
          tiết mọi request.
    - key: q2_node2
      prompt: 'Bước 2: Hàng chờ Message Queue (RabbitMQ) đang bị dồn nén 100,000 message.
        Bạn xử lý thế nào?'
      options:
      - key: q2_n2_o1
        label: Tăng số lượng Consumer instances (Scale-out) để tăng tốc độ xử lý queue.
      - key: q2_n2_o2
        label: Tăng prefetch_count lên 5,000 trên các Consumer hiện tại.
      - key: q2_n2_o3
        label: Thực hiện Purge Queue để xóa sạch 100,000 message giúp hàng chờ trở
          về 0 ngay lập tức.
    - key: q2_node3
      prompt: 'Bước 3: Cần thông báo cho các khách hàng có giao dịch bị PENDING.'
      options:
      - key: q2_n3_o1
        label: Tạo Push Notification cho đúng danh sách user_id có giao dịch PENDING
          với nội dung xin lỗi và yêu cầu chờ đợi.
      - key: q2_n3_o2
        label: Export danh sách SĐT khách hàng bị ảnh hưởng ra file Excel rồi dùng
          app chat cá nhân nhắn tin từng người.
      - key: q2_n3_o3
        label: Chạy script tự động gửi email thông báo Hủy giao dịch và hoàn tiền
          đến toàn bộ 100,000 người dùng trong cơ sở dữ liệu.
    - key: q2_node4
      prompt: 'Bước 4: Đối soát trạng thái thực tế của các giao dịch bị kẹt với phía
        Ngân hàng đối tác.'
      options:
      - key: q2_n4_o1
        label: Gọi API QueryTransactionStatus (Read-Only) phía Ngân hàng để kiểm tra
          từng giao dịch.
      - key: q2_n4_o2
        label: Tự ý chạy UPDATE status = 'SUCCESS' cho tất cả giao dịch PENDING trên
          DB Ví để khách hàng vui lòng.
      - key: q2_n4_o3
        label: Kích hoạt API revertTransaction phía Ngân hàng thật để yêu cầu hoàn
          lại tiền cho danh sách giao dịch chưa rõ kết quả.
    - key: q2_node5
      prompt: 'Bước 5: Bảng wallet_transactions trên Postgres DB bị slow query do
        thiếu index trên cột updated_at.'
      options:
      - key: q2_n5_o1
        label: Chạy lệnh CREATE INDEX CONCURRENTLY idx_transactions_updated_at ON
          wallet_transactions(updated_at).
      - key: q2_n5_o2
        label: Chạy lệnh CREATE INDEX idx_transactions_updated_at ON wallet_transactions(updated_at)
          thông thường.
      - key: q2_n5_o3
        label: Stop hẳn service Database trong 5 phút để tạo Index cho nhanh rồi start
          lại DB.
    - key: q2_node6
      prompt: 'Bước 6: Thay đổi cấu hình Connection Timeout tới Ngân hàng để tránh
        làm kẹt Thread Pool.'
      options:
      - key: q2_n6_o1
        label: Cập nhật HTTP_TIMEOUT_MS = 3000 trên Config Server (Consul) và reload
          cấu hình động.
      - key: q2_n6_o2
        label: Sửa trực tiếp file .env trên từng server rồi chạy lệnh systemctl restart
          wallet-service.
      - key: q2_n6_o3
        label: Tăng timeout lên 300,000ms (5 phút) để đảm bảo không bao giờ bỏ sót
          phản hồi từ Ngân hàng.
    - key: q2_node7
      prompt: 'Bước 7: Người dùng phàn nàn không nhận được SMS OTP xác thực trong
        thời gian nghẽn mạng.'
      options:
      - key: q2_n7_o1
        label: Chuyển hướng gửi OTP qua kênh Voice OTP hoặc Zalo ZNS tạm thời bằng
          cấu hình Router Kênh.
      - key: q2_n7_o2
        label: Tạm thời tắt yêu cầu OTP cho các giao dịch nạp tiền dưới 100,000 VND
          để giảm tải.
      - key: q2_n7_o3
        label: Thực hiện lệnh gửi lại (Resend) đồng loạt SMS Brandname thật chứa mã
          OTP mới đến 20,000 khách hàng trong queue.
    - key: q2_node8
      prompt: 'Bước 8: Ổ đĩa server app /var/log chạm mốc 98% dung lượng khiến ứng
        dụng không ghi thêm được log.'
      options:
      - key: q2_n8_o1
        label: Nén các file log cũ bằng gzip và upload lên S3 Bucket lưu trữ rồi mới
          xóa file nén.
      - key: q2_n8_o2
        label: Chạy câu lệnh rm -rf /var/log/app/*.log trực tiếp trên server đang
          chạy.
      - key: q2_n8_o3
        label: Gõ nhầm lệnh rm -rf / var/log/app/* (có dấu cách sau dấu gạch chéo
          đầu tiên).
    - key: q2_node9
      prompt: 'Bước 9: Áp dụng cơ chế Circuit Breaker để bảo vệ hệ thống khi Ngân
        hàng chập chờn.'
      options:
      - key: q2_n9_o1
        label: Bật Resilience4j Circuit Breaker với ngưỡng error rate 50%, chuyển
          sang fallback trả về thông báo bảo trì nhẹ nhàng.
      - key: q2_n9_o2
        label: Tắt toàn bộ API Gateway để ngắt tất cả kết nối từ App Mobile đến Server.
      - key: q2_n9_o3
        label: Bỏ qua Circuit Breaker, để ứng dụng tiếp tục retry liên tục với tần
          suất 1 giây/lần tới phía Ngân hàng.
    - key: q2_node10
      prompt: 'Bước 10: Sự cố đã được kiểm soát. Bạn làm gì để hoàn tất ca trực?'
      options:
      - key: q2_n10_o1
        label: Soạn báo cáo sự cố (Post-Mortem) chi tiết về timeline, nguyên nhân
          gốc rễ, thiệt hại và hành động cải thiện.
      - key: q2_n10_o2
        label: Nói qua sơ bộ trong nhóm chat Skype của phòng rồi bàn giao ca trực
          mà không viết ticket Jira.
      - key: q2_n10_o3
        label: Xóa toàn bộ các bản ghi log sự cố trên server để giấu lỗi, tránh bị
          trừ KPI điểm thưởng chất lượng.
  answer_key:
    option_effects:
      q2_n1_o1:
        points: 10
        irreversible: false
        consequence_text: Tra cứu log qua ElasticSearch chính xác, nhanh chóng và
          không gây ảnh hưởng đến hiệu năng của server ứng dụng.
        next_node: q2_node2
      q2_n1_o2:
        points: 3
        irreversible: false
        consequence_text: Lệnh cat/grep file log lớn gây ngốn I/O đĩa cứng làm tăng
          độ trễ xử lý các request khác trên server đó.
        next_node: q2_node2
      q2_n1_o3:
        points: 3
        irreversible: false
        consequence_text: Log level TRACE xả ra lượng dữ liệu khổng lồ khiến ổ đĩa
          server bị tràn đầy trong vòng 15 phút.
        next_node: q2_node2
      q2_n2_o1:
