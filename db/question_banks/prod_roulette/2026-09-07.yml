  difficulty: medium
- content:
    scenario: Đêm Mega Sale 11/11, hệ thống Notification & Campaign Marketing chịu
      tải 100,000 req/sec. Redis Cache Cluster bị treo, khiến database Elasticsearch
      và MySQL quá tải nghiêm trọng.
    nodes:
    - key: q2_node_1
      prompt: Redis Cache Cluster báo RAM usage 99% và không nhận thêm key mới. Bạn
        xử lý như thế nào?
      options:
      - key: q2_n1_o1
        label: Phân tích Redis Memory Key bằng redis-rdb-tools và điều chỉnh eviction
          policy sang volatile-lru.
      - key: q2_n1_o2
        label: Chạy lệnh 'FLUSHALL' trên Production Redis Instance để giải phóng RAM
          ngay lập tức.
      - key: q2_n1_o3
        label: Khởi động lại toàn bộ Node Redis Master cùng lúc.
    - key: q2_node_2
      prompt: Lệnh 'FLUSHALL' hoặc sập cache khiến 100,000 req/sec đánh trực tiếp
        xuống Database. MySQL bị lock table.
      options:
      - key: q2_n2_o1
        label: Bật Rate Limiting ở API Gateway (Kong/Nginx) để cản bớt 70% traffic
          không thiết yếu.
      - key: q2_n2_o2
        label: Tăng max_connections của MySQL lên 10,000 mà không tăng RAM server.
      - key: q2_n2_o3
        label: Tắt toàn bộ Database MySQL để chờ traffic giảm.
    - key: q2_node_3
      prompt: API Gateway đã chặn bớt traffic rác. Bây giờ cần phục hồi Redis Cache
        mà không làm sập Database.
      options:
      - key: q2_n3_o1
        label: Viết script Warm-up cache từng phần (Cache Stampede prevention) với
          randomized TTL.
      - key: q2_n3_o2
        label: Bật lại toàn bộ service cho truy cập Redis cùng lúc.
      - key: q2_n3_o3
        label: Xoá bớt dữ liệu trong MySQL để query chạy nhanh hơn.
    - key: q2_node_4
      prompt: Team Marketing muốn phát voucher 500k cho 1,000 user VIP đang có mặt
        trên App để kích cầu.
      options:
      - key: q2_n4_o1
        label: Đẩy danh sách VIP vào Kafka topic 'voucher_grant' để worker tiêu thụ
          bất đồng bộ có kiểm soát.
      - key: q2_n4_o2
        label: Chạy SQL UPDATE/INSERT trực tiếp trên bảng 'user_vouchers' trên DB
          Production bằng Navicat.
      - key: q2_n4_o3
        label: Tạo Voucher Code chung và đăng công khai lên Fanpage Facebook.
    - key: q2_node_5
      prompt: Cần gửi Push Notification tới 100,000 mobile app user để thông báo sự
        kiện Flash Sale lúc 00:00.
      options:
      - key: q2_n5_o1
        label: Gọi trực tiếp Firebase Cloud Messaging (FCM) API gửi broadcast ngay
          tới 100,000 user trong 1 request.
      - key: q2_n5_o2
        label: Chia nhỏ danh sách thành các batch 5,000 users và đẩy vào Queue có
          Delay Interval.
      - key: q2_n5_o3
        label: Hủy bỏ chiến dịch Push Notification trong đêm Sale.
    - key: q2_node_6
      prompt: Elasticsearch Index 'product_search' bị nghẽn do không chịu nổi lượng
        tìm kiếm sản phẩm tăng vọt.
      options:
      - key: q2_n6_o1
        label: Tăng số lượng Replicas cho Index và tối ưu Query DSL loại bỏ Wildcard
          search.
      - key: q2_n6_o2
        label: Delete luôn Index 'product_search' để tạo lại Index mới.
      - key: q2_n6_o3
        label: Trực tiếp chuyển toàn bộ Search query sang MySQL LIKE '%keyword%'.
    - key: q2_node_7
      prompt: Server Worker xử lý order bị Out of Memory (OOM KILLED) liên tục.
      options:
      - key: q2_n7_o1
        label: Điều chỉnh Memory Limit trong Docker/K8s manifest và tối ưu Heap size
          JVM (-Xmx).
      - key: q2_n7_o2
        label: Tắt hoàn toàn Garbage Collection (GC) của Java để tránh gián đoạn.
      - key: q2_n7_o3
        label: Scale số lượng Pod từ 10 lên 100 bất chấp tài nguyên Worker Node.
    - key: q2_node_8
      prompt: Phát hiện 1 Microservice chạy phiên bản cũ do CI/CD pipeline bị nghẽn
        đợt deploy vừa rồi.
      options:
      - key: q2_n8_o1
        label: Kiểm tra rollback strategy, thực hiện Rollback image về phiên bản Stable
          đã qua test.
      - key: q2_n8_o2
        label: Sửa code trực tiếp trên Pod Production qua command 'kubectl exec -it'.
      - key: q2_n8_o3
        label: Xóa Pod cũ và không khởi tạo lại để giảm tải hệ thống.
    - key: q2_node_9
      prompt: Lượng Log phát sinh quá lớn khiến ổ đĩa của Log Server (Fluentd/Elasticsearch)
        bị đầy 100%.
      options:
      - key: q2_n9_o1
        label: Áp dụng Curator xóa bớt Log index cũ hơn 30 ngày và bật Log Compression.
      - key: q2_n9_o2
        label: Chạy 'rm -rf /' trên thư mục log mà không phân biệt file hệ thống.
      - key: q2_n9_o3
        label: Mở rộng ổ cứng trực tiếp mà không cần dọn dẹp log rác.
    - key: q2_node_10
      prompt: Hệ thống đã vượt qua đợt Peak Sale 11/11 an toàn. Bước quản trị vận
        hành cuối cùng là gì?
      options:
      - key: q2_n10_o1
        label: Thực hiện tổng kết Load Test metrics, review capacity planning cho
          đợt 12/12.
      - key: q2_n10_o2
        label: Giảm quy mô Cluster về mốc tối thiểu ngay lập tức khi chưa hết đợt
          dư chấn traffic.
      - key: q2_n10_o3
        label: Bỏ qua các cảnh báo CPU/RAM còn sót lại.
