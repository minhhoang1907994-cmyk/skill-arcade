  difficulty: hard
- content:
    scenario: Hệ thống xử lý đơn hàng Production bị lỗi treo 5,000 đơn ở trạng thái
      PENDING do nghẽn mạng giữa đêm. Bạn được giao nhiệm vụ chạy script sửa dữ liệu
      và đồng bộ hóa lại trạng thái giao dịch.
    nodes:
    - key: q2_node1
      prompt: 'Bước 1: Kiểm tra dữ liệu bị kẹt trong Database như thế nào?'
      options:
      - key: q2_opt1
        label: Viết câu lệnh SELECT cẩn thận kèm điều kiện `created_at` để lọc đúng
          5,000 đơn kẹt
      - key: q2_opt2
        label: Chạy lệnh `UPDATE orders SET status = 'SUCCESS'` trực tiếp không có
          mệnh đề `WHERE`
      - key: q2_opt3
        label: Export toàn bộ bảng `orders` ra file CSV trên máy tính cá nhân để mở
          Excel lọc
    - key: q2_node2
      prompt: 'Bước 2: Thực hiện công tác sao lưu dữ liệu trước khi can thiệp.'
      options:
      - key: q2_opt4
        label: Tạo DB Snapshot và clone bảng `orders` sang bảng tạm `orders_backup_2023`
      - key: q2_opt5
        label: Tin tưởng vào bản backup tự động định kỳ 2h sáng nên không cần làm
          gì thêm
      - key: q2_opt6
        label: Bỏ qua bước sao lưu để xử lý gấp cho kịp thời gian
    - key: q2_node3
      prompt: 'Bước 3: Phương án cập nhật trạng thái các đơn hàng bị kẹt.'
      options:
      - key: q2_opt7
        label: Viết script cập nhật chia theo batch 100 bản ghi/lần, dùng DB Transaction
      - key: q2_opt8
        label: Gọi API của hãng vận chuyển bên thứ ba để yêu cầu HỦY TOÀN BỘ vận đơn
          thật
      - key: q2_opt9
        label: Mở DBeaver kết nối Prod và sửa thủ công trực tiếp trên UI grid
    - key: q2_node4
      prompt: 'Bước 4: Xử lý tiền hàng của các đơn bị hủy do lỗi hệ thống.'
      options:
      - key: q2_opt10
        label: Xuất danh sách lập file đối soát gửi bộ phận Kế toán thẩm định trước
      - key: q2_opt11
        label: Gọi trực tiếp API Ngân hàng tự động chuyển tiền hoàn lại tới tài khoản
          khách
      - key: q2_opt12
        label: Chuyển trạng thái trong DB thành `REFUNDED` nhưng không phát lệnh hoàn
          tiền
    - key: q2_node5
      prompt: 'Bước 5: Đặt lịch cho tác vụ cập nhật chạy tự động (Cronjob).'
      options:
      - key: q2_opt13
        label: Cấu hình Cronjob chạy lúc 2h sáng (giờ thấp điểm) có ghi log output
      - key: q2_opt14
        label: Đặt Cronjob chạy lặp lại mỗi 5 giây một lần trên Production
      - key: q2_opt15
        label: Cho phép Cronjob chạy dưới quyền user `root` không giới hạn memory
    - key: q2_node6
      prompt: 'Bước 6: Phát thông báo SMS Brandname tới khách hàng có đơn hàng bị
        ảnh hưởng.'
      options:
      - key: q2_opt16
        label: Kiểm tra mẫu tin nhắn trên Staging trước khi bật tính năng gửi trên
          Prod
      - key: q2_opt17
        label: Bắn ngay 100,000 tin nhắn SMS thật với nội dung chưa duyệt 'Khach hang
          lien he lai shop'
      - key: q2_opt18
        label: Tắt hẳn việc gửi SMS để tiết kiệm chi phí dịch vụ telecom
    - key: q2_node7
      prompt: 'Bước 7: Đồng bộ dữ liệu đơn hàng sau khi sửa sang Elasticsearch cluster.'
      options:
      - key: q2_opt19
        label: Sử dụng Kafka Connect CDC để đồng bộ bất đồng bộ sang Elasticsearch
      - key: q2_opt20
        label: Chạy lệnh REST API `DELETE /_all` trên Elasticsearch để re-index lại
          từ đầu
      - key: q2_opt21
        label: Gọi API Elasticsearch đồng bộ từng bản ghi một trong vòng lặp `for`
