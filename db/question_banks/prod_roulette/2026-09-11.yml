  difficulty: medium
- content:
    scenario: Hệ thống Thương mại Điện tử đang gặp sự cố lệch số dư ví và hoàn tiền
      chậm cho khách hàng trong đợt khuyến mãi. Bạn (Dev/BA) được cấp quyền khắc phục
      sự cố và kiểm thử trực tiếp tính năng hoàn tiền tự động (Auto-refund) trên môi
      trường Production.
    nodes:
    - key: q1_node_1
      prompt: 'Bước 1: Bạn cần chuẩn bị tài khoản và dữ liệu để kiểm thử luồng hoàn
        tiền. Bạn xử lý thế nào?'
      options:
      - key: q1_opt_1a
        label: Tạo một tài khoản test nội bộ trên Production với cờ is_test_account=true
          trong cơ sở dữ liệu.
      - key: q1_opt_1b
        label: Lấy trực tiếp ID đơn hàng đang bị lỗi của khách hàng thật để dùng làm
          dữ liệu test.
      - key: q1_opt_1c
        label: Gọi trực tiếp API của Cổng thanh toán để kích hoạt lệnh hoàn tiền cho
          một đơn hàng thật của khách.
    - key: q1_node_2
      prompt: 'Bước 2: Bạn cần xác nhận cấu hình kết nối API Cổng thanh toán (Payment
        Gateway API) trên Production.'
      options:
      - key: q1_opt_2a
        label: Mở file config appsettings.Production.json ở chế độ Read-Only để kiểm
          tra endpoint và timeout.
      - key: q1_opt_2b
        label: Đổi tạm API Key trong file config trên server Prod sang Sandbox Key
          để test thử mà không thông báo team DevOps.
      - key: q1_opt_2c
        label: Gửi request thật đến Cổng thanh toán bằng Production API Key với số
          tiền 1.000 VNĐ để test kết nối.
    - key: q1_node_3
      prompt: 'Bước 3: Bạn cần chạy script quét các giao dịch chờ hoàn tiền refund_processor.py.'
      options:
      - key: q1_opt_3a
        label: Chạy script với tham số --dry-run --limit=5 để kiểm tra kết quả giả
          lập ra màn hình console.
      - key: q1_opt_3b
        label: Chạy trực tiếp script python refund_processor.py --limit=5 trên server
          Prod mà không có cờ dry-run.
      - key: q1_opt_3c
        label: Kích hoạt chức năng tự động gửi email thông báo 'Đã hoàn tiền' cho
          500 khách hàng nằm trong danh sách chờ.
    - key: q1_node_4
      prompt: 'Bước 4: Bạn cần kiểm tra nhật ký hệ thống (System Logs) trong quá trình
        xử lý hoàn tiền.'
      options:
      - key: q1_opt_4a
        label: Sử dụng lệnh tail -n 100 -f /var/log/refund.log để theo dõi các dòng
          log mới nhất.
      - key: q1_opt_4b
        label: Bật cờ LOG_LEVEL=DEBUG cho toàn bộ hệ thống Production để ghi lại chi
          tiết mọi payload API.
      - key: q1_opt_4c
        label: Thực hiện xóa log cũ rm -rf /var/log/refund* và kích hoạt SMS OTP xác
          nhận đến số điện thoại thật của khách hàng.
    - key: q1_node_5
      prompt: 'Bước 5: Bạn kiểm tra việc cập nhật số dư ví người dùng (User Wallet)
        sau khi refund.'
      options:
      - key: q1_opt_5a
        label: Truy vấn SELECT balance FROM user_wallets WHERE user_id = TEST_ID trên
          DB Read-Replica.
      - key: q1_opt_5b
        label: Chạy lệnh UPDATE user_wallets SET balance = balance + 500000 WHERE
          user_id = TEST_ID trên DB Primary.
      - key: q1_opt_5c
        label: Gọi API chuyển tiền thật từ tài khoản ngân hàng doanh nghiệp vào ví
          người dùng thật qua dịch vụ Chi hộ.
    - key: q1_node_6
      prompt: 'Bước 6: Bạn cần kiểm tra hóa đơn GTGT điện tử (E-Invoice) phát sinh
        từ giao dịch hoàn tiền.'
      options:
      - key: q1_opt_6a
        label: Xuất bản ghi hóa đơn dưới dạng file nháp Draft PDF và lưu vào thư mục
          /tmp để kiểm tra thông tin.
      - key: q1_opt_6b
        label: Cập nhật trực tiếp status = 'CANCELLED' trong bảng e_invoices trên
          Prod DB có bản backup.
      - key: q1_opt_6c
        label: Ký số và gửi hóa đơn điều chỉnh giảm thật lên hệ thống của Cơ quan
          Thuế qua API đối tác hoá đơn.
    - key: q1_node_7
      prompt: 'Bước 7: Kiểm tra dịch vụ thông báo đẩy (Push Notification) đến ứng
        dụng di động của khách hàng.'
      options:
      - key: q1_opt_7a
        label: Gửi Push Notification test chỉ định rõ device_token của thiết bị di
          động cá nhân người kiểm thử.
      - key: q1_opt_7b
        label: Tắt tạm dịch vụ Queue Worker xử lý Push Notification để ngăn tin nhắn
          đi ra ngoài.
      - key: q1_opt_7c
        label: Bấm nút Broadcast Notification phát thông báo hoàn tiền thành công
          đến toàn bộ 100.000 người dùng app.
    - key: q1_node_8
      prompt: 'Bước 8: Phát hiện một giao dịch bị lỗi nạp trùng tiền vào ví test.
        Bạn xử lý xung đột dữ liệu này ra sao?'
      options:
      - key: q1_opt_8a
        label: Thực hiện ROLLBACK TRANSACTION trong SQL Client và ghi nhận lại nguyên
          nhân lỗi logic code.
      - key: q1_opt_8b
        label: Chạy lệnh SQL DELETE FROM wallet_transactions WHERE id = DUP_ID trên
          Production DB.
      - key: q1_opt_8c
        label: Tự động kích hoạt API bù đắp phát mã voucher giảm giá 200k thật cho
          tài khoản khách hàng.
    - key: q1_node_9
      prompt: 'Bước 9: Dọn dẹp dữ liệu thử nghiệm trên hệ thống Production.'
      options:
      - key: q1_opt_9a
        label: Đổi trạng thái tài khoản test thành is_active=false và archive các
          bản ghi test theo đúng quy trình audit.
      - key: q1_opt_9b
        label: Chạy lệnh DROP TABLE temp_refund_test_data trực tiếp trên Prod DB khi
          chưa kiểm tra bảng phụ thuộc.
      - key: q1_opt_9c
        label: Gọi API hủy giao dịch thanh toán thật phía Ngân hàng làm đứt quãng
          giao dịch đang diễn ra của khách hàng.
    - key: q1_node_10
      prompt: 'Bước 10: Bàn giao và kết thúc ca xử lý sự cố hoàn tiền.'
      options:
      - key: q1_opt_10a
        label: Tạo báo cáo Post-Mortem, cập nhật trạng thái ticket trên JIRA và bàn
          giao lại cho vận hành.
      - key: q1_opt_10b
        label: Để nguyên tham số DEBUG_MODE=true trên server Production và đóng ticket
          JIRA.
      - key: q1_opt_10c
        label: Trigger Webhook tự động phát tin nhắn SMS cảm ơn và xác nhận hoàn tiền
          thành công cho danh sách khách hàng.
