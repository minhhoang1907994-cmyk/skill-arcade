- content:
    scenario: Hệ thống CRM công ty Retail đột ngột bị nghẽn DB vào ngày cuối tháng
      do tiến trình tự động tổng hợp báo cáo doanh thu và gửi email nhắc nợ chạy song
      song với giờ cao điểm bán hàng.
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: CPU của PostgreSQL Master node tăng vọt lên 99%. Bạn kiểm tra
        nguồn gốc truy vấn gây chậm bằng cách nào?'
      options:
      - key: q2_n1_a
        label: Chạy query `SELECT * FROM pg_stat_activity WHERE state = 'active' ORDER
          BY duration DESC;` để tìm long-running query.
      - key: q2_n1_b
        label: Khởi động lại ngay lập tức Service Database PostgreSQL để giải phóng
          CPU.
      - key: q2_n1_c
        label: Xóa toàn bộ các bảng temporary trong Database.
    - key: q2_n2
      prompt: 'Bước 2: Phát hiện query `SELECT COUNT(*) FROM orders WHERE created_at
        >= ...` thiếu Index đang gây Full Table Scan trên 80 triệu dòng.'
      options:
      - key: q2_n2_a
        label: Tạo Index bằng lệnh `CREATE INDEX CONCURRENTLY idx_orders_created_at
          ON orders(created_at);`.
      - key: q2_n2_b
        label: Tạo Index bằng lệnh trực tiếp `CREATE INDEX idx_orders_created_at ON
          orders(created_at);` trong giờ cao điểm.
      - key: q2_n2_c
        label: Bỏ qua việc đánh Index và yêu cầu đội Data Analytic không chạy báo
          cáo nữa.
    - key: q2_n3
      prompt: 'Bước 3: Dịch vụ gửi email thông báo công nợ tự động đang bị tắc nghẽn
        queue. Bạn kiểm tra tiến trình gửi email.'
      options:
      - key: q2_n3_a
        label: Kiểm tra log của Cronjob Worker đang đảm nhận nhiệm vụ gửi email.
      - key: q2_n3_b
        label: Kích hoạt lệnh manual trigger gửi lại email cho toàn bộ danh sách 100.000
          khách hàng nợ tiền.
      - key: q2_n3_c
        label: Tắt dịch vụ SMTP Server trên hệ thống.
    - key: q2_n4
      prompt: 'Bước 4: Cần xử lý các email thông báo công nợ bị kẹt trong đợt nghẽn
        vừa qua.'
      options:
      - key: q2_n4_a
        label: Lọc danh sách email chưa được gửi và thực hiện đẩy lại vào Queue theo
          từng batch nhỏ (100 email/lần).
      - key: q2_n4_b
        label: Thực hiện script bypass check trạng thái, gửi email nhắc nợ kèm link
          thanh toán thực tế tới danh sách người dùng thật.
      - key: q2_n4_c
        label: Hủy toàn bộ lượt gửi email của tháng này.
    - key: q2_n5
      prompt: 'Bước 5: Một truy vấn chiếm dụng lock trên bảng `invoices` làm gián
        đoạn việc xuất hóa đơn bán hàng. Bạn giải phóng lock bằng cách nào?'
      options:
      - key: q2_n5_a
        label: Sử dụng `SELECT pg_cancel_backend(pid);` đối với Process ID gây nghẽn
          sau khi xác minh.
      - key: q2_n5_b
        label: Dùng `kill -9` trực tiếp tiến trình chính của PostgreSQL trên Server
          Linux.
      - key: q2_n5_c
        label: Chờ đợi truy vấn tự kết thúc mặc dù đã chạy hơn 2 tiếng.
    - key: q2_n6
      prompt: 'Bước 6: Tải truy vấn đọc báo cáo vẫn cao. Bạn cân nhắc điều hướng truy
        vấn đọc báo cáo đi đâu?'
      options:
      - key: q2_n6_a
        label: Cấu hình ứng dụng báo cáo chỉ kết nối tới DB Read-Replica (Slave Node).
      - key: q2_n6_b
        label: Trỏ thẳng ứng dụng báo cáo vào DB Master phụ để chia tải.
      - key: q2_n6_c
        label: Tắt bớt 1 node Replica để tiết kiệm chi phí Cloud.
    - key: q2_n7
      prompt: 'Bước 7: Cache Redis lưu trữ danh mục sản phẩm bị đầy dung lượng (Out
        of Memory) làm ứng dụng bị treo.'
      options:
      - key: q2_n7_a
        label: Điều chỉnh chính sách maxmemory-policy thành `allkeys-lru` trên Redis
          config.
