  difficulty: hard
- content:
    scenario: Bạn là BA/Dev chịu trách nhiệm xử lý sự cố đồng bộ dữ liệu thông báo
      giữa CRM và Notification Service trên Production. RabbitMQ queue đang bị dồn
      tích 200.000 tin nhắn chưa được xử lý.
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: Queue `user_push_notification` tăng đột biến lên 200.000 messages.
        Bạn kiểm tra điều gì trước?'
      options:
      - key: opt_q2_n1_a
        label: Kiểm tra số lượng Consumer Worker đang active và tốc độ xử lý msg/sec
      - key: opt_q2_n1_b
        label: Purge sạch toàn bộ 200.000 message trong Queue để hết nghẽn
      - key: opt_q2_n1_c
        label: Khởi động lại RabbitMQ broker service
    - key: q2_n2
      prompt: 'Bước 2: Phát hiện worker bị crash do lỗi `Out of Memory` khi parse
        JSON thông báo quá lớn.'
      options:
      - key: opt_q2_n2_a
        label: Sửa code giới hạn dung lượng payload, pass message lỗi sang Dead Letter
          Queue (DLQ) để xử lý sau
      - key: opt_q2_n2_b
        label: Tăng Memory Limit của Docker container lên gấp 10 lần mà không sửa
          code
      - key: opt_q2_n2_c
        label: Bỏ qua bước parse JSON, ghi đè toàn bộ payload thành chuỗi rỗng
    - key: q2_n3
      prompt: 'Bước 3: Cần kích hoạt dịch vụ Push Notification bên thứ 3 (Firebase
        Cloud Messaging - FCM) để đẩy bớt tin nhắn dồn.'
      options:
      - key: opt_q2_n3_a
        label: Kiểm tra FCM Server Key và quota giới hạn theo phút trước khi gửi
      - key: opt_q2_n3_b
        label: Bật max thread gửi request liên tục tới FCM API mà không áp dụng Rate
          Limiter
      - key: opt_q2_n3_c
        label: Thay đổi Server Key FCM thành Key môi trường Sandbox
    - key: q2_n4
      prompt: 'Bước 4: Bạn muốn gửi thông báo kiểm tra đến 1 tài khoản test nội bộ
        trên Production.'
      options:
      - key: opt_q2_n4_a
        label: Lấy FCM Token của thiết bị test và gọi API push trực tiếp tới token
          đó
      - key: opt_q2_n4_b
        label: Gửi Push Notification đến topic `all_active_users` trên Production
          chứa 500.000 người dùng thật
      - key: opt_q2_n4_c
        label: Chạy query UPDATE toàn bộ token người dùng trong DB thành token test
    - key: q2_n5
      prompt: 'Bước 5: Cần lọc ra danh sách người dùng bị trùng lặp thông báo trong
        quá trình queue bị nghẽn.'
      options:
      - key: opt_q2_n5_a
        label: Viết query `GROUP BY user_id, message_id HAVING COUNT(*) > 1` trên
          Read Replica
      - key: opt_q2_n5_b
        label: Chạy query `SELECT DISTINCT *` trên Master DB giữa giờ cao điểm
      - key: opt_q2_n5_c
        label: Export toàn bộ bảng `notifications` 50 triệu dòng ra file CSV để dùng
          Excel lọc
    - key: q2_n6
      prompt: 'Bước 6: Cần làm sạch dữ liệu notification trùng lặp đã tạo trong cơ
        sở dữ liệu Postgres.'
      options:
      - key: opt_q2_n6_a
        label: Tạo bản Backup table, chạy script xóa trùng lặp theo Batch 1000 record/lần
          trong Transaction
      - key: opt_q2_n6_b
        label: Chạy lệnh `DELETE FROM notifications` không có điều kiện WHERE
      - key: opt_q2_n6_c
        label: TRUNCATE TABLE `notifications` để nạp lại từ đầu
    - key: q2_n7
      prompt: 'Bước 7: Webhook nhận sự kiện từ CRM gửi sang bị ném lỗi HTTP 500.'
      options:
      - key: opt_q2_n7_a
        label: Mở log của Webhook Receiver service kiểm tra Stack Trace lỗi
      - key: opt_q2_n7_b
        label: Tắt tính năng verify Signature Header của Webhook để cho qua hết
      - key: opt_q2_n7_c
        label: Trả về HTTP 200 OK giả lập cho CRM dù code bên trong bị crash
    - key: q2_n8
      prompt: 'Bước 8: Kiểm tra log tích hợp đối tác qua Elasticsearch.'
      options:
      - key: opt_q2_n8_a
        label: Query log theo timeframe cụ thể và log_level = ERROR
      - key: opt_q2_n8_b
        label: Xoá Index log hiện tại trên Elasticsearch để giải phóng dung lượng
          ổ đĩa
      - key: opt_q2_n8_c
        label: Gửi request wildcard `DELETE /_all` tới Elasticsearch Cluster
    - key: q2_n9
      prompt: 'Bước 9: Khôi phục lại luồng đẩy thông báo tự động.'
      options:
      - key: opt_q2_n9_a
        label: Mở lại Consumer theo cơ chế Throttling (tăng dần từ 10% đến 100% capacity)
      - key: opt_q2_n9_b
        label: Mở tối đa 100 worker cùng lúc ngay lập tức
      - key: opt_q2_n9_c
        label: Chỉ bật Consumer vào ban đêm và tắt vào ban ngày
    - key: q2_n10
      prompt: 'Bước 10: Tổng kết sự cố và cập nhật phương án phòng ngừa.'
      options:
      - key: opt_q2_n10_a
        label: Viết tài liệu Post-mortem, bổ sung Alerting quy định ngưỡng Queue size
          > 10.000
      - key: opt_q2_n10_b
        label: Đóng Ticket sự cố và không cần ghi chép nguyên nhân
      - key: opt_q2_n10_c
        label: Đổ lỗi cho phía đối tác CRM làm gián đoạn dịch vụ
