  difficulty: hard
- content:
    scenario: Chuẩn bị diễn ra Sự kiện Sinh nhật ứng dụng FinTech với chương trình
      tặng Referral Points và Voucher giảm giá cho 2 triệu người dùng active.
    nodes:
    - key: s2_node_1
      prompt: Cần gửi thông báo Push Notification tới tệp khách hàng thỏa điều kiện
        tham gia sự kiện.
      options:
      - key: s2_opt_1_1
        label: Lọc danh sách segmented_users trên Read-Replica DB và đẩy qua tin nhắn
          hẹn giờ qua FCM Queue.
      - key: s2_opt_1_2
        label: Chạy câu lệnh SELECT * FROM users trên DB Master không phân trang để
          lấy danh sách SĐT.
      - key: s2_opt_1_3
        label: Bắn trực tiếp Push Notification thử nghiệm nội dung 'TEST PUSH 123'
          tới TOÀN BỘ 2 triệu user PROD.
    - key: s2_node_2
      prompt: Cấu hình giới hạn số điểm thưởng giới thiệu tối đa mỗi ngày (max_reward_points_per_day).
      options:
      - key: s2_opt_2_1
        label: Cập nhật tham số max_reward_points_per_day = 100 trong bảng system_settings
          qua Admin Portal.
      - key: s2_opt_2_2
        label: Set max_reward_points_per_day = 0 (không giới hạn) để test luồng cộng
          điểm cho nhanh.
      - key: s2_opt_2_3
        label: Hardcode điểm thưởng 1,000,000 điểm trực tiếp trong source code Python
          và deploy gấp lên PROD.
    - key: s2_node_3
      prompt: Phát hành mã Voucher SINHNAT50 cho người dùng nhanh tay đổi quà.
      options:
      - key: s2_opt_3_1
        label: Cài đặt Voucher kèm usage_limit = 1000 và per_user_limit = 1.
      - key: s2_opt_3_2
        label: Tạo Voucher SINHNAT50 nhưng quên thiết lập tham số usage_limit trên
          DB PROD.
      - key: s2_opt_3_3
        label: Phát hành ngay 10,000 e-voucher thật mã đổi quà sang SMS Brandname
          cho danh sách SĐT trong DB.
    - key: s2_node_4
      prompt: Cần đánh giá sức chịu tải của hệ thống trước khi chiến dịch diễn ra
