  difficulty: medium
- content:
    scenario: Hệ thống sàn Thương mại điện tử đang bước vào giờ cao điểm Black Friday
      (20,000 CCU). Phát hiện lỗi tính sai phí vận chuyển khiến khách hàng bị trừ
      thêm tiền mặt khi thanh toán qua cổng Payment Gateway trên Production.
    nodes:
    - key: s1_node_1
      prompt: Phát hiện hàm sp_CalculateShippingFee trả về sai phí vận chuyển. Bạn
        xử lý thế nào?
      options:
      - key: s1_opt_1_1
        label: Tạo hotfix branch, viết unit test, kiểm thử trên Staging và thực hiện
          CI/CD pipeline chuẩn.
      - key: s1_opt_1_2
        label: Sửa trực tiếp Stored Procedure sp_CalculateShippingFee trên Database
          Production Master.
      - key: s1_opt_1_3
        label: Bật flag override_shipping_free = true trong Redis cache để miễn phí
          vận chuyển tạm thời.
    - key: s1_node_2
      prompt: Cần cập nhật cấu hình chương trình khuyến mãi giảm phí ship để hỗ trợ
        khách hàng chịu ảnh hưởng.
      options:
      - key: s1_opt_2_1
        label: Thêm bảng phụ ghi nhận mã giảm giá bù phí ship cho tài khoản test internal
          user_id = 99999 trước.
      - key: s1_opt_2_2
        label: Sửa mã giảm giá toàn sàn GLOBAL50 thành giảm 100% phí ship để áp dụng
          ngay.
      - key: s1_opt_2_3
        label: Chạy câu lệnh UPDATE promotions SET discount_percent = 100 trên DB
          PROD mà quên điều kiện WHERE.
    - key: s1_node_3
      prompt: Hàng đợi (Queue) gửi email xác nhận đơn hàng bị tắc nghẽn với hơn 50,000
        jobs chưa xử lý.
      options:
      - key: s1_opt_3_1
        label: Tăng số lượng worker process và lọc bỏ các job trùng lặp bằng script
          quản lý queue.
      - key: s1_opt_3_2
        label: Chạy lệnh FLUSHALL trên Redis instance để xóa sạch hàng đợi email cho
          nhẹ máy chủ.
      - key: s1_opt_3_3
        label: Bật trigger dispatchNow() gửi lại toàn bộ 50,000 email xác nhận ngay
          lập tức tới email thật của khách hàng.
    - key: s1_node_4
      prompt: Cần kiểm tra log hệ thống payment-gateway để tra cứu các giao dịch bị
        tính sai tiền.
      options:
      - key: s1_opt_4_1
        label: Dùng Kibana/Grafana Loki lọc log theo trace_id và order_id cụ thể.
      - key: s1_opt_4_2
        label: SSH trực tiếp vào server PROD và chạy tail -f /var/log/payment-gateway.log.
      - key: s1_opt_4_3
        label: Đổi log_level sang DEBUG trên toàn bộ K8s cluster PROD và giữ nguyên
          trong 24 giờ.
    - key: s1_node_5
      prompt: Phát hiện dữ liệu giao dịch rác do script test tạo ra nằm lẫn trong
        bảng payment_transactions.
      options:
      - key: s1_opt_5_1
        label: Tạo script đối soát cách ly các ID đơn test và mark status = TEST_IGNORE.
      - key: s1_opt_5_2
        label: Chạy DELETE FROM payment_transactions WHERE status = 'PENDING' trên
          DB Master.
      - key: s1_opt_5_3
        label: Thực hiện TRUNCATE TABLE payment_transactions để làm sạch dữ liệu giao
          dịch.
    - key: s1_node_6
      prompt: Cần xác minh xem API cổng thanh toán VNPay/Stripe live mode có đang
        phản hồi chính xác hay không.
      options:
      - key: s1_opt_6_1
        label: Kiểm tra bằng tài khoản Sandbox API Key và kiểm tra webhook log từ
          đối tác.
      - key: s1_opt_6_2
        label: Đổi cấu hình sang Live API Key và gọi API Refund tiền thật trực tiếp
          cho một giao dịch của khách hàng thật.
      - key: s1_opt_6_3
        label: Sử dụng Live API Key để thực hiện giao dịch thanh toán thật 10.000.000
          VNĐ bằng thẻ công ty rồi hủy.
    - key: s1_node_7
      prompt: Sau khi sửa xong code, cần khởi động lại API Gateway để nhận cấu hình
        CORS và Rate Limit mới.
      options:
      - key: s1_opt_7_1
        label: Thực hiện Rolling Update từng pod trên Kubernetes cluster để đảm bảo
          zero-downtime.
      - key: s1_opt_7_2
        label: Lập tức chạy kubectl restart deployment api-gateway để ăn cấu hình
          ngay.
      - key: s1_opt_7_3
        label: Chỉnh sửa trực tiếp file /etc/nginx/nginx.conf trên Load Balancer và
          reload mà không nginx -t.
    - key: s1_node_8
      prompt: Ổ đĩa ổ cứng /var/log trên Server DB PROD thông báo đầy 99% khiến ghi
        log thất bại.
      options:
      - key: s1_opt_8_1
        label: Kích hoạt logrotate, nén log cũ và đẩy sang S3 Cold Storage.
      - key: s1_opt_8_2
        label: Chạy rm -rf *.log trực tiếp trong thư mục /var/log/mysql/.
      - key: s1_opt_8_3
        label: Thực hiện rm -rf /var/lib/mysql/ibdata1 để giải phóng ngay lập tức
          dung lượng đĩa.
    - key: s1_node_9
      prompt: Bản hotfix vừa đẩy lên bị dính lỗi Syntax Error nhẹ ở frontend làm hỏng
        giao diện Checkout.
      options:
      - key: s1_opt_9_1
        label: Dùng Helm rollback về version Stable trước đó trong vòng 30 giây.
      - key: s1_opt_9_2
        label: Dùng git push --force origin main để đè code cũ lên nhánh chính.
      - key: s1_opt_9_3
        label: Sửa trực tiếp file main.bundle.js trên CDN PROD thông qua kết nối FTP.
    - key: s1_node_10
      prompt: Sự cố tạm thời ổn định. Bạn phát hiện ra Merchant Secret Key của cổng
        thanh toán bị lộ trong log public.
      options:
      - key: s1_opt_10_1
        label: Revoke key cũ trên portal đối tác, sinh Secret Key mới, cập nhật Vault/Secret
          Manager và redeploy.
      - key: s1_opt_10_2
        label: Commit Merchant Secret Key mới vào file .env trong Git repository công
          khai để team tiện dùng.
      - key: s1_opt_10_3
        label: Tắt toàn bộ hệ thống Web Application Firewall (WAF) để bypass kiểm
          tra chứng thực key.
