      options:
      - key: s2_opt_4_1
        label: Chạy kịch bản Load Test trên môi trường Staging cách ly với quy mô
          dữ liệu giả lập.
      - key: s2_opt_4_2
        label: Dùng Locust/JMeter bắn 10,000 req/s trực tiếp vào API PROD https://api.company.com/v1/checkout.
      - key: s2_opt_4_3
        label: Tắt tạm thời Redis Cache Cluster trên PROD để test khả năng chịu tải
          thuần của DB Master.
    - key: s2_node_5
      prompt: Cập nhật Banner quảng cáo sự kiện lên ứng dụng mobile.
      options:
      - key: s2_opt_5_1
        label: Upload ảnh chuẩn 200KB lên AWS S3 CDN và purge cache Cloudflare.
      - key: s2_opt_5_2
        label: Thay URL banner thành một link ảnh HTTP không có SSL từ một website
          cá nhân bên ngoài.
