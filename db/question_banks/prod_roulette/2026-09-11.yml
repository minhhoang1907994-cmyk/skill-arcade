  difficulty: hard
- content:
    scenario: Hệ thống Loyalty của e-commerce đang trong đợt Mega Sale 11/11. Hệ thống
      ghi nhận lỗi tính sai x3 điểm thưởng (loyalty points) cho khách hàng khi thanh
      toán đơn hàng. Bạn cần khắc phục lỗi trực tiếp trên Production trong lúc lưu
      lượng truy cập cực kỳ cao.
    nodes:
    - key: q1_n1
      prompt: 'Bước 1: Hệ thống phát hiện CPU Database Master đạt 98% do vô số request
        tính điểm trùng lặp. Bạn làm gì đầu tiên?'
      options:
      - key: q1_n1_o1
        label: Bật Feature Flag ngắt tạm thời async job tính điểm loyalty để hạ tải
          DB
      - key: q1_n1_o2
        label: Restart ngay lập tức cluster Kubernetes chứa loyalty-service
      - key: q1_n1_o3
        label: Tăng Max Connection trên DB Master lên gấp đôi để xử lý nghẽn
    - key: q1_n2
      prompt: 'Bước 2: Cần truy vấn danh sách 50,000 user bị tính sai điểm để chuẩn
        bị rollback điểm. Bạn truy vấn như thế nào?'
      options:
      - key: q1_n2_o1
        label: Chạy query SELECT trên DB Read-Replica và xuất file CSV
      - key: q1_n2_o2
        label: Chạy query SELECT COUNT và JOIN nhiều bảng trực tiếp trên DB Master
      - key: q1_n2_o3
        label: Lấy thông tin từ Elasticsearch / Log analytical cluster
    - key: q1_n3
      prompt: 'Bước 3: Cần sửa lỗi logic trong code backend (`loyalty-service`). Bạn
        chuẩn bị bản hotfix ra sao?'
      options:
      - key: q1_n3_o1
        label: Tạo branch hotfix từ release tag, viết Unit Test bổ sung và build Docker
          image mới
      - key: q1_n3_o2
        label: Sửa trực tiếp file JS/Python trên container Production đang chạy
      - key: q1_n3_o3
        label: Bỏ qua Unit Test để build image thật nhanh cho kịp tiến độ
    - key: q1_n4
      prompt: 'Bước 4: Cần thu hồi điểm thưởng bị cộng thừa của 50,000 user. Phương
        án cập nhật database là gì?'
      options:
      - key: q1_n4_o1
        label: Chạy script UPDATE theo batch 500 records/lần có log history và transaction
      - key: q1_n4_o2
        label: Chạy lệnh UPDATE trực tiếp 50,000 dòng trong một SQL Transaction duy
          nhất
      - key: q1_n4_o3
        label: Xóa bảng user_points và import lại từ file backup ban sáng
    - key: q1_n5
      prompt: 'Bước 5: Phát hiện có 1,000 user đã lỡ đổi điểm thưởng thừa thành Voucher
        giảm giá thật. Bạn xử lý sao?'
      options:
      - key: q1_n5_o1
        label: Đánh dấu vô hiệu hóa (deactivate) mã Voucher trong DB và ghi nhận log
          điều chỉnh
      - key: q1_n5_o2
        label: Gọi API bên thứ ba tự động gửi SMS thông báo huỷ voucher trực tiếp
          tới số điện thoại thật của 1,000 khách hàng
      - key: q1_n5_o3
        label: Xóa cứng (DELETE) các record voucher đó khỏi bảng database
    - key: q1_n6
      prompt: 'Bước 6: Cache Redis của user profile đang chứa thông tin số điểm cũ
        (bị sai). Xử lý cache như thế nào?'
      options:
      - key: q1_n6_o1
        label: Gửi lệnh Invalidate / Evict theo danh sách user_id cụ thể bị ảnh hưởng
      - key: q1_n6_o2
        label: Chạy lệnh FLUSHALL xoá toàn bộ Redis Cache trên Production
      - key: q1_n6_o3
        label: Để cache tự hết hạn (TTL 24h) không can thiệp
    - key: q1_n7
      prompt: 'Bước 7: Tiến hành deploy bản hotfix backend lên Kubernetes Production
        cluster.'
      options:
      - key: q1_n7_o1
        label: Sử dụng chiến lược RollingUpdate với maxSurge=25% và maxUnavailable=0
      - key: q1_n7_o2
        label: Thực hiện kubectl replace --force xoá tất cả pod cũ cùng lúc
      - key: q1_n7_o3
        label: Deploy theo phương pháp Canary 10% traffic để monitor log trước
    - key: q1_n8
      prompt: 'Bước 8: Cần gửi thông tin đền bù/giải thích cho người dùng bị ảnh hưởng.'
      options:
      - key: q1_n8_o1
        label: Tạo notification in-app dạng tin nhắn hệ thống chờ user mở app mới
          thấy
      - key: q1_n8_o2
        label: Gọi trực tiếp dịch vụ Brandname SMS Provider để bắn 50,000 tin nhắn
          SMS thật
      - key: q1_n8_o3
        label: Đưa vào RabbitMQ queue gửi Email Marketing theo luồng xử lý bất đồng
          bộ
    - key: q1_n9
      prompt: 'Bước 9: Kiểm tra lại các chỉ số hệ thống sau khi triển khai xong hotfix.'
      options:
      - key: q1_n9_o1
        label: Quan sát dashboard Datadog/Grafana về CPU, Memory, Latency và Error
          Rate trong 30 phút
      - key: q1_n9_o2
        label: Thấy server chạy 5 phút không báo lỗi thì đóng ticket ngay
      - key: q1_n9_o3
        label: SSH vào server dùng lệnh tail -f app.log bằng tay
    - key: q1_n10
      prompt: 'Bước 10: Tổng kết sự cố và thực hiện các thủ tục sau sự cố (Post-Incident).'
      options:
      - key: q1_n10_o1
        label: Tổ chức cuộc họp Post-Mortem, phân tích nguyên nhân gốc rễ (RCA) và
          đưa ra Action Items
      - key: q1_n10_o2
        label: Bỏ qua vì hệ thống đã chạy lại bình thường, tránh làm mất thời gian
          team
      - key: q1_n10_o3
        label: Đổ lỗi cho Dev viết sai logic và yêu cầu phạt trừ lương
