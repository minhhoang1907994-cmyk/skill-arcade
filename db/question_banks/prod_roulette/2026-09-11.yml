- content:
    scenario: Thực hiện nâng cấp Microservice Payment Gateway và thực hiện Migration
      Schema Database PostgreSQL trên Production của ứng dụng Fintech vào đêm cuối
      tuần.
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: Trước khi tiến hành bảo trì hạ dịch vụ thanh toán để migrate
        DB, bạn làm gì?'
      options:
      - key: q2_n1_o1
        label: Bật trang Maintenance Page và ngắt kết nối từ API Gateway đến payment-service
      - key: q2_n1_o2
        label: Tiến hành chạy migration trực tiếp khi khách hàng vẫn đang giao dịch
      - key: q2_n1_o3
        label: Kill ngay lập tức tất cả các Process trong Database
    - key: q2_n2
      prompt: 'Bước 2: Chuẩn bị sao lưu dữ liệu trước khi chạy script Migration làm
        đổi tên cột.'
      options:
      - key: q2_n2_o1
        label: Tạo Snapshot DB trên AWS RDS và thực hiện pg_dump snapshot riêng cho
          Schema thanh toán
      - key: q2_n2_o2
        label: Bỏ qua backup vì DB đã có chế độ Auto-Backup hàng ngày
      - key: q2_n2_o3
        label: Copy dữ liệu sang một bảng tạm `payment_orders_bak` cùng DB
    - key: q2_n3
      prompt: 'Bước 3: Thực thi Migration Script thêm cột `qr_code_id` và xóa cột
        cũ `merchant_qr`.'
      options:
      - key: q2_n3_o1
        label: Thực hiện Migration theo chiến lược Expand-and-Contract (giữ cột cũ,
          add cột mới trước)
      - key: q2_n3_o2
        label: Chạy script `ALTER TABLE DROP COLUMN merchant_qr` trực tiếp ngay lập
          tức
      - key: q2_n3_o3
        label: Chạy DDL script mà không set LOCK TIMEOUT
    - key: q2_n4
      prompt: 'Bước 4: Cần kiểm tra tích hợp với cổng thanh toán đối tác (Third-party
        Banking API) trên PROD.'
      options:
      - key: q2_n4_o1
        label: Gửi request kiểm tra với Merchant ID Sandbox / Test Account của đối
          tác
      - key: q2_n4_o2
        label: Thực hiện lệnh gọi API thật `POST /v2/transact` với tài khoản ngân
          hàng thật và số tiền 500,000 VNĐ để test
      - key: q2_n4_o3
        label: Sử dụng Mock Server nội bộ để kiểm tra luồng response
    - key: q2_n5
      prompt: 'Bước 5: Phát hiện 50 giao dịch bị dở dang (pending) trong quá trình
        cắt chuyển hệ thống. Xử lý như thế nào?'
      options:
      - key: q2_n5_o1
        label: Tra cứu trạng thái đối soát từ file log giao dịch và query trạng thái
          qua API đối soát read-only
      - key: q2_n5_o2
        label: Gọi trực tiếp API bên thứ ba `POST /v1/refunds` để hoàn tiền thật lập
          tức cho 50 giao dịch mà chưa kiểm tra trạng thái bên ngân hàng
      - key: q2_n5_o3
        label: Cập nhật thủ công trạng thái các giao dịch đó thành FAILED trong DB
    - key: q2_n6
      prompt: 'Bước 6: Cập nhật Environment Variables và ConfigMap cho phiên bản Payment
        Service v2.'
      options:
      - key: q2_n6_o1
        label: Cập nhật ConfigMap/Secret qua KubeVela/Helm chart và verify lại bằng
          kubectl get configmap
      - key: q2_n6_o2
        label: Sửa trực tiếp plaintext secret vào file deployment.yaml rồi commit
          lên Git public
      - key: q2_n6_o3
        label: Sửa biến môi trường thủ công bằng cách exec vào từng Pod
    - key: q2_n7
      prompt: 'Bước 7: Bắt đầu mở lại traffic cho khách hàng sử dụng dịch vụ thanh
        toán.'
      options:
      - key: q2_n7_o1
        label: Điều hướng 5% traffic qua Canary release, theo dõi dashboard 10 phút
          trước khi tăng dần
      - key: q2_n7_o2
        label: Mở 100% traffic ngay lập tức cho toàn bộ người dùng
      - key: q2_n7_o3
        label: Chỉ mở traffic cho IP của bộ phận QC nội bộ công ty test trước
    - key: q2_n8
      prompt: 'Bước 8: Hệ thống Canary v2 bắt đầu xuất hiện lỗi 500 khi xử lý thanh
        toán từ ứng dụng Mobile cũ. Bạn làm gì?'
      options:
      - key: q2_n8_o1
        label: Rollback traffic Canary về phiên bản v1 và phân tích log lỗi từ Nginx/Sentry
      - key: q2_n8_o2
        label: Giữ nguyên v2 và yêu cầu team App Mobile phải đẩy gấp bản cập nhật
          lên App Store
      - key: q2_n8_o3
        label: SSH vào Pod production cài thêm công cụ debug
    - key: q2_n9
      prompt: 'Bước 9: Sau khi xác định lỗi do v2 chưa backward compatible với Mobile
        App cũ, bạn giải quyết thế nào?'
      options:
      - key: q2_n9_o1
        label: Bổ sung API Adapter layer để hỗ trợ cả request format cũ và mới
      - key: q2_n9_o2
        label: Ép buộc tất cả user phải xoá App cài lại
      - key: q2_n9_o3
        label: Chặn không cho người dùng App cũ thực hiện thanh toán
    - key: q2_n10
      prompt: 'Bước 10: Tình huống đã ổn định. Bạn thực hiện công việc cuối cùng nào?'
      options:
      - key: q2_n10_o1
        label: Cập nhật tài liệu API documentation, thông báo cho các bên liên quan
          và hoàn tất ca trực
      - key: q2_n10_o2
        label: Âm thầm đi ngủ không thông báo gì cho team support
      - key: q2_n10_o3
        label: Xoá toàn bộ log file trong pod để tiết kiệm dung lượng disk
