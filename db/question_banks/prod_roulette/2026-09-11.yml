      - key: s2_opt_6_2
        label: Chạy liên tục lệnh KEYS * trong Redis CLI PROD để kiểm tra danh sách
          key chiếm dung lượng.
      - key: s2_opt_6_3
        label: Thực hiện lệnh FLUSHDB trên Redis PROD để giải phóng bộ nhớ ngay tức
          khắc.
    - key: s2_node_7
      prompt: Đồng bộ dữ liệu người dùng đổi quà thành công sang hệ thống API của
        đối tác quà tặng (Đối tác bên thứ ba).
      options:
      - key: s2_opt_7_1
        label: Đưa event đổi quà vào RabbitMQ Queue và gọi API đối tác qua worker
          async có retry exponential backoff.
      - key: s2_opt_7_2
        label: Gọi API đối tác bằng vòng lặp for đồng bộ (synchronous HTTP call) ngay
          trên Main API Request Thread.
      - key: s2_opt_7_3
        label: Kích hoạt tính năng Auto-Approve đổi quà thật trị giá 500.000đ trên
          Live API đối tác không cần OTP.
    - key: s2_node_8
      prompt: Phát hiện dấu hiệu tấn công Sybil (tạo hàng nghìn tài khoản giả để gian
        lận Referral Points).
