  difficulty: medium
- content:
    scenario: Bạn đang trực ca vận hành hệ thống thanh toán E-Commerce trên Production
      chỉ 30 phút trước giờ Flash Sale 12/12. Hệ thống đang ghi nhận 50.000 active
      sessions và có dấu hiệu nghẽn giao dịch.
    nodes:
    - key: q1_n1
      prompt: 'Bước 1: Hệ thống ghi nhận latency API thanh toán tăng từ 200ms lên
        4500ms. Bạn làm gì đầu tiên?'
      options:
      - key: opt_q1_n1_a
        label: Kiểm tra Dashboard Grafana và APM log để chỉ ra service bottleneck
          cụ thể
      - key: opt_q1_n1_b
        label: Khởi động lại ngay lập tức toàn bộ Cluster Payment Service trên Production
      - key: opt_q1_n1_c
        label: Tăng gấp đôi số lượng Pod trong Kubernetes deployment mà không kiểm
          tra DB pool
    - key: q1_n2
      prompt: 'Bước 2: Phát hiện Database Connection Pool của bảng order_db đã đạt
        ngưỡng 98%. Bạn xử lý thế nào?'
      options:
      - key: opt_q1_n2_a
        label: Tăng max_connections của PostgreSQL và reload configuration không restart
      - key: opt_q1_n2_b
        label: Chạy query `SELECT pg_terminate_backend(pid)` cho toàn bộ connection
          đang ở trạng thái idle
      - key: opt_q1_n2_c
        label: Chạy script DROP INDEX các bảng giao dịch cũ để giải phóng bộ nhớ DB
    - key: q1_n3
      prompt: 'Bước 3: Cần xác minh dữ liệu voucher cho đợt Flash Sale đã sẵn sàng
        trong Redis Cache chưa.'
      options:
      - key: opt_q1_n3_a
        label: Dùng lệnh `KEYS voucher:*` trực tiếp trên Redis Cluster Production
          để kiểm tra
      - key: opt_q1_n3_b
        label: Dùng lệnh `SCAN` kết hợp script check theo batch nhỏ trên Read Replica
          Redis
      - key: opt_q1_n3_c
        label: Thực hiện `FLUSHALL` để đảm bảo Redis sạch dữ liệu trước khi warmup
          lại
    - key: q1_n4
      prompt: 'Bước 4: Cần test thử luồng gửi SMS OTP xác thực thanh toán ví điện
        tử trên Prod.'
      options:
      - key: opt_q1_n4_a
        label: Cấu hình số điện thoại test cá nhân vào whitelist để nhận 1 SMS OTP
          thử nghiệm
      - key: opt_q1_n4_b
        label: Thực hiện kích hoạt lại trigger gửi SMS OTP hàng loạt cho tất cả giao
          dịch pending trước đó
      - key: opt_q1_n4_c
        label: Chạy script test broadcast tin nhắn OTP thử nghiệm đến danh sách 10.000
          khách hàng thật
    - key: q1_n5
      prompt: 'Bước 5: Phát hiện 15 transaction bị kẹt trạng thái ''PROCESSING'' do
        Timeout kết nối Cổng thanh toán.'
      options:
      - key: opt_q1_n5_a
        label: Chạy job đối soát (Reconciliation) gọi API Query Status từ đối tác
          để cập nhật lại state
      - key: opt_q1_n5_b
        label: Update thủ công `status = 'SUCCESS'` trực tiếp trong SQL cho cả 15
          order để giải quyết khiếu nại nhanh
      - key: opt_q1_n5_c
        label: Xoá bỏ 15 record bị kẹt khỏi cơ sở dữ liệu để tránh ảnh hưởng đến báo
          cáo
    - key: q1_n6
      prompt: 'Bước 6: Đối tác cổng thanh toán yêu cầu hoàn tiền thử nghiệm cho 1
        giao dịch lỗi test.'
      options:
      - key: opt_q1_n6_a
        label: Mock API Refund trên môi trường Staging và gửi kết quả log cho phía
          đối tác
      - key: opt_q1_n6_b
        label: Bấm nút 'Hoàn tiền' trực tiếp trên Portal Live Gateway cho giao dịch
          thật của người dùng thật
      - key: opt_q1_n6_c
