  difficulty: medium
- content:
    scenario: Nâng cấp và cấu hình tích hợp cổng thanh toán mới (Payment Gateway)
      kết nối ngân hàng đối tác trên hệ thống Production.
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: Kiểm tra tài liệu tích hợp và biến môi trường (Environment
        Variables).'
      options:
      - key: q2_n1_o1
        label: Rà soát file `.env` PROD, đảm bảo các biến URL và Secret Key khớp với
          tài liệu Production từ Ngân hàng.
      - key: q2_n1_o2
        label: Thay đổi URL Endpoint sang cổng PROD Ngân hàng nhưng giữ nguyên `MERCHANT_KEY`
          môi trường Staging.
      - key: q2_n1_o3
        label: Hardcode trực tiếp Private Key Production vào file source code và commit
          lên Git repository.
    - key: q2_n2
      prompt: 'Bước 2: Thực hiện nâng cấp cấu trúc Database (Migration Schema) cho
        bảng thanh toán.'
      options:
      - key: q2_n2_o1
        label: Chạy script migration thông qua CI/CD Pipeline có sẵn phương án Rollback
          tự động.
      - key: q2_n2_o2
        label: Mở GUI SQL Client và gõ lệnh `ALTER TABLE transactions ADD COLUMN checksum
          VARCHAR(255)` trực tiếp vào giờ cao điểm.
      - key: q2_n2_o3
        label: Xoá bỏ các Foreign Key và Index cũ trên bảng `transactions` để câu
          lệnh ALTER TABLE chạy nhanh hơn.
    - key: q2_n3
      prompt: 'Bước 3: Cấu hình Webhook Callback nhận kết quả giao dịch từ Ngân hàng.'
      options:
      - key: q2_n3_o1
        label: Cấu hình Webhook Endpoint có xác thực chữ ký số HMAC và Whitelist danh
          sách IP Ngân hàng.
      - key: q2_n3_o2
        label: Tắt tính năng Verify HMAC Signature trên Webhook Controller để tiện
          test giao dịch.
      - key: q2_n3_o3
        label: Điền URL callback của Ngân hàng hướng về đường dẫn tunnel Ngrok cá
          nhân của Lập trình viên.
    - key: q2_n4
      prompt: 'Bước 4: Thực hiện giao dịch thử nghiệm để kiểm tra luồng thanh toán.'
      options:
      - key: q2_n4_o1
        label: Sử dụng tài khoản Test Sandbox do Ngân hàng cấp để thực hiện giao dịch
          thử nghiệm cách ly.
      - key: q2_n4_o2
        label: Dùng thẻ ngân hàng cá nhân thực hiện 1 giao dịch nạp 1.000 VNĐ thật
          trên hệ thống PROD.
      - key: q2_n4_o3
        label: Gửi request gọi API `POST /api/v1/bank/payout` thật để chuyển 50.000.000
          VNĐ kiểm thử luồng hoàn tiền.
    - key: q2_n5
      prompt: 'Bước 5: Cấu hình cơ chế chống giao dịch lặp (Idempotency Key) và Session.'
      options:
      - key: q2_n5_o1
        label: Bật kiểm tra Idempotency Key trên Redis với TTL 24h cho tất cả request
          thanh toán.
      - key: q2_n5_o2
        label: Tăng thời hạn hết hạn (Expiration) của Payment Token từ 15 phút lên
          7 ngày để tránh bị timeout.
      - key: q2_n5_o3
        label: Tắt hoàn toàn middleware kiểm tra `Idempotency-Key` do bị nghẽn bộ
          nhớ Redis.
    - key: q2_n6
      prompt: 'Bước 6: Xử lý quy trình đối soát giao dịch tự động (Reconciliation).'
      options:
      - key: q2_n6_o1
        label: Chạy Cronjob đối soát trong môi trường isolated, so sánh file sếp lịch
          đối soát từ Ngân hàng và DB.
      - key: q2_n6_o2
        label: Thực hiện lệnh `TRUNCATE TABLE reconciliation_logs` trước khi chạy
          tiến trình đối soát mới.
      - key: q2_n6_o3
        label: Bật chế độ `auto-refund` tự động gọi API Ngân hàng hoàn tiền cho mọi
          đơn hàng có chênh lệch trạng thái.
    - key: q2_n7
      prompt: 'Bước 7: Thiết lập tường lửa ứng dụng (WAF) và Rate Limit.'
      options:
      - key: q2_n7_o1
        label: Áp dụng Rate Limit 10 req/minute cho mỗi IP tại endpoint `/payment/checkout`.
      - key: q2_n7_o2
        label: Tắt Cloudflare WAF trong 30 phút để tránh việc IP của Developer bị
          block khi thử nghiệm.
      - key: q2_n7_o3
        label: Cấu hình Whitelist dải IP `0.0.0.0/0` truy cập thẳng vào cổng API Payment
          Gateway nội bộ.
    - key: q2_n8
      prompt: 'Bước 8: Xử lý các giao dịch ở trạng thái chờ xử lý (Pending Transactions).'
      options:
      - key: q2_n8_o1
        label: Gọi API `query-order` sang phía Ngân hàng để truy vấn lại trạng thái
          chuẩn xác của từng đơn.
      - key: q2_n8_o2
        label: Chạy lệnh SQL tay `UPDATE transactions SET status='SUCCESS' WHERE status='PENDING'`
          để đóng đơn.
      - key: q2_n8_o3
        label: Bỏ qua các giao dịch pending, hướng dẫn người dùng tự thao tác tạo
          đơn thanh toán mới.
    - key: q2_n9
      prompt: 'Bước 9: Gửi thông báo xác nhận thanh toán (Notification Service).'
      options:
      - key: q2_n9_o1
        label: Gửi Push Notification qua Firebase FCM tới đúng User ID có giao dịch
          thành công.
      - key: q2_n9_o2
        label: Bật tính năng broadcast thông báo thanh toán thành công tới tất cả
          thiết bị đang active.
      - key: q2_n9_o3
        label: Kích hoạt API SMS Brandname thật gửi tin nhắn xác nhận trừ tiền thật
          tới số điện thoại khách hàng.
    - key: q2_n10
      prompt: 'Bước 10: Đánh giá an toàn và hoàn tất quá trình tích hợp.'
      options:
      - key: q2_n10_o1
        label: Tổng hợp System Log, lập báo cáo kiểm thử Post-Mortem và cập nhật tài
          liệu Runbook.
      - key: q2_n10_o2
        label: Đóng các ticket kiểm thử mà không ghi nhận bất kỳ logs hay phát hiện
          lỗi nào.
      - key: q2_n10_o3
        label: Đổ lỗi cho hạ tầng Ngân hàng đối tác unstable trong báo cáo gửi Ban
          Giám Đốc.
