- content:
    scenario: Hệ thống Core Banking kết nối với Ví điện tử đối tác gặp lỗi lệch tiền
      đối soát cuối ngày trên môi trường Production. Hàng trăm giao dịch hoàn tiền
      (Refund) bị treo, cần Dev/BA can thiệp trực tiếp để đối soát dữ liệu và xử lý
      bù.
    nodes:
    - key: q2_node_1
      prompt: 'Bước 1: Kiểm tra nguồn dữ liệu bị chênh lệch đối soát.'
      options:
      - key: q2_opt_1_1
        label: Tải file log reconcile trong ngày từ S3 bucket backup về máy cá nhân
          để so sánh.
      - key: q2_opt_1_2
        label: Truy vấn trực tiếp SELECT SUM(amount) trên DB Master Core Banking trong
          giờ giao dịch.
      - key: q2_opt_1_3
        label: Chạy lại job đối soát toàn bộ lịch sử tháng cũ với cờ force_sync=true
          gọi API sang đối tác.
    - key: q2_node_2
      prompt: 'Bước 2: Kiểm tra trạng thái endpoint API của phía đối tác Ví điện tử.'
      options:
      - key: q2_opt_2_1
        label: Gửi request GET đến endpoint /healthcheck và kiểm tra SSL Certificate.
      - key: q2_opt_2_2
        label: Dùng curl gửi request thử nghiệm từ máy local với Header Authorization
          Production.
      - key: q2_opt_2_3
        label: Gửi request POST /v2/refund/execute với payload dữ liệu thật tới API
          thật của đối tác.
    - key: q2_node_3
      prompt: 'Bước 3: Xử lý các giao dịch đang bị kẹt trạng thái PENDING_RECONCILE.'
      options:
      - key: q2_opt_3_1
        label: Viết script đối soát 2 chiều (check status qua API read-only trước
          khi update DB).
      - key: q2_opt_3_2
        label: Chạy SQL UPDATE transactions SET status='SUCCESS' WHERE status='PENDING'
          trên DB Production.
      - key: q2_opt_3_3
        label: Chạy script kích hoạt gửi SMS thông báo 'Hoàn tiền thành công' cho
          tất cả khách hàng bị kẹt.
    - key: q2_node_4
      prompt: 'Bước 4: Tạm thời cô lập tiến trình background worker đối soát để sửa
        lỗi.'
      options:
      - key: q2_opt_4_1
        label: Tắt Feature Flag reconcile_worker_enabled để dừng job an toàn.
      - key: q2_opt_4_2
        label: Sửa file /etc/hosts trên server Production để trỏ domain API đối tác
          về 127.0.0.1.
      - key: q2_opt_4_3
        label: Stop toàn bộ cluster Nginx API Gateway của Production.
    - key: q2_node_5
      prompt: 'Bước 5: Xử lý cấu hình Timeout khi kết nối API sang đối tác bị chậm.'
      options:
      - key: q2_opt_5_1
        label: Tăng timeout từ 5s lên 15s và cấu hình cơ chế Exponential Backoff với
          tối đa 3 lần retry.
      - key: q2_opt_5_2
        label: Cấu hình vô hạn lần retry (infinite retry loop) đến khi nào API đối
          tác phản hồi mới dừng.
      - key: q2_opt_5_3
        label: Bỏ qua bước xác thực chữ ký số HMAC-SHA256 để bypass lỗi handshake.
    - key: q2_node_6
      prompt: 'Bước 6: Nhập bổ sung các giao dịch còn thiếu từ file đính kèm của đối
        tác.'
      options:
      - key: q2_opt_6_1
        label: Import file vào bảng tạm tmp_reconcile_data, chạy script validate rồi
          mới merge vào bảng chính.
      - key: q2_opt_6_2
        label: Dùng vòng lặp insert trực tiếp hàng ngàn dòng dữ liệu vào bảng chính
          ledger_transactions.
      - key: q2_opt_6_3
        label: Gửi request gọi Webhook gạch nợ tự động sang hệ thống kế toán bên thứ
          ba ERP_SYSTEM_API.
    - key: q2_node_7
      prompt: 'Bước 7: Mở lại dịch vụ đối soát tự động sau khi hoàn tất xử lý bù.'
      options:
      - key: q2_opt_7_1
        label: Bật Feature Flag cho 10% traffic worker, theo dõi Grafana dashboard
          trong 15 phút trước khi mở 100%.
      - key: q2_opt_7_2
        label: Mở 100% traffic ngay lập tức mà không cần theo dõi log.
      - key: q2_opt_7_3
        label: Bắn email cảnh báo khẩn cấp tới toàn bộ ban giám đốc báo cáo hệ thống
          đối tác bị lỗi.
    - key: q2_node_8
      prompt: 'Bước 8: Quản lý tải tài nguyên Database trong quá trình sync lượng
        lớn giao dịch.'
      options:
      - key: q2_opt_8_1
        label: Chia nhỏ dữ liệu theo batch 200 records và thêm khoảng nghỉ sleep 100ms
          giữa các batch.
      - key: q2_opt_8_2
        label: Mở 50 thread đồng thời để ghi vào DB mà không giới hạn connection pool.
      - key: q2_opt_8_3
        label: Chạy lệnh ALTER TABLE transactions DISABLE TRIGGER ALL trên DB Production.
    - key: q2_node_9
      prompt: 'Bước 9: Kiểm tra số dư tài khoản đảm bảo (Nostro Account) với phía
        đối tác Ví điện tử.'
