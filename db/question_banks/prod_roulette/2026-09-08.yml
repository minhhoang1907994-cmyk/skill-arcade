  difficulty: medium
- content:
    scenario: Thực hiện kiểm thử và phát hành tính năng tự động gửi Voucher sinh nhật
      cho người dùng trên môi trường Production của hệ thống E-commerce.
    nodes:
    - key: q1_n1
      prompt: 'Bước 1: Kiểm tra trạng thái hệ thống và môi trường trước khi bắt đầu
        thao tác.'
      options:
      - key: q1_n1_o1
        label: Kiểm tra kết nối DB Read Replica và DB Master, đảm bảo hệ thống đang
          ở trạng thái tải thấp.
      - key: q1_n1_o2
        label: Bỏ qua việc kiểm tra DB Read Replica, truy vấn trực tiếp DB Master
          để tiết kiệm thời gian.
      - key: q1_n1_o3
        label: Thực hiện chạy script kiểm tra dữ liệu trực tiếp trên bảng `users`
          mà không giới hạn số lượng record.
    - key: q1_n2
      prompt: 'Bước 2: Lựa chọn tập dữ liệu đối tượng để tiến hành thử nghiệm tính
        năng.'
      options:
      - key: q1_n2_o1
        label: Tạo riêng 5 tài khoản test nội bộ có gắn flag `is_tester = true` trong
          database.
      - key: q1_n2_o2
        label: Sử dụng danh sách email của toàn bộ nhân viên trong công ty trên database
          PROD.
      - key: q1_n2_o3
        label: Lấy ngẫu nhiên 1.000 khách hàng thật có sinh nhật trong tháng hiện
          tại từ bảng `users`.
    - key: q1_n3
      prompt: 'Bước 3: Thao tác cấu hình bộ lập lịch tự động (Cronjob / Scheduler).'
      options:
      - key: q1_n3_o1
        label: Cấu hình Cronjob chạy ở chế độ `DRY_RUN=true` chỉ xuất log ra Kibana
          mà không tạo entity.
      - key: q1_n3_o2
        label: Thay đổi lịch chạy Cronjob trên PROD sang thời gian hiện tại để trigger
          ngay lập tức.
      - key: q1_n3_o3
        label: Bật biến môi trường `FORCE_RUN_ALL=true` trên PROD mà không cài đặt
          bộ lọc người dùng.
    - key: q1_n4
      prompt: 'Bước 4: Tích hợp và kiểm tra cổng gửi SMS / Email Gateway.'
      options:
      - key: q1_n4_o1
        label: Cấu hình Mock Service Gateway để hứng toàn bộ request gửi outbound
          message.
      - key: q1_n4_o2
        label: Sử dụng SMS Gateway thật nhưng đổi nội dung tin nhắn thành chuỗi [TEST_ONLY].
      - key: q1_n4_o3
        label: Dùng API Key thật của SMS Gateway và kích hoạt gửi tin nhắn chúc mừng
          thật kèm mã voucher.
    - key: q1_n5
      prompt: 'Bước 5: Khởi tạo mã Voucher trong hệ thống Database.'
      options:
      - key: q1_n5_o1
        label: Khởi tạo campaign test với tổng giá trị voucher = 0 VNĐ và đặt giới
          hạn tối đa 5 mã.
      - key: q1_n5_o2
        label: Tạo campaign giảm 50% không giới hạn nhưng thêm tiền tố `TEST_` vào
          mã voucher.
      - key: q1_n5_o3
        label: Import trực tiếp 10.000 voucher giảm 100% vào bảng `vouchers` PROD
          ở trạng thái `active`.
    - key: q1_n6
      prompt: 'Bước 6: Xử lý bộ nhớ đệm Cache và Service Worker.'
      options:
      - key: q1_n6_o1
        label: Chỉ xoá cache Redis theo key cụ thể `cache:campaign:birthday_test`.
      - key: q1_n6_o2
        label: Thực hiện lệnh `FLUSHALL` trên Redis Cluster PROD để đảm bảo config
          mới được áp dụng.
      - key: q1_n6_o3
        label: Bỏ qua bước xoá cache, giữ nguyên TTL của các key cũ đang chạy trên
          Production.
    - key: q1_n7
      prompt: 'Bước 7: Giám sát chỉ số hệ thống (Monitoring) trong quá trình thực
        thi.'
      options:
      - key: q1_n7_o1
        label: Theo dõi real-time Dashboard trên Datadog và filter log theo `job_id`
          thử nghiệm.
      - key: q1_n7_o2
        label: SSH trực tiếp vào server PROD và chạy lệnh `tail -f /var/log/syslog`.
      - key: q1_n7_o3
        label: Tắt màn hình theo dõi log, chờ phản hồi từ bộ phận Customer Support.
    - key: q1_n8
      prompt: 'Bước 8: Phát hiện bất thường khi Voucher phát sai đối tượng quy mô
        lớn.'
      options:
      - key: q1_n8_o1
        label: Bật ngay Kill-Switch flag `DISABLE_BIRTHDAY_CAMPAIGN` trên Config Server.
      - key: q1_n8_o2
        label: Chạy lệnh SQL tay `UPDATE vouchers SET status='expired'` trực tiếp
          không qua Transaction.
      - key: q1_n8_o3
        label: Gọi điện trao đổi với Developer khác để hỏi ý kiến trong khi Service
          vẫn đang chạy.
    - key: q1_n9
      prompt: 'Bước 9: Khai báo sự cố và khoanh vùng ảnh hưởng.'
      options:
      - key: q1_n9_o1
        label: Kích hoạt quy trình Incident Response, gửi cảnh báo tới nhóm CS và
          Security.
      - key: q1_n9_o2
        label: Âm thầm xoá log trong thư mục `/var/log/app.log` để che giấu thao tác
          lỗi.
      - key: q1_n9_o3
        label: Nhắn tin riêng cho Team Leader để xin hỗ trợ sau khi đã đợi 1 tiếng
          đồng hồ.
    - key: q1_n10
      prompt: 'Bước 10: Phục hồi dữ liệu và hoàn tất báo cáo sự cố.'
      options:
      - key: q1_n10_o1
        label: Khôi phục dữ liệu từ Point-in-Time Backup và gọi API hủy các voucher
          chưa áp dụng.
      - key: q1_n10_o2
        label: Khóa toàn bộ tài khoản người dùng đã lỡ nhận voucher để tránh họ sử
          dụng.
      - key: q1_n10_o3
        label: Xoá hoàn toàn bảng `vouchers` và restore lại file backup từ tuần trước.
