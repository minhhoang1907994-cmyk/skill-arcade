  difficulty: hard
- content:
    scenario: Hệ thống cổng thanh toán e-Commerce trên môi trường Production bị lỗi
      xử lý Webhook Callback từ ZaloPay trong đợt Sale 11/11. Tốc độ giao dịch tăng
      đột biến 15.000 req/min khiến hệ thống treo hàng nghìn đơn PENDING.
    nodes:
    - key: s1_n1
      prompt: 'Bước 1: Phát hiện Webhook ZaloPay phản hồi HTTP status 504 Gateway
        Timeout. Bạn cần làm gì đầu tiên?'
      options:
      - key: s1_o1_a
        label: Bật Maintenance Mode riêng cho Zalopay endpoint và route traffic về
          cổng thanh toán dự phòng.
      - key: s1_o1_b
        label: Chạy SQL Query UPDATE trực tiếp trạng thái đơn PENDING sang PAID trên
          DB Master.
      - key: s1_o1_c
        label: Gọi trực tiếp API Refund của ZaloPay cho toàn bộ các đơn đang treo
          mà chưa kiểm tra DB.
    - key: s1_n2
      prompt: 'Bước 2: Phát hiện Database đang bị exclusive lock do một query đối
        soát chạy ngầm. Bạn xử lý như thế nào?'
      options:
      - key: s1_o2_a
        label: Tra cứu pg_stat_activity, thực hiện pg_cancel_backend cho query đối
          soát và chuyển lịch chạy sang đêm.
      - key: s1_o2_b
        label: Restart lại Postgres Instance ngay lập tức để giải phóng toàn bộ connection.
      - key: s1_o2_c
        label: Thực hiện DROP TABLE tạm thời bảng temp_reconciliation để bỏ qua khóa
          lock.
    - key: s1_n3
      prompt: 'Bước 3: Cần hotfix logic kiểm tra chữ ký HMAC trong callback IPN. Quy
        trình triển khai nào là phù hợp?'
      options:
      - key: s1_o3_a
        label: Build Docker Image trên CI/CD, chạy test suite tự động và deploy Canary
          5% traffic.
      - key: s1_o3_b
        label: Truy cập SSH vào Pod Production và chỉnh sửa trực tiếp file code Python/Node.js
          bằng vim.
      - key: s1_o3_c
        label: Tắt toàn bộ SSL Verification khi gọi API đối soát để bypass lỗi handshake.
    - key: s1_n4
      prompt: 'Bước 4: Còn khoảng 200 đơn PENDING của khách hàng VIP chưa nhận đượccallback.
        Bạn chọn phương án xử lý dữ liệu nào?'
      options:
      - key: s1_o4_a
        label: Viết script Read-Only gọi API Query Transaction Status từ ZaloPay để
          so sánh và sync lại.
      - key: s1_o4_b
        label: Chạy script Python gán trạng thái SUCCESS cho toàn bộ 200 đơn VIP dựa
          trên số điện thoại.
      - key: s1_o4_c
        label: Trigger lại Webhook mock từ môi trường Staging sang Production.
    - key: s1_n5
      prompt: 'Bước 5: Khách hàng liên tục khiếu nại qua Hotline. Bạn thông báo tình
        trạng sự cố cho người dùng như thế nào?'
      options:
      - key: s1_o5_a
        label: Cập nhật Banner thông báo gián đoạn dịch vụ thanh toán ZaloPay trên
          Website/App.
      - key: s1_o5_b
        label: Gửi Push Notification trong ứng dụng thông báo sự cố toàn hệ thống.
      - key: s1_o5_c
        label: Phát lệnh gửi SMS Brandname hàng loạt cho tất cả 500.000 user kèm mã
          voucher giảm giá 50k bồi thường.
    - key: s1_n6
      prompt: 'Bước 6: Dung lượng ổ đĩa chứa Log trên Server API chạm mức 98%. Bạn
        giải phóng tài nguyên bằng cách nào?'
      options:
      - key: s1_o6_a
        label: Nén các file log cũ lưu trữ sang S3 Cold Storage rồi chạy logrotate.
      - key: s1_o6_b
        label: Thực hiện lệnh rm -rf /var/log/* trực tiếp trên Production node.
      - key: s1_o6_c
        label: Disable hoàn toàn service Logging Daemon để không sinh file log mới.
    - key: s1_n7
      prompt: 'Bước 7: Có 15 giao dịch bị trừ tiền 2 lần do khách hàng bấm thanh toán
        lại. Bạn xử lý hoàn tiền ra sao?'
      options:
      - key: s1_o7_a
        label: Lập danh sách ID giao dịch, gửi Ticket yêu cầu Kế toán hoàn tiền qua
          cổng Admin Portal chính thức.
      - key: s1_o7_b
        label: Cộng trực tiếp tiền vào Ví nội bộ (Internal Wallet) của user trên DB
          mà không tạo Audit Log.
      - key: s1_o7_c
        label: Chạy cURL trực tiếp gọi API Auto-Refund bằng Prod Secret Key với danh
          sách tham số tự build.
    - key: s1_n8
      prompt: 'Bước 8: Cần đồng bộ lại Cache thông tin đơn hàng trên Redis sau khi
        sửa DB. Thao tác nào an toàn?'
      options:
      - key: s1_o8_a
        label: Viết script xóa key theo Pattern cụ thể (DEL order:pending:*) có giới
          hạn rate limit.
      - key: s1_o8_b
        label: Thực hiện lệnh FLUSHALL trên Redis Production Cluster.
      - key: s1_o8_c
        label: Tắt Redis Service để ứng dụng đọc trực tiếp từ Database.
    - key: s1_n9
      prompt: 'Bước 9: Sau khi fix xong, lượng traffic thanh toán bắt đầu tăng lại.
        Bạn kiểm soát tải hệ thống ra sao?'
      options:
      - key: s1_o9_a
        label: Mở dần Rate Limiter từ 10% đến 100% traffic và theo dõi biểu đồ Latency
          trên Grafana.
      - key: s1_o9_b
        label: Tăng số lượng Pod Kubernetes lên gấp 10 lần ngay lập tức.
      - key: s1_o9_c
        label: Tắt toàn bộ Nginx Rate Limiting để người dùng truy cập tự do.
    - key: s1_n10
      prompt: 'Bước 10: Sự cố đã hoàn tất xử lý, hệ thống trở lại bình thường. Bước
        cuối cùng của bạn là gì?'
      options:
      - key: s1_o10_a
        label: Viết báo cáo Post-Mortem, phân tích nguyên nhân gốc rễ (RCA) và tạo
          task Jira cải tiến.
      - key: s1_o10_b
        label: Đóng Incident và không ghi lại các thao tác đã can thiệp trong ca trực.
      - key: s1_o10_c
        label: Xóa toàn bộ ticket ghi nhận sự cố để tránh ảnh hưởng SLA của team.
