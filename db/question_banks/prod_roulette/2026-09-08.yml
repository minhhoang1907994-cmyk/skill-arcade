  difficulty: medium
- content:
    scenario: Thực hiện chiến dịch Marketing tự động (Automated Campaign Engine) gửi
      ưu đãi cho 1.000.000 khách hàng VIP trên Production. Hệ thống gặp sự cố kẹt
      hàng đợi Message Queue và nghẽn mạng DB.
    nodes:
    - key: s2_n1
      prompt: 'Bước 1: Chuẩn bị danh sách 1.000.000 user để phân loại ưu đãi. Thao
        tác nào là an toàn?'
      options:
      - key: s2_o1_a
        label: Tạo snapshot Read-Replica DB và chạy query xuất danh sách trên node
          Replica này.
      - key: s2_o1_b
        label: Chạy query SELECT Heavy JOIN trực tiếp trên DB Master trong giờ cao
          điểm.
      - key: s2_o1_c
        label: Kích hoạt trực tiếp Campaign Engine gửi Email/SMS thật đến toàn bộ
          DB chưa qua lọc dữ liệu.
    - key: s2_n2
      prompt: 'Bước 2: DB Replica bị tụt hậu (Replication Lag) lên tới 45 phút do
        CPU 100%. Bạn giải quyết ra sao?'
      options:
      - key: s2_o2_a
        label: Tạm dừng các job báo cáo không ưu tiên và thêm Index tạm thời (CONCURRENTLY)
          cho các query tìm kiếm.
      - key: s2_o2_b
        label: Sửa tham số max_connections của Postgresql lên 10.000 mà không tính
          toán tài nguyên RAM.
      - key: s2_o2_c
        label: Kill toàn bộ connection đến DB Replica kể cả các connection đang phục
          vụ API đọc của App.
    - key: s2_n3
      prompt: 'Bước 3: Phát hiện thông số SMTP Gateway cấu hình trên Production bị
        sai Port. Bạn cập nhật lại bằng cách nào?'
      options:
      - key: s2_o3_a
        label: Cập nhật Secret Manager/Vault và kích hoạt pipeline deployment để cập
          nhật biến môi trường.
      - key: s2_o3_b
        label: Chỉnh sửa trực tiếp file .env trên Server và chạy lệnh systemctl restart
          app.
      - key: s2_o3_c
        label: Hardcode IP SMTP server mới trực tiếp vào file source code trên nhánh
          main.
    - key: s2_n4
      prompt: 'Bước 4: Cần kiểm tra mẫu Email Marketing trước khi gửi hàng loạt. Lựa
        chọn thử nghiệm nào chuẩn xác?'
      options:
      - key: s2_o4_a
        label: Gửi email thử nghiệm tới danh sách Email Internal QA/Dev đã quy định.
      - key: s2_o4_b
        label: Gửi email thử nghiệm trực tiếp đến địa chỉ email cá nhân của Giám đốc
          tiếp thị.
      - key: s2_o4_c
        label: Nhấn nút Broadcast Trigger trên Portal Admin Prod gửi thử cho 10.000
          user đầu tiên trong bảng.
    - key: s2_n5
      prompt: 'Bước 5: Bảng audit_logs bốc hỏa đạt 500GB gây hết dung lượng ổ đĩa
        DB. Bạn xử lý như thế nào?'
      options:
      - key: s2_o5_a
        label: Backup partition cũ ra S3 Cold Storage rồi DETACH và DROP Partition
          tương ứng.
      - key: s2_o5_b
        label: Chạy lệnh DELETE FROM audit_logs trong một transaction duy nhất.
      - key: s2_o5_c
        label: Thực hiện TRUNCATE TABLE audit_logs ngay lập tức trên DB Master.
    - key: s2_n6
      prompt: 'Bước 6: Hàng đợi RabbitMQ đọng hơn 600.000 message tin nhắn do Worker
        không xử lý kịp. Thao tác khắc phục?'
      options:
      - key: s2_o6_a
