  difficulty: hard
- content:
    scenario: Hệ thống Ecommerce đang chuẩn bị chiến dịch Black Friday. Môi trường
      Staging bị sập network, bạn (Dev/BA) được yêu cầu kiểm thử khẩn cấp API Push
      Notification và Cronjob trên môi trường PRODUCTION.
    nodes:
    - key: q1_n1
      prompt: 'Bước 1: Chuẩn bị danh sách người dùng để thực hiện test gửi Push Notification.'
      options:
      - key: q1_n1_o1
        label: Tạo riêng một tài khoản test trong DB Production với flag `is_test
          = 1` và gán token thiết bị cá nhân.
      - key: q1_n1_o2
        label: Lấy ngẫu nhiên 50 `user_id` từ bảng `users` thật trên Production để
          làm dữ liệu mẫu.
      - key: q1_n1_o3
        label: Dùng ngay danh sách các tài khoản có `role = 'ADMIN'` trên Production
          để nhận thông báo.
    - key: q1_n2
      prompt: 'Bước 2: Cấu hình mẫu thông báo (Notification Template) cho đợt kiểm
        thử.'
      options:
      - key: q1_n2_o1
        label: Tạo template mới có tiền tố `[TEST]` và gán mục tiêu nhận là `user_id`
          test duy nhất.
      - key: q1_n2_o2
        label: Sửa trực tiếp nội dung template Black Friday giảm giá 99% thật để kiểm
          tra độ dài văn bản.
      - key: q1_n2_o3
        label: Thay đổi mã voucher trong template Production thành 'TEST99' rồi lưu
          lại.
    - key: q1_n3
      prompt: 'Bước 3: Kiểm tra kết nối dịch vụ push FCM (Firebase Cloud Messaging).'
      options:
      - key: q1_n3_o1
        label: Sử dụng chế độ dry-run / validate_only của API FCM để kiểm tra authen
          key.
      - key: q1_n3_o2
        label: Gửi thử một thông báo broadcast tới topic `all_users` để xem latency
          dịch vụ FCM.
      - key: q1_n3_o3
        label: Xem log kết nối của `notification-worker` trên Grafana Dashboard.
    - key: q1_n4
      prompt: 'Bước 4: Kích hoạt dịch vụ gửi tin nhắn thử nghiệm.'
      options:
      - key: q1_n4_o1
        label: Bắn API thủ công qua Postman với payload chứa duy nhất `user_id` test.
      - key: q1_n4_o2
        label: Chạy SQL UPDATE `campaign_status = 'PROCESSING'` trực tiếp trong DB
          để Cronjob tự quét.
      - key: q1_n4_o3
        label: Bật flag `debug_mode = true` trên Config Server rồi restart service
          `notification-service`.
    - key: q1_n5
      prompt: 'Bước 5: Queue `notification_queue` xuất hiện tình trạng tắc nghẽn nhẹ.'
      options:
      - key: q1_n5_o1
        label: Tăng tham số `worker_concurrency` từ 2 lên 5 và theo dõi mức tiêu thụ
          CPU/RAM.
      - key: q1_n5_o2
        label: Thực hiện lệnh `FLUSHALL` trên Redis instance cache/queue để dọn dẹp
          hàng đợi.
      - key: q1_n5_o3
        label: Khởi động lại ngay lập tức container chứa `notification-worker`.
    - key: q1_n6
      prompt: 'Bước 6: Kiểm tra log giao dịch sau khi trigger thành công.'
      options:
