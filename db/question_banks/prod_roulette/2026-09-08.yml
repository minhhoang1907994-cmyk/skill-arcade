  difficulty: hard
- content:
    scenario: Hệ thống E-commerce đang chuẩn bị cho chiến dịch Flash Sale lớn. Bạn
      cần kiểm tra tính năng gửi Push Notification tự động kèm voucher giảm giá 50%
      cho danh sách 500 khách hàng VIP trên môi trường Production.
    nodes:
    - key: q1_n1
      prompt: 'Bước 1: Bạn vừa truy cập vào hệ thống Admin trên Production. Việc đầu
        tiên bạn cần làm để chuẩn bị test là gì?'
      options:
      - key: q1_o1_a
        label: Tạo ngay một feature flag mới `enable_test_push_vip` và bật OFF mặc
          định cho toàn bộ user.
      - key: q1_o1_b
        label: Sửa trực tiếp cấu hình service FCM/APNS trên Production sang môi trường
          Sandbox.
      - key: q1_o1_c
        label: Bỏ qua việc tạo flag, dùng luôn flag `enable_flash_sale_push` đang
          có sẵn trên hệ thống.
    - key: q1_n2
      prompt: 'Bước 2: Bạn cần chuẩn bị danh sách nhận Push Notification để test.
        Bạn thực hiện như thế nào?'
      options:
      - key: q1_o2_a
        label: Tạo danh sách test gồm 5 account nội bộ (whitelist user_id) và backup
          lại table `user_notifications`.
      - key: q1_o2_b
        label: Trích xuất trực tiếp top 500 `user_id` có VIP tier cao nhất từ database
          PROD vào bảng test.
      - key: q1_o2_c
        label: Chạy câu lệnh SQL `UPDATE users SET is_vip = 1 WHERE id < 500` trực
          tiếp trên PROD db để tạo dữ liệu.
    - key: q1_n3
      prompt: 'Bước 3: Bạn cần tạo mã Voucher 50% dùng cho việc test thông báo. Bạn
        thực hiện tạo như thế nào?'
      options:
      - key: q1_o3_a
        label: Tạo voucher code `TEST_VIP_50` giới hạn tối đa 5 lượt sử dụng, chỉ
          áp dụng cho whitelist account test.
      - key: q1_o3_b
        label: Tạo voucher code `PROMO_VIP_50` không giới hạn số lượt dùng nhưng đặt
          ngày hiệu lực vào tuần sau.
      - key: q1_o3_c
        label: Tạo voucher code live `FLASH50` có hiệu lực ngay lập tức, giảm 50%
          không giới hạn số lượng.
    - key: q1_n4
      prompt: 'Bước 4: Cần liên kết nội dung Push Notification với mã Voucher vừa
        tạo. Bạn soạn nội dung ra sao?'
      options:
      - key: q1_o4_a
        label: Đánh nhãn tiêu đề `[INTERNAL TEST] Ưu đãi VIP` kèm deeplink trỏ tới
          trang staging.
      - key: q1_o4_b
        label: Đánh nhãn tiêu đề `[TEST] Ưu đãi VIP` nhưng đính kèm deeplink trỏ thẳng
          vào app Production.
      - key: q1_o4_c
        label: 'Soạn tiêu đề hấp dẫn như thật: `Chúc mừng bạn nhận Voucher VIP 50%!
          Click nhận ngay`.'
    - key: q1_n5
      prompt: 'Bước 5: Bạn cần kích hoạt cronjob gửi Push tự động trong hệ thống Scheduler.
        Bạn chọn giải pháp nào?'
      options:
      - key: q1_o5_a
        label: Chạy trigger thủ công qua CLI command với tham số `--dry-run --target-user=test_group`.
      - key: q1_o5_b
        label: Sửa file crontab trên server PROD cho chạy mỗi phút 1 lần để kiểm tra
          speed.
      - key: q1_o5_c
        label: Bật công tắc `active_campaign` trong DB và chờ cronjob tự động quét
          theo lịch.
    - key: q1_n6
      prompt: 'Bước 6: Trong lúc test gửi push, service thông báo trả về log `429
        Too Many Requests` từ Firebase/APNS. Bạn làm gì?'
      options:
      - key: q1_o6_a
        label: Tạm dừng script, kiểm tra rate limit config và thêm exponential backoff
          retry.
      - key: q1_o6_b
        label: Tăng số lượng worker thread lên gấp 5 lần để đẩy nhanh tốc độ bypass
          queue.
      - key: q1_o6_c
        label: Xoá bớt log trong buffer để giảm tải IOPS cho server notification.
    - key: q1_n7
      prompt: 'Bước 7: Bạn phát hiện có một lỗi trong hàm render deeplink làm app
        bị crash khi bấm vào push. Bạn sửa thế nào?'
      options:
      - key: q1_o7_a
        label: Tắt feature flag ngay lập tức, commit fix ở repo, chạy qua CI/CD pipeline
          chuẩn để deploy hotfix.
      - key: q1_o7_b
        label: SSH thẳng vào server PROD, vi/nano sửa file code Python/Node.js trực
          tiếp rồi restart systemd service.
      - key: q1_o7_c
        label: Bỏ qua lỗi deeplink vì chỉ là test, tiếp tục bấm gửi Push thông báo
          thật để kiểm tra thêm.
    - key: q1_n8
      prompt: 'Bước 8: Quyết định thực hiện gửi Push Notification thực tế từ trang
        Admin PROD. Bạn chọn nút bấm nào?'
      options:
      - key: q1_o8_a
        label: Chọn gửi tới Segment `Test_Internal_Users` và kiểm tra lại log xác
          nhận 5 thiết bị nhận thành công.
      - key: q1_o8_b
        label: Chọn gửi tới Segment `VIP_Customers` nhưng giới hạn `limit=10` người
          dùng.
      - key: q1_o8_c
        label: Nhấn nút `Send Broadcast Now` tới toàn bộ người dùng active trên PROD
          với mã voucher live.
    - key: q1_n9
      prompt: 'Bước 9: Sau khi kết thúc đợt test, bạn cần xử lý các dữ liệu rác đã
        tạo ra trong hệ thống. Bạn xử lý sao?'
      options:
      - key: q1_o9_a
        label: Khóa mã voucher test `TEST_VIP_50`, tắt feature flag `enable_test_push_vip`
          và archive campaign.
      - key: q1_o9_b
        label: Chạy lệnh `DELETE FROM vouchers WHERE code LIKE '%TEST%'` trực tiếp
          trên DB mà không dùng transaction.
      - key: q1_o9_c
        label: Giữ nguyên cấu hình để lần sau tiếp tục dùng test tiếp cho tiện.
    - key: q1_n10
      prompt: 'Bước 10: Tổng kết và báo cáo kết quả sau buổi test trên Production.
        Bạn chọn hành động cuối cùng nào?'
      options:
      - key: q1_o10_a
        label: Viết báo cáo test report, đính kèm CloudWatch metrics, log ID và gửi
          mail xác nhận cho Tech Lead/PM.
      - key: q1_o10_b
        label: Nhắn tin qua Slack cá nhân cho PM báo 'Test xong rồi, không có vấn
          đề gì lớn' mà không có log đính kèm.
      - key: q1_o10_c
        label: Đóng laptop và đi uống cà phê vì thấy ứng dụng không báo lỗi gì nổi
          bật.
