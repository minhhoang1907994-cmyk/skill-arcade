  difficulty: medium
- content:
    scenario: Ứng dụng Fintech bị lỗi mất Webhook thanh toán từ Cổng thanh toán đối
      tác trên Production. Hàng trăm giao dịch bị treo ở trạng thái 'PENDING'. Bạn
      đang trực tiếp xử lý sự cố khẩn cấp.
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: Tra cứu log của các giao dịch bị thiếu Webhook.'
      options:
      - key: q2_n1_o1
        label: Truy cập Kibana/ELK lọc theo `transaction_id` và endpoint `/api/v1/payment/webhook`.
      - key: q2_n1_o2
        label: Dùng Postman gửi lại (replay) request Webhook giả lập tới trực tiếp
          URL Production.
      - key: q2_n1_o3
        label: Bật logging query SQL trên Production DB để theo dõi câu lệnh ghi nhận
          giao dịch.
    - key: q2_n2
      prompt: 'Bước 2: Đối soát trạng thái giao dịch thực tế bên phía Cổng thanh toán.'
      options:
      - key: q2_n2_o1
        label: Đăng nhập Dashboard đối tác bằng tài khoản Read-only để kiểm tra trạng
          thái giao dịch.
      - key: q2_n2_o2
        label: Bấm nút 'Refund' (Hoàn tiền) giao dịch lỗi trên Dashboard đối tác để
          kiểm tra API hoàn tiền.
      - key: q2_n2_o3
        label: Gọi API Query Order Status của đối tác từ máy tính cá nhân bằng Production
          API Key.
    - key: q2_n3
      prompt: 'Bước 3: Phát hiện WAF (Web Application Firewall) đang chặn IP của Cổng
        thanh toán.'
      options:
      - key: q2_n3_o1
        label: Kiểm tra log chặn trên Cloudflare WAF và thêm dải IP chính thức của
          đối tác vào Whitelist.
      - key: q2_n3_o2
        label: Tắt toàn bộ Firewall Rules trên Cloudflare để Webhook chạy qua nhanh
          nhất.
      - key: q2_n3_o3
        label: Bypass WAF bằng cách đổi URL Webhook sang IP trực tiếp của Server Production.
    - key: q2_n4
      prompt: 'Bước 4: Sửa lỗi mã nguồn xử lý verify chữ ký số (Signature verification)
        bị fail.'
      options:
      - key: q2_n4_o1
        label: Tạo Hotfix branch, viết Unit Test kiểm tra chữ ký, tạo PR và nhờ Tech
          Lead review.
      - key: q2_n4_o2
        label: Sửa trực tiếp mã nguồn file Python/JS trong container Production đang
          chạy.
      - key: q2_n4_o3
        label: Comment đoạn code verify Signature trên Prod để bỏ qua bước kiểm tra
          an toàn.
    - key: q2_n5
      prompt: 'Bước 5: Xử lý bù dữ liệu cho các giao dịch bị bỏ lỡ (Missed Webhooks).'
      options:
      - key: q2_n5_o1
        label: Chạy script Reconciliation có sẵn để chủ động query API đối tác và
          update DB.
      - key: q2_n5_o2
        label: Gọi API Third-party Payout thật để chuyển bù tiền thẳng vào tài khoản
          ngân hàng của user test.
      - key: q2_n5_o3
        label: Chạy câu lệnh SQL `UPDATE orders SET status = 'SUCCESS'` hàng loạt
          không dùng Transaction.
    - key: q2_n6
      prompt: 'Bước 6: Kiểm tra tính Idempotency (chống xử lý lặp) của API Webhook.'
      options:
      - key: q2_n6_o1
        label: Xác minh bảng `webhook_events` đã lưu `event_id` để tránh cộng tiền
          2 lần.
      - key: q2_n6_o2
        label: Xóa sạch dữ liệu bảng `webhook_events` để xóa cache kiểm tra lặp.
      - key: q2_n6_o3
        label: Tắt cơ chế kiểm tra Idempotency trong cấu hình Redis.
    - key: q2_n7
      prompt: 'Bước 7: Xử lý thông báo (SMS Brandname) cộng tiền cho khách hàng sau
        khi sync xong.'
      options:
      - key: q2_n7_o1
        label: Tắt flag gửi SMS trong script Sync bù, thông báo qua Push App để tiết
          kiệm chi phí.
      - key: q2_n7_o2
        label: Để nguyên trigger tự động, làm 500 khách hàng nhận được SMS thông báo
          giao dịch thành công bị lặp.
      - key: q2_n7_o3
        label: Cấu hình SMS Gateway chuyển sang Mock Endpoint trong lúc sync bù.
    - key: q2_n8
      prompt: 'Bước 8: Theo dõi hiệu năng hệ thống sau khi khắc phục.'
      options:
      - key: q2_n8_o1
        label: Mở Grafana theo dõi chỉ số API Response Time, Error Rate và CPU DB
          trong 30 phút.
      - key: q2_n8_o2
        label: Liên tục bấm F5 reload trang Admin Dashboard 100 lần để stress test.
      - key: q2_n8_o3
        label: Rời khỏi màn hình theo dõi ngay sau khi hoàn thành script sync.
    - key: q2_n9
      prompt: 'Bước 9: Quản lý log giao dịch nhạy cảm thu được trong quá trình debug.'
      options:
      - key: q2_n9_o1
        label: Che (Mask) thông tin số thẻ, CVV và thông tin cá nhân trong log trước
          khi lưu archives.
      - key: q2_n9_o2
        label: Gửi file log chứa full thông tin Request/Response dạng plain-text lên
          channel Slack chung.
      - key: q2_n9_o3
        label: Tải file log chứa dữ liệu giao dịch về máy tính cá nhân không cài mã
          hóa đĩa.
    - key: q2_n10
      prompt: 'Bước 10: Hoàn tất quy trình xử lý sự cố (Incident Management).'
      options:
      - key: q2_n10_o1
        label: Tổ chức họp Post-mortem, phân tích nguyên nhân gốc rễ (RCA) và cập
          nhật Runbook.
      - key: q2_n10_o2
        label: Đóng ticket sự cố mà không ghi rõ nguyên nhân và cách khắc phục.
      - key: q2_n10_o3
        label: Đổ lỗi sự cố hoàn toàn cho bên Cổng thanh toán trong báo cáo gửi Khách
          hàng.
