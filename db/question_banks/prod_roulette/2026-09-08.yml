  difficulty: medium
- content:
    scenario: Hệ thống Ví điện tử / Payment Gateway đang gặp sự cố lệch đối soát giao
      dịch (reconciliation mismatched) với Ngân hàng đối tác trên Production. Bạn
      là BA/Dev được giao xử lý trực tiếp trên server live để kiểm tra webhook kết
      nối.
    nodes:
    - key: q2_n1
      prompt: 'Bước 1: Bạn cần kiểm tra kết nối Database Production để tra cứu log
        giao dịch bị lệch. Bạn chọn cách nào?'
      options:
      - key: q2_o1_a
        label: Kết nối vào Read-Replica Database với quyền Read-Only thông qua bastion
          host có OTP.
      - key: q2_o1_b
        label: Mở phần mềm DBeaver kết nối trực tiếp vào Master DB PROD bằng tài khoản
          root/admin.
      - key: q2_o1_c
        label: SSH vào server ứng dụng và chạy câu lệnh `cat /var/log/app.log` trực
          tiếp mà không dùng filter.
    - key: q2_n2
      prompt: 'Bước 2: Phát hiện có 100 giao dịch ở trạng thái `PENDING` do nạp tiền
        từ đối tác chưa cập nhật số dư. Bạn làm gì?'
      options:
      - key: q2_o2_a
        label: Xuất danh sách 100 `transaction_id`, đối soát file log từ Ngân hàng
          gửi sang trước khi tác động.
      - key: q2_o2_b
        label: 'Chạy script update hàng loạt: `UPDATE transactions SET status=''SUCCESS''
          WHERE status=''PENDING''`.'
      - key: q2_o2_c
        label: Xoá các bản ghi `PENDING` này đi để hệ thống chạy lại từ đầu.
    - key: q2_n3
      prompt: 'Bước 3: Bạn cần kiểm tra lại endpoint nhận Webhook từ phía Ngân hàng.
        Bạn thực hiện kiểm tra như thế nào?'
      options:
      - key: q2_o3_a
        label: Sử dụng Postman gửi request mẫu có kèm Signature mã hóa đúng chuẩn
          tới trang Staging/Sandbox.
      - key: q2_o3_b
        label: Dùng Postman bắn trực tiếp payload mẫu vào endpoint PROD `https://api.payment.com/v1/webhook`
          mà không verify HMAC signature.
      - key: q2_o3_c
        label: Tắt tạm thời middleware xác thực HMAC Signature trên Production để
          debug cho nhanh.
    - key: q2_n4
      prompt: 'Bước 4: Cần xác minh xem Ngân hàng có thực sự đã trừ tiền của khách
        hàng hay chưa. Bạn làm gì?'
      options:
      - key: q2_o4_a
        label: Gọi API tra cứu trạng thái giao dịch (`QueryTransactionStatus`) phía
          Ngân hàng qua môi trường Read-Only API.
      - key: q2_o4_b
        label: Tự tay chuyển tiền thử 1.000 VNĐ trên app cá nhân rồi vào DB PROD sửa
          thông tin giao dịch.
      - key: q2_o4_c
        label: Gọi trực tiếp sang API Quyết toán thật (`ExecuteSettlement`) của Ngân
          hàng với Live Access Token để ép gạch nợ.
    - key: q2_n5
      prompt: 'Bước 5: Bạn cần xóa cache trạng thái giao dịch cũ trên Redis cluster
        để hệ thống đọc dữ liệu mới từ DB. Bạn xử lý sao?'
      options:
      - key: q2_o5_a
        label: Sử dụng lệnh `DEL txn_status_12345` đúng chính xác key của các giao
          dịch bị lỗi.
      - key: q2_o5_b
        label: Chạy lệnh `KEYS txn_*` trên Redis master PROD để tìm tất cả các key
          liên quan.
      - key: q2_o5_c
        label: Chạy lệnh `FLUSHALL` trên Redis Production để xoá toàn bộ cache cho
          sạch.
    - key: q2_n6
      prompt: 'Bước 6: Trong lúc xử lý, DB bị nghẽn (Lock Wait Timeout) do câu lệnh
        SQL của bạn gây ra. Bạn hành động thế nào?'
      options:
      - key: q2_o6_a
        label: Tìm đúng `process_id` đang giữ lock qua `SHOW FULL PROCESSLIST` và
          kill đúng process đó.
      - key: q2_o6_b
        label: Restart ngay lập tức database service MySQL/PostgreSQL trên server
          PROD.
      - key: q2_o6_c
        label: Tiếp tục chạy lại câu lệnh SQL đó nhiều lần cho đến khi thành công.
    - key: q2_n7
      prompt: 'Bước 7: Bạn cần cập nhật số dư ví (Balance) cho 1 khách hàng bị khiếu
        nại do giao dịch thất bại nhưng bị trừ tiền. Bạn chọn phương án nào?'
      options:
      - key: q2_o7_a
        label: Sử dụng công cụ Admin Portal chính thức, thực hiện qua quy trình Refund/Adjustment
          có phê duyệt 2 cấp (Maker-Checker).
      - key: q2_o7_b
        label: Chạy lệnh `UPDATE wallets SET balance = balance + 500000 WHERE user_id
          = 999` trực tiếp trong database.
      - key: q2_o7_c
        label: Ghi chú vào file Excel cá nhân và bảo khách hàng đợi đến kỳ đối soát
          cuối tháng.
    - key: q2_n8
      prompt: 'Bước 8: Hàng loạt Webhook thất bại đang nằm trong Dead Letter Queue
        (DLQ) của RabbitMQ/Kafka. Bạn xử lý thế nào?'
      options:
      - key: q2_o8_a
        label: Viết consumer script chạy replay từng message có kiểm tra idempotency
          key.
      - key: q2_o8_b
        label: Nút bấm 'Purge Queue' trên giao diện RabbitMQ Management để xóa sạch
          tin nhắn lỗi.
      - key: q2_o8_c
        label: Đẩy lại toàn bộ message trong DLQ về main queue cùng lúc mà không giới
          hạn rate limit.
    - key: q2_n9
      prompt: 'Bước 9: Bạn cần trích xuất file log sự cố để đối soát tài chính với
        bộ phận Kế toán. Bạn làm thế nào?'
      options:
      - key: q2_o9_a
        label: Dùng Kibana/CloudWatch export log đã được che mờ (masking) thông tin
          số thẻ và CVV.
      - key: q2_o9_b
        label: Export nguyên bảng `payment_logs` chứa nguyên văn Request Payload bao
          gồm số thẻ tín dụng nguyên bản ra file CSV.
      - key: q2_o9_c
        label: Chụp ảnh màn hình terminal SSH có chứa log giao dịch rồi gửi qua nhóm
          Chat công khai.
    - key: q2_n10
      prompt: 'Bước 10: Sự cố đối soát đã được giải quyết xong. Bạn thực hiện bước
        hoàn tất nào sau đây?'
      options:
      - key: q2_o10_a
        label: Tạo biên bản Post-Mortem, ghi rõ nguyên nhân gốc rễ, hành động khắc
          phục và đóng cửa bảo trì hệ thống.
      - key: q2_o10_b
        label: Âm thầm xóa file log thao tác trên server để tránh bị phát hiện các
          lệnh SQL đã chạy thủ công.
      - key: q2_o10_c
        label: Báo cáo cho Sếp rằng 'Lỗi do phía Ngân hàng' và đóng ticket hỗ trợ.
