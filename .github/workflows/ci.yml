name: CI

on:
  pull_request:
  push:
    # Phải là `main`, không phải `master`: default branch của repo là `main`, nên trigger cũ
    # làm CI không chạy cho BẤT KỲ push nào. Trigger `pull_request` phía trên vẫn hoạt động
    # (đã chạy và fail trên PR của Dependabot 2026-08-19), nhưng không ai đọc kết quả đó, nên
    # bin/* mất bit thực thi (repo tạo trên Windows) mà không ai thấy — tới khi workflow
    # refill dừng với exit 126.
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  # Job `scan_js` da bi xoa (2026-08-20): no chay `bin/importmap audit`, nhung file do KHONG
  # ton tai. Project co gem importmap-rails/turbo/stimulus trong Gemfile nhung chua he wire
  # (khong co config/importmap.rb, khong co app/javascript, layout khong goi
  # javascript_importmap_tags) nen khong co dependency JS nao de audit. Job chi bao exit 127.
  # Dung lai job nay khi nao thuc su dung importmap.

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    # Env o cap job de ca hai step dung chung, KHONG dung YAML anchor: GitHub Actions khong
    # ho tro anchor/alias trong workflow file.
    env:
      RAILS_ENV: test
      # KHONG dung DATABASE_URL: scheme quyet dinh adapter, va `trilogy://` (mac dinh cua
      # template Rails) lam Rails di tim adapter `trilogy` khong co trong bundle -> LoadError.
      # Project dung mysql2 (xem Gemfile). Dat DB_* dung nhu config/database.yml doc.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      # Service mysql duoi day dat MYSQL_ALLOW_EMPTY_PASSWORD nen root khong co mat khau.
      DB_PASSWORD: ""

    services:
      mysql:
        # PHAI ghim version, KHONG de `mysql` (= tag latest).
        #
        # 8.4 de khop voi ca hai noi that su chay: docker-compose.yml o local va Aiven for MySQL
        # 8.4.8 tren production (spec section 19). Tag latest keo MySQL 9.x, va da fail that:
        # `Questions::Drawer#shuffle_order` dung MD5(CONCAT(...)) de khoa thu tu boc de theo
        # (session_id, position) — BR-36 — nhung tren 9.x query do tra
        # `Mysql2::Error: FUNCTION skill_arcade_test.MD5 does not exist`. Cung bo spec do pass
        # tren 8.4. CI test phien ban khong ai chay thi bat loi khong co that va bo loi co that.
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run tests
        # RSpec, khong phai `bin/rails test`: project dung rspec-rails (xem .rspec va Gemfile),
        # nen lenh Minitest cua template chay 0 test va khong bao gi.
        run: bundle exec rspec

  # Job `system-test` da bi xoa (2026-08-20): no chay `bin/rails test:system` (Minitest) nhung
  # project dung RSpec va KHONG co spec/system nao. Dung lai khi nao viet system spec that.
