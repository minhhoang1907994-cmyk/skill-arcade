# MySQL 8.0.16 trở lên (spec section 19 — CHECK constraint chỉ được thực thi từ version này).
# Server chạy bằng Docker: xem docker-compose.yml ở thư mục gốc.
#
# Thông tin kết nối lấy từ biến môi trường, xem .env.example.
default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "root" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "skill_arcade" } %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
  # 3307 khớp với cổng docker-compose map ra host — tránh đụng MySQL native
  # thường chiếm sẵn 3306 trên máy dev.
  port: <%= ENV.fetch("DB_PORT") { 3307 } %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "skill_arcade_development" } %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_TEST") { "skill_arcade_test" } %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "skill_arcade_production" } %>
  username: <%= ENV.fetch("DB_USERNAME") { "skill_arcade" } %>
  # Không dùng ENV.fetch không default ở đây: ERB render cả file cho mọi môi trường,
  # nên thiếu biến sẽ làm hỏng cả development và test. Production thiếu mật khẩu thì
  # lỗi sẽ nổ lúc kết nối, kèm thông báo rõ ràng hơn.
  password: <%= ENV["DB_PASSWORD"] %>
