# MySQL 8.0.16 trở lên (spec section 19 — CHECK constraint chỉ được thực thi từ version này).
# Server chạy bằng Docker: xem docker-compose.yml ở thư mục gốc.
#
# Thông tin kết nối lấy từ biến môi trường, xem .env.example.
default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "root" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "skill_arcade" } %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
  # 3307 khớp với cổng docker-compose map ra host — tránh đụng MySQL native
  # thường chiếm sẵn 3306 trên máy dev.
  port: <%= ENV.fetch("DB_PORT") { 3307 } %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "skill_arcade_development" } %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_TEST") { "skill_arcade_test" } %>

# Production dùng Aiven for MySQL (Q10). Aiven đặt SSL ở trạng thái ENABLED và KHÔNG tắt được,
# nên bắt buộc phải khai TLS ở đây; thiếu là không kết nối được.
#
# Không dùng DATABASE_URL: service URI của Aiven bắt đầu bằng `mysql://`, mà Rails suy ra tên
# adapter từ scheme nên sẽ đi tìm adapter `mysql` (không tồn tại) thay vì `mysql2`. Dùng các biến
# DB_* rời như dưới đây thì không gặp cái bẫy đó. Muốn dùng URL thì phải tự đổi scheme thành
# `mysql2://`.
production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "skill_arcade_production" } %>
  username: <%= ENV.fetch("DB_USERNAME") { "skill_arcade" } %>
  # Không dùng ENV.fetch không default ở đây: ERB render cả file cho mọi môi trường,
  # nên thiếu biến sẽ làm hỏng cả development và test. Production thiếu mật khẩu thì
  # lỗi sẽ nổ lúc kết nối, kèm thông báo rõ ràng hơn.
  password: <%= ENV["DB_PASSWORD"] %>
  # Có file CA thì verify_identity (mã hoá + xác thực server, chống MITM). Chưa cấp được CA thì
  # tự hạ xuống required: vẫn mã hoá nhưng KHÔNG xác thực server — chấp nhận tạm, không im lặng
  # tắt TLS. Aiven cho tải CA certificate trong console của service.
  ssl_mode: <%= ENV.fetch("DB_SSL_MODE") { ENV["DB_SSL_CA"].to_s.empty? ? "required" : "verify_identity" } %>
  <%= "sslca: #{ENV['DB_SSL_CA']}" unless ENV["DB_SSL_CA"].to_s.empty? %>
